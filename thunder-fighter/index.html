    { kind:'diver',  name:'俯冲蝠', hp:20,  score:100, size:32, speed:215, coins:3,  drop:0.10, move:'dive',   fire:'none',   unlock:2 },
    { kind:'tank',   name:'装甲堡', hp:95,  score:200, size:54, speed:42,  coins:6,  drop:0.25, move:'strafe', fire:'fan',    fireEvery:2.8, unlock:3 },
    { kind:'kami',   name:'刺客',   hp:18,  score:120, size:28, speed:265, coins:4,  drop:0.10, move:'charge', fire:'none',   unlock:4 },
    { kind:'elite',  name:'执政官', hp:240, score:500, size:64, speed:72,  coins:15, drop:1.0,  move:'enter',  fire:'ring',   fireEvery:3.0, unlock:6 },
    { kind:'carrier',name:'运输舰', hp:60,  score:150, size:44, speed:105, coins:8,  drop:1.0,  move:'cross',  fire:'none',   unlock:99, carrier:true },
  ];

  // ===== Boss 原型（关卡 n 用 (n-1)%6，变体 floor((n-1)/6)%3）=====
  const BOSSES = [
    { i:0, name:'母舰 · 格里芬', hpK:1.00, w:176, pat:['spawn', 'aimfan', 'ring'] },
    { i:1, name:'堡垒 · 克利俄', hpK:1.18, w:150, pat:['rotring', 'burst', 'laser'] },
    { i:2, name:'战刃 · 阿瑞斯', hpK:1.10, w:164, pat:['sweep', 'cross', 'spiral'] },
    { i:3, name:'蜂后 · 妮克斯', hpK:1.22, w:160, pat:['spawnD', 'spiral', 'aimfan'] },
    { i:4, name:'幽灵 · 卡戎',   hpK:0.95, w:140, pat:['blink', 'cross', 'homing'] },
    { i:5, name:'天罚 · 泰坦',   hpK:1.50, w:192, pat:['omni'] },
  ];

  const POWERS = ['P','B','H','S','L','coin','part'];
  const DROP_W = { P:.30, coin:.22, H:.16, B:.10, S:.10, L:.03, part:.09 };

  // ===== 工具 =====
  function rng(seed) {
    let a = (seed >>> 0) || 1;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function pickW(table, r) {
    let sum = 0; for (const k in table) sum += table[k];
    let x = r * sum;
    for (const k in table) { x -= table[k]; if (x <= 0) return k; }
    return Object.keys(table)[0];
  }

  // ===== 关卡曲线（无限）=====
  function levelParams(n) {
    const hpK = 1 + 0.13 * (n - 1) + 0.012 * (n - 1) * (n - 1);
    const spdK = Math.min(1 + 0.025 * (n - 1), 1.7);
    const fireK = Math.min(1 + 0.03 * (n - 1), 2.0);
    const densityK = Math.min(1 + 0.06 * (n - 1), 2.2);
    const bi = (n - 1) % 6, bv = Math.floor((n - 1) / 6) % 3;
    const arch = BOSSES[bi];
    const boss = { i: bi, v: bv, name: arch.name, w: arch.w,
      hp: Math.round(900 * arch.hpK * (1 + 0.30 * (n - 1) + 0.02 * (n - 1) * (n - 1))) };
    // 波次脚本（确定性：同关重打布局一致）
    const r = rng(n * 2654435761 >>> 0 ^ 0x9e3779b9);
    const waveN = 4 + Math.min(Math.floor(n / 3), 6);
    const gap = Math.max(5.5, 8.5 - 0.1 * n);
    const pool = ENEMIES.filter(e => !e.carrier && e.unlock <= n);
    const waves = []; let t = 1.6;
    const FORMS = ['line', 'vee', 'column', 'pincer', 'sine'];
    for (let w = 0; w < waveN; w++) {
      const base = pool[Math.floor(r() * pool.length)];
      let kind = base.kind;
      if (n >= 6 && w >= 2 && r() < Math.min(0.10 + 0.02 * n, 0.35)) kind = 'elite';
      const form = FORMS[Math.floor(r() * FORMS.length)];
      const count = Math.max(3, Math.min(8, Math.round((3 + r() * 3) * (1 + 0.05 * n))));
      waves.push({ t: +t.toFixed(2), kind, x: 0.2 + r() * 0.6, form, count });
      t += gap + count * 0.22;
      if ((w + 1) % 2 === 0 && w < waveN - 1) { // 补给舰
        waves.push({ t: +t.toFixed(2), kind: 'carrier', x: 0.25 + r() * 0.5, form: 'cross', count: 1 });
        t += 3.2;
      }
    }
    return { n, hpK, spdK, fireK, densityK, boss, waves, bossAt: +t.toFixed(2), seed: (n * 2654435761 >>> 0) };
  }

  // ===== 火力弹幕（局内 P0-P4）=====
  // 返回 [{dx, ang, dmgK, kind}] kind: bullet|heavy|pierce|plasma；ang 弧度，0=正上
  function firePattern(id, p) {
    const out = [];
    const add = (dx, ang, dmgK, kind) => out.push({ dx, ang, dmgK: dmgK || 1, kind: kind || 'bullet' });
    const t = (SHIPS.find(s => s.id === id) || SHIPS[0]).type;
    if (t === 'stream') {
      if (p === 0) add(0, 0);
      else if (p === 1) { add(-9, 0); add(9, 0); }
      else if (p === 2) { add(0, 0, 1.2); add(-11, 0); add(11, 0); }
      else if (p === 3) { add(0, 0, 1.2); add(-12, 0); add(12, 0); add(-18, -.13, .6); add(18, .13, .6); }
      else { add(0, 0, 1.3); add(-10, 0); add(10, 0); add(-19, -.12, .7); add(19, .12, .7); }
    } else if (t === 'twin') {
      add(-8, -.06); add(8, .06);
      if (p >= 1) add(0, 0, .8);
      if (p >= 2) { add(-14, -.16, .6); add(14, .16, .6); }
      if (p >= 3) add(0, 0, 1);
      if (p >= 4) { add(-17, -.22, .6); add(17, .22, .6); }
    } else if (t === 'heavy') {
      add(0, 0, 1, 'heavy');
      if (p >= 1) { add(-16, -.1, .45); add(16, .1, .45); }
      if (p >= 2) add(0, 0, 1, 'heavy');
      if (p >= 3) { add(-13, 0, .6, 'heavy'); add(13, 0, .6, 'heavy'); }
      if (p >= 4) { add(-20, -.16, .5); add(20, .16, .5); }
    } else if (t === 'spread') {
      const w = .20 + p * .025;
      add(0, 0, 1.1); add(-10, -w, .7); add(10, w, .7);
      if (p >= 1) { add(-16, -w * 1.9, .6); add(16, w * 1.9, .6); }
      if (p >= 2) { add(-22, -w * 2.8, .5); add(22, w * 2.8, .5); }
      if (p >= 3) add(0, -.09, .6), add(0, .09, .6);
      if (p >= 4) { add(-26, -w * 3.6, .5); add(26, w * 3.6, .5); }
    } else if (t === 'pierce') {
      add(0, 0, 1, 'pierce');
      if (p >= 1) { add(-12, -.07, .6); add(12, .07, .6); }
      if (p >= 2) add(0, 0, .8, 'pierce');
      if (p >= 3) { add(-18, -.14, .6); add(18, .14, .6); }
      if (p >= 4) { add(-8, 0, .9, 'pierce'); add(8, 0, .9, 'pierce'); }
    } else { // nova
      add(0, 0, 1.1, 'plasma'); add(-12, -.10, .7); add(12, .10, .7);
      if (p >= 1) add(-20, -.2, .55), add(20, .2, .55);
      if (p >= 2) { add(-6, 0, .8, 'plasma'); add(6, 0, .8, 'plasma'); }
      if (p >= 3) { add(-26, -.3, .5); add(26, .3, .5); }
      if (p >= 4) { add(-14, -.14, .6, 'plasma'); add(14, .14, .6, 'plasma'); }
    }
    return out;
  }

  // ===== 数值 =====
  function starsMulHp(s) { return 1 + 0.18 * (s - 1); }
  function starsMulDmg(s) { return 1 + 0.16 * (s - 1); }
  function shipStat(id, star) {
    const s = SHIPS.find(x => x.id === id) || SHIPS[0];
    return { id: s.id, name: s.name, tag: s.tag, type: s.type, desc: s.desc,
      hp: Math.round(s.hp * starsMulHp(star)), dmg: +(s.dmg * starsMulDmg(star)).toFixed(1),
      rate: s.rate, speed: s.speed };
  }
  function wingStat(id, lv) {
    const w = WINGS.find(x => x.id === id); if (!w) return null;
    const k = 1 + 0.35 * (lv - 1);
    return { id: w.id, name: w.name, desc: w.desc, dmg: +(w.dmg * k).toFixed(1),
      rate: w.rate ? Math.round(w.rate * (1 - 0.06 * (lv - 1))) : (w.every ? +(w.every * (1 - 0.07 * (lv - 1))).toFixed(2) : 0) };
  }
  function comboMult(c) { return 1 + Math.min(c, 50) * 0.02; }
  function dropsFor(kind, rand, dropK) {
    const e = ENEMIES.find(x => x.kind === kind); if (!e) return null;
    let chance = e.drop * (dropK || 1);
    if (kind === 'elite') chance = 1;
    if (rand() >= chance) return null;
    return pickW(DROP_W, rand());
  }
  function reward(n, stars, hpPct) {
    const cm = [1, 1.15, 1.35][Math.max(0, Math.min(2, stars - 1))];
    return {
      coins: Math.round((40 + 18 * n) * cm),
      parts: 1 + Math.floor(n / 8),
      scoreBonus: 1000 * n + Math.round(hpPct * 1000) + (stars - 1) * 500,
    };
  }
  const STAR_COINS = [0, 800, 2400, 6000, 15000]; // 升到 2..5 星
  const STAR_PARTS = [0, 2, 5, 12, 30];
  function starCost(id, toStar) {
    const i = Math.max(1, Math.min(5, toStar)) - 1;
    return { coins: STAR_COINS[i], parts: STAR_PARTS[i] };
  }
  function wingCost(id, toLv) {
    const w = WINGS.find(x => x.id === id); if (!w) return null;
    if (toLv <= 1) return { coins: w.cost, parts: 0 };
    const up = w.up[Math.min(toLv - 2, w.up.length - 1)];
    return { coins: up, parts: (toLv - 1) };
  }

  // ===== 存档 =====
  const KEY = 'tf.save.v1';
  let P = null;
  function defProfile() {
    const ships = {}, wing = {};
    SHIPS.forEach(s => ships[s.id] = { own: s.cost === 0 ? 1 : 0, star: 1 });
    WINGS.forEach(w => wing[w.id] = { own: w.cost === 0 ? 1 : 0, lv: 1 });
    return { v: 1, coins: 600, parts: 2, ships, wing,
      loadout: { ship: 'A', wingL: 'gun', wingR: null },
      progress: { maxLv: 1, stars: {} },
      best: { score: 0, lv: 0 },
      board: [], stats: { runs: 0, kills: 0, score: 0, playSec: 0 } };
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      P = raw ? JSON.parse(raw) : defProfile();
    } catch (e) { P = defProfile(); }
    const d = defProfile(); // 补字段
    for (const k in d) if (P[k] === undefined) P[k] = d[k];
    for (const k in d.ships) if (!P.ships[k]) P.ships[k] = d.ships[k];
    for (const k in d.wing) if (!P.wing[k]) P.wing[k] = d.wing[k];
    return P;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
  function get() { return P || load(); }
  function addRun(r) { // {lv,score,kills,coins,parts,win,stars,hpPct,ship,sec}
    const p = get();
    p.coins += r.coins || 0; p.parts += r.parts || 0;
    p.stats.runs++; p.stats.kills += r.kills || 0;
    p.stats.score += r.score || 0; p.stats.playSec += r.sec || 0;
    if (r.win) {
      p.progress.maxLv = Math.max(p.progress.maxLv, (r.lv || 1) + 1);
      const st = p.progress.stars, k = 'l' + r.lv;
      st[k] = Math.max(st[k] || 0, r.stars || 1);
      if (r.score > p.best.score) p.best.score = r.score;
      p.best.lv = Math.max(p.best.lv, r.lv);
    }
    boardAdd({ score: r.score || 0, lv: r.lv, ship: r.ship, date: Date.now() });
    save();
  }
  function boardAdd(row) {
    const p = get();
    p.board.push(row);
    p.board.sort((a, b) => b.score - a.score);
    p.board.length = Math.min(p.board.length, 10);
  }
  function exportProf() { return JSON.stringify(get()); }
  function importProf(str) {
    const o = JSON.parse(str);
    if (!o || typeof o !== 'object' || !o.ships) throw new Error('bad profile');
    P = o; save(); return P;
  }

  // ===== 自检 =====
  function selfTest() {
    const log = []; let ok = true;
    const A = (c, m) => { if (!c) { ok = false; log.push('FAIL ' + m); } };
    for (let n = 1; n <= 60; n++) {
      const lp = levelParams(n);
      A(lp.waves.length >= 4, 'n=' + n + ' waves');
      A(lp.boss.hp > 0 && isFinite(lp.boss.hp), 'n=' + n + ' boss hp');
      A(lp.hpK >= 1, 'n=' + n + ' hpK');
      if (n > 1) A(levelParams(n).hpK >= levelParams(n - 1).hpK, 'hpK 单调');
      lp.waves.forEach(w => A(w.t > 0 && ENEMIES.some(e => e.kind === w.kind), 'wave kind ' + w.kind));
    }
    SHIPS.forEach(s => { for (let p = 0; p <= 4; p++) {
      const f = firePattern(s.id, p);
      A(Array.isArray(f) && f.length >= 1 && f.length <= 12, s.id + ' p' + p);
      f.forEach(b => A(isFinite(b.dx) && isFinite(b.ang), s.id + ' 弹幕数值'));
    }});
    const r = rng(42); let drops = 0;
    for (let i = 0; i < 2000; i++) if (dropsFor('gunner', r, 1)) drops++;
    A(drops > 100 && drops < 500, '掉落率 sane ' + drops);
    A(comboMult(50) === 2, 'combo 上限');
    const rw = reward(10, 3, 1); A(rw.coins > 0 && rw.parts >= 2, '奖励');
    return { ok, log };
  }

  return { SHIPS, WINGS, ENEMIES, BOSSES, POWERS,
    rng, levelParams, firePattern, starsMulHp, starsMulDmg,
    shipStat, wingStat, comboMult, dropsFor, reward, starCost, wingCost,
    PROFILE: { load, save, get, addRun, boardAdd, exportProf, importProf },
    selfTest };
})();


/* ==== enemy.js ==== */
/* enemy.js — 敌机 AI + Boss 弹幕 + 波次导演（弹幕游戏级手感版）
   难度标尺：新手第 1 关能过、第 10 关紧张、第 20 关靠养成。
   公平性铁律：不开屏幕外枪；入场 1s 内不开火；玩家死亡停火；Boss y ≤ H*0.35 不压出生点。 */
window.TF = window.TF || {};
TF.ENEMY = (function () {
  'use strict';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  /* ================= 敌机运动（sine/hover/dive/strafe/charge/enter + carrier 横穿） ================= */
  function move(e, dt, api) {
    e.t += dt;
    const sp = e.speed, W = api.W, H = api.H, p = api.player, rand = api.rand;
    switch (e.move) {

      case 'sine': { // 正弦俯冲：spawn 后设 e.phase 相位差 → 编队呈波浪
        e.y += sp * dt;
        e.x = e.x0 + Math.sin(e.t * 2.1 + e.phase) * Math.min(50, W * 0.12);
        e.tilt = Math.cos(e.t * 2.1 + e.phase) * 0.22;
        break;
      }

      case 'hover': { // 降到位 → 缓慢横移 + 偶发小幅换位
        if (e.ty === undefined) e.ty = 70 + rand() * 140;
        if (e.y < e.ty) { e.y += sp * dt; e.tilt = 0; break; }
        if (e.nx === undefined) { e.nx = e.x; e.reT = 2 + rand() * 2; }
        e.reT -= dt;
        if (e.reT <= 0) { e.reT = 2.8 + rand() * 2.6; e.nx = clamp(e.x + (rand() - 0.5) * 150, 36, W - 36); }
        const dx = clamp(e.nx - e.x, -1, 1);
        e.x = clamp(e.x + dx * sp * 0.5 * dt, 30, W - 30);
        e.y = e.ty + Math.sin(e.t * 1.3 + e.phase) * 7;
        e.tilt = clamp(dx * 0.18, -0.2, 0.2);
        break;
      }

      case 'dive': { // 悬停瞄准 0.35s（给玩家预判窗）→ 锁定方向加速俯冲
        if (!e.locked) {
          if (e.t < 0.35) { e.y += sp * 0.35 * dt; e.tilt = Math.sin(e.t * 28) * 0.035; }
          else {
            e.locked = true;
            const dx = p.x - e.x, dy = Math.max(40, p.y - e.y), d = Math.hypot(dx, dy) || 1;
            e.dirx = dx / d; e.diry = dy / d; e.dsp = sp * 1.35;
          }
        } else {
          e.dsp = Math.min(e.dsp + 640 * dt, sp * 2.55); // 俯冲加速
          e.x += e.dirx * e.dsp * dt; e.y += e.diry * e.dsp * dt;
          e.tilt = clamp(e.dirx * 0.4, -0.4, 0.4);
        }
        break;
      }

      case 'strafe': { // 降到位左右巡航 + 边界反弹
        if (e.ty === undefined) e.ty = 100 + rand() * 140;
        if (e.dir === undefined) e.dir = rand() < 0.5 ? -1 : 1; // 导演可预设 e.ty，dir 需独立初始化
        if (e.y < e.ty) { e.y += sp * dt; e.tilt = 0; break; }
        e.x += e.dir * sp * 1.05 * dt;
        if (e.x < 42) { e.x = 42; e.dir = 1; }
        else if (e.x > W - 42) { e.x = W - 42; e.dir = -1; }
        e.y = e.ty + Math.sin(e.t * 1.6 + e.phase) * 5;
        e.tilt = e.dir * 0.12;
        break;
      }

      case 'charge': { // 刺客：短暂停顿蓄力 → 加速撞向玩家（有限追踪，可被侧移甩开）
        if (!e.armed) {
          e.y += sp * 0.22 * dt;
          e.x += Math.sin(e.t * 34) * 9 * dt; // 蓄力微颤
          if (e.t > 0.55) {
            e.armed = true;
            const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
            e.dirx = dx / d; e.diry = dy / d; e.csp = sp * 0.85;
          }
        } else {
          e.csp = Math.min(e.csp + 880 * dt, sp * 1.25);
          if (e.t < 2.1 && !p.dead) { // 追踪有时限、转向速率有上限 → 侧移可甩开
            const want = Math.atan2(p.y - e.y, p.x - e.x);
            const cur = Math.atan2(e.diry, e.dirx);
            let d = want - cur; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
            const na = cur + clamp(d, -1.9 * dt, 1.9 * dt);
            e.dirx = Math.cos(na); e.diry = Math.sin(na);
          }
          e.x += e.dirx * e.csp * dt; e.y += e.diry * e.csp * dt;
          e.tilt = clamp(e.dirx * 0.35, -0.35, 0.35);
        }
        break;
      }

      case 'enter': { // 执政官压场型：降到中场，缓慢游走施压
        if (e.ty === undefined) e.ty = clamp(H * 0.2 + rand() * 50, 110, 250);
        if (e.y < e.ty) { e.y += sp * 0.9 * dt; e.tilt = 0; break; }
        if (e.nx === undefined) { e.nx = e.x; e.reT = 1.2 + rand(); }
        e.reT -= dt;
        if (e.reT <= 0) { e.reT = 2.6 + rand() * 2.2; e.nx = 60 + rand() * (W - 120); }
        const dx = clamp(e.nx - e.x, -1, 1);
        e.x = clamp(e.x + dx * sp * 0.6 * dt, 44, W - 44);
        e.y = e.ty + Math.sin(e.t * 1.35 + e.phase) * 20;
        e.tilt = clamp(dx * 0.26, -0.28, 0.28);
        break;
      }

      case 'cross': { // 运输舰：侧面横穿（game 越界后自动回收）
        if (e.dir === undefined) e.dir = e.x < W / 2 ? 1 : -1;
        if (e.y0 === undefined) e.y0 = e.y;
        e.x += e.dir * sp * 1.15 * dt;
        e.y = e.y0 + Math.sin(e.t * 1.9) * 12;
        e.tilt = e.dir * 0.3;
        break;
      }

      default: e.y += sp * dt;
    }
  }

  /* ================= 敌机开火（按敌型差异化 + 0.2s 蓄力白闪提示） ================= */
  function fire(e, api) {
    const dt = api.dt, p = api.player;
    if (p.dead) return;                       // 玩家死亡停火
    if (e.t < 0.9 || e.y < 26) return;        // 入场 1s 内不开火；不开屏幕外枪
    // 执政官：环弹后的周期瞄准连射段（独立于 fireT 节奏）
    if (e.salvo > 0) {
      e.salvoT -= dt;
      if (e.salvoT <= 0) {
        e.salvoT = 0.12; e.salvo--;
        const a = Math.atan2(p.y - e.y, p.x - e.x) + (api.rand() - 0.5) * 0.05;
        api.ebul(e.x, e.y + e.size * 0.32, a, 188 * api.diff.spdK, { dmg: 12, kind: 'eb3', r: 5 });
      }
    }
    e.fireT -= dt;
    if (e.fireT <= 0.2 && e.fireT > 0) { e.flash = Math.max(e.flash, 0.05); return; } // 0.2s 蓄力提示（白闪）
    if (e.fireT > 0) return;
    e.fireT = e.fireEvery * (0.85 + api.rand() * 0.3);
    const aim = Math.atan2(p.y - e.y, p.x - e.x), spdK = api.diff.spdK, muz = e.y + e.size * 0.32;
    if (e.fire === 'aimed') {                 // 哨卫：单发瞄准
      api.ebul(e.x, muz, aim + (api.rand() - 0.5) * 0.06, 178 * spdK, { dmg: 12 });
      api.sfx('shoot2', { vol: 0.15, rate: 0.85 });
    } else if (e.fire === 'fan') {            // 装甲堡：三向扇形
      api.ebulFan(e.x, muz, [aim - 0.30, aim, aim + 0.30], 148 * spdK, { dmg: 12 });
      api.sfx('shoot3', { vol: 0.13, rate: 1.15 });
    } else if (e.fire === 'ring') {           // 执政官：环形弹 + 每 3 轮接瞄准连射
      e.ringN = (e.ringN || 0) + 1;
      const n = 12, off = e.ringN * 0.31 + api.rand() * 0.5;
      for (let i = 0; i < n; i++) api.ebul(e.x, muz, off + i / n * TAU, 118 * spdK, { dmg: 12, kind: 'eb2' });
      if (e.ringN % 3 === 0) { e.salvo = 3; e.salvoT = 0.3; }
      api.sfx('shoot2', { vol: 0.22, rate: 0.7 });
    }
  }

  /* ================= 波次导演（五编队交错 + densityK 压缩 + 同屏上限节流） ================= */
  function moveOf(kind) {
    const L = TF.LOGIC;
    if (!L || !L.ENEMIES) return '';
    const d = L.ENEMIES.find(x => x.kind === kind);
    return d ? d.move : '';
  }

  const DIRECTOR = {
    build(waves) {
      const base = (waves || []).slice();
      const D = { idx: 0, clock: 0, q: [], total: base.length, unitsTotal: 0, unitsSpawned: 0, alive: new Set() };
      base.forEach(w => { D.unitsTotal += Math.max(1, (w.count | 0) || 1); });

      function enqueueWave(w, api) {
        const W = api.W, rand = api.rand, n = Math.max(1, (w.count | 0) || 1);
        if (w.kind === 'carrier' || w.form === 'cross') { // 运输舰侧面横穿
          const left = w.x < 0.5;
          D.q.push({ at: 0, kind: w.kind, x: left ? -34 : W + 34, y: 70 + rand() * 90, o: {} });
          return;
        }
        const mv = moveOf(w.kind);
        const cx = clamp(w.x || 0.5, 0.12, 0.88) * W, y0 = -36, mid = (n - 1) / 2;
        for (let i = 0; i < n; i++) {
          let x = cx, delay = 0, ph, ty;
          if (w.form === 'line') {          // 一字横排：相位差 → 波浪齐压
            x = W * (0.14 + 0.72 * (n === 1 ? 0.5 : i / (n - 1)));
            ph = i * (TAU / n); ty = 84 + (i % 4) * 30 + rand() * 12;
          } else if (w.form === 'vee') {    // 箭形：领机先入，两翼依次跟进
            const k = i - mid;
            x = clamp(cx + k * 44, 30, W - 30);
            delay = Math.abs(k) * 0.16; ty = 80 + Math.abs(k) * 26 + rand() * 10;
          } else if (w.form === 'column') { // 纵队：同 x 依次鱼贯
            x = clamp(cx + (rand() - 0.5) * 18, 30, W - 30);
            delay = i * 0.42; ty = 90 + rand() * 40;
          } else if (w.form === 'pincer') { // 钳形：中开两翼包抄
            const side = i % 2 ? 1 : -1;
            x = clamp(cx + side * (58 + Math.floor(i / 2) * 50), 26, W - 26);
            delay = Math.floor(i / 2) * 0.18; ty = 96 + Math.floor(i / 2) * 18 + rand() * 10;
          } else {                          // sine：横铺 + 依次入场（蛇形）
            x = clamp(W * (0.12 + 0.76 * (i + 0.5) / n), 30, W - 30);
            delay = i * 0.22; ph = -i * 0.75; ty = 90 + rand() * 30;
          }
          const s = { at: delay, kind: w.kind, x, y: y0, o: {}, phase: ph, ty: (mv === 'hover' || mv === 'strafe') ? ty : undefined };
          D.q.push(s);
        }
      }

      D.tick = function (dt, api) {
        for (const o of D.alive) if (o.dead) D.alive.delete(o); // 同屏存活估算
        const CAP = 14;
        const dK = (api.diff && api.diff.densityK) || 1;
        D.clock += dt / (1 + (dK - 1) * 0.28);  // 波间隔随 densityK 略压缩
        while (D.idx < base.length && base[D.idx].t <= D.clock) { enqueueWave(base[D.idx], api); D.idx++; }
        for (let i = D.q.length - 1; i >= 0; i--) {
          const s = D.q[i];
          s.at -= dt;
          if (s.at > 0) continue;
          if (D.alive.size >= CAP) { s.at = 0.45; continue; } // 上限保护：延迟入队
          D.q.splice(i, 1);
          const en = api.spawn(s.kind, s.x, s.y, s.o);
          if (en) {
            D.unitsSpawned++;
            D.alive.add(en);
            if (s.ty !== undefined) en.ty = s.ty;         // 编队高度一致性
            if (s.phase !== undefined) en.phase = s.phase; // 编队相位（波浪/蛇形）
          }
        }
      };
      D.done = () => D.idx >= base.length && D.q.length === 0;
      D.progress = () => D.unitsTotal ? clamp(D.unitsSpawned / D.unitsTotal, 0, 1) : 1;
      D.finish = () => { D.idx = base.length; D.q.length = 0; };
      return D;
    },
  };

  /* ================= Boss（6 原型 × 3 阶段 + 狂暴） =================
     节奏：atkT 基准 phase0≈2.2s → phase1≈1.75s → phase2≈1.4s，×rand(0.85~1.15)。
     弹速基准：普通 105~185×spdK；追踪≈120；重炮 burst 215。 */
  function build(lp) {
    const lb = (lp && lp.boss) || { i: 0, v: 0, name: 'Boss', w: 160, hp: 900 };
    const arch = (TF.LOGIC && TF.LOGIC.BOSSES) ? TF.LOGIC.BOSSES[lb.i] : null;
    return {
      i: lb.i | 0, v: lb.v | 0, name: lb.name, w: lb.w,
      hp: lb.hp, maxHp: lb.hp,
      x: 210, y: -110, t: 0, mode: 'enter', phase: 0,
      pat: arch ? arch.pat.slice() : ['aimfan', 'ring', 'spiral'],
      sub: 0, atkT: 2.0, flash: 0, dying: false, dieT: 0,
      // 内部状态：py 驻留高度 / mtx 横移目标 / seq 攻击序号 / em 持续发射器 / sched 待发队列
      py: 0, mtx: 210, mtT: 0, seq: 0, em: [], sched: [], lastBlink: 0,
    };
  }

  function moveBoss(b, dt, api, yMax) { // 各原型机动风格
    const W = api.W, t = b.t, margin = b.w * 0.5 + 14;
    switch (b.i) {
      case 0: b.x += (W / 2 + Math.sin(t * 0.42) * W * 0.24 - b.x) * Math.min(1, dt * 1.6); break; // 母舰缓游
      case 1: b.x += (W / 2 + Math.sin(t * 0.22) * W * 0.10 - b.x) * Math.min(1, dt * 1.2); break; // 堡垒近驻
      case 2: { // 战刃：快速横移扫场
        b.mtT -= dt;
        if (b.mtT <= 0) { b.mtT = (b.phase === 2 ? 1.0 : 1.5) + api.rand() * 0.7; b.mtx = margin + api.rand() * (W - margin * 2); }
        b.x += (b.mtx - b.x) * Math.min(1, dt * (b.phase === 2 ? 4.2 : 3.2));
        break;
      }
      case 3: b.x += (W / 2 + Math.sin(t * 0.62) * W * 0.26 - b.x) * Math.min(1, dt * 2.2); break; // 蜂后中摆
      case 4: b.x += Math.sin(t * 0.5) * 14 * dt; break;                                            // 幽灵漂移
      default: b.x += (W / 2 + Math.sin(t * 0.3) * W * 0.2 - b.x) * Math.min(1, dt * 1.1); break;   // 天罚缓压
    }
    b.x = clamp(b.x, margin, W - margin);
    b.y = b.py + Math.sin(t * (b.i === 2 ? 1.1 : b.i === 3 ? 1.3 : 0.8)) * (b.i === 1 ? 6 : 12);
    b.y = clamp(b.y, 84, Math.min(yMax, 300)); // 铁律：不压玩家出生点
  }

  function bossAttack(b, api) { // 返回本次攻击后的冷却倍率
    const p = api.player, W = api.W, H = api.H, spdK = api.diff.spdK;
    const nose = b.y + b.w * 0.30;
    const aim = () => Math.atan2(p.y - b.y, p.x - b.x);
    const B = (a, s, o) => api.ebul(b.x, nose, a, s * spdK, o);
    const mult = 1;

    switch (b.i) {

      case 0: { // 母舰·格里芬：机库开合节奏（召唤 → 扇瞄 → 环弹 三拍轮转）
        b.seq++;
        const step = b.seq % 3;
        if (step === 0) { // 开库放小怪（atkT×1.3 体现库门开合）
          const n = 2 + b.phase;
          for (let k = 0; k < n; k++) {
            const bx = clamp(b.x + (api.rand() - 0.5) * b.w * 0.7, 30, W - 30);
            b.sched.push({ at: b.t + 0.3 + k * 0.3, fn: a2 => a2.spawn('grunt', bx, b.y + 34, {}) });
          }
          api.sfx('shoot2', { vol: 0.3, rate: 0.6 });
          return 1.3;
        } else if (step === 1) { // 扇形瞄准弹
          const n = 3 + b.phase * 2, a0 = aim(), angs = [];
          for (let k = 0; k < n; k++) angs.push(a0 + (k - (n - 1) / 2) * 0.17);
          api.ebulFan(b.x, nose, angs, 165 * spdK, { dmg: 13 });
        } else { // 环弹（sub 累计旋转角）
          const n = 12 + b.phase * 3, off = b.sub * 0.31;
          for (let k = 0; k < n; k++) B(off + k / n * TAU, 112, { dmg: 12, kind: 'eb2' });
        }
        break;
      }

      case 1: { // 堡垒·克利俄：旋转环弹 + 三连快瞄准 + 蓄力激光
        b.seq++;
        const cyc = b.seq % 3;
        const rotring = dense => {
          const n = (14 + b.phase * 2) + (dense ? 4 : 0), off = b.sub * 0.33;
          for (let k = 0; k < n; k++) B(off + k / n * TAU, 108, { dmg: 12, kind: 'eb2' });
        };
        const burst3 = () => { // 三连快瞄准 burst（0.09s 间隔）
          for (let k = 0; k < 3; k++) b.sched.push({ at: b.t + k * 0.09, fn: a2 => {
            const a = Math.atan2(a2.player.y - b.y, a2.player.x - b.x) + (a2.rand() - 0.5) * 0.05;
            a2.ebul(b.x, b.y + b.w * 0.30, a, 215 * a2.diff.spdK, { dmg: 14, kind: 'eb3', r: 5.5 });
          } });
          api.sfx('shoot3', { vol: 0.3, rate: 0.9 });
        };
        const laser = () => { // 玩家 x 上方竖束（telegraph 自带预警+伤害）
          api.telegraph(clamp(p.x, 46, W - 46), H, 46, 1.15, 'beam');
          api.sfx('bosshit', { vol: 0.4, rate: 0.5 });
          return 1.3; // 激光后 extra recovery（公平节拍）
        };
        if (b.phase === 0) { if (cyc === 2) { burst3(); } else rotring(); }
        else if (b.phase === 1) {
          if (cyc === 0) rotring();
          else if (cyc === 1) { burst3(); }
          else { const m = laser(); rotring(true); return m; }
        } else {
          if (cyc === 0) rotring(true);
          else if (cyc === 1) { const m = laser(); burst3(); return m; }
          else { burst3(); rotring(true); }
        }
        break;
      }

      case 2: { // 战刃·阿瑞斯：7 向扇面（随 seq 横扫）+ 双臂螺旋（0.52 rad/拍）
        b.seq++;
        const sweep7 = wide => {
          const a0 = Math.PI / 2 + b.seq * 0.13, n = 7;
          const angs = [];
          for (let k = 0; k < n; k++) angs.push(a0 + (k - (n - 1) / 2) * (wide ? 0.18 : 0.15));
          api.ebulFan(b.x, nose, angs, 158 * spdK, { dmg: 12 });
        };
        const spiral = (dur, iv) => {
          if (b.em.length >= 2) return; // 发射器上限，防叠加过密
          b.em.push({ until: b.t + dur, iv, t: 0, k: 0, fn: (a2, m) => {
            const a = m.k * 0.52; m.k++;
            a2.ebul(b.x, b.y + b.w * 0.30, a, 138 * a2.diff.spdK, { dmg: 12, kind: 'eb2' });
            a2.ebul(b.x, b.y + b.w * 0.30, a + Math.PI, 138 * a2.diff.spdK, { dmg: 12, kind: 'eb2' });
          } });
        };
        if (b.phase === 0) sweep7();
        else if (b.phase === 1) { if (b.seq % 2) sweep7(); else spiral(1.6, 0.085); }
        else { if (b.seq % 3 === 2) spiral(2.0, 0.07); else sweep7(true); }
        break;
      }

      case 3: { // 蜂后·妮克斯：放俯冲蝠 + 双臂反向螺旋 + 瞄准扇
        b.seq++;
        const spawnD = n => {
          for (let k = 0; k < n; k++) b.sched.push({ at: b.t + k * 0.25, fn: a2 => {
            a2.spawn('diver', 40 + a2.rand() * (a2.W - 80), -30, {});
          } });
          api.sfx('shoot2', { vol: 0.26, rate: 0.65 });
          return 1.2;
        };
        const dSpiral = dur => { // 双臂反向螺旋
          if (b.em.length >= 2) return 1;
          b.em.push({ until: b.t + dur, iv: 0.09, t: 0, k: 0, fn: (a2, m) => {
            const a = m.k * 0.42; m.k++;
            a2.ebul(b.x, b.y + b.w * 0.30, a, 128 * a2.diff.spdK, { dmg: 12, kind: 'eb2' });
            a2.ebul(b.x, b.y + b.w * 0.30, -a, 128 * a2.diff.spdK, { dmg: 12, kind: 'eb2' });
          } });
          return 1;
        };
        const aimfan = () => {
          const n = 3 + b.phase * 2, a0 = aim(), angs = [];
          for (let k = 0; k < n; k++) angs.push(a0 + (k - (n - 1) / 2) * 0.16);
          api.ebulFan(b.x, nose, angs, 170 * spdK, { dmg: 13 });
          return 1;
        };
        if (b.phase === 0) return b.seq % 2 ? spawnD(2) : dSpiral(1.2);
        if (b.phase === 1) { const c = b.seq % 3; return c === 0 ? spawnD(2) : c === 1 ? dSpiral(1.6) : aimfan(); }
        const c = b.seq % 3;
        if (c === 0) { const m = spawnD(3); dSpiral(1.2); return m; }
        return c === 1 ? dSpiral(1.9) : aimfan();
      }

      case 4: { // 幽灵·卡戎：瞬移至玩家上方 + 环爆 + 追踪弹
        b.seq++;
        if (b.t - b.lastBlink > (b.phase === 2 ? 2.4 : 3.2)) { // blink
          b.lastBlink = b.t;
          b.x = clamp(p.x, 70, W - 70);
          b.flash = Math.max(b.flash, 0.12);
          const n = 12 + b.phase * 2, off = api.rand() * TAU;
          for (let k = 0; k < n; k++) B(off + k / n * TAU, 128, { dmg: 12, kind: 'eb2' });
          api.sfx('shoot2', { vol: 0.3, rate: 0.55 });
          return 1.15;
        }
        const homing = n => { // 追踪弹：homing≈1.6 rad/s，速度≈120，可绕开
          const a0 = aim();
          for (let k = 0; k < n; k++)
            B(a0 + (k - (n - 1) / 2) * 0.38, Math.min(150, 120 * (1 + (spdK - 1) * 0.35)), { dmg: 14, kind: 'eb3', r: 6, homing: 1.6, life: 6 });
          api.sfx('shoot2', { vol: 0.24, rate: 0.8 });
        };
        if (b.phase === 0) { // 环爆 / 小扇 交替
          if (b.seq % 2) { const n = 12, off = api.rand() * TAU; for (let k = 0; k < n; k++) B(off + k / n * TAU, 118, { dmg: 12, kind: 'eb2' }); }
          else { const a0 = aim(); api.ebulFan(b.x, nose, [a0 - 0.2, a0, a0 + 0.2], 165 * spdK, { dmg: 13 }); }
        } else if (b.phase === 1) {
          const c = b.seq % 3;
          if (c === 0) homing(3);
          else if (c === 1) { const n = 14, off = api.rand() * TAU; for (let k = 0; k < n; k++) B(off + k / n * TAU, 112, { dmg: 12, kind: 'eb2' }); }
          else { const a0 = aim(); api.ebulFan(b.x, nose, [a0 - 0.24, a0, a0 + 0.24], 170 * spdK, { dmg: 13 }); }
        } else homing(4);
        break;
      }

      default: { // 天罚·泰坦：全模式混合，阶段越低越密；狂暴期弹速克制
        b.seq++;
        const ring = () => { const n = 16 + b.phase * 4, off = b.sub * 0.27; for (let k = 0; k < n; k++) B(off + k / n * TAU, 108, { dmg: 12, kind: 'eb2' }); };
        const aimfan = () => { const n = 5 + b.phase * 2, a0 = aim(), angs = []; for (let k = 0; k < n; k++) angs.push(a0 + (k - (n - 1) / 2) * 0.15); api.ebulFan(b.x, nose, angs, 170 * spdK, { dmg: 13 }); };
        const sweep = () => { const a0 = Math.PI / 2 + b.seq * 0.12, angs = []; for (let k = 0; k < 7; k++) angs.push(a0 + (k - 3) * 0.16); api.ebulFan(b.x, nose, angs, 150 * spdK, { dmg: 12 }); };
        const spiral4 = () => {
          if (b.em.length >= 2) return 1;
          b.em.push({ until: b.t + 1.3, iv: 0.11, t: 0, k: 0, fn: (a2, m) => {
            const a = m.k * 0.9; m.k++;
            for (let j = 0; j < 4; j++) a2.ebul(b.x, b.y + b.w * 0.30, a + j * Math.PI / 2, 130 * a2.diff.spdK, { dmg: 12, kind: 'eb2' });
          } });
          return 1;
        };
        const laser = n2 => {
          for (let k = 0; k < n2; k++) b.sched.push({ at: b.t + k * 0.4, fn: a2 => {

    G.score += pts;
    G.coins += e.coins;
    FX().floatText(e.x, e.y - 10, '+' + pts, { color: '#ffe9c0', size: e.size > 50 ? 15 : 12 });
    const big = e.size >= 50;
    FX().explosion(e.x, e.y, big ? 1.8 : e.size >= 36 ? 1.15 : 0.8);
    shake(big ? 0.5 : 0.22);
    hitStop(big ? 0.085 : 0.04);
    vib(12);
    SFX().play(big ? 'bigdie' : e.size >= 36 ? 'die2' : 'die1', { rate: 0.94 + rnd() * 0.12 });
    if (G.combo > 0 && G.combo % 10 === 0) SFX().play('combo', { rate: 1 + Math.min(G.combo, 50) / 60 });
    // 掉落
    const r = rnd;
    if (e.kind === 'carrier') {
      const roll = r();
      spawnPower(e.x, e.y, roll < 0.4 ? 'P' : roll < 0.7 ? 'B' : roll < 0.9 ? 'H' : 'S');
    } else if (e.kind === 'elite') {
      spawnPower(e.x - 14, e.y, 'P'); spawnPower(e.x + 14, e.y, rnd() < 0.5 ? 'coin' : 'H');
    } else {
      const d = L().dropsFor(e.kind, rnd, CFG().dropK);
      if (d) spawnPower(e.x, e.y, d);
    }
  }
  function killBoss() {
    const b = G.boss;
    b.dying = true; b.dieT = 1.9;
    G.score += 3000 + 500 * G.level;
    G.tsTarget = 0.3; hitStop(0.12);
    shake(1.4); vib([50, 60, 120]);
    SFX().play('bossdie');
    SFX().stopBGM();
    G.ebullets.length = 0; G.beams.length = 0;
  }
  function bossDeathTick(dt) {
    const b = G.boss;
    b.dieT -= dt;
    if (rnd() < dt * 14) {
      const x = b.x + (rnd() - 0.5) * b.w, y = b.y + (rnd() - 0.5) * 90;
      FX().explosion(x, y, 0.7 + rnd() * 0.9);
      SFX().play('die2', { rate: 0.8 + rnd() * 0.5, vol: 0.7 });
      shake(0.3);
    }
    if (b.dieT <= 0) {
      FX().explosion(b.x, b.y, 3.2); FX().flash('#fff5e0', 0.9, 700);
      shake(1.6); hitStop(0.09);
      G.tsTarget = 1;
      // 掉落雨
      spawnPower(b.x - 30, b.y, 'part'); spawnPower(b.x + 30, b.y, 'P'); spawnPower(b.x, b.y - 20, 'H');
      for (let i = 0; i < 5; i++) spawnPower(b.x + (rnd() - 0.5) * 80, b.y + (rnd() - 0.5) * 40, 'coin');
      G.boss = null;
      G.phase = 'clear'; G.clearT = 2.0;
      SFX().play('clear');
    }
  }

  // ===== 道具 =====
  function spawnPower(x, y, kind) {
    const o = take('pw');
    o.x = clamp(x, 24, W - 24); o.y = y; o.kind = kind; o.vy = 55; o.t = rnd() * 6; o.mag = false;
    G.powers.push(o);
  }
  function applyPower(kind) {
    const p = G.player;
    SFX().play(kind === 'coin' ? 'coin' : kind === 'part' ? 'coin' : 'pu');
    if (kind === 'P') {
      if (p.power < 4) { p.power++; FX().floatText(p.x, p.y - 34, '火力提升', { color: '#ffb020', size: 14 }); }
      else { G.score += 500; FX().floatText(p.x, p.y - 34, '+500', { color: '#ffe9c0', size: 13 }); }
    } else if (kind === 'B') { if (p.bombs < 6) p.bombs++; else G.score += 300; }
    else if (kind === 'H') { p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp * 0.25)); FX().floatText(p.x, p.y - 34, '装甲修复', { color: '#7df0a0', size: 13 }); }
    else if (kind === 'S') { p.shield = 8; FX().ring(p.x, p.y, { r0: 14, r1: 44, life: 0.4, color: '#7df0ff', width: 3 }); SFX().play('shield'); }
    else if (kind === 'L') { if (p.lives < 5) p.lives++; else G.score += 800; SFX().play('life'); }
    else if (kind === 'coin') G.coins += 12;
    else if (kind === 'part') G.parts += 1;
  }

  // ===== Boss 出场 =====
  function updateBossFlow(dt) {
    if (G.boss || G.phase !== 'play') return;
    const dirDone = !G.director || G.director.done();
    const clear = G.enemies.length === 0;
    if (dirDone && clear && !G.bossPending) {
      G.bossPending = true; G.bossWarnT = 2.4;
      SFX().play('bosswarn'); vib([80, 80, 80]);
    }
    if (G.bossPending) {
      G.bossWarnT -= dt;
      if (G.bossWarnT <= 0) {
        G.bossPending = false;
        const b = EN() && EN().BOSS ? EN().BOSS.build(G.lp) : null;
        if (b) {
          const dk = CFG().diff || 1;
          b.hp = b.maxHp = Math.round(b.hp * dk);
          b.flash = 0; G.boss = b; SFX().startBGM('boss');
        }
        else { // 无行为模块：直接通关
          G.phase = 'clear'; G.clearT = 2.0;
        }
      }
    }
  }

  // ===== AI 演示 =====
  function demoControl(dt) {
    const p = G.player;
    const spd = (CFG().demoSpd || 1);
    let ax = 0, ay = 0;
    // 威胁规避
    for (const b of G.ebullets) {
      const dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy);
      if (d < 150 && d > 0.01) {
        const w = (150 - d) / 150;
        ax += dx / d * w * 260; ay += dy / d * w * 200;
      }
    }
    for (const e of G.enemies) {
      const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy);
      if (d < 90 && d > 0.01) { ax += dx / d * 120; ay += (dy / d) * 60; }
    }
    if (G.boss && !G.boss.dying) {
      const dx = p.x - G.boss.x, dy = p.y - G.boss.y, d = Math.hypot(dx, dy);
      if (d < G.boss.w * 0.55) { ax += dx / (d || 1) * 200; ay += dy / (d || 1) * 140; }
    }
    // 收道具
    let tgt = null, td = 200;
    for (const o of G.powers) {
      if (o.kind === 'coin') continue;
      const d = Math.hypot(o.x - p.x, o.y - p.y);
      if (d < td) { td = d; tgt = o; }
    }
    if (tgt && ax * ax + ay * ay < 9000) { ax += (tgt.x - p.x) * 2.4; ay += (tgt.y - p.y) * 2.4; }
    // 对准敌群
    const near = nearestEnemies(p.x, 0, 400, 1)[0];
    if (near && Math.abs(ax) < 60) ax += clamp(near.x - p.x, -90, 90) * 1.6;
    // 走位节奏
    ax += Math.sin(G.t * 1.3) * 34;
    if (Math.abs(ay) < 40) ay += Math.sin(G.t * 0.7) * 26 - 10;
    const sp = 300;
    p.tx = clamp(p.tx + clamp(ax, -sp, sp) * dt * spd, 22, W - 22);
    p.ty = clamp(p.ty + clamp(ay, -sp, sp) * dt * spd, H * 0.14, H - 60);
    // 炸弹
    G.demoBombT -= dt;
    const hpr = p.hp / p.maxHp;
    if (G.demoBombT <= 0 && p.bombs > 0 && ((hpr < 0.35) || (G.boss && hpr < 0.5))) { bomb(); G.demoBombT = 6; }
  }

  // ===== 主更新 =====
  function update(dtRaw) {
    FX().update(dtRaw);
    if (G.freeze > 0) { G.freeze -= dtRaw; return; }
    G.timeScale += (G.tsTarget - G.timeScale) * Math.min(1, dtRaw * 8);
    const dt = dtRaw * G.timeScale;
    if (!G.on || G.paused || G.phase === 'over') return;
    G.t += dt;
    const p = G.player, lp = G.lp, cfg = CFG();

    // --- 玩家 ---
    if (p.dead) {
      p.respawnT -= dt;
      if (p.respawnT <= 0 && p.lives >= 0) respawn();
    } else {
      keyboardMove(p, dt);
      if (G.demo) demoControl(dt);
      const ox = p.x;
      p.x += (p.tx - p.x) * Math.min(1, dt * 14);
      p.y += (p.ty - p.y) * Math.min(1, dt * 14);
      p.tilt += (clamp((p.x - ox) / Math.max(dt, 0.001) / 1200, -0.3, 0.3) - p.tilt) * Math.min(1, dt * 10);
      p.inv = Math.max(0, p.inv - dt);
      p.shield = Math.max(0, p.shield - dt);
      firePlayer(p, dt);
      fireWings(p, dt);
      if (rnd() < dt * 40) FX().trail(p.x + (rnd() - 0.5) * 6, p.y + 24, { color: '#35e0c8' });
      if (p.shield > 0 && rnd() < dt * 20) FX().trail(p.x + (rnd() - 0.5) * 40, p.y + (rnd() - 0.5) * 50, { color: '#7df0ff' });
    }

    // --- 连击窗口 ---
    if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }

    // --- 波次导演 ---
    if (G.phase === 'play' && G.director && !G.director.done()) {
      G.director.tick(dt, makeApi(dt));
    }
    updateBossFlow(dt);
    if (G.phase === 'clear') {
      G.clearT -= dt;
      if (G.clearT <= 0 && !G.ended) { G.ended = true; settleRun(true); TF.UI && TF.UI.showSettle && TF.UI.showSettle(settleData(true)); }
    }

    // --- Boss ---
    if (G.boss) {
      const b = G.boss;
      if (b.dying) bossDeathTick(dt);
      else if (EN() && EN().BOSS) EN().BOSS.tick(b, dt, makeApi(dt));
    }

    // --- 敌机行为 ---
    for (let i = G.enemies.length - 1; i >= 0; i--) {
      const e = G.enemies[i];
      if (e.dead) { G.enemies.splice(i, 1); back('en', e); continue; }
      if (EN()) { EN().move(e, dt, makeApi(dt)); if (e.fire !== 'none') EN().fire(e, makeApi(dt)); }
      e.flash = Math.max(0, (e.flash || 0) - dt);
      e.kx = (e.kx || 0) * (1 - Math.min(1, dt * 8));
      if (e.y > H + 60 || e.x < -80 || e.x > W + 80) { e.dead = true; continue; }
      // 撞机
      if (!p.dead && p.inv <= 0 && Math.hypot(e.x - p.x, e.y - p.y) < e.size * 0.5 + 10) {
        playerHit(e.kind === 'elite' ? 26 : 20);
        if (e.kind !== 'elite') damageEnemy(e, 9999, false);
      }
    }

    // --- 玩家子弹 ---
    for (let i = G.bullets.length - 1; i >= 0; i--) {
      const b = G.bullets[i];
      b.t += dt;
      if (b.homing) {
        const t = nearestEnemies(b.x, b.y, 420, 1)[0];
        if (t) {
          const want = Math.atan2(t.y - b.y, t.x - b.x);
          const cur = Math.atan2(b.vy, b.vx);
          let d = want - cur; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
          const na = cur + clamp(d, -b.homing * dt, b.homing * dt);
          const sp = Math.min(560, Math.hypot(b.vx, b.vy) + 620 * dt);
          b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
        }
      }
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.kind === 'missile' && rnd() < dt * 30) FX().trail(b.x, b.y, { color: '#ffb060' });
      let dead = b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30 || b.t > (b.life || 4);
      if (!dead) {
        // vs 敌机
        for (const e of G.enemies) {
          if (e.dead) continue;
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.size * 0.46 + b.r) {
            damageEnemy(e, b.dmg, b.kind !== 'bullet');
            FX().burst(b.x, b.y - 4, { kind: 'spark', n: 3, color: '#ffe9c0', spd: 120, size: 3, life: 0.2 });
            b.hits++;
            if (b.hits >= b.maxHits) dead = true;
            break;
          }
        }
        // vs Boss
        if (!dead && G.boss && !G.boss.dying) {
          const bo = G.boss;
          if (Math.abs(b.x - bo.x) < bo.w * 0.44 && Math.abs(b.y - bo.y) < 52) {
            damageBoss(b.dmg);
            FX().burst(b.x, b.y, { kind: 'spark', n: 3, color: '#ffd0a0', spd: 130, size: 3, life: 0.22 });
            SFX().play('bosshit', { vol: 0.25, rate: 0.9 + rnd() * 0.2 });
            dead = true;
          }
        }
      }
      if (dead) { G.bullets.splice(i, 1); back('pb', b); }
    }

    // --- 敌弹 ---
    const pbul = p.dead ? 0 : 1;
    for (let i = G.ebullets.length - 1; i >= 0; i--) {
      const b = G.ebullets[i];
      b.t += dt;
      if (b.homing) {
        const want = Math.atan2(p.y - b.y, p.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        let d = want - cur; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
        const na = cur + clamp(d, -b.homing * dt, b.homing * dt);
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -40 || b.x > W + 40 || b.y < -60 || b.y > H + 40) { G.ebullets.splice(i, 1); back('eb', b); continue; }
      if (pbul) {
        const d = Math.hypot(b.x - p.x, b.y - p.y);
        if (p.inv <= 0 && !G.god && d < b.r + 7) {
          if (p.shield > 0) {
            FX().burst(b.x, b.y, { kind: 'star', n: 4, color: '#7df0ff', spd: 90, size: 3, life: 0.25 });
            G.ebullets.splice(i, 1); back('eb', b); SFX().play('graze', { rate: 0.6 }); continue;
          }
          G.ebullets.splice(i, 1); back('eb', b);
          playerHit(b.dmg); continue;
        }
        if (!b.grazed && d < b.r + 26 && p.inv <= 0) {
          b.grazed = true; G.grazeN++; G.score += 5;
          FX().burst(p.x + (b.x - p.x) * 0.4, p.y + (b.y - p.y) * 0.4, { kind: 'star', n: 2, color: '#e8fffa', spd: 70, size: 3, life: 0.2 });
          SFX().play('graze', { vol: 0.4 });
        }
      }
    }

    // --- 道具 ---
    for (let i = G.powers.length - 1; i >= 0; i--) {
      const o = G.powers[i];
      o.t += dt; o.y += o.vy * dt;
      const dx = p.x - o.x, dy = p.y - o.y, d = Math.hypot(dx, dy) || 1;
      const magR = p.shield > 0 ? 160 : 90;
      if (!p.dead && d < magR) { o.x += dx / d * 340 * dt; o.y += dy / d * 340 * dt; }
      else o.x += Math.sin(o.t * 2) * 14 * dt;
      if (!p.dead && d < 22) { applyPower(o.kind); FX().burst(o.x, o.y, { kind: 'star', n: 6, color: '#ffe9c0', spd: 100, size: 4, life: 0.3 }); G.powers.splice(i, 1); back('pw', o); continue; }
      if (o.y > H + 30) { G.powers.splice(i, 1); back('pw', o); }
    }

    // --- 光束/电弧残留 ---
    for (let i = G.beams.length - 1; i >= 0; i--) {
      const bm = G.beams[i]; bm.t += dt;
      if (bm.t > bm.dur) { G.beams.splice(i, 1); continue; }
      if (!p.dead && bm.hot && bm.t > bm.hotAt && bm.t < bm.hotAt + 0.2 && Math.abs(p.x - bm.x) < bm.w / 2 + 6 && p.y < bm.y) playerHit(24);
    }
    for (let i = G.zaps.length - 1; i >= 0; i--) { G.zaps[i].t -= dt; if (G.zaps[i].t <= 0) G.zaps.splice(i, 1); }
  }

  function settleRun(win) {
    const p = G.player;
    const stars = !win ? 0 : G.deaths === 0 && !G.revived ? (p.hp / p.maxHp > 0.6 ? 3 : 2) : 1;
    const rw = win ? L().reward(G.level, stars, p.hp / p.maxHp) : { coins: Math.round(G.coins * 0.5), parts: 0, scoreBonus: 0 };
    G.result = {
      win, stars, lv: G.level, score: G.score + (win ? rw.scoreBonus : 0),
      kills: G.kills, maxCombo: G.maxCombo, graze: G.grazeN,
      hpPct: p.hp / p.maxHp, coins: Math.round(G.coins + rw.coins), parts: G.parts + rw.parts,
      ship: p.ship.id, sec: Math.round(G.t), revived: G.revived,
      rewardCoins: rw.coins, rewardParts: rw.parts, scoreBonus: rw.scoreBonus,
      reviveCost: 300 + 200 * G.level,
    };
    L().PROFILE.addRun({ lv: G.level, score: G.result.score, kills: G.kills,
      coins: G.result.coins, parts: G.result.parts, win, stars, ship: p.ship.id, sec: G.result.sec });
    SFX().stopBGM();
    G.on = false;
  }
  function settleData() { return G.result; }

  // ===== 敌方 api（给 enemy 模块）=====
  let _api = null;
  function makeApi(dt) {
    const p = G.player, lp = G.lp, cfg = CFG();
    _api = _api || {};
    _api.W = W; _api.H = H; _api.dt = dt; _api.t = G.t;
    _api.player = { x: p.x, y: p.y, dead: p.dead };
    _api.rand = rnd;
    _api.diff = { hpK: lp.hpK * cfg.diff, spdK: lp.spdK, fireK: lp.fireK, densityK: lp.densityK };
    _api.spawn = (kind, x, y, o) => spawnEnemy(kind, x, y, o);
    _api.ebul = (x, y, ang, spd, o) => ebul(x, y, ang, spd, o);
    _api.ebulFan = (x, y, angs, spd, o) => { for (const a of angs) ebul(x, y, a, spd, o); };
    _api.telegraph = (x, y, w, dur, kind) => G.beams.push({ x, y, w, dur, t: 0, kind: kind || 'beam', hotAt: dur * 0.6, hot: true });
    _api.spawnPower = (x, y) => spawnPower(x, y, ['P', 'H', 'coin'][Math.floor(rnd() * 3)]);
    _api.sfx = (n, o) => SFX().play(n, o);
    _api.boss = G.boss;
    return _api;
  }
  function spawnEnemy(kind, x, y, o) {
    const def = L().ENEMIES.find(e => e.kind === kind); if (!def) return null;
    const e = take('en');
    const hpK = G.lp.hpK * CFG().diff;
    e.kind = kind; e.def = def;
    e.x = x; e.y = y !== undefined ? y : -40;
    e.x0 = e.x;
    e.hp = e.maxHp = Math.round(def.hp * hpK);
    e.size = def.size; e.score = def.score; e.coins = def.coins;
    e.speed = def.speed * G.lp.spdK;
    e.move = def.move; e.fire = def.fire; e.fireEvery = (def.fireEvery || 2) / Math.max(1, G.lp.fireK);
    e.fireT = 0.6 + rnd() * 1.2; e.t = 0; e.phase = rnd() * TAU;
    e.flash = 0; e.kx = 0; e.dead = false;
    e.o = o || {};
    G.enemies.push(e);
    return e;
  }
  function ebul(x, y, ang, spd, o) {
    if (G.ebullets.length > 340) return;
    o = o || {};
    const b = take('eb');
    b.x = x; b.y = y;
    b.vx = Math.cos(ang) * spd; b.vy = Math.sin(ang) * spd;
    b.r = o.r || 5; b.dmg = o.dmg || 14;
    b.kind = o.kind || 'eb'; b.homing = o.homing || 0;
    b.t = 0; b.grazed = false; b.life = o.life || 9;
    G.ebullets.push(b);
    return b;
  }

  // ===== 渲染 =====
  let lowHpVg = null;
  function render() {
    const c = ctx();
    const dpr = view.dpr, fit = view.fit;
    c.setTransform(dpr * fit, 0, 0, dpr * fit, 0, 0);
    // 背景
    c.fillStyle = '#05070d'; c.fillRect(0, 0, W, H);
    for (const l of bgLayers) {
      l.y = (l.y + l.spd / 60) % 256;
      if (l.big) { c.drawImage(l.c, 0, (l.y - 256) % 900, 420, 900); c.drawImage(l.c, 0, (l.y - 256) % 900 + 900, 420, 900); }
      else for (let y = l.y - 256; y < H; y += 256) for (let x = 0; x < W; x += 256) c.drawImage(l.c, x, y);
    }
    // 世界（含震屏）
    const off = FX().camOffset ? FX().camOffset() : { x: 0, y: 0 };
    c.save(); c.translate(off.x, off.y);

    // 光束预警
    for (const bm of G.beams) {
      const warn = bm.t < bm.hotAt;
      c.fillStyle = warn ? `rgba(255,90,60,${0.10 + 0.08 * Math.sin(bm.t * 20)})` : 'rgba(255,220,180,.85)';
      c.fillRect(bm.x - bm.w / 2, 0, bm.w, bm.y);
      if (!warn) { c.fillStyle = '#fff'; c.fillRect(bm.x - bm.w / 8, 0, bm.w / 4, bm.y); }
    }

    // 道具
    for (const o of G.powers) drawSprite(c, 'pw' + o.kind, (TF.ART && TF.ART.power ? TF.ART.power(o.kind) : null), o.x, o.y, 22, 22, Math.sin(o.t * 3) * 0.2, 0);

    // 敌机
    for (const e of G.enemies) {
      const key = 'en' + e.kind;
      drawSprite(c, key, TF.ART && TF.ART.enemy ? TF.ART.enemy(e.kind) : null,
        e.x + e.kx, e.y, e.size, e.size * (e.kind === 'kami' ? 1.3 : 1), e.tilt || 0, e.flash || 0);
    }

    // Boss
    if (G.boss) {
      const b = G.boss;
      drawSprite(c, 'boss' + b.i + '_' + b.v, TF.ART && TF.ART.boss ? TF.ART.boss(b.i, b.v) : null,
        b.x, b.y, b.w, b.w * 1.2, 0, b.flash || 0);
    }

        const fl = 14 + Math.sin(G.t * 40) * 5;
        c.beginPath(); c.moveTo(p.x - 4, p.y + 20); c.lineTo(p.x + 4, p.y + 20); c.lineTo(p.x, p.y + 20 + fl); c.closePath(); c.fill();
        drawSprite(c, 'ship' + p.ship.id, TF.ART && TF.ART.ship ? TF.ART.ship(p.ship.id) : null, p.x, p.y, 44, 54, p.tilt, 0);
        ['wl', 'wr'].forEach(k => {
          const wg = p[k]; if (!wg) return;
          drawSprite(c, 'wg' + wg.id, TF.ART && TF.ART.wing ? TF.ART.wing(wg.id) : null, wg.x, wg.y, 22, 22, 0, 0);
        });
        if (p.shield > 0) {
          c.strokeStyle = `rgba(125,240,255,${0.5 + 0.3 * Math.sin(G.t * 6)})`;
          c.lineWidth = 2;

      const s = b.kind === 'heavy' ? SPR.ph : b.kind === 'pierce' ? SPR.pp : b.kind === 'plasma' ? SPR.pp : b.kind === 'missile' ? SPR.ph : SPR.pb;
      if (b.kind === 'bullet' || b.kind === 'missile') {
        c.save(); c.translate(b.x, b.y); c.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
        c.drawImage(s, -s.width / 2 / 2, -s.height / 2 / 2, s.width / 2, s.height / 2);
        c.restore();
      } else c.drawImage(s, b.x - s.width / 4, b.y - s.height / 4, s.width / 2, s.height / 2);
    }
    // 敌弹
    for (const b of G.ebullets) {
      const s = b.kind === 'eb2' ? SPR.eb2 : b.kind === 'eb3' ? SPR.eb3 : SPR.eb;
      c.drawImage(s, b.x - s.width / 4, b.y - s.height / 4, s.width / 2, s.height / 2);
    }
    c.globalCompositeOperation = 'source-over';

    // 电弧
    for (const z of G.zaps) {
      c.strokeStyle = `rgba(160,240,255,${z.t / z.max})`;
      c.lineWidth = 2;
      c.beginPath();
      for (let i = 0; i < z.pts.length - 1; i++) {
        const [x1, y1] = z.pts[i], [x2, y2] = z.pts[i + 1];
        c.moveTo(x1, y1);
        c.lineTo((x1 + x2) / 2 + (rnd() - 0.5) * 10, (y1 + y2) / 2 + (rnd() - 0.5) * 10);
        c.lineTo(x2, y2);
      }
      c.stroke();
    }

    // Boss 预警
    if (G.bossPending) {
      const a = 0.5 + 0.5 * Math.sin(G.t * 12);
      c.fillStyle = `rgba(255,60,40,${0.08 + a * 0.07})`;
      c.fillRect(0, H * 0.32, W, 64);
      c.fillStyle = `rgba(255,90,60,${0.6 + a * 0.4})`;
      c.font = '800 30px ' + 'ui-monospace,Menlo,monospace';
      c.textAlign = 'center';
      c.fillText('W A R N I N G', W / 2, H * 0.32 + 42);
      c.font = '700 12px ' + 'ui-monospace,Menlo,monospace';
      c.fillStyle = 'rgba(255,176,160,.9)';
      c.fillText('⚠ 侦测到大型敌舰接近', W / 2, H * 0.32 + 60);
      c.textAlign = 'left';
    }

    // 特效（世界层）
    FX().render(c, 'world');
    c.restore();

    // 低血晕影

      if (!lowHpVg) {

        const x = lowHpVg.getContext('2d');

        g.addColorStop(0, 'rgba(255,30,10,0)'); g.addColorStop(1, 'rgba(255,30,10,.5)');
        x.fillStyle = g; x.fillRect(0, 0, 210, 450);
      }

      c.drawImage(lowHpVg, 0, 0, W, H);
      c.globalAlpha = 1;
    }
    // 特效（屏幕层）
    FX().render(c, 'screen');
  }

  // ===== 循环（rAF + setInterval 双驱动，防遮挡/无头节流冻结）=====
  let _raf = 0, _last = 0, _iv = 0;
  function tick(now) {
    const dt = Math.min(0.05, (now - _last) / 1000 || 0.016);
    _last = now;
    const fc0 = performance.now();
    try { update(dt); render(); } catch (err) {
      if (window.__errs) window.__errs.push('game:' + err.message);
    }
    G.frameCost = G.frameCost ? G.frameCost * 0.95 + (performance.now() - fc0) * 0.05 : (performance.now() - fc0);
    if (TF.UI && TF.UI.hudTick) TF.UI.hudTick(G);
  }
  function frame(now) {
    _raf = requestAnimationFrame(frame);
    tick(now);
  }
  function startLoop() {
    if (_raf) return;
    _last = performance.now();

    _iv = setInterval(() => { // rAF 被节流时补步进（细分防穿隧）
      if (document.hidden) return;
      const now = performance.now();
      const gap = now - _last;
      if (gap > 180) {
        const steps = Math.min(4, Math.ceil(gap / 50));
        for (let i = 0; i < steps; i++) tick(_last + gap / steps * (i + 1));
      }
    }, 120);
  }
  function pause() { if (G.on) G.paused = true; }
  function resume() { G.paused = false; _last = performance.now(); }
  function stop() {
    G.on = false; G.paused = false;

  }

  document.addEventListener('visibilitychange', () => {

  // ===== 复活（每局一次，币）=====
  function revive() {
    if (!G.result || G.result.revived || G.phase !== 'over') return false;
    const cost = G.result.reviveCost;

    p.x = p.tx = W / 2; p.y = p.ty = H - 130; p.inv = 3.5; p.power = Math.max(1, p.power);
    G.ebullets.length = 0; G.enemies.forEach(e => { if (e.kind !== 'elite') e.dead = true; });
    SFX().startBGM(G.boss ? 'boss' : 'battle');
    return true;
  }

  // ===== 导出 =====
  return {
    start, pause, resume, stop, bomb, resize, revive, startLoop, bindInput,
    get state() { return G; },
    setDemo(v) { G.demo = v; },
    setGod(v) { G.god = v; },
    addCoin(v) { G.coins += v; },
    forceBoss() { // 调试：跳过波次直达 Boss
      if (G.director && G.director.finish) G.director.finish();
      G.enemies.forEach(e => e.dead = true);
    },
    setPower(v) { if (G.player) G.player.power = clamp(v, 0, 4); },
    _kill() { const p = G.player; if (p && !p.dead) { p.inv = 0; p.shield = 0; playerHit(99999); } },
    W, get H() { return H; },
  };
})();

  function showSettle(r) {
    _result = r;
    $('stl-tt').textContent = `第 ${r.lv} 关 · 攻略完成`;
    const stars = $('stl-stars');
    stars.innerHTML = '<i></i><i></i><i></i>';
    for (let i = 0; i < r.stars; i++) setTimeout(() => { const el = stars.children[i]; if (el) el.classList.add('on'); SFX().play('combo', { rate: 1.2 + i * 0.2 }); }, 250 + i * 380);
    $('stl-rows').innerHTML = row('得分', fmt(r.score), 'big') +
      row(`通关奖励`, `+${fmt(r.scoreBonus)}`) +
      row('最高连击', '×' + r.maxCombo) +
      row('击坠', fmt(r.kills) + ' · 擦弹 ' + r.graze) +
      row('金币', `+${fmt(r.coins)} ⛁`, 'gain') +
      row('部件', `+${r.parts} ◆`, 'gain');
    $('stl-next').textContent = `下一关（第 ${r.lv + 1} 关）`;
    $('dlg-settle').classList.add('on');
  }
  function showOver(r) {
    _result = r;
    $('ov-rows').innerHTML = row('得分', fmt(r.score), 'big') +
      row('击坠', fmt(r.kills)) +
      row('金币回收', `+${fmt(r.coins)} ⛁`, 'gain');
    const p = L().PROFILE.get();
    const can = !r.revived && p.coins >= r.reviveCost;
    $('ov-revive').textContent = can ? `满血复活（⛁${fmt(r.reviveCost)}）` : (r.revived ? '已复活过' : '金币不足，无法复活');
    $('ov-revive').disabled = !can;
    $('dlg-over').classList.add('on');
    if (TF.GAME && TF.GAME.state) TF.GAME.state.demo = false;
    $('demo-badge').classList.remove('on');
  }
  const row = (k, v, cls) => `<div class="stl-row ${cls || ''}"><span>${k}</span><b class="${cls === 'gain' ? 'gain' : ''}">${v}</b></div>`;

  function showBoard() {
    const p = L().PROFILE.get();
    const box = $('board-list');
    if (!p.board.length) box.innerHTML = '<div class="board-empty">尚无战绩 · 出击开创纪录</div>';
    else box.innerHTML = p.board.map((r, i) =>
      `<div class="board-row ${i === 0 ? 'top' : ''}"><span class="rk">#${i + 1}</span><span class="sc">${fmt(r.score)}</span><span class="lv">第${r.lv}关</span><span class="dt">${new Date(r.date).getMonth() + 1}/${new Date(r.date).getDate()}</span></div>`).join('');
    $('dlg-board').classList.add('on');
  }

  // ===== 事件绑定 =====
  function initIcons() {
    const pairs = [['btn-pause', 'pause'], ['bomb-ic', 'bomb'], ['hg-back', 'back'], ['lv-back', 'back'],
      ['hg-prev', 'prev'], ['hg-next', 'next'], ['hg-coin-ic', 'coin'], ['hg-part-ic', 'part'], ['lv-coin-ic', 'coin']];
    pairs.forEach(([id, name]) => {
      const el = $(id); if (!el) return;
      let uri = null;
      try { uri = TF.ART && TF.ART.icon ? TF.ART.icon(name) : null; } catch (e) {}
      if (uri) el.src = uri;
    });
    if (!$('btn-pause').firstChild) $('btn-pause').innerHTML = ic('pause');
  }
  function bind() {
    initIcons();
    $('btn-start').addEventListener('click', () => startRun(L().PROFILE.get().progress.maxLv));
    $('btn-hangar').addEventListener('click', () => show('hangar'));
    $('btn-levels').addEventListener('click', () => show('levels'));
    $('btn-board').addEventListener('click', showBoard);
    $('btn-settings').addEventListener('click', () => TF.CFG && TF.CFG.openPanel && TF.CFG.openPanel());
    $('bd-close').addEventListener('click', () => $('dlg-board').classList.remove('on'));
    $('wg-close').addEventListener('click', () => $('dlg-wing').classList.remove('on'));
    $('hg-back').addEventListener('click', () => show('title'));
    $('lv-back').addEventListener('click', () => show('title'));
    $('hg-prev').addEventListener('click', () => { hi = (hi + L().SHIPS.length - 1) % L().SHIPS.length; SFX().play('ui'); renderHangar(); });
    $('hg-next').addEventListener('click', () => { hi = (hi + 1) % L().SHIPS.length; SFX().play('ui'); renderHangar(); });
    $('hg-buy').addEventListener('click', buyShip);
    $('hg-up').addEventListener('click', upShip);
    $('hg-equip').addEventListener('click', equipShip);
    $('wg-slotL').addEventListener('click', () => openWing('wingL'));
    $('wg-slotR').addEventListener('click', () => openWing('wingR'));
    $('btn-pause').addEventListener('click', togglePause);
    $('btn-bomb').addEventListener('click', () => GAME().bomb());
    $('pa-resume').addEventListener('click', togglePause);
    $('pa-retry').addEventListener('click', () => { $('dlg-pause').classList.remove('on'); GAME().start(TF.GAME.state.level); });
    $('pa-cfg').addEventListener('click', () => TF.CFG && TF.CFG.openPanel && TF.CFG.openPanel());
    $('pa-home').addEventListener('click', () => { $('dlg-pause').classList.remove('on'); GAME().stop(); show('levels'); });
    $('stl-next').addEventListener('click', () => { $('dlg-settle').classList.remove('on'); startRun(_result.lv + 1); });
    $('stl-retry').addEventListener('click', () => { $('dlg-settle').classList.remove('on'); startRun(_result.lv); });
    $('stl-home').addEventListener('click', () => { $('dlg-settle').classList.remove('on'); show('levels'); });
    $('ov-revive').addEventListener('click', () => {
      if (GAME().revive()) { $('dlg-over').classList.remove('on'); toast('已重返战场 · 护航无敌 3.5s'); }
      else toast('复活失败：金币不足');
    });
    $('ov-home').addEventListener('click', () => { $('dlg-over').classList.remove('on'); show('levels'); });
    document.addEventListener('pointerdown', function unlockOnce() {
      SFX().unlock(); SFX().setVol && (function () {
        try { const c = TF.CFG ? TF.CFG.all() : {}; SFX().setVol(c.bgmVol, c.sfxVol); } catch (e) {}
      })();
      document.removeEventListener('pointerdown', unlockOnce);
    });
  }

  let _demo = false;
  function setDemo(v) { _demo = v; }

  return { show, toast, hudTick, bind, togglePause, autoPaused, showSettle, showOver, setDemo, get screen() { return cur; } };
})();


/* ==== main.js ==== */
/* main.js — 启动接线：存档加载/URL参数/调试钩子/演示循环 */
window.TF = window.TF || {};
TF.main = (function () {
  'use strict';
  const $ = id => document.getElementById(id);

  function q(k) {
    const m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  function boot() {
    TF.LOGIC.PROFILE.load();
    try { if (TF.CFG && TF.CFG.all) TF.CFG.all(); } catch (e) {}

    TF.UI.bind();
    TF.GAME.bindInput();
    TF.GAME.resize();
    TF.GAME.startLoop();

    // 配置实时生效
    try {
      if (TF.CFG && TF.CFG.onChange) TF.CFG.onChange(function (cfg) {
        if (TF.SFX && TF.SFX.setVol) TF.SFX.setVol(cfg.bgmVol, cfg.sfxVol);
      });
    } catch (e) {}

    // URL 参数
    if (q('muted') && TF.SFX && TF.SFX.muted) TF.SFX.muted(true);
    if (q('god')) TF.GAME.setGod(true);
    const demo = q('demo');
    if (demo) { TF.GAME.setDemo(true); TF.UI.setDemo(true); }

    const lv = parseInt(q('level') || '', 10);
    const bootTo = q('boot');
    if (lv >= 1) {
      TF.UI.show('game');
      TF.GAME.start(lv);
    } else if (bootTo === 'hangar' || bootTo === 'levels') {
      TF.UI.show(bootTo);
    } else {
      TF.UI.show('title');
    }

    // 演示模式自动续局
    setInterval(function () {
      if (!TF.GAME.state.demo) return;
      const G = TF.GAME.state;
      if (G.paused) return;
      if (!G.on && G.result) {
        if (!G._demoNextAt) G._demoNextAt = Date.now() + (G.phase === 'over' ? 6000 : 4500);
        else if (Date.now() > G._demoNextAt) {
          G._demoNextAt = 0;
          TF.GAME.start(G.phase === 'over' ? G.level : G.level + 1);
          document.querySelectorAll('.dlg.on').forEach(d => d.classList.remove('on'));
        }
      }
    }, 800);

    // 调试钩子
    window.__tf = {
      v: '1.0',
      get state() { return TF.GAME.state; },
      get profile() { return TF.LOGIC.PROFILE.get(); },
      get cfg() { return TF.CFG ? TF.CFG.all() : null; },
      start: function (n) { TF.UI.show('game'); TF.GAME.start(n || 1); },
      boss: function () { TF.GAME.forceBoss(); },
      power: function (v) { TF.GAME.setPower(v); },
      selfTest: function () { return TF.LOGIC.selfTest(); },
    };

    // 版本水印
    console.log('%c雷霆战机 TF-01', 'color:#35e0c8;font-weight:bold', '单文件 · 程序化资产');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return { boot };
})();

</script>
