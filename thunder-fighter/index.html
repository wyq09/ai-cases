<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070d">
<title>雷霆战机 · 银河防线</title>
<style>/* thunder-fighter 军事科幻 HUD 视觉 */
:root{
  --bg:#05070d; --bg2:#0a101a; --panel:#0b0f14; --line:#263241; --line2:#182230;
  --txt:#cfd8dc; --dim:#7d8a96; --faint:#46525e;
  --acc:#35e0c8; --acc-dim:#1d8a7c; --dgr:#ff5a3c; --amb:#ffb020; --gold:#ffd050;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#000;font-family:var(--sans);color:var(--txt);
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
img{display:block;-webkit-user-drag:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;background:var(--bg);overflow:hidden}

/* ===== 屏幕基底 ===== */
.scr{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.scr.on{display:flex}
.stars{position:absolute;inset:-50% 0;background-image:
  radial-gradient(1px 1px at 22px 44px,rgba(255,255,255,.5) 50%,transparent 51%),
  radial-gradient(1px 1px at 120px 190px,rgba(160,220,255,.35) 50%,transparent 51%),
  radial-gradient(2px 2px at 260px 90px,rgba(255,255,255,.22) 50%,transparent 51%);
  background-size:320px 260px;animation:stf 26s linear infinite;pointer-events:none}
.stars-b{background-size:180px 150px;background-image:
  radial-gradient(1px 1px at 60px 30px,rgba(255,255,255,.28) 50%,transparent 51%),
  radial-gradient(1px 1px at 150px 110px,rgba(120,200,230,.2) 50%,transparent 51%);
  animation-duration:14s;opacity:.7}
@keyframes stf{to{transform:translateY(260px)}}

/* ===== 通用控件 ===== */
.btn{display:block;padding:13px 20px;border:1px solid var(--line);color:var(--txt);
  font:600 15px/1 var(--sans);letter-spacing:.14em;text-align:center;background:rgba(15,22,32,.72);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  transition:background .15s,border-color .15s}
.btn:active{background:rgba(53,224,200,.14);border-color:var(--acc-dim)}
.btn-pri{background:var(--acc);border-color:var(--acc);color:#032a24;font-weight:800}
.btn-pri:active{background:#5ce9d5}
.btn[disabled]{opacity:.38;pointer-events:none}
.icon-btn{width:42px;height:42px;border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;background:rgba(15,22,32,.72)}
.icon-btn img,.icon-btn svg{width:20px;height:20px}
.tag{font:700 11px/1 var(--mono);letter-spacing:.12em;color:var(--acc);border:1px solid var(--acc-dim);
  padding:4px 7px}
.mono{font-family:var(--mono)}
.bar{position:relative;z-index:2;display:flex;align-items:center;gap:12px;flex:none;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(13,19,28,.9),rgba(10,16,26,.65))}
.bar-tt{font:800 17px/1 var(--sans);letter-spacing:.3em}
.bar-res{margin-left:auto;display:flex;gap:14px}
.res{display:flex;align-items:center;gap:6px;font:700 15px/1 var(--mono);color:var(--gold)}
.res img{width:18px;height:18px}

/* ===== 标题屏 ===== */
#scr-title{align-items:center;justify-content:center}
.tt-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:0;padding:24px;width:min(420px,100%)}
#title-emblem{width:132px;height:132px;image-rendering:auto;
  filter:drop-shadow(0 6px 18px rgba(53,224,200,.25))}
.tt-logo{margin-top:14px;font-size:clamp(44px,12vw,58px);font-weight:900;letter-spacing:.18em;
  color:#eef4f6;text-shadow:0 2px 0 #0e2a26,0 0 26px rgba(53,224,200,.18);text-indent:.18em}
.tt-sub{margin-top:8px;font:500 11px/1 var(--mono);letter-spacing:.42em;color:var(--dim);text-indent:.42em}
.tt-menu{margin-top:44px;width:100%;display:flex;flex-direction:column;gap:12px}
.tt-menu .btn{width:100%}
.tt-best{margin-top:26px;font:600 12px/1.8 var(--mono);letter-spacing:.18em;color:var(--dim);text-align:center}
.tt-best b{color:var(--gold)}
.tt-ver{margin-top:10px;font:500 10px/1 var(--mono);letter-spacing:.22em;color:var(--faint)}

/* ===== 机库 ===== */
.hg-body{flex:1;overflow-y:auto;padding:18px 18px calc(env(safe-area-inset-bottom) + 24px);
  display:flex;flex-direction:column;touch-action:pan-y}
.hg-stage{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hg-ship-box{position:relative;flex:1;height:190px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line2);background:
  linear-gradient(180deg,rgba(20,30,44,.5),rgba(8,12,20,.5));
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.hg-ship-box img{width:118px;height:142px;object-fit:contain}
.hg-thrust{position:absolute;bottom:14px;left:50%;width:8px;height:26px;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(53,224,200,.85),rgba(53,224,200,0));
  clip-path:polygon(50% 0,100% 100%,0 100%);animation:thr .5s ease-in-out infinite alternate}
@keyframes thr{from{height:18px;opacity:.7}to{height:30px;opacity:1}}
.hg-arrow{flex:none}
.hg-name-row{display:flex;align-items:center;gap:10px;margin-top:14px}
.hg-name-row b{font-size:22px;font-weight:800;letter-spacing:.12em}
.hg-stars{display:flex;gap:6px;margin-top:10px}
.hg-stars i{width:14px;height:14px;background:var(--line);
  clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%)}
.hg-stars i.on{background:var(--gold)}
.hg-desc{margin-top:10px;font-size:12.5px;line-height:1.7;color:var(--dim)}
.hg-stats{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.stat{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.stat span{width:34px;flex:none;letter-spacing:.2em}
.stat b{width:52px;flex:none;text-align:right;font:700 12px var(--mono);color:var(--txt)}
.statbar{flex:1;height:8px;background:var(--line2);position:relative;overflow:hidden}
.statbar i{position:absolute;inset:0;right:auto;background:var(--acc-dim);transition:width .25s}
.hg-actions{display:flex;gap:10px;margin-top:20px}
.hg-actions .btn{flex:1;padding:13px 6px;font-size:13.5px;letter-spacing:.06em}
.hg-wing{margin-top:26px;border-top:1px solid var(--line2);padding-top:16px}
.hg-wing-tt{font:800 14px/1 var(--sans);letter-spacing:.22em}
.hg-wing-tt span{font:500 11px/1 var(--sans);letter-spacing:.05em;color:var(--faint);margin-left:8px}
.hg-wing-row{display:flex;gap:12px;margin-top:12px}
.wg-slot{flex:1;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);
  background:rgba(15,22,32,.6);text-align:left;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.wg-slot img{width:40px;height:40px;flex:none}
.wg-slot .wg-n{font:700 13px/1.3 var(--sans)}
.wg-slot .wg-l{font:500 11px/1.5 var(--mono);color:var(--dim)}

/* ===== 关卡 ===== */
.lv-body{flex:1;overflow-y:auto;padding:18px 18px calc(env(safe-area-inset-bottom) + 24px);touch-action:pan-y}
.lv-next{position:relative;width:100%;text-align:left;padding:20px 18px;border:1px solid var(--acc-dim);
  background:linear-gradient(120deg,rgba(53,224,200,.1),rgba(53,224,200,.02) 55%);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.lv-next-cat{font:700 10px/1 var(--mono);letter-spacing:.4em;color:var(--acc)}
.lv-next-no{margin-top:10px;font-size:30px;font-weight:900;letter-spacing:.1em;color:#eef4f6}
.lv-next-sub{margin-top:6px;font-size:12px;color:var(--dim)}
.lv-go{position:absolute;right:18px;bottom:16px;font:800 14px/1 var(--sans);letter-spacing:.2em;color:var(--acc)}
.lv-grid-tt{margin:22px 0 10px;font:800 13px/1 var(--sans);letter-spacing:.3em;color:var(--dim)}
.lv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.lv-chip{position:relative;aspect-ratio:1.25;border:1px solid var(--line2);background:rgba(15,22,32,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.lv-chip b{font:800 17px/1 var(--mono);color:var(--txt)}
.lv-chip .lv-stars{display:flex;gap:2px}
.lv-chip .lv-stars i{width:7px;height:7px;background:var(--line);
  clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%)}
.lv-chip .lv-stars i.on{background:var(--gold)}
.lv-chip.done{border-color:var(--line)}
.lv-chip.cur{border-color:var(--acc);background:rgba(53,224,200,.08)}
.lv-chip.cur b{color:var(--acc)}
.lv-note{margin-top:18px;font-size:11.5px;line-height:1.8;color:var(--faint)}

/* ===== 战斗 HUD ===== */
#scr-game{background:#000}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg)}
#hud{position:absolute;inset:0;pointer-events:none;z-index:3}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 0}
.hud-score{font:800 26px/1 var(--mono);color:#eef4f6;text-shadow:0 1px 0 #000}
.hud-combo{margin-top:3px;font:800 13px/1.4 var(--mono);color:var(--gold);min-height:18px}
.hud-mid{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translateX(-50%);
  text-align:center}
.hud-lv{font:700 11px/1 var(--mono);letter-spacing:.2em;color:var(--dim)}
.hud-waves{display:flex;gap:3px;margin-top:6px;justify-content:center}
.hud-waves i{width:12px;height:4px;background:var(--line)}
.hud-waves i.on{background:var(--acc-dim)}
.hud-waves i.done{background:var(--acc)}
.hud-waves i.boss{width:14px;background:var(--dgr);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.hud-pause{pointer-events:auto;margin-left:auto}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 52px);
  width:min(300px,72%);display:none;background:rgba(5,8,13,.78);padding:6px 10px 7px;
  border:1px solid rgba(255,90,60,.35);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
#bossbar.on{display:block}
.boss-name{font:700 10px/1 var(--mono);letter-spacing:.3em;color:var(--dgr);text-align:center;margin-bottom:5px;
  text-shadow:0 1px 2px #000}
.boss-track{position:relative;height:9px;border:1px solid rgba(255,90,60,.5);background:rgba(40,10,8,.6)}
.boss-track i{position:absolute;inset:0;right:auto;background:linear-gradient(90deg,#c22,rgba(255,90,60,.85));
  transition:width .12s linear}
.boss-mk{position:absolute;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.4)}
.boss-mk.m1{left:33%}.boss-mk.m2{left:66%}
.hud-bot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;
  padding:0 12px calc(env(safe-area-inset-bottom) + 12px)}
.hud-hp{flex:1;min-width:0}
.hp-row{display:flex;align-items:center;gap:8px}
.hp-lb{font:700 10px/1 var(--mono);letter-spacing:.25em;color:var(--dim)}
.hp-bar{flex:1;max-width:170px;height:10px;border:1px solid var(--line);background:rgba(10,16,24,.72)}
.hp-bar i{position:absolute;inset:0;right:auto;background:var(--acc);transition:width .15s,background .3s}
.hp-bar{position:relative}
.hp-bar i.low{background:var(--dgr)}
.hp-bar i.mid{background:var(--amb)}
#hp-num{font:700 12px/1 var(--mono);color:var(--txt)}
.hp-row2{display:flex;gap:14px;margin-top:6px;align-items:center;font:600 11px/1 var(--mono);color:var(--dim)}
#hud-lives img{display:inline-block;width:14px;height:14px;margin-right:4px;vertical-align:-2px}
#hud-power{color:var(--amb)}
#btn-bomb{pointer-events:auto;position:relative;width:66px;height:66px;flex:none;
  border:1px solid var(--line);background:rgba(15,22,32,.78);display:flex;align-items:center;justify-content:center;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
#btn-bomb img{width:30px;height:30px}
#btn-bomb b{position:absolute;right:6px;bottom:4px;font:800 13px/1 var(--mono);color:var(--amb)}
#btn-bomb:active{background:rgba(255,176,32,.16);border-color:var(--amb)}
#btn-bomb.empty{opacity:.35}

/* ===== 弹层 ===== */
.dlg{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
  background:rgba(2,4,8,.72)}
.dlg.on{display:flex}
.dlg-panel{width:min(340px,88vw);max-height:82vh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.dlg-tt{font:800 17px/1 var(--sans);letter-spacing:.3em;padding-bottom:12px;margin-bottom:14px;
  border-bottom:1px solid var(--line2)}
.dlg-tt.danger{color:var(--dgr)}
.dlg-btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.stl-stars{display:flex;justify-content:center;gap:10px;margin:6px 0 16px}
.stl-stars i{width:26px;height:26px;background:var(--line2);
  clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%);transition:background .2s}
.stl-stars i.on{background:var(--gold)}
.stl-rows{display:flex;flex-direction:column;gap:9px}
.stl-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--dim)}
.stl-row b{font:700 15px var(--mono);color:var(--txt)}
.stl-row b.gain{color:var(--gold)}
.stl-row.big b{font-size:22px;color:#eef4f6}
.board-list{display:flex;flex-direction:column;gap:2px;min-height:120px}
.board-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line2);
  font:600 12px/1.4 var(--mono)}
.board-row .rk{width:26px;color:var(--faint)}
.board-row .sc{flex:1;color:#eef4f6;font-weight:800}
.board-row .lv,.board-row .dt{color:var(--dim);font-size:11px}
.board-row.top .rk{color:var(--gold)}
.board-empty{text-align:center;color:var(--faint);font-size:12px;padding:30px 0}
.wing-list{display:flex;flex-direction:column;gap:10px}
.wing-item{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line2);text-align:left}
.wing-item img{width:44px;height:44px;flex:none}
.wing-item .wi-b{flex:1;min-width:0}
.wing-item .wi-n{font:700 14px/1.3 var(--sans)}
.wing-item .wi-d{font:500 11px/1.6 var(--mono);color:var(--dim)}
.wing-item .btn{flex:none;padding:9px 12px;font-size:12px;letter-spacing:.04em}

/* ===== 杂项 ===== */
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);
  z-index:60;background:rgba(10,15,22,.94);border:1px solid var(--line);border-left:2px solid var(--acc);
  padding:10px 16px;font:600 13px/1.5 var(--sans);color:var(--txt);display:none;max-width:82vw;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
#demo-badge{position:absolute;left:10px;top:calc(env(safe-area-inset-top) + 58px);z-index:40;display:none;
  font:700 10px/1 var(--mono);letter-spacing:.25em;color:var(--acc);border:1px solid var(--acc-dim);
  padding:6px 9px;background:rgba(6,10,14,.8)}
#demo-badge.on{display:block;animation:db 2.4s ease-in-out infinite}
@keyframes db{0%,100%{opacity:1}50%{opacity:.45}}

/* ===== 横屏/桌面：画布居中留暗边 ===== */
@media (orientation:landscape){
  #scr-title .tt-menu{flex-direction:row;flex-wrap:wrap;justify-content:center}
  #scr-title .tt-menu .btn{width:auto;min-width:150px;flex:1}
}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 标题 ===== -->
  <section id="scr-title" class="scr">
    <div class="stars stars-a"></div><div class="stars stars-b"></div>
    <div class="tt-wrap">
      <img id="title-emblem" alt="">
      <h1 class="tt-logo">雷霆战机</h1>
      <div class="tt-sub">THUNDER FIGHTER · 银河防线</div>
      <nav class="tt-menu">
        <button class="btn btn-pri" id="btn-start">开始出击</button>
        <button class="btn" id="btn-hangar">机库</button>
        <button class="btn" id="btn-levels">关卡选择</button>
        <button class="btn" id="btn-board">排行榜</button>
        <button class="btn" id="btn-settings">设置</button>
      </nav>
      <div class="tt-best" id="title-best"></div>
      <div class="tt-ver">TF-01 · 单文件 · 程序化生成</div>
    </div>
  </section>

  <!-- ===== 机库 ===== -->
  <section id="scr-hangar" class="scr">
    <header class="bar">
      <button class="icon-btn" id="hg-back"></button>
      <div class="bar-tt">机库</div>
      <div class="bar-res">
        <span class="res"><img id="hg-coin-ic" alt=""><b id="hg-coins">0</b></span>
        <span class="res"><img id="hg-part-ic" alt=""><b id="hg-parts">0</b></span>
      </div>
    </header>
    <div class="hg-body">
      <div class="hg-stage">
        <button class="icon-btn hg-arrow" id="hg-prev"></button>
        <div class="hg-ship-box"><img id="hg-ship-img" alt=""><div class="hg-thrust"></div></div>
        <button class="icon-btn hg-arrow" id="hg-next"></button>
      </div>
      <div class="hg-name-row"><b id="hg-name">突击者</b><span class="tag" id="hg-tag">T1</span></div>
      <div class="hg-stars" id="hg-stars"></div>
      <p class="hg-desc" id="hg-desc"></p>
      <div class="hg-stats">
        <div class="stat"><span>装甲</span><div class="statbar"><i id="st-hp"></i></div><b id="stv-hp"></b></div>
        <div class="stat"><span>火力</span><div class="statbar"><i id="st-fire"></i></div><b id="stv-fire"></b></div>
        <div class="stat"><span>射速</span><div class="statbar"><i id="st-rate"></i></div><b id="stv-rate"></b></div>
        <div class="stat"><span>机动</span><div class="statbar"><i id="st-spd"></i></div><b id="stv-spd"></b></div>
      </div>
      <div class="hg-actions">
        <button class="btn" id="hg-buy">购入</button>
        <button class="btn" id="hg-up">升星</button>
        <button class="btn btn-pri" id="hg-equip">设为出战</button>
      </div>
      <div class="hg-wing">
        <div class="hg-wing-tt">僚机 <span>左右挂架各一 · 战斗中自动开火</span></div>
        <div class="hg-wing-row">
          <button class="wg-slot" id="wg-slotL"></button>
          <button class="wg-slot" id="wg-slotR"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 关卡 ===== -->
  <section id="scr-levels" class="scr">
    <header class="bar">
      <button class="icon-btn" id="lv-back"></button>
      <div class="bar-tt">关卡</div>
      <div class="bar-res"><span class="res"><img id="lv-coin-ic" alt=""><b id="lv-coins">0</b></span></div>
    </header>
    <div class="lv-body">
      <button class="lv-next" id="lv-next">
        <div class="lv-next-cat">NEXT</div>
        <div class="lv-next-no" id="lv-next-no">第 1 关</div>
        <div class="lv-next-sub" id="lv-next-sub">敌军先锋 · 建议火力 T1</div>
        <span class="lv-go">出击 →</span>
      </button>
      <div class="lv-grid-tt">作战记录</div>
      <div class="lv-grid" id="lv-grid"></div>

/* ============================================================

 *   ui .04  back .05  shoot1 .06  shoot2 .09  shoot3 .18  hit .04
 *   die1 .25  die2 .40  bigdie .90  bosshit .30  bossdie 1.8  bosswarn .90

  var duckG = null;      // duck(ms,depth) 压 BGM

  var bound = false;

  var ovrPending = null; // 待解码 dataURL

  var CURTD = null;      // BGM 调度时的当前轨（voice 默认走向它）

    bigdie: function (t) {

    /* bosswarn：警笛双音交替两轮（659/523Hz 方波） */

    pu: function (t) {

    /* coin：亮 ping（2kHz + 泛音） */
    coin: function (t) {

    /* life：上行三连音 */
    life: function (t) {

    /* bomb：全频冲击 —— sub 40Hz + 白噪 fall + 高频 shimmer 长尾 */
    bomb: function (t) {

      nz({ t: t, dur: 0.8, peak: 0.36, ft: 'lowpass', f: 6000, f2: 180, q: 0.6 });
      nz({ t: t, dur: 0.5, peak: 0.26, ft: 'bandpass', f: 900, f2: 140, q: 0.8 });
      nz({ t: t + 0.05, dur: 1.15, a: 0.03, peak: 0.05, ft: 'highpass', f: 6500, q: 0.5 });

    /* shield：护盾展开上升嗡鸣 */
    shield: function (t) {

        peak: 0.09, ft: 'bandpass', fq: 300, fq2: 1400, q: 2.2 });
      vo({ t: t + 0.08, type: 'sine', f: 880, f2: 1760, dur: 0.4, a: 0.04, peak: 0.05 });
      nz({ t: t, dur: 0.45, a: 0.05, peak: 0.045, ft: 'highpass', f: 3000, q: 0.6 });
    },
    /* shieldbrk：碎裂 —— 多个短高频 ping 错落 */
    shieldbrk: function (t) {
      nz({ t: t, dur: 0.2, peak: 0.18, ft: 'highpass', f: 4200, q: 0.7 });
      var pings = [[3400, 0], [4100, 0.05], [5200, 0.09], [3700, 0.14],
                   [6000, 0.19], [4600, 0.24], [5600, 0.3]];
      for (var i = 0; i < pings.length; i++) {
        vo({ t: t + pings[i][1], type: 'triangle', f: pings[i][0], dur: 0.08,
          a: 0.002, peak: 0.07, ft: 'highpass', fq: 2000, q: 0.7 });
      }
      nz({ t: t + 0.03, dur: 0.14, peak: 0.12, ft: 'bandpass', f: 2400, f2: 900, q: 1 });
    },
    /* clear：通关上行大琶音 */
    clear: function (t) {
      var seq = [392, 523.25, 659.25, 783.99, 1046.5];
      for (var i = 0; i < seq.length; i++) {
        vo({ t: t + i * 0.11, type: 'triangle', f: seq[i],
          dur: i === 4 ? 0.75 : 0.16, a: 0.005, h: i === 4 ? 0.3 : 0.06,
          peak: 0.13 + i * 0.015 });
        if (i >= 2) {
          vo({ t: t + i * 0.11, type: 'square', f: seq[i] * 2, dur: 0.12, a: 0.004,
            peak: 0.03, ft: 'lowpass', fq: 4200, q: 0.6 });

      }
      vo({ t: t + 0.44, type: 'sine', f: 1568, dur: 0.5, a: 0.005, peak: 0.07 });
      nz({ t: t + 0.44, dur: 0.35, peak: 0.03, ft: 'highpass', f: 7000, q: 0.7 });
    },
    /* combo：短 blip，opts.rate 控制音高随连击上行（rate 由游戏传） */
    combo: function (t) {
      vo({ t: t, type: 'square', f: 640, f2: 900, dur: 0.05, a: 0.003,
        peak: 0.11, ft: 'lowpass', fq: 4200, q: 0.7 });
      vo({ t: t, type: 'sine', f: 320, dur: 0.04, a: 0.002, peak: 0.06 });
    },
    /* graze：极短 8ms tick */
    graze: function (t) {
      nz({ t: t, dur: 0.008, peak: 0.09, ft: 'highpass', f: 7200, q: 0.7 });
      vo({ t: t, type: 'sine', f: 5200, dur: 0.008, a: 0.001, peak: 0.04 });
    },
    /* heart：低血心跳 咚-咚 双低频（由循环注册表驱动，播放入口在 play 特判） */
    heart: function (t, live) {
      vo({ t: t, type: 'sine', f: 78, f2: 46, dur: 0.13, a: 0.004,
        peak: 0.4, ft: 'lowpass', fq: 220, q: 0.6, live: live || null });
      vo({ t: t + 0.2, type: 'sine', f: 66, f2: 44, dur: 0.11, a: 0.004,
        peak: 0.28, ft: 'lowpass', fq: 200, q: 0.6, live: live || null });
    }
  };

  /* ================= heart 循环注册表 ================= */
  var heart = { on: false, timer: null, live: [], vol: 1, next: 0 };
  var HEART_GAP = 0.85;

  function heartTick() {
    if (!ctx || !heart.on) return;
    CUR.rate = 1; CUR.vol = heart.vol;
    var horizon = ctx.currentTime + 0.25, guard = 0;
    while (heart.next < horizon && guard++ < 8) {
      cues.heart(Math.max(ctx.currentTime + 0.02, heart.next), heart.live);
      heart.next += HEART_GAP;
    }
  }

  function startHeart(vol) {
    if (!ensure()) return;
    if (vol != null && isFinite(vol)) heart.vol = clamp(+vol, 0, 2);
    if (heart.on) return;               // 幂等：重复 play('heart') 不叠层
    heart.on = true;
    heart.next = ctx.currentTime + 0.05;
    if (heart.timer) clearInterval(heart.timer);
    heart.timer = setInterval(heartTick, 120);
    heartTick();
  }

  function stopHeart() {
    heart.on = false;
    if (heart.timer) { clearInterval(heart.timer); heart.timer = null; }
    killLive(heart.live);
  }

  /* ================= BGM 三轨 =================
   * battle 140BPM 四小节：四踩 kick + 锯齿 bass 十六分 + 方波 lead（A 小调推进）
   * boss   160BPM 两小节：半音阶 ostinato 压迫 + 不协和 stab
   * hangar 84BPM  四小节：detune 双锯齿 pad + 慢琶音（舒缓）
   * BGM 内部混音级 bgmMix=0.25 压低不抢音效。 */

  function bKick(t, f) {
    vo(D({ t: t, type: 'sine', f: f, f2: 42, slide: 0.09, dur: 0.14, a: 0.003, peak: 0.5 }));
  }
  function bBass(f, t, dur, pk) {
    vo(D({ t: t, type: 'sawtooth', f: f, dur: dur, a: 0.004, peak: pk,
      ft: 'lowpass', fq: 820, q: 0.7 }));
  }
  function bHat(t, pk) {
    nz(D({ t: t, dur: 0.03, peak: pk, ft: 'highpass', f: 7500, q: 0.7 }));
  }
  function bSnare(t) {
    nz(D({ t: t, dur: 0.09, peak: 0.085, ft: 'bandpass', f: 1900, q: 0.8 }));
    nz(D({ t: t, dur: 0.05, peak: 0.05, ft: 'highpass', f: 4000, q: 0.7 }));
  }
  function bLead(f, t, dur) {
    f = f * (1 + (Math.random() * 0.006 - 0.003));
    vo(D({ t: t, type: 'square', f: f, dur: dur, a: 0.008, h: dur * 0.3,
      peak: 0.085, ft: 'lowpass', fq: 2600, q: 0.6, det: Math.random() * 8 - 4 }));
  }

  /* --- battle --- */
  var B_ROOTS = [33, 33, 29, 31];      // A1 A1 F1 G1
  var B_LEAD = {};
  (function () {
    var L = [[0, 69, 2], [3, 72, 1], [6, 76, 3], [10, 74, 2], [12, 72, 2],
             [16, 69, 2], [19, 72, 1], [22, 76, 2], [24, 79, 3], [28, 76, 2], [30, 74, 2],
             [32, 77, 2], [35, 81, 2], [38, 79, 3], [42, 77, 2], [44, 76, 2], [46, 72, 2],
             [48, 74, 2], [51, 79, 2], [54, 83, 2], [56, 79, 2], [59, 79, 1], [60, 76, 3]];
    for (var i = 0; i < L.length; i++) B_LEAD[L[i][0]] = [L[i][1], L[i][2]];
  })();

  function battleStep(td, s, t) {
    var bar = (s >> 4) & 3, pos = s & 15, root = B_ROOTS[bar];
    var st = 60 / td.bpm / 4;
    if (pos % 4 === 0) bKick(t, 150);
    if (pos === 4 || pos === 12) bSnare(t);
    if (pos % 2 === 1) bHat(t, pos === 15 ? 0.05 : 0.028);
    var off = (pos % 4 === 2) ? 12 : 0;
    if (pos === 14) off = 7;             // 五度经过音
    bBass(mf(root + off), t, st * 0.92, pos % 4 === 0 ? 0.26 : 0.2);
    var m = B_LEAD[s];
    if (m) bLead(mf(m[0]), t, m[1] * st * 0.9);
  }

  /* --- boss：半音阶压迫 --- */
  var BOSS_RIFF = [0, 1, 0, -1, 0, 1, 3, 1];   // E2 上的半音阶动机
  function bossStep(td, s, t) {
    var pos = s & 31;
    if (pos === 0 || pos === 8 || pos === 16 || pos === 24) bKick(t, 120);
    if (pos === 28) bKick(t, 100);
    if (pos === 8 || pos === 24) bSnare(t);
    if (pos % 2 === 1) bHat(t, 0.022);
    if (pos % 2 === 0) {
      var off = BOSS_RIFF[(s >> 1) & 7];
      bBass(mf(40 + off), t, 0.11, pos % 8 === 0 ? 0.3 : 0.24);
    }
    if (pos === 4 || pos === 20) {       // 三全音+小二度不协和 stab
      vo(D({ t: t, type: 'square', f: mf(64), dur: 0.13, a: 0.004, peak: 0.045, ft: 'lowpass', fq: 1900, q: 0.6 }));
      vo(D({ t: t, type: 'square', f: mf(70), dur: 0.13, a: 0.004, peak: 0.04, ft: 'lowpass', fq: 1900, q: 0.6 }));
      vo(D({ t: t, type: 'square', f: mf(65), dur: 0.1, a: 0.004, peak: 0.03, ft: 'lowpass', fq: 1600, q: 0.6 }));
    }
    if (pos === 0 || pos === 16) {       // 高频紧张脉冲 E5/F5 交替 + E1 sub
      vo(D({ t: t, type: 'square', f: mf(pos === 0 ? 76 : 77), dur: 0.55, a: 0.05,
        h: 0.3, peak: 0.028, ft: 'lowpass', fq: 3600, q: 0.6 }));
      vo(D({ t: t, type: 'sine', f: 41.2, dur: 0.3, a: 0.004, peak: 0.3 }));
    }
  }

  /* --- hangar：舒缓 pad + 慢琶音 --- */
  var H_CHORDS = [[45, 52, 55, 60], [41, 48, 52, 57], [48, 55, 59, 64], [40, 47, 50, 55]];
  function hangarStep(td, s, t) {
    var bar = (s >> 4) & 3, pos = s & 15, ch = H_CHORDS[bar];
    var barLen = 60 / td.bpm * 4;
    if (pos === 0) {
      for (var i = 0; i < ch.length; i++) {
        vo(D({ t: t, type: 'sawtooth', f: mf(ch[i]), dur: barLen, a: 0.7,
          h: barLen - 1.0, peak: 0.05, ft: 'lowpass', fq: 720, q: 0.4, det: -5 }));
        vo(D({ t: t, type: 'sawtooth', f: mf(ch[i]), dur: barLen, a: 0.7,
          h: barLen - 1.0, peak: 0.05, ft: 'lowpass', fq: 720, q: 0.4, det: 5 }));
      }
      vo(D({ t: t, type: 'sine', f: mf(ch[0] - 12), dur: 0.6, a: 0.01, peak: 0.1 }));
    }
    if (pos === 0 || pos === 3 || pos === 6 || pos === 10 || pos === 12) {
      var idx = [0, 1, 2, 3, 2][[0, 3, 6, 10, 12].indexOf(pos)];
      vo(D({ t: t, type: 'triangle', f: mf(ch[idx] + 12), dur: 0.5, a: 0.02,
        h: 0.15, peak: 0.06 }));
    }
    if (pos === 8) nz(D({ t: t, dur: 0.25, a: 0.05, peak: 0.012, ft: 'highpass', f: 8000, q: 0.6 }));
  }

  var tracks = {
    battle: { bpm: 140, total: 64, level: 1, stepFn: battleStep },
    boss: { bpm: 160, total: 32, level: 1.02, stepFn: bossStep },
    hangar: { bpm: 84, total: 64, level: 1, stepFn: hangarStep }
  };
  (function () {
    for (var n in tracks) {
      if (Object.prototype.hasOwnProperty.call(tracks, n)) {
        var td = tracks[n];
        td.gain = null; td.live = []; td.timer = null;
        td.step = 0; td.next = 0; td.on = false;
      }
    }
  })();
  var bgmName = null;
  var AHEAD = 0.15, TICK_MS = 25;

  function bgmTick(td) {
    if (!td.on || !ctx) return;
    CURTD = td; CUR.rate = 1; CUR.vol = 1;
    var st = 60 / td.bpm / 4;
    var horizon = ctx.currentTime + AHEAD, guard = 0;
    while (td.next < horizon && guard++ < 64) {
      td.stepFn(td, td.step, td.next);
      td.step = (td.step + 1) % td.total;
      td.next += st;
    }
    CURTD = null;
  }

  function fadeOut(td) {
    td.on = false;
    if (td.timer) { clearInterval(td.timer); td.timer = null; }
    try {
      var g = td.gain.gain, t = ctx.currentTime;
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(0.0001, g.value), t);
      g.exponentialRampToValueAtTime(0.0001, t + 0.6);
    } catch (e) {}
    setTimeout(function () { killLive(td.live); }, 700);
  }

  function startBGM(name) {
    if (!ensure()) return;
    var td = tracks[name];
    if (!td) return;                     // 未知轨安全回落
    resumeCtx();
    if (bgmName === name && td.on) return;   // 同轨幂等
    if (bgmName && tracks[bgmName] && tracks[bgmName].on) fadeOut(tracks[bgmName]);
    bgmName = name;
    td.on = true; td.step = 0; td.next = ctx.currentTime + 0.06;
    try {
      var g = td.gain.gain, t = ctx.currentTime;
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(0.0001, g.value), t);
      g.exponentialRampToValueAtTime(td.level, t + 0.6);   // 新轨 ramp in，切轨平滑
    } catch (e) {}
    if (td.timer) clearInterval(td.timer);
    td.timer = setInterval(function () { bgmTick(td); }, TICK_MS);
    bgmTick(td);
  }

  function stopBGM() {
    if (bgmName && tracks[bgmName]) {
      var td = tracks[bgmName];
      if (ctx) fadeOut(td);
      else { td.on = false; if (td.timer) { clearInterval(td.timer); td.timer = null; } }
    }
    bgmName = null;
  }

  /* ================= overrides（dataURL 自定义音频优先） ================= */
  function fetchAB(url) {
    return new Promise(function (res, rej) {
      try {
        if (typeof fetch === 'function') {
          fetch(url).then(function (r) { return r.arrayBuffer(); }).then(res, rej);
          return;
        }
      } catch (e) {}
      try {
        var x = new XMLHttpRequest();
        x.open('GET', url, true);
        x.responseType = 'arraybuffer';
        x.onload = function () { res(x.response); };
        x.onerror = function () { rej(new Error('xhr')); };
        x.send();
        return;
      } catch (e) {}
      rej(new Error('no-fetch'));

  function decodeAB(ab) {
    return new Promise(function (res, rej) {
      var done = false;
      function ok(b) { if (!done) { done = true; res(b); } }
      function bad(e) { if (!done) { done = true; rej(e || new Error('decode')); } }

    if (!ctx || !ovrPending) return;
    var pend = ovrPending;
    ovrPending = null;
    for (var name in pend) {
      if (!Object.prototype.hasOwnProperty.call(pend, name)) continue;
      (function (n, url) {
        fetchAB(url).then(function (ab) { return decodeAB(ab); })
          .then(function (buf) { ovrBuf[n] = buf; })
          .catch(function () { delete ovrBuf[n]; });   // 解码失败回落合成
      })(name, pend[name]);

    for (var name in map) {
      if (!Object.prototype.hasOwnProperty.call(map, name)) continue;
      var v = map[name];
      if (!v) { delete ovrBuf[name]; continue; }
      if (typeof v === 'string' && v.indexOf('data:') === 0) {
        ovrPending = ovrPending || {};
        ovrPending[name] = v;
      }
      /* 非 dataURL 字符串/其他类型：忽略，走合成 */
    }

  function ensure() {

      comp.threshold.value = -14; comp.knee.value = 18; comp.ratio.value = 8;
      comp.attack.value = 0.002; comp.release.value = 0.15;

    var opt = { passive: true, capture: true };

  /* 未知名安全回落：极轻中性 tick，不抛错 */
  function generic(t) {
    vo({ t: t, type: 'square', f: 980, f2: 760, dur: 0.03, a: 0.002,
      peak: 0.06, ft: 'lowpass', fq: 3000, q: 0.6 });
  }

  function playBuf(buf, t) {
    var src = ctx.createBufferSource();
    src.buffer = buf;
    try { src.playbackRate.value = CUR.rate; } catch (e) {}
    var g = ctx.createGain();
    try { g.gain.setValueAtTime(Math.max(0.0002, CUR.vol), t); } catch (e) {}

  function init() { ensure(); }

  function unlock() {                    // 幂等：iOS 首手势 resume
    if (!ensure()) return;

  }

  function play(name, opts) {

    CUR.vol = clamp(o.vol == null ? 1 : +o.vol, 0, 4);

  function duck(ms, depth) {             // 大爆时压 BGM

      duckG.gain.linearRampToValueAtTime(1 - d, t + 0.04);
      duckG.gain.setValueAtTime(1 - d, t + hold);
      duckG.gain.linearRampToValueAtTime(1, t + hold + 0.25);
    } catch (e) {}
  }

  function setVol(bgm, sfx) {
    if (bgm != null && isFinite(bgm)) vBgm = clamp(+bgm, 0, 1);
    if (sfx != null && isFinite(sfx)) vSfx = clamp(+sfx, 0, 1);
    if (!ctx) return;
    try {
      var t = ctx.currentTime;
      bgmOut.gain.cancelScheduledValues(t);
      bgmOut.gain.setTargetAtTime(vBgm, t, 0.03);
      sfxBus.gain.cancelScheduledValues(t);
      sfxBus.gain.setTargetAtTime(vSfx, t, 0.03);
    } catch (e) {}
  }

  function setMuted(b) {
    muted = !!b;
    if (!ctx || !master) return;
    try {
      var t = ctx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setTargetAtTime(muted ? 0.0001 : 1, t, 0.015);
    } catch (e) {
      try { master.gain.value = muted ? 0.0001 : 1; } catch (e2) {}
    }
  }

  return {
    init: init,
    unlock: unlock,
    play: play,
    stop: stop,
    startBGM: startBGM,
    stopBGM: stopBGM,
    duck: duck,
    setVol: setVol,
    muted: setMuted,
    applyOverrides: applyOverrides,
    names: NAMES
  };
})();


/* ==== fx.js ==== */
/* =========================================================================
 * TF.FX — 《雷霆战机》Canvas2D 粒子特效引擎（打击感负责）
 * 覆盖: 击中火花 / 爆炸层次 / 冲击环 / 屏幕震动 / 全屏闪光 / 伤害数字 /

 * ========================================================================= */
window.TF=window.TF||{}; TF.FX=(()=>{ 'use strict';

const C={
  sparkW:'#ffffff', sparkY:'#ffe9c0',            // 白 / 黄白火花
  fireHot:'#ffd0a0', fireMid:'#ff7a3c',          // 爆炸橙红两阶
  ember:'#b23a20',                               // 余烬暗红
  player:'#35e0c8', starCW:'#d8fff6',            // 玩家青 / 青白闪星
  crit:'#ffd050',                                // 暴击数字

      T_DEBRIS=5,T_RING=6,T_TEXT=7,T_MUZZLE=8,T_CORE=9;

const DEF={
  spark :{t:T_SPARK ,n:8,spd:190,size:2.2,life:0.30,grav:40 ,drag:5.5,c:[C.sparkY,C.sparkW]},
  fire  :{t:T_FIRE  ,n:8,spd:75 ,size:11 ,life:0.50,grav:-26,drag:2.2,c:[C.fireHot,C.fireMid]},
  debris:{t:T_DEBRIS,n:6,spd:150,size:4  ,life:0.85,grav:520,drag:0.6,c:C.hull},
  smoke :{t:T_SMOKE ,n:6,spd:34 ,size:9  ,life:0.95,grav:0  ,drag:1.2,c:['#969eaa']},
  star  :{t:T_STAR  ,n:5,spd:100,size:6  ,life:0.26,grav:0  ,drag:3.0,c:[C.starCW]}
};
const MAXP=420;

// ---------- 状态 ----------
let W=420,H=760,DPR=1;

let trauma=0;                        // 震屏累积 0..1
let flashA=0,flashRate=0,flashRGB='255,255,255';
let lowHpV=0,vigPhase=0;

// ---------- 小工具 ----------
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

const _rgbCache={};
function rgbStr(col){                // '#rrggbb'/'#rgb'/'rgb(..)' -> 'r,g,b'
  let v=_rgbCache[col]; if(v) return v;
  let r=255,g=255,b=255,m;
  if(col&&col.charAt(0)==='#'){
    const hex=col.length===4? col.slice(1).replace(/./g,'$&$&'):col.slice(1);
    r=parseInt(hex.slice(0,2),16)||0; g=parseInt(hex.slice(2,4),16)||0; b=parseInt(hex.slice(4,6),16)||0;
  }else if((m=String(col).match(/[\d.]+/g))){ r=+m[0]|0; g=+m[1]|0; b=+m[2]|0; }
  v=r+','+g+','+b; _rgbCache[col]=v; return v;
}

// ---------- 预渲染发光 sprite 缓存（径向渐变圆盘，按色 key） ----------
const _sprites={}; let _smokeSpr=null;
function glow(col){
  let s=_sprites[col]; if(s) return s;
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d'),rgb=rgbStr(col);
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba('+rgb+',1)');
  gr.addColorStop(0.22,'rgba('+rgb+',0.72)');
  gr.addColorStop(0.55,'rgba('+rgb+',0.20)');
  gr.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);

}
function smokeSpr(){

  const g=c.getContext('2d');

  gr.addColorStop(0.6,'rgba('+C.smokeRGB+',0.36)');

}

// ---------- 对象池（硬上限 420，满时优先杀最老 smoke/trail/fire） ----------
function cap(){ return capMul<1? MAXP>>1 : MAXP; }
function acquire(){
  if(list.length<cap()){ const p=pool.pop()||{}; list.push(p); return p; }
  for(let i=0;i<list.length;i++){ const q=list[i]; if(q.type<=T_FIRE) return q; }
  return list[0];
}

// ---------- 生成器 ----------
function burst(x,y,o){
  o=o||{}; const k=o.kind||'spark',d=DEF[k]||DEF.spark;
  const n=Math.max(1,Math.round((o.n!==undefined?o.n:d.n)*(lowQ?0.6:1)));
  const cols=o.colors||(o.color?[o.color]:d.c);
  for(let i=0;i<n;i++){
    const p=acquire();
    const a=(o.ang!==undefined)
      ? o.ang+(Math.random()-0.5)*(o.spread!==undefined?o.spread:6.2832)
      : Math.random()*6.2832;
    const sp=(o.spd!==undefined?o.spd:d.spd)*(0.35+Math.random()*0.95);
    p.type=d.t; p.x=x; p.y=y; p.vx=Math.cos(a)*sp; p.vy=Math.sin(a)*sp;
    if(k==='smoke') p.vy-=30+Math.random()*18;            // 烟上飘
    p.size=(o.size!==undefined?o.size:d.size)*(0.7+Math.random()*0.7);
    p.life=(o.life!==undefined?o.life:d.life)*(0.7+Math.random()*0.6);
    p.age=0; p.grav=o.grav!==undefined?o.grav:d.grav; p.drag=d.drag;
    p.color=cols[(Math.random()*cols.length)|0];
    p.rot=Math.random()*6.2832; p.vr=(Math.random()-0.5)*14;
  }
}

function ring(x,y,o){
  o=o||{}; const p=acquire();
  p.type=T_RING; p.x=x; p.y=y;
  p.r0=o.r0!==undefined?o.r0:6; p.r1=o.r1!==undefined?o.r1:72;
  p.life=o.life||0.42; p.age=0; p.color=o.color||C.fireHot; p.w=o.width||5;
}

function core(x,y,color,size,life){
  const p=acquire();
  p.type=T_CORE; p.x=x; p.y=y; p.size=size; p.life=life; p.age=0; p.color=color;
}

// 组合拳: 短白闪 + 双环(快/慢) + 火×n + 碎片×n + 烟×n + 中心光斑 (+少量火花)
function explosion(x,y,scale,o){
  scale=clamp(scale||1,0.5,3); o=o||{};
  const s=scale;
  if(!o.quiet) addShake(0.1+0.12*s);
  core(x,y,'#ffffff',14+12*s,0.07+0.03*s);                       // 短白闪
  core(x,y,o.glow||C.fireMid,18+18*s,0.20+0.08*s);               // 中心光斑
  ring(x,y,{r0:4*s,r1:50+30*s,life:0.26,color:o.ring||C.fireHot,width:5*s});    // 快环
  ring(x,y,{r0:4*s,r1:86+44*s,life:0.55,color:o.ring2||C.fireMid,width:3.2*s}); // 慢环
  burst(x,y,{kind:'fire'  ,n:Math.round(8+9*s),size:6+7*s,spd:60+120*s,colors:o.colors});
  burst(x,y,{kind:'debris',n:Math.round(5+4*s),size:2.6+2.6*s,spd:90+150*Math.min(s,1.7),colors:o.colors});

// 引擎尾焰小拖影点（默认青 #35e0c8；降档时隔帧生成减拖影）
function trail(x,y,o){

  const p=acquire();
  p.type=T_TRAIL; p.x=x; p.y=y; p.size=o.size||2.6; p.life=o.life||0.26;

// 伤害数字: 军用等宽白字+深描边；crit 放大1.4×+#ffd050+额外震
function floatText(x,y,str,o){

function flash(color,alpha,ms){

function lowHp(v){ lowHpV=clamp(v||0,0,1); }

function addShake(p){ if(p>0) trauma=Math.min(1,trauma+p); }

function camOffset(){

  const a=Math.random()*6.2832,m=t2*12;

// ---------- 自适应降档: >22ms 连续 30 帧 → 上限减半+减拖影；持续 6s 良好则恢复 ----------
function setLow(v){

  else { capMul=1; lowQ=false; badN=0; }
}
function setQuality(q){

}

function init(o){
  o=o||{};
  W=o.W||420; H=o.H||760;
  const d=o.dpr!==undefined?o.dpr:(typeof devicePixelRatio!=='undefined'?devicePixelRatio:1);
  DPR=clamp(d||1,1,2);                       // DPR<=2

function stopAll(){

}

// ---------- 更新（dt 单位: 秒；document.hidden 直接返回不积累） ----------
function update(dt){

  if(!(dt>0)) return;
  if(dt>0.05) dt=0.05;
  vigPhase+=dt;
  if(autoQ){
    if(dt>0.022){ badN++; if(badN>=30) setLow(true); }
    else { badN=0; if(lowQ){ goodT+=dt; if(goodT>6) setLow(false); } }
  }

      case T_SMOKE:{ const e=Math.exp(-1.6*dt); p.vx*=e; p.x+=p.vx*dt; p.y+=p.vy*dt; break; }
      case T_TEXT:{ p.vy*=Math.exp(-2.3*dt); p.y-=p.vy*dt; break; }   // 上浮减速
      case T_STAR:{ p.rot+=p.vr*dt; break; }
    }
  }
}

// ---------- 绘制（save/restore 自理，零全局状态残留） ----------
function render(ctx,layer){
  if(!ctx) return;
  ctx.save();
  if(layer==='screen') drawScreen(ctx); else drawWorld(ctx);
  ctx.restore();
}

function drawWorld(ctx){
  let i,p; const n=list.length;

    if(p.type===T_SMOKE) dSmoke(ctx,p);
    else if(p.type===T_DEBRIS) dDebris(ctx,p);
  }
  // pass2: 加色发光 — 火/火花/闪星/拖影/冲击环/炮口/光斑
  ctx.globalCompositeOperation='lighter';
  for(i=0;i<n;i++){ p=list[i];
    switch(p.type){
      case T_FIRE:   dFire(ctx,p); break;
      case T_SPARK:  dSpark(ctx,p); break;
      case T_STAR:   dStar(ctx,p); break;
      case T_TRAIL:  dTrail(ctx,p); break;
      case T_RING:   dRing(ctx,p); break;
      case T_MUZZLE: dMuzzle(ctx,p); break;
      case T_CORE:   dCore(ctx,p); break;
    }
  }
  // pass3: 伤害数字置于最上层
  ctx.globalCompositeOperation='source-over';
  for(i=0;i<n;i++) if(list[i].type===T_TEXT) dText(ctx,list[i]);
  ctx.globalAlpha=1;
}

function dSmoke(ctx,p){
  const t=p.age/p.life;
  const a=0.17*(1-t)*(t<0.18? t/0.18:1);
  const s=p.size*(1+1.7*t);
  ctx.globalAlpha=a;
  ctx.drawImage(smokeSpr(),p.x-s,p.y-s,s*2,s*2);
}
function dDebris(ctx,p){
  const t=p.age/p.life;
  ctx.globalAlpha=t>0.6?1-(t-0.6)/0.4:1;
  const s=p.size;
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
  ctx.fillStyle=p.color;
  ctx.beginPath(); ctx.moveTo(s,0); ctx.lineTo(-s*0.7,s*0.62); ctx.lineTo(-s*0.45,-s*0.7);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function dFire(ctx,p){
  const t=p.age/p.life;
  const a=Math.pow(1-t,1.15)*0.95, s=p.size*(1+1.15*t);
  ctx.globalAlpha=a;
  ctx.drawImage(glow(p.color),p.x-s,p.y-s,s*2,s*2);
  if(t>0.3){                                   // 晚期叠暗红余烬
    const s2=s*0.8;
    ctx.globalAlpha=a*Math.min(1,(t-0.3)*2.2)*0.9;
    ctx.drawImage(glow(C.ember),p.x-s2,p.y-s2,s2*2,s2*2);
  }
}
function dSpark(ctx,p){
  const t=p.age/p.life, k=0.03;
  let dx=p.vx*k,dy=p.vy*k;
  const L=Math.sqrt(dx*dx+dy*dy),minL=2.2+p.size;
  if(L<minL){ const sc=L>0.001?minL/L:minL; dx*=sc; dy*=sc; }   // 低速也保线段长度
  ctx.globalAlpha=Math.pow(1-t,0.65);
  ctx.strokeStyle=p.color; ctx.lineCap='round';
  ctx.lineWidth=Math.max(1,p.size*(1-t*0.55));
  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-dx,p.y-dy); ctx.stroke();
}
function dStar(ctx,p){
  const t=p.age/p.life, a=1-t, l=p.size*(1-0.45*t);
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
  const s=l*0.9;
  ctx.globalAlpha=a*0.5; ctx.drawImage(glow(p.color),-s,-s,s*2,s*2);
  ctx.globalAlpha=a; ctx.strokeStyle=p.color; ctx.lineCap='round'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(-l,0); ctx.lineTo(l,0); ctx.moveTo(0,-l); ctx.lineTo(0,l); ctx.stroke();
  const l2=l*0.42;
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-l2,-l2); ctx.lineTo(l2,l2); ctx.moveTo(-l2,l2); ctx.lineTo(l2,-l2); ctx.stroke();
  ctx.restore();
}
function dTrail(ctx,p){
  const t=p.age/p.life, s=p.size*(1-0.75*t)+0.4;
  ctx.globalAlpha=(1-t)*0.85;
  ctx.drawImage(glow(p.color),p.x-s,p.y-s,s*2,s*2);
}
function dRing(ctx,p){
  const t=p.age/p.life, e=1-Math.pow(1-t,3);
  const r=p.r0+(p.r1-p.r0)*e, w=Math.max(0.6,p.w*(1-t*0.72));   // 线宽随 life 变细
  const a=Math.pow(1-t,0.75), rgb=rgbStr(p.color);
  const gr=ctx.createRadialGradient(p.x,p.y,Math.max(0.1,r-w*1.8),p.x,p.y,r+w*1.8);
  gr.addColorStop(0,'rgba('+rgb+',0)');
  gr.addColorStop(0.5,'rgba('+rgb+','+(a*0.45).toFixed(3)+')');
  gr.addColorStop(1,'rgba('+rgb+',0)');
  ctx.globalAlpha=1; ctx.fillStyle=gr;
  ctx.beginPath(); ctx.arc(p.x,p.y,r+w*1.8,0,6.2832); ctx.fill();
  ctx.globalAlpha=a; ctx.strokeStyle='rgba('+rgb+',1)'; ctx.lineWidth=w;
  ctx.beginPath(); ctx.arc(p.x,p.y,r,0,6.2832); ctx.stroke();
}
function dMuzzle(ctx,p){
  const t=p.age/p.life, a=1-t, s=p.size*0.62;
  ctx.globalAlpha=a*0.85;
  ctx.drawImage(glow('#fff7e2'),p.x-s,p.y-s,s*2,s*2);
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.ang);
  const L=p.size*(1.3-0.5*t);
  const gr=ctx.createRadialGradient(0,0,0,0,0,L);
  gr.addColorStop(0,'rgba(255,255,255,'+(0.95*a).toFixed(3)+')');
  gr.addColorStop(0.45,'rgba(255,210,160,'+(0.6*a).toFixed(3)+')');
  gr.addColorStop(1,'rgba(255,150,70,0)');
  ctx.fillStyle=gr; ctx.globalAlpha=a;
  ctx.beginPath(); ctx.moveTo(0,0);
  ctx.quadraticCurveTo(L*0.45,-L*0.26,L,-L*0.12);
  ctx.lineTo(L*1.16,0);
  ctx.lineTo(L,L*0.12);
  ctx.quadraticCurveTo(L*0.45,L*0.26,0,0);
  ctx.fill();
  ctx.restore();
}
function dCore(ctx,p){
  const t=p.age/p.life;
  const a=Math.pow(1-t,1.3), s=p.size*(0.55+0.75*t);
  ctx.globalAlpha=a;
  ctx.drawImage(glow(p.color),p.x-s,p.y-s,s*2,s*2);
}
function dText(ctx,p){
  const t=p.age/p.life;
  ctx.globalAlpha=t<0.55?1:1-(t-0.55)/0.45;
  const sz=p.size;
  ctx.font='700 '+sz+'px Consolas,Menlo,"Courier New",monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  ctx.lineWidth=Math.max(2,sz*0.14);                     // ~2px 深描边
  ctx.strokeStyle='rgba(7,11,15,0.9)';
  ctx.strokeText(p.txt,p.x,p.y);
  ctx.fillStyle=p.color;
  ctx.fillText(p.txt,p.x,p.y);
}

// screen 层: 全屏闪光淡出 + 低血红色晕影（在游戏 restore 之后调用）
function drawScreen(ctx){
  const cw=ctx.canvas.width,ch=ctx.canvas.height;
  ctx.globalCompositeOperation='source-over';
  if(flashA>0.002){
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba('+flashRGB+','+flashA.toFixed(3)+')';
    ctx.fillRect(-2,-2,cw+4,ch+4);
  }
  if(lowHpV>0.004){
    const a=lowHpV*(0.30+0.10*Math.sin(vigPhase*5.5));
    const gr=ctx.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*0.36,cw/2,ch/2,Math.max(cw,ch)*0.72);
    gr.addColorStop(0,'rgba(255,70,48,0)');
    gr.addColorStop(1,'rgba(255,70,48,'+a.toFixed(3)+')');
    ctx.globalAlpha=1; ctx.fillStyle=gr;
    ctx.fillRect(-2,-2,cw+4,ch+4);
  }
  ctx.globalAlpha=1;
}

return {
  init,addShake,camOffset,
  burst,ring,explosion,muzzle,trail,floatText,flash,lowHp,
  update,render,stopAll,setQuality
};
})();


/* ==== config-panel.js ==== */
/* ============================================================================
 * thunder-fighter · 设置面板 + TF.CFG 配置存储层（契约节 CONFIG_PANEL）
 * ------------------------------------------------------------------------
 * - 存储层：localStorage 'tf.cfg.v1'；apply(snap) 深合并 → 落盘 → 逐个回调
 *   onChange(完整快照深拷贝)；importJSON 非法 JSON 抛错且不落盘。
 * - 面板层：open 时深拷贝 cur 为 work；一切编辑 = 改 work → apply(work)，
 *   面板自身永不直接读写 localStorage（「恢复出厂」按契约明示 removeItem）。
 * - 兜底：TF.ART / TF.SFX / TF.PROFILE 缺失不抛错；模块加载期不调用他人。
 * - 视觉：军用 HUD —— 深底 #0b0f14 / 1px 边线 #263241 / 切角 12px / accent
 *   青 #35e0c8；方形滑块开关；无渐变按钮、无 emoji、无大圆角卡片堆。
 * ========================================================================= */
window.TF = window.TF || {};
TF.CFG = (function () {
  'use strict';

  var KEY = 'tf.cfg.v1';
  var SAVE_KEY = 'tf.save.v1';
  var SHIP_IDS = ['A', 'B', 'C', 'D', 'E', 'F'];
  var SHIP_NAMES = { A: '突击者', B: '幻影', C: '重锤', D: '苍穹', E: '雷神', F: '灭世' };
  var CUES = [
    ['shoot1', '主炮枪弹'], ['shoot2', '双联炮'], ['shoot3', '重炮'],
    ['hit', '命中'], ['die1', '小型爆炸'], ['die2', '中型爆炸'],
    ['bigdie', '大型爆炸'], ['pu', '道具拾取'], ['coin', '金币'],
    ['bomb', '炸弹'], ['bosswarn', 'BOSS 警告'], ['clear', '通关']
  ];

  var DEF = {
    sens: 1.15, fireK: 1, diff: 1, dropK: 1, shake: 1, vib: 1,
    bgmVol: 0.7, sfxVol: 0.9, quality: 'auto', demoSpd: 1,
    shipImg: { A: null, B: null, C: null, D: null, E: null, F: null },
    sounds: {}
  };

  /* ------------------------- 存储层 ------------------------- */

  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // 就地合并：仅当 root 时丢弃 base 未知的顶层键（保 schema），嵌套开放表照单全收
  function mergeInto(base, src, root) {
    if (!isObj(src)) return base;
    Object.keys(src).forEach(function (k) {
      if (root && !Object.prototype.hasOwnProperty.call(base, k)) return;
      var b = base[k], s = src[k];
      if (s === undefined) return;
      if (isObj(b) && isObj(s)) mergeInto(b, s, false);
      else base[k] = s;
    });
    return base;
  }

  function defaultCfg() { return clone(DEF); }

  var cur = (function () {
    var d = defaultCfg();
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) mergeInto(d, JSON.parse(raw), true);
    } catch (e) { /* 损坏存档按默认处理 */ }
    return d;
  })();

  function persist() { try { localStorage.setItem(KEY, JSON.stringify(cur)); } catch (e) {} }

  var cbs = [];
  function onChange(cb) {
    if (typeof cb === 'function') cbs.push(cb);
    return function () { var i = cbs.indexOf(cb); if (i >= 0) cbs.splice(i, 1); };
  }
  function fire() {
    var snap = clone(cur);
    for (var i = 0; i < cbs.length; i++) { try { cbs[i](snap); } catch (e) {} }
  }
  // 桥接 SFX（音量 + 自定义音效覆盖），全部存在性兜底
  function sideFx() {
    try { if (window.TF && TF.SFX && typeof TF.SFX.setVol === 'function') TF.SFX.setVol(cur.bgmVol, cur.sfxVol); } catch (e) {}
    try { if (window.TF && TF.SFX && typeof TF.SFX.applyOverrides === 'function') TF.SFX.applyOverrides(cur.sounds || {}); } catch (e) {}
  }

  function all() { return cur; }
  function apply(snap) { cur = mergeInto(defaultCfg(), snap, true); persist(); sideFx(); fire(); return cur; }
  function exportJSON() { return JSON.stringify(cur, null, 2); }
  function importJSON(str) {
    var o = JSON.parse(str); // 非法 JSON 直接抛错，不落盘
    if (!isObj(o)) throw new Error('配置必须为 JSON 对象');
    apply(o);
    return clone(cur);
  }

  /* ------------------------- 面板层 ------------------------- */

  var panel = null, work = null, els = null;
  var imgInput = null, audInput = null, dataInput = null;
  var imgTarget = null, audTarget = null, toastTimer = 0;

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function txt(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function dataURI(u) { return typeof u === 'string' && u.indexOf('data:image') === 0; }
  function icon(name) {
    try {
      var u = (window.TF && TF.ART && typeof TF.ART.icon === 'function') ? TF.ART.icon(name) : null;
      if (dataURI(u)) return '<img class="tfcp-ic" alt="" src="' + u + '">';
    } catch (e) {}
    return '';
  }
  var SHIP_PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">' +
    '<rect x="9" y="9" width="82" height="102" fill="none" stroke="#263241" stroke-dasharray="4 3"/>' +
    '<path d="M50 32 L67 86 L50 73 L33 86 Z" fill="none" stroke="#3c4c5e" stroke-width="2"/>' +
    '</svg>');
  function shipSrc(id) {
    try {
      if (work && work.shipImg && work.shipImg[id]) return work.shipImg[id];
      var u = (window.TF && TF.ART && typeof TF.ART.ship === 'function') ? TF.ART.ship(id) : null;
      if (dataURI(u)) return u;
    } catch (e) {}
    return SHIP_PLACEHOLDER;
  }

  // 面板编辑唯一出口：work → apply（落盘 + 广播深拷贝快照），面板不碰 localStorage
  function commit() { apply(work); }

  function openPanel() {
    if (!document.body) { setTimeout(openPanel, 30); return; }
    if (!panel) build();
    work = clone(cur);           // 打开面板：深拷贝为 work 副本
    syncAll();
    panel.mask.classList.add('tfcp-show');
    try { if (window.TF && TF.SFX && typeof TF.SFX.play === 'function') TF.SFX.play('ui'); } catch (e) {}
  }
  function close() {
    if (!panel) return;
    panel.mask.classList.remove('tfcp-show');
    hideConfirm();
    imgTarget = null; audTarget = null;
  }
  function isOpen() { return !!(panel && panel.mask.classList.contains('tfcp-show')); }

  function toastMsg(s) {
    if (!panel) return;
    panel.toast.textContent = s;
    panel.toast.classList.add('tfcp-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { if (panel) panel.toast.classList.remove('tfcp-show'); }, 1800);
  }

  /* --------------------- 控件行构造 --------------------- */

  function secHead(t) { return el('div', 'tfcp-sec', txt(t)); }
  function hint(t) { return el('div', 'tfcp-hint', txt(t)); }

  function rowNum(label, key, min, max, step, dec, suffix) {
    var r = el('div', 'tfcp-row');
    r.innerHTML = '<span class="tfcp-lab">' + txt(label) + '</span>';
    var val = el('span', 'tfcp-val');
    var rng = document.createElement('input');
    rng.type = 'range'; rng.className = 'tfcp-rng';
    rng.min = min; rng.max = max; rng.step = step;
    rng.setAttribute('data-key', key);
    var fmt = function (v) { return Number(v).toFixed(dec) + (suffix || ''); };
    rng.addEventListener('input', function () {
      var v = parseFloat(rng.value);
      if (isNaN(v)) return;
      work[key] = v;
      val.textContent = fmt(v);
      commit();
    });
    r.appendChild(rng); r.appendChild(val);
    els.nums[key] = { rng: rng, val: val, fmt: fmt, scale: 1 };
    return r;
  }

  function rowVol(label, key) {
    var r = el('div', 'tfcp-row');
    r.innerHTML = '<span class="tfcp-lab">' + txt(label) + '</span>';
    var val = el('span', 'tfcp-val');
    var rng = document.createElement('input');
    rng.type = 'range'; rng.className = 'tfcp-rng';
    rng.min = 0; rng.max = 100; rng.step = 1;
    rng.setAttribute('data-key', key);
    var fmt = function (v) { return Math.round(v) + '%'; };
    rng.addEventListener('input', function () {  // 输入即广播 + setVol 兜底
      var v = parseFloat(rng.value);
      if (isNaN(v)) return;
      work[key] = v / 100;
      val.textContent = fmt(v);
      commit();
    });
    r.appendChild(rng); r.appendChild(val);
    els.nums[key] = { rng: rng, val: val, fmt: fmt, scale: 100 };
    return r;
  }

  function rowToggle(label, key) {
    var r = el('div', 'tfcp-row');
    r.innerHTML = '<span class="tfcp-lab">' + txt(label) + '</span>';
    var b = el('button', 'tfcp-sw', '<i></i>');
    b.type = 'button';
    b.setAttribute('data-key', key);
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () {
      work[key] = b.classList.contains('tfcp-on') ? 0 : 1;
      b.classList.toggle('tfcp-on', !!work[key]);
      b.setAttribute('aria-pressed', work[key] ? 'true' : 'false');
      commit();
    });
    r.appendChild(b);
    els.togs[key] = b;
    return r;
  }

  function segSync(seg, v) {
    Array.prototype.forEach.call(seg.children, function (b) { b.classList.toggle('tfcp-on', b.__v === v); });
  }
  function rowSeg(label, key, opts) {
    var r = el('div', 'tfcp-row');
    r.innerHTML = '<span class="tfcp-lab">' + txt(label) + '</span>';
    var seg = el('div', 'tfcp-seg');
    seg.setAttribute('data-key', key);
    opts.forEach(function (o) {
      var b = el('button', '', txt(o[1]));
      b.type = 'button';
      b.__v = o[0];
      b.addEventListener('click', function () {
        work[key] = o[0];
        segSync(seg, o[0]);
        commit();
      });
      seg.appendChild(b);
    });
    r.appendChild(seg);
    els.segs[key] = seg;
    return r;
  }

  function rowAct(label, sub, btnText, iconName, act, fn, danger) {
    var r = el('div', 'tfcp-row');
    var lw = el('div', 'tfcp-labwrap');
    lw.innerHTML = '<span class="tfcp-lab">' + txt(label) + '</span>' +
      (sub ? '<span class="tfcp-labsub">' + txt(sub) + '</span>' : '');
    var b = el('button', 'tfcp-btn' + (danger ? ' tfcp-dgr' : ''),
      icon(iconName) + '<span>' + txt(btnText) + '</span>');
    b.type = 'button';
    b.setAttribute('data-act', act);
    b.addEventListener('click', fn);
    r.appendChild(lw); r.appendChild(b);
    return r;
  }

  /* --------------------- 图片压缩上传 --------------------- */

  function compressImage(file, ok, fail) {
    var draw = function (src, w, h) {
      try {
        var k = Math.min(1, 256 / Math.max(w || 1, h || 1));   // 256px 长边
        var cw = Math.max(1, Math.round((w || 1) * k));
        var ch = Math.max(1, Math.round((h || 1) * k));
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        cv.getContext('2d').drawImage(src, 0, 0, cw, ch);
        var url;
        try { url = cv.toDataURL('image/webp', 0.85); } catch (e) { url = ''; }
        if (typeof url !== 'string' || url.indexOf('data:image/webp') !== 0) {
          try { url = cv.toDataURL('image/png'); } catch (e2) { if (fail) fail(); return; }
        }
        ok(url);
      } catch (e) { if (fail) fail(); }
    };
    var legacy = function () {
      var im = new Image();
      im.onload = function () { draw(im, im.naturalWidth, im.naturalHeight); };
      im.onerror = function () { if (fail) fail(); };
      try { im.src = URL.createObjectURL(file); } catch (e) { if (fail) fail(); }
    };
    if (typeof createImageBitmap === 'function') {
      createImageBitmap(file).then(function (b) { draw(b, b.width, b.height); }, legacy);
    } else legacy();
  }

  function onImgPicked() {
    var f = imgInput.files && imgInput.files[0];
    imgInput.value = '';
    if (!f || !imgTarget) return;
    var id = imgTarget; imgTarget = null;
    compressImage(f, function (url) {
      if (!work.shipImg) work.shipImg = {};
      work.shipImg[id] = url;
      commit(); syncShips();
      toastMsg('战机 ' + id + ' 立绘已更新');
    }, function () { toastMsg('图片读取失败'); });
  }

  function onAudPicked() {
    var f = audInput.files && audInput.files[0];
    audInput.value = '';
    if (!f || !audTarget) return;
    var cue = audTarget; audTarget = null;
    var rd = new FileReader();
    rd.onload = function () {
      if (!work.sounds) work.sounds = {};
      work.sounds[cue] = String(rd.result || '');
      commit(); syncSound();
      toastMsg('音效 ' + cue + ' 已替换');
      try { if (window.TF && TF.SFX && typeof TF.SFX.play === 'function') TF.SFX.play(cue); } catch (e) {}
    };
    rd.onerror = function () { toastMsg('音频读取失败'); };
    rd.readAsDataURL(f);
  }

  function onDataPicked() {
    var f = dataInput.files && dataInput.files[0];
    dataInput.value = '';
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { importDataText(String(rd.result || '')); };
    rd.onerror = function () { toastMsg('读取文件失败'); };
    rd.readAsText(f);
  }

  function importDataText(text) {
    var o = null;
    try { o = JSON.parse(text); } catch (e) { toastMsg('导入失败：非法 JSON'); return; }
    var done = [];
    var cfgObj = isObj(o) ? (isObj(o.cfg) ? o.cfg : o) : null;
    if (cfgObj) {
      try { importJSON(JSON.stringify(cfgObj)); done.push('配置'); } catch (e) {}
    }
    if (isObj(o) && o.save && window.TF && TF.PROFILE && typeof TF.PROFILE.import === 'function') {
      try { TF.PROFILE.import(o.save); done.push('存档'); } catch (e) {}
    }
    work = clone(cur);
    syncAll();
    toastMsg(done.length ? '已导入：' + done.join(' + ') : '导入失败：无有效数据');
  }

  /* --------------------- 数据导出 / 恢复出厂 --------------------- */

  function exportData() {
    var payload = { app: 'thunder-fighter', ver: 1, time: Date.now(), cfg: JSON.parse(exportJSON()) };
    try {
      if (window.TF && TF.PROFILE && typeof TF.PROFILE.export === 'function') {
        var sv = TF.PROFILE.export();
        if (sv != null) payload.save = sv;
      }
    } catch (e) {}
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    var href = URL.createObjectURL(blob);
    a.href = href;
    a.download = 'tf-data-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(href); }, 3000);
    toastMsg('数据已导出');
  }

  function askReset() { if (panel) panel.confirm.classList.add('tfcp-show'); }
  function hideConfirm() { if (panel) panel.confirm.classList.remove('tfcp-show'); }
  function doReset() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    location.reload();
  }

  /* --------------------- 同步 --------------------- */

  function syncAll() {
    if (!work || !els) return;
    Object.keys(els.nums).forEach(function (k) {
      var n = els.nums[k];
      var shown = n.scale ? Number(work[k]) * n.scale : Number(work[k]);
      n.rng.value = shown;
      n.val.textContent = n.fmt(shown);
    });
    Object.keys(els.togs).forEach(function (k) {
      els.togs[k].classList.toggle('tfcp-on', !!work[k]);
      els.togs[k].setAttribute('aria-pressed', work[k] ? 'true' : 'false');
    });
    Object.keys(els.segs).forEach(function (k) { segSync(els.segs[k], work[k]); });
    syncShips();
    syncSound();
  }
  function syncShips() {
    SHIP_IDS.forEach(function (id) {
      if (els.shipImgs[id]) els.shipImgs[id].src = shipSrc(id);
      if (els.shipCells[id]) els.shipCells[id].classList.toggle('tfcp-custom', !!(work && work.shipImg && work.shipImg[id]));
    });
  }
  function syncSound() {
    if (!els || !els.cueSel) return;
    var cue = els.cueSel.value;
    var custom = !!(work && work.sounds && work.sounds[cue]);
    els.cueState.textContent = custom ? '已替换 · 自定义音频' : '合成默认';
    els.cueState.classList.toggle('tfcp-on', custom);
    var n = 0, k;
    for (k in (work && work.sounds || {})) if (work.sounds[k]) n++;
    els.sndCount.textContent = '已替换 ' + n + '/' + CUES.length;
  }

  /* --------------------- DOM 构建 --------------------- */

  function onKey(e) { if (e && (e.key === 'Escape' || e.keyCode === 27) && isOpen()) close(); }

  function showTab(i) {
    els.tabs.forEach(function (t, j) { t.classList.toggle('tfcp-on', j === i); });
    els.pages.forEach(function (p, j) { p.classList.toggle('tfcp-on', j === i); });
  }

  function buildShipPage() {
    var p = el('div', 'tfcp-page');
    p.appendChild(secHead('舰体立绘'));
    var grid = el('div', 'tfcp-ships');
    SHIP_IDS.forEach(function (id) {
      var cell = el('div', 'tfcp-ship');
      cell.setAttribute('data-id', id);
      var th = el('div', 'tfcp-thumb');
      var img = document.createElement('img');
      img.alt = id + ' 立绘';
      th.appendChild(img);
      var nm = el('div', 'tfcp-sname', txt(id) + ' · ' + txt(SHIP_NAMES[id]));
      var act = el('div', 'tfcp-sact');
      var b1 = el('button', 'tfcp-btn tfcp-sm', '上传');
      b1.type = 'button';
      b1.setAttribute('data-act', 'up-ship');
      b1.setAttribute('data-id', id);
      b1.addEventListener('click', function () { imgTarget = id; imgInput.click(); });
      var b2 = el('button', 'tfcp-btn tfcp-sm', '默认');
      b2.type = 'button';
      b2.setAttribute('data-act', 'rst-ship');
      b2.setAttribute('data-id', id);
      b2.addEventListener('click', function () {
        if (!work.shipImg) work.shipImg = {};
        work.shipImg[id] = null;
        commit(); syncShips();
        toastMsg('战机 ' + id + ' 已恢复默认立绘');
      });
      act.appendChild(b1); act.appendChild(b2);
      cell.appendChild(th); cell.appendChild(nm); cell.appendChild(act);
      grid.appendChild(cell);
      els.shipImgs[id] = img; els.shipCells[id] = cell;
    });
    p.appendChild(grid);
    p.appendChild(hint('上传图片将等比压缩至 256px 长边（WebP 85%）后本地保存；「默认」恢复官方立绘。'));
    return p;
  }

      var op = document.createElement('option');
      op.value = c[0];
      op.textContent = c[0] + ' · ' + c[1];
      sel.appendChild(op);
    });
    sel.addEventListener('change', syncSound);
    rc.appendChild(sel);
    p.appendChild(rc);

    var rs = el('div', 'tfcp-row');
    rs.innerHTML = '<span class="tfcp-lab">当前状态</span>';

    bU.addEventListener('click', function () { audTarget = els.cueSel.value; audInput.click(); });
    var bR = el('button', 'tfcp-btn', icon('refresh') + '<span>恢复合成</span>');

    bR.setAttribute('data-act', 'reset-audio');

      var cue = els.cueSel.value;
      if (work.sounds) delete work.sounds[cue];
      commit(); syncSound();
      toastMsg('音效 ' + cue + ' 已恢复合成');
      try { if (window.TF && TF.SFX && typeof TF.SFX.play === 'function') TF.SFX.play(cue); } catch (e) {}
    });
    ra.appendChild(bU); ra.appendChild(bR);
    p.appendChild(ra);

    var rs2 = el('div', 'tfcp-row');
    rs2.innerHTML = '<span class="tfcp-lab">替换进度</span>';

    return p;

  function buildConfirm() {
    var cf = el('div', 'tfcp-confirm');
    var box = el('div', 'tfcp-cbox');
    box.appendChild(el('div', 'tfcp-ctitle', '恢复出厂'));
    box.appendChild(el('p', 'tfcp-ctext',
      '将清除全部配置与存档（含战机立绘、自定义音效、关卡进度与排行榜），操作不可恢复。确定继续？'));
    var btns = el('div', 'tfcp-cbtns');
    var bn = el('button', 'tfcp-btn', '<span>取消</span>');
    bn.type = 'button';
    bn.setAttribute('data-act', 'cancel-reset');
    bn.addEventListener('click', hideConfirm);
    var bc = el('button', 'tfcp-btn tfcp-dgr', '<span>确认恢复</span>');
    bc.type = 'button';
    bc.setAttribute('data-act', 'confirm-reset');
    bc.addEventListener('click', doReset);
    btns.appendChild(bn); btns.appendChild(bc);
    box.appendChild(btns);

  function build() {
    var old = document.getElementById('panel-cfg');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    if (!document.getElementById('tfcp-style')) {
      var st = document.createElement('style');
      st.id = 'tfcp-style';
      st.textContent = CSS_TEXT;
      document.head.appendChild(st);
    }
    els = { nums: {}, togs: {}, segs: {}, shipImgs: {}, shipCells: {}, tabs: [], pages: [], cueSel: null, cueState: null, sndCount: null };

    var mask = el('div', 'tfcp-mask');
    mask.id = 'panel-cfg';
    mask.setAttribute('aria-label', '系统设置');
    var drawer = el('div', 'tfcp-drawer');
    drawer.setAttribute('role', 'dialog');

    var head = el('div', 'tfcp-head');
    head.appendChild(el('div', 'tfcp-title', '系统设置'));
    head.appendChild(el('div', 'tfcp-sub', 'THUNDER FIGHTER // SYS-CONFIG'));
    var xb = el('button', 'tfcp-x', icon('close') + '<span>关闭</span>');
    xb.type = 'button';
    xb.setAttribute('data-act', 'close');
    xb.addEventListener('click', close);
    head.appendChild(xb);
    drawer.appendChild(head);

    var TABS = ['战机立绘', '音效', '玩法', '数据'];
    var tabBox = el('div', 'tfcp-tabs');
    TABS.forEach(function (t, i) {
      var b = el('button', 'tfcp-tab' + (i === 0 ? ' tfcp-on' : ''), txt(t));
      b.type = 'button';
      b.setAttribute('data-tab', i);
      b.addEventListener('click', function () { showTab(i); });
      tabBox.appendChild(b);
      els.tabs.push(b);
    });
    drawer.appendChild(tabBox);

    var body = el('div', 'tfcp-body');
    [buildShipPage(), buildAudioPage(), buildPlayPage(), buildDataPage()].forEach(function (pg, i) {
      if (i === 0) pg.classList.add('tfcp-on');
      body.appendChild(pg);
      els.pages.push(pg);
    });
    drawer.appendChild(body);

    imgInput = document.createElement('input');
    imgInput.type = 'file'; imgInput.accept = 'image/*'; imgInput.style.display = 'none';
    imgInput.addEventListener('change', onImgPicked);
    audInput = document.createElement('input');
    audInput.type = 'file'; audInput.accept = 'audio/*'; audInput.style.display = 'none';
    audInput.addEventListener('change', onAudPicked);
    dataInput = document.createElement('input');
    dataInput.type = 'file'; dataInput.accept = 'application/json,.json'; dataInput.style.display = 'none';
    dataInput.addEventListener('change', onDataPicked);
    drawer.appendChild(imgInput); drawer.appendChild(audInput); drawer.appendChild(dataInput);

    var toast = el('div', 'tfcp-toast');
    drawer.appendChild(toast);

    mask.appendChild(drawer);
    mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
    document.body.appendChild(mask);
    var confirm = buildConfirm();
    document.body.appendChild(confirm);
    document.addEventListener('keydown', onKey);

    els.cueSel = drawer.querySelector('select[data-key="cueSel"]');
    els.cueState = drawer.querySelector('[data-key="cueState"]');
    els.sndCount = drawer.querySelector('[data-key="sndCount"]');

    panel = { mask: mask, toast: toast, confirm: confirm };
  }

/* logic.js — 纯数据与数学：战机/僚机/敌舰/Boss/无限关卡/掉落/经济/存档 */
window.TF = window.TF || {};
TF.LOGIC = (function () {

  // ===== 战机（6 级）=====
  const SHIPS = [

  // ===== 敌机 =====
  const ENEMIES = [
