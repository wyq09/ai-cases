              <svg class="leaf-on-card" viewBox="0 0 220 300"><use href="#branch"/></svg>
            </div>
            <div class="gcard tall c-teal-deep">
              <span class="badge spaced light">辅　色</span>
              <div class="divider light"><i></i><span>✦</span><i></i></div>
              <h3 class="cname light">远山青</h3>
              <p class="hex light">#5D7E7A</p>
              <p class="tag light">如远山般静谧深邃<br>沉稳内敛，安定心绪<br>平衡温暖与宁静</p>
              <svg class="leaf-on-card" viewBox="0 0 220 300"><use href="#branch"/></svg>
            </div>
            <footer class="p-foot" style="color:#8A7455">·· ✦ 配色有温度，生活有质感 ✦ ··</footer>
            <div class="grain"></div>
          </article></div>
          <figcaption><b>7/7</b> 酪黄 #E7C86A × 远山青 #5D7E7A <button class="use-btn" data-use="7">✨ 用此配色创作</button></figcaption>
        </figure>

      </div>
    </div>
  </section>

  <!-- ================= 色卡生成器 ================= -->
  <section id="studio" class="sec">
    <div class="sec-head">
      <h2><span class="deco">··</span> 色卡生成器 <span class="deco">··</span></h2>
      <p>填入你的主色辅色，实时预览同款色卡 — 下载 1080×1440 高清 PNG，直接发小红书</p>
    </div>

    <div class="studio">
      <div class="preview-col">
        <div class="preview-wrap">
          <canvas id="cardCanvas" width="1080" height="1440"></canvas>
        </div>
        <div class="preview-actions">
          <button type="button" id="randomBtn" class="btn ghost">🎲 随机灵感</button>
          <button type="button" id="copyBtn" class="btn ghost">复制文案</button>
          <button type="button" id="downloadBtn" class="btn primary">⬇ 下载色卡 PNG</button>
        </div>
        <p class="f-hint">1080 × 1440（3:4）高清 PNG · 适配小红书图文 · iPhone 可在弹窗中长按图片保存</p>
      </div>

      <form id="studioForm" class="panel" autocomplete="off">
        <div class="f-row two">
          <label>标题<input name="title" value="温柔耐看的高级感" maxlength="24"></label>
          <label>页码（可留空）<input name="page" value="1/7" placeholder="如 1/7" maxlength="6"></label>
        </div>
        <label>副标题<input name="sub" value="配色灵感 · 柔和优雅" maxlength="30"></label>
        <fieldset class="f-color">
          <legend><i class="sw" id="mainSw"></i>主色</legend>
          <div class="f-grid">
            <label>名称<input name="mainName" value="豆沙粉" maxlength="6"></label>
            <label>色值<input name="mainHex" value="#C88697" class="mono"><input type="color" class="pick" data-for="mainHex" value="#C88697"></label>
          </div>
          <label>描述<input name="mainTag" value="温柔细腻 · 浪漫治愈" maxlength="40"></label>
        </fieldset>
        <fieldset class="f-color">
          <legend><i class="sw" id="auxSw"></i>辅色</legend>
          <div class="f-grid">
            <label>名称<input name="auxName" value="墨青灰" maxlength="6"></label>
            <label>色值<input name="auxHex" value="#31424D" class="mono"><input type="color" class="pick" data-for="auxHex" value="#31424D"></label>
          </div>
          <label>描述<input name="auxTag" value="沉稳内敛 · 低调高级" maxlength="40"></label>
        </fieldset>
        <div class="f-row">
          <span class="f-label">背景风格</span>
          <div class="chips" id="presetChips">
            <button type="button" class="chip on" data-preset="cream">暖调奶油</button>
            <button type="button" class="chip" data-preset="blush">玫瑰拂晓</button>
            <button type="button" class="chip" data-preset="dusk">暮蓝烟紫</button>
            <button type="button" class="chip" data-preset="bamboo">暖调竹影</button>
            <button type="button" class="chip" data-preset="lavender">雾紫暮光</button>
            <button type="button" class="chip" data-preset="aurora">暗夜极光</button>
          </div>
        </div>
        <label>底部文案<input name="footer" value="配色有温度，生活有质感" maxlength="24"></label>
      </form>
    </div>
  </section>
</main>

<footer class="site-foot">·· ✦ 配色有温度，生活有质感 ✦ ··</footer>

<!-- iOS 保存弹窗 -->
<div class="modal" id="saveModal" hidden>
  <div class="modal-box">
    <p class="modal-title">色卡已生成 🎉</p>
    <img id="saveImg" alt="生成的色卡预览">
    <p class="modal-tip">长按上方图片 → 「存储到相册」即可发小红书<br>也可点击下方按钮保存到「文件」</p>
    <div class="modal-actions">
      <button type="button" id="saveToFiles" class="btn primary">保存到文件</button>
      <button type="button" id="modalClose" class="btn ghost">关闭</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>window.addEventListener('error',function(e){(window.__errs=window.__errs||[]).push(e.message)});</script>

<script src="assets/js/app.js"></script>
</body>
