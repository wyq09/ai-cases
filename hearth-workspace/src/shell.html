<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hearth · Life OS</title>
<meta name="description" content="Hearth — a personal AI workspace: chat, goals, files, tasks and memory in one calm surface." />
<style>/*STYLE_INLINE*/</style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="sb-head">
        <a class="brand" href="#/chat" aria-label="Hearth home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 2.2 13.9 8.4 20.4 6.6 16.2 11.6 21.6 14.4 14.7 15.4 13.9 21.8 11 16.4 4.3 19.6 7.5 13.9 2.3 11.2 9.2 10.3 10.3 3.9Z" fill="currentColor"/></svg>
          </span>
          <span class="brand-text">
            <b>Hearth</b>
            <i>Life OS</i>
          </span>
        </a>
        <button class="icon-btn sb-collapse" id="btnCollapse" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" width="15" height="15"><rect x="3" y="4" width="18" height="16" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 4v16" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
      </div>

      <div class="sb-search">
        <svg class="sb-search-ico" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="text" id="globalSearch" placeholder="Search..." aria-label="Search" autocomplete="off" spellcheck="false" />
        <kbd class="kbd">⌘K</kbd>
      </div>

      <div class="sb-scroll" id="sbScroll">
        <div class="sb-group">
          <div class="sb-group-label">Main</div>
          <nav class="sb-nav" id="navMain"></nav>
        </div>

        <div class="sb-group sb-today" id="todayGroup">
          <button class="sb-group-toggle" id="toggleToday" aria-expanded="true">
            <span>Today</span>
            <svg class="chev" viewBox="0 0 24 24" width="13" height="13"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="today-list" id="todayList"></ul>
        </div>
      </div>

      <div class="sb-foot">
        <div class="sb-group">
          <button class="sb-group-toggle" id="toggleSetting" aria-expanded="true">
            <span class="tgl-ico"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.2v2.2M12 18.6v2.2M20.8 12h-2.2M5.4 12H3.2M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6M18.2 18.2l-1.6-1.6M7.4 7.4 5.8 5.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
            <span>Setting</span>
            <svg class="chev" viewBox="0 0 24 24" width="13" height="13"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="sb-sub" id="settingList"></ul>
        </div>
        <div class="sb-group">
          <button class="sb-group-toggle" id="toggleHelp" aria-expanded="true">
            <span class="tgl-ico"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.7 9.6a2.4 2.4 0 1 1 3.2 2.3c-.6.2-.9.8-.9 1.4v.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="16.4" r="1" fill="currentColor"/></svg></span>
            <span>Help Center</span>
            <svg class="chev" viewBox="0 0 24 24" width="13" height="13"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="sb-sub" id="helpList"></ul>
        </div>

        <div class="sb-user" id="sbUser" tabindex="0" role="button" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar avatar-sm">R</span>
          <span class="sb-user-text">
            <b>RahMan</b>
            <i>viratman02@gmail.com</i>
          </span>
          <svg class="chev" viewBox="0 0 24 24" width="13" height="13"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>

        <div class="theme-switch" role="group" aria-label="Theme">
          <button class="theme-btn is-active" data-theme-opt="light">
            <svg viewBox="0 0 24 24" width="12" height="12"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.6v2.4M12 19v2.4M21.4 12H19M5 12H2.6M18.6 5.4 17 7M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>Light</span>
          </button>
          <button class="theme-btn" data-theme-opt="dark">
            <svg viewBox="0 0 24 24" width="12" height="12"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span>Dark</span>
          </button>
          <button class="theme-btn" data-theme-opt="system">
            <svg viewBox="0 0 24 24" width="12" height="12"><rect x="3" y="4.4" width="18" height="12.4" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.6 20h6.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>System</span>
          </button>
        </div>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="topbar" id="topbar">
        <div class="tb-left">
          <button class="icon-btn tb-menu" id="btnMenu" aria-label="Open menu">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button class="chip chip-os" id="btnOs" aria-haspopup="menu" aria-expanded="false">
            <span id="osLabel">Personal OS</span>
            <svg class="chev" viewBox="0 0 24 24" width="12" height="12"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="chip chip-back" id="btnBack" hidden>
            <svg viewBox="0 0 24 24" width="13" height="13"><path d="m14 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="backLabel">Goals</span>
          </button>
        </div>
        <div class="tb-right">
          <button class="icon-btn tb-bell" id="btnBell" aria-label="Notifications" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M18 15.5V10a6 6 0 1 0-12 0v5.5L4.4 18h15.2L18 15.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.8 20.6a2.4 2.4 0 0 0 4.4 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span class="dot" id="bellDot"></span>
          </button>
          <button class="btn btn-dark tb-new" id="btnNew">
            <svg viewBox="0 0 24 24" width="13" height="13"><rect x="4.2" y="4.2" width="15.6" height="15.6" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 9.4v5.2M9.4 12h5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>New</span>
          </button>
          <button class="icon-btn tb-sliders" id="btnSliders" aria-label="Preferences">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 7h11M19 7h1M4 12h4M12 12h8M4 17h9M17 17h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="17" cy="7" r="2.1" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="12" r="2.1" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="17" r="2.1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
        </div>
      </header>

      <div class="view" id="view" tabindex="-1"></div>
    </main>
  </div>

  <div class="layer" id="layer" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script>/*SCRIPT_INLINE*/</script>
</body>
</html>
