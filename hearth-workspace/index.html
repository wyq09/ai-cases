<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hearth · Life OS</title>
<meta name="description" content="Hearth — a personal AI workspace: chat, goals, files, tasks and memory in one calm surface." />
<style>/* ==========================================================================
   Hearth · Life OS — design system
   ========================================================================== */

:root {
  --font-display: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --bg: #f4f4f6;
  --panel: #ffffff;
  --panel-2: #fbfbfc;
  --sidebar: #fbfbfc;
  --line: #e9e9ee;
  --line-soft: #f0f0f4;
  --ink: #16161b;
  --ink-2: #55555f;
  --ink-3: #8b8b96;
  --ink-4: #b6b6c0;
  --pill: #1b1b20;
  --pill-ink: #ffffff;
  --wash: #f1f1f5;
  --wash-2: #e9e9ef;

  --violet: #7c5cf0;
  --violet-soft: #ede9fe;
  --blue: #4a7df0;
  --blue-soft: #e6edfd;
  --green: #3fae79;
  --green-soft: #e3f5ec;
  --amber: #e2953f;
  --amber-soft: #fbf0e0;
  --rose: #e4678f;
  --rose-soft: #fce9f0;
  --sky: #3d94d6;
  --sky-soft: #e5f1fb;

  --shadow-sm: 0 1px 2px rgba(20, 20, 30, .04), 0 1px 1px rgba(20, 20, 30, .03);
  --shadow-md: 0 4px 16px rgba(20, 20, 30, .06), 0 1px 3px rgba(20, 20, 30, .04);
  --shadow-lg: 0 18px 48px rgba(20, 20, 30, .14), 0 3px 10px rgba(20, 20, 30, .06);
  --r-xs: 7px;
  --r-sm: 10px;
  --r-md: 13px;
  --r-lg: 18px;
  --r-xl: 24px;

  --sb-w: 246px;
  --top-h: 60px;
}

[data-theme="dark"] {
  --bg: #101014;
  --panel: #191920;
  --panel-2: #1e1e26;
  --sidebar: #15151b;
  --line: #2b2b35;
  --line-soft: #23232b;
  --ink: #eeeef2;
  --ink-2: #a9a9b5;
  --ink-3: #7b7b88;
  --ink-4: #5b5b67;
  --pill: #f1f1f4;
  --pill-ink: #16161b;
  --wash: #22222b;
  --wash-2: #2b2b36;

  --violet-soft: #241f3d;
  --blue-soft: #1b2440;
  --green-soft: #16301f;
  --amber-soft: #33270f;
  --rose-soft: #331c25;
  --sky-soft: #152736;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, .38);
  --shadow-lg: 0 20px 52px rgba(0, 0, 0, .58);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

button {
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

a { color: inherit; text-decoration: none; }

:focus-visible {
  outline: 2px solid var(--violet);
  outline-offset: 2px;
  border-radius: 6px;
}

::selection { background: var(--violet); color: #fff; }

/* ---------- scrollbars ---------- */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--wash-2);
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover { background: var(--ink-4); background-clip: content-box; }

/* ==========================================================================
   App frame
   ========================================================================== */

.app {
  display: flex;
  height: 100dvh;
  overflow: hidden;
}

.sidebar {
  width: var(--sb-w);
  flex: 0 0 var(--sb-w);
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  z-index: 40;
  transition: width .22s cubic-bezier(.4, 0, .2, 1), flex-basis .22s cubic-bezier(.4, 0, .2, 1);
}

.app.is-rail .sidebar { width: 64px; flex-basis: 64px; }

.sb-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 14px 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  flex: 1;
}

.brand-mark {
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  border-radius: 8px;
  background: var(--pill);
  color: var(--pill-ink);
  display: grid;
  place-items: center;
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
  min-width: 0;
}
.brand-text b {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.01em;
}
.brand-text i {
  font-style: normal;
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: .04em;
}

.app.is-rail .brand-text,
.app.is-rail .sb-user-text,
.app.is-rail .theme-btn span,
.app.is-rail .sb-group-toggle span:not(.tgl-ico),
.app.is-rail .sb-nav .nav-label,
.app.is-rail .nav-badge,
.app.is-rail .sb-sub,
.app.is-rail .kbd { display: none; }

.app.is-rail .sb-head { justify-content: center; padding-inline: 10px; }
.app.is-rail .sb-collapse svg { transform: rotate(180deg); }
.app.is-rail .sb-search { padding-inline: 10px; }
.app.is-rail .sb-search input { display: none; }
.app.is-rail .sb-search { justify-content: center; }
.app.is-rail .sb-nav a, .app.is-rail .sb-group-toggle { justify-content: center; }
.app.is-rail .today-list { display: none; }
.app.is-rail .theme-switch { flex-direction: column; }
.app.is-rail .theme-btn { justify-content: center; width: 100%; }

.icon-btn {
  width: 30px;
  height: 30px;
  border-radius: var(--r-sm);
  display: grid;
  place-items: center;
  color: var(--ink-2);
  transition: background .15s, color .15s;
  flex: 0 0 auto;
}
.icon-btn:hover { background: var(--wash); color: var(--ink); }

.sb-search {
  margin: 0 12px 12px;
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 34px;
  padding: 0 8px 0 10px;
  background: var(--wash);
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  transition: border-color .15s, background .15s;
}
.sb-search:focus-within { border-color: var(--violet); background: var(--panel); }
.sb-search-ico { color: var(--ink-3); flex: 0 0 auto; }
.sb-search input {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: none;
  font-size: 12px;
  color: var(--ink);
}
.sb-search input::placeholder { color: var(--ink-4); }

.kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-3);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 1px 5px;
  line-height: 1.5;
}

.sb-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 8px;
}

.sb-group { padding: 0 10px; }
.sb-group + .sb-group { margin-top: 14px; }

.sb-group-label {
  font-size: 10px;
  color: var(--ink-4);
  padding: 2px 8px 6px;
  letter-spacing: .04em;
}

.sb-nav { display: flex; flex-direction: column; gap: 1px; }

.sb-nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 34px;
  padding: 0 9px;
  border-radius: var(--r-sm);
  color: var(--ink-2);
  font-size: 12.5px;
  position: relative;
  transition: background .14s, color .14s;
}
.sb-nav a svg { flex: 0 0 auto; opacity: .85; }
.sb-nav a:hover { background: var(--wash); color: var(--ink); }
.sb-nav a.is-active {
  background: var(--pill);
  color: var(--pill-ink);
  box-shadow: var(--shadow-sm);
}
.sb-nav a.is-active svg { opacity: 1; }
.nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-keys { display: flex; gap: 3px; }
.nav-keys span {
  font-size: 9px;
  line-height: 15px;
  min-width: 15px;
  height: 15px;
  padding: 0 3px;
  text-align: center;
  border-radius: 4px;
  background: var(--wash-2);
  color: var(--ink-3);
}
.sb-nav a.is-active .nav-keys span { background: rgba(255, 255, 255, .18); color: var(--pill-ink); }
[data-theme="dark"] .sb-nav a.is-active .nav-keys span { background: rgba(0, 0, 0, .18); }

.nav-badge {
  font-size: 10px;
  min-width: 17px;
  height: 17px;
  padding: 0 5px;
  border-radius: 99px;
  background: var(--wash-2);
  color: var(--ink-3);
  display: grid;
  place-items: center;
  font-weight: 600;
}
.sb-nav a.is-active .nav-badge { background: rgba(255, 255, 255, .18); color: var(--pill-ink); }
[data-theme="dark"] .sb-nav a.is-active .nav-badge { background: rgba(0, 0, 0, .16); }

.sb-group-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  height: 32px;
  padding: 0 9px;
  border-radius: var(--r-sm);
  color: var(--ink-2);
  font-size: 12.5px;
}
.sb-group-toggle:hover { background: var(--wash); color: var(--ink); }
.sb-group-toggle > span:not(.tgl-ico) { flex: 1; text-align: left; }
.tgl-ico { display: grid; place-items: center; color: var(--ink-3); }
.chev { transition: transform .2s; color: var(--ink-4); }
.sb-group-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }

.sb-sub { list-style: none; margin: 2px 0 0; padding: 0 0 0 15px; }
.sb-sub li {
  font-size: 12px;
  color: var(--ink-3);
  padding: 6px 9px;
  border-radius: var(--r-xs);
  cursor: pointer;
  transition: background .14s, color .14s;
}
.sb-sub li:hover { background: var(--wash); color: var(--ink); }
.sb-sub li.is-active { color: var(--violet); background: var(--violet-soft); }

.sb-today { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.today-list { list-style: none; margin: 4px 0 0; padding: 0; }
.today-list li {
  font-size: 11px;
  color: var(--ink-3);
  padding: 7px 10px 7px 22px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-radius: var(--r-xs);
  cursor: pointer;
  position: relative;
  transition: background .14s, color .14s;
}
.today-list li::before {
  content: "";
  position: absolute;
  left: 9px;
  top: 12px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  border: 1.4px solid var(--ink-4);
}
.today-list li:hover { background: var(--wash); color: var(--ink); }
.today-list li:hover::before { border-color: var(--violet); }
.today-list li.is-done { color: var(--ink-4); text-decoration: line-through; }
.today-list li.is-done::before { background: var(--ink-4); border-color: var(--ink-4); }

.sb-foot {
  border-top: 1px solid var(--line);
  padding: 10px 10px 12px;
  background: var(--sidebar);
}
.sb-foot .sb-group { padding: 0; }
.sb-foot .sb-group + .sb-group { margin-top: 2px; }

.sb-user {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 9px;
  border-radius: var(--r-sm);
  margin-top: 10px;
  cursor: pointer;
  transition: background .15s;
  border: 1px solid var(--line);
  background: var(--panel);
}
.sb-user:hover { border-color: var(--ink-4); }
.sb-user-text { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.2; }
.sb-user-text b { font-size: 12px; font-weight: 600; }
.sb-user-text i {
  font-style: normal;
  font-size: 10px;
  color: var(--ink-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.avatar {
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--wash-2);
  color: var(--ink-2);
  font-family: var(--font-display);
  font-weight: 700;
  flex: 0 0 auto;
  overflow: hidden;
}
.avatar-sm { width: 26px; height: 26px; font-size: 11px; }
.avatar-md { width: 30px; height: 30px; font-size: 12px; }
.avatar-pair { display: flex; }
.avatar-pair .avatar + .avatar { margin-left: -9px; box-shadow: 0 0 0 2px var(--panel); }

.theme-switch {
  display: flex;
  gap: 4px;
  margin-top: 8px;
  background: var(--wash);
  border-radius: var(--r-sm);
  padding: 3px;
}
.theme-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 26px;
  border-radius: 7px;
  color: var(--ink-3);
  font-size: 11px;
  transition: background .15s, color .15s, box-shadow .15s;
}
.theme-btn:hover { color: var(--ink); }
.theme-btn.is-active {
  background: var(--panel);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}

/* ==========================================================================
   Topbar
   ========================================================================== */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  height: var(--top-h);
  flex: 0 0 var(--top-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  position: relative;
  z-index: 30;
}

.tb-left, .tb-right { display: flex; align-items: center; gap: 8px; }

.tb-menu { display: none; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border-radius: var(--r-sm);
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 12px;
  transition: background .15s, color .15s, border-color .15s;
}
.chip:hover { color: var(--ink); border-color: var(--ink-4); }
.chip[hidden] { display: none; }
.chip-back { background: transparent; border-color: transparent; }
.chip-back:hover { background: var(--wash); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 13px;
  border-radius: var(--r-sm);
  font-size: 12.5px;
  font-weight: 500;
  transition: transform .12s, background .15s, color .15s, border-color .15s, box-shadow .15s;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-dark {
  background: var(--pill);
  color: var(--pill-ink);
  box-shadow: var(--shadow-md);
}
.btn-dark:hover { background: color-mix(in srgb, var(--pill) 86%, var(--violet)); }
.btn-ghost {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink-2);
}
.btn-ghost:hover { color: var(--ink); border-color: var(--ink-4); }
.btn-soft { background: var(--wash); color: var(--ink-2); }
.btn-soft:hover { background: var(--wash-2); color: var(--ink); }
.btn-sm { height: 27px; padding: 0 10px; font-size: 11.5px; border-radius: var(--r-xs); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.tb-bell { position: relative; }
.tb-bell .dot {
  position: absolute;
  top: 5px;
  right: 6px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--rose);
  display: none;
}
.tb-bell.has-unread .dot { display: block; }

/* ==========================================================================
   View shell
   ========================================================================== */

.view {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
}

.page {
  padding: 20px 22px 40px;
  max-width: 1320px;
  margin: 0 auto;
  width: 100%;
}
.page-wide { max-width: none; }

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.page-title {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin: 0;
  line-height: 1.15;
}
.page-sub {
  font-size: 12.5px;
  color: var(--ink-3);
  margin: 6px 0 0;
  max-width: 46ch;
}

.section-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.01em;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 10px;
}
.section-title svg { color: var(--ink-3); }

.muted { color: var(--ink-3); }
.tiny { font-size: 10.5px; }
.mono-label {
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-4);
}

/* ==========================================================================
   Cards & surfaces
   ========================================================================== */

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px;
}

.tabs {
  display: inline-flex;
  gap: 2px;
  background: var(--wash);
  border-radius: var(--r-sm);
  padding: 3px;
}
.tab {
  height: 28px;
  padding: 0 13px;
  border-radius: 7px;
  font-size: 12px;
  color: var(--ink-3);
  transition: background .15s, color .15s, box-shadow .15s;
  white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab.is-active {
  background: var(--panel);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  font-weight: 600;
}

.select-wrap { position: relative; display: inline-flex; align-items: center; }
.select-wrap > svg { position: absolute; right: 9px; pointer-events: none; color: var(--ink-3); }
.select {
  appearance: none;
  height: 30px;
  padding: 0 28px 0 11px;
  border-radius: var(--r-sm);
  background: var(--panel);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--ink);
  cursor: pointer;
}
.select:focus { outline: none; border-color: var(--violet); }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 19px;
  padding: 0 7px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 600;
  background: var(--wash);
  color: var(--ink-3);
  white-space: nowrap;
}
.tag-violet { background: var(--violet-soft); color: var(--violet); }
.tag-blue { background: var(--blue-soft); color: var(--blue); }
.tag-green { background: var(--green-soft); color: var(--green); }
.tag-amber { background: var(--amber-soft); color: var(--amber); }
.tag-rose { background: var(--rose-soft); color: var(--rose); }
.tag-sky { background: var(--sky-soft); color: var(--sky); }

.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink-3);
  font-size: 12px;
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
  background: var(--panel-2);
}

/* ==========================================================================
   Chat page
   ========================================================================== */

.chat-wrap {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 34px 20px 44px;
}
.chat-wrap.has-thread { justify-content: flex-end; padding-top: 12px; }
.chat-wrap.has-thread .chat-thread { margin-top: auto; padding-bottom: 8px; }

.chat-hero {
  text-align: center;
  margin: 26px 0 24px;
  animation: rise .5s cubic-bezier(.2, .8, .3, 1) both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

.orb {
  width: 42px;
  height: 42px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: linear-gradient(140deg, #6fd0ff 0%, #4a7df0 42%, #6b3ff0 100%);
  box-shadow: 0 8px 26px rgba(74, 125, 240, .34);
  animation: orbFloat 5.5s ease-in-out infinite;
  position: relative;
}
.orb::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .75), transparent 46%);
}
@keyframes orbFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.chat-greeting {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin: 0;
}
.chat-greeting em { font-style: normal; color: inherit; }

}

.smart-item .dot.mid { background: var(--amber); }

/* ==========================================================================
   Calendar / Memory / generic
   ========================================================================== */

.cal-grid {
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;
}
.cal-head { font-size: 10px; color: var(--ink-4); text-align: center; padding-bottom: 4px; }
.cal-cell {

}

.cal-ev {

.mem-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.mem-card {

}

/* ==========================================================================
   Overlays: menus, modals, drawer, command palette
   ========================================================================== */

.layer {
  position: fixed; inset: 0; z-index: 90;
}
.layer::before {
  content: ""; position: absolute; inset: 0;
  background: rgba(16, 16, 22, .3);
  animation: fadeIn .18s both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.layer.layer-plain::before { display: none; }

.menu {
  position: absolute;
  min-width: 190px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-lg);
  padding: 6px;
  animation: pop .16s cubic-bezier(.2, .9, .3, 1) both;
  z-index: 95;
}
@keyframes pop {
  from { opacity: 0; transform: translateY(-6px) scale(.98); }
  to { opacity: 1; transform: none; }
}
/* Centred overlays need their own keyframes: a generic `transform: none`
   would drop the translate(-50%,-50%) that keeps them centred. */
@keyframes popCentered {
  from { opacity: 0; transform: translate(-50%, -50%) scale(.97); }
  to { opacity: 1; transform: translate(-50%, -50%); }
}
@keyframes popCenteredX {
  from { opacity: 0; transform: translateX(-50%) scale(.98); }
  to { opacity: 1; transform: translateX(-50%); }
}
.menu-item {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 8px 10px; border-radius: var(--r-xs);
  font-size: 12.5px; color: var(--ink-2); text-align: left;
  transition: background .13s, color .13s;
}
.menu-item:hover { background: var(--wash); color: var(--ink); }
.menu-item svg { flex: 0 0 auto; opacity: .8; }
.menu-item .kbd { margin-left: auto; }
.menu-item.is-danger:hover { background: var(--rose-soft); color: var(--rose); }
.menu-sep { height: 1px; background: var(--line); margin: 5px 4px; }
.menu-label { font-size: 9.5px; color: var(--ink-4); padding: 6px 10px 4px; letter-spacing: .08em; text-transform: uppercase; }

.modal {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(520px, calc(100vw - 32px));
  max-height: calc(100dvh - 48px);
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  animation: popCentered .2s cubic-bezier(.2, .9, .3, 1) both;
  z-index: 95;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 17px 20px 12px;
  flex: 0 0 auto;
}
.modal-head h3 { margin: 0; font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.modal-body { padding: 0 20px 4px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
.modal-foot {
  display: flex; align-items: center; justify-content: flex-end; gap: 9px;
  padding: 16px 20px 18px;
  flex: 0 0 auto;
  border-top: 1px solid var(--line-soft);
}

.field { margin-bottom: 13px; }
.field label { display: block; font-size: 10.5px; color: var(--ink-3); margin-bottom: 5px; letter-spacing: .04em; }
.input, .textarea {
  width: 100%; border: 1px solid var(--line); background: var(--panel-2);
  border-radius: var(--r-sm); padding: 8px 11px; font-size: 12.5px; color: var(--ink);
  transition: border-color .15s, background .15s;
}
.textarea { resize: vertical; min-height: 78px; line-height: 1.6; font-family: var(--font-mono); }
.input:focus, .textarea:focus { outline: none; border-color: var(--violet); background: var(--panel); }
.input::placeholder, .textarea::placeholder { color: var(--ink-4); }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.picker { display: flex; flex-wrap: wrap; gap: 6px; }
.pick {
  height: 26px; padding: 0 10px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--panel-2);
  font-size: 11px; color: var(--ink-2); transition: all .14s;
}
.pick:hover { border-color: var(--ink-4); }
.pick.is-on { background: var(--pill); color: var(--pill-ink); border-color: transparent; }

.cmdk {
  position: absolute;
  left: 50%; top: 12vh;
  transform: translateX(-50%);
  width: min(600px, calc(100vw - 28px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: popCenteredX .18s cubic-bezier(.2, .9, .3, 1) both;
  z-index: 95;
}
.cmdk-input {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--line);
}
.cmdk-input input {
  flex: 1; border: 0; outline: none; background: none; font-size: 14px; color: var(--ink);
  font-family: var(--font-mono);
}
.cmdk-results { max-height: 46vh; overflow-y: auto; padding: 6px; }
.cmdk-group { font-size: 9.5px; color: var(--ink-4); padding: 8px 10px 4px; letter-spacing: .08em; text-transform: uppercase; }
.cmdk-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; border-radius: var(--r-xs); text-align: left;
  font-size: 12.5px; color: var(--ink-2);
}
.cmdk-item:hover, .cmdk-item.is-sel { background: var(--wash); color: var(--ink); }
.cmdk-item .kbd { margin-left: auto; }
.cmdk-item svg { flex: 0 0 auto; opacity: .75; }
.cmdk-empty { padding: 26px; text-align: center; color: var(--ink-3); font-size: 12px; }

.drawer {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: min(420px, 100vw);
  background: var(--panel);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
  animation: slideIn .22s cubic-bezier(.3, .9, .3, 1) both;
  z-index: 95;
}
@keyframes slideIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; border-bottom: 1px solid var(--line);
}
.drawer-head h3 { margin: 0; font-family: var(--font-display); font-size: 16px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px 30px; }

.setting-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--line-soft);
}
.setting-row:last-child { border-bottom: 0; }
.setting-row .sr-txt b { display: block; font-size: 12.5px; font-weight: 600; }
.setting-row .sr-txt span { font-size: 10.5px; color: var(--ink-3); }

.switch {
  width: 38px; height: 22px; border-radius: 99px; background: var(--wash-2);
  position: relative; transition: background .18s; flex: 0 0 auto;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  box-shadow: var(--shadow-sm); transition: transform .18s;
}
.switch.is-on { background: var(--violet); }
.switch.is-on::after { transform: translateX(16px); }

.notif {
  display: flex; gap: 10px; padding: 11px 6px; border-bottom: 1px solid var(--line-soft);
}
.notif:last-child { border-bottom: 0; }
.notif-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--violet); margin-top: 5px; flex: 0 0 auto; }
.notif.is-read .notif-dot { background: var(--ink-4); }
.notif b { display: block; font-size: 12px; font-weight: 600; }
.notif p { margin: 3px 0 0; font-size: 11px; color: var(--ink-3); line-height: 1.5; }
.notif time { font-size: 9.5px; color: var(--ink-4); }

/* ==========================================================================
   Toasts
   ========================================================================== */

.toasts {
  position: fixed;
  bottom: 18px; left: 50%;
  transform: translateX(-50%);
  z-index: 120;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
}
.toast {
  background: var(--pill);
  color: var(--pill-ink);
  padding: 9px 15px;
  border-radius: 99px;
  font-size: 12px;
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 8px;
  animation: toastIn .22s cubic-bezier(.2, .9, .3, 1) both;
}
.toast.is-out { animation: toastOut .2s both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px); } }

/* ==========================================================================
   Responsive
   ========================================================================== */

  .field-row { grid-template-columns: 1fr; }
  .kb-tabs { width: 100%; overflow-x: auto; }

@media (max-width: 520px) {

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {

  }

    const h = opts.h ?? 420;

    const X = (f) => (f * w).toFixed(1);
    const Y = (f) => (f * h).toFixed(1);
    const poly = (pts) => "M" + pts.map((p) => `${X(p[0])} ${Y(p[1])}`).join(" L ");

    const far = [

    const snow = (i, scale = 1) => {

  ${cloud(0.045 * w, 0.06 * h, 0.62 * cs, 0.95)}
  ${cloud(0.235 * w, 0.19 * h, 0.42 * cs, 0.8)}
  ${cloud(0.49 * w, 0.04 * h, 0.55 * cs, 0.9)}
  ${cloud(0.72 * w, 0.25 * h, 0.36 * cs, 0.68)}
  ${cloud(0.34 * w, 0.36 * h, 0.26 * cs, 0.5)}
  ${cloud(0.88 * w, 0.1 * h, 0.46 * cs, 0.86)}

  <path d="${farPath}" fill="url(#h-far)"/>
  ${snow(2)}
  ${snow(3, 0.9)}
  ${snow(9)}
  ${snow(1, 0.8)}

  <path d="${midPath}" fill="url(#h-mid)"/>
  <rect y="${Y(0.48)}" width="${w}" height="${Y(0.26)}" fill="url(#h-haze)" opacity="0.28"/>

  <path d="M${X(0)} ${Y(0.88)} C${X(0.1)} ${Y(0.81)} ${X(0.18)} ${Y(0.86)} ${X(0.275)} ${Y(0.82)} C${X(0.37)} ${Y(0.775)} ${X(0.43)} ${Y(0.85)} ${X(0.533)} ${Y(0.81)} C${X(0.633)} ${Y(0.765)} ${X(0.717)} ${Y(0.845)} ${X(0.825)} ${Y(0.79)} C${X(0.9)} ${Y(0.757)} ${X(0.958)} ${Y(0.8)} ${X(1)} ${Y(0.78)} L${X(1)} ${Y(1)} L${X(0)} ${Y(1)} Z" fill="url(#h-hill)"/>
  <path d="M${X(0)} ${Y(0.958)} C${X(0.133)} ${Y(0.893)} ${X(0.25)} ${Y(0.945)} ${X(0.39)} ${Y(0.907)} C${X(0.533)} ${Y(0.87)} ${X(0.667)} ${Y(0.935)} ${X(0.8)} ${Y(0.9)} C${X(0.9)} ${Y(0.87)} ${X(0.958)} ${Y(0.913)} ${X(1)} ${Y(0.887)} L${X(1)} ${Y(1)} L${X(0)} ${Y(1)} Z" fill="url(#h-front)"/>

  <rect width="${w}" height="${h}" fill="url(#h-fade)"/>

  }

  /* Stand-alone figure layer: rendered outside the stretched backdrop so the
     silhouette never distorts, whatever the banner aspect ratio is. */
  function personFigure(kind = "sit") {
    const box = kind === "stand" ? "972 224 72 112" : "938 238 118 172";
    const body = kind === "stand" ? FIG_STAND : FIG_SIT;
    return `<svg viewBox="${box}" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;

  const FIG_SIT = `

  </g>
  <path d="M944 396c0-11 9-20 20-20h50c11 0 20 9 20 20v8h-90Z" fill="#2f3d49" opacity=".85"/>`;

  const FIG_STAND = `

  const ART_CAREER = `

  <path d="M44 24h34v22H44zM78 46h32v24H78zM110 70h32v18h-32z" fill="#a5a5ad"/>
  <path d="M8 96h164v-8H8Z" fill="#8f8f98" opacity=".5"/>
  <circle cx="60" cy="30" r="4.4" fill="#4d4d55"/>
  <path d="M56.6 36h6.8l2.4 16h-11.6Z" fill="#4d4d55"/>

  function curvePoints(values, w, h, pad) {
    const max = Math.max(...values);
    const min = Math.min(...values);
    const span = max - min || 1;
    return values.map((v, i) => {
      const x = pad + (i / (values.length - 1)) * (w - pad * 2);
      const y = h - pad - ((v - min) / span) * (h - pad * 2.4);
      return [x, y];
    });
  }

  function smoothPath(pts) {
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let i = 1; i < pts.length; i++) {
      const [px, py] = pts[i - 1];
      const [cx, cy] = pts[i];
      const mx = (px + cx) / 2;
      d += ` C${mx.toFixed(1)} ${py.toFixed(1)} ${mx.toFixed(1)} ${cy.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)}`;

    const mx = pts[marker][0];
    const my = pts[marker][1];

    const steps = 44;
    let curtain = "";
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * (pts.length - 1);
      const i0 = Math.min(pts.length - 1, Math.floor(t));
      const i1 = Math.min(pts.length - 1, i0 + 1);
      const f = t - i0;
      const x = pts[i0][0] + (pts[i1][0] - pts[i0][0]) * f;
      const y = pts[i0][1] + (pts[i1][1] - pts[i0][1]) * f;
      const op = 0.1 + 0.24 * (1 - Math.abs(i / steps - 0.5) * 2);
      curtain += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x.toFixed(1)}" y2="${h}" stroke="#8b7bf0" stroke-width="1" opacity="${op.toFixed(3)}"/>`;

<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
  <defs><linearGradient id="sp-g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8b7bf0" stop-opacity=".14"/><stop offset="1" stop-color="#8b7bf0" stop-opacity="0"/>
  </linearGradient></defs>

  <line x1="${mx}" y1="${my}" x2="${mx}" y2="${h}" stroke="#3c3a55" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/>
  <circle cx="${mx}" cy="${my}" r="3.6" fill="#3c3a55"/>
</svg>`;
  }

  /* Dense thin-bar histogram with a highlighted middle cluster. */
  function barChart(values, opts = {}) {
    const w = opts.width ?? 320;
    const h = opts.height ?? 84;
    const gap = 1.6;
    const bw = (w - gap * (values.length - 1)) / values.length;
    const max = Math.max(...values);
    const hot = values.map((v) => v / max > 0.62);
    return `
<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
  ${values
    .map((v, i) => {
      const bh = Math.max(3, (v / max) * (h - 6));
      const x = i * (bw + gap);
      return `<rect x="${x.toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1" fill="${hot[i] ? "#3d3a55" : "#8b8fa8"}" opacity="${hot[i] ? ".92" : ".45"}"/>`;
    })
    .join("")}
</svg>`;
  }

  function storageDonut(used, total) {
    const r = 46;
    const c = 2 * Math.PI * r;
    const pct = Math.min(1, used / total);
    return `
<svg viewBox="0 0 120 120" width="112" height="112" aria-hidden="true">
  <circle cx="60" cy="60" r="${r}" fill="none" stroke="#e9e9ef" stroke-width="12"/>
  <circle cx="60" cy="60" r="${r}" fill="none" stroke="#7c5cf0" stroke-width="12" stroke-linecap="round"

  <text x="60" y="72" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8b8b96">of ${total} GB</text>
</svg>`;
  }

  return { landscape, personFigure, cloud, ART_CAREER, ART_BOOK, ART_MONEY, sparkline, barChart, storageDonut };

function persist() {
  try {
    localStorage.setItem(
      STORE_KEY,
      JSON.stringify({
        theme: state.theme,
        os: state.os,
        rail: state.rail,
        openGroups: state.openGroups,
        goalTab: state.goalTab,
        goalView: state.goalView,
        goalWeek: state.goalWeek,
        taskView: state.taskView,
        fileLayout: state.fileLayout,
        fileFilter: state.fileFilter,
        insightDismissed: state.insightDismissed,
        doneToday: state.doneToday,
        messages: state.chat.messages.slice(-40),
        tasks: state.tasks,
        goals: state.goals,
        vision: state.vision,
        settings: state.settings,
      })
    );
  } catch (e) {
    /* storage unavailable — app keeps working in-memory */
  }
}

function restore() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORE_KEY);
  } catch (e) {
    raw = null;
  }
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    Object.assign(state, {
      theme: d.theme ?? state.theme,
      os: d.os ?? state.os,
      rail: !!d.rail,
      goalTab: d.goalTab ?? state.goalTab,
      goalView: d.goalView ?? state.goalView,
      taskView: d.taskView ?? state.taskView,
      fileLayout: d.fileLayout ?? state.fileLayout,
      fileFilter: d.fileFilter ?? state.fileFilter,
      insightDismissed: !!d.insightDismissed,
    });
    if (d.openGroups) state.openGroups = Object.assign(state.openGroups, d.openGroups);
    if (d.goalWeek) state.goalWeek = Object.assign(state.goalWeek, d.goalWeek);
    if (Array.isArray(d.doneToday)) state.doneToday = d.doneToday;
    if (Array.isArray(d.messages)) state.chat.messages = d.messages;
    if (Array.isArray(d.tasks)) state.tasks = d.tasks;
    if (Array.isArray(d.goals)) state.goals = d.goals;
    if (Array.isArray(d.vision)) state.vision = d.vision;
    if (d.settings) state.settings = Object.assign(state.settings, d.settings);
  } catch (e) {
    /* corrupted payload — fall back to defaults */
  }
}

   ========================================================================== */

/** Markdown-ish → HTML: **bold**, `code`, bullet lists and numbered lists. */
function formatReply(text) {
  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) =>
    esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`(.+?)`/g, "<code>$1</code>");

  const lines = String(text).split("\n");
  let html = "";
  let inList = false;

  for (const raw of lines) {
    const line = raw.trimEnd();
    const bullet = /^[•\-*]\s+/.test(line);
    const numbered = /^\d+\.\s+/.test(line);
    if (bullet || numbered) {
      if (!inList) {
        html += "<ul>";
        inList = true;
      }
      html += `<li>${inline(line.replace(bullet ? /^[•\-*]\s+/ : /^\d+\.\s+/, ""))}</li>`;
      continue;
    }
    if (inList) {
      html += "</ul>";
      inList = false;
    }
    if (line.trim() !== "") html += `<p style="margin:0 0 8px">${inline(line)}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}

/** Pick the canned reply whose key best matches the prompt. */
function pickReply(prompt, replies) {
  const p = String(prompt || "").trim().toLowerCase();
  if (!p) return null;
  const keys = Object.keys(replies || {});
  const exact = keys.find((k) => k.toLowerCase() === p);
  if (exact) return replies[exact];
  const contains = keys.find((k) => p.includes(k.toLowerCase()) || k.toLowerCase().includes(p));
  if (contains) return replies[contains];
  return null;
}

/** Case-insensitive substring match used by the command palette. */
function matchesQuery(label, query) {
  if (!query) return true;
  return String(label).toLowerCase().includes(String(query).trim().toLowerCase());
}

/* ------------------------------ tasks ------------------------------ */

function filterTasks(tasks, col) {
  return (tasks || []).filter((t) => t.col === col);
}

function countByColumn(tasks, cols) {
  const out = {};
  (cols || []).forEach((c) => {
    out[typeof c === "string" ? c : c.id] = 0;
  });
  (tasks || []).forEach((t) => {
    if (out[t.col] === undefined) out[t.col] = 0;
    out[t.col] += 1;
  });
  return out;
}

/** Move a task between columns. Returns the task, or null when unknown. */
function moveTask(tasks, id, col) {
  const t = (tasks || []).find((x) => x.id === id);
  if (!t) return null;
  if (t.col === col) return t;
  t.col = col;
  return t;
}

function toggleTaskDone(tasks, id) {
  const t = (tasks || []).find((x) => x.id === id);
  if (!t) return null;
  t.done = !t.done;
  return t;
}

/** Build a new task record with sane defaults. */
function createTask(tasks, payload) {
  const id = payload.id || `t${Date.now()}${Math.floor(Math.random() * 1000)}`;
  const task = {
    id,
    col: payload.col || "todo",
    title: String(payload.title || "Untitled task").trim(),
    desc: String(payload.desc || "").trim(),
    tags: Array.isArray(payload.tags) ? payload.tags.slice() : [],
    date: payload.date || "Feb 18",
    comments: payload.comments ?? 0,
    links: payload.links ?? 0,
    progress: Math.max(0, Math.min(100, Number(payload.progress) || 0)),
    assignees: payload.assignees && payload.assignees.length ? payload.assignees.slice() : ["RM"],
    done: false,
  };
  tasks.push(task);
  return task;
}

/** Split a 0–100 percentage into N lit segments (used by the file progress bar). */
function progressSegments(progress, count) {
  const lit = Math.round((Math.max(0, Math.min(100, progress)) / 100) * count);
  return Array.from({ length: count }, (_, i) => i < lit);
}

/* ------------------------------ files ------------------------------ */

function filterFiles(files, group) {
  if (!group || group === "All Files") return (files || []).slice();
  return (files || []).filter((f) => f.group === group);
}

function storageTotal(storage) {
  return (storage || []).reduce((a, b) => a + b.gb, 0);
}

/** Percentage width for every storage slice, plus the used/total label. */
function storageSegments(storage, total) {
  const sum = total || storageTotal(storage);
  return (storage || []).map((s) => ({
    id: s.id,
    name: s.name,
    color: s.color,
    gb: s.gb,
    pct: sum ? ((s.gb / sum) * 100).toFixed(1) : "0.0",
  }));
}

/* ------------------------------ goals ------------------------------ */

function filterGoals(goals, tab) {
  if (!tab || tab === "All Goals") return (goals || []).slice();
  return (goals || []).filter((g) => g.tag === tab);
}

/** Progress shown for a goal on the given week (W1 trails, W3 leads). */
function goalValueForWeek(goal, week) {
  const w = week || "W2";
  const base = Number(goal.value) || 0;
  if (w === "W1") return Math.round(base * 0.86);
  if (w === "W3") return Math.min(100, base + 6);
  return base;
}

function goalMetricForWeek(goal, week) {
  const w = week || "W2";
  const metric = String(goal.metric || "");
  return metric.replace(/^W\d\s+/, `${w} `);
}

function goalSeries(goal, week) {
  const weeks = goal.weeks || {};
  return weeks[week] || weeks.W1 || weeks.W2 || [];
}

/** Recount active goals per pillar. */
function pillarTotals(pillars, goals) {
  const count = {};
  (goals || []).forEach((g) => {
    count[g.tag] = (count[g.tag] || 0) + 1;
  });
  return (pillars || []).map((p) => ({
    ...p,
    count: count[p.name] ?? p.count,
    sub: `${count[p.name] ?? p.count} active goal${(count[p.name] ?? p.count) === 1 ? "" : "s"}`,
  }));
}

/* ------------------------------ misc ------------------------------ */

function greetingFor(date) {
  const d = date && typeof date.getHours === "function" ? date : new Date();
  const h = d.getHours();
  if (h < 12) return "Good morning";
  if (h < 18) return "Good afternoon";
  return "Good evening";
}

function stripMarkdown(text) {
  return String(text || "").replace(/\*\*/g, "").replace(/`/g, "");
}

function clampPercent(n) {
  return Math.max(0, Math.min(100, Math.round(Number(n) || 0)));
}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const VIEWS = {};
const ROUTES = ["chat", "goals", "calendar", "tasks", "memory", "files"];

const viewEl = $("#view");
const layerEl = $("#layer");
const appEl = $("#app");

/* ------------------------------- theme ------------------------------- */

const media = window.matchMedia("(prefers-color-scheme: dark)");

function applyTheme() {
  const resolved = state.theme === "system" ? (media.matches ? "dark" : "light") : state.theme;
  document.documentElement.setAttribute("data-theme", resolved);
  document.documentElement.setAttribute("data-theme-opt", state.theme);
  $$(".theme-btn").forEach((b) => b.classList.toggle("is-active", b.dataset.themeOpt === state.theme));
}

media.addEventListener("change", () => {
  if (state.theme === "system") applyTheme();
});

/* ------------------------------- routing ------------------------------- */

function currentRoute() {
  const hash = (location.hash || "").replace(/^#\/?/, "").split("?")[0];
  return ROUTES.includes(hash) ? hash : "chat";
}

function go(route, opts = {}) {
  if (route === state.route && !opts.force) {
    render();
    return;
  }
  state.prevRoute = state.route;
  state.route = route;
  if (opts.replace) location.replace(`#/${route}`);
  else location.hash = `#/${route}`;
  if (!opts.silent) render();
}

function render() {
  const fn = VIEWS[state.route] || VIEWS.chat;
  viewEl.innerHTML = fn();
  viewEl.scrollTop = 0;
  renderNav();
  renderTopbar();
  if (state.route === "chat" && typeof bindChat === "function") bindChat();
  if (state.route === "goals" && typeof bindGoals === "function") bindGoals();
  if (state.route === "files" && typeof bindFiles === "function") bindFiles();
  if (state.route === "tasks" && typeof bindTasks === "function") bindTasks();
  persist();
}

/* ------------------------------- sidebar ------------------------------- */

    const active = state.route === item.id;

function renderTopbar() {

/* ------------------------------- toasts ------------------------------- */

function toast(message, icon = "check") {
  const host = $("#toasts");

/* ------------------------------- overlays ------------------------------- */

let layerCleanup = null;
let suppressNextClick = false;

function closeLayer() {
  layerEl.hidden = true;
  layerEl.className = "layer";
  layerEl.innerHTML = "";
  layerEl.dataset.menu = "";
  document.removeEventListener("keydown", layerKeyHandler, true);
  if (layerCleanup) {
    layerCleanup();
    layerCleanup = null;
  }
}

/* Backdrop click closes whatever overlay is open — and must not also trigger
   the element underneath, hence the one-shot click suppression. */
layerEl.addEventListener("mousedown", (e) => {
  if (e.target === layerEl) {
    suppressNextClick = true;
    closeLayer();
  }
});

document.addEventListener(
  "click",
  (e) => {
    if (!suppressNextClick) return;
    suppressNextClick = false;
    e.preventDefault();
    e.stopPropagation();
  },
  true
);

function layerKeyHandler(e) {
  if (e.key === "Escape") {
    e.stopPropagation();
    closeLayer();
  }
}

function openLayer(html, opts = {}) {
  closeLayer();
  layerEl.hidden = false;
  layerEl.className = opts.plain ? "layer layer-plain" : "layer";
  layerEl.innerHTML = html;
  layerEl.dataset.menu = opts.name || "";
  document.addEventListener("keydown", layerKeyHandler, true);
  if (opts.onClose) layerCleanup = opts.onClose;
  if (opts.focus) {
    const f = layerEl.querySelector(opts.focus);
    if (f) setTimeout(() => f.focus(), 30);
  }
  return layerEl;
}

/** Dropdown menu anchored to an element. */
function openMenu(anchor, items, opts = {}) {
  const rect = anchor.getBoundingClientRect();
  const menu = document.createElement("div");
  menu.className = "menu";
  menu.innerHTML = items
    .map((it) => {
      if (it.type === "sep") return '<div class="menu-sep"></div>';
      if (it.type === "label") return `<div class="menu-label">${esc(it.label)}</div>`;
      return `<button class="menu-item ${it.danger ? "is-danger" : ""}" data-menu-id="${it.id}">
        ${it.icon ? ic(it.icon, 15) : ""}
        <span>${esc(it.label)}</span>
        ${it.kbd ? `<span class="kbd">${esc(it.kbd)}</span>` : ""}
        ${it.checked ? ic("check", 14) : ""}
      </button>`;
    })
    .join("");

  openLayer("", { plain: true, name: opts.name || "menu" });
  layerEl.appendChild(menu);

  const mw = Math.max(menu.offsetWidth, 190);
  let left = opts.align === "right" ? rect.right - mw : rect.left;
  left = Math.max(10, Math.min(left, window.innerWidth - mw - 10));
  let top = rect.bottom + 6;
  if (top + menu.offsetHeight > window.innerHeight - 10) top = Math.max(10, rect.top - menu.offsetHeight - 6);
  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;

  menu.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-menu-id]");
    if (!btn) return;
    closeLayer();
    const item = items.find((i) => i.id === btn.dataset.menuId);
    if (item && item.onSelect) item.onSelect();
  });
  return menu;
}

/** Centered modal dialog. */
function openModal({ title, body, footer, onMount, width }) {
  openLayer(
    `<div class="modal" ${width ? `style="width:min(${width}px, calc(100vw - 32px))"` : ""} role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button class="icon-btn" data-act="close-layer" aria-label="Close">${ic("close", 16)}</button>
      </div>
      <div class="modal-body">${body}</div>
      ${footer ? `<div class="modal-foot">${footer}</div>` : ""}
    </div>`,
    { name: "modal", focus: "[data-autofocus]" }
  );
  if (onMount) onMount(layerEl);
  return layerEl;
}

let cmdkIndex = 0;
let cmdkResults = [];

function openCmdk(initial = "") {
  const idx = searchIndex();
  openLayer(
    `<div class="cmdk" role="dialog" aria-label="Command palette">
      <div class="cmdk-input">
        ${ic("search", 16)}
        <input id="cmdkInput" placeholder="Search pages, files, tasks, goals…" value="${esc(initial)}" autocomplete="off" spellcheck="false" />
        <span class="kbd">esc</span>
      </div>
      <div class="cmdk-results" id="cmdkResults"></div>
    </div>`,
    { name: "cmdk", focus: "#cmdkInput" }
  );

  const input = $("#cmdkInput");
  const results = $("#cmdkResults");

  const paint = (q) => {
    const needle = q.trim().toLowerCase();
    cmdkResults = needle
      ? idx.filter((i) => i.label.toLowerCase().includes(needle))
      : idx.slice(0, 12);
    cmdkIndex = 0;
    if (!cmdkResults.length) {
      results.innerHTML = '<div class="cmdk-empty">No matches. Try a different keyword.</div>';
      return;
    }
    let html = "";
    let group = null;
    cmdkResults.forEach((r, i) => {
      if (r.group !== group) {
        group = r.group;
        html += `<div class="cmdk-group">${esc(group)}</div>`;
      }
      html += `<button class="cmdk-item ${i === 0 ? "is-sel" : ""}" data-cmdk="${i}">${ic(r.icon, 15)}<span>${esc(r.label)}</span></button>`;
    });
    results.innerHTML = html;
  };

  paint(initial);

  input.addEventListener("input", () => paint(input.value));

  results.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-cmdk]");
    if (!btn) return;
    const item = cmdkResults[Number(btn.dataset.cmdk)];
    closeLayer();
    if (item) item.run();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      cmdkIndex = (cmdkIndex + (e.key === "ArrowDown" ? 1 : -1) + cmdkResults.length) % cmdkResults.length;
      $$(".cmdk-item", results).forEach((el, i) => el.classList.toggle("is-sel", i === cmdkIndex));
    } else if (e.key === "Enter") {
      e.preventDefault();
      const item = cmdkResults[cmdkIndex];
      closeLayer();
      if (item) item.run();
    }
  });
}

/* ----------------------------- streaming ----------------------------- */

const STREAM_STAGES = [
  "Thinking about it…",
  "Searching your memory…",
  "Checking goals & files…",
  "Drafting a response…",
];

let streamToken = 0;

function replyFor(prompt) {
  return pickReply(prompt, CHAT_REPLIES) || CHAT_DEFAULT;
}

function sleep(ms) {
  return new Promise((r) => setTimeout(r, ms));
}

async function streamMessage(idx, text) {
  const token = ++streamToken;
  const msg = state.chat.messages[idx];
  const statusEl = $("#streamStatus span");
  const bubble = $(`#bubble-${idx}`);
  if (!bubble) return;

  msg.status = STREAM_STAGES[0];
  if (statusEl) statusEl.textContent = msg.status;

  for (let i = 1; i < STREAM_STAGES.length; i++) {
    await sleep(340);
    if (token !== streamToken) return;
    msg.status = STREAM_STAGES[i];
    const s = $("#streamStatus span");
    if (s) s.textContent = msg.status;
  }

  await sleep(280);
  if (token !== streamToken) return;

  const statusPill = $("#streamStatus");
  if (statusPill) statusPill.remove();

  if (state.settings.streaming) {
    // Append-only text node + a caret: far cheaper than re-writing innerHTML
    // on every chunk, and the scroll only follows every few chunks.
    const span = document.createElement("span");
    const caret = document.createElement("span");
    caret.className = "caret";
    bubble.textContent = "";
    bubble.appendChild(span);
    bubble.appendChild(caret);
    let i = 0;
    const chunk = 3;
    let tick = 0;
    while (i < text.length) {
      if (token !== streamToken) return;
      i = Math.min(text.length, i + chunk);
      span.textContent = text.slice(0, i);
      if (++tick % 6 === 0) bubble.scrollIntoView({ block: "end" });
      await sleep(9);
    }
    bubble.scrollIntoView({ block: "end" });
    bubble.innerHTML = formatReply(text);
  } else {
    await sleep(220);
    bubble.innerHTML = formatReply(text);
  }

  msg.text = text;
  msg.html = formatReply(text);
  msg.done = true;
  msg.status = "";
  refreshMessage(idx);
}

function refreshMessage(idx) {
  const host = $("#chatThread");
  if (!host) return;
  host.innerHTML = state.chat.messages.map(messageHtml).join("");
  const last = host.querySelector(`[data-idx="${idx}"]`);
  if (last) last.scrollIntoView({ block: "end" });
}

/* ----------------------------- interactions ----------------------------- */

function scrollThreadToEnd() {
  const thread = $("#chatThread");
  if (thread) thread.scrollIntoView({ block: "end" });
}

function bindChat() {
  const ta = $("#chatInput");
  if (!ta) return;

  const grow = () => {
    ta.style.height = "auto";
    ta.style.height = `${Math.min(ta.scrollHeight, 190)}px`;
  };
  ta.addEventListener("input", grow);
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendChat();
    }
  });
  requestAnimationFrame(grow);

  if (!state.chat.messages.length) setTimeout(() => ta.focus(), 80);
}

function sendChat(text) {
  const ta = $("#chatInput");
  const prompt = (text ?? (ta ? ta.value : "")).trim();
  if (!prompt || state.chat.busy) return;

  if (ta) {
    ta.value = "";
    ta.style.height = "auto";
  }
  state.chat.busy = true;

  state.chat.messages.push({ role: "user", text: prompt });
  const aiIndex = state.chat.messages.length;
  state.chat.messages.push({ role: "ai", text: "", html: "", done: false, status: STREAM_STAGES[0] });

  render();
  requestAnimationFrame(() => {
    scrollThreadToEnd();
    streamMessage(aiIndex, replyFor(prompt)).then(() => {
      state.chat.busy = false;
      persist();
    });
  });
}

function startVoice() {
  const btn = $("#btnMic");
  const ta = $("#chatInput");
  if (!btn || !ta) return;
  if (btn.classList.contains("is-rec")) {
    btn.classList.remove("is-rec");
    return;
  }
  btn.classList.add("is-rec");
  toast("Listening…", "mic");
  setTimeout(() => {
    btn.classList.remove("is-rec");
    ta.value = "Plan my week and summarise my open tasks";
    ta.dispatchEvent(new Event("input"));
    ta.focus();
    toast("Transcribed", "check");
  }, 1800);
}

/* ----------------------------- view-level events ----------------------------- */

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "send") {
    sendChat();
  } else if (act === "sug") {
    const label = el.dataset.label;
    const prompt = CHAT_REPLIES[label] ? label : `${label} — help me plan this`;
    sendChat(prompt);
  } else if (act === "more-ideas") {
    state.showExtraIdeas = !state.showExtraIdeas;
    render();
  } else if (act === "mic") {
    startVoice();
  } else if (act === "attach-menu") {
    e.stopPropagation();
    attachMenu(el);
  } else if (act === "attach-file") {
    $("#filePicker").click();
  } else if (act === "detach") {
    state.chat.attachments = state.chat.attachments.filter((a) => a.id !== el.dataset.id);
    render();
  } else if (act === "copy") {
    const m = state.chat.messages[Number(el.dataset.idx)];
    if (m) {
      if (navigator.clipboard) navigator.clipboard.writeText(m.text).catch(() => {});
      toast("Copied to clipboard", "copy");
    }
  } else if (act === "like") {
    const m = state.chat.messages[Number(el.dataset.idx)];
    if (m) {
      m.liked = !m.liked;
      el.classList.toggle("is-on", m.liked);
      toast(m.liked ? "Thanks — noted for future answers" : "Feedback removed", "thumbsUp");
    }
  } else if (act === "regen") {
    const idx = Number(el.dataset.idx);
    const prev = state.chat.messages.slice(0, idx).reverse().find((m) => m.role === "user");
    if (!prev) return;
    state.chat.messages[idx] = { role: "ai", text: "", html: "", done: false, status: STREAM_STAGES[0] };
    render();
    requestAnimationFrame(() => streamMessage(idx, replyFor(prev.text)));
  }
});

document.addEventListener("change", (e) => {
  if (e.target.id === "filePicker" && e.target.files.length) {
    Array.from(e.target.files).forEach((f) => {
      state.chat.attachments.push({
        id: `up-${f.name}-${f.size}`,
        name: f.name,
        icon: f.type.startsWith("image/") ? "image" : "file",
      });
    });
    toast(`${e.target.files.length} file(s) attached`, "paperclip");
    e.target.value = "";
    render();
  }
});

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "goal-tab") {
    state.goalTab = el.dataset.tab;
    render();
  } else if (act === "toggle-board") {
    state.goalView = state.goalView === "board" ? "targets" : "board";
    render();
  } else if (act === "week") {
    e.stopPropagation();
    state.goalWeek[el.dataset.id] = el.dataset.week;
    render();
  } else if (act === "goal-detail") {
    openGoalDetail(el.dataset.id);
  } else if (act === "vision-detail") {
    openVisionDetail(el.dataset.id);
  } else if (act === "new-goal") {
    openGoalModal();
  } else if (act === "create-goal") {
    const name = ($("#gName") || {}).value || "";
    if (!name.trim()) {
      toast("Give your goal a name first", "bulb");
      return;
    }
    const pillar = ($("#gPillar") || {}).value || "Health";
    const target = Number(($("#gTarget") || {}).value || 60);
    const metric = (($("#gMetric") || {}).value || "Weekly progress").trim();
    const id = `g${Date.now()}`;
    const weeks = { W1: [20, 26, 24, 32, 38], W2: [26, 34, 30, 40, 46], W3: [34, 42, 38, 48, 56] };
    state.goals.push({
      id,
      name: name.trim(),
      pillar: `${pillar.toUpperCase()} PILLAR`,
      tag: pillar,
      icon: pillar === "Health" ? "heart" : pillar === "Career" ? "briefcase" : "trending",
      value: target,
      metric,
      weeks,
      accent: "#7c5cf0",
      locked: false,
    });
    state.pillars = pillarTotals(state.pillars, state.goals);
    closeLayer();
    state.goalTab = "All Goals";
    render();
    toast(`Goal “${name.trim()}” created`, "check");
  } else if (act === "goal-bump") {
    const g = state.goals.find((x) => x.id === el.dataset.id);
    if (g) {
      g.value = Math.min(100, g.value + 5);
      closeLayer();
      render();
      toast(`${g.name} is now ${g.value}%`, "trending");
    }
  } else if (act === "vision-status") {
    const v = state.vision.find((x) => x.id === el.dataset.id);
    if (v) {
      v.status = el.dataset.status;
      v.statusTone = v.status === "Completed" ? "green" : v.status === "Planned" ? "sky" : "violet";
      closeLayer();
      render();
      toast(`“${v.title}” is now ${v.status}`, "check");
    }
  } else if (act === "vision-to-task") {
    const v = state.vision.find((x) => x.id === el.dataset.id);
    if (v) {
      state.tasks.unshift({
        id: `t${Date.now()}`,
        col: "todo",
        title: v.title,
        desc: v.desc,
        tags: [{ t: v.pillar, c: "violet" }],
        date: "Feb 18",
        comments: 0,
        links: 0,
        progress: 0,
        assignees: ["RM"],
      });
      closeLayer();
      toast("Task created from vision", "tasks");
      go("tasks");
    }
  } else if (act === "pillar-filter") {
    const p = state.pillars.find((x) => x.id === el.dataset.id);
    if (p) {
      state.goalTab = p.name === "Health" || p.name === "Career" || p.name === "Growth" ? p.name : "All Goals";
      state.goalView = "targets";
      render();
    }
  }
});

/* Generic streaming helper shared by Files / Tasks overlays. */
async function streamInto(el, text, stages = ["Thinking…", "Reading your workspace…", "Drafting…"]) {
  let i = 0;
  while (i < stages.length) {
    el.innerHTML = `<span class="stream-status">${ic("sparkle2", 12)}<span>${esc(stages[i])}</span></span>`;
    await sleep(420);
    i += 1;
  }
  const stage = `<span class="stream-status">${ic("sparkle2", 12)}<span>${esc(stages[stages.length - 1])}</span></span>`;
  el.innerHTML = stage;
  const span = document.createElement("span");
  const caret = document.createElement("span");
  caret.className = "caret";
  el.appendChild(span);
  el.appendChild(caret);
  let p = 0;
  while (p < text.length) {
    p = Math.min(text.length, p + 3);
    span.textContent = text.slice(0, p);
    await sleep(9);
  }
  el.innerHTML = formatReply(text);
}

/* ------------------------------- drag & drop ------------------------------- */

let dragId = null;

function bindTasks() {
  const qe = $("#quickEntry");
  if (qe) {
    qe.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && qe.value.trim()) {
        e.preventDefault();
        openQuickEntry(qe.value.trim());
      }
    });
  }

  const kanban = $("#kanban");
  if (!kanban) return;

  kanban.addEventListener("dragstart", (e) => {
    const card = e.target.closest("[data-task]");
    if (!card) return;
    dragId = card.dataset.task;
    card.classList.add("is-dragging");
    e.dataTransfer.effectAllowed = "move";
    try {
      e.dataTransfer.setData("text/plain", dragId);
    } catch (err) {
      /* Safari guard */
    }
  });

  kanban.addEventListener("dragend", (e) => {
    const card = e.target.closest("[data-task]");
    if (card) card.classList.remove("is-dragging");
    $$(".kcol").forEach((c) => c.classList.remove("is-over"));
    dragId = null;
  });

  kanban.addEventListener("dragover", (e) => {
    const col = e.target.closest(".kcol");
    if (!col) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    $$(".kcol").forEach((c) => c.classList.toggle("is-over", c === col));
  });

  kanban.addEventListener("dragleave", (e) => {
    const col = e.target.closest(".kcol");
    if (col && !col.contains(e.relatedTarget)) col.classList.remove("is-over");
  });

  kanban.addEventListener("drop", (e) => {
    const col = e.target.closest(".kcol");
    if (!col || !dragId) return;
    e.preventDefault();
    $$(".kcol").forEach((c) => c.classList.remove("is-over"));
    const task = state.tasks.find((x) => x.id === dragId);
    if (task && task.col !== col.dataset.col) {
      task.col = col.dataset.col;
      const name = TASK_COLUMNS.find((c) => c.id === col.dataset.col).name;
      render();
      toast(`Moved to ${name}`, "check");
    }
  });
}

document.addEventListener("click", (e) => {

  if (!el) return;
  const act = el.dataset.act;

  if (act === "task-view") {
    state.taskView = el.dataset.view;
    render();
  } else if (act === "new-task") {
    openTaskModal();
  } else if (act === "col-add") {
    openTaskModal(el.dataset.col);
  } else if (act === "col-menu") {
    const col = TASK_COLUMNS.find((c) => c.id === el.dataset.col);
    openMenu(
      el,
      [
        { id: "sort", label: "Sort by due date", icon: "filter", onSelect: () => toast(`Sorted ${col.name} by due date`, "filter") },
        { id: "priority", label: "Sort by priority", icon: "trending", onSelect: () => toast(`Sorted ${col.name} by priority`, "trending") },
        { type: "sep" },
        { id: "collapse", label: "Collapse column", icon: "chevronUp", onSelect: () => toast("Column collapsed (demo)", "chevronUp") },
        { id: "clear", label: "Clear completed", icon: "archive", danger: true, onSelect: () => toast("Completed tasks cleared (demo)", "archive") },
      ],
      { align: "right" }
    );
  } else if (act === "task-open") {
    openTaskDetail(el.dataset.id);
  } else if (act === "task-toggle") {
    e.stopPropagation();
    const t = state.tasks.find((x) => x.id === el.dataset.id);
    if (t) {
      t.done = !t.done;
      render();
      toast(t.done ? "Marked as done" : "Marked as not done", "check");
    }
  } else if (act === "create-task") {
    const title = ($("#tTitle") || {}).value || "";
    if (!title.trim()) {
      toast("Give the task a title first", "bulb");
      return;
    }
    const tags = $$("#tTags .pick.is-on").map((p) => ({ t: p.dataset.tag, c: p.dataset.tone }));
    const t = {
      id: `t${Date.now()}`,
      col: ($("#tCol") || {}).value || "todo",
      title: title.trim(),
      desc: (($("#tDesc") || {}).value || "").trim(),
      tags,
      date: "Feb 18",
      comments: 0,
      links: 0,
      progress: Number(($("#tProgress") || {}).value || 0),
      assignees: ["RM"],
      done: false,
    };
    state.tasks.push(t);
    closeLayer();
    state.taskView = "kanban";
    render();
    toast(`Task “${t.title}” created`, "check");
  } else if (act === "task-save") {
    const t = state.tasks.find((x) => x.id === el.dataset.id);
    if (t) {
      const slider = $("#dProg");
      if (slider) t.progress = Number(slider.value);
      closeLayer();
      render();
      toast("Task updated", "check");
    }
  } else if (act === "task-delete") {
    state.tasks = state.tasks.filter((x) => x.id !== el.dataset.id);
    closeLayer();
    render();
    toast("Task deleted", "archive");
  } else if (act === "qe-create") {
    state.tasks.unshift({
      id: `t${Date.now()}`,
      col: "todo",
      title: el.dataset.text.split(/[,.]\s/)[0] || el.dataset.text,
      desc: "Created with AI Quick Entry.",
      tags: [{ t: "Deep Work", c: "rose" }],
      date: "Feb 18",
      comments: 0,
      links: 0,
      progress: 0,
      assignees: ["RM"],
      done: false,
    });
    closeLayer();
    state.taskView = "kanban";
    render();
    toast("Task created from AI Quick Entry", "check");
  }
});

bindTasks = function () {

  bindTasksStatic();

/* ===== extra.js ===== */
/* ==========================================================================
   Hearth — Calendar & Memory views

const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const WEEKDAYS = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];

function renderCalendar() {
  const year = 2026;
  const month = 1; /* February */
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7; /* Monday-first */
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];

  for (let i = 0; i < startOffset; i++) {
    const d = new Date(year, month - 1, 31 - (startOffset - 1 - i));
    cells.push({ day: d.getDate(), out: true });
  }
  for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, out: false });
  while (cells.length % 7 !== 0) cells.push({ day: cells.length - daysInMonth - startOffset + 1, out: true });

  return `
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">Calendar</h1>
        <p class="page-sub">February 2026 · ${state.calEvents ? state.calEvents.length : CAL_EVENTS.length} events. Click a day to add an event.</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-ghost btn-sm" data-act="cal-prev">${ic("chevronLeft", 14)} Prev</button>
        <button class="btn btn-ghost btn-sm" data-act="cal-today">Today</button>
        <button class="btn btn-ghost btn-sm" data-act="cal-next">Next ${ic("chevronRight", 14)}</button>
        <button class="btn btn-dark" data-act="new-event">${ic("plus", 14)} New Event</button>
      </div>
    </div>

    <div class="goals-cols">
      <div class="panel">
        <div class="cal-grid" style="margin-bottom:6px">
          ${WEEKDAYS.map((w) => `<div class="cal-head">${w}</div>`).join("")}
        </div>
        <div class="cal-grid">
          ${cells
            .map((c) => {
              const evs = CAL_EVENTS.filter((e) => !c.out && e.day === c.day);
              const today = !c.out && c.day === 18;
              return `<div class="cal-cell ${c.out ? "is-out" : ""} ${today ? "is-today" : ""}" data-act="cal-day" data-day="${c.day}" ${c.out ? 'data-out="1"' : ""}>
                <b>${c.day}</b>
                ${evs.map((e) => `<div class="cal-ev">${esc(e.title)}</div>`).join("")}
              </div>`;
            })
            .join("")}
        </div>
      </div>

      <aside>
        <h2 class="section-title">${ic("clock", 16)} Upcoming</h2>
        <div class="panel">
          ${CAL_EVENTS.slice()
            .sort((a, b) => a.day - b.day)
            .map(
              (e) => `<div class="setting-row">
                <div class="sr-txt"><b>${esc(e.title)}</b><span>Feb ${e.day} · ${e.day % 2 ? "09:30" : "14:00"}</span></div>
                <button class="icon-btn" data-act="cal-edit" data-title="${esc(e.title)}" aria-label="Edit">${ic("dotsV", 14)}</button>
              </div>`
            )
            .join("")}
        </div>
        <h2 class="section-title" style="margin-top:18px">${ic("link", 16)} Linked goals</h2>
        <div class="panel">
          ${state.goals
            .map(
              (g) => `<div class="setting-row"><div class="sr-txt"><b>${esc(g.name)}</b><span>${g.value}% complete</span></div>
                <span class="tag tag-violet">${esc(g.tag)}</span></div>`
            )
            .join("")}
        </div>
      </aside>
    </div>
  </div>`;
}

function renderMemory() {
  return `
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">Memory</h1>
        <p class="page-sub">Everything Hearth remembers about you. Review, edit or forget any entry.</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" data-act="mem-search">${ic("search", 14)} Search</button>
        <button class="btn btn-dark" data-act="new-memory">${ic("plus", 14)} New Memory</button>
      </div>
    </div>

    <div class="mem-list">
      ${MEMORIES.map(
        (m) => `<article class="mem-card" data-act="mem-open" data-id="${m.id}" tabindex="0" role="button">
          <h4>${esc(m.title)}</h4>
          <p>${esc(m.body)}</p>
          <div class="mem-foot">
            ${m.tags.map((t) => `<span class="tag">#${esc(t)}</span>`).join(" ")}
            <span style="margin-left:auto">${esc(m.date)}</span>
          </div>
        </article>`
      ).join("")}
    </div>

    <section style="margin-top:24px">
      <h2 class="section-title">${ic("pulse", 16)} Captured this week</h2>
      <div class="panel">
        ${["Preferred a 90-minute deep-work block before noon.", "Mentioned budget for the NYC move is $4,200/month.", "Asked for a weekly fitness summary every Sunday.", "Wants invoices auto-matched to the Q3 expense report."]
          .map((t) => `<div class="setting-row"><div class="sr-txt"><b style="font-weight:500;font-size:12px">${esc(t)}</b></div><span class="tag tag-green">auto</span></div>`)
          .join("")}
      </div>
    </section>
  </div>`;
}

/* ------------------------------- modals ------------------------------- */

function openEventModal() {
  openModal({
    title: "New Event",
    body: `
      <div class="field"><label for="eTitle">Title</label>
        <input class="input" id="eTitle" data-autofocus placeholder="e.g. Strategy review" /></div>
      <div class="field-row">
        <div class="field"><label for="eDate">Date</label><input class="input" id="eDate" type="date" value="2026-02-18" /></div>
        <div class="field"><label for="eTime">Time</label><input class="input" id="eTime" type="time" value="09:30" /></div>
      </div>
      <div class="field"><label for="eNote">Notes</label><textarea class="textarea" id="eNote" placeholder="Agenda, links…"></textarea></div>`,
    footer: `<button class="btn btn-ghost" data-act="close-layer">Cancel</button>
             <button class="btn btn-dark" data-act="create-event">Create event</button>`,
  });
}

function openNoteModal() {
  openModal({
    title: "New Note",
    body: `<div class="field"><label for="nTitle">Title</label><input class="input" id="nTitle" data-autofocus placeholder="Untitled note" /></div>
      <div class="field"><label for="nBody">Note</label><textarea class="textarea" id="nBody" style="min-height:140px" placeholder="Write anything…"></textarea></div>`,
    footer: `<button class="btn btn-ghost" data-act="close-layer">Cancel</button>
             <button class="btn btn-dark" data-act="create-note">Save note</button>`,
  });
}

function openMemoryModal() {
  openModal({
    title: "New Memory",
    body: `<div class="field"><label for="mTitle">Title</label><input class="input" id="mTitle" data-autofocus placeholder="What should Hearth remember?" /></div>
      <div class="field"><label for="mBody">Detail</label><textarea class="textarea" id="mBody" placeholder="Add context so it stays useful…"></textarea></div>`,
    footer: `<button class="btn btn-ghost" data-act="close-layer">Cancel</button>
             <button class="btn btn-dark" data-act="create-memory">Remember</button>`,
  });
}

/* ------------------------------- events ------------------------------- */

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "new-event") {
    openEventModal();
  } else if (act === "create-event") {
    const t = ($("#eTitle") || {}).value || "";
    if (!t.trim()) {
      toast("Give the event a title", "bulb");
      return;
    }
    const d = ($("#eDate") || {}).value || "2026-02-18";
    const day = Number(d.split("-")[2] || 18);
    CAL_EVENTS.push({ day, title: t.trim() });
    closeLayer();
    render();
    toast(`Event added on Feb ${day}`, "calendarPlus");
  } else if (act === "cal-day") {
    if (el.dataset.out) return;
    openEventModal();
  } else if (act === "cal-edit") {
    openMenu(
      el,
      [
        { id: "edit", label: "Edit event", icon: "file", onSelect: () => toast("Editing is not connected to a backend yet", "bulb") },
        { id: "delete", label: "Delete event", icon: "archive", danger: true, onSelect: () => toast("Event deleted (demo)", "archive") },
      ],
      { align: "right" }
    );
  } else if (act === "cal-prev" || act === "cal-next" || act === "cal-today") {
    toast(act === "cal-today" ? "Jumped to today" : "Month navigation is a demo placeholder", "calendar");
  } else if (act === "new-memory") {
    openMemoryModal();
  } else if (act === "create-memory") {
    const t = ($("#mTitle") || {}).value || "";
    if (!t.trim()) {
      toast("Add a title first", "bulb");
      return;
    }
    MEMORIES.unshift({
      id: `m${Date.now()}`,
      title: t.trim(),
      body: (($("#mBody") || {}).value || "Saved manually.").trim(),
      tags: ["manual"],
      date: "Updated just now",
    });
    closeLayer();
    render();
    toast("Memory saved", "brain");
  } else if (act === "mem-open") {
    const m = MEMORIES.find((x) => x.id === el.dataset.id);
    if (!m) return;
    openModal({
      title: m.title,
      body: `<p style="font-size:12.5px;line-height:1.75;color:var(--ink-2);margin:0 0 14px">${esc(m.body)}</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${m.tags.map((t) => `<span class="tag">#${esc(t)}</span>`).join("")}</div>`,
      footer: `<button class="btn btn-ghost" data-act="close-layer">Close</button>
               <button class="btn btn-soft" data-act="mem-forget" data-id="${m.id}">Forget</button>`,
    });
  } else if (act === "mem-forget") {
    const idx = MEMORIES.findIndex((x) => x.id === el.dataset.id);
    if (idx >= 0) MEMORIES.splice(idx, 1);
    closeLayer();
    render();
    toast("Memory forgotten", "archive");
  } else if (act === "mem-search") {
    openCmdk("memory");
  } else if (act === "new-note") {
    openNoteModal();
  } else if (act === "create-note") {
    const t = ($("#nTitle") || {}).value || "Untitled note";
    state.recent.unshift({
      id: `n${Date.now()}`,
      name: `${t}.md`,
      type: "Note",
      size: `${(($("#nBody") || {}).value || "").length} chars`,
      modified: "Just now",
      icon: "file",
      tone: "violet",
    });
    closeLayer();
    go("files");
    toast("Note saved to your files", "file");
  }
});
