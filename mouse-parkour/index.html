<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e18">
<title>鼠族跑酷 · MOUSE RUSH</title>
<style>/* =====================================================================
 * 鼠族跑酷 · MOUSE RUSH — 样式（style.css）
 * 深色霓虹 + 玻璃拟态；动画只用 transform / opacity
 * 竖屏 / 横屏 / 强制旋转 三态：body[data-orient] + #app.force-* + @media
 * ===================================================================== */

/* ---------------- 1. 变量与重置 ---------------- */
:root {
  --bg: #0b0e18;
  --cyan: #35e0c8;
  --magenta: #ff4d8d;
  --yellow: #ffd23f;
  --blue: #6ec8ff;
  --text: #e9eefb;
  --dim: #97a3bd;
  --glass-bg: rgba(15, 21, 36, 0.72);
  --glass-line: rgba(120, 220, 255, 0.20);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;

  /* HUD 尺寸变量：竖屏默认值 */
  --hud-score-fs: 34px;
  --hud-cap-fs: 11px;
  --hud-chip-fs: 13px;
  --hud-gap: 8px;
  --hud-pad: 10px;
  --toast-top: 116px;
  --panel-w: 460px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
}

body {
  font-family: var(--font);
  color: var(--text);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
  text-rendering: optimizeLegibility;
}

canvas, img { -webkit-user-drag: none; }
button, input, textarea, select { font-family: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

/* ---------------- 2. 布局根 ---------------- */
#app {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--bg);
  touch-action: none;
}

#stage {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}

#ui-root {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  overflow: hidden;
}

/* 强制旋转降级（JS 会设置 position/left/top/width/height 为交换后尺寸） */
#app.rotated {
  position: fixed;
  transform: rotate(90deg);
  transform-origin: center;
}

/* ---------------- 3. 屏幕容器 ---------------- */
.screen {
  position: absolute;
  inset: 0;
  display: none;
}
.screen.on { display: flex; }
.screen.center {
  align-items: center;
  justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-right, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 12px) calc(env(safe-area-inset-left, 0px) + 12px);
}
.screen.scroll-y { align-items: flex-start; justify-content: center; }

.veil {
  position: absolute;
  inset: 0;
  background: radial-gradient(120% 90% at 50% 0%, rgba(28, 44, 82, 0.55), rgba(4, 7, 14, 0.82));
  pointer-events: auto;
}

.glass {
  position: relative;
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--glass-line);
  border-radius: 20px;
  box-shadow: 0 0 30px rgba(53, 224, 200, 0.14), 0 20px 50px rgba(0, 0, 0, 0.5);
}

.panel-wrap {
  position: relative;
  width: 100%;
  max-width: var(--panel-w);
  max-height: 100%;
  display: flex;
  justify-content: center;
  pointer-events: none;
}
.panel {
  pointer-events: auto;
  width: 100%;
  max-height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 18px 16px 16px;
  animation: panelIn 0.26s cubic-bezier(0.22, 0.9, 0.3, 1) both;
}
.panel::-webkit-scrollbar { width: 4px; }
.panel::-webkit-scrollbar-thumb { background: rgba(120, 220, 255, 0.28); border-radius: 2px; }

@keyframes panelIn {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to   { opacity: 1; transform: none; }
}

.panel-tt {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.04em;
  margin-bottom: 12px;
  color: #fff;
  text-shadow: 0 0 14px rgba(53, 224, 200, 0.45);
}
.panel-en {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--dim);
}

/* ---------------- 4. 按钮 ---------------- */
.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}
.btn {
  flex: 1 1 120px;
  min-height: 48px;
  min-width: 44px;
  padding: 12px 16px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.04));
  color: var(--text);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.04em;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease, opacity 0.2s ease;
}
.btn:active { transform: scale(0.955); }
.btn.pri {
  border-color: transparent;
  background: linear-gradient(135deg, var(--cyan), #3fb4ff);
  color: #04211d;
  box-shadow: 0 0 20px rgba(53, 224, 200, 0.45);
}
.btn.pri:active { box-shadow: 0 0 30px rgba(53, 224, 200, 0.7); }
.btn.danger {
  border-color: rgba(255, 77, 141, 0.5);
  color: #ffd0e0;
  background: linear-gradient(180deg, rgba(255, 77, 141, 0.22), rgba(255, 77, 141, 0.08));
}
.btn.ghost { background: rgba(255, 255, 255, 0.04); color: var(--dim); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(255, 255, 255, 0.05);
  color: var(--dim);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  transition: transform 0.12s ease, box-shadow 0.2s ease, color 0.2s ease, background 0.2s ease;
}
.chip:active { transform: scale(0.95); }
.chip.on {
  color: #04211d;
  border-color: transparent;
  background: linear-gradient(135deg, var(--cyan), #3fb4ff);
  box-shadow: 0 0 16px rgba(53, 224, 200, 0.45);
}
.chip.danger { color: #ffc2d8; border-color: rgba(255, 77, 141, 0.45); }
.chip.danger.on { color: #2a0413; background: linear-gradient(135deg, var(--magenta), #ff9ec4); box-shadow: 0 0 16px rgba(255, 77, 141, 0.5); }

/* 滑杆 */
.rng {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 40px;
  min-height: 40px;
  background: transparent;
  pointer-events: auto;
  touch-action: manipulation;
}
.rng::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg, rgba(53, 224, 200, 0.65), rgba(255, 210, 63, 0.35));
}
.rng::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px;
  height: 22px;
  margin-top: -8px;
  border-radius: 50%;
  background: #eaf6ff;
  box-shadow: 0 0 12px rgba(53, 224, 200, 0.85);
}
.rng::-moz-range-track {
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg, rgba(53, 224, 200, 0.65), rgba(255, 210, 63, 0.35));
}
.rng::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 50%;
  background: #eaf6ff;
  box-shadow: 0 0 12px rgba(53, 224, 200, 0.85);
}

/* ---------------- 5. 主菜单 ---------------- */
.menu-wrap {
  position: relative;
  width: 100%;
  max-width: 440px;
  pointer-events: none;
}
.menu-card {
  pointer-events: auto;
  padding: 22px 18px 18px;
  text-align: center;
  animation: panelIn 0.3s cubic-bezier(0.22, 0.9, 0.3, 1) both;
}
.title-cn {
  font-size: 40px;
  font-weight: 900;
  letter-spacing: 0.1em;
  background: linear-gradient(180deg, #ffffff, var(--cyan));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 26px rgba(53, 224, 200, 0.35);
}
.title-en {
  margin-top: 2px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.42em;
  color: var(--magenta);
  text-shadow: 0 0 14px rgba(255, 77, 141, 0.5);
}
.title-sub {
  margin-top: 8px;
  font-size: 13px;
  color: var(--dim);
}
.title-keys {
  margin: 16px 0 4px;
  padding: 12px 10px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.07);
  text-align: left;
}
.krow {
  font-size: 12.5px;
  line-height: 1.9;
  color: var(--dim);
}
.krow b { color: var(--cyan); margin-right: 6px; }
.kbd {
  display: inline-block;
  min-width: 20px;
  padding: 1px 6px;
  margin: 0 1px;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.10);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: #fff;
  font-size: 11.5px;
  text-align: center;
}
.title-foot {
  margin-top: 12px;
  font-size: 11.5px;
  color: rgba(151, 163, 189, 0.75);
  letter-spacing: 0.04em;
}
.ui-hidden { display: none !important; }

/* ---------------- 6. HUD ---------------- */
.hud {
  flex-direction: column;
  gap: var(--hud-gap);
  padding: calc(env(safe-area-inset-top, 0px) + var(--hud-pad)) calc(env(safe-area-inset-right, 0px) + var(--hud-pad)) 0 calc(env(safe-area-inset-left, 0px) + var(--hud-pad));
  pointer-events: none;
}
.hud, .hud * { pointer-events: none; }
.hud button { pointer-events: auto; }

.hud-row { display: flex; align-items: flex-start; gap: var(--hud-gap); }
.hud-cap {
  font-size: var(--hud-cap-fs);
  letter-spacing: 0.24em;
  color: rgba(151, 163, 189, 0.85);
}
.hud-score {
  font-size: var(--hud-score-fs);
  font-weight: 900;
  line-height: 1.05;
  color: #fff;
  text-shadow: 0 0 18px rgba(53, 224, 200, 0.6), 0 2px 0 rgba(0, 0, 0, 0.35);
}
.hud-combo {
  align-self: center;
  margin-top: 8px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 800;
  color: #2a0413;
  background: linear-gradient(135deg, var(--magenta), #ff9ec4);
  box-shadow: 0 0 16px rgba(255, 77, 141, 0.6);
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 0.16s ease, transform 0.16s ease;
}
.hud-combo.on { opacity: 1; transform: scale(1); }
.hud-combo.bump { animation: comboBump 0.3s ease; }
@keyframes comboBump {
  0% { transform: scale(1); }
  40% { transform: scale(1.28); }
  100% { transform: scale(1); }
}

.hud-chips {
  margin-left: auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
}
.hchip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 9px;
  border-radius: 10px;
  background: rgba(10, 16, 30, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.10);
  font-size: var(--hud-chip-fs);
  font-weight: 700;
  color: #fff;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.hchip-life { color: var(--magenta); letter-spacing: 1px; }
.ic { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
.ic-coin { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.ic-cheese { background: #ffb347; box-shadow: 0 0 8px #ffb347; }
.ic-flag { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

.hud-row-2 { align-items: flex-end; }
.hud-bar-box {
  flex: 1 1 0;
  min-width: 96px;
  padding: 6px 9px;
  border-radius: 12px;
  background: rgba(10, 16, 30, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.09);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.hud-cap-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--hud-cap-fs);
  color: var(--dim);
  margin-bottom: 4px;
}
.hud-cap-row b { color: var(--cyan); font-size: 14px; letter-spacing: 0.06em; }
.hud-cap-row .pts { color: #fff; font-size: 12px; }

.bar {
  position: relative;
  height: 8px;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.10);
  overflow: hidden;
}
.bar > i {
  position: absolute;
  inset: 0;
  border-radius: 5px;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 0.18s ease-out;
}
#hud-style-fill { background: linear-gradient(90deg, var(--cyan), var(--blue)); }
#hud-energy-fill { background: linear-gradient(90deg, var(--yellow), var(--magenta)); }
.bar-energy.full > i { animation: energyPulse 0.9s ease-in-out infinite; }
@keyframes energyPulse {
  0%, 100% { opacity: 0.75; }
  50% { opacity: 1; }
}

.hud-biome {
  align-self: flex-end;
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 12px;
  color: var(--dim);
  background: rgba(10, 16, 30, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.08);
  white-space: nowrap;
}
/* 游戏速度指示：仅在非 1× 时亮起 */
.hud-speed {
  align-self: flex-end;
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 800;
  color: var(--cyan);
  background: rgba(10, 16, 30, 0.5);
  border: 1px solid rgba(53, 224, 200, 0.45);
  white-space: nowrap;
  display: none;
}
.hud-speed.on { display: block; }
.mega {
  margin-left: auto;
  min-height: 26px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid rgba(255, 210, 63, 0.6);
  background: linear-gradient(135deg, var(--yellow), #ff9a3f);
  color: #2b1a00;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  opacity: 0;
  transform: scale(0.8);
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.mega.on { opacity: 1; transform: scale(1); animation: megaGlow 1.1s ease-in-out infinite; }
@keyframes megaGlow {
  0%, 100% { box-shadow: 0 0 8px rgba(255, 210, 63, 0.5); }
  50% { box-shadow: 0 0 22px rgba(255, 210, 63, 0.95); }
}

.hud-buffs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
}
.buff {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border-radius: 10px;
  background: rgba(10, 16, 30, 0.55);
  border: 1px solid rgba(53, 224, 200, 0.25);
  font-size: 11.5px;
  color: #fff;
}
.buff-ic {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  flex: 0 0 auto;
  display: block;
}
.buff-ic.txt {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  color: #04211d;
  background: linear-gradient(135deg, var(--cyan), #3fb4ff);
}
.buff-bar {
  position: relative;
  width: 34px;
  height: 4px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.14);
  overflow: hidden;
}
.buff-bar > i {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform: scaleX(1);
  background: var(--cyan);
}
.buff-t { color: var(--dim); min-width: 22px; text-align: right; }

/* ---------------- 7. 触屏控件 ---------------- */
#touch-layer {
  position: absolute;
  inset: 0;
  display: none;
  pointer-events: none;
}
#touch-layer.on { display: block; }

#stick-zone {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 46%;
  height: 52%;
  pointer-events: auto;
  touch-action: none;
}
/* 摇杆底座：静止时停在「左下角拇指落点」，而不是热区正中。
   之前取 50%/50%（横屏时落在屏幕中左侧、视觉上压在角色和场景上），
   竖屏时又离拇指太远。触屏时底座会跟随手指，这里只是操作提示。 */
#stick-base {
  position: absolute;
  left: 84px;
  top: calc(100% - 88px);
  width: 132px;
  height: 132px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: rgba(120, 200, 255, 0.10);
  border: 1px solid rgba(120, 220, 255, 0.24);
  box-shadow: 0 0 24px rgba(53, 224, 200, 0.16);
  pointer-events: none;
}
#stick-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 34% 30%, #d6fff7, var(--cyan) 58%, #1b8f80);
  box-shadow: 0 0 18px rgba(53, 224, 200, 0.8);
  pointer-events: none;
}

#btn-jump, #btn-dash, #btn-slide {
  position: fixed;
  pointer-events: auto;
  touch-action: none;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  color: #04211d;
  font-weight: 900;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.2s ease, filter 0.2s ease;
}
#btn-jump {
  right: calc(env(safe-area-inset-right, 0px) + 18px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  width: 88px;
  height: 88px;
  border-radius: 44px;
  font-size: 19px;
  background: linear-gradient(135deg, var(--cyan), #3fb4ff);
  box-shadow: 0 0 22px rgba(53, 224, 200, 0.5);
}
#btn-dash {
  right: calc(env(safe-area-inset-right, 0px) + 116px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
  width: 78px;
  height: 52px;
  font-size: 15px;
  background: linear-gradient(135deg, var(--yellow), #ff9a3f);
  box-shadow: 0 0 18px rgba(255, 210, 63, 0.45);
}
#btn-slide {
  right: calc(env(safe-area-inset-right, 0px) + 24px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 118px);
  width: 78px;
  height: 52px;
  font-size: 15px;
  background: linear-gradient(135deg, var(--magenta), #ff9ec4);
  box-shadow: 0 0 18px rgba(255, 77, 141, 0.45);
}
#btn-jump:active, #btn-dash:active, #btn-slide:active {
  transform: scale(0.9);
  filter: brightness(1.25);
}
#btn-jump:active { box-shadow: 0 0 34px rgba(53, 224, 200, 0.95); }
#btn-dash:active { box-shadow: 0 0 30px rgba(255, 210, 63, 0.9); }
#btn-slide:active { box-shadow: 0 0 30px rgba(255, 77, 141, 0.9); }

/* ---------------- 8. 结算 / 结束 / 最高分 ---------------- */
.res-list { display: flex; flex-direction: column; gap: 6px; }
.res-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 11px;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid rgba(255, 255, 255, 0.06);
  font-size: 14px;
  color: var(--dim);
}
.res-row b { color: #fff; font-size: 16px; }
.res-row.total {
  background: linear-gradient(90deg, rgba(53, 224, 200, 0.16), rgba(255, 77, 141, 0.10));
  border-color: rgba(53, 224, 200, 0.34);
}
.res-row.total b { font-size: 22px; color: var(--yellow); }

.stars {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 6px 0 12px;
}
.star {
  font-size: 38px;
  line-height: 1;
  color: rgba(255, 255, 255, 0.14);
  transform: scale(0.5);
  opacity: 0;
}
.star.on {
  color: var(--yellow);
  opacity: 1;
  text-shadow: 0 0 22px rgba(255, 210, 63, 0.85);
  animation: starPop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
}
@keyframes starPop {
  0% { transform: scale(0.3) rotate(-30deg); opacity: 0; }
  70% { transform: scale(1.25) rotate(8deg); opacity: 1; }

.badge {

/* ---------------- 10. 玩法说明 ---------------- */
.sec { margin-bottom: 14px; }

/* ---------------- 11. Toast / Popup ---------------- */
#toast-layer {
  position: absolute;
  left: 0;
  right: 0;
  top: var(--toast-top);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
  padding: 0 16px;
}
.toast {
  max-width: 88%;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  color: #fff;
  background: rgba(10, 16, 30, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
  opacity: 0;
  transform: translateY(-12px) scale(0.94);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.toast.on { opacity: 1; transform: none; }
.toast.good { color: var(--cyan); border-color: rgba(53, 224, 200, 0.5); }
.toast.bad { color: var(--magenta); border-color: rgba(255, 77, 141, 0.5); }

#popup-layer {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

  font-size: 40px;
  font-weight: 900;
  letter-spacing: 0.08em;
  color: #fff;
  opacity: 0;
  transform: scale(0.6);

}
.popup.on { animation: popIn 1.15s cubic-bezier(0.2, 1.2, 0.4, 1) forwards; }
.popup.good { color: var(--cyan); }
.popup.bad { color: var(--magenta); }
@keyframes popIn {
  0% { opacity: 0; transform: scale(0.55); }
  18% { opacity: 1; transform: scale(1.1); }
  32% { transform: scale(1); }
  78% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.08); }
}

  let bgmOut = null;      // BGM 支路（0.22 基准 × 用户 BGM 音量 / BGM 静音）

      const pings = [[3100, 0], [4200, 0.05], [2600, 0.10], [5200, 0.16]];
      for (let i = 0; i < pings.length; i++) {
        vo({ t: t + pings[i][1], type: 'sine', f: pings[i][0], dur: 0.16,
          a: 0.002, peak: 0.08, ft: 'highpass', fq: 2200, q: 0.7 });
      }
      nz({ t: t + 0.02, dur: 0.22, peak: 0.09, ft: 'highpass', f: 4800, q: 0.7 });
    },

    /* emp：电流噪声，带通噪声扫落 + 三段方波电流嗡鸣 */
    emp: function (t) {
      nz({ t: t, dur: 0.30, peak: 0.16, ft: 'bandpass', f: 3200, f2: 700, q: 1.1 });
      const buzz = [92, 124, 148];
      for (let i = 0; i < buzz.length; i++) {
        vo({ t: t + i * 0.045, type: 'square', f: buzz[i], dur: 0.05, a: 0.002,
          peak: 0.07, ft: 'bandpass', fq: 1200, q: 2.2 });
      }
      nz({ t: t + 0.16, dur: 0.18, peak: 0.07, ft: 'highpass', f: 6200, q: 0.6 });
    },

    /* mega：必杀蓄力 + 释放，180→2200Hz 上扫蓄力后 sub 砸落 + 大三和弦 */
    mega: function (t) {
      vo({ t: t, type: 'sawtooth', f: 180, f2: 2200, dur: 0.55, a: 0.08,
        peak: 0.10, ft: 'lowpass', fq: 400, fq2: 5000, q: 0.8 });
      vo({ t: t + 0.55, type: 'sine', f: 90, f2: 35, dur: 0.50, a: 0.003, peak: 0.50 });
      nz({ t: t + 0.55, dur: 0.45, peak: 0.32, ft: 'lowpass', f: 4200, f2: 150, q: 0.6 });
      const chord = [523.25, 659.25, 783.99];
      for (let i = 0; i < chord.length; i++) {
        vo({ t: t + 0.55, type: 'square', f: chord[i], dur: 0.36, a: 0.004,
          peak: 0.07, ft: 'lowpass', fq: 3400, q: 0.6 });
      }
      click(t + 0.55, 0.14, 4600);
    },

    /* combo：短 blip，opts.rate 抬音高（连击越高越尖），随连击数上行 */
    combo: function (t) {
      vo({ t: t, type: 'square', f: 620, f2: 900, dur: 0.05, a: 0.003,
        peak: 0.11, ft: 'lowpass', fq: 4200, q: 0.7 });
      vo({ t: t, type: 'sine', f: 310, dur: 0.04, a: 0.002, peak: 0.06 });
    },

    /* style：风格升级上行三连音 784/988/1175Hz，金属钟声音色 + 闪光尾 */
    style: function (t) {
      const seq = [784, 988, 1174.66];
      for (let i = 0; i < seq.length; i++) {
        vo({ t: t + i * 0.085, type: 'square', f: seq[i], det: i % 2 ? 8 : -8,
          dur: i === 2 ? 0.3 : 0.12, a: 0.003, peak: 0.12,
          ft: 'bandpass', fq: 1800, q: 1.2 });
        vo({ t: t + i * 0.085, type: 'sawtooth', f: seq[i] * 2, det: i % 2 ? -10 : 10,
          dur: i === 2 ? 0.3 : 0.1, a: 0.004, peak: 0.045,
          ft: 'lowpass', fq: 4200, q: 0.6 });
      }
      nz({ t: t + 0.18, dur: 0.2, peak: 0.03, ft: 'highpass', f: 7200, q: 0.7 });
    },

    /* star：闪烁，四枚高音快速交替闪烁（无敌星启动） */
    star: function (t) {
      const seq = [2093, 2637, 3136, 4186];
      for (let i = 0; i < seq.length; i++) {
        vo({ t: t + i * 0.055, type: 'sine', f: seq[i], dur: 0.14, a: 0.002,
          peak: 0.09, ft: 'highpass', fq: 1600, q: 0.7 });
      }
      nz({ t: t, dur: 0.24, a: 0.02, peak: 0.035, ft: 'highpass', f: 7000, q: 0.6 });
    },

    /* clock：倒计时滴答，1100→900Hz 木鱼式短响（与 ui 明显不同） */
    clock: function (t) {
      vo({ t: t, type: 'sine', f: 1100, f2: 880, dur: 0.032, a: 0.001, peak: 0.12 });
      nz({ t: t, dur: 0.016, peak: 0.05, ft: 'bandpass', f: 2000, q: 1.2 });
    },

    /* checkpoint：双音确认 587→880Hz，暖三角波（存档点确认） */
    checkpoint: function (t) {
      vo({ t: t, type: 'triangle', f: 587.33, dur: 0.11, a: 0.004, peak: 0.15 });
      vo({ t: t + 0.10, type: 'triangle', f: 880, dur: 0.28, a: 0.004, peak: 0.17 });
      vo({ t: t + 0.10, type: 'sine', f: 1760, dur: 0.12, a: 0.003, peak: 0.04 });
    },

    /* clear：通关上行琶音 392→1046Hz，最后一音长延 + 八度闪光 */
    clear: function (t) {
      const seq = [392, 523.25, 659.25, 783.99, 1046.5];
      for (let i = 0; i < seq.length; i++) {
        vo({ t: t + i * 0.10, type: 'triangle', f: seq[i],
          dur: i === 4 ? 0.8 : 0.16, a: 0.005, h: i === 4 ? 0.3 : 0.06,
          peak: 0.13 + i * 0.015 });
        if (i >= 2) {
          vo({ t: t + i * 0.10, type: 'square', f: seq[i] * 2, dur: 0.12, a: 0.004,
            peak: 0.03, ft: 'lowpass', fq: 4200, q: 0.6 });
        }
      }
      nz({ t: t + 0.44, dur: 0.35, peak: 0.03, ft: 'highpass', f: 7000, q: 0.7 });
    },

    /* gameover：下行悲鸣，锯齿带颤音逐级下行 + 低频闷响与持续低音 */
    gameover: function (t) {
      const seq = [440, 392, 330, 262];
      for (let i = 0; i < seq.length; i++) {
        vo({ t: t + i * 0.24, type: 'sawtooth', f: seq[i], dur: 0.3, a: 0.02,
          h: 0.12, peak: 0.13, ft: 'lowpass', fq: 1500, q: 0.8,
          vib: { rate: 5.5, depth: 7 } });
      }
      vo({ t: t, type: 'sine', f: 120, f2: 55, dur: 0.5, a: 0.003, peak: 0.26 });
      nz({ t: t, dur: 0.3, peak: 0.12, ft: 'lowpass', f: 320, f2: 100, q: 0.7 });
      vo({ t: t + 0.72, type: 'sine', f: 98, dur: 0.9, a: 0.06, peak: 0.12 });
    }
  };

  /* ================= BGM 5 轨（全程序化） =================
   * menu      100BPM 舒缓 pad + 慢琶音
   * run       132BPM 跳动方波主旋律 + 贝斯 + 轻鼓点
   * danger    150BPM 紧张快速鼓点 + 半音贝斯
   * clear     120BPM 胜利小号 + 上行琶音
   * gameover   66BPM 下行琶音 + 闷响
   * BGM 内部混合级 bgmOut=0.22 压低，不抢音效。 */

  function bKick(t, f, pk) {
    vo(D({ t: t, type: 'sine', f: f || 150, f2: 44, slide: 0.09, dur: 0.15,
      a: 0.003, peak: pk || 0.5 }));
  }
  function bBass(f, t, dur, pk) {
    vo(D({ t: t, type: 'sawtooth', f: f, dur: dur, a: 0.004, peak: pk || 0.22,
      ft: 'lowpass', fq: 820, q: 0.7 }));
  }
  function bHat(t, pk) {
    nz(D({ t: t, dur: 0.03, peak: pk || 0.03, ft: 'highpass', f: 7500, q: 0.7 }));
  }
  function bSnare(t) {
    nz(D({ t: t, dur: 0.09, peak: 0.085, ft: 'bandpass', f: 1900, q: 0.8 }));
    nz(D({ t: t, dur: 0.05, peak: 0.05, ft: 'highpass', f: 4000, q: 0.7 }));
  }
  function bLead(f, t, dur) {
    vo(D({ t: t, type: 'square', f: f, dur: dur, a: 0.008, h: dur * 0.3,
      peak: 0.075, ft: 'lowpass', fq: 2600, q: 0.6,
      det: Math.random() * 8 - 4 }));
  }

  /* --- menu：pad + 慢琶音 --- */
  const MENU_CH = [
    [45, 52, 55, 59],   // Am7
    [41, 48, 52, 57],   // Fmaj7
    [36, 43, 47, 52],   // Cmaj7
    [43, 47, 50, 55]    // G
  ];
  const MENU_ARP = [0, 3, 6, 10, 12];
  const MENU_IDX = [0, 1, 2, 3, 2];
  function menuStep(td, s, t) {
    const bar = (s >> 4) & 3, pos = s & 15, ch = MENU_CH[bar];
    const barLen = 60 / td.bpm * 4;
    if (pos === 0) {                       // 铺底 pad：失谐双锯齿慢起
      for (let i = 0; i < ch.length; i++) {
        vo(D({ t: t, type: 'sawtooth', f: mf(ch[i]), dur: barLen, a: 0.7,
          h: barLen - 1.0, peak: 0.05, ft: 'lowpass', fq: 720, q: 0.4, det: -5 }));
        vo(D({ t: t, type: 'sawtooth', f: mf(ch[i]), dur: barLen, a: 0.7,
          h: barLen - 1.0, peak: 0.05, ft: 'lowpass', fq: 720, q: 0.4, det: 5 }));
      }
      vo(D({ t: t, type: 'sine', f: mf(ch[0] - 12), dur: 0.6, a: 0.01, peak: 0.10 }));
    }
    const ai = MENU_ARP.indexOf(pos);
    if (ai >= 0) {                          // 慢琶音
      vo(D({ t: t, type: 'triangle', f: mf(ch[MENU_IDX[ai]] + 12), dur: 0.5,
        a: 0.02, h: 0.15, peak: 0.06 }));
    }
    if (pos === 8) nz(D({ t: t, dur: 0.25, a: 0.05, peak: 0.012, ft: 'highpass', f: 8000, q: 0.6 }));
  }

  /* --- run：跳动的方波主旋律 + 贝斯 + 轻鼓点 --- */
  const RUN_ROOTS = [45, 45, 41, 43];      // A2 A2 F2 G2
  const RUN_LEAD = [
    [[0, 69, 2], [3, 72, 2], [6, 76, 3], [10, 74, 2], [12, 72, 2]],
    [[0, 69, 2], [2, 72, 2], [4, 74, 2], [6, 76, 3], [10, 79, 3], [14, 76, 2]],
    [[0, 77, 2], [3, 81, 3], [6, 79, 2], [8, 76, 2], [11, 72, 2], [14, 74, 2]],
    [[0, 76, 3], [4, 74, 2], [6, 72, 2], [8, 69, 4], [13, 67, 3]]
  ];
  function runStep(td, s, t) {
    const bar = (s >> 4) & 3, pos = s & 15, root = RUN_ROOTS[bar];
    const st = 60 / td.bpm / 4;
    if (pos === 0 || pos === 8) bKick(t, 150, 0.42);
    if (pos === 4 || pos === 12) bSnare(t);
    if (pos % 2 === 1) bHat(t, 0.026);
    if (pos % 2 === 0) {                   // 八分音符贝斯
      const off = (pos % 8 === 6) ? 7 : 0;
      bBass(mf(root + off), t, st * 0.9, pos % 8 === 0 ? 0.24 : 0.18);
    }
    const barNotes = RUN_LEAD[bar];
    for (let i = 0; i < barNotes.length; i++) {
      if (barNotes[i][0] === pos) {
        bLead(mf(barNotes[i][1]), t, barNotes[i][2] * st * 0.9);
      }
    }
  }

  /* --- danger：紧张快速鼓点 + 半音贝斯 --- */
  const DANGER_ROOT = [40, 39, 38, 39];    // E Eb D Eb 半音压迫
  function dangerStep(td, s, t) {
    const pos = s & 15, st = 60 / td.bpm / 4;
    if (pos % 4 === 0) bKick(t, 140, 0.44);
    if (pos === 7 || pos === 15) bKick(t, 120, 0.3);
    if (pos === 4 || pos === 12) bSnare(t);
    bHat(t, pos % 2 === 0 ? 0.022 : 0.016);
    const root = DANGER_ROOT[(pos >> 1) & 3];
    bBass(mf(root), t, st * 0.85, pos % 8 === 0 ? 0.26 : 0.2);
    if (pos === 0) {                        // 高频紧张脉冲：相邻小二度交替
      vo(D({ t: t, type: 'square', f: mf(76 + (((s >> 4) & 1) ? 1 : 0)),
        dur: 0.5, a: 0.05, h: 0.3, peak: 0.028, ft: 'lowpass', fq: 3600, q: 0.6 }));
    }
  }

  /* --- clear：胜利小号 + 上行琶音 --- */
  const CLEAR_NOTES = [
    [0, 67, 2], [2, 67, 2], [4, 67, 2], [6, 72, 4], [10, 76, 6],
    [16, 72, 2], [18, 76, 2], [20, 79, 2], [22, 84, 4]
  ];
  function clearStep(td, s, t) {
    const pos = s & 15, st = 60 / td.bpm / 4;
    for (let i = 0; i < CLEAR_NOTES.length; i++) {
      const n = CLEAR_NOTES[i];
      if (n[0] === s) {
        vo(D({ t: t, type: 'sawtooth', f: mf(n[1]), dur: n[2] * st * 0.95,
          a: 0.02, h: n[2] * st * 0.4, peak: 0.09, ft: 'lowpass', fq: 3000, q: 0.8,
          vib: { rate: 6, depth: 7 } }));
        vo(D({ t: t, type: 'triangle', f: mf(n[1] + 12), dur: n[2] * st * 0.7,
          a: 0.02, peak: 0.04 }));
      }
    }
    if (s === 24) {                         // 收尾大三和弦
      const chord = [76, 79, 84];
      for (let i = 0; i < chord.length; i++) {
        vo(D({ t: t, type: 'sawtooth', f: mf(chord[i]), dur: 1.0, a: 0.02,
          h: 0.4, peak: 0.07, ft: 'lowpass', fq: 3200, q: 0.8 }));
      }
      nz(D({ t: t, dur: 0.4, a: 0.03, peak: 0.02, ft: 'highpass', f: 7000, q: 0.6 }));
    }
  }

  /* --- gameover：下行琶音 + 闷响 --- */
  const OVER_SEQ = [69, 67, 65, 64, 62, 60, 57];   // A4 G4 F4 E4 D4 C4 A3
  function overStep(td, s, t) {
    const st = 60 / td.bpm / 4;
    if (s % 4 === 0) {
      const i = (s / 4) % OVER_SEQ.length;
      vo(D({ t: t, type: 'sawtooth', f: mf(OVER_SEQ[i]), dur: st * 3.6, a: 0.05,
        h: st * 1.6, peak: 0.075, ft: 'lowpass', fq: 1200, q: 0.8,
        vib: { rate: 4.5, depth: 5 } }));
    }
    if (s === 0 || s === 16) {              // 闷响 + 低音持续
      vo(D({ t: t, type: 'sine', f: 120, f2: 55, dur: 0.6, a: 0.003, peak: 0.26 }));
      nz(D({ t: t, dur: 0.3, peak: 0.12, ft: 'lowpass', f: 320, f2: 100, q: 0.7 }));
      vo(D({ t: t, type: 'sine', f: 98, dur: st * 14, a: 0.08, peak: 0.10 }));
    }
  }

  const tracks = {
    menu:     { bpm: 100, total: 64, level: 0.9,  stepFn: menuStep },
    run:      { bpm: 132, total: 64, level: 1.0,  stepFn: runStep },
    danger:   { bpm: 150, total: 32, level: 1.0,  stepFn: dangerStep },
    clear:    { bpm: 120, total: 32, level: 0.95, stepFn: clearStep },
    gameover: { bpm: 66,  total: 32, level: 0.9,  stepFn: overStep }
  };
  const TRACK_KEYS = Object.keys(tracks);
  for (let i = 0; i < TRACK_KEYS.length; i++) {
    const td = tracks[TRACK_KEYS[i]];
    td.gain = null; td.live = []; td.timer = null;
    td.step = 0; td.next = 0; td.on = false;
  }

  function bgmTick(td) {
    if (!td.on || !ctx) return;
    CURTD = td; CUR.rate = 1; CUR.vol = 1;
    const st = 60 / td.bpm / 4;
    const horizon = ctx.currentTime + AHEAD;
    let guard = 0;
    while (td.next < horizon && guard++ < 64) {
      td.stepFn(td, td.step, td.next);
      td.step = (td.step + 1) % td.total;
      td.next += st;
    }
    CURTD = null;
  }

  function fadeOut(td) {
    td.on = false;
    if (td.timer) { clearInterval(td.timer); td.timer = null; }
    if (!ctx || !td.gain) return;
    try {
      const g = td.gain.gain, t = ctx.currentTime;
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(0.0001, g.value), t);
      g.exponentialRampToValueAtTime(0.0001, t + 0.5);
    } catch (e) {}
    setTimeout(function () { killLive(td.live); }, 620);
  }

  function startBGM(name) {
    if (!ensure()) return;
    const key = (name === 'over') ? 'gameover' : name;   // 契约 API 写 'over'，轨道表写 'gameover'
    const td = tracks[key];
    if (!td) return;                                    // 未知轨安全 no-op
    resumeCtx();
    if (bgmName === key && td.on) return;                // 同轨幂等
    if (bgmName && tracks[bgmName] && tracks[bgmName].on) fadeOut(tracks[bgmName]);
    bgmName = key;
    td.on = true; td.step = 0; td.next = ctx.currentTime + 0.08;
    try {                                               // 淡入，切轨平滑
      const g = td.gain.gain, t = ctx.currentTime;
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(0.0001, g.value), t);
      g.exponentialRampToValueAtTime(td.level, t + 0.6);
    } catch (e) {}
    if (td.timer) clearInterval(td.timer);
    td.timer = setInterval(function () { bgmTick(td); }, TICK_MS);
    bgmTick(td);
  }

  function stopBGM() {
    if (bgmName && tracks[bgmName]) fadeOut(tracks[bgmName]);
    bgmName = null;
  }

  /* ================= 生命周期 ================= */
  function ensure() {
    if (ctx) return true;
    const AC = (typeof window !== 'undefined') &&
      (window.AudioContext || window.webkitAudioContext);
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { ctx = null; return false; }
    try {
      master = ctx.createGain();
      master.gain.value = mutedAll ? 0.0001 : 1;
      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 20; comp.ratio.value = 8;
      comp.attack.value = 0.003; comp.release.value = 0.18;
      master.connect(comp); comp.connect(ctx.destination);
      sfxBus = ctx.createGain();
      sfxBus.gain.value = volSfx * (muteSfx ? 0 : 1);
      sfxBus.connect(master);
      bgmOut = ctx.createGain();
      bgmOut.gain.value = BGM_BASE * volBgm * (muteBgm ? 0 : 1);
      bgmOut.connect(master);
      for (let i = 0; i < TRACK_KEYS.length; i++) {
        const td = tracks[TRACK_KEYS[i]];
        td.gain = ctx.createGain();
        td.gain.gain.value = 0.0001;
        td.gain.connect(bgmOut);
      }
      const sr = ctx.sampleRate || 44100;
      noiseBuf = ctx.createBuffer(1, sr, sr);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    } catch (e) { /* 音频不可用时静默降级 */ }
    bindOnce();
    return true;
  }

  function resumeCtx() {
    if (!ctx || ctx.state !== 'suspended' || !ctx.resume) return;
    try {
      const p = ctx.resume();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  function onVis() {
    if (!ctx) return;
    if (document.hidden) stopBGM();   // 隐藏即停 BGM；回前台不自动重启，由 game.js 决定
  }

  function onGesture() { unlock(); }

  function bindOnce() {
    if (bound || typeof document === 'undefined') return;
    bound = true;
    const opt = { passive: true, capture: true };
    document.addEventListener('pointerdown', onGesture, opt);
    document.addEventListener('touchend', onGesture, opt);
    document.addEventListener('keydown', onGesture, opt);
    document.addEventListener('visibilitychange', onVis, false);
  }

  /* ---------------- 对外接口 ---------------- */
  function init() {
    // 惰性：这里只挂事件监听，不创建 AudioContext；
    // 等第一次真正发声（unlock / play / startBGM）时才 new AudioContext。
    bindOnce();
  }

  function unlock() {                     // 幂等：iOS 首个用户手势 resume
    if (!ensure()) return;
    resumeCtx();
  }

  function play(name, opts) {
    if (!ensure()) return;
    const o = opts || {};
    CUR.rate = clamp(+o.rate || 1, 0.4, 3);
    CUR.vol = clamp(o.vol == null ? 1 : +o.vol, 0, 4);
    try {
      const t0 = ctx.currentTime + 0.02;
      if (ctx.state === 'suspended') resumeCtx();
      const c = cues[name];
      if (!c) return;                    // 未知 cue：安全 no-op，不抛异常
      c(t0);
    } catch (e) {} finally {
      CUR.rate = 1; CUR.vol = 1;
    }
  }

  function setVol(bgm, sfx) {
    if (bgm != null && isFinite(bgm)) volBgm = clamp(+bgm, 0, 1);
    if (sfx != null && isFinite(sfx)) volSfx = clamp(+sfx, 0, 1);
    if (!ctx) return;
    try {
      const t = ctx.currentTime;
      bgmOut.gain.cancelScheduledValues(t);
      bgmOut.gain.setTargetAtTime(BGM_BASE * volBgm * (muteBgm ? 0 : 1), t, 0.03);
      sfxBus.gain.cancelScheduledValues(t);
      sfxBus.gain.setTargetAtTime(volSfx * (muteSfx ? 0 : 1), t, 0.03);
    } catch (e) {}
  }

  function muted(b) {                    // 总静音
    mutedAll = !!b;
    if (!ctx || !master) return;
    try {
      const t = ctx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setTargetAtTime(mutedAll ? 0.0001 : 1, t, 0.015);
    } catch (e) {
      try { master.gain.value = mutedAll ? 0.0001 : 1; } catch (e2) {}
    }
  }

  function setMuteBgm(b) {               // BGM 独立静音
    muteBgm = !!b;
    if (!ctx || !bgmOut) return;
    try {
      const t = ctx.currentTime;
      bgmOut.gain.cancelScheduledValues(t);
      bgmOut.gain.setTargetAtTime(BGM_BASE * volBgm * (muteBgm ? 0 : 1), t, 0.03);
    } catch (e) {}
  }

  function setMuteSfx(b) {               // SFX 独立静音
    muteSfx = !!b;
    if (!ctx || !sfxBus) return;
    try {
      const t = ctx.currentTime;
      sfxBus.gain.cancelScheduledValues(t);

  return { w: cw / s, h: ch / s };

function render(ctx, layer) {
  if (!ctx) return;
  ctx.save();
  try {
    if (layer === 'screen') drawScreen(ctx);
    else drawWorld(ctx);
  } finally {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }
}

// --- world 层：相机变换内画粒子 / 环 / 飘字 ---
function drawWorld(ctx) {
  const n = list.length;
  let i, p;
  // pass1：普通混合（烟 / 碎片 / 彩纸）
  ctx.globalCompositeOperation = 'source-over';
  for (i = 0; i < n; i++) {
    p = list[i];
    if (p.kind === 'smoke' || p.kind === 'dust') dSmoke(ctx, p);
    else if (p.kind === 'debris') dDebris(ctx, p);
    else if (p.kind === 'confetti') dConfetti(ctx, p);
  }
  // pass2：加色发光（火 / 火星 / 星星 / 光点 / 拖影 / 冲击环）
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < n; i++) {
    p = list[i];
    switch (p.kind) {
      case 'spark': dSpark(ctx, p); break;
      case 'fire': dFire(ctx, p); break;
      case 'star': dStar(ctx, p); break;
      case 'glow': case 'trail': dGlow(ctx, p); break;
      case 'ring': dRing(ctx, p); break;
    }
  }
  // pass3：飘字在最上层
  ctx.globalCompositeOperation = 'source-over';
  for (i = 0; i < n; i++) if (list[i].kind === 'text') dText(ctx, list[i]);
  ctx.globalAlpha = 1;
}

// --- screen 层：速度线 / 屏幕闪 / 红晕 / 中央大字幕（不随相机移动）---
function drawScreen(ctx) {
  const sz = screenSize(ctx);
  ctx.globalCompositeOperation = 'source-over';

  if (speedLines > 0 && !lowQ) drawSpeedLines(ctx, sz);
  if (flashA > 0.002) drawFlash(ctx);
  if (vignette) drawVignette(ctx);
  if (popupStr) drawPopup(ctx, sz);

  ctx.globalAlpha = 1;
}

function drawFlash(ctx) {
  const c = ctx.canvas;
  if (!c) return;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(' + flashCol + ',' + flashA.toFixed(3) + ')';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.restore();
}

function drawVignette(ctx) {
  const c = ctx.canvas;
  if (!c) return;
  const key = c.width + 'x' + c.height;
  if (!vigGrad || vigKey !== key) {
    const cx = c.width / 2, cy = c.height / 2;
    const g = ctx.createRadialGradient(
      cx, cy, Math.min(c.width, c.height) * 0.30,
      cx, cy, Math.max(c.width, c.height) * 0.75
    );
    g.addColorStop(0, 'rgba(255,60,48,0)');
    g.addColorStop(0.6, 'rgba(255,60,48,0.35)');
    g.addColorStop(1, 'rgba(255,48,40,1)');
    vigGrad = g; vigKey = key;
  }
  const a = 0.20 + 0.12 * Math.sin(vigPhase * 4.2);   // 呼吸
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = a;
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.restore();
}

function drawSpeedLines(ctx, sz) {
  const cx = sz.w / 2, cy = sz.h / 2;
  const maxR = Math.hypot(cx, cy);
  const count = 22;
  const inten = clamp(speedLines, 0, 1);
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#ffffff';
  for (let i = 0; i < count; i++) {
    const a = (i / count) * TAU + slPhase * 0.55;
    const wob = Math.sin(slPhase * 7 + i * 1.7);
    const r0 = maxR * (0.50 + 0.10 * wob);
    const r1 = r0 + maxR * (0.10 + 0.18 * inten) * (0.55 + 0.65 * Math.abs(wob));
    ctx.globalAlpha = inten * (0.08 + 0.20 * Math.abs(wob));
    ctx.lineWidth = 1.2 + 1.6 * inten;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawPopup(ctx, sz) {
  // 弹入 0.55 -> 1.17 -> 1.0，末段淡出
  let sc;
  if (popupT < 0.22) {
    const k = 1 - Math.pow(1 - popupT / 0.22, 3);
    sc = 0.55 + 0.62 * k;
  } else {
    const k = clamp((popupT - 0.22) / 0.18, 0, 1);
    sc = 1.17 - 0.17 * (1 - Math.pow(1 - k, 2));
  }
  let a = 1;
  const fadeStart = popupLife - 0.35;
  if (popupT > fadeStart) a = clamp(1 - (popupT - fadeStart) / 0.35, 0, 1);

  ctx.save();
  ctx.translate(sz.w / 2, sz.h * popupY);
  ctx.scale(sc, sc);
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.font = '900 ' + popupSize + 'px ' + FONT;
  ctx.lineWidth = Math.max(4, popupSize * 0.17);
  ctx.strokeStyle = 'rgba(8,11,20,0.92)';
  ctx.strokeText(popupStr, 0, 0);
  ctx.fillStyle = popupCol;
  ctx.fillText(popupStr, 0, 0);
  if (popupSub) {
    const ss = popupSize * 0.42;
    ctx.font = '700 ' + ss + 'px ' + FONT;
    ctx.lineWidth = Math.max(2, ss * 0.16);
    ctx.strokeText(popupSub, 0, popupSize * 0.78);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillText(popupSub, 0, popupSize * 0.78);
  }
  ctx.restore();
}

// --- 单个粒子的绘制 ---
function dSpark(ctx, p) {
  const t = p.age / p.life;
  let dx = p.vx * 0.028, dy = p.vy * 0.028;
  const L = Math.hypot(dx, dy), minL = 3 + p.size;
  if (L < minL) { const s = L > 0.001 ? minL / L : 0; dx *= s; dy *= s; }
  ctx.globalAlpha = Math.pow(1 - t, 0.7);
  ctx.strokeStyle = p.color;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1, p.size * (1 - t * 0.5));
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x - dx, p.y - dy);
  ctx.stroke();
}

function dFire(ctx, p) {
  const t = p.age / p.life;
  const a = Math.pow(1 - t, 1.1) * 0.95;
  const s = p.size * (1 + 1.2 * t);
  drawBlob(ctx, 'flame', p.color, p, s, a);
  if (t < 0.4) {                       // 早期叠加更亮的核心
    const s2 = s * 0.45;
    ctx.globalAlpha = (1 - t / 0.4) * 0.65;
    const g = glowSprite('#fff2c0');
    if (g) ctx.drawImage(g, p.x - s2, p.y - s2, s2 * 2, s2 * 2);
  }
}

function dGlow(ctx, p) {
  const t = p.age / p.life;
  const s = p.size * (1 + 0.8 * t);
  drawBlob(ctx, 'glow', p.color, p, s, Math.pow(1 - t, 1.4) * 0.9);
}

function dSmoke(ctx, p) {
  const t = p.age / p.life;
  const a = 0.20 * (1 - t) * (t < 0.15 ? t / 0.15 : 1);
  drawBlob(ctx, 'smoke', p.color, p, p.size * (1 + 1.8 * t), a);
}

function dStar(ctx, p) {
  const t = p.age / p.life;
  const a = 1 - t;
  const l = p.size * (1 - 0.35 * t);
  ctx.globalAlpha = a * 0.4;
  const g = glowSprite(p.color);
  if (g) ctx.drawImage(g, p.x - l, p.y - l, l * 2, l * 2);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  ctx.globalAlpha = a;
  ctx.fillStyle = p.color;
  const iw = l * 0.34;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const ang = i * TAU / 8 - Math.PI / 2;
    const rr = (i % 2 === 0) ? l : iw;
    const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function dDebris(ctx, p) {
  const t = p.age / p.life;
  ctx.globalAlpha = t > 0.65 ? 1 - (t - 0.65) / 0.35 : 1;
  const s = p.size;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, s * 0.6); ctx.lineTo(-s * 0.45, -s * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function dConfetti(ctx, p) {
  const t = p.age / p.life;
  ctx.globalAlpha = t > 0.7 ? 1 - (t - 0.7) / 0.3 : 1;
  const s = p.size;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  ctx.scale(Math.max(0.12, Math.abs(Math.cos(p.rot * 1.7))), 1);   // 纸片翻面
  ctx.fillStyle = p.color;
  ctx.fillRect(-s * 0.45, -s * 0.7, s * 0.9, s * 1.4);
  ctx.restore();
}

function dRing(ctx, p) {
  const t = p.age / p.life;
  const e = 1 - Math.pow(1 - t, 3);
  const r = p.r0 + (p.r1 - p.r0) * e;
  const w = Math.max(0.8, p.w * (1 - t * 0.7));
  const a = Math.pow(1 - t, 0.8);
  ctx.globalAlpha = a * 0.32;
  ctx.strokeStyle = p.color;
  ctx.lineWidth = w * 2.6;
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
  ctx.globalAlpha = a;
  ctx.lineWidth = w;
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
}

function dText(ctx, p) {
  const t = p.age / p.life;
  ctx.globalAlpha = t < 0.5 ? 1 : 1 - (t - 0.5) / 0.5;
  ctx.font = '900 ' + p.size + 'px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, p.size * 0.18);
  ctx.strokeStyle = 'rgba(8,11,20,0.92)';
  ctx.strokeText(p.txt, p.x, p.y);
  ctx.fillStyle = p.color;
  ctx.fillText(p.txt, p.x, p.y);
}

// ============================ 导出 ============================
return {
  init, resize,
  addShake, shakeOffset,
  burst, ring, explosion, trail, floatText, popup,
  flash, slowmo, timeScale,
  update, render, clear,
  setQuality, setVignette,

  setSpeedLines,
  count: function () { return list.length; }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function aabb(a, b) {
    if (!a || !b) return false;

  /* 确定性 32 位哈希：hash32(a, b) */
  function hash32(a, b) {
    var h = 0x811c9dc5 >>> 0;
    h = (h ^ (a >>> 0)) >>> 0; h = Math.imul(h, 0x01000193) >>> 0;
    h = (h ^ (b >>> 0)) >>> 0; h = Math.imul(h, 0x01000193) >>> 0;
    h = (h ^ (h >>> 15)) >>> 0;
    h = Math.imul(h, 0x2545f491) >>> 0;
    h = (h ^ (h >>> 13)) >>> 0;
    return h >>> 0;
  }

  /* 确定性随机数发生器：mulberry32(seed) → () => [0,1) */
  function mulberry32(seed) {
    var a = (seed >>> 0) || 0x9e3779b9;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

    var r = rng() * total;
    for (i = 0; i < list.length; i++) { r -= list[i][1]; if (r <= 0) return list[i][0]; }
    return list[0][0];
  }

  /* 平台链约束：任意相邻两个"平台类"实体，左边缘间距 ≤ CHAIN_DX，高度差 ≤ CHAIN_DY */
  var CHAIN_DX = 240;
  var CHAIN_DY = 85;
  /* 平台带：相对地面的高度区间。
   * 上界 -95：基础跳跃高度约 123，玩家跳得上去；单级抬升 ≤ 100 的硬约束也满足。
   * 下界 -46：平台下沿（+16 厚）始终高于站立时头顶（-26），跑步不会被挡、也不会磕头。 */
  var PLAT_BAND_TOP = -95;
  var PLAT_BAND_BOT = -46;
  var PLAT_H = 16;

  function isPlatKind(k) {
    return k === 'platform' || k === 'oneway' || k === 'mover' || k === 'spring' || k === 'crumble';
  }
  /* 可"从下方穿过、只从上方落脚"的实体 */
  function isPassKind(k) {
    return k === 'oneway' || k === 'mover' || k === 'crumble';
  }

  function genLayout(level, runSeed) {
    var n = Math.max(1, Math.floor(level) || 1);
    /* 关卡长度：随关卡线性增长，封顶 21000（跑速 320/秒 ≈ 65 秒）。
       旧版 4200+n*260 封顶 9600 → 最长只有 30 秒，一关跑两遍就没意思了。 */
    var len = Math.min(6800 + n * 520, 21000);
    var seed = hash32(n, runSeed);
    var rng = mulberry32(seed);
    var groundY = PHYS.GROUND_Y;
    var goalX = len - 120;
    /* 难度进度 0→1（第 1 关 0，第 25 关封顶）：驱动段落权重与实体布点密度。
       旧版难度几乎全靠「关卡变长堆数量」，而数量被 9600 的长度上限拖住，
       结果 30 关之后完全不再变难。 */
    var dp = Math.min(1, (n - 1) / 24);
    var diff = 1 + (n - 1) * 0.11;
    var biome = BIOMES[Math.floor((n - 1) / 5) % BIOMES.length];

    var solids = [];
    var hazards = [];
    var sections = [];
    var sid = 0;

    function addSolid(x, y, w, h, kind, extra) {
      var s = {
        id: 's' + (sid++), x: x, y: y, w: w, h: h, kind: kind,
        vx: 0, vy: 0, range: 0, phase: 0, hp: 1, breakable: false
      };
      if (extra) for (var k in extra) s[k] = extra[k];
      solids.push(s);
      return s;
    }
    function addHazard(h) { hazards.push(h); return h; }
    function ground(x0, x1) {
      if (x1 - x0 <= 0) return null;
      return addSolid(x0, groundY, x1 - x0, 60, 'ground');
    }
    /* 平台：高度平滑（相邻差 ≤ CHAIN_DY），并限制在可达带内 */
    function platY(next) {
      var base = chainY;
      var y = base + Math.round((rng() * 2 - 1) * 40);
      y = clamp(y, groundY + PLAT_BAND_TOP, groundY + PLAT_BAND_BOT);
      if (next) chainY = y;
      return y;
    }
    var chainY = groundY - 60;
    function addPlat(x, y, w, h, kind, extra) {
      var s = addSolid(x, y, w, h, kind || 'platform', extra);
      chainY = s.y;
      return s;
    }

    /* 首段恒为 flat（长 520）：留足起跑热身跑道，
       出生点落在画面 ~40% 处时脚下仍有实体地面 */
    sections.push({ type: 'flat', x0: 0, x1: 520 });
    buildSection('flat', 0, 520);

    var endX = len - 480;   // 末段 sprint 长 480
    var cur = 520;

    var SECTION_LEN = {
      flat:    [300, 520],
      gap:     [240, 400],
      stairs:  [320, 520],
      float:   [380, 620],
      enemy:   [320, 520],
      machine: [340, 520],
      sprint:  [420, 560],
      gauntlet:[460, 700]

    function weights() {
      /* 难度越高：平路越少，机关段 / 陷阱段 / 敌人段越多。

      var d = dp;

        ['flat',     0.95 - 0.45 * d],
        ['gap',      1.00 + 0.45 * d],
        ['stairs',   0.90 + 0.25 * d],
        ['float',    1.00 + 0.30 * d],
        ['enemy',    1.10 + 0.60 * d],
        ['machine',  (n >= 2 ? 0.55 : 0.15) + 0.90 * d],
        ['sprint',   0.50 + 0.30 * d],
        ['gauntlet', 0.85 + 0.60 * d]

    function buildSection(type, x0, x1) {

          ground(gs + gw, x1);
          // 间隙上方的踏板（低空，可跳上）
          addPlat(gs + Math.max(0, Math.round((gw - 110) / 2)), platY(true), 110, PLAT_H, 'oneway');
          // 弹力板：地面上的弹跳器
          if (rng() < 0.5) {
            addSolid(gs + gw + 40, groundY - PLAT_H, 40, PLAT_H, 'spring', { hp: 1 });
          }
          addHazard({ x: gs, y: groundY, w: gw, h: 40, kind: 'pit', id: 'hz_pit_' + Math.round(gs) });

        case 'stairs': {

          steps = 3 + Math.floor(rng() * 3);
          stepW = 96;
          sx = x0 + 40;
          y = platY(true);
          for (i = 0; i < steps; i++) {

          if (rng() < 0.45) {
            addSolid(gs + gw - 60, groundY - 80, 90, PLAT_H, 'mover', {
              vx: 60 * (rng() < 0.5 ? -1 : 1), vy: 0, range: 50, phase: rng() * Math.PI * 2, hp: 1
            });
          }
          addHazard({ x: gs, y: groundY, w: gw, h: 40, kind: 'pit', id: 'hz_pit_' + Math.round(gs) });
          break;
        }

        case 'enemy':
          ground(x0, x1);
          addPlat(x0 + 80, platY(true), 120, PLAT_H, 'oneway');
          if (w > 400) addPlat(x0 + 260, platY(true), 110, PLAT_H, 'oneway');
          break;

        case 'machine':
          ground(x0, x1);
          addPlat(x0 + 60, platY(true), 120, PLAT_H, 'oneway');
          if (w > 400) addPlat(x0 + 250, platY(true), 110, PLAT_H, 'oneway');
          // 碎裂平台：踩上去会塌
          if (rng() < 0.5) {
            addSolid(x0 + Math.round(w * 0.55), groundY - 70, 80, PLAT_H, 'crumble', { hp: 1 });
          }
          break;

        case 'sprint':
          ground(x0, x1);
          addPlat(x0 + 90, platY(true), 130, PLAT_H, 'oneway');
          if (w > 460) addPlat(x0 + 300, platY(true), 120, PLAT_H, 'oneway');
          break;

        case 'gauntlet': {
          gw = Math.min(175, 110);
          gs = x0 + Math.round((w - gw) * 0.35);
          ground(x0, gs);
          ground(gs + gw, x1);
          addPlat(gs - 20, platY(true), 110, PLAT_H, 'oneway');
          addPlat(gs + gw - 90, platY(true), 110, PLAT_H, 'oneway');
          addHazard({ x: gs, y: groundY, w: gw, h: 40, kind: 'pit', id: 'hz_pit_' + Math.round(gs) });
          break;
        }
      }
    }

    while (cur < endX) {
      var type = pickWeighted(rng, weights());
      var L = randInt(rng, SECTION_LEN[type][0], SECTION_LEN[type][1]);
      if (cur + L > endX) L = endX - cur;
      if (L < 140) {
        // 剩余太短：补一个 flat 段落尾巴
        type = 'flat';
        L = endX - cur;
      }
      sections.push({ type: type, x0: cur, x1: cur + L });
      buildSection(type, cur, cur + L);
      cur += L;
    }
    /* 末段恒为 sprint（长 480，通向终点） */
    sections.push({ type: 'sprint', x0: endX, x1: len });
    buildSection('sprint', endX, len);

    /* 平台链补齐：保证任意相邻平台类实体左边缘间距 ≤ CHAIN_DX */
    var plats = solids.filter(function (s) { return isPlatKind(s.kind); })
      .sort(function (a, b) { return a.x - b.x; });
    var filler = [];
    var guard = 0;
    for (var i = 1; i < plats.length && guard < 4000; i++) {
      var a = plats[i - 1], b = plats[i];
      var dx = b.x - a.x;
      while (dx > CHAIN_DX && guard++ < 4000) {
        var fw = 60;
        var fx = a.x + CHAIN_DX - fw + 10;
        if (fx < a.x + a.w + 10) fx = a.x + a.w + 10;
        if (fx > b.x - 20) break;
        var f = addSolid(fx, a.y, fw, 14, 'oneway');
        filler.push(f);
        a = f;
        dx = b.x - a.x;
      }
    }
    if (filler.length) {
      // 补齐的踏板也纳入链尾，保证最后一节到终点之间不出现大跨度
      var lastPlat = null;
      for (var j = 0; j < solids.length; j++) if (isPlatKind(solids[j].kind)) lastPlat = solids[j];
      if (lastPlat) {
        var xEnd = len - 200;
        while (lastPlat.x + CHAIN_DX < xEnd && guard++ < 4000) {
          var nx = lastPlat.x + CHAIN_DX - 50;
          var ns = addSolid(nx, lastPlat.y, 60, 14, 'oneway');
          lastPlat = ns;
        }
      }
    }

    /* 难度系数：旧版 1.9 / 2.0 / 0.35 的封顶在第 22~31 关就到头，
       之后 20 关完全不再变难。现在把封顶推后、斜率加大。 */
    var enemySpeedK = Math.min(1 + 0.035 * (n - 1), 2.6);
    var densityK = Math.min(1 + 0.05 * (n - 1), 3.2);
    var rarityWeight = Math.max(0.22, 1 - 0.035 * (n - 1));

    return {
      n: n, len: len, seed: seed, rng: rng, groundY: groundY, goalX: goalX,
      diff: diff, dp: dp, biome: biome, sections: sections, solids: solids,
      hazards: hazards, targetCheese: levelTargets(n, len).cheese,
      enemySpeedK: enemySpeedK, densityK: densityK, rarityWeight: rarityWeight
    };
  }

  /* ---- 敌人布点 ---- */
  function genEnemyPlacements(level, runSeed, solids, layout) {
    var L = layout || genLayout(level, runSeed);
    var rng = mulberry32(hash32(L.n, (runSeed ^ 0x27d4eb2f) >>> 0));
    var out = [];
    var safeX = L.goalX - 220;
    var speedK = L.enemySpeedK, densK = L.densityK;

    function push(kind, x, y) {
      var d = ENEMIES[kind];
      var e = {
        x: x, y: y, w: d.w, h: d.h, kind: kind,
        vx: 0, hp: d.hp, maxHp: d.hp, range: 0, y0: y, phase: 0, state: 'idle', t: 0
      };
      if (kind === 'cat') { e.vx = d.speed * speedK; e.range = 110; e.state = 'patrol'; }
      else if (kind === 'drone') { e.vx = d.speed * speedK * 0.6; e.range = 28; e.y0 = y; e.state = 'fly'; e.phase = rng() * Math.PI * 2; }
      else if (kind === 'wasp') { e.vx = d.speed * speedK * 0.7; e.range = 80; e.state = 'chase'; e.y0 = y; }
      else if (kind === 'turret') { e.vx = 0; e.range = 0; e.state = 'aim'; }
      out.push(e);
    }

    /* 敌人避开砖墙：砖墙 80 高（只能靠钻头撞碎），猫紧贴砖墙 = 玩家要一次
       跳过「猫 + 墙」，几乎不可能。 */
    function avoidBrick(x) {
      for (var t = 0; t < 5; t++) {
        var hit = false;
        for (var i = 0; i < solids.length; i++) {
          var s = solids[i];
          if (s.kind !== 'brick') continue;
          if (x < s.x + s.w + 70 && x + 40 > s.x - 70) { hit = true; break; }
        }
        if (!hit) break;
        x += 150;
      }
      return x;
    }

    for (var i = 0; i < L.sections.length; i++) {
      var sec = L.sections[i];
      var count = 0;
      if (sec.type === 'enemy') count = Math.max(1, Math.round(densK * 1.6));
      else if (sec.type === 'gauntlet') count = 1 + (L.dp > 0.35 && rng() < L.dp ? 1 : 0);
      else if (sec.type === 'flat' && sec.x0 > 0 && L.n >= 2) {
        count = (rng() < 0.60 + 0.30 * L.dp) ? Math.max(1, Math.round(densK * 0.55)) : 0;
      }
      if (count <= 0) continue;
      var w = sec.x1 - sec.x0;
      /* 同一段内多个敌人按「槽位」铺开：随机取点会让两只猫叠在同一 x，
         形成一堵跳不干净的墙（旧版概率低很少撞上，密度提高后必现）。 */
      var span = Math.max(40, w - 140);
      var slot = span / count;
      for (var k = 0; k < count; k++) {
        var x = sec.x0 + 60 + (k + 0.5) * slot + (rng() - 0.5) * slot * 0.5;
        x = clamp(x, sec.x0 + 40, sec.x1 - 40);
        x = avoidBrick(x);
        /* 敌人构成随难度变化：炮台（远程瞄准）与追踪蜂（会追）占比随难度上升，
           会飘的无人机占比下降 —— 旧版后期敌人种类几乎不变，只是变多。 */
        var tP = (L.n >= 4 ? 0.08 : 0) + 0.14 * L.dp;   // 炮台
        var cP = 0.40 - 0.08 * L.dp;                    // 巡逻猫
        var wP = 0.26 + 0.14 * L.dp;                    // 追踪蜂
        var r = rng();
        var kind = 'cat';
        if (r < tP) kind = 'turret';
        else if (r < tP + cP) kind = 'cat';
        else if (r < tP + cP + wP) kind = 'wasp';
        else kind = 'drone';
        var y;
        if (kind === 'drone') y = L.groundY - 120 - rng() * 30;
        else if (kind === 'wasp') y = L.groundY - 110 - rng() * 20;
        else y = L.groundY - ENEMIES[kind].h;
        push(kind, x, y);
      }
    }
    /* 终点前 220px 内不得有敌人 */
    return out.filter(function (e) { return e.x + e.w <= safeX; });
  }

  /* ---- 机关/危险物布点 ---- */
  var MACHINE_KINDS = ['pendulum', 'laser', 'crusher', 'blade', 'rock', 'drone'];
  var STATIC_KINDS = ['spike', 'fence', 'acid'];

  function makeHazard(kind, x, groundY, rng) {
    var d = HAZARDS[kind];
    var h = { x: x, y: groundY, w: d.w, h: d.h, kind: kind, id: 'hz_' + kind + '_' + Math.round(x) };
    switch (kind) {
      case 'spike':   h.y = groundY - d.h; break;
      case 'fence':   h.y = groundY - d.h; break;
      case 'acid':    h.y = groundY - d.h; break;
      case 'pendulum': h.y = groundY - 210; h.range = 90; h.phase = rng() * Math.PI * 2; h.pivotY = groundY - 230; break;
      case 'laser':   h.y = groundY - 220; h.phase = rng() * Math.PI * 2; h.period = 2.4; break;
      case 'blade':   h.y = groundY - 160; h.range = 60; h.phase = rng() * Math.PI * 2; break;
      case 'crusher': h.y = groundY - 260; h.phase = rng() * Math.PI * 2; h.period = 3.0; h.h = 240; break;
      case 'rock':    h.y = groundY - 230; h.vy = 120; break;
      case 'cat':     h.y = groundY - d.h; h.range = 100; h.phase = rng() * Math.PI * 2; break;
      case 'drone':   h.y = groundY - 140; h.range = 60; h.phase = rng() * Math.PI * 2; break;
    }
    return h;
  }

  function genHazardPlacements(level, runSeed, solids, layout, enemies) {
    var L = layout || genLayout(level, runSeed);
    var rng = mulberry32(hash32(L.n, (runSeed ^ 0x165667b1) >>> 0));
    var out = [];
    var machineOk = L.n >= 2;
    var foes = enemies || [];

    function place(kind, x) {
      // 避免与平台链在同一 x 区间重叠（平台带高度 40~100），也避开砖墙
      for (var t = 0; t < 4; t++) {
        var bad = false;
        for (var i = 0; i < solids.length; i++) {
          var s = solids[i];
          if (s.kind === 'brick') {
            if (x < s.x + s.w + 60 && x + HAZARDS[kind].w > s.x - 60) { bad = true; break; }
            continue;
          }
          if (!isPlatKind(s.kind)) continue;
          if (s.x < x + HAZARDS[kind].w && s.x + s.w > x) {
            if (s.y < L.groundY && s.y > L.groundY - 110) { bad = true; break; }
          }
        }
        if (!bad) break;
        x += 130;
      }
      // 避免与敌人重叠：敌人和危险物叠在一起 = 跑不过去的一堵墙
      for (var t2 = 0; t2 < 5; t2++) {
        var clash = false;
        for (var j = 0; j < foes.length; j++) {
          var e = foes[j];
          if (x < e.x + e.w + 70 && x + HAZARDS[kind].w > e.x - 70) { clash = true; break; }
        }
        if (!clash) break;
        x += 150;
      }
      out.push(makeHazard(kind, x, L.groundY, rng));
    }

    for (var i = 0; i < L.sections.length; i++) {
      var sec = L.sections[i];
      if (sec.type === 'machine' || sec.type === 'gauntlet') {
        /* 机关段：难度越高，每段塞的机关越多（上限 3） */
        var count = 1 + (rng() < 0.65 ? 1 : 0);
        if (L.dp > 0.4 && rng() < L.dp) count++;
        /* 同一段内多个机关按槽位铺开，避免叠成一坨 */
        var hspan = Math.max(30, (sec.x1 - sec.x0) - 160);
        var hslot = hspan / count;
        for (var k = 0; k < count; k++) {
          var kind = machineOk ? MACHINE_KINDS[Math.floor(rng() * MACHINE_KINDS.length)]
                               : STATIC_KINDS[Math.floor(rng() * STATIC_KINDS.length)];
          var x = sec.x0 + 70 + (k + 0.5) * hslot + (rng() - 0.5) * hslot * 0.5;
          place(kind, x);
        }
      } else if (sec.type === 'enemy' && L.n >= 2 && rng() < 0.50 + 0.30 * L.dp) {
        var sx = sec.x0 + 90 + rng() * Math.max(30, (sec.x1 - sec.x0) - 200);
        place(STATIC_KINDS[Math.floor(rng() * STATIC_KINDS.length)], sx);
      }
      /* 巡逻猫（危险物版本）出现在平地段落 */
      if (sec.type === 'flat' && sec.x0 > 0 && L.n >= 2 && rng() < 0.50 + 0.35 * L.dp) {
        var cx = sec.x0 + 80 + rng() * Math.max(30, (sec.x1 - sec.x0) - 200);
        place('cat', cx);
      }
      /* 中后期在 gap / stairs / float 段也放静态机关（尖刺 / 栅栏 / 酸液），
         否则高关卡的机关只集中在 machine / gauntlet 两种段落里，节奏很规律。 */
      if (L.dp > 0.25 && (sec.type === 'gap' || sec.type === 'stairs' || sec.type === 'float')) {
        if (rng() < (L.dp - 0.25) * 0.9) {
          var gx = sec.x0 + 100 + rng() * Math.max(30, (sec.x1 - sec.x0) - 220);
          place(STATIC_KINDS[Math.floor(rng() * STATIC_KINDS.length)], gx);
        }
      }
    }
    /* 终点前 220px 内不得有伤害性机关 */
    var safeX = L.goalX - 220;
    out = out.filter(function (h) { return h.x + h.w <= safeX; });
    /* 保底：每关至少 2 个伤害性机关（静态类，低关也可能有尖刺/栅栏） */
    var dmg = out.filter(function (h) { return h.kind !== 'pit'; });
    if (dmg.length < 2) {
      var need = 2 - dmg.length;
      for (var t = 0; t < need; t++) {
        var fx = 420 + t * 260 + Math.floor(rng() * 120);
        if (fx > safeX - 60) fx = safeX - 60 - (need - t) * 40;
        if (fx < 380) continue;
        out.push(makeHazard(STATIC_KINDS[t % STATIC_KINDS.length], fx, L.groundY, rng));
      }
    }
    return out;
  }

  /* ---- 道具布点 ---- */
  function genItemPlacements(level, runSeed, solids, layout) {
    var L = layout || genLayout(level, runSeed);
    var rng = mulberry32(hash32(L.n, (runSeed ^ 0x5bf03635) >>> 0));
    var picks = [];
    var i, x, pos;

    function surfaceY(xx) {
      var best = null;
      for (var k = 0; k < solids.length; k++) {
        var s = solids[k];
        if (s.kind === 'ground') {
          if (xx >= s.x - 2 && xx <= s.x + s.w + 2) best = s.y;
        } else if (isPlatKind(s.kind)) {
          if (xx >= s.x && xx <= s.x + s.w) {
            if (best === null || s.y < best) best = s.y;
          }
        }
      }
      return best;
    }
    function place(xx) {
      var roll = rng();
      if (roll < 0.34) {
        // 放在平台上
        var cands = [];
        for (var k = 0; k < solids.length; k++) {
          var s = solids[k];
          if (isPlatKind(s.kind) && xx >= s.x - 30 && xx <= s.x + s.w + 30) cands.push(s);
        }
        if (cands.length) {
          var s2 = cands[Math.floor(rng() * cands.length)];
          return { x: clamp(xx, s2.x + 12, s2.x + s2.w - 12), y: s2.y - 22 };
        }
      }
      if (roll < 0.62) {
        // 空中
        return { x: xx, y: L.groundY - 70 - rng() * 55 };
      }
      // 地面
      return { x: xx, y: L.groundY - 22 };
    }

    /* ---- 收集类：奶酪 / 金币 ----
       按关卡目标数分层均匀铺开（带抖动，避免扎堆也避免过密）。
       旧版每关额外撒 (len/300) 个随机道具，密集处一个道具只隔 0.3 秒，
       既刷屏又抢跑酷节奏；现在总量固定、间距可控。
       关卡加长后总量随之增长，但**密度**基本恒定（约 3.4 个/千单位），
       长关卡既不会空荡，也不会刷屏。 */
    var target = levelTargets(L.n, L.len).cheese;
    // 奶酪数必须 ≥ 星级目标（留 3 个余量），否则高关卡拿不到二星
    var cheeseN = Math.min(target + 3, 40);
    var coinN = Math.min(6 + Math.floor(L.len / 2600), 20);

    /* ---- 能力道具：23 种（除奶酪/金币外），每关 5 种 ----
       取池子里的「连续 5 个」窗口，窗口起点按关卡步进 5（23 与 5 互质）：
       第 1~5 关恰好覆盖全部 23 种，第 6 关起窗口继续轮转、不会重复扎堆。 */
    var powerPool = ITEM_IDS.filter(function (id) { return id !== 'cheese' && id !== 'coin'; });
    var powerIds = [];
    var pStart = ((L.n - 1) * 5) % powerPool.length;
    for (i = 0; i < 5; i++) {
      powerIds.push(powerPool[(pStart + i) % powerPool.length]);
    }

    function layOut(ids, from, to) {
      if (!ids.length) return;
      var span = Math.max(120, to - from);
      var gap = span / ids.length;
      for (var j = 0; j < ids.length; j++) {
        var base = from + (j + 0.5) * gap;
        var jit = (rng() - 0.5) * gap * 0.35;   // 抖动控制在 35% 以内，保证不扎堆
        x = clamp(base + jit, from + 30, to - 30);
        pos = place(x);
        picks.push({ x: Math.round(pos.x), y: Math.round(pos.y), id: ids[j], r: 16, type: 'pickup' });
      }
    }

    /* 收集类与能力道具交错排布（避免奶酪/金币连成一片、也避免能力道具扎堆） */
    var mixed = [];
    var ci = 0, oi = 0;
    var coll = [];
    for (i = 0; i < cheeseN; i++) coll.push('cheese');
    for (i = 0; i < coinN; i++) coll.push('coin');
    while (ci < coll.length || oi < powerIds.length) {
      if (ci < coll.length) mixed.push(coll[ci++]);
      if (oi < powerIds.length) mixed.push(powerIds[oi++]);
    }
    layOut(mixed, 170, L.len - 200);

    /* 最小间距整理：不同分组万一仍挨太近，强制拉开 */
    picks.sort(function (a, b) { return a.x - b.x; });
    var MIN_GAP = 70;
    for (i = 1; i < picks.length; i++) {
      var minX = picks[i - 1].x + MIN_GAP;
      if (picks[i].x < minX) picks[i].x = Math.round(minX);
    }
    return picks;
  }

  /* ---- 对外：生成一整关 ---- */
  function genLevel(level, runSeed) {
    var L = genLayout(level, runSeed);
    var n = L.n;
    /* 敌人先算，机关布点据此避让（两者叠在一起会形成跑不过去的墙） */
    var enemies = genEnemyPlacements(n, runSeed, L.solids, L);
    var hazards = genHazardPlacements(n, runSeed, L.solids, L, enemies);
    return {
      level: n,
      seed: L.seed,
      biome: L.biome,
      length: L.len,
      groundY: L.groundY,
      diff: L.diff,
      solids: L.solids,
      hazards: L.hazards.concat(hazards),
      pickups: genItemPlacements(n, runSeed, L.solids, L),
      enemies: enemies,
      checkpoints: L.sections.map(function (s) { return s.x0; }),
      goalX: L.goalX,
      sections: L.sections,
      targetCheese: L.targetCheese,
      spawn: { x: 90, y: L.groundY - 60 },
      enemySpeedK: L.enemySpeedK,
      densityK: L.densityK,
      rarityWeight: L.rarityWeight
    };
  }

  /* ======================================================================
   * 十、玩家 / 局内数据
   * ==================================================================== */
  var PLAYER_FIELDS = [
    /* —— 契约 §2.1.1 字段 —— */
    'x', 'y', 'vx', 'vy', 'w', 'h', 'dir',
    'onGround', 'wasOnGround', 'jumpsLeft', 'coyote', 'jumpBuf', 'jumpHeld',
    'dashT', 'dashCd', 'dashDir', 'sliding', 'slideT',
    'stamina', 'hp', 'invuln', 'hurtT', 'dead', 'deadT',
    'buffs', 'stylePts', 'styleLevel', 'styleCombo', 'styleTimer',
    'combo', 'comboTimer', 'energy',
    'lives', 'maxLives', 'hasBell', 'bellUsed',
    'coins', 'cheese', 'gems', 'score',
    'level', 'checkpointX', 'spawnX', 'spawnY',
    'airTime', 'airComboScore', 'lastLandVy', 'groundedTime', 'runT', 'animT',
    'megaReady', 'megaActive',
    /* —— 本模块新增字段 —— */
    'input', 'permanentBubbles', 'rocketAmmo', 'shieldCharges',
    'crumbleStand', 'standId', 'jumpCut', 'deadReason', 'grazeCd'
  ];

  function createPlayer(x, y) {
    x = x || 0; y = y || 0;
    return {
      x: x, y: y, vx: 0, vy: 0, w: PHYS.PLAYER_W, h: PHYS.PLAYER_H, dir: 1,
      onGround: false, wasOnGround: false, jumpsLeft: 0, coyote: 0, jumpBuf: 0, jumpHeld: false,
      dashT: 0, dashCd: 0, dashDir: 1, sliding: false, slideT: 0,

  /* 关卡目标：奶酪数量目标。

     没给长度就按关卡数定（对外 API 的旧行为）。

  /* ======================================================================
   * 十二、道具效果

  /* ======================================================================

  function normalizeInput(src) {

  /* 移动平台当前位置（确定性：与 t 有关） */

      if (s.kind === 'oneway' || s.kind === 'mover') {

  function renderClear(data) {
    var card = screens.clear.__card;
    if (!card) return;
    cancelRolls();
    card.innerHTML = '';
    var tt = el('div', 'panel-tt', '关卡通关');
    tt.appendChild(el('span', 'panel-en', 'LEVEL ' + (data.level || 1) + ' CLEAR'));
    card.appendChild(tt);
    if (data.flawless) card.appendChild(el('div', 'badge', '无伤通关'));

    var stars = el('div', 'stars');
    var n = Math.max(0, Math.min(3, data.stars || 1));
    for (var i = 0; i < 3; i++) {
      var st = el('div', 'star', '★');
      if (i < n) { st.classList.add('on'); st.style.animationDelay = (0.12 * i) + 's'; }
      stars.appendChild(st);
    }
    card.appendChild(stars);

    var mk = data.mk || {};
    var list = el('div', 'res-list');
    var rows = [
      ['距离分', mk.distance || 0],
      ['拾取分', mk.pickup || 0],
      ['风格分', mk.style || 0],
      ['击杀分', mk.kill || 0],
      ['过关奖励', mk.clear || 0]
    ];
    var nodes = [];
    for (var r = 0; r < rows.length; r++) {
      var row = el('div', 'res-row');
      row.appendChild(el('span', null, rows[r][0]));
      var b = el('b', 'num', '0');
      row.appendChild(b);
      list.appendChild(row);
      nodes.push({ node: b, val: rows[r][1] });
    }
    var tot = el('div', 'res-row total');
    tot.appendChild(el('span', null, '总分'));
    var tb = el('b', 'num', '0');
    tot.appendChild(tb);
    list.appendChild(tot);
    card.appendChild(list);

    var cr = el('div', 'res-row');
    cr.appendChild(el('span', null, '奶酪收集'));
    cr.appendChild(el('b', 'num', fmtNum(data.cheese || 0) + ' / ' + fmtNum(data.targetCheese || 0)));

    var hr = el('div', 'res-row');
    hr.appendChild(el('span', null, '最高连击'));
    hr.appendChild(el('b', 'num', '×' + fmtNum(data.combo || 0)));
    card.appendChild(hr);

    sr.appendChild(el('span', null, '风格等级 '));
    sr.appendChild(el('b', null, data.styleLevel || 'D'));
    sr.appendChild(el('span', 'num', ' · ' + fmtNum(data.stylePts || 0) + ' 分'));

    br.appendChild(mkBtn('pri', '下一关', 'next'));
    br.appendChild(mkBtn('', '重玩本关', 'retry'));
    br.appendChild(mkBtn('ghost', '主菜单', 'menu'));
    card.appendChild(br);

    for (var n2 = 0; n2 < nodes.length; n2++) rollTo(nodes[n2].node, nodes[n2].val, 520);
    rollTo(tb, data.score || 0, 760);
  }

  function chipRow(label, group, opts) {
    var row = el('div', 'set-row');
    row.appendChild(el('div', 'set-lbl', label));
    var ctl = el('div', 'set-ctl chips');
    ctl.setAttribute('data-group', group);
    for (var i = 0; i < opts.length; i++) {
      var c = el('button', 'chip', opts[i].t);
      c.setAttribute('type', 'button');
      c.setAttribute('data-action', group === 'vibrate' ? 'setVibrate'
        : group === 'quality' ? 'setQuality'
          : group === 'orient' ? 'setOrient'
            : group === 'speed' ? 'setSpeed' : 'setTouchUI');
      c.setAttribute('data-value', opts[i].v);
      ctl.appendChild(c);
    }
    row.appendChild(ctl);
    return row;
  }

  function cfgValue(name) {
    if (name === 'vibrate') return cfg.vibrate ? 'true' : 'false';
    if (name === 'quality') return cfg.quality;
    if (name === 'orient') return orientMode;
    if (name === 'speed') return String(cfg.speed === undefined ? 1 : cfg.speed);
    if (name === 'touchUI') return cfg.touchUI === null ? 'auto' : (cfg.touchUI ? 'true' : 'false');
    return '';
  }

  function refreshSettings() {
    if (!screens.settings) return;
    var groups = screens.settings.querySelectorAll('.chips[data-group]');
    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      var val = cfgValue(g.getAttribute('data-group'));
      var chips = g.querySelectorAll('.chip');
      for (var j = 0; j < chips.length; j++) {
        chips[j].classList.toggle('on', chips[j].getAttribute('data-value') === val);
      }
    }
    var bgm = $('set-bgm'), sfxIn = $('set-sfx');
    if (bgm) bgm.value = String(Math.round(cfg.bgm * 100));
    if (sfxIn) sfxIn.value = String(Math.round(cfg.sfx * 100));
  }

  function fillCodex() {
    if (codexBuilt || !codexHosts) return;
    buildCodex(codexHosts.pickup, ITEM_ORDER, ITEM_DOC, liveMap('ITEMS'), false);
    buildCodex(codexHosts.hazard, HAZARD_ORDER, HAZARD_DOC, liveMap('HAZARDS'), true);
    codexBuilt = true;
  }

  function liveMap(name) {
    var lg = window.MP ? window.MP.LOGIC : null;
    if (!lg) return null;
    var m = lg[name];
    return (m && typeof m === 'object') ? m : null;
  }

  function buildCodex(host, ids, docs, live, isBad) {
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      var l = live ? live[id] : null;
      var nm = (l && l.name) ? l.name : (docs[id] ? docs[id][0] : id);
