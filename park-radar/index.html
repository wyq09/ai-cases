/* 特征 key → 公园谓词 */
const FEAT_CHECK = {
    picnic: p => join(p).match(/野餐|草坪/),
    photo: p => join(p).match(/拍照|出片|摄影|打卡|花海|灯光森林/),
    parking: p => join(p).match(/停车|自驾/) || p.facilities.some(f => f.icon === 'CarIcon'),
    night: p => /夜|灯光|萤火/.test(join(p)) || lateClose(p),
    bird: p => /观鸟|候鸟|白鹭/.test(join(p)),
    boat: p => /划船|游船|脚踏船/.test(join(p)),
    waterplay: p => /戏水|玩水|泳池/.test(join(p)),
    pick: p => /采摘|摘果/.test(join(p)),
    star: p => /观星|银河|星空/.test(join(p)),
    hike: p => /爬山|登山|徒步|登山道|步道/.test(join(p)) || p.cat === 'forest',
    cafe: p => /咖啡|茶座|茶室/.test(join(p)) || p.facilities.some(f => f.icon === 'CoffeeIcon'),
    bbq: p => /烧烤|篝火/.test(join(p)),
    free: p => p.ticket === 0,
    quiet: p => p.crowd <= 2,
    dog: p => /宠物|遛狗|带狗/.test(join(p)) || p.cat === 'pet',
    kid: p => p.cat === 'family' || /遛娃|亲子|儿童|宝宝|滑梯|母婴/.test(join(p)),
};
const join = p => `${p.name} ${p.features.join(' ')} ${p.tags.join(' ')} ${p.desc}`;
const lateClose = p => {
    if (p.open === '全天' || p.close === '开放') return true;
    const [h] = p.close.split(':').map(Number);
    return h >= 20;
};
/* 类别谓词（lake 兼容有水的湿地） */
const CAT_CHECK = {
    lake: p => p.cat === 'lake' || !!p.scene.water || /湖/.test(join(p)),
};
const catMatch = (k, p) => (CAT_CHECK[k] ? CAT_CHECK[k](p) : p.cat === k);

/* 公园别名（模糊指认） */
const ALIASES = PARKS.map(p => {
    const short = p.name.replace(/(湿地公园|森林公园|文化园|运动公园|儿童公园|露营基地|宠物乐园|公园|园|基地)$/g, '');
    return { p, keys: [p.name, short, short.slice(0, 2), short.slice(0, 3)].filter((v, i, a) => v && v.length >= 2 && a.indexOf(v) === i) };
});

function parseQuery(text, ctx) {
    const q = String(text || '').trim();
    const low = q.toLowerCase();
    const has = arr => arr.some(w => low.includes(w));
    const res = { q, intent: 'search', cats: [], feats: [], maxDist: null, sortBy: null, needFree: false, park: null, ordinal: null, text: q };

    if (!q) { res.intent = 'empty'; return res; }
    if (q.length <= 14 && has(LEX.greet)) { res.intent = 'greet'; return res; }
    if (has(LEX.help)) { res.intent = 'help'; return res; }
    if (q.length <= 12 && has(LEX.thanks)) { res.intent = 'thanks'; return res; }
    if (has(LEX.favAsk)) { res.intent = 'favs'; return res; }
    if (has(LEX.likeAsk)) { res.intent = 'likes'; return res; }
    if (has(LEX.histAsk)) { res.intent = 'history'; return res; }
    if (has(LEX.weatherRain)) { res.intent = 'rain'; return res; }

    /* 指认具体公园 */
    for (const a of ALIASES) {
        if (a.keys.some(k => q.includes(k))) { res.intent = 'park'; res.park = a.p; return res; }
    }
    /* 序数指代上一轮结果 */
    const om = q.match(/第\s*([一二三1-3])\s*[个家]?/);
    const bare = q.match(/^([一二三1-3])$/);
    if ((om || bare) && ctx && ctx.lastResults && ctx.lastResults.length) {
        const zh = { '一': 1, '二': 2, '三': 3, '1': 1, '2': 2, '3': 3 };
        const idx = zh[(om && om[1]) || (bare && bare[1])] - 1;
        const p = PARK_BY_ID[(ctx.lastResults[idx] || {}).id];
        if (p) { res.intent = 'park'; res.park = p; return res; }
    }
    /* 换一批 */
    if (has(LEX.more)) { res.intent = 'more'; return res; }

    /* 条件抽取 */
    for (const [k, words] of Object.entries(LEX.cats)) if (has(words)) res.cats.push(k);
    for (const [k, words] of Object.entries(LEX.feats)) if (has(words)) res.feats.push(k);
    if (has(LEX.freeW)) { res.needFree = true; res.feats.push('free'); }
    if (has(LEX.crowdW)) res.feats.push('quiet');
    if (/遛娃|带娃|孩子|儿童|宝宝|亲子|小朋友/.test(q)) res.feats.push('kid');
    if (/遛狗|带狗|宠物|毛孩子/.test(q)) res.feats.push('dog');

    const dm = q.match(/(\d+(?:\.\d+)?)\s*(公里|km|千米)/i);
    if (dm) res.maxDist = parseFloat(dm[1]);
    if (has(LEX.near) && !res.maxDist) res.sortBy = 'distance';
    if (has(LEX.ratingW)) res.sortBy = 'rating';
    if (has(LEX.crowdW)) res.sortBy = res.sortBy || 'quiet';
    if (has(LEX.popW) && !res.sortBy) res.sortBy = 'popular';

    const anyFilter = res.cats.length || res.feats.length || res.maxDist || res.sortBy;
    if (!anyFilter) {
        res.intent = has(LEX.recW) ? 'recommend' : 'fallback';
    }
    return res;
}

function searchParks(parsed, offset = 0) {
    const { cats, feats, maxDist, sortBy } = parsed;
    const scored = PARKS.map(p => {
        let score = 0; const matched = [];
        cats.forEach(k => { if (catMatch(k, p)) { score += 4; matched.push(catMeta(k).label); } });
        feats.forEach(k => { const fn = FEAT_CHECK[k]; if (fn && fn(p)) { score += 3; matched.push(FEAT_LABEL[k] || k); } });
        if (maxDist != null) { if (p.distance <= maxDist) score += 2; else score -= (p.distance - maxDist) * 1.2; }
        score += p.rating * 0.8 - p.crowd * 0.25 - p.distance * 0.08;
        return { p, score, matched: [...new Set(matched)] };
    });
    const anyHard = cats.length || feats.length || maxDist != null;
    let list = scored.filter(x => !anyHard || x.score > 1.2);
    if (!list.length) list = scored;
    if (sortBy === 'distance') list.sort((a, b) => a.p.distance - b.p.distance);
    else if (sortBy === 'rating') list.sort((a, b) => b.p.rating - a.p.rating);
    else if (sortBy === 'quiet') list.sort((a, b) => a.p.crowd - b.p.crowd || b.p.rating - a.p.rating);
    else if (sortBy === 'popular') list.sort((a, b) => b.p.reviews - a.p.reviews);
    else list.sort((a, b) => b.score - a.score);
    const strong = list.filter(x => x.matched.length || !anyHard);
    const finalList = (strong.length ? strong : list);
    const rotated = offset ? [...finalList.slice(offset % Math.max(finalList.length - 2, 1)), ...finalList.slice(0, offset % Math.max(finalList.length - 2, 1))] : finalList;
    return rotated.slice(0, 3).map(x => ({ ...x }));
}

const FEAT_LABEL = {
    picnic: '可野餐', photo: '适合拍照', parking: '好停车', night: '夜景/夜游', bird: '可观鸟',
    boat: '可划船', waterplay: '可戏水', pick: '可采摘', star: '可观星', hike: '可徒步',
    cafe: '有咖啡茶座', bbq: '烧烤篝火', free: '免费', quiet: '人少清净', dog: '宠物友好', kid: '适合遛娃',
};

/* ---------- 回复生成 ---------- */
function buildReply(parsed, st, ctx) {
    const name = st.user || '朋友';
    switch (parsed.intent) {
        case 'empty':
            return { text: '我在呢～说说你想去什么样的公园吧。', chips: DEFAULT_CHIPS };
        case 'greet': {
            const h = new Date().getHours();
            const gt = h < 6 ? '夜深了' : h < 11 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
            return {
                text: `${gt}，${name}！我是${AGENT_NAME}，公园雷达的智能助手。\n告诉我你的想法，比如「想找个免费的湖边公园」，我马上为你扫描全城 ${PARKS.length} 座公园。`,
                chips: DEFAULT_CHIPS,
            };
        }
        case 'help':
            return {
                text: `我会做的事可不少：\n· 按需求找公园 —— 说一句「适合遛娃、免费、离家近」就行\n· 查公园详情 —— 直接问「翠湖湿地公园怎么样」\n· 个性化条件 —— 人少清净 / 评分最高 / 可以露营 / 能观星 / 有咖啡\n· 管理你的收藏 —— 问我「我的收藏」随时查看\n\n试试下面的快捷问题吧。`,
                chips: DEFAULT_CHIPS,
            };
        case 'thanks':
            return { text: '不客气！祝你在公园里玩得开心，有需要随时叫我。', chips: ['再看看别的公园', '我的收藏'] };
        case 'rain': {
            const picks = [PARK_BY_ID['p11'], PARK_BY_ID['p9']];
            return {
                text: '下雨天也有好去处——我帮你挑了两个有室内空间的公园：竹里馆的竹林书屋听雨最舒服，萤火森林的科普馆晚上还有夜行生物讲解。记得带伞。',
                cards: picks.map(p => ({ id: p.id, reason: '有室内空间，雨天友好' })),
                chips: ['晴天适合去哪', '换一批'],
            };
        }
        case 'favs': {
            const favs = st.favs.map(id => PARK_BY_ID[id]).filter(Boolean);
            if (!favs.length) return { text: '你还没有收藏任何公园哦。去发现页逛逛，点心形旁边的书签就能收藏。', chips: DEFAULT_CHIPS };
            return {
                text: `你收藏了 ${favs.length} 个公园，都帮你列出来了：`,
                cards: favs.slice(0, 4).map(p => ({ id: p.id, reason: '你的收藏' })),
                chips: ['换一批', '推荐相似的'],
            };
        }
        case 'likes': {
            const likes = st.likes.map(id => PARK_BY_ID[id]).filter(Boolean);
            if (!likes.length) return { text: '还没有点赞过公园。在列表或详情页点心形按钮，我就知道你偏爱哪里了。', chips: DEFAULT_CHIPS };
            return {
                text: `你点赞过的 ${likes.length} 个公园：`,
                cards: likes.slice(0, 4).map(p => ({ id: p.id, reason: '你点过赞' })),
                chips: ['我的收藏', '换一批'],
            };
        }
        case 'history': {
            const hist = st.history.map(x => PARK_BY_ID[x.id]).filter(Boolean);
            if (!hist.length) return { text: '还没有浏览足迹。去发现页看看，我会帮你记住足迹的。', chips: DEFAULT_CHIPS };
            return {
                text: `这是你最近看过的 ${Math.min(hist.length, 4)} 个公园：`,
                cards: hist.slice(0, 4).map(p => ({ id: p.id, reason: '最近浏览' })),
                chips: ['我的收藏', '换一批'],
            };
        }
        case 'park': {
            const p = parsed.park;
            const os = openState(p);
            return {
                text: `「${p.name}」${p.rating} 分，${os.open ? '现在正在营业' : '现在已闭园'}（${p.open}-${p.close}），门票${p.ticket === 0 ? '免费' : ` ¥${p.ticket}`}，距你 ${p.distance} 公里。\n${p.desc}\n小贴士：${p.tips}`,
                cards: [{ id: p.id, reason: p.tags.slice(0, 3).join(' · ') }],
                chips: ['有相似的公园吗', '今天人多吗', '打开详情页'],
                parkCtx: p.id,
            };
        }
        case 'more': {
            const base = ctx.lastParsed || { intent: 'search', cats: [], feats: [], maxDist: null, sortBy: null };
            const offset = (ctx.moreOffset || 0) + 3;
            const results = searchParks(base, offset);
            if (!results.length) return { text: '暂时没有找到更多了，换个条件试试？', chips: DEFAULT_CHIPS };
            return {
                text: `又帮你翻出一批，这 ${results.length} 个也不错：`,
                cards: results.map(x => ({ id: x.p.id, reason: x.matched.slice(0, 2).join(' · ') || `${x.p.rating} 分好评` })),
                chips: ['再换一批', '只看免费的', '人少一点的'],
                results, parsed: base, offset,
            };
        }
        case 'recommend': {
            const results = searchParks({ cats: [], feats: [], maxDist: null, sortBy: 'rating' }, Math.floor(Math.random() * 3));
            return {
                text: `收到！我按口碑和体验帮你精选了 3 个，闭眼冲不踩雷：`,
                cards: results.map(x => ({ id: x.p.id, reason: `${x.p.rating} 分 · ${x.p.tags[0]}` })),
                chips: ['要免费开放的', '要人少清净的', '适合遛娃的', '换一批'],
                results, parsed,
            };
        }
        case 'search': {
            const results = searchParks(parsed, 0);
            const conds = [];
            parsed.cats.forEach(k => conds.push(catMeta(k).label));
            parsed.feats.forEach(k => { const l = FEAT_LABEL[k]; if (l && !conds.includes(l)) conds.push(l); });
            if (parsed.maxDist) conds.push(`${parsed.maxDist} 公里内`);
            const condText = conds.length ? `「${conds.slice(0, 4).join(' + ')}」` : '';
            if (!results.length) {
                return { text: `咦，雷达扫了一圈，没有找到完全符合${condText}的公园。换个说法再试试？`, chips: DEFAULT_CHIPS, results: [], parsed };
            }
            const weak = results.every(x => !x.matched.length);
            const lead = weak
                ? `完全符合${condText}的公园暂时没有，这几个是最接近的：`
                : `雷达锁定！符合${condText}的公园有 ${results.length} 个推荐给你：`;
            return {
                text: lead,
                cards: results.map(x => ({
                    id: x.p.id,
                    reason: x.matched.length ? x.matched.slice(0, 3).join(' · ') : `${x.p.rating} 分 · ${x.p.distance}km`,
                })),
                chips: followChips(parsed),
                results, parsed,
            };
        }
        default:
            return {
                text: `这个我还真答不上来……我最擅长的是帮你找公园！\n可以告诉我：想做什么（遛娃/跑步/赏花/露营）、有什么要求（免费/人少/离得近），我来帮你扫描。`,
                chips: DEFAULT_CHIPS,
            };
    }
}

function followChips(parsed) {
    const chips = [];
    if (!parsed.feats.includes('free') && !parsed.needFree) chips.push('只看免费的');
    if (!parsed.feats.includes('quiet')) chips.push('人少一点的');
    if (parsed.sortBy !== 'distance') chips.push('离我更近的');
    chips.push('换一批');
    return chips.slice(0, 4);
}

const DEFAULT_CHIPS = ['附近人少的公园', '适合遛娃的', '免费又好玩', '可以带狗吗', '晚上哪里有夜景'];

/* 快捷 chip → 实际查询语句 */
const CHIP_Q = {
    '打开详情页': null, /* 特殊处理 */
    '今天人多吗': null,
    '有相似的公园吗': null,
};

/* 特殊 chip 处理（依赖上一轮上下文） */
function resolveChip(label, ctx) {
    if (label === '打开详情页') {
        const id = ctx.parkCtx || (ctx.lastResults && ctx.lastResults[0] && ctx.lastResults[0].id);
        return id ? { nav: `#/park/${id}` } : null;
    }
    if (label === '今天人多吗') {
        const p = PARK_BY_ID[ctx.parkCtx] || PARK_BY_ID[(ctx.lastResults && ctx.lastResults[0] && ctx.lastResults[0].id)];
        if (!p) return { q: '今天哪里人少' };
        const today = p.crowdWeek[todayIdx()];
        return {
            direct: {
                text: `${p.name}今天预计人流 ${today}/5（${crowdText(today)}）。${today >= 4 ? '建议早上 9 点前或傍晚 4 点后错峰前往。' : '现在过去正合适，不用挤。'}`,
                chips: ['打开详情页', '人少一点的公园'],
                parkCtx: p.id,
            },
        };
    }
    if (label === '有相似的公园吗') {
        const p = PARK_BY_ID[ctx.parkCtx] || PARK_BY_ID[(ctx.lastResults && ctx.lastResults[0] && ctx.lastResults[0].id)];
        if (!p) return { q: '推荐几个公园' };
        const sim = PARKS.filter(x => x.id !== p.id && (x.cat === p.cat || x.tags.some(t => p.tags.includes(t))))
            .sort((a, b) => b.rating - a.rating).slice(0, 3);
        return {
            direct: {
                text: sim.length ? `和「${p.name}」气质相近的有这几个，都是同类好去处：` : '暂时没有特别相似的，给你推荐几个高分公园吧。',
                cards: (sim.length ? sim : PARKS.slice(0, 3)).map(x => ({ id: x.id, reason: `与${p.name.slice(0, 2)}同类 · ${x.rating} 分` })),
                chips: ['换一批', '只看免费的'],
            },
        };
    }
    return { q: label };
}

/* ---------- Agent 主入口（含可选 LLM 桥接） ---------- */
async function agentAsk(text, st, ctx) {
    const llmCfg = LS.get('llm', null);
    if (llmCfg && llmCfg.baseUrl && llmCfg.apiKey) {
        try { return await llmAsk(text, st, ctx, llmCfg); } catch (e) { console.warn('[agent] LLM 调用失败，回退本地引擎:', e); }
    }
    await sleep(420 + Math.random() * 500);
    const parsed = parseQuery(text, ctx);
    const reply = buildReply(parsed, st, ctx);
    return normalizeReply(reply, parsed);
}

function normalizeReply(reply, parsed) {
    const results = reply.results || (reply.cards ? reply.cards.map(c => ({ p: PARK_BY_ID[c.id] })).filter(x => x.p) : []);
    return {
        text: reply.text,
        cards: reply.cards || [],
        chips: reply.chips || [],
        parkCtx: reply.parkCtx || null,
        meta: { lastResults: results.map(x => ({ id: x.p ? x.p.id : x.id })), lastParsed: reply.parsed || parsed, moreOffset: reply.offset || 0 },
    };
}

/* OpenAI 兼容接口桥接：返回 {text, cards, chips} */
async function llmAsk(text, st, ctx, cfg) {
    const parksBrief = PARKS.map(p => `${p.id}|${p.name}|${catMeta(p.cat).label}|${p.rating}分|${p.distance}km|门票${p.ticket === 0 ? '免费' : p.ticket + '元'}|人流${p.crowd}/5|${p.open}-${p.close}|特色:${p.features.join(',')}` ).join('\n');
    const sys = `你是「公园雷达」H5 应用里的智能助手小屿，帮用户在${CITY}找到合适的公园。公园数据（id|名称|类别|评分|距离|门票|人流|开放时间|特色）：\n${parksBrief}\n用户收藏:${st.favs.join(',') || '无'}。请只输出 JSON：{"text":"回复正文(简洁友好,可用\\n)","parkIds":["最多3个匹配的公园id"],"chips":["最多4个跟进问题"]}`;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    const resp = await fetch(cfg.baseUrl.replace(/\/$/, '') + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${cfg.apiKey}` },
        body: JSON.stringify({ model: cfg.model || 'gpt-4o-mini', messages: [{ role: 'system', content: sys }, { role: 'user', content: text }], temperature: 0.4 }),
        signal: ctrl.signal,
    });
    clearTimeout(timer);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const raw = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    const jm = raw.match(/\{[\s\S]*\}/);
    if (!jm) throw new Error('no JSON in reply');
    const obj = JSON.parse(jm[0]);
    const ids = (obj.parkIds || []).filter(id => PARK_BY_ID[id]).slice(0, 3);
    return {
        text: obj.text || '嗯……我没想好怎么说，但这些公园也许合适：',
        cards: ids.map(id => ({ id, reason: 'AI 推荐' })),
        chips: (obj.chips || []).slice(0, 4),
        parkCtx: ids[0] || null,
        meta: { lastResults: ids.map(id => ({ id })), lastParsed: null, moreOffset: 0 },
    };
}

    const related = PARKS.filter(x => x.id !== park.id && (x.cat === park.cat || x.tags.some(t => park.tags.includes(t)))).sort((a, b) => b.rating - a.rating).slice(0, 3);

    return (
        <div className={cn('detail-page', closing && 'closing')} style={zIndex ? { zIndex } : undefined}>
            <div className="scroll-progress"><div className="bar" ref={barRef} style={{ transform: `scaleX(${progress})` }} /></div>

            {/* 滚动后浮现的紧凑头 */}
            <div ref={headRef} style={{
                position: 'absolute', top: 0, left: 0, right: 0, zIndex: 55, opacity: 0, pointerEvents: 'none',
                display: 'flex', alignItems: 'center', gap: 10,
                padding: `calc(10px + env(safe-area-inset-top)) 14px 10px`,
                background: 'rgba(250,247,233,0.94)', backdropFilter: 'blur(10px)',
                borderBottom: '2px solid #ece1c6', transition: 'opacity 0.25s var(--animal-ease)',
            }}>
                <span style={{ fontWeight: 900, fontSize: 15.5, color: 'var(--animal-text)', flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{park.name}</span>
                <span style={{ display: 'flex', alignItems: 'center', gap: 3, fontSize: 13, fontWeight: 800, color: 'var(--animal-text-body)' }}>
                    <Icon name="StarIcon" size={14} />{park.rating.toFixed(1)}
                </span>
            </div>

            <div className="detail-scroller" ref={scrollerRef} onScroll={onScroll}>
                {/* Hero 场景 */}
                <div className="detail-hero">
                    <div style={{ position: 'absolute', inset: 0 }} ref={sceneRef}><SceneArt park={park} variant="hero" /></div>
                    <div className="hero-top">
                        <button className="hero-circle-btn" aria-label="返回" onClick={onBack}><Icon name="ArrowLeftIcon" size={20} /></button>
                        <div style={{ display: 'flex', gap: 8 }}>
                            <button className="hero-circle-btn" aria-label="分享" onClick={() => toast('info', '分享链接已复制（演示）')}>
                                <Icon name="ShareIcon" size={18} />
                            </button>
                            <button ref={favBtnRef} className={cn('hero-circle-btn hero-fav', faved && 'on')} aria-label={faved ? '取消收藏' : '收藏'}
                                onClick={() => toggleFav(park, favBtnRef.current)}>
                                <Icon name="BookmarkIcon" size={18} style={faved ? undefined : { filter: 'grayscale(1)', opacity: 0.55 }} />
                            </button>
                        </div>
                    </div>
                    <div className="hero-title-band">
                        <div style={{ minWidth: 0 }}>
                            <h1 className="hero-name">{park.name}</h1>
                            <div className="hero-sub">
                                <TagC color={color} variant="solid" size="small" icon={catMeta(park.cat).icon}>{catMeta(park.cat).label}</TagC>
                                <TagC color="default" variant="solid" size="small" icon="LocationIcon">{park.district}</TagC>
                            </div>
                        </div>
                        <div className="hero-rating-chip">
                            <span className="num">{park.rating.toFixed(1)}</span>
                            <span className="lbl">{park.reviews} 条评价</span>
                        </div>
                    </div>
                </div>

                {/* 内容区 */}
                <div className="detail-sheet">
                    {/* 基本信息 */}
                    <section className="detail-section">
                        <div className="info-grid">
                            <div className="info-cell">
                                <span className="ic-circle" style={{ background: '#e0f2f1' }}><Icon name="ClockIcon" size={21} /></span>
                                <span><span className="k">开放时间</span><span className="v" style={{ color: os.open ? 'var(--animal-success-active)' : 'var(--animal-error)' }}>{os.open ? '营业中' : '已闭园'} · {park.open === '全天' ? '全天' : `${park.open}-${park.close}`}</span></span>
                            </div>
                            <div className="info-cell">
                                <span className="ic-circle" style={{ background: '#fff8e1' }}><Icon name="TagIcon" size={20} /></span>
                                <span><span className="k">门票</span><span className="v">{park.ticketNote}</span></span>
                            </div>
                            <div className="info-cell">
                                <span className="ic-circle" style={{ background: '#ffebee' }}><Icon name="MapIcon" size={20} /></span>
                                <span style={{ minWidth: 0 }}><span className="k">距离 · 地址</span><span className="v" style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', display: 'block' }}>{park.distance}km · {park.address}</span></span>
                            </div>
                            <div className="info-cell">
                                <span className="ic-circle" style={{ background: '#f1f8e9' }}><Icon name="SunIcon" size={20} /></span>
                                <span><span className="k">最佳季节</span><span className="v">{park.best}</span></span>
                            </div>
                        </div>
                    </section>

                    {/* 数据带（odometer） */}
                    <section className="detail-section">
                        <div className="stat-band pattern pattern-app-yellow">
                            <div className="stat-cell">
                                <div className="stat-num"><Odometer value={park.area} /><span className="unit">公顷</span></div>
                                <div className="stat-lbl">园区面积</div>
                            </div>
                            <div className="stat-cell">
                                <div className="stat-num"><Odometer value={park.reviews} delay={80} /></div>
                                <div className="stat-lbl">累计评价</div>
                            </div>
                            <div className="stat-cell">
                                <div className="stat-num"><Odometer value={likeCount(park)} delay={160} /><span className="unit">赞</span></div>
                                <div className="stat-lbl">公园点赞</div>
                            </div>
                        </div>
                    </section>

                    {/* 简介 */}
                    <section className="detail-section">
                        <div className="section-head"><Ribbon color="rb-teal" variant="layer" size={14}>公园简介</Ribbon></div>
                        <p style={{ fontSize: 14, lineHeight: 1.85, color: 'var(--animal-text-body)', fontWeight: 500 }}>{park.desc}</p>
                    </section>

                    {/* 亮点 */}
                    <section className="detail-section">
                        <div className="section-head"><Ribbon color="rb-yellow" variant="layer" size={14}>不能错过</Ribbon></div>
                        {park.highlights.map((hgt, i) => (
                            <div className="highlight-item" key={i} style={{ animationDelay: `${0.1 + i * 0.09}s` }}>
                                <Icon name="CheckIcon" size={17} style={{ flexShrink: 0 }} />
                                <p>{hgt}</p>
                            </div>
                        ))}
                    </section>

                    {/* 一周人流 */}
                    <section className="detail-section">
                        <div className="section-head">
                            <Ribbon color="rb-blue" variant="layer" size={14}>一周人流趋势</Ribbon>
                            <span className="section-more"><CrowdDots level={park.crowd} />{crowdText(park.crowd)}</span>
                        </div>
                        <div className="crowd-chart">
                            {park.crowdWeek.map((c, i) => (
                                <div className="crowd-col" key={i}>
                                    <div className={cn('crowd-bar', i === ti && 'now', c >= 4 && i !== ti && 'peak')}
                                        style={{ height: `${Math.max(c, 0.4) / 5 * 100}%`, animationDelay: `${0.15 + i * 0.06}s` }} />
                                    <span className={cn('crowd-day', i === ti && 'now')}>{i === ti ? '今天' : WEEK_LABELS[i]}</span>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* 特色标签 */}
                    <section className="detail-section">
                        <div className="section-head"><Ribbon color="rb-pink" variant="layer" size={14}>公园特色</Ribbon></div>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7 }}>
                            {park.features.map((f, i) => (
                                <TagC key={f} color={[color, 'app-yellow', 'app-teal', 'app-pink', 'app-blue', 'lime-green'][i % 6]} variant="soft" size="medium">{f}</TagC>
                            ))}
                        </div>
                    </section>

                    {/* 设施 */}
                    <section className="detail-section">
                        <div className="section-head"><Ribbon color="rb-green" variant="layer" size={14}>园区设施</Ribbon></div>
                        <div className="facility-grid">
                            {park.facilities.map((f, i) => (
                                <div className="facility" key={i} onClick={() => toast('info', `${f.label} · 详情见园区导览图`)}>
                                    <Icon name={f.icon} size={25} />
                                    <span>{f.label}</span>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* 贴士 */}
                    <section className="detail-section">
                        <div className="tip-card card dashed">
                            <Icon name="BulbIcon" size={20} style={{ flexShrink: 0, marginTop: 1 }} />
                            <p style={{ color: 'var(--animal-text-muted)' }}><b style={{ color: 'var(--animal-text-body)' }}>游玩贴士 · </b>{park.tips}</p>
                        </div>
                    </section>

                    {/* 评论 */}
                    <section className="detail-section">
                        <div className="section-head">
                            <Ribbon color="rb-orange" variant="layer" size={14}>大家怎么说</Ribbon>
                            <span className="section-more">{park.reviews} 条<Icon name="ChevronRightIcon" size={12} /></span>
                        </div>
                        <div className="card" style={{ padding: '4px 14px' }}>
                            {park.comments.map((c, i) => {
                                const key = `${park.id}:${i}`;
                                const cLiked = cLikes.includes(key);
                                return (
                                    <div className="comment" key={i} style={{ animationDelay: `${0.08 * i}s` }}>
                                        <span className={cn('comment-avatar', c.bg)}><Icon name={c.icon} size={22} /></span>
                                        <div className="comment-main">
                                            <div className="comment-head">
                                                <span className="comment-user">{c.user}</span>
                                                <span className="comment-time">{c.time}</span>
                                            </div>
                                            <p className="comment-text">{c.text}</p>
                                            <button className={cn('comment-like', cLiked && 'liked')}
                                                onClick={e => {
                                                    const next = cLiked ? cLikes.filter(x => x !== key) : [key, ...cLikes];
                                                    setCLikes(next);
                                                    store.set({ cLikes: next });
                                                    if (!cLiked) {
                                                        const r = e.currentTarget.getBoundingClientRect();
                                                        burst(r.left + 12, r.top + 8, { count: 5, colors: ['#fc736d', '#f8a6b2'] });
                                                    }
                                                }}>
                                                <Icon name="HeartIcon" size={12} />{c.likes + (cLiked ? 1 : 0)}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </section>

                    {/* FAQ */}
                    <section className="detail-section">
                        <div className="section-head"><Ribbon color="rb-purple" variant="layer" size={14}>常见问题</Ribbon></div>
                        {park.faq.map(([qst, ans], i) => (
                            <div className={cn('faq-item', faqOpen === i && 'open')} key={i}>
                                <button className="faq-q" onClick={() => setFaqOpen(faqOpen === i ? -1 : i)} aria-expanded={faqOpen === i}>
                                    <span className="q-icon">{faqOpen === i ? '−' : '?'}</span>
                                    <span className="q-text">{qst}</span>
                                    <Icon name="ChevronDownIcon" size={14} style={{ color: 'var(--animal-text-secondary)', transition: 'transform 0.3s var(--animal-ease)', transform: faqOpen === i ? 'rotate(180deg)' : 'none' }} />
                                </button>
                                <div className="faq-a-wrap"><div className="faq-a-inner"><div className="faq-a">{ans}</div></div></div>
                            </div>
                        ))}
                    </section>

                    {/* 相关推荐 */}
                    {related.length > 0 && (
                        <section className="detail-section">
                            <div className="section-head">
                                <Ribbon color="rb-teal" variant="layer" size={14}>猜你还想去</Ribbon>
                            </div>
                            {related.map((p, i) => (
                                <MiniPark key={p.id} park={p} index={i} onOpen={onOpenPark} reason={p.tags[0]} />
                            ))}
                        </section>
                    )}
                </div>
            </div>

            {/* 底部操作栏 */}
            <div className="detail-action-bar">
                <button className={cn('dab-icon-btn', faved && 'on fav')}
                    onClick={e => toggleFav(park, e.currentTarget)}>
                    <Icon name="BookmarkIcon" size={19} style={faved ? undefined : { filter: 'grayscale(1)', opacity: 0.6 }} />
                    <span>{faved ? '已收藏' : '收藏'}</span>
                </button>
                <button ref={likeBtnRef} className={cn('dab-icon-btn', liked && 'on')} onClick={doLike}>
                    <Icon name="HeartIcon" size={19} style={liked ? undefined : { filter: 'grayscale(1)', opacity: 0.5 }} />
                    <span className="dab-like-count">{likeCount(park) > 999 ? (likeCount(park) / 1000).toFixed(1) + 'k' : likeCount(park)}</span>
                </button>
                <Btn type="default" size="middle" icon="ChatIcon" style={{ height: 48, borderRadius: 16 }}
                    onClick={() => onOpenChat(`${park.name}怎么样？`, park.id)}>问小屿</Btn>
                <Btn type="primary" size="middle" icon="CompassIcon" style={{ flex: 1, height: 48 }}
                    onClick={() => setNavModal(true)}>导航前往</Btn>
            </div>

            <Modal open={navModal} title="出发去这里？" onClose={() => setNavModal(false)}
                footer={
                    <React.Fragment>
                        <Btn type="default" size="middle" onClick={() => setNavModal(false)}>再想想</Btn>
                        <Btn type="yellow" size="middle" icon="CheckIcon" onClick={() => { setNavModal(false); toast('success', '演示环境暂未接入地图导航'); }}>好的</Btn>
                    </React.Fragment>
                }>
                <p>{park.address}</p>
                <p style={{ fontSize: 13, marginTop: 6, color: 'var(--animal-text-secondary)' }}>距你 {park.distance} 公里 · 骑行约 {Math.round(park.distance * 4)} 分钟</p>
            </Modal>
        </div>
    );
}
/* =====================================================================
   公园雷达 · 我的页面

const BADGES = [
    { key: 'fav1', name: '初次收藏', icon: 'BookmarkIcon', color: 'app-yellow', bg: 'pattern-app-yellow', need: s => s.favs.length >= 1, desc: '收藏第一个公园' },
    { key: 'like3', name: '点赞达人', icon: 'ThumbsUpIcon', color: 'app-pink', bg: 'pattern-app-pink', need: s => s.likes.length >= 3, desc: '点赞 3 个公园' },
    { key: 'hist5', name: '公园猎人', icon: 'CompassIcon', color: 'app-teal', bg: 'pattern-app-teal', need: s => s.history.length >= 5, desc: '浏览 5 个公园' },
    { key: 'all', name: '全能探索家', icon: 'TrophyIcon', color: 'purple', bg: 'pattern-purple', need: s => s.favs.length >= 1 && s.likes.length >= 3 && s.history.length >= 5, desc: '达成全部成就' },
];

function MePage({ onOpenPark, onGoList }) {
    const st = useStore();
    const [tab, setTab] = useState('favs');
    const [aboutOpen, setAboutOpen] = useState(false);
    const [clearOpen, setClearOpen] = useState(false);
    const [removing, setRemoving] = useState(null);

    const favParks = st.favs.map(id => PARK_BY_ID[id]).filter(Boolean);
    const likeParks = st.likes.map(id => PARK_BY_ID[id]).filter(Boolean);
    const histParks = st.history.map(x => PARK_BY_ID[x.id]).filter(Boolean);

    const setSetting = (k, v) => store.set(s => ({ settings: { ...s.settings, [k]: v } }));

    const removeItem = (park, from) => {
        setRemoving(park.id + from);
        setTimeout(() => {
            if (from === 'favs') store.set(s => ({ favs: s.favs.filter(x => x !== park.id) }));
            if (from === 'likes') store.set(s => ({ likes: s.likes.filter(x => x !== park.id) }));
            if (from === 'hist') store.set(s => ({ history: s.history.filter(x => x.id !== park.id) }));
            setRemoving(null);
            toast('info', `已从${from === 'favs' ? '收藏' : from === 'likes' ? '点赞' : '足迹'}中移除`);
        }, 320);
    };

    const list = tab === 'favs' ? favParks : tab === 'likes' ? likeParks : histParks;
    const unlocked = BADGES.filter(b => b.need(st)).length;

    const emptyCfg = {
        favs: { icon: 'BookmarkIcon', title: '还没有收藏的公园', desc: '在公园卡片上点书签，就会出现在这里' },
        likes: { icon: 'HeartIcon', title: '还没有点赞的公园', desc: '遇到喜欢的公园，点心形告诉它' },
        hist: { icon: 'CompassIcon', title: '还没有浏览足迹', desc: '去发现页逛逛，足迹会自动记录' },
    }[tab];

    return (
        <div className="page-scroller" id="me-scroller">
            {/* 头部资料卡 */}
            <header className="me-header pattern pattern-app-teal">
                <div className="me-profile">
                    <div className="me-avatar">
                        <Icon name="FoxIcon" size={40} />
                        <span className="lvl">Lv.{1 + Math.floor((st.favs.length + st.likes.length + st.history.length) / 4)}</span>
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                        <div className="me-name">公园探索家</div>
                        <div className="me-desc">
                            <Icon name="LocationIcon" size={12} />{CITY} · 已解锁 {unlocked}/{BADGES.length} 枚徽章
                        </div>
                    </div>
                    <Btn type="default" size="small" icon="PencilIcon" onClick={() => toast('info', '演示环境暂不支持编辑资料')}>编辑</Btn>
                </div>
                <div className="me-stats">
                    <div className="me-stat" onClick={() => setTab('favs')}>
                        <div className="num"><Odometer value={st.favs.length} /></div>
                        <div className="lbl">收藏</div>
                    </div>
                    <div className="me-stat" onClick={() => setTab('likes')}>
                        <div className="num"><Odometer value={st.likes.length} delay={70} /></div>
                        <div className="lbl">点赞</div>
                    </div>
                    <div className="me-stat" onClick={() => setTab('hist')}>
                        <div className="num"><Odometer value={st.history.length} delay={140} /></div>
                        <div className="lbl">足迹</div>
                    </div>
                    <div className="me-stat" onClick={() => toast('info', `探索积分 ${st.favs.length * 10 + st.likes.length * 5 + st.history.length * 2}（演示）`)}>
                        <div className="num"><Odometer value={st.favs.length * 10 + st.likes.length * 5 + st.history.length * 2} delay={210} /></div>
                        <div className="lbl">积分</div>
                    </div>
                </div>
            </header>

            {/* 成就徽章 */}
            <section className="me-section">
                <div className="section-head" style={{ marginBottom: 10 }}>
                    <Ribbon color="rb-yellow" variant="layer" size={13}>探索成就</Ribbon>
                    <span className="section-more">{unlocked}/{BADGES.length} 已解锁</span>
                </div>
                <div className="badge-row">
                    {BADGES.map(b => {
                        const got = b.need(st);
                        return (
                            <div key={b.key} className={cn('badge', got ? `pattern ${b.bg} unlocked` : 'locked')}
                                onClick={() => toast(got ? 'success' : 'info', got ? `已达成「${b.name}」！` : `${b.name}：${b.desc}`)}>
                                <span className="b-ic"><Icon name={b.icon} size={23} /></span>
                                <span className="b-name" style={{ color: got ? 'var(--animal-text-body)' : undefined }}>{b.name}</span>
                            </div>
                        );
                    })}
                </div>
            </section>

            {/* 收藏/点赞/足迹 */}
            <section className="me-section">
                <div className="me-tabs">
                    <button className={cn('me-tab', tab === 'favs' && 'active')} onClick={() => setTab('favs')}>
                        <Icon name="BookmarkIcon" size={14} />收藏<span className="cnt">{favParks.length}</span>
                    </button>
                    <button className={cn('me-tab', tab === 'likes' && 'active')} onClick={() => setTab('likes')}>
                        <Icon name="HeartIcon" size={14} />点赞<span className="cnt">{likeParks.length}</span>
                    </button>
                    <button className={cn('me-tab', tab === 'hist' && 'active')} onClick={() => setTab('hist')}>
                        <Icon name="ClockIcon" size={14} />足迹<span className="cnt">{histParks.length}</span>
                    </button>
                </div>
                <div key={tab}>
                    {list.length ? list.map((p, i) => (
                        <MiniPark key={p.id + tab} park={p} index={i} onOpen={onOpenPark}
                            removing={removing === p.id + tab}
                            onRemove={() => removeItem(p, tab)} />
                    )) : (
                        <EmptyState icon={emptyCfg.icon} title={emptyCfg.title} desc={emptyCfg.desc}
                            action={<Btn type="teal" size="middle" icon="SearchIcon" style={{ marginTop: 6 }} onClick={onGoList}>去发现公园</Btn>} />
                    )}
                </div>
            </section>

            {/* 设置 */}
            <section className="me-section">
                <div className="section-head" style={{ marginBottom: 10 }}>
                    <Ribbon color="rb-green" variant="layer" size={13}>偏好设置</Ribbon>
                </div>
                <div className="setting-row">
                    <span className="s-ic" style={{ background: '#e0f2f1' }}><Icon name="BellIcon" size={20} /></span>
                    <span className="s-main">
                        <span className="s-name">公园快报通知</span>
                        <span className="s-desc">花期、活动与限流提醒</span>
                    </span>
                    <SwitchCtl label="通知开关" checked={st.settings.notify} onChange={v => { setSetting('notify', v); toast('info', v ? '已开启快报通知' : '已关闭快报通知'); }} />
                </div>
                <div className="setting-row">
                    <span className="s-ic" style={{ background: '#fff8e1' }}><Icon name="EyeIcon" size={20} /></span>
                    <span className="s-main">
                        <span className="s-name">记录浏览足迹</span>
                        <span className="s-desc">帮我记住看过的公园</span>
                    </span>
                    <SwitchCtl label="足迹开关" checked={st.settings.record} onChange={v => setSetting('record', v)} />
                </div>
                <div className="setting-row">
                    <span className="s-ic" style={{ background: '#f3e5f5' }}><Icon name="LeafIcon" size={20} /></span>
                    <span className="s-main">
                        <span className="s-name">减弱动效</span>
                        <span className="s-desc">减少动画，界面更平稳省电</span>
                    </span>
                    <SwitchCtl label="动效开关" checked={st.settings.reduceMotion}
                        onChange={v => { setSetting('reduceMotion', v); document.body.classList.toggle('reduce-motion', v); }} />
                </div>
                <div className="setting-row clickable" onClick={() => setClearOpen(true)}>
                    <span className="s-ic" style={{ background: '#ffebee' }}><Icon name="TrashIcon" size={20} /></span>
                    <span className="s-main">
                        <span className="s-name" style={{ color: 'var(--animal-error)' }}>清除本地数据</span>
                        <span className="s-desc">收藏、点赞、足迹与聊天记录</span>
                    </span>
                    <Icon name="ChevronRightIcon" size={14} style={{ color: 'var(--animal-text-disabled)' }} />
                </div>
                <div className="setting-row clickable" onClick={() => setAboutOpen(true)}>
                    <span className="s-ic" style={{ background: '#e8f5e9' }}><Icon name="BulbIcon" size={20} /></span>
                    <span className="s-main">
                        <span className="s-name">关于公园雷达</span>
                        <span className="s-desc">版本 1.0.0 · 设计与动效致谢</span>
                    </span>
                    <Icon name="ChevronRightIcon" size={14} style={{ color: 'var(--animal-text-disabled)' }} />
                </div>
            </section>

            <footer className="me-footer">
                公园雷达 ParkRadar · 演示应用，公园与数据均为虚构<br />
                视觉风格致敬 <a href="https://github.com/guokaigdg/animal-island-ui" target="_blank" rel="noreferrer">animal-island-ui</a> · 动效致敬 <a href="https://rareui.com" target="_blank" rel="noreferrer">Rare UI</a>
            </footer>

            {/* 清除数据确认（blob modal） */}
            <Modal open={clearOpen} title="清除本地数据？" onClose={() => setClearOpen(false)}
                footer={
                    <React.Fragment>
                        <Btn type="default" size="middle" onClick={() => setClearOpen(false)}>取消</Btn>
                        <Btn type="danger" size="middle" icon="TrashIcon" onClick={() => {
                            LS.clearAll();
                            store.set({ favs: [], likes: [], cLikes: [], history: [], settings: { notify: true, record: true, reduceMotion: false } });
                            LS.set('chat', []);
                            document.body.classList.remove('reduce-motion');
                            setClearOpen(false);
                            toast('success', '本地数据已清除');
                        }}>清除</Btn>
                    </React.Fragment>
                }>
                <p>收藏、点赞、足迹和聊天记录都会被清空，且无法恢复。</p>
            </Modal>

            {/* 关于（blob modal） */}
            <Modal open={aboutOpen} title="关于公园雷达" onClose={() => setAboutOpen(false)}
                footer={<Btn type="yellow" size="middle" onClick={() => setAboutOpen(false)}>关闭</Btn>}>
                <div style={{ textAlign: 'left', fontSize: 13, lineHeight: 1.8 }}>
                    <p><b>公园雷达 v1.0.0</b> —— 帮你发现身边好公园的 H5 演示应用。</p>
                    <hr className="divider-wave" />
                    <p style={{ fontSize: 12, color: 'var(--animal-text-secondary)' }}>
                        · 视觉设计语言：<a href="https://github.com/guokaigdg/animal-island-ui" target="_blank" rel="noreferrer">animal-island-ui</a>（MIT）<br />
                        · 特效动画参考：<a href="https://rareui.com" target="_blank" rel="noreferrer">Rare UI</a>（Fluid Orb / 粒子爆发 / 数字滚轮 / 粘滞导航）<br />
                        · 图标：<a href="https://github.com/guokaigdg/naive-icons" target="_blank" rel="noreferrer">naive-icons</a>（MIT）<br />
                        · 城市与公园数据均为虚构，仅供演示。
                    </p>
                </div>
            </Modal>
        </div>
    );
}
/* =====================================================================
   公园雷达 · Agent 智能助手「小屿」聊天页
   ===================================================================== */
function ChatMsg({ m, isLast, onChip, onCard, busy }) {
    /* 动态速度：无论长短，整段打字约 2.4s 完成 */
    const spd = Math.max(5, Math.min(26, Math.round(2400 / Math.max((m.text || '').length, 1))));
    const { shown, done } = useTypewriter(m.text || '', spd, !!(m.streaming && isLast && !busy));
    const isUser = m.role === 'user';
    return (
        <div className={cn('msg-row', isUser ? 'user' : 'agent')}>
            {!isUser && (
                <span className="msg-avatar">
                    {isLast ? <FluidOrb size={34} color="#19c8b9" /> : <span className="orb-fallback" />}
                </span>
            )}
            {isUser && (
                <span className="msg-avatar user-av"><Icon name="RabbitIcon" size={20} /></span>
            )}
            <div style={{ minWidth: 0, maxWidth: '100%' }}>
                <div className="bubble">
                    {shown}
                    {m.streaming && isLast && !done && <i className="tw-caret" />}
                </div>
                {m.cards && m.cards.length > 0 && (!m.streaming || done || !isLast) && (
                    <div className="chat-cards">
                        {m.cards.map((c, i) => {
                            const p = PARK_BY_ID[c.id];
                            if (!p) return null;
                            return (
                                <div className="chat-park-card" key={c.id + i} style={{ animationDelay: `${i * 0.08}s` }} onClick={() => onCard(p.id)}>
                                    <span className="cpc-thumb"><SceneArt park={p} variant="thumb" /></span>
                                    <span className="cpc-info">
                                        <span className="cpc-name">{p.name}
                                            <span className="rate"><Icon name="StarIcon" size={11} />{p.rating.toFixed(1)}</span>
                                        </span>
                                        <span className="cpc-meta">{catMeta(p.cat).label} · {p.distance}km · {p.ticket === 0 ? '免费' : `¥${p.ticket}`} · {crowdText(p.crowd)}</span>
                                        {c.reason && <span className="cpc-reason"><Icon name="CompassIcon" size={11} />{c.reason}</span>}
                                    </span>
                                    <span className="cpc-go"><Icon name="ChevronRightIcon" size={14} /></span>
                                </div>
                            );
                        })}
                    </div>
                )}
                {m.chips && m.chips.length > 0 && isLast && !busy && (!m.streaming || done) && (
                    <div className="chips-row">
                        {m.chips.map((c, i) => (
                            <button className="q-chip" key={c} style={{ animationDelay: `${0.1 + i * 0.06}s` }} onClick={() => onChip(c)}>{c}</button>
                        ))}
                    </div>
                )}
            </div>
        </div>
    );
}

const CAPS = [
    { icon: 'SearchIcon', text: '按需求找公园', q: '帮我找个免费又能遛娃的公园' },
    { icon: 'CrowdDots', text: '避开人从众', q: '今天哪里人少清净？' },
    { icon: 'MoonIcon', text: '夜游去哪里', q: '晚上有夜景的公园推荐' },
    { icon: 'DogIcon', text: '带上毛孩子', q: '可以带狗去的公园' },
];

function ChatPage({ initialQ, initialParkId, onBack, onOpenPark, closing, zIndex }) {
    const st = useStore();
    const [msgs, setMsgs] = useState(() => LS.get('chat', []));
    const [busy, setBusy] = useState(false);
    const [input, setInput] = useState('');
    const [listening, setListening] = useState(false);
    const [clearOpen, setClearOpen] = useState(false);
    const bodyRef = useRef(null);
    const ctxRef = useRef(LS.get('chatCtx', { lastResults: [], lastParsed: null, moreOffset: 0, parkCtx: null }));
    const initRef = useRef(false);
    const busyRef = useRef(false);

    const scrollBottom = (smooth = true) => requestAnimationFrame(() => {
        const el = bodyRef.current;
        if (el) el.scrollTo({ top: el.scrollHeight, behavior: smooth && !sysReduced() ? 'smooth' : 'auto' });
    });

    useEffect(() => { LS.set('chat', msgs.slice(-40)); }, [msgs]);
    useEffect(() => { LS.set('chatCtx', ctxRef.current); }, [msgs, busy]);
    useEffect(() => { scrollBottom(false); }, [busy]);

    const pushMsg = m => setMsgs(prev => [...prev, { ...m, id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}` }]);

    const applyReply = (reply) => {
        if (reply.meta) {
            const m = reply.meta;
            if (m.lastResults) ctxRef.current.lastResults = m.lastResults;
            if (m.lastParsed !== undefined) ctxRef.current.lastParsed = m.lastParsed;
            ctxRef.current.moreOffset = m.moreOffset || 0;
        }
        if (reply.parkCtx) ctxRef.current.parkCtx = reply.parkCtx;
        setBusy(false); busyRef.current = false;
        pushMsg({ role: 'agent', text: reply.text, cards: reply.cards || [], chips: reply.chips || [], streaming: true });
        scrollBottom();
    };

    async function agentReply(text, directReply) {
        if (busyRef.current) return;
        setBusy(true); busyRef.current = true;
        scrollBottom();
        let reply;
        if (directReply) {
            await sleep(500);
            reply = normalizeReply(directReply, null);
        } else {
            reply = await agentAsk(text, { favs: st.favs, likes: st.likes, history: st.history, user: '探索家' }, ctxRef.current);
        }
        applyReply(reply);
    }

    function send(text) {
        const t = String(text == null ? input : text).trim();
        if (!t || busyRef.current) return;
        setInput('');
        pushMsg({ role: 'user', text: t });
        scrollBottom();
        agentReply(t);
    }

    function handleChip(label) {
        if (busyRef.current) return;
        const r = resolveChip(label, ctxRef.current);
        if (r && r.nav) {
            pushMsg({ role: 'user', text: label });
            onOpenPark(r.nav.split('/park/')[1]);
            return;
        }
        pushMsg({ role: 'user', text: label });
        scrollBottom();
        if (r && r.direct) agentReply(null, r.direct);
        else agentReply((r && r.q) || label);
    }

    /* 首次进入：欢迎语 + 初始问题 */
    useEffect(() => {
        if (initRef.current) return;
        initRef.current = true;
        if (initialParkId) ctxRef.current.parkCtx = initialParkId;
        if (!LS.get('chat', []).length) {
            setMsgs([{
                id: 'welcome', role: 'agent', streaming: true,
                text: `嗨，我是小屿，公园雷达的智能助手！\n告诉我你的想法，比如「找个人少的免费湖边公园」，我会为你扫描${CITY}的 ${PARKS.length} 座公园。`,
                chips: DEFAULT_CHIPS, cards: [],
            }]);
            if (initialQ) setTimeout(() => send(initialQ), 1400);
        } else if (initialQ) {
            setTimeout(() => send(initialQ), 500);
        }
    }, []);

    function mic() {
        if (busyRef.current) return;
        setListening(true);
        toast('info', '正在聆听…（演示环境为模拟识别）');
        setTimeout(() => {
            setListening(false);
            const demo = ['附近适合遛娃的公园', '有没有安静的湖边公园', '周末可以带狗去哪里'];
            setInput(demo[Math.floor(Math.random() * demo.length)]);
        }, 1500);
    }

    const showWelcome = msgs.length <= 1 && !busy;

    return (
        <div className={cn('chat-page', closing && 'closing')} style={zIndex ? { zIndex } : undefined}>
            <header className="chat-header">
                <button className="hero-circle-btn" aria-label="返回" onClick={onBack} style={{ width: 36, height: 36 }}><Icon name="ArrowLeftIcon" size={18} /></button>
                <span className="chat-avatar">
                    <FluidOrb size={46} color="#19c8b9" />
                    <i className="status" />
                </span>
                <span className="chat-title">
                    <span className="n">{AGENT_NAME}<span className="ai-tag">AI AGENT</span></span>
                    <span className="s">公园雷达智能助手 · 支持自然语言找公园</span>
                </span>
                <span className="chat-actions">
                    <button className="hero-circle-btn" aria-label="清空对话" style={{ width: 36, height: 36 }} onClick={() => setClearOpen(true)}>
                        <Icon name="RefreshIcon" size={17} />
                    </button>
                </span>
            </header>

            <div className="chat-body" ref={bodyRef}>
                {showWelcome && (
                    <div className="chat-welcome">
                        <FluidOrb size={86} color="#19c8b9" />
                        <div className="w-title">想去什么样的公园？问我就好</div>
                        <div className="w-desc">我会理解你的需求 —— 人群、预算、距离、玩法，<br />然后从全城的公园里帮你挑出最合适的。</div>
                        <div className="cap-grid">
                            {CAPS.map((c, i) => (
                                <button className="cap-card" key={c.text} style={{ animationDelay: `${0.15 + i * 0.08}s` }} onClick={() => send(c.q)}>
                                    <Icon name={c.icon === 'CrowdDots' ? 'SnailIcon' : c.icon} size={20} />{c.text}
                                </button>
                            ))}
                        </div>
                    </div>
                )}
                {msgs.map((m, i) => (
                    <ChatMsg key={m.id} m={m} isLast={i === msgs.length - 1} busy={busy}
                        onChip={handleChip} onCard={id => onOpenPark(id)} />
                ))}
                {busy && (
                    <div className="msg-row agent">
                        <span className="msg-avatar"><FluidOrb size={34} color="#19c8b9" /></span>
                        <div className="bubble">
                            <span className="typing-dots"><i /><i /><i /></span>
                        </div>
                    </div>
                )}
            </div>

            <div className="chat-input-bar">
                <button className="hero-circle-btn" aria-label="语音输入" onClick={mic}
                    style={{ width: 42, height: 42, flexShrink: 0, background: listening ? '#ffe9b0' : undefined, borderColor: listening ? 'var(--animal-warning)' : undefined, animation: listening ? 'sun-breathe 0.8s ease-in-out infinite' : undefined }}>
                    <Icon name="MicIcon" size={19} />
                </button>
                <div className="input-wrap large" style={{ flex: 1 }}>
                    <input value={input} placeholder={listening ? '正在聆听…' : '说说你想去什么样的公园…'}
                        onChange={e => setInput(e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter') send(); }}
                        enterKeyHint="send" />
                    {input && <button className="input-clear" aria-label="清空" onClick={() => setInput('')}><Icon name="CloseIcon" size={13} /></button>}
                </div>
                <button className="send-btn" disabled={!input.trim() || busy} aria-label="发送" onClick={() => send()}>
                    <Icon name="RocketIcon" size={20} />
                </button>
            </div>

            <Modal open={clearOpen} title="清空对话记录？" onClose={() => setClearOpen(false)}
                footer={
                    <React.Fragment>
                        <Btn type="default" size="middle" onClick={() => setClearOpen(false)}>取消</Btn>
                        <Btn type="danger" size="middle" icon="TrashIcon" onClick={() => {
                            setMsgs([]);
                            ctxRef.current = { lastResults: [], lastParsed: null, moreOffset: 0, parkCtx: null };
                            LS.set('chat', []); LS.set('chatCtx', ctxRef.current);
                            initRef.current = false;
                            setClearOpen(false);
                            setTimeout(() => { initRef.current = true; setMsgs([{ id: 'welcome2', role: 'agent', streaming: true, text: `我们重新开始吧！想去什么样的公园？`, chips: DEFAULT_CHIPS, cards: [] }]); }, 60);
                            toast('success', '对话已清空');
                        }}>清空</Btn>
                    </React.Fragment>
                }>
                <p>小屿会忘记这次会话里聊过的所有内容。</p>
            </Modal>
        </div>
    );
}
/* =====================================================================
   公园雷达 · App 路由 + 粘滞 TabBar（gooey，参考 rare-ui gooey-nav）
   ===================================================================== */
function TabBar({ tab, onTab, onOrb }) {
    const [hint, setHint] = useState(() => !sessionStorage.getItem('park-radar:orb-hint'));
    useEffect(() => {
        if (!hint) return;
        sessionStorage.setItem('park-radar:orb-hint', '1');
        const t = setTimeout(() => setHint(false), 6500);
        return () => clearTimeout(t);
    }, [hint]);
    const blobLeft = tab === 'list' ? '15.9%' : '84.1%';
    return (
        <nav className="tabbar" aria-label="主导航">
            <div className="tab-goo-layer" aria-hidden="true">
                <span className="tab-blob" style={{ left: blobLeft }} />
                <span className="tab-blob tab-blob-lead" style={{ left: blobLeft }} />
                <span className="tab-blob tab-blob-trail" style={{ left: blobLeft }} />
            </div>
            <button className={cn('tab-item', tab === 'list' && 'active')} onClick={() => onTab('list')} aria-label="发现">
                <Icon name="HomeIcon" size={22} />
                <span>发现</span>
            </button>
            <div className="tab-orb-dock">
                {hint && <span className="orb-hint">试试对我说：想找个人少的湖边公园<i className="hint-caret" /></span>}
                <button className="tab-orb-btn" onClick={onOrb} aria-label="打开智能助手">
                    <span className="tab-orb-wrap">
                        <span className="tab-orb-halo" />
                        <FluidOrb size={54} color="#19c8b9" className="tab-orb" />
                    </span>
                    <span className="tab-orb-label">问小屿</span>
                </button>
            </div>
            <button className={cn('tab-item', tab === 'me' && 'active')} onClick={() => onTab('me')} aria-label="我的">
                <Icon name="UserIcon" size={22} />
                <span>我的</span>
            </button>
        </nav>
    );
}

function App() {
    const st = useStore();
    const [tab, setTab] = useState('list');
    const [detail, setDetail] = useState(null);       // parkId
    const [chat, setChat] = useState(null);           // {q, parkId}
    const [top, setTop] = useState(null);             // 'detail' | 'chat' —— 谁后打开谁在上
    const [closingD, setClosingD] = useState(false);
    const [closingC, setClosingC] = useState(false);
    const listScrollerPos = useRef(0);

    /* reduceMotion 全局类 */
    useEffect(() => {
        document.body.classList.toggle('reduce-motion', !!(st.settings && st.settings.reduceMotion));
    }, [st.settings && st.settings.reduceMotion]);

    /* 首帧入场动画 */
    useEffect(() => { document.body.classList.add('app-ready'); }, []);

    /* hash 路由（支持深链与浏览器前进后退） */
    useEffect(() => {
        const parse = () => {
            const h = location.hash || '#/';
            if (h.startsWith('#/park/')) {
                const id = decodeURIComponent(h.slice(7));
                if (PARK_BY_ID[id]) setDetail(id);
                else location.replace('#/');
            } else if (h.startsWith('#/chat')) {
                const qs = new URLSearchParams(h.split('?')[1] || '');
                setChat({ q: qs.get('q') || null, parkId: qs.get('park') || null });
                chatHashRef.current = h;
                /* 注意：不清 detail —— 聊天可以叠在详情页之上（堆栈语义） */
            } else if (h.startsWith('#/me')) {
                setTab('me'); setDetail(null); setChat(null);
            } else {
                setTab('list'); setDetail(null); setChat(null);
            }
        };
        parse();
        window.addEventListener('hashchange', parse);
        return () => window.removeEventListener('hashchange', parse);
    }, []);

    const navTo = (h) => { if (location.hash !== h) location.hash = h; };

    /* 用 ref 保存最新状态，供关闭回调计算回退目标（避免旧闭包） */
    const stateRef = useRef({ tab, detail, chat });
    stateRef.current = { tab, detail, chat };
    const chatHashRef = useRef('#/chat');
    const tabHash = () => (stateRef.current.tab === 'me' ? '#/me' : '#/');

    /* 打开/关闭（带退场动画；关闭时用 replace 显式回到下层，避免踩到过期 history） */
    const openPark = useCallback((id) => {
        if (!PARK_BY_ID[id]) return;
        setClosingD(false);
        setDetail(id);
        setTop('detail');
        navTo('#/park/' + id);
    }, []);
    const closeDetail = useCallback(() => {
        setClosingD(true);
        setTimeout(() => {
            setClosingD(false);
            setDetail(null);
            if (location.hash.startsWith('#/park/')) {
                location.replace(stateRef.current.chat ? chatHashRef.current : tabHash());
            }
        }, sysReduced() ? 0 : 260);
    }, []);
    const openChat = useCallback((q, parkId) => {
        setClosingC(false);
        setChat({ q: q || null, parkId: parkId || null });
        setTop('chat');
        let h = '#/chat';
        const qs = [];
        if (q) qs.push('q=' + encodeURIComponent(q));
        if (parkId) qs.push('park=' + parkId);
        if (qs.length) h += '?' + qs.join('&');
        chatHashRef.current = h;
        navTo(h);
    }, []);
    const closeChat = useCallback(() => {
        setClosingC(true);
        setTimeout(() => {
            setClosingC(false);
            setChat(null);
            if (location.hash.startsWith('#/chat')) {
                const d = stateRef.current.detail;
                location.replace(d ? '#/park/' + d : tabHash());
            }
        }, sysReduced() ? 0 : 280);
    }, []);
    const goTab = useCallback((t) => {
        setTab(t);
        navTo(t === 'me' ? '#/me' : '#/');
        /* 保留列表滚动位置：切回时恢复 */
        const el = document.getElementById(t === 'me' ? 'me-scroller' : 'list-scroller');
        if (t === 'list' && el) el.scrollTop = listScrollerPos.current;
    }, []);
    useEffect(() => {
        const el = document.getElementById('list-scroller');
        if (!el) return;
        const fn = () => { listScrollerPos.current = el.scrollTop; };
        el.addEventListener('scroll', fn, { passive: true });
        return () => el.removeEventListener('scroll', fn);
    }, []);

    /* 从聊天卡片打开详情：详情盖在聊天上 */
    const openParkFromChat = useCallback((id) => { openPark(id); }, [openPark]);

    const stacked = !!(chat && detail);
    const detailZ = stacked ? (top === 'detail' ? 970 : 940) : 950;
    const chatZ = stacked ? (top === 'chat' ? 970 : 940) : 960;

    return (
        <div className="app">
            {/* 常驻 tab 页（保留状态与滚动位置） */}
            <div className={cn('tab-page', tab !== 'list' && 'hidden')}>
                <ListPage onOpenPark={openPark} onOpenChat={openChat} />
            </div>
            <div className={cn('tab-page', tab !== 'me' && 'hidden')}>
                <MePage onOpenPark={openPark} onGoList={() => goTab('list')} />
            </div>

            {/* 覆盖层页面 */}
            {detail && (
                <DetailPage parkId={detail} closing={closingD}
                    zIndex={detailZ}
                    onBack={closeDetail}
                    onOpenPark={openParkFromChat}
                    onOpenChat={openChat} />
            )}
            {chat && (
                <ChatPage key={chat.parkId || 'chat'} initialQ={chat.q} initialParkId={chat.parkId}
                    onBack={closeChat} onOpenPark={openParkFromChat} closing={closingC} zIndex={chatZ} />
            )}

            {/* 底部导航（无覆盖层时显示） */}
            {!detail && !chat && (
                <TabBar tab={tab} onTab={goTab} onOrb={() => openChat(null, null)} />
            )}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        </script>
