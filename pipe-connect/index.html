  function ensureStyle() {
    if (document.getElementById('pccp-style')) return;
    var st = document.createElement('style');
    st.id = 'pccp-style';
    st.textContent = CSS;
    (document.head || document.documentElement).appendChild(st);
  }

  /* ---------------- HTML 片段 ---------------- */
  function numRowHTML(key) {
    var s = NUMSPEC[key];
    return '<div class="pccp-numrow">'
      + '<div class="pccp-numhead">'
      + '<span class="pccp-lab">' + s.label + '<span class="pccp-sub">' + s.sub + '</span></span>'
      + '<input type="number" class="pccp-num" data-num="' + key + '" min="' + s.min
      + '" max="' + s.max + '" step="' + s.step + '" aria-label="' + s.label + '">'
      + '</div>'
      + '<input type="range" class="pccp-range" data-range="' + key + '" min="' + s.min
      + '" max="' + s.max + '" step="' + s.step + '" aria-label="' + s.label + '滑杆">'
      + '</div>';
  }
  function volRowHTML(k, label) {
    return '<div class="pccp-vol">'
      + '<span class="pccp-volhead"><span class="pccp-lab">' + label + '</span>'
      + '<span class="pccp-volval" data-volval="' + k + '">0%</span></span>'
      + '<input type="range" class="pccp-range" data-vol="' + k + '" min="0" max="1" step="0.05" aria-label="' + label + '">'
      + '</div>';
  }
  function cueRowHTML(cue, label) {
    return '<div class="pccp-cue" data-cue="' + cue + '">'
      + '<span class="pccp-cuename">' + label + '<span class="pccp-chip pccp-hide">已自定义</span></span>'
      + '<button type="button" class="pccp-btn pccp-hide" data-sact="play">试听</button>'
      + '<button type="button" class="pccp-btn" data-sact="up">换音</button>'
      + '<button type="button" class="pccp-btn pccp-hide" data-sact="reset">恢复</button>'
      + '</div>';
  }
  function panelPlayHTML() {
    var rows = '';
    Object.keys(NUMSPEC).forEach(function (k) { rows += numRowHTML(k); });
    return '<p class="pccp-note">过关得分 = 基础分 + (关卡−1)×关卡加分 + 剩余秒×剩时加分；'
      + '倒计时随关卡每关递减 4 秒。改动即时生效。</p>'
      + rows
      + '<div class="pccp-row">'
      + '<span class="pccp-lab">自动 AI 演示<span class="pccp-sub">开局自动演示通关拧法，便于观察与测试</span></span>'
      + '<label class="pccp-sw"><input type="checkbox" data-role="aidemo" aria-label="自动 AI 演示">'
      + '<span class="pccp-track"></span><span class="pccp-knob"></span></label>'
      + '</div>';
  }
  function panelAudioHTML() {
    return '<p class="pccp-note">整套装管配色由游戏即时应用；音效可上传本地音频替换（转存 dataURL），单条可恢复合成音。</p>'
      + '<div class="pccp-sec">配色</div>'
      + '<div class="pccp-pals" data-role="pals"></div>'
      + '<div class="pccp-sec">音量</div>'
      + volRowHTML('bgmVol', '音乐音量')
      + volRowHTML('sfxVol', '音效音量')
      + '<div class="pccp-sec">自定义音效</div>'
      + '<div data-role="cuelist"></div>'
      + '<input type="file" class="pccp-file" accept="audio/*" data-role="sndfile">';
  }
  function panelDataHTML() {
    return '<p class="pccp-note">最佳纪录由游戏实时同步显示；清除纪录只影响纪录本身，不改配置。</p>'
      + '<div class="pccp-best">'
      + '<div class="pccp-bestcell"><div class="pccp-bestnum" data-role="bestscore">—</div>'
      + '<div class="pccp-bestkey">最佳总分</div></div>'
      + '<div class="pccp-bestcell"><div class="pccp-bestnum" data-role="bestlevel">—</div>'
      + '<div class="pccp-bestkey">最高关卡</div></div>'
      + '</div>'
      + '<div class="pccp-btnrow"><button type="button" class="pccp-btn pccp-btn-warn" data-act="clearbest">清除纪录</button></div>'
      + '<div class="pccp-div"></div>'
      + '<div class="pccp-sec">备份</div>'
      + '<p class="pccp-note">导出全部配置（含自定义音效）为 JSON 文件；导入会立即覆盖当前配置。</p>'
      + '<div class="pccp-btnrow">'
      + '<button type="button" class="pccp-btn" data-act="export">导出配置</button>'
      + '<button type="button" class="pccp-btn" data-act="import">导入配置</button>'
      + '</div>'
      + '<div class="pccp-sec">恢复</div>'
      + '<p class="pccp-note">把全部参数恢复为默认值（不影响最佳纪录）。</p>'
      + '<button type="button" class="pccp-btn pccp-btn-warn pccp-btn-block" data-act="resetcfg">恢复默认配置</button>'
      + '<input type="file" class="pccp-file" accept="application/json,.json,text/plain" data-role="cfgfile">';
  }

  /* 配色卡：ART.palettes 就绪时取实色，否则用兜底色 */
  function palSwatches(name, fb) {
    try {
      var P = window.PC && window.PC.ART && window.PC.ART.palettes;
      var p = P && P[name];
      if (p && typeof p === 'object') {
        return [p.sky || fb[0], p.pipe || fb[1], p.flange || fb[2], p.water || p.waterFlow || fb[3]];
      }
    } catch (e) { /* 兜底 */ }
    return fb;
  }
  function buildPalOptions() {
    if (!ui.pals) return;
    ui.pals.innerHTML = PALS.map(function (p) {
      var sw = palSwatches(p[0], p[2]).map(function (c) {
        return '<i style="background:' + c + '"></i>';
      }).join('');
      return '<button type="button" class="pccp-pal" data-pal="' + p[0] + '">'
        + '<span class="pccp-palsw">' + sw + '</span>'
        + '<span class="pccp-palname">' + p[1] + '</span></button>';
    }).join('');
  }
  function buildCueList() {
    if (!ui.cuelist) return;
    ui.cuelist.innerHTML = cueList().map(function (p) {
      return cueRowHTML(p[0], p[1]);
    }).join('');
  }

  function buildDOM() {
    root = document.createElement('div');
    root.className = 'pccp-root';
    root.setAttribute('aria-hidden', 'true');
    root.innerHTML = ''
      + '<div class="pccp-mask"></div>'
      + '<section class="pccp-drawer" role="dialog" aria-modal="true" aria-label="游戏设置">'
      +   '<header class="pccp-head">'
      +     '<div class="pccp-title">' + ICON_SVG + '设置</div>'
      +     '<button type="button" class="pccp-close" aria-label="关闭设置">✕</button>'
      +   '</header>'
      +   '<nav class="pccp-tabs" role="tablist">'
      +     TABS.map(function (t) {
              return '<button type="button" class="pccp-tab" role="tab" data-tab="' + t[0] + '">' + t[1] + '</button>';
            }).join('')
      +   '</nav>'
      +   '<div class="pccp-body">'
      +     '<div class="pccp-panel" data-panel="play">' + panelPlayHTML() + '</div>'
      +     '<div class="pccp-panel" data-panel="audio" hidden>' + panelAudioHTML() + '</div>'
      +     '<div class="pccp-panel" data-panel="data" hidden>' + panelDataHTML() + '</div>'
      +   '</div>'
      +   '<footer class="pccp-foot">'
      +     '<button type="button" class="pccp-btn pccp-btn-primary pccp-done" data-act="done">完成</button>'
      +   '</footer>'
      +   '<div class="pccp-toast" data-role="toast" hidden></div>'
      + '</section>';

    ui.mask = root.querySelector('.pccp-mask');
    ui.toast = root.querySelector('[data-role="toast"]');
    ui.tabs = Array.prototype.slice.call(root.querySelectorAll('.pccp-tab'));
    ui.panels = Array.prototype.slice.call(root.querySelectorAll('.pccp-panel'));
    ui.pals = root.querySelector('[data-role="pals"]');
    ui.cuelist = root.querySelector('[data-role="cuelist"]');
    ui.aidemo = root.querySelector('[data-role="aidemo"]');
    ui.sndfile = root.querySelector('[data-role="sndfile"]');
    ui.cfgfile = root.querySelector('[data-role="cfgfile"]');
    ui.btnReset = root.querySelector('[data-act="resetcfg"]');
    ui.bestScore = root.querySelector('[data-role="bestscore"]');
    ui.bestLevel = root.querySelector('[data-role="bestlevel"]');
    ui.nums = {}; ui.ranges = {}; ui.vols = {}; ui.volv = {};
    Object.keys(NUMSPEC).forEach(function (k) {
      ui.nums[k] = root.querySelector('[data-num="' + k + '"]');
      ui.ranges[k] = root.querySelector('[data-range="' + k + '"]');
    });
    ['bgmVol', 'sfxVol'].forEach(function (k) {
      ui.vols[k] = root.querySelector('[data-vol="' + k + '"]');
      ui.volv[k] = root.querySelector('[data-volval="' + k + '"]');
    });

    buildPalOptions();
    buildCueList();

    root.addEventListener('click', onClick, false);
    root.addEventListener('input', onInput, false);
    root.addEventListener('change', onInputChange, false);
    document.addEventListener('keydown', onKey, false);
  }

  /* ---------------- 事件分发 ---------------- */
  function onClick(e) {
    var t = e.target;
    if (!(t instanceof Element)) return;
    if (t.closest('.pccp-mask') || t.closest('.pccp-close')) { close(); return; }
    var tab = t.closest('.pccp-tab');
    if (tab) { showTab(tab.getAttribute('data-tab')); return; }
    var pal = t.closest('[data-pal]');
    if (pal) {
      if (work) {
        var n = pal.getAttribute('data-pal');
        if (work.palette !== n) { work.palette = n; notify(); syncUI(); }
      }
      return;
    }
    var sact = t.closest('[data-sact]');
    if (sact) { doCueAct(sact.closest('[data-cue]'), sact.getAttribute('data-sact')); return; }
    var act = t.closest('[data-act]');
    if (act) doAct(act.getAttribute('data-act'));
  }

  function onInput(e) {
    if (!work) return;
    var t = e.target;
    if (t.classList && t.classList.contains('pccp-range')) {
      var vk = t.getAttribute('data-vol');
      if (vk) {                       // 音量滑杆
        work[vk] = clamp01(t.value, work[vk]);
        if (ui.volv[vk]) ui.volv[vk].textContent = pct(work[vk]);
        notify();
        return;
      }
      var rk = t.getAttribute('data-range');
      if (rk) commitRange(rk, t.value);   // 玩法滑杆（与数字输入联动）
      return;
    }
    if (t.hasAttribute && t.hasAttribute('data-num')) commitNum(t, true);
  }

  function onInputChange(e) {
    if (!work) return;
    var t = e.target;
    if (t === ui.aidemo) { work.aiDemo = !!ui.aidemo.checked; notify(); return; }
    if (t === ui.sndfile) {
      var f = ui.sndfile.files && ui.sndfile.files[0];
      var cue = ui.sndfile.getAttribute('data-cue');
      ui.sndfile.value = '';
      handleSndFile(cue, f);
      return;
    }
    if (t === ui.cfgfile) {
      var cf = ui.cfgfile.files && ui.cfgfile.files[0];
      ui.cfgfile.value = '';
      handleCfgFile(cf);
      return;
    }
    if (t.hasAttribute && t.hasAttribute('data-num')) commitNum(t, false);
  }

  function onKey(e) {
    if (opened && (e.key === 'Escape' || e.keyCode === 27)) close();
  }

  /* ---------------- 玩法数值：滑杆 + 数字输入联动 ---------------- */
  function crossClamp() { if (work && work.timeMin > work.timeBase) work.timeMin = work.timeBase; }
  function syncNum(key) {
    var inp = ui.nums[key];
    if (inp && document.activeElement !== inp) inp.value = String(work[key]);
    var rg = ui.ranges[key];
    if (rg && document.activeElement !== rg) rg.value = String(work[key]);
  }
  function commitRange(key, val) {
    var s = NUMSPEC[key];
    if (!s) return;
    var v = clampInt(val, s.min, s.max, work[key]);
    if (work[key] !== v) { work[key] = v; crossClamp(); notify(); }
    syncNum(key);
    if (key === 'timeBase') syncNum('timeMin');
  }
  function commitNum(input, soft) {
    if (!input || !work) return;
    var key = input.getAttribute('data-num');
    var s = NUMSPEC[key];
    if (!s) return;
    var raw = parseFloat(input.value);
    if (!isFinite(raw)) {           // 输入中为空：等待；失焦时回写当前值
      if (!soft) syncNum(key);
      return;
    }
    var v = clampInt(raw, s.min, s.max, work[key]);
    if (work[key] !== v) { work[key] = v; crossClamp(); notify(); }
    if (soft) {                     // 输入中：滑杆即时跟随（不改写正在输入的框）
      var rg = ui.ranges[key];
      if (rg) rg.value = String(work[key]);
      if (key === 'timeBase') syncNum('timeMin');
    } else {                        // 失焦/确认：输入框与滑杆一律回写 work 实际值
      if (ui.nums[key]) ui.nums[key].value = String(work[key]);
      if (ui.ranges[key]) ui.ranges[key].value = String(work[key]);
      if (key === 'timeBase') syncNum('timeMin');
    }
  }

  /* ---------------- 音效自定义 ---------------- */
  function doCueAct(row, act) {
    if (!row || !work) return;
    var cue = row.getAttribute('data-cue');
    if (act === 'play') { previewCue(cue); return; }
    if (act === 'up') {
      ui.sndfile.setAttribute('data-cue', cue);
      ui.sndfile.click();
    } else if (act === 'reset') {
      delete work.sfxOverrides[cue];
      notify(); syncUI();
      toast('「' + cueLabel(cue) + '」已恢复合成音');
    }
  }

  function previewCue(cue) {
    var A = window.PC && window.PC.AUDIO;
    if (A && typeof A.play === 'function') {
      try {
        if (typeof A.unlock === 'function') A.unlock();
        if (typeof A.setSFXVolume === 'function') A.setSFXVolume(clamp01(work.sfxVol, 0.8));
        if (cue === 'bgm' && typeof A.setBGMVolume === 'function') A.setBGMVolume(clamp01(work.bgmVol, 0.35));
        if (typeof A.applyOverrides === 'function') A.applyOverrides(deepCopy(work.sfxOverrides || {}));
        A.play(cue);
      } catch (err) { toast('试听失败'); }
      return;
    }
    toast('音效模块未加载，无法试听');
  }

  function fileToDataURL(file, cb) {
    if (!file) { cb(null); return; }
    var fr = new FileReader();
    fr.onload = function () { cb(typeof fr.result === 'string' ? fr.result : null); };
    fr.onerror = function () { cb(null); };
    try { fr.readAsDataURL(file); } catch (e) { cb(null); }
  }
  function fileToText(file, cb) {
    if (!file) { cb(null); return; }
    var fr = new FileReader();
    fr.onload = function () { cb(typeof fr.result === 'string' ? fr.result : null); };
    fr.onerror = function () { cb(null); };
    try { fr.readAsText(file); } catch (e) { cb(null); }
  }

  function handleSndFile(cue, file) {
    if (!cue || !file) return;
    if (file.type && !/^audio\//.test(file.type)) { toast('请选择音频文件'); return; }
    if (file.size > 4 * 1024 * 1024) { toast('音频过大（超过 4MB）'); return; }
    fileToDataURL(file, function (url) {
      if (!url) { toast('音频读取失败'); return; }
      if (!work) return;
      work.sfxOverrides[cue] = url;
      notify(); syncUI();
      toast('「' + cueLabel(cue) + '」音效已更新');
    });
  }

  function handleCfgFile(file) {
    if (!file) return;
    fileToText(file, function (txt) {
      if (txt == null) { toast('导入失败：文件读取失败'); return; }
      var obj;
      try { obj = JSON.parse(txt); } catch (e) { toast('导入失败：不是有效的 JSON 文件'); return; }
      if (!obj || typeof obj !== 'object') { toast('导入失败：配置格式不正确'); return; }
      if (!work) return;
      work = sanitize(obj);
      notify(); syncUI();
      toast('配置已导入');
    });
  }

  function doExport() {
    try {
      var data = JSON.stringify(deepCopy(work), null, 2);
      var blob = new Blob([data], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'pc-config.json';
      document.body.appendChild(a);
      a.click();
      a.parentNode.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 800);
      toast('配置已导出');
    } catch (e) { toast('导出失败'); }
  }

  /* ---------------- 数据页动作 ---------------- */
  function disarm() {
    armed = false;
    clearTimeout(armTimer);
    if (ui.btnReset) {
      ui.btnReset.textContent = '恢复默认配置';
      ui.btnReset.classList.remove('pccp-armed');
    }
  }
  function doAct(act) {
    if (!work) return;
    switch (act) {
      case 'done': close(); break;
      case 'export': doExport(); break;
      case 'import': ui.cfgfile.click(); break;
      case 'clearbest':
        cbsBest.forEach(function (cb) {
          try { cb(); } catch (e) { /* 回调异常不影响面板 */ }
        });
        toast('已通知游戏清除最佳纪录');
        break;
      case 'resetcfg':
        if (!armed) {               // 二次确认：3 秒内再点一次
          armed = true;
          if (ui.btnReset) {
            ui.btnReset.textContent = '再点一次，确认恢复默认';
            ui.btnReset.classList.add('pccp-armed');
          }
          clearTimeout(armTimer);
          armTimer = setTimeout(disarm, 3000);
        } else {
          disarm();
          work = sanitize(defaultCfg());
          notify(); syncUI();
          toast('已恢复默认配置（纪录不受影响）');
        }
        break;
    }
  }

  /* ---------------- 渲染同步 ---------------- */
  function showTab(tab) {
    if (typeof tab === 'string' && tab && TAB_ALIAS[tab]) curTab = TAB_ALIAS[tab];
    ui.tabs.forEach(function (b) {
      var on = b.getAttribute('data-tab') === curTab;
      b.classList.toggle('pccp-on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    ui.panels.forEach(function (p) {
      p.hidden = p.getAttribute('data-panel') !== curTab;
    });
  }

  function syncUI() {
    if (!root || !work) return;
    Object.keys(NUMSPEC).forEach(function (k) { syncNum(k); });
    if (ui.aidemo) ui.aidemo.checked = !!work.aiDemo;
    Array.prototype.forEach.call(root.querySelectorAll('.pccp-pal'), function (b) {
      var on = b.getAttribute('data-pal') === work.palette;
      b.classList.toggle('pccp-on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    ['bgmVol', 'sfxVol'].forEach(function (k) {
      if (ui.vols[k]) ui.vols[k].value = String(clamp01(work[k], 0));
      if (ui.volv[k]) ui.volv[k].textContent = pct(work[k]);
    });
    Array.prototype.forEach.call(root.querySelectorAll('.pccp-cue'), function (row) {
      var cue = row.getAttribute('data-cue');
      var custom = typeof work.sfxOverrides[cue] === 'string' && work.sfxOverrides[cue];
      var chip = row.querySelector('.pccp-chip');
      var rb = row.querySelector('[data-sact="reset"]');
      if (chip) chip.classList.toggle('pccp-hide', !custom);
      if (rb) rb.classList.toggle('pccp-hide', !custom);
    });
    var okAudio = hasAudio();
    Array.prototype.forEach.call(root.querySelectorAll('[data-sact="play"]'), function (b) {
      b.classList.toggle('pccp-hide', !okAudio);
    });
  }

  function renderBest() {
    if (!ui.bestScore) return;
    var s = best && typeof best.score === 'number' && isFinite(best.score) ? String(best.score) : '—';
    var l = best && typeof best.level === 'number' && isFinite(best.level) && best.level >= 1
      ? '第 ' + best.level + ' 关' : '—';
    ui.bestScore.textContent = s;
    ui.bestLevel.textContent = l;
  }

  function toast(msg) {
    if (!ui.toast) return;
    ui.toast.textContent = msg;
    ui.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { if (ui.toast) ui.toast.hidden = true; }, 1800);
  }

  /* ---------------- 对外接口 ---------------- */
  function notify() {
    if (!work) return;
    var snap = deepCopy(work);
    cbs.forEach(function (cb) {
      try { cb(snap); } catch (e) { /* 回调异常不影响面板 */ }
    });
  }

  function mount(el) {
    if (!el) el = document.body;
    ensureStyle();
    if (root && root.parentNode === el) return;
    if (root && root.parentNode) root.parentNode.removeChild(root);
    host = el;
    buildDOM();
    root.hidden = true;
    host.appendChild(root);
  }

  function open(tab) {
    if (!root) mount(null);
    var c = (window.PC && window.PC.cfg && typeof window.PC.cfg === 'object')
      ? window.PC.cfg : defaultCfg();
    work = sanitize(deepCopy(c));   // 深拷贝快照 + schema 补全
    buildPalOptions();              // 兼容 ART 晚加载
    buildCueList();                 // 兼容 AUDIO 晚加载
    disarm();
    showTab(tab);
    syncUI();
    renderBest();
    opened = true;
    root.hidden = false;
    root.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { root.classList.add('pccp-open'); });
    });
  }

  function close() {
    if (!root || !opened) return;
    opened = false;
    disarm();
    root.classList.remove('pccp-open');
    root.setAttribute('aria-hidden', 'true');
    setTimeout(function () { if (!opened && root) root.hidden = true; }, 300);
  }

  function isOpen() { return opened; }

  function onChange(cb) {
    if (typeof cb === 'function') cbs.push(cb);
    return function off() {
      var i = cbs.indexOf(cb);
      if (i >= 0) cbs.splice(i, 1);
    };
  }

  /* 「清除纪录」独立通道：非 cfg 字段，恢复默认/导入均不触发 */
  function onClearBest(cb) {
    if (typeof cb === 'function') cbsBest.push(cb);
    return function off() {
      var i = cbsBest.indexOf(cb);
      if (i >= 0) cbsBest.splice(i, 1);
    };
  }

  /* 最佳纪录占位区由外部喂入（游戏侧持久化数据） */
  function setBest(b) {
    best = (b && typeof b === 'object') ? { score: b.score, level: b.level } : null;
    renderBest();
  }

  return {
    mount: mount, open: open, close: close, isOpen: isOpen,
    onChange: onChange, onClearBest: onClearBest, setBest: setBest
  };
})();

</script>
<script>
/* ===== src/game.js ===== */
/* 接水管 — 主游戏：状态机 / 渲染 / 水流演出 / 持久化 / AI 演示 */
window.PC = window.PC || {};
PC.GAME = (() => {
  const L = PC.LOGIC;
  const noop = () => {};
  // 缺模块兜底（开发期子代理未就绪也能跑）
  const ART = PC.ART || { pipeStraight: () => '', pipeElbow: () => '', waterPath: () => 'M50,0 L50,100', pipeLen: () => 100, valve: () => '', outletPipe: () => '', cloud: () => '', dove: () => '', clock: () => '', setPalette: noop, palettes: {} };
  const AUDIO = PC.AUDIO || { unlock: noop, play: noop, startLoop: noop, stopLoop: noop, duck: noop, setBGMVolume: noop, setSFXVolume: noop, setMasterVolume: noop, applyOverrides: noop, names: [] };
  const FX = PC.FX || { init: noop, resize: noop, burst: noop, confetti: noop, ambient: noop, stop: noop, clear: noop };
  const PANEL = PC.CONFIG_PANEL || { mount: noop, open: noop, close: noop, isOpen: () => false, onChange: noop, onClearBest: noop, setBest: noop };

  // ?reset=1 必须在任何 localStorage 读取之前
  if (location.search.indexOf('reset=1') >= 0) {
    try { localStorage.removeItem(L.LS_ST); localStorage.removeItem(L.LS_CFG); } catch (e) {}
  }
  const qs = k => {
    const m = location.search.match(new RegExp('[?&]' + k + '=(\\d+)'));
    return m ? +m[1] : null;
  };
  // 错误探针（测试用）
  window.__errs = [];
  window.addEventListener('error', e => window.__errs.push('ERR: ' + e.message + ' @' + (e.filename || '') + ':' + e.lineno));
  window.addEventListener('unhandledrejection', e => window.__errs.push('REJ: ' + (e.reason && e.reason.message || e.reason)));
  // ?snap=1 零动画（无头/遮挡窗口 CSS transition 冻结时保证可测）
  if (location.search.indexOf('snap=1') >= 0) document.documentElement.classList.add('snap');

  function deepMerge(base, patch) {
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    if (!patch || typeof patch !== 'object') return out;
    for (const k of Object.keys(patch)) {
      const v = patch[k];
      out[k] = (v && typeof v === 'object' && !Array.isArray(v)) ? deepMerge(base[k] || {}, v) : v;
    }
    return out;
  }
  const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const saveJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  let cfg = deepMerge(L.DEFAULT_CFG, loadJSON(L.LS_CFG));
  const st = {
    mode: 'menu',            // menu | playing | flowing | win | lose
    level: 1, score: 0,
    board: null, timer: 0,
    best: { score: 0, level: 0 },
    run: null,               // {level, score} 本关开始时快照，刷新续玩
  };
  const saved = loadJSON(L.LS_ST);
  if (saved && typeof saved === 'object') {
    if (saved.best) st.best = saved.best;
    if (saved.run) st.run = saved.run;
  }
  const saveRun = () => saveJSON(L.LS_ST, { best: st.best, run: st.run });

  let dom = {}, cellsDom = [];
  let cellPx = 0, gridLeft = 0, gridTop = 0, rows = 4;
  let timerId = null, checkId = null, demoId = null;
  let lastFlow = null;

  const $ = s => document.querySelector(s);

  /* ---------------- 布局 ---------------- */
  function layout() {
    const vw = dom.app.clientWidth, vh = dom.app.clientHeight;
    const shortVh = vh < 480;
    const navbarH = dom.navbar.offsetHeight;
    const skyH = shortVh ? 64 : Math.max(76, Math.min(Math.round(vw * 0.30), 116));
    // 预留 56px 出水管水带；网格在剩余区内垂直居中
    const flexH = vh - navbarH - skyH - 56;
    rows = st.board ? st.board.rows : L.rowsForLevel(st.level);
    cellPx = Math.floor(Math.min((vw - 12) / L.COLS, flexH / rows));
    const gw = cellPx * L.COLS, gh = cellPx * rows;
    gridLeft = Math.round((vw - gw) / 2);
    const padY = Math.max(0, Math.floor((flexH - gh) / 2));
    gridTop = navbarH + skyH + padY;       // app 坐标（阀门/出水口/波浪用）
    const seaH = Math.max(0, vh - gridTop - gh); // 网格以下水带（含出水管）

    dom.app.style.setProperty('--skyh', skyH + 'px');
    dom.app.style.setProperty('--seah', seaH + 'px');    dom.grid.style.cssText += `;left:${gridLeft}px;top:${padY}px;width:${gw}px;height:${gh}px;`;
    dom.grid.style.gridTemplateRows = `repeat(${rows},1fr)`;
    // 网格线（含四周边框）
    let lines = `<svg width="${gw}" height="${gh}" style="display:block">`;
    for (let i = 0; i <= L.COLS; i++) lines += `<line x1="${i * cellPx}" y1="0" x2="${i * cellPx}" y2="${gh}"/>`;
    for (let j = 0; j <= rows; j++) lines += `<line x1="0" y1="${j * cellPx}" x2="${gw}" y2="${j * cellPx}"/>`;
    lines += '</svg>';
    dom.gridlines.innerHTML = lines;
    dom.gridlines.style.cssText += `;left:${gridLeft}px;top:${padY}px;`;
    const lineEls = dom.gridlines.querySelectorAll('line');
    lineEls.forEach(ln => ln.setAttribute('stroke', 'rgba(255,255,255,.95)')), lineEls.forEach(ln => ln.setAttribute('stroke-width', '2'));

    const waveY = navbarH + skyH + padY + Math.round(cellPx * 0.55);
    dom.wave.style.top = (padY + Math.round(cellPx * 0.55)) + 'px';
    dom.app.style.setProperty('--skystop', (waveY / vh * 100).toFixed(2) + '%');

    // 阀门（对齐第 0 列中心，管底触网格顶；相对 skyband 定位）
    const vw2 = Math.max(64, Math.min(cellPx * 1.02, 108));
    const vh2 = Math.round(vw2 * 1.1);
    dom.valveWrap.style.cssText = `left:${gridLeft + cellPx * 0.5 - vw2 / 2}px;top:${gridTop - navbarH - vh2}px;width:${vw2}px;height:${vh2}px;`;
    dom.valveImg.style.width = '100%'; dom.valveImg.style.height = '100%';
    // 出水口（对齐第 1 列中心，管顶贴网格底，按精确宽高比锚定顶部）
    const ow = Math.min(Math.round(cellPx * 0.62), Math.floor((vh - gridTop - gh - 6) / 1.4));
    const oh = Math.max(40, Math.round(ow * 1.4));
    dom.outletWrap.style.cssText = `left:${gridLeft + cellPx * 1.5 - ow / 2}px;top:-2px;width:${ow}px;height:${oh}px;`;
    dom.outletImg.style.width = '100%'; dom.outletImg.style.height = oh + 'px';

    // 云与白鸽
    const cw = [Math.round(vw * 0.18), Math.round(vw * 0.13), Math.round(vw * 0.10)];
    [['#cloud0', 0.06, 0.10], ['#cloud1', 0.52, 0.30], ['#cloud2', 0.80, 0.06]].forEach(([id, fx, fy], i) => {
      const el = $(id);
      el.style.width = cw[i] + 'px';
      el.style.left = Math.round(vw * fx) + 'px';
      el.style.top = Math.round((skyH - 20) * fy) + 'px';
    });
    dom.dove0.style.width = Math.round(cellPx * 0.44) + 'px';
    dom.dove0.style.left = Math.round(vw * 0.66) + 'px';
    dom.dove0.style.top = Math.round(skyH * 0.52) + 'px';

    FX.resize(vw, vh, Math.min(devicePixelRatio || 1, 2));
  }

  /* ---------------- 渲染 ---------------- */
  function renderStatic() {
    dom.valveImg.src = ART.valve();
    dom.outletImg.src = ART.outletPipe();
    dom.clockImg.src = ART.clock();
    ['#cloud0', '#cloud1', '#cloud2'].forEach((id, i) => $(id).src = ART.cloud(i % 2));
    dom.dove0.src = ART.dove();
  }

  function renderDecor() {
    // 水中幽灵管件装饰（全部位于水波线以下）
    const deco = [
      ['elbow', 6, 40, 1.7, 0], ['straight', 62, 58, 1.5, 90], ['elbow', 30, 76, 1.9, 180],
      ['straight', 84, 44, 1.3, 0], ['elbow', 12, 90, 1.4, 90],
    ];
    dom.bgdecor.innerHTML = '';
    deco.forEach(([kind, x, y, s, r]) => {
      const img = document.createElement('img');
      img.src = kind === 'elbow' ? ART.pipeElbow() : ART.pipeStraight();
      img.style.cssText = `left:${x}%;top:${y}%;width:${Math.round(cellPx * s)}px;transform:rotate(${r}deg);`;
      dom.bgdecor.appendChild(img);
    });
  }

  function renderGrid() {
    dom.grid.innerHTML = '';
    cellsDom = [];
    dom.grid.style.gridTemplateColumns = `repeat(${L.COLS},1fr)`;
    dom.grid.style.gridTemplateRows = `repeat(${rows},1fr)`;
    for (let i = 0; i < L.COLS * rows; i++) {
      const cell = st.board.cells[i];
      const el = document.createElement('div');
      el.className = 'cell'; el.dataset.idx = i;
      const rot = document.createElement('div');
      rot.className = 'rot';
      rot.style.transform = `rotate(${cell.rot * 90}deg)`;
      const img = document.createElement('img');
      img.className = 'pipe';
      img.src = cell.type === 'straight' ? ART.pipeStraight() : ART.pipeElbow();
      img.draggable = false;
      const svgNS = 'http://www.w3.org/2000/svg';
      const wat = document.createElementNS(svgNS, 'svg');
      wat.setAttribute('viewBox', '0 0 100 100');
      wat.setAttribute('class', 'wat');
      const p = document.createElementNS(svgNS, 'path');
      p.setAttribute('d', ART.waterPath(cell.type));
      p.setAttribute('pathLength', '100');
      wat.appendChild(p);
      rot.appendChild(img); rot.appendChild(wat);
      el.appendChild(rot);
      dom.grid.appendChild(el);
      cellsDom.push({ el, rotEl: rot, img, wat, watPath: p, spin: cell.rot * 90 });
    }
    renderDecor();
  }

  function refreshPipeImgs() {
    for (let i = 0; i < cellsDom.length; i++) {
      cellsDom[i].img.src = st.board.cells[i].type === 'straight' ? ART.pipeStraight() : ART.pipeElbow();
      cellsDom[i].watPath.setAttribute('d', ART.waterPath(st.board.cells[i].type));
    }
    renderStatic();
    renderDecor();
  }

  /* ---------------- 流程 ---------------- */
  function startLevel(n, keepScore) {
    st.level = n;
    rows = L.rowsForLevel(n);
    st.board = L.genBoard(rows);
    if (!keepScore) { /* score 由调用方管理 */ }
    st.timer = L.timeForLevel(n, cfg);
    st.mode = 'playing';
    if (dom.outletWater) dom.outletWater.style.height = '0';
    st.run = st.run || { level: n, score: 0 };
    st.run.level = n;
    saveRun();
    hidePanel();
    layout();
    renderGrid();
    updateHUD();
    dom.timerPill.classList.remove('low');
    startTimer();
    AUDIO.startLoop('bgm');
    AUDIO.play('start');
    FX.clear();
  }

  function updateHUD() {
    dom.timeNum.textContent = st.timer;
    dom.lvChip.textContent = `第 ${st.level} 关`;
    dom.scoreChip.textContent = `得分 ${st.score}`;
  }

  function tick() {
    if (st.mode !== 'playing') return;
    st.timer--;
    updateHUD();
    if (st.timer <= 10 && st.timer > 0) {
      AUDIO.play('tick');
      dom.timerPill.classList.add('low');
    }
    if (st.timer <= 0) {
      st.timer = 0; updateHUD();
      stopTimer();
      onLose();
    }
  }
  function startTimer() {
    stopTimer();
    timerId = setInterval(tick, 1000);
  }
  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function onRotate(idx, silent) {
    if (st.mode !== 'playing') return;
    const cell = st.board.cells[idx];
    const mod = cell.type === 'straight' ? 2 : 4;
    cell.rot = (cell.rot + 1) % mod;
    const d = cellsDom[idx];
    d.spin += 90;
    d.rotEl.style.transform = `rotate(${d.spin}deg)`;
    if (!silent) AUDIO.play('rotate');
    if (checkId) clearTimeout(checkId);
    checkId = setTimeout(checkWin, 230);
  }

  function checkWin() {
    if (st.mode !== 'playing') return;
    const res = L.solveFrom(rows, st.board.cells);
    if (res.win) beginFlow(res);
  }

  // 水流灌充演出
  function beginFlow(res) {
    st.mode = 'flowing';
    stopTimer();
    lastFlow = { path: res.path.slice(), len: res.path.length };
    dom.valveWrap.classList.add('spin');
    setTimeout(() => dom.valveWrap.classList.remove('spin'), 1100);
    AUDIO.startLoop('flow');
    AUDIO.duck(1500);
    // 阀门口水花
    const appRect = dom.app.getBoundingClientRect();
    FX.burst(gridLeft + cellPx * 0.5, gridTop + 2, { n: 14, up: false });

    const step = 170;
    res.path.forEach((idx, i) => {
      let entry = 0;
      if (i > 0) {
        const a = res.path[i - 1], b = idx;
        const dr = Math.floor(b / L.COLS) - Math.floor(a / L.COLS);
        const dc = (b % L.COLS) - (a % L.COLS);
        const moveEdge = dr < 0 ? 0 : dr > 0 ? 2 : dc > 0 ? 1 : 3;
        entry = L.OPP[moveEdge];
      }
      fillCell(idx, entry, i * step, step);
    });
    const total = res.path.length * step + 240;
    setTimeout(() => {
      AUDIO.stopLoop('flow');
      AUDIO.play('splash');
      // 出水口喷水
      const oy = gridTop + rows * cellPx;
      FX.burst(gridLeft + cellPx * 1.5, oy + 10, { n: 22, up: true });
      dom.outletWater.style.height = '100%';
      setTimeout(() => { FX.confetti(vw2px() * 0.5 - 80, 0, 160); onWin(); }, 500);
    }, total);
  }

  function vw2px() { return dom.app.clientWidth; }

  function fillCell(idx, entryEdge, delay, dur) {
    const d = cellsDom[idx];
    const r = st.board.cells[idx].rot;
    const baseEntry = ((entryEdge - r) % 4 + 4) % 4;
    const forward = baseEntry === L.pathStartEdge();
    d.watPath.style.transition = 'none';
    d.watPath.style.strokeDashoffset = forward ? '100' : '-100';
    d.wat.classList.add('on');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        d.watPath.style.transition = `stroke-dashoffset ${dur}ms linear ${delay}ms`;
        d.watPath.style.strokeDashoffset = '0';
      });
    });
  }

  function onWin() {
    st.mode = 'win';
    const remain = Math.max(0, st.timer);
    const base = cfg.baseScore + (st.level - 1) * cfg.levelBonus;
    const tb = remain * cfg.timeBonus;
    const gained = base + tb;
    st.score += gained;
    if (st.score > st.best.score) st.best.score = st.score;
    if (st.level > st.best.level) st.best.level = st.level;
    st.run = { level: st.level + 1, score: st.score };
    saveRun();
    updateHUD();
    AUDIO.play('win');
    showPanel(`
      <h2>通关！</h2>
      <div class="sub">第 ${st.level} 关 · 用时 ${L.timeForLevel(st.level, cfg) - remain} 秒</div>
      <div class="rows">
        <div class="r"><span>连通奖励</span><b>+${base}</b></div>
        <div class="r"><span>时间奖励</span><b>+${tb}</b></div>
        <div class="r"><span>当前总分</span><b>${st.score}</b></div>
      </div>
      <button class="pbtn" id="pNext">下一关</button>
      <button class="pbtn ghost" id="pMenu2">返回菜单</button>
    `);
    $('#pNext').onclick = () => { AUDIO.play('click'); startLevel(st.level + 1, true); };
    $('#pMenu2').onclick = () => { AUDIO.play('click'); showMenu(); };
  }

  function onLose() {
    st.mode = 'lose';
    stopTimer();
    AUDIO.play('lose');
    showPanel(`
      <h2>时间到！</h2>
      <div class="sub">水管没有接通，再试一次吧</div>
      <div class="rows">
        <div class="r"><span>挑战关卡</span><b>第 ${st.level} 关</b></div>
        <div class="r"><span>当前总分</span><b>${st.score}</b></div>
      </div>
      <button class="pbtn" id="pRetry">重试本关</button>
      <button class="pbtn ghost" id="pMenu3">返回菜单</button>
    `);
    $('#pRetry').onclick = () => { AUDIO.play('click'); st.score = st.run ? st.run.score : 0; startLevel(st.level, true); };
    $('#pMenu3').onclick = () => { AUDIO.play('click'); showMenu(); };
  }

  function showMenu() {
    st.mode = 'menu';
    stopTimer();
    if (demoId) { clearInterval(demoId); demoId = null; }
    showPanel(`
      <h1>接水管</h1>
      <div class="sub">点击水管旋转 90°，限时接通进水口与出水口</div>
      <div class="best">最佳：<b>${st.best.score}</b> 分 · <b>第 ${st.best.level || '—'}</b> 关</div>
      ${st.run ? `<button class="pbtn" id="pCont">继续 · 第 ${st.run.level} 关</button>` : ''}
      <button class="pbtn" id="pStart">开始游戏</button>
      <button class="pbtn ghost" id="pDemo">自动演示</button>
    `);
    $('#pStart').onclick = () => { AUDIO.play('click'); st.score = 0; st.run = null; startLevel(1); };
    const pc = $('#pCont');
    if (pc) pc.onclick = () => { AUDIO.play('click'); st.score = st.run.score; startLevel(st.run.level, true); };
    $('#pDemo').onclick = () => { AUDIO.play('click'); st.score = 0; st.run = null; startLevel(1); startDemo(); };
  }

  function hidePanel() { dom.panelWrap.classList.add('hidden'); }

  function showPanel(html) {
    dom.panel.innerHTML = html;
    dom.panelWrap.classList.remove('hidden');
  }

  /* ---------------- AI 演示 ---------------- */
  function startDemo() {
    if (demoId) { clearInterval(demoId); demoId = null; }
    const seq = [];
    L.solutionRotations(st.board).forEach(s => {
      for (let t = 0; t < s.taps; t++) seq.push(s.idx);
    });
    let i = 0;
    demoId = setInterval(() => {
      if (st.mode !== 'playing' || i >= seq.length) { clearInterval(demoId); demoId = null; return; }
      onRotate(seq[i++]);
    }, 340);
  }

  /* ---------------- toast ---------------- */
  let toastId = null;
  function toast(msg) {
    dom.toast.textContent = msg;
    dom.toast.classList.add('show');
    if (toastId) clearTimeout(toastId);
    toastId = setTimeout(() => dom.toast.classList.remove('show'), 1600);
  }

  /* ---------------- 配置应用 ---------------- */
  function applyCfg() {
    PC.cfg = cfg; // 供 CONFIG_PANEL 读取
    const pal = ART.palettes && ART.palettes[cfg.palette] ? cfg.palette : 'classic';
    ART.setPalette(pal);
    document.documentElement.style.setProperty('--sky', (ART.palettes[pal] || {}).sky || '#6DBAE4');
    document.documentElement.style.setProperty('--water', (ART.palettes[pal] || {}).water || '#55A8D6');
    document.documentElement.style.setProperty('--waterdeep', (ART.palettes[pal] || {}).waterDeep || '#4E9EC9');
    document.documentElement.style.setProperty('--waterflow', (ART.palettes[pal] || {}).waterFlow || '#58B7EC');
    document.documentElement.style.setProperty('--navy', (ART.palettes[pal] || {}).navy || '#2E3450');
    document.documentElement.style.setProperty('--gridline', (ART.palettes[pal] || {}).gridLine || 'rgba(255,255,255,.95)');
    AUDIO.setBGMVolume(cfg.bgmVol);
    AUDIO.setSFXVolume(cfg.sfxVol);
    AUDIO.applyOverrides(cfg.sfxOverrides || {});
    if (cellsDom.length) refreshPipeImgs();
    saveJSON(L.LS_CFG, cfg);
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    dom = {
      app: $('#app'), navbar: $('#navbar'), grid: $('#grid'), gridlines: $('#gridlines'),
      wave: $('#wave'), skyband: $('#skyband'), valveWrap: $('#valveWrap'), valveImg: $('#valveImg'),
      outletWrap: $('#outletWrap'), outletImg: $('#outletImg'), bgdecor: $('#bgdecor'),
      timerPill: $('#timerPill'), timeNum: $('#timeNum'), clockImg: $('#clockImg'),
      lvChip: $('#lvChip'), scoreChip: $('#scoreChip'), dove0: $('#dove0'),
      toast: $('#toast'), panel: $('#panel'), panelWrap: $('#panelWrap'),
    };
    // 出水口内水条（引用出水管艺术图之上的覆盖块）
    dom.outletWater = document.createElement('div');
    dom.outletWater.id = 'outletWater';
    dom.outletWater.style.cssText = 'position:absolute;left:22%;width:56%;bottom:6px;height:0;background:#58B7EC;transition:height .5s ease-in;border-radius:2px;';
    dom.outletWrap.appendChild(dom.outletWater);

    applyCfg();
    FX.init($('#fxcv'));
    PANEL.mount($('#cfgMount'));
    PANEL.onChange(snap => {
      cfg = deepMerge(L.DEFAULT_CFG, snap);
      applyCfg();
      if (cfg.aiDemo && st.mode === 'menu') { st.score = 0; st.run = null; startLevel(1); startDemo(); }
    });
    PANEL.onClearBest(() => { st.best = { score: 0, level: 0 }; saveRun(); toast('最佳纪录已清除'); });
    try { PANEL.setBest(st.best); } catch (e) {}

    $('#btnBack').addEventListener('click', () => { AUDIO.play('click'); showMenu(); });
    $('#btnCfg').addEventListener('click', () => { AUDIO.play('click'); PANEL.open(); });
    dom.grid.addEventListener('click', e => {
      const el = e.target.closest('.cell');
      if (el && st.mode === 'playing') onRotate(+el.dataset.idx);
    });
    document.addEventListener('pointerdown', function once() {
      AUDIO.unlock();
      AUDIO.setBGMVolume(cfg.bgmVol); AUDIO.setSFXVolume(cfg.sfxVol);
      if (qs('muted') !== null) AUDIO.setMasterVolume(0);
      document.removeEventListener('pointerdown', once);
    });

    window.addEventListener('resize', () => { layout(); });
    window.addEventListener('orientationchange', () => setTimeout(layout, 250));

    layout();
    renderStatic();

    const lv = qs('level');
    if (lv !== null) {
      st.score = 0; st.run = null;
      startLevel(lv);
      if (qs('demo') !== null) startDemo();
    } else if (qs('demo') !== null) {
      st.score = 0; st.run = null;
      startLevel(1); startDemo();
    } else {
      showMenu();
    }
    FX.ambient(dom.app.clientWidth, dom.app.clientHeight);
  }

  /* ---------------- 测试钩子 ---------------- */
  window.__pc = {
    get mode() { return st.mode; },
    get level() { return st.level; },
    get score() { return st.score; },
    get timer() { return st.timer; },
    board: () => st.board,
    rotate: idx => onRotate(idx),
    demo: () => startDemo(),
    flow: () => lastFlow,
    start: (n, keep) => startLevel(n, keep),
    solve: () => L.solveFrom(rows, st.board.cells),
    toast,
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return { toast };
})();

</script>

</body>
</html>
