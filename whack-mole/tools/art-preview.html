<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>欢乐打地鼠 · 美术资产自检</title>
<style>
 body{margin:0;background:#F4EFDF;color:#2B2622;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
 .wrap{max-width:900px;margin:0 auto;padding:26px 22px 56px}
 header{border-bottom:3px solid #B93A2B;padding-bottom:10px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
 h1{font-family:"Songti SC","STSong",serif;font-weight:900;color:#B93A2B;font-size:30px;margin:0;letter-spacing:2px}
 header small{color:#8A5A33;font-size:13px}
 h2{font-family:"Songti SC","STSong",serif;color:#8F2B20;font-size:18px;margin:34px 0 14px;padding-left:10px;border-left:5px solid #C99A3C}
 .grid{display:flex;flex-wrap:wrap;gap:20px 16px;align-items:flex-end}
 figure{margin:0;text-align:center}
 figcaption{font-size:12px;margin-top:6px;letter-spacing:.5px;color:#2B2622}
 figcaption b{color:#B93A2B;font-weight:700}
 .sz{color:#5D8242;font-size:11px}
 .hole{position:relative;width:120px;height:122px;margin:16px auto 0}
 .hole img{position:absolute;display:block}
 .hole .bk{left:0;top:38px;width:120px;height:80px}
 .hole .mo{left:14px;top:-12px;width:92px;height:92px}
 .hole .ft{left:0;top:54px;width:120px;height:60px}
 .grass{background:#7DA45B;border:2px solid #3A2E24;padding:10px;display:flex;gap:14px;align-items:flex-end}
 .grass figure{margin:0}
 .grass img{display:block}
 .row{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end}
 .plain img{display:block;margin:0 auto}
 .icons{display:flex;flex-wrap:wrap;gap:14px}
 .icons .card{width:72px;background:#FFF9EE;border:2px solid #3A2E24;padding:10px 0 8px;text-align:center}
 .icons img{width:34px;height:34px;display:block;margin:0 auto}
 .icons figcaption{margin-top:6px}
 .note{margin-top:30px;font-size:12px;color:#5D8242;border-top:1px solid #6B9350;padding-top:10px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <h1>欢乐打地鼠 · 美术资产自检</h1>
  <small>WM.ART ｜ 草地游园会印刷风 ｜ 全部 SVG dataURI ｜ 2px 深棕描边 #3A2E24</small>
 </header>
 <div id="out"></div>
 <div class="note" id="note"></div>
</div>
<script src="../src/art.js"></script>
<script>
(function(){
 var A=WM.ART;
 var cn={normal:'地鼠',gold:'金地鼠',gift:'礼盒鼠',bomb:'炸弹鼠'};
 var poseCn={up:'探头 up',hit:'被打 hit'};
 function kb(u){try{return (decodeURIComponent(u.split(',')[1]).length/1024).toFixed(2)+'KB'}catch(e){return '?'}}
 var h='';
 /* 一、8 地鼠态叠放洞口，验证遮挡 */
 h+='<h2>一、地鼠 8 态（后片 → 地鼠 → 前片 叠放验证遮挡关系）</h2><div class="grid">';
 ['normal','gold','gift','bomb'].forEach(function(id){
  ['up','hit'].forEach(function(pose){
   var u=A.mole(id,pose);
   h+='<figure><div class="hole">'
     +'<img class="bk" src="'+A.holeBack()+'" alt="">'
     +'<img class="mo" src="'+u+'" alt="">'
     +'<img class="ft" src="'+A.holeFront()+'" alt="">'
     +'</div><figcaption><b>'+cn[id]+'</b> · '+poseCn[pose]+'<br><span class="sz">'+kb(u)+'</span></figcaption></figure>';
  });
 });
 h+='</div>';
 /* 二、洞口分层原件 */
 h+='<h2>二、洞口分层与配件</h2><div class="row">';
 h+='<figure><div class="grass">'
   +'<figure><img src="'+A.holeBack()+'" width="120" height="80" alt=""><figcaption class="sz">holeBack 后片 120×80</figcaption></figure>'
   +'<figure><img src="'+A.holeFront()+'" width="120" height="60" alt="" style="align-self:flex-end"><figcaption class="sz">holeFront 前片 120×60</figcaption></figure>'
   +'</div><figcaption><b>洞口两片</b>（草绿底上检视）<br><span class="sz">'+kb(A.holeBack())+' / '+kb(A.holeFront())+'</span></figcaption></figure>';
 ['idle','hit'].forEach(function(p){
  var u=A.hammer(p);
  h+='<figure class="plain"><img src="'+u+'" width="104" height="104" alt=""><figcaption><b>木锤</b> · '+p+'<br><span class="sz">'+kb(u)+'</span></figcaption></figure>';
 });
 [0,1,2].forEach(function(i){
  var u=A.grassTuft(i);
  h+='<figure class="plain"><div class="grass" style="padding:8px 10px 0"><img src="'+u+'" width="96" height="64" alt=""></div><figcaption><b>草丛</b> · '+i+'<br><span class="sz">'+kb(u)+'</span></figcaption></figure>';
 });
 var su=A.seal();
 h+='<figure class="plain"><img src="'+su+'" width="100" height="100" alt=""><figcaption><b>印章 seal</b><br><span class="sz">'+kb(su)+'</span></figcaption></figure>';
 h+='</div>';
 /* 三、uiIcon */
 h+='<h2>三、uiIcon（24 线性 · 2px 描边）</h2><div class="icons">';
 ['sound','soundOff','gift','cfg','clock','trophy','back'].forEach(function(n){
  var u=A.uiIcon(n);
  h+='<figure class="card"><img src="'+u+'" alt=""><figcaption class="sz">'+n+' · '+kb(u)+'</figcaption></figure>';
 });
 h+='</div>';
 document.getElementById('out').innerHTML=h;
 document.getElementById('note').innerHTML='自检要点：8 张地鼠鼠身偏下、顶部留空，下半被洞前片草皮遮挡；金地鼠金身+金星+眯眼；礼盒鼠抱红礼盒；炸弹鼠黑弹+引信火花一眼危险；hit 态压扁 ××晕眼转圈星星（炸弹=焦黑白烟脸）。全部单图源码 ≤3KB，无 shadowBlur，每图至多一处轻渐变。';
})();
</script>
</body>
</html>
