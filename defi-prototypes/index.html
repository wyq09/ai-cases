<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOLIDITY SWAP · DeFi 原型馆 — 8 套金融 App 概念 1:1 交互复刻</title>
<style>
:root{
  --ink:#EDEBFA; --muted:#A29DC8;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{background:#0B0A16;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft Yahei","Helvetica Neue",sans-serif;overflow-x:hidden}
button{font-family:inherit}

/* ── 顶部品牌条 ── */
.brand{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:10px;padding:12px 16px;pointer-events:none}
.brand .logo{pointer-events:auto;cursor:pointer;font-weight:800;letter-spacing:.16em;font-size:12px;color:#fff;background:rgba(18,16,38,.72);border:1px solid rgba(255,255,255,.16);padding:9px 15px;border-radius:999px;backdrop-filter:blur(12px)}
.brand .logo:active{transform:scale(.96)}
.brand .tip{font-size:12px;color:var(--muted);background:rgba(18,16,38,.5);padding:8px 12px;border-radius:999px;backdrop-filter:blur(12px)}
@media (max-width:720px){.brand .tip{display:none}}

/* ── 场景段落 ── */
main#stage{display:block}
section.scene{position:relative;padding:84px 16px 48px;outline:none}
.scene-hd{max-width:1180px;margin:0 auto 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.scene-hd .no{font-size:12px;font-weight:800;color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.3);padding:4px 11px;border-radius:999px;flex:none}
.scene-hd h2{margin:0;font-size:clamp(19px,2.6vw,26px);letter-spacing:.02em}
.scene-hd .sub{color:rgba(255,255,255,.72);font-size:13px}
.scene-hd .sp{flex:1}
.btn-ghost{cursor:pointer;border:1px solid rgba(255,255,255,.32);background:rgba(18,16,38,.42);color:#fff;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:600;backdrop-filter:blur(8px);transition:transform .12s}
.btn-ghost:active{transform:scale(.94)}
.poster{position:relative;border-radius:30px;overflow:hidden;max-width:1280px;margin:0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09), 0 24px 70px rgba(5,4,18,.5)}
.poster-row{position:relative;display:flex;align-items:center;justify-content:safe center;gap:clamp(14px,4vw,58px);padding:clamp(26px,5.5vw,70px) clamp(14px,4.5vw,60px);flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
.poster-row::-webkit-scrollbar{display:none}
.poster-caps{display:flex;justify-content:space-between;gap:12px;padding:26px clamp(18px,4vw,52px) 0;font-size:clamp(12px,1.4vw,15px);color:rgba(255,255,255,.92)}
.poster-caps span{opacity:.95}
.err-card{margin:40px auto;max-width:520px;background:rgba(80,20,30,.55);border:1px solid rgba(255,120,120,.4);border-radius:16px;padding:18px 20px;font-size:13px;line-height:1.6}

/* ── 手机壳（390×844 设计稿，transform 缩放） ── */
.ph-wrap{position:relative;flex:0 0 auto;scroll-snap-align:center}
.phone{position:absolute;top:0;left:0;width:390px;height:844px;border-radius:58px;background:#050507;transform-origin:0 0;
  box-shadow:0 0 0 2.5px rgba(255,255,255,.1), 0 0 0 8px #131218, 0 0 0 9.5px rgba(255,255,255,.07), 0 34px 90px rgba(8,6,26,.55), 0 10px 30px rgba(8,6,26,.45)}
.phone .island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:120px;height:35px;border-radius:22px;background:#000;z-index:40;box-shadow:inset 0 0 3px rgba(255,255,255,.18)}
.phone .island::after{content:'';position:absolute;right:12px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #20304a, #05060a 70%)}
.phone .screen{position:absolute;inset:11px;border-radius:47px;overflow:hidden;background:#000;isolation:isolate}
.phone .sbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:35;display:flex;align-items:center;justify-content:space-between;padding:8px 34px 0;pointer-events:none;font-size:16.5px;font-weight:700;letter-spacing:.02em}
.phone .sbar .sicons{display:flex;align-items:center;gap:7px}
.phone[data-status="light"] .sbar{color:#fff}
.phone[data-status="dark"] .sbar{color:#0B0B12}
.phone .homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:rgba(255,255,255,.92);z-index:35;pointer-events:none}
.phone[data-status="dark"] .homebar{background:rgba(10,10,14,.75)}
.phone .scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.phone .scroll::-webkit-scrollbar{display:none}

/* ── 底部 dock ── */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));z-index:70;display:flex;gap:4px;padding:7px;background:rgba(15,13,32,.82);border:1px solid rgba(255,255,255,.15);border-radius:999px;backdrop-filter:blur(14px);max-width:94vw;overflow-x:auto;scrollbar-width:none;box-shadow:0 12px 34px rgba(0,0,0,.45)}
#dock::-webkit-scrollbar{display:none}
#dock button{flex:0 0 auto;border:0;background:transparent;color:#B6B1DC;font-size:12px;font-weight:700;padding:8px 12px;border-radius:999px;cursor:pointer;transition:all .18s;white-space:nowrap}
#dock button.on{background:#fff;color:#16142E}
#dock button:active{transform:scale(.93)}

/* ── 全屏观看器 ── */
#viewer{position:fixed;inset:0;z-index:90;background:rgba(7,5,18,.88);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
#viewer.show{opacity:1;pointer-events:auto}
#viewer .vbar{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 16px;gap:10px}
#viewer .vtitle{font-size:14px;font-weight:700;color:#fff;background:rgba(18,16,38,.6);padding:9px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.14)}
#viewer .vnav{display:flex;gap:8px}
#viewer .vwrap{position:relative}
@media (max-width:520px){
  #viewer .vtitle{font-size:12px;padding:8px 12px;max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #viewer .vnav{gap:5px}
  #viewer .vnav .btn-ghost{padding:7px 9px;font-size:11.5px}
  #viewer .vhint{font-size:11px;padding:0 12px}
}
#viewer .vhint{position:absolute;bottom:calc(16px + var(--safe-b));left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}

/* ── toast ── */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-12px);z-index:100;background:rgba(22,20,44,.94);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .22s;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  section.scene{padding:70px 8px 40px}
  .poster{border-radius:22px}
}
</style>
</head>
<body>
<header class="brand">
  <div class="logo" id="brandLogo">SOLIDITY SWAP · 原型馆</div>
  <div class="tip">8 套概念原型 · 每台手机均可交互 · 双击手机全屏体验</div>
</header>
<main id="stage"></main>
<nav id="dock" aria-label="场景导航"></nav>
<div id="viewer">
  <div class="vbar">
    <div class="vtitle" id="vTitle">全屏体验</div>
    <div class="vnav">
      <button class="btn-ghost" id="vPrev">‹ 上一台</button>
      <button class="btn-ghost" id="vNext">下一台 ›</button>
      <button class="btn-ghost" id="vClose">✕ 关闭</button>
    </div>
  </div>
  <div class="vwrap" id="vWrap"></div>
  <div class="vhint">双击空白处或按 Esc 关闭 · 手机内所有控件均可交互</div>
</div>
<div id="toast"></div>
<script>window.SWP_FILES=["app.js","phone.js","charts.js","ui.js","fx-bubbles.js","scene-a.js","scene-b.js","scene-c.js","scene-d.js","scene-e.js","scene-f.js","scene-g.js","scene-h.js"];</script>
<script>
/* app.js — 命名空间/场景注册/海报渲染/dock/全屏观看器/toast/音频/持久化/错误采集 */
(function(){
'use strict';
// ?reset=1 清档必须最先执行
if (location.search.indexOf('reset=1') >= 0) {
  try { Object.keys(localStorage).filter(k => k.indexOf('swp:') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) {}
}

const SW = window.SW = { errs: [] };
window.__errs = SW.errs;
window.addEventListener('error', e => SW.errs.push(String(e.message || e)));
window.addEventListener('unhandledrejection', e => SW.errs.push('promise: ' + String(e.reason && e.reason.message || e.reason)));

/* ── 持久化 ── */
SW.store = {
  get(k, d) { try { const v = localStorage.getItem('swp:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('swp:' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ── toast ── */
let toastTimer = 0;
SW.toast = function (msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
};

/* ── 音频（首次交互解锁） ── */
SW.audio = (function () {
  let ctx = null;
  function unlock() { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ctx && ctx.state === 'suspended') ctx.resume(); }
  window.addEventListener('pointerdown', unlock, { once: true, capture: true });
  function tone(f0, f1, dur, vol, type) {
    if (!ctx || ctx.state !== 'running') return;
    try {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
      o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  return {
    unlock,
    pop() { tone(560, 150, 0.1, 0.14, 'triangle'); tone(1400, 900, 0.05, 0.05, 'sine'); },
    tap() { tone(1250, 900, 0.045, 0.05, 'sine'); },
    ok() { tone(520, 780, 0.14, 0.08, 'sine'); }
  };
})();

/* ── 场景注册表 ── */
SW.scenes = { list: [], register(m) { SW.scenes.list.push(m); } };

/* ── 手机登记（供全屏观看器遍历） ── */
SW._phones = []; // {name, title, root, wrap, scale, sectionId}
SW._registerPhone = function (p) { SW._phones.push(p); };

/* ── 海报构建 ── */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function buildStage() {
  const stage = document.getElementById('stage');
  const dock = document.getElementById('dock');
  const scenes = SW.scenes.list.slice().sort((a, b) => a.num - b.num);
  scenes.forEach(m => {
    const sec = document.createElement('section');
    sec.className = 'scene'; sec.id = 'scene-' + m.id; sec.dataset.sid = m.id;
    const hd = document.createElement('div'); hd.className = 'scene-hd';
    hd.innerHTML = '<span class="no">图 ' + m.num + '</span><h2>' + esc(m.title || '') + '</h2>' +
      (m.sub ? '<span class="sub">' + esc(m.sub) + '</span>' : '') + '<span class="sp"></span>' +
      '<button class="btn-ghost" data-full="' + m.id + '">⤢ 全屏体验</button>';
    sec.appendChild(hd);
    const poster = document.createElement('div'); poster.className = 'poster';
    if (m.bg) poster.style.background = m.bg;
    if (m.captions && m.captions.length) {
      const caps = document.createElement('div'); caps.className = 'poster-caps';
      caps.innerHTML = m.captions.map(c => '<span>' + esc(c) + '</span>').join('');
      poster.appendChild(caps);
    }
    const row = document.createElement('div'); row.className = 'poster-row';
    poster.appendChild(row); sec.appendChild(poster); stage.appendChild(sec);
    try { m.build(row, SW); }
    catch (err) {
      SW.errs.push('scene ' + m.id + ': ' + (err && err.message || err));
      const ec = document.createElement('div'); ec.className = 'err-card';
      ec.textContent = '场景「' + (m.title || m.id) + '」渲染失败：' + (err && err.message || err);
      row.appendChild(ec);
    }
    // 背景氛围泡泡
    if (m.ambience) {
      try { SW.fx.bubbles(poster, Object.assign({ interactive: false, mode: 'rise', count: 12, maxR: 60, speed: 0.22, z: 0 }, m.ambience)); } catch (e) {}
    }
    // dock 按钮
    const b = document.createElement('button');
    b.textContent = '图' + m.num; b.dataset.sid = m.id;
    b.addEventListener('click', () => { SW.audio.tap(); document.getElementById('scene-' + m.id).scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    dock.appendChild(b);
  });
  // dock 高亮跟随
  const io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (e.isIntersecting) {
        dock.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.sid === e.target.dataset.sid));
      }
    });
  }, { rootMargin: '-40% 0px -50% 0px' });
  stage.querySelectorAll('section.scene').forEach(s => io.observe(s));
  // 海报区进出视口 → 暂停远处泡泡由 fx 内部 IntersectionObserver 处理
  // 全屏体验按钮
  stage.addEventListener('click', e => {
    const b = e.target.closest('[data-full]');
    if (b) openViewerByScene(b.dataset.full);
  });
}

/* ── 全屏观看器（把 .phone 元素搬进 viewer，关闭时搬回） ── */
const viewer = {
  cur: -1, placeholder: null, originScale: 1,
  list() { return SW._phones; },
  open(i) {
    const phones = this.list(); if (!phones.length) return;
    i = (i + phones.length) % phones.length;
    if (this.cur >= 0) this.restore();
    this.cur = i;
    const p = phones[i];
    const v = document.getElementById('viewer'), vw = document.getElementById('vWrap');
    document.getElementById('vTitle').textContent = '图' + (p.num || '') + ' · ' + (p.title || p.name);
    // 占位防塌陷
    this.placeholder = document.createElement('div');
    this.placeholder.style.cssText = 'width:' + p.wrap.offsetWidth + 'px;height:' + p.wrap.offsetHeight + 'px;flex:0 0 auto';
    p.wrap.parentNode.insertBefore(this.placeholder, p.wrap);
    // 计算适配缩放
    const s = Math.min((innerWidth - 28) / 390, (innerHeight - 118) / 844, 1.05);
    this.originScale = p.scale;
    vw.appendChild(p.wrap);
    p.root.style.transform = 'scale(' + s + ')';
    p.wrap.style.width = (390 * s) + 'px'; p.wrap.style.height = (844 * s) + 'px';
    v.classList.add('show');
    SW.audio.tap();
  },
  restore() {
    const p = this.list()[this.cur]; if (!p) return;
    p.root.style.transform = 'scale(' + this.originScale + ')';
    p.wrap.style.width = (390 * this.originScale) + 'px'; p.wrap.style.height = (844 * this.originScale) + 'px';
    this.placeholder.parentNode.insertBefore(p.wrap, this.placeholder);
    this.placeholder.remove(); this.placeholder = null;
  },
  close() { if (this.cur < 0) return; this.restore(); this.cur = -1; document.getElementById('viewer').classList.remove('show'); },
  step(d) { if (this.cur >= 0) this.open(this.cur + d); }
};
SW.viewer = viewer;

function openViewerByScene(sid) {
  const idx = SW._phones.findIndex(p => p.name === sid + '1' || (p.name || '').indexOf(sid) === 0);
  viewer.open(idx >= 0 ? idx : 0);
}

document.getElementById('vClose').addEventListener('click', () => viewer.close());
document.getElementById('vPrev').addEventListener('click', () => viewer.step(-1));
document.getElementById('vNext').addEventListener('click', () => viewer.step(1));
document.getElementById('viewer').addEventListener('dblclick', e => { if (e.target.id === 'viewer') viewer.close(); });
document.getElementById('brandLogo').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
window.addEventListener('keydown', e => { if (e.key === 'Escape') viewer.close(); });

/* ── 双击手机 → 全屏（事件委托） ── */
let lastTap = 0, lastPhone = null;
window.addEventListener('pointerdown', e => {
  const ph = e.target.closest && e.target.closest('.phone');
  if (!ph) return;
  const now = Date.now();
  if (now - lastTap < 320 && lastPhone === ph) {
    const idx = SW._phones.findIndex(p => p.root === ph);
    if (idx >= 0) { e.preventDefault(); viewer.open(idx); }
  }
  lastTap = now; lastPhone = ph;
}, true);

/* ── 启动 ── */
let booted = false;
SW.boot = function () {
  if (booted) return; booted = true;
  buildStage();
  // 深链 ?scene=x&phone=x2
  const q = new URLSearchParams(location.search);
  const sid = q.get('scene');
  if (sid) {
    setTimeout(() => {
      const sec = document.getElementById('scene-' + sid);
      if (sec) sec.scrollIntoView({ block: 'start' });
      const pid = q.get('phone');
      if (pid) {
        const idx = SW._phones.findIndex(p => p.name === pid);
        if (idx >= 0) setTimeout(() => viewer.open(idx), 350);
      }
    }, 420);
  }
};
function ready() {
  if (window.__SWP_TEST__) { return; } // test.html 注入完脚本后手动调 SW.boot
  SW.boot();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready);
else {
  // index.html 同步脚本：场景脚本已全部执行完
  if (window.__SWP_BUILT__) SW.boot();
  else document.addEventListener('swp:ready', SW.boot, { once: true });
}
})();

</script>
<script>
/* phone.js — iPhone 壳组件：390×844 设计稿，transform 缩放，灵动岛/状态栏/Home条 */
(function () {
'use strict';
const SW = window.SW;

const ICONS = {
  signal: '<svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>',
  wifi: '<svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 12a1.7 1.7 0 1 0 0-3.4 1.7 1.7 0 0 0 0 3.4Z"/><path d="M8.5 5.2c1.7 0 3.2.6 4.4 1.7l-1.5 1.6a4.3 4.3 0 0 0-5.8 0L4.1 6.9a6.4 6.4 0 0 1 4.4-1.7Z"/><path d="M8.5.5c2.9 0 5.6 1.1 7.6 3l-1.5 1.5A8.7 8.7 0 0 0 8.5 2.6c-2.4 0-4.6.9-6.1 2.4L.9 3.5c2-1.9 4.7-3 7.6-3Z"/></svg>',
  batt: '<svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="20" height="9" rx="2.2" fill="currentColor"/><path d="M25.5 4.5v4a2.2 2.2 0 0 0 0-4Z" fill="currentColor" opacity=".45"/></svg>'
};

/**
 * 创建一台 iPhone。
 * opts: { scale, status:'light'|'dark', screenBg, name, num, title }
 * 返回 { wrap, root, screen, scroll }
 */
SW.phone = function (opts) {
  opts = opts || {};
  const scale = opts.scale || (window.innerWidth < 780
    ? Math.max(0.42, Math.min(0.8, (window.innerWidth - 46) / 390))
    : 0.8);
  const wrap = document.createElement('div');
  wrap.className = 'ph-wrap';
  wrap.style.width = (390 * scale) + 'px';
  wrap.style.height = (844 * scale) + 'px';

  const root = document.createElement('div');
  root.className = 'phone';
  root.dataset.status = opts.status || 'light';
  if (opts.name) root.dataset.phone = opts.name;
  root.style.transform = 'scale(' + scale + ')';

  root.innerHTML =
    '<div class="island"></div>' +
    '<div class="screen">' +
      '<div class="sbar"><span class="stime">9:41</span><span class="sicons">' + ICONS.signal + ICONS.wifi + ICONS.batt + '</span></div>' +
      '<div class="scroll"></div>' +
      '<div class="homebar"></div>' +
    '</div>';

  wrap.appendChild(root);

  const screen = root.querySelector('.screen');
  const scroll = root.querySelector('.scroll');
  if (opts.screenBg) screen.style.background = opts.screenBg;

  // 注册到全屏观看器
  if (opts.name && SW._registerPhone) {
    SW._registerPhone({ name: opts.name, num: opts.num, title: opts.title, root, wrap, scale });
  }
  return { wrap, root, screen, scroll, scale };
};

/* 便捷：把内容节点放进滚动区 */
SW.phoneFill = function (p, el) { p.scroll.appendChild(el); return el; };
})();

</script>
<script>
/* charts.js — Canvas 图表库：spark/line/bars/candles/gauge。DPR≤2，无 shadowBlur（柔光用多重描边），入场自动动画 */
(function () {
'use strict';
const SW = window.SW;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function makeCv(el, w, h) {
  el.innerHTML = '';
  const cv = document.createElement('canvas');
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  el.appendChild(cv);
  const ctx = cv.getContext('2d');
  ctx.scale(DPR, DPR);
  return ctx;
}
function ease(t) { return 1 - Math.pow(1 - t, 3); }
function tween(from, to, dur, cb) {
  const t0 = performance.now();
  (function step(now) {
    const k = Math.max(0, Math.min(1, (now - t0) / dur)); // headless 下 now 可能早于 t0，钳到 [0,1]
    cb(from + (to - from) * ease(k));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function smoothPath(ctx, pts) {
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    ctx.bezierCurveTo(
      p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
      p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6,
      p2[0], p2[1]);
  }
}

function bounds(data, min, max) {
  let lo = min, hi = max;
  if (lo == null || hi == null) {
    lo = Infinity; hi = -Infinity;
    data.forEach(v => { if (v < lo) lo = v; if (v > hi) hi = v; });
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    if (hi === lo) { hi = lo + 1; }
    const pad = (hi - lo) * 0.12;
    if (min == null) lo -= pad;
    if (max == null) hi += pad;
  }
  return [lo, hi];
}

SW.charts = {};

/* 迷你折线 */
SW.charts.spark = function (el, data, o) {
  o = o || {};
  const w = o.w || el.clientWidth || 120, h = o.h || 40;
  const ctx = makeCv(el, w, h);
  const [lo, hi] = bounds(data);
  const pts = data.map((v, i) => [2 + i * (w - 4) / (data.length - 1), 3 + (1 - (v - lo) / (hi - lo)) * (h - 6)]);
  const color = o.color || '#fff';
  if (o.fill) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = 0.22; ctx.fillStyle = g;
    ctx.beginPath(); smoothPath(ctx, pts);
    ctx.lineTo(pts[pts.length - 1][0], h); ctx.lineTo(pts[0][0], h); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.beginPath(); smoothPath(ctx, pts);
  ctx.strokeStyle = color; ctx.lineWidth = o.width || 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
};

/* 平滑曲线（多系列 + 标注点/竖虚线），o:{series:[{data,color,width,fill,fillColor}],h,min,max,dot:{i,color,r},vline:{i,color,label}} */
SW.charts.line = function (el, o) {
  const w = o.w || el.clientWidth || 300, h = o.h || 160;
  const ctx = makeCv(el, w, h);
  const all = [];
  o.series.forEach(s => all.push.apply(all, s.data));
  const [lo, hi] = bounds(all, o.min, o.max);
  const n = Math.max.apply(null, o.series.map(s => s.data.length));
  const X = i => 4 + i * (w - 8) / (n - 1);
  const Y = v => 6 + (1 - (v - lo) / (hi - lo)) * (h - 12);
  // 竖虚线
  if (o.vline) {
    ctx.setLineDash([4, 4]); ctx.strokeStyle = o.vline.color || 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(X(o.vline.i), 4); ctx.lineTo(X(o.vline.i), h - 4); ctx.stroke(); ctx.setLineDash([]);
  }
  o.series.forEach(s => {
    const pts = s.data.map((v, i) => [X(i), Y(v)]);
    const col = s.color || '#fff';
    if (s.fill) {
      const fc = s.fillColor || col;
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, fc); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.25; ctx.fillStyle = g;
      ctx.beginPath(); smoothPath(ctx, pts);
      ctx.lineTo(pts[pts.length - 1][0], h); ctx.lineTo(pts[0][0], h); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.beginPath(); smoothPath(ctx, pts);
    ctx.strokeStyle = col; ctx.lineWidth = s.width || 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke();
  });
  // 标注点（动画放大）
  if (o.dot) {
    const s0 = o.series[0];
    const px = X(Math.min(o.dot.i, s0.data.length - 1)), py = Y(s0.data[Math.min(o.dot.i, s0.data.length - 1)]);
    tween(0, 1, 500, k => {
      const rr = Math.max(0.1, (o.dot.r || 5) * k + 2);
      ctx.save();
      ctx.beginPath(); ctx.arc(px, py, rr, 0, 7);
      ctx.fillStyle = o.dot.color || '#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(px, py, rr + 4 * k, 0, 7);
      ctx.strokeStyle = o.dot.color || '#fff'; ctx.globalAlpha = 0.35 * (1 - k * 0.4); ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    });
  }
  // 竖线标签
  if (o.vline && o.vline.label) {
    ctx.font = '600 11px -apple-system,"PingFang SC",sans-serif';
    const tw = ctx.measureText(o.vline.label).width;
    let lx = Math.min(Math.max(X(o.vline.i) - tw / 2 - 8, 2), w - tw - 18);
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    roundRect(ctx, lx, 0, tw + 16, 20, 10); ctx.fill();
    ctx.fillStyle = '#1B1840'; ctx.fillText(o.vline.label, lx + 8, 14);
  }
};
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* 圆角柱状 values:[{v(0~1),color}] */
SW.charts.bars = function (el, o) {
  const w = o.w || el.clientWidth || 300, h = o.h || 120;
  const ctx = makeCv(el, w, h);
  const vals = o.values, n = vals.length;
  const gap = o.gap != null ? o.gap : Math.max(6, w * 0.035);
  const bw = (w - gap * (n - 1)) / n;
  const full = vals.map(b => Math.max(0.06, Math.min(1, b.v)) * (h - 8));
  const rad = o.rounded != null ? o.rounded : Math.min(bw / 2.6, 9);
  if (o.animate === false) { paint(1); return; }
  tween(0, 1, 700, paint);
  function paint(k) {
    ctx.clearRect(0, 0, w, h);
    vals.forEach((b, i) => {
      const t = Math.max(0, Math.min(1, k * 1.6 - i * 0.06));
      const v2 = full[i] * t;
      if (v2 <= 0.5) return;
      const x = i * (bw + gap);
      ctx.fillStyle = b.color || '#fff';
      roundRect(ctx, x, h - v2, bw, v2, Math.min(rad, v2 / 2, bw / 2));
      ctx.fill();
    });
  }
};

/* K线 data:[[open,close,high,low],...] */
SW.charts.candles = function (el, o) {
  const w = o.w || el.clientWidth || 160, h = o.h || 150;
  const ctx = makeCv(el, w, h);
  const data = o.data;
  let lo = Infinity, hi = -Infinity;
  data.forEach(d => { lo = Math.min(lo, d[3]); hi = Math.max(hi, d[2]); });
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const step = w / data.length, bw = step * 0.52;
  data.forEach((d, i) => {
    const [op, cl, hh, ll] = d;
    const up = cl >= op;
    const x = i * step + step / 2;
    const y = v => 4 + (1 - (v - lo) / (hi - lo)) * (h - 8);
    ctx.strokeStyle = up ? (o.up || '#8B7CF6') : (o.down || '#CFC9F2');
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = 1.6;
    setTimeout(() => {
      ctx.beginPath(); ctx.moveTo(x, y(hh)); ctx.lineTo(x, y(ll)); ctx.stroke();
      const top = y(Math.max(op, cl)), bh = Math.max(2.5, Math.abs(y(op) - y(cl)));
      roundRect(ctx, x - bw / 2, top, bw, bh, 1.6); ctx.fill();
    }, i * 36);
  });
};

/* 环形仪表（圆头渐变弧 + 多重柔光 + 中心内容） */
SW.charts.gauge = function (el, o) {
  const size = o.size || el.clientWidth || 220, h = o.h || size;
  const ctx = makeCv(el, size, h);
  const cx = size / 2, cy = h / 2, r = Math.min(size, h) / 2 - (o.thick || 20);
  const a0 = (o.startDeg != null ? o.startDeg : -215) * Math.PI / 180;
  const a1 = (o.endDeg != null ? o.endDeg : 35) * Math.PI / 180;
  const thick = o.thick || 20;
  // 底轨
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1);
  ctx.strokeStyle = o.track || 'rgba(255,255,255,.1)'; ctx.lineWidth = thick; ctx.stroke();
  // 渐变值弧（沿bbox线性渐变）
  const g = ctx.createLinearGradient(cx - r, cy + r, cx + r, cy - r);
  g.addColorStop(0, o.from || '#5B5FEF'); g.addColorStop(1, o.to || '#7DE3FF');
  const sweep = (a1 - a0) * (o.value != null ? o.value : 0.75);
  function draw(k) {
    ctx.clearRect(0, 0, size, h);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1);
    ctx.strokeStyle = o.track || 'rgba(255,255,255,.1)'; ctx.lineWidth = thick; ctx.stroke();
    if (o.glow !== false) {
      [[3.1, .05], [2.2, .09], [1.5, .14]].forEach(([m, a]) => {
        ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + (a1 - a0) * k);
        ctx.strokeStyle = o.to || '#7DE3FF'; ctx.globalAlpha = a; ctx.lineWidth = thick * m; ctx.stroke();
        ctx.globalAlpha = 1;
      });
    }
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + (a1 - a0) * k);
    ctx.strokeStyle = g; ctx.lineWidth = thick; ctx.stroke();
  }
  tween(0, 1, 900, draw);
  if (typeof o.center === 'function') { const c = document.createElement('div'); o.center(c); c.style.cssText += ';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;'; el.style.position = 'relative'; el.appendChild(c); }
};
})();

</script>
<script>
/* ui.js — 组件库：press/tabs/seg/toggle/slider/keypad/sheet/carousel/avatar */
(function () {
'use strict';
const SW = window.SW;
SW.ui = SW.ui || {};

/* 按压反馈 + ripple */
SW.ui.press = function (el) {
  if (!el || el.__pressed) return el;
  el.__pressed = true;
  el.style.position = el.style.position || 'relative';
  el.style.overflow = 'hidden';
  el.addEventListener('pointerdown', e => {
    const r = el.getBoundingClientRect();
    const d = Math.max(r.width, r.height) * 2;
    const rip = document.createElement('span');
    rip.style.cssText = 'position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.28);width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d / 2) + 'px;top:' + (e.clientY - r.top - d / 2) + 'px;transform:scale(0);transition:transform .5s ease-out,opacity .55s;opacity:.9';
    el.appendChild(rip);
    requestAnimationFrame(() => { rip.style.transform = 'scale(1)'; rip.style.opacity = '0'; });
    setTimeout(() => rip.remove(), 600);
    el.style.transform = 'scale(.96)';
    SW.audio.tap();
  });
  el.addEventListener('pointerup', () => { el.style.transform = ''; });
  el.addEventListener('pointerleave', () => { el.style.transform = ''; });
  return el;
};

/* 胶囊 tab 组 */
SW.ui.tabs = function (o) {
  const box = o.el;
  box.style.display = 'flex'; box.style.gap = '8px';
  const btns = [];
  o.items.forEach(it => {
    const b = document.createElement('button');
    b.textContent = it.label;
    b.style.cssText = 'cursor:pointer;border:0;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;color:inherit;background:transparent;transition:all .2s;white-space:nowrap';
    b.addEventListener('click', () => set(it.v));
    box.appendChild(b); btns.push([b, it.v]);
  });
  function paint(v) {
    btns.forEach(([b, v2]) => {
      const on = v2 === v;
      b.style.background = on ? (o.activeBg || '#fff') : (o.bg || 'rgba(255,255,255,.08)');
      b.style.color = on ? (o.activeColor || '#17141F') : (o.color || 'inherit');
      b.style.boxShadow = on ? '0 4px 14px rgba(0,0,0,.25)' : 'none';
    });
  }
  function set(v, silent) { paint(v); if (!silent && o.onChange) o.onChange(v); }
  set(o.value != null ? o.value : o.items[0].v, true);
  return { set, get: () => btns.find(b => b[0].style.boxShadow !== 'none') };
};

/* 分段控件（整条底座） */
SW.ui.seg = function (o) {
  const box = o.el;
  box.style.cssText += ';display:flex;background:' + (o.bg || 'rgba(255,255,255,.08)') + ';border-radius:12px;padding:4px;gap:2px';
  const btns = [];
  o.items.forEach(it => {
    const b = document.createElement('button');
    b.textContent = it.label;
    b.style.cssText = 'flex:1;cursor:pointer;border:0;border-radius:9px;padding:8px 6px;font-size:12.5px;font-weight:600;background:transparent;color:inherit;transition:all .2s;white-space:nowrap';
    b.addEventListener('click', () => set(it.v));
    box.appendChild(b); btns.push([b, it.v]);
  });
  function paint(v) {
    btns.forEach(([b, v2]) => {
      const on = v2 === v;
      b.style.background = on ? (o.activeBg || 'rgba(255,255,255,.92)') : 'transparent';
      b.style.color = on ? (o.activeColor || '#17141F') : 'inherit';
    });
  }
  function set(v, silent) { paint(v); if (!silent && o.onChange) o.onChange(v); }
  set(o.value != null ? o.value : o.items[0].v, true);
  return { set };
};

/* iOS 开关 */
SW.ui.toggle = function (el, o) {
  el.style.cssText += ';width:52px;height:31px;border-radius:16px;background:' + (o.value ? '#6C5CE7' : 'rgba(120,120,140,.4)') + ';position:relative;cursor:pointer;transition:background .22s;flex:none';
  const knob = document.createElement('span');
  knob.style.cssText = 'position:absolute;top:2.5px;left:' + (o.value ? '23.5px' : '2.5px') + ';width:26px;height:26px;border-radius:50%;background:#fff;transition:left .22s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 6px rgba(0,0,0,.3)';
  el.appendChild(knob);
  let v = !!o.value;
  el.addEventListener('click', () => {
    v = !v;
    el.style.background = v ? '#6C5CE7' : 'rgba(120,120,140,.4)';
    knob.style.left = v ? '23.5px' : '2.5px';
    SW.audio.tap();
    if (o.onChange) o.onChange(v);
  });
  return { get: () => v, set(x) { v = !!x; el.style.background = v ? '#6C5CE7' : 'rgba(120,120,140,.4)'; knob.style.left = v ? '23.5px' : '2.5px'; } };
};

/* 滑块 */
SW.ui.slider = function (el, o) {
  el.style.cssText += ';position:relative;height:26px;display:flex;align-items:center;cursor:pointer;touch-action:none';
  const track = document.createElement('div');
  track.style.cssText = 'position:absolute;left:0;right:0;height:5px;border-radius:3px;background:rgba(130,130,160,.35)';
  const fill = document.createElement('div');
  fill.style.cssText = 'position:absolute;left:0;height:5px;border-radius:3px;background:' + (o.color || '#B9A9F5') + ';width:0';
  const knob = document.createElement('div');
  knob.style.cssText = 'position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);transform:translateX(-50%)';
  el.append(track, fill, knob);
  let v = o.value != null ? o.value : o.min;
  function paint() {
    const k = (v - o.min) / (o.max - o.min);
    fill.style.width = (k * 100) + '%';
    knob.style.left = (k * 100) + '%';
  }
  paint();
  function fromEvent(e) {
    const r = el.getBoundingClientRect();
    const k = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    let nv = o.min + k * (o.max - o.min);
    if (o.step) nv = Math.round(nv / o.step) * o.step;
    v = nv; paint(); if (o.onChange) o.onChange(v);
  }
  let dragging = false;
  el.addEventListener('pointerdown', e => { dragging = true; el.setPointerCapture(e.pointerId); fromEvent(e); });
  el.addEventListener('pointermove', e => { if (dragging) fromEvent(e); });
  el.addEventListener('pointerup', () => { dragging = false; SW.audio.tap(); });
  return { get: () => v, set(x) { v = x; paint(); } };
};

/* 数字键盘 keys:[{t,wide?,svg?}] */
SW.ui.keypad = function (o) {
  const grid = o.el;
  grid.style.cssText += ';display:grid;grid-template-columns:repeat(3,1fr);gap:10px';
  (o.keys || []).forEach(k => {
    const b = document.createElement('button');
    if (k.svg) b.innerHTML = k.svg; else b.textContent = k.t;
    b.style.cssText = 'cursor:pointer;border:0;border-radius:14px;padding:14px 0;font-size:21px;font-weight:600;color:inherit;background:' + (o.bg || 'rgba(255,255,255,.07)') + ';transition:transform .1s;display:flex;align-items:center;justify-content:center';
    if (k.wide) b.style.gridColumn = 'span 2';
    SW.ui.press(b);
    b.addEventListener('click', () => o.onPress(k.t));
    grid.appendChild(b);
  });
  return grid;
};

/* 手机内底部弹层 host=.phone screen 元素 */
SW.ui.sheet = function (o) {
  const host = o.host;
  const mask = document.createElement('div');
  mask.style.cssText = 'position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;border-radius:inherit';
  const panel = document.createElement('div');
  panel.style.cssText = 'width:100%;background:' + (o.bg || '#1D1B2E') + ';border-radius:22px 22px 0 0;padding:16px 18px 26px;transform:translateY(30px);opacity:0;transition:all .26s cubic-bezier(.3,0,.2,1);color:#fff;max-height:72%;overflow-y:auto';
  const title = document.createElement('div');
  title.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px';
  title.innerHTML = '<b style="font-size:16px">' + (o.title || '选择') + '</b>';
  const x = document.createElement('button');
  x.textContent = '✕'; x.style.cssText = 'cursor:pointer;border:0;background:rgba(255,255,255,.1);color:#fff;width:28px;height:28px;border-radius:50%;font-size:13px';
  x.addEventListener('click', close);
  title.appendChild(x); panel.appendChild(title);
  (o.items || []).forEach(it => {
    const row = document.createElement('button');
    row.style.cssText = 'width:100%;text-align:left;cursor:pointer;border:0;background:rgba(255,255,255,.05);color:#fff;border-radius:14px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600';
    row.innerHTML = (it.icon || '') + '<span style="flex:1">' + it.label + (it.desc ? '<br><span style="font-size:12px;opacity:.6;font-weight:400">' + it.desc + '</span>' : '') + '</span>' + (it.v === o.value ? '<span style="color:#8B7CF6">✓</span>' : '');
    row.addEventListener('click', () => { close(); if (o.onPick) o.onPick(it.v); });
    panel.appendChild(row);
  });
  mask.appendChild(panel); host.appendChild(mask);
  requestAnimationFrame(() => { panel.style.transform = 'translateY(0)'; panel.style.opacity = '1'; });
  mask.addEventListener('click', e => { if (e.target === mask) close(); });
  function close() { panel.style.transform = 'translateY(30px)'; panel.style.opacity = '0'; setTimeout(() => mask.remove(), 240); }
  return { close };
};

/* 轮播：横向滑动 + 圆点 */
SW.ui.carousel = function (o) {
  const el = o.el;
  el.style.cssText += ';overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;display:flex;border-radius:inherit';
  el.innerHTML = '';
  el.style.setProperty('--x', 0);
  const dots = o.dots;
  let cur = o.value || 0;
  const n = o.count;
  function paintDots() {
    if (!dots) return;
    Array.from(dots.children).forEach((d, i) => {
      d.style.background = i === cur ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.35)';
      d.style.transform = i === cur ? 'scale(1.15)' : 'scale(1)';
    });
  }
  if (dots) {
    dots.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const d = document.createElement('span');
      d.style.cssText = 'width:7px;height:7px;border-radius:50%;display:inline-block;transition:all .2s;cursor:pointer';
      d.addEventListener('click', () => go(i));
      dots.appendChild(d);
    }
  }
  function go(i) {
    cur = Math.max(0, Math.min(n - 1, i));
    el.scrollTo({ left: el.clientWidth * cur, behavior: 'smooth' });
    paintDots();
    if (o.onChange) o.onChange(cur);
  }
  let st = 0;
  el.addEventListener('scroll', () => {
    clearTimeout(st);
    st = setTimeout(() => {
      const i = Math.round(el.scrollLeft / Math.max(1, el.clientWidth));

<script>
/* fx-bubbles.js — 玻璃泡泡引擎
   预渲染玻璃质感精灵（边缘亮环+内反射弧+左上高光），rise 升腾 / cluster 星团两种模式，
   点击爆开（扩散环+水珠粒子+音效）。DPR≤2、无 shadowBlur、离屏缓存、离屏/隐藏自动暂停。 */
(function () {
'use strict';
const SW = window.SW;
SW.fx = SW.fx || {};
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const spriteCache = new Map();

/* 玻璃泡泡精灵：tint="r,g,b" */
function sprite(r, tint) {
  if (!(r > 0.3)) r = 0.3;
  const key = Math.round(r) + '|' + tint;
  if (spriteCache.has(key)) return spriteCache.get(key);
  const S = Math.ceil(r * 2 * DPR) + 2;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const c = S / 2;
  const x = cv.getContext('2d');
  const [tr, tg, tb] = tint.split(',').map(Number);
  // 主体：中心透明 → 边缘亮环
  const g = x.createRadialGradient(c, c, r * 0.5, c, c, r);
  g.addColorStop(0, 'rgba(' + tint + ',0)');
  g.addColorStop(0.62, 'rgba(' + tint + ',0.04)');
  g.addColorStop(0.8, 'rgba(' + tint + ',0.12)');
  g.addColorStop(0.9, 'rgba(' + tint + ',0.32)');
  g.addColorStop(0.97, 'rgba(' + Math.min(255, tr + 40) + ',' + Math.min(255, tg + 40) + ',' + Math.min(255, tb + 45) + ',0.6)');
  g.addColorStop(1, 'rgba(255,255,255,0.75)');
  x.fillStyle = g;
  x.beginPath(); x.arc(c, c, r, 0, 7); x.fill();
  // 内部轻微填充（玻璃厚度感）
  const g2 = x.createRadialGradient(c, c + r * 0.25, r * 0.1, c, c, r * 0.92);
  g2.addColorStop(0, 'rgba(' + tint + ',0.10)');
  g2.addColorStop(0.7, 'rgba(' + tint + ',0.02)');
  g2.addColorStop(1, 'rgba(' + tint + ',0)');
  x.fillStyle = g2;
  x.beginPath(); x.arc(c, c, r * 0.92, 0, 7); x.fill();
  // 右下内反射弧
  x.strokeStyle = 'rgba(255,255,255,0.32)';
  x.lineWidth = Math.max(1, r * 0.055);
  x.lineCap = 'round';
  x.beginPath(); x.arc(c, c, r * 0.78, Math.PI * 0.18, Math.PI * 0.62); x.stroke();
  x.strokeStyle = 'rgba(255,255,255,0.16)';
  x.lineWidth = Math.max(1, r * 0.04);
  x.beginPath(); x.arc(c, c, r * 0.68, Math.PI * 0.24, Math.PI * 0.5); x.stroke();
  // 左上主高光（椭圆）
  x.save();
  x.translate(c - r * 0.38, c - r * 0.44);
  x.rotate(-0.6);
  const hg = x.createRadialGradient(0, 0, 0, 0, 0, r * 0.3);
  hg.addColorStop(0, 'rgba(255,255,255,0.95)');
  hg.addColorStop(0.55, 'rgba(255,255,255,0.4)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = hg;
  x.beginPath(); x.ellipse(0, 0, r * 0.3, r * 0.19, 0, 0, 7); x.fill();
  x.restore();
  // 次高光小点
  x.fillStyle = 'rgba(255,255,255,0.7)';
  x.beginPath(); x.arc(c + r * 0.18, c - r * 0.52, Math.max(0.8, r * 0.045), 0, 7); x.fill();
  spriteCache.set(key, cv);
  return cv;
}

function rand(a, b) { if (b < a) { const t = a; a = b; b = t; } return a + Math.random() * (b - a); }

/**
 * SW.fx.bubbles(host, opts)
 * mode 'rise': 从底部升起漂浮；mode 'cluster': 绕 center 星团抖动
 */
SW.fx.bubbles = function (host, opts) {
  const o = Object.assign({
    count: 14, minR: 14, maxR: 72, speed: 0.3,
    tint: '215,215,255', interactive: true,
    mode: 'rise', center: null, z: 1, alpha: 1
  }, opts || {});

  const cv = document.createElement('canvas');
  const pos = o.mode === 'cluster' ? 'absolute' : 'absolute';
  // canvas 永远穿透点击（不拦截宿主内按钮）；命中判定挂在宿主 capture 上
  cv.style.cssText = 'position:' + pos + ';inset:0;width:100%;height:100%;pointer-events:none;z-index:' + o.z;
  if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
  host.appendChild(cv);
  const x = cv.getContext('2d');
  let W = 0, H = 0;

  function resize() {
    const r = host.getBoundingClientRect();
    W = Math.max(2, r.width); H = Math.max(2, r.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();

  const bubbles = [], drops = [], rings = [];
  function spawn(initial) {
    const r = rand(o.minR, o.maxR);
    const b = {
      r,
      x: rand(r, W - r), y: initial ? rand(0, H) : H + r + rand(0, 60),
      vy: rand(0.6, 1.15) * (r / o.maxR) * o.speed * 60 / 60,
      ph: rand(0, 6.28), drift: rand(6, 22), ws: rand(0.3, 0.8),
      a: rand(0.55, 0.95) * o.alpha, sq: rand(0.9, 1.1)
    };
    if (o.mode === 'cluster' && o.center) {
      const ang = rand(0, 6.28), rad = Math.sqrt(Math.random()) * o.center.r;
      b.cx = o.center.x + Math.cos(ang) * rad; b.cy = o.center.y + Math.sin(ang) * rad;
      b.x = b.cx; b.y = b.cy;
      b.or = Math.hypot(b.cx - o.center.x, b.cy - o.center.y);
      b.oa = Math.atan2(b.cy - o.center.y, b.cx - o.center.x);
      b.r = Math.min(b.r, rand(o.minR, Math.max(o.minR + 4, o.center.r * 0.42)));
    }
    return b;
  }
  for (let i = 0; i < o.count; i++) bubbles.push(spawn(true));

  /* 爆开水珠 */
  function burst(px, py, n) {
    n = n || 9;
    for (let i = 0; i < n; i++) {
      const a = rand(0, 6.28), sp = rand(0.6, 2.6);
      drops.push({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6, r: rand(1.2, 3.4), life: 1 });
    }
    rings.push({ x: px, y: py, r: 4, life: 1 });
    SW.audio.pop();
  }

  let visible = true, running = true, t0 = performance.now();
  const io = new IntersectionObserver(es => { visible = es[0].isIntersecting; }, { rootMargin: '80px' });
  io.observe(host);

  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
    if (!visible || document.hidden) return;
    const t = now / 1000;
    x.clearRect(0, 0, W, H);
    // 泡泡
    for (const b of bubbles) {
      if (o.mode === 'rise') {
        b.y -= b.vy * dt * 60 * 0.55;
        b.x += Math.sin(t * b.ws + b.ph) * b.drift * dt;
        const wob = 1 + Math.sin(t * 1.7 + b.ph) * 0.035;
        if (b.y < -b.r * 1.5) Object.assign(b, spawn(false));
        const sp = sprite(b.r, o.tint);
        x.globalAlpha = b.a;
        const rr = Math.max(0.5, b.r * b.sq * wob);
        x.drawImage(sp, b.x - rr, b.y - rr, rr * 2, rr * 2);
      } else {
        // cluster：绕心缓慢公转 + 径向呼吸
        const oa = b.oa + Math.sin(t * 0.22 + b.ph) * 0.09;
        const or2 = b.or * (1 + Math.sin(t * 0.6 + b.ph) * 0.055);
        b.x = (o.center ? o.center.x : W / 2) + Math.cos(oa) * or2;
        b.y = (o.center ? o.center.y : H / 2) + Math.sin(oa) * or2 * 0.86;
        const wob = 1 + Math.sin(t * 1.9 + b.ph * 2) * 0.04;
        const sp = sprite(b.r, o.tint);
        x.globalAlpha = b.a * 0.96;
        const rr = Math.max(0.5, b.r * wob);
        x.drawImage(sp, b.x - rr, b.y - rr, rr * 2, rr * 2);
      }
    }
    x.globalAlpha = 1;
    // 水珠粒子
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.x += d.vx; d.y += d.vy; d.vy += 0.055; d.life -= dt * 1.5;
      if (d.life <= 0) { drops.splice(i, 1); continue; }
      const dr = Math.max(0.2, d.r * (0.5 + d.life * 0.5));
      x.globalAlpha = Math.max(0, d.life) * 0.9;
      x.fillStyle = 'rgba(255,255,255,0.95)';
      x.beginPath(); x.arc(d.x, d.y, dr, 0, 7); x.fill();
      x.strokeStyle = 'rgba(' + o.tint + ',0.8)'; x.lineWidth = 1;
      x.beginPath(); x.arc(d.x, d.y, dr + 0.8, 0, 7); x.stroke();
    }
    // 扩散环
    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.r += dt * 60; rg.life -= dt * 2.4;
      if (rg.life <= 0) { rings.splice(i, 1); continue; }
      x.globalAlpha = rg.life * 0.75;
      x.strokeStyle = 'rgba(255,255,255,0.9)'; x.lineWidth = 1.6;
      x.beginPath(); x.arc(rg.x, rg.y, rg.r, 0, 7); x.stroke();
      x.strokeStyle = 'rgba(' + o.tint + ',0.9)'; x.lineWidth = 3.4;
      x.globalAlpha = rg.life * 0.3;
      x.beginPath(); x.arc(rg.x, rg.y, rg.r * 0.82, 0, 7); x.stroke();
    }
    x.globalAlpha = 1;
  }
  requestAnimationFrame(frame);

  // 点击爆开：宿主 capture 捕获，命中最上层泡泡则爆开；不阻止下层元素的默认点击
  if (o.interactive) {
    host.addEventListener('pointerdown', e => {
      const r = host.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (Math.hypot(px - b.x, py - b.y) <= b.r * 1.06) {
          burst(b.x, b.y, Math.round(6 + b.r / 9));
          bubbles[i] = spawn(o.mode !== 'rise');
          return;
        }
      }
    }, true);
  }
  let ro = null;
  if (typeof ResizeObserver === 'function') {
    ro = new ResizeObserver(resize);
    ro.observe(host);
  }
  window.addEventListener('resize', resize);

  return {
    destroy() { running = false; io.disconnect(); if (ro) ro.disconnect(); cv.remove(); },
    burst,
    canvas: cv
  };
};
})();

</script>

    el('div', 'font-size:22px;font-weight:800;margin-top:4px', c2).textContent = '$38.7B';

    el('div', 'display:inline-flex;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.24);font-size:11px;font-weight:800;color:#D9FFE9', c2).textContent = '▲ 7.54%';

    /* 涨幅榜 */

/* ══ 兑换页（a2 内嵌 + a3 独立复用） ══ */
function addSwap(st, bg, onBack, ph, idBase) {
  st.add(({ scr }) => {
    const state = { from: 'BTC', to: 'ETH', amt: 0.8, recv: 12.32 };

    /* 头部：‹ 兑换 ✕ */
    const head = el('div', 'display:flex;align-items:center;gap:10px;padding:60px 20px 0', scr);
    const back = circleBtn(head, ico(P_BACK, 18, '#fff', 1.8));
    back.id = idBase + '-back';
    back.addEventListener('click', onBack);
    el('div', 'flex:1;text-align:center;font-size:16px;font-weight:800;color:#fff', head).textContent = '兑换';
    const close = circleBtn(head, '<span style="font-size:14px">✕</span>');
    close.id = idBase + '-close';
    close.addEventListener('click', onBack);

    function coinCard(glowColor, label) {
      const wrap = el('div', 'position:relative;margin:16px 20px 0', scr);
      el('div', 'position:absolute;left:50%;top:50%;width:230px;height:230px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;filter:blur(26px);background:radial-gradient(circle,' + glowColor + ' 0%,rgba(0,0,0,0) 62%)', wrap);
      const card = el('div', 'position:relative;z-index:1;border-radius:20px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);padding:15px 16px', wrap);
      el('div', 'font-size:12px;color:rgba(255,255,255,.55);margin-bottom:12px', card).textContent = label;
      return card;
    }
    function coinBtn(card, code, isPay) {
      const b = el('button', 'display:flex;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;padding:2px;flex:none', card);
      const bb = el('div', '', b); bb.appendChild(badge(code, 40));
      const col = el('div', 'text-align:left', b);
      const symEl = el('div', 'font-size:15px;font-weight:800;color:#fff', col); symEl.textContent = code;
      const nameEl = el('div', 'font-size:11px;color:rgba(255,255,255,.5);margin-top:2px', col);
      b.insertAdjacentHTML('beforeend', ico(P_DOWN, 13, 'rgba(255,255,255,.55)', 2));
      SW.ui.press(b);
      b.id = idBase + (isPay ? '-payCoin' : '-recvCoin');
      return { b, bb, symEl, nameEl };
    }

    /* 你支付 */
    const payCard = coinCard('rgba(59,79,239,.55)', '你支付');
    const payRow = el('div', 'display:flex;align-items:center;gap:10px', payCard);
    const pay = coinBtn(payRow, state.from, true);
    const inEl = el('input', 'flex:1;min-width:0;width:120px;background:transparent;border:0;outline:none;color:#fff;font-size:28px;font-weight:800;text-align:right;font-family:inherit;padding:0', payRow);
    inEl.type = 'text'; inEl.setAttribute('inputmode', 'decimal'); inEl.value = '0.8'; inEl.id = idBase + '-amt';
    const balRow = el('div', 'display:flex;align-items:center;margin-top:14px', payCard);
    const balEl = el('span', 'font-size:11.5px;color:rgba(255,255,255,.45)', balRow);
    const maxB = el('button', 'margin-left:auto;border:0;background:transparent;color:#6FE8C2;font-size:11.5px;font-weight:800;cursor:pointer;padding:2px 4px', balRow);
    maxB.textContent = '最大';
    maxB.id = idBase + '-max';
    SW.ui.press(maxB);

    /* 交换圆钮 */
    const mid = el('div', 'position:relative;z-index:2;display:flex;justify-content:center;margin:-9px 0', scr);
    const swapB = el('button', 'width:46px;height:46px;border-radius:50%;border:4px solid #0B0B14;background:#17171F;cursor:pointer;display:flex;align-items:center;justify-content:center', mid);
    const rotWrap = el('span', 'display:flex;transition:transform .45s cubic-bezier(.4,0,.2,1)', swapB);
    rotWrap.innerHTML = ico(P_SWAPY, 20, '#F7931A', 2);
    swapB.id = idBase + '-swap';
    SW.ui.press(swapB);

    /* 你到账 */
    const recvCard = coinCard('rgba(59,232,176,.42)', '你到账');
    const recvRow = el('div', 'display:flex;align-items:center;gap:10px', recvCard);
    const recv = coinBtn(recvRow, state.to, false);
    const amtBox = el('div', 'flex:1;min-width:0;display:flex;align-items:baseline;justify-content:flex-end;gap:4px', recvRow);
    el('span', 'font-size:16px;font-weight:700;color:rgba(255,255,255,.5)', amtBox).textContent = '≈';
    const recvEl = el('span', 'font-size:28px;font-weight:800;color:#fff', amtBox);

    /* 信息行 */
    const infoBox = el('div', 'padding:4px 26px 0', scr);
    function infoRow(label, valText, color) {
      const r = el('div', 'display:flex;align-items:center;margin-top:15px', infoBox);
      el('span', 'font-size:13px;color:rgba(255,255,255,.45)', r).textContent = label;
      const s = el('span', 'font-size:13px;font-weight:700;margin-left:auto;color:' + (color || '#fff'), r);
      s.textContent = valText;
      return s;
    }
    const rateEl = infoRow('汇率', '1 BTC = 15.40 ETH');
    infoRow('价格影响', '0.02%', '#45E090');
    infoRow('流动性手续费', '2.50 USDT');

    /* 确认 */
    const confirmB = el('button', 'display:block;width:calc(100% - 40px);margin:24px 20px 0;height:52px;border:0;border-radius:999px;background:#5B5FEF;color:#fff;font-size:15px;font-weight:800;letter-spacing:.08em;cursor:pointer', scr);
    confirmB.textContent = '确认';
    confirmB.id = idBase + '-confirm';
    SW.ui.press(confirmB);
    el('div', 'height:40px', scr);

    /* ── 联动逻辑 ── */
    function syncCoins() {
      pay.bb.replaceChildren(badge(state.from, 40));
      recv.bb.replaceChildren(badge(state.to, 40));
      pay.symEl.textContent = state.from; pay.nameEl.textContent = COIN[state.from].name;
      recv.symEl.textContent = state.to; recv.nameEl.textContent = COIN[state.to].name;
    }
    function updateQuote() {
      state.recv = state.amt * ETH_PER[state.from] / ETH_PER[state.to];
      recvEl.textContent = fmtAmt(state.recv);
      rateEl.textContent = '1 ' + state.from + ' = ' + fmtRate(ETH_PER[state.from] / ETH_PER[state.to]) + ' ' + state.to;
      balEl.textContent = '余额: 2.4650 ' + state.from;
    }
    inEl.addEventListener('input', function () {
      state.amt = parseFloat(inEl.value.replace(/[^0-9.]/g, '')) || 0;
      updateQuote();
    });
    maxB.addEventListener('click', function () {
      inEl.value = '2.465'; state.amt = 2.465; updateQuote();
    });
    function pick(side) {
      const items = ['BTC', 'ETH', 'SOL', 'USDT'].map(function (c) {
        return { v: c, label: c + ' ' + COIN[c].name, icon: badge(c, 26).outerHTML };
      });
      SW.ui.sheet({
        host: ph.screen, title: '选择币种', items: items, value: state[side],
        onPick: function (c) { state[side] = c; syncCoins(); updateQuote(); }
      });
    }
    pay.b.addEventListener('click', function () { pick('from'); });
    recv.b.addEventListener('click', function () { pick('to'); });
    let rot = 0;
    swapB.addEventListener('click', function () {
      rot += 180;
      rotWrap.style.transform = 'rotate(' + rot + 'deg)';
      const f = state.from; state.from = state.to; state.to = f;
      state.amt = state.recv;
      inEl.value = trimNum(state.recv);
      syncCoins(); updateQuote();
    });
    confirmB.addEventListener('click', function () {
      const ov = el('div', 'position:absolute;inset:0;z-index:80;border-radius:inherit;background:rgba(7,7,16,.96);display:flex;flex-direction:column;align-items:center;justify-content:center', ph.screen);
      el('div', 'position:absolute;top:50%;left:50%;width:300px;height:300px;transform:translate(-50%,-58%);border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(87,230,196,.28) 0%,rgba(0,0,0,0) 65%)', ov);
      const ok = el('div', 'width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#6BEFC9,#2FC79F);display:flex;align-items:center;justify-content:center', ov);
      ok.innerHTML = ico(P_CHECK, 40, '#07231B', 2.6);
      ok.animate([{ transform: 'scale(.4)', opacity: '0' }, { transform: 'scale(1)', opacity: '1' }], { duration: 420, easing: 'cubic-bezier(.3,1.4,.5,1)' });
      el('div', 'font-size:20px;font-weight:800;color:#fff;margin-top:20px', ov).textContent = '兑换成功';
      el('div', 'font-size:13.5px;color:rgba(255,255,255,.6);margin-top:9px', ov).textContent = fmtAmt(state.amt) + ' ' + state.from + ' → ' + fmtAmt(state.recv) + ' ' + state.to;
      const done = el('button', 'margin-top:30px;width:172px;height:46px;border:0;border-radius:999px;background:#5B5FEF;color:#fff;font-size:14px;font-weight:800;cursor:pointer', ov);
      done.textContent = '完成';
      SW.ui.press(done);
      done.addEventListener('click', function () { ov.remove(); });
      SW.audio.ok();
    });

    /* 装饰泡泡（压在「你到账」卡右侧，可点爆） */
    SW.fx.bubbles(scr, { mode: 'cluster', center: { x: 340, y: 310, r: 34 }, count: 3, minR: 8, maxR: 17, tint: '195,215,255', z: 4, interactive: true });

    syncCoins(); updateQuote();
  }, bg);
}

  }
});
})();

/* ── 小工具 ── */

/* ── b3 · 转账页 ── */
function buildB3() {
  const p = SW.phone({
    name: 'b3', num: 2, title: 'Chase 卡 · 转账',

  box.appendChild(top);

  /* 金额（键盘实时改写） */
  let raw = '50032';
  function fmt() {
    const n = parseInt(raw, 10) || 0;
    const int = ('' + Math.floor(n / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  }
  const amt = el('div', 'margin-top:18px;font-size:42px;font-weight:800;color:#fff', fmt());
  box.appendChild(amt);

  /* 卡片选择条 */
  const CARDS = {
    mc: { name: 'MasterCard', num: '3482 8384 8283 ****' },
    visa: { name: 'VISA', num: '4289 2281 5567 ****' },
    plat: { name: '白金卡', num: '5218 9900 1177 ****' }
  };
  const ICONS = { mc: mcHTML(22), visa: VISA_MINI, plat: PLAT_MINI };
  let cur = 'mc';
  const bar = el('button', 'margin-top:20px;width:342px;height:64px;border:0;border-radius:16px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:12px;padding:0 16px;cursor:pointer;color:#fff;text-align:left;position:relative');

  const nameEl = el('div', 'font-size:13px;font-weight:800;color:#fff');
  const numEl = el('div', 'margin-top:3px;font-size:11px;color:rgba(255,255,255,.5)');
  const mid = el('div', 'flex:1');
  mid.append(nameEl, numEl);
  bar.append(markBox, mid, el('span', 'display:flex;align-items:center;flex:none', IC.chev));
  function paintBar() {
    markBox.innerHTML = ICONS[cur];
    nameEl.textContent = CARDS[cur].name;
    numEl.textContent = CARDS[cur].num;
  }
  paintBar();
  SW.ui.press(bar);
  bar.addEventListener('click', () => {
    SW.ui.sheet({
      host: p.screen, title: '选择付款卡片', value: cur,
      items: [
        { v: 'mc', label: 'MasterCard ****8283', desc: '默认付款卡片', icon: mcHTML(22) },
        { v: 'visa', label: 'VISA ****4833', desc: 'Chase 蓝卡', icon: VISA_MINI },
        { v: 'plat', label: '白金卡 ****0091', desc: '尊享白金', icon: PLAT_MINI }
      ],
      onPick(v) { cur = v; paintBar(); }
    });
  });
  box.appendChild(bar);

  /* 继续 */
  const go = el('button', 'margin-top:16px;width:342px;height:52px;border:0;border-radius:14px;background:linear-gradient(90deg,#7B6CF6,#5B5FEF);color:#fff;font-size:16px;font-weight:800;letter-spacing:.06em;cursor:pointer;position:relative', '继续');
  SW.ui.press(go);
  box.appendChild(go);

  /* 成功浮层 */
  function showOk() {
    const mask = el('div', 'position:absolute;inset:0;z-index:70;background:rgba(8,6,20,.66);display:flex;align-items:center;justify-content:center');
    const cd = el('div', 'width:272px;border-radius:24px;background:linear-gradient(172deg,#26224A,#1A1734);border:1px solid rgba(255,255,255,.1);padding:30px 24px 22px;display:flex;flex-direction:column;align-items:center;text-align:center');
    cd.appendChild(el('div', 'width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#7B6CF6,#5B5FEF);display:flex;align-items:center;justify-content:center', IC.check));
    cd.appendChild(el('div', 'margin-top:18px;font-size:18px;font-weight:800;color:#fff', '转账成功'));
    cd.appendChild(el('div', 'margin-top:8px;font-size:13px;color:rgba(255,255,255,.65)', fmt() + ' → 吉尔伯特·阿里纳斯'));
    const done = el('button', 'margin-top:22px;width:100%;height:46px;border:0;border-radius:13px;background:#fff;color:#16142E;font-size:15px;font-weight:800;cursor:pointer;position:relative', '完成');
    SW.ui.press(done);
    done.addEventListener('click', () => mask.remove());
    cd.appendChild(done);
    mask.appendChild(cd);
    p.screen.appendChild(mask);
  }
  go.addEventListener('click', showOk);

  /* 数字键盘 */
  const kp = el('div', 'margin-top:18px;width:342px;color:#fff');
  SW.ui.keypad({
    el: kp, bg: 'rgba(255,255,255,.06)',
    keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(t => ({ t: t }))
      .concat([{ t: '00' }, { t: '0' }, { t: 'del', svg: IC.del }]),
    onPress(t) {
      if (t === 'del') raw = raw.length > 1 ? raw.slice(0, -1) : '0';
      else {
        if (raw === '0') raw = '';
        raw += t;
        if (raw.length > 8) raw = raw.slice(0, 8);
      }
      amt.textContent = fmt();
    }
  });
  Array.prototype.forEach.call(kp.querySelectorAll('button'), b => { b.style.height = '56px'; });
  box.appendChild(kp);
  return p;
}

/* ── 小工具 ── */
function div(css, html) { const d = document.createElement('div'); d.style.cssText = css; if (html != null) d.innerHTML = html; return d; }
function tap(el, fn) { SW.ui.press(el); el.addEventListener('click', fn); return el; }

const C = {
  hd: 'linear-gradient(168deg,#977DF7 0%,#8B6DF4 52%,#8465F2 100%)',
  panel: '#7C5BE8',
  dark: '#1A191F',
  circle: '#272333',
  purple: '#8B6FF0',
  lav: '#A78BFA',
  ink: '#14101F'
};
const NAV = [
  { label: '首页', icon: 'home' },
  { label: '卡片', icon: 'card' },
  { label: '图表', icon: 'chart' },
  { label: '其他', icon: 'photo' }
];

/* ── 底部导航（绝对定位盖在 screen 底部，紫色胶囊 active） ── */
function navBar(p, activeIdx) {
  const bar = div('position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-around;padding:8px 12px 24px;background:#0A0A0D');
  const btns = [];
  function paint(b, on) {
    b.style.background = on ? C.purple : 'transparent';
    b.style.color = on ? '#170B33' : 'rgba(255,255,255,.6)';
  }
  NAV.forEach((it, i) => {
    const b = document.createElement('button');
    b.style.cssText = 'border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 15px;border-radius:999px;transition:background .2s,color .2s';
    const box = div('width:20px;height:20px;line-height:0', ic(it.icon, 20));
    const lb = div('font-size:11px;font-weight:700', it.label);
    b.appendChild(box); b.appendChild(lb);
    b.addEventListener('click', () => {
      SW.audio.tap();
      btns.forEach(pair => paint(pair[0], pair[1] === i));
      if (i !== activeIdx) SW.toast('「' + it.label + '」为原型演示');
    });
    bar.appendChild(b); btns.push([b, i]);
  });
  btns.forEach(pair => paint(pair[0], pair[1] === activeIdx));
  p.screen.appendChild(bar);
}

/* ── 同款亮紫头部：头像行 + 资产标题（金额行由调用方追加） ── */

function amountRow(id, pill) {

/* ── 深灰横条卡：图标圆 + 两行文字 + 右侧内容 ── */
function rowCard(o) {
  const card = div('display:flex;align-items:center;gap:12px;background:' + C.dark + ';border-radius:18px;padding:14px 15px');
  card.appendChild(div('width:36px;height:36px;border-radius:50%;background:' + C.circle + ';display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;color:' + C.lav, o.icon));

  if (o.right) card.appendChild(o.right);

  return card;
}
function chevRight() { return div('color:rgba(255,255,255,.6);line-height:0', ic('chev', 18)); }
function challengeCard() {
  const c = rowCard({ icon: '🏅', title: '1P 挑战', sub: '一年存下 ¥667', right: chevRight(), onClick: () => SW.toast('「1P 挑战」为原型演示') });

/* ════ c2 · Plum 储蓄页 ════ */
function buildC2(p) {
  let pocket = 20.55, total = 142.83;
  const money = n => '$' + n.toFixed(2);

  const page = div('padding-bottom:118px');
  p.scroll.appendChild(page);

  const hd = purpleHeader('Plum');
  page.appendChild(hd);
  hd.appendChild(amountRow('sC-c2-total', '$0 可用'));
  const totalEl = hd.querySelector('#sC-c2-total');

  /* 零钱袋横条卡（余额可被存取改变） */
  const pkVal = div('font-size:16px;font-weight:800;color:#fff', money(pocket));
  pkVal.id = 'sC-c2-pocket';
  const pk = rowCard({ icon: '💰', title: '零钱袋', sub: '随存随取', right: pkVal });
  pk.style.margin = '14px 10px 0';
  page.appendChild(pk);

  /* 4 宫格操作 */
  function openSheet(title, dir) {
    SW.ui.sheet({
      host: p.screen, title: title,
      items: [{ v: 10, label: '¥10' }, { v: 50, label: '¥50' }, { v: 100, label: '¥100' }, { v: 200, label: '¥200' }],
      onPick(v) {
        if (dir < 0 && v > pocket) { SW.toast('超出零钱袋可用余额'); return; }
        pocket += dir * v; total += dir * v;
        pkVal.textContent = money(pocket);
        totalEl.textContent = money(total);
        SW.audio.pop();
        SW.toast((dir > 0 ? '已存入 ¥' : '已从零钱袋取出 ¥') + v + '（演示）');
      }
    });
  }
  function tile(iconHtml, label, onClick, color) {
    const t = document.createElement('button');
    t.style.cssText = 'border:0;cursor:pointer;background:' + C.dark + ';border-radius:18px;padding:16px 0 13px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff';
    t.appendChild(div('line-height:0;color:' + (color || '#fff'), iconHtml));
    t.appendChild(div('font-size:12px;font-weight:600', label));
    tap(t, onClick);
    return t;
  }
  const grid = div('display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 10px 0');
  grid.appendChild(tile(ic('plus', 22), '存入', () => openSheet('存入零钱袋', 1)));
  grid.appendChild(tile(ic('minus', 22), '取出', () => openSheet('从零钱袋取出', -1)));
  grid.appendChild(tile(ic('flame', 22), 'Brain', () => SW.toast('「Brain」为原型演示'), C.lav));
  grid.appendChild(tile(ic('ban', 22), '分流', () => SW.toast('「分流」为原型演示'), C.lav));
  page.appendChild(grid);

  /* 两列卡：紫卡 现金 ISA + 白卡 Plum 利息 */
  const two = div('display:flex;gap:10px;margin:14px 10px 0');
  const isa = div('flex:1;position:relative;border-radius:22px;padding:14px;background:linear-gradient(165deg,#977DF7,#8157EE);color:#fff;overflow:hidden');
  isa.appendChild(div('position:absolute;top:10px;right:10px;background:#fff;color:#7C52E8;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px', 'New'));
  isa.appendChild(div('line-height:0;color:#fff', ic('flame', 20)));
  isa.appendChild(div('margin-top:10px;font-size:14px;font-weight:700', '现金 ISA'));
  isa.appendChild(div('margin-top:2px;font-size:26px;font-weight:800;letter-spacing:-.4px', '5.17% AER'));
  isa.appendChild(div('margin-top:2px;font-size:11px;color:rgba(255,255,255,.75)', '免税储蓄'));
  two.appendChild(isa);
  const int = div('flex:1;background:#fff;border-radius:22px;padding:14px');
  int.appendChild(div('line-height:0;color:' + C.ink, ic('flame', 20)));
  int.appendChild(div('margin-top:10px;font-size:14px;font-weight:700;color:' + C.ink, 'Plum 利息'));
  int.appendChild(div('margin-top:2px;font-size:26px;font-weight:800;color:#0F0C18;letter-spacing:-.4px', '8.11%'));
  int.appendChild(div('margin-top:2px;font-size:11px;color:#8B8798', '浮动年利率'));
  two.appendChild(int);
  page.appendChild(two);

  /* 开始使用 + 挑战卡 */
  page.appendChild(div('margin:16px 12px 0;font-size:13px;font-weight:800;color:#fff', '开始使用'));
  const ch = challengeCard();
  ch.style.margin = '8px 10px 0';
  page.appendChild(ch);

  navBar(p, 1);
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function el(tag, css, html) { const n = document.createElement(tag); if (css) n.style.cssText = css; if (html != null) n.innerHTML = html; return n; }
function btn(css, html) {
  const b = el('button', 'appearance:none;border:0;cursor:pointer;background:transparent;color:inherit;font-family:inherit;font-size:inherit;padding:0;margin:0;' + (css || ''), html);
  return SW.ui.press(b);
}
function iconBtn(css, svg, msg) {
  const b = btn('display:flex;align-items:center;justify-content:center;' + (css || ''), svg);
  if (msg) b.addEventListener('click', () => SW.toast(msg));
  return b;
}
/* 白色峰顶标注点（绕开 charts.line dot 动画的负半径 bug，视觉等效） */
function peakDot(host, data, i, w, h, r) {
  let lo = Infinity, hi = -Infinity;
  data.forEach(v => { if (v < lo) lo = v; if (v > hi) hi = v; });
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const px = 4 + i * (w - 8) / (data.length - 1);
  const py = 6 + (1 - (data[i] - lo) / (hi - lo)) * (h - 12);
  host.style.position = 'relative';
  host.appendChild(el('span', 'position:absolute;width:' + (r * 2) + 'px;height:' + (r * 2) + 'px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.28),0 0 12px rgba(233,226,255,.9);left:' + (px - r) + 'px;top:' + (py - r) + 'px;pointer-events:none'));
}

/* ── 底部导航（fixed=绝对悬浮于 screen；否则随文档流） ── */
function navBar(fixed, activeIdx) {
  const bar = el('div', 'display:flex;align-items:center;justify-content:space-between;padding:10px 24px 32px');
  if (fixed) {
    bar.style.cssText += ';position:absolute;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg,rgba(18,13,28,0) 0%,#120D1C 42%)';
  }
  const ITEMS = [
    { icon: 'home', label: '首页' },
    { icon: 'card', label: '卡片' },
    { icon: 'swap', label: '收付款', center: true },
    { icon: 'grid', label: '格点' },
    { icon: 'pie', label: '统计' }
  ];
  const btns = [];
  function paint(b, on) {
    b.style.background = on ? 'rgba(169,154,232,.16)' : 'transparent';
    b.style.color = on ? '#B7A7EE' : 'rgba(255,255,255,.42)';
  }
  ITEMS.forEach((it, i) => {
    if (it.center) {
      const holder = el('div', 'flex:none;transform:translateY(-16px)');
      const c = btn('width:58px;height:58px;border-radius:19px;background:linear-gradient(150deg,#BBACEF,#8E7BD8);display:flex;align-items:center;justify-content:center;color:' + C.ink + ';box-shadow:0 12px 26px rgba(120,95,220,.45)', ic('swap', 26, ' stroke-width="2"'));
      c.addEventListener('click', () => demo('收付款'));
      holder.appendChild(c); bar.appendChild(holder); btns.push(null);
      return;
    }
    const b = btn('width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s', ic(it.icon, 23));
    b.addEventListener('click', () => {
      btns.forEach(x => { if (x) paint(x[0], x[1] === i); });
      if (i !== activeIdx) demo(it.label);
    });
    bar.appendChild(b); btns.push([b, i]);
  });
  btns.forEach(x => { if (x) paint(x[0], x[1] === activeIdx); });
  return bar;
}

function gridSvg(s, color) {
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="' + color + '">' +
    '<rect x="3.5" y="3.5" width="7.6" height="7.6" rx="2.2"/><rect x="12.9" y="3.5" width="7.6" height="7.6" rx="2.2"/>' +

}

/* ── 金额格式：数字串 → $1,500.00 ── */
function moneyFromDigits(d) {
  let s = d || '0';
  while (s.length < 3) s = '0' + s;
  const intPart = Number(s.slice(0, -2).replace(/^0+(?=\d)/, '')).toLocaleString('en-US');
  return '$' + intPart + '.' + s.slice(-2);
}

/* ── 玻璃小圆钮 ── */
function circleBtn(parent, html, size) {
  const b = el('button', 'width:' + (size || 38) + 'px;height:' + (size || 38) + 'px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:#fff', parent);
  b.innerHTML = html;
  SW.ui.press(b);

}

/* ══ g1 转账页 ══ */
function buildG1(ph) {

  el('div', 'font-size:11px;font-weight:600;color:rgba(255,255,255,.5)', panel).textContent = '转账金额';
  const amtRow = el('div', 'display:flex;align-items:center;gap:10px;margin-top:8px', panel);
  const amtEl = el('div', 'font-size:30px;font-weight:800;color:#fff;letter-spacing:.01em', amtRow);
  amtEl.id = 'sG1-amt';
  const curBtn = el('button', 'margin-left:auto;flex:none;display:flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer', amtRow);
  const curTxt = el('span', '', curBtn);
  curTxt.textContent = 'USD';
  curBtn.insertAdjacentHTML('beforeend', ico(P_DOWN, 12, 'rgba(255,255,255,.8)', 2));
  SW.ui.press(curBtn);
  curBtn.addEventListener('click', function () {
    SW.ui.sheet({
      host: ph.screen, title: '选择币种', value: curTxt.textContent,
      items: [{ v: 'USD', label: 'USD 美元' }, { v: 'USDC', label: 'USDC' }, { v: 'EUR', label: '欧元 EUR' }],
      onPick: function (v) { curTxt.textContent = v; }
    });
  });
  const limRow = el('div', 'display:flex;align-items:center;margin-top:18px', panel);
  el('span', 'font-size:11px;color:rgba(255,255,255,.45)', limRow).textContent = '转账限额';
  const limEl = el('span', 'margin-left:auto;font-size:11px;font-weight:600;color:rgba(255,255,255,.8)', limRow);
  limEl.id = 'sG1-limit';
  limEl.textContent = '$10,000.00';
  const slideWrap = el('div', 'margin-top:2px', panel);
  slideWrap.id = 'sG1-slider';

  /* 键盘输入状态（追加、9 位截断） */
  let digits = '150000';
  function paintAmt() { amtEl.textContent = moneyFromDigits(digits); }
  paintAmt();
  SW.ui.slider(slideWrap, {
    min: 0, max: 10000, value: 3000, color: '#C4B5F8',
    onChange: function (v) {
      const n = Math.round(v);
      limEl.textContent = '$' + n.toLocaleString('en-US') + '.00';
      digits = String(n * 100);
      paintAmt();
    }
  });

  /* 快速发送 */
  const qsRow = el('div', 'display:flex;align-items:center;margin:20px 25px 0', scr);
  el('div', 'font-size:12px;font-weight:700;color:#fff', qsRow).textContent = '快速发送';
  const qsMore = el('button', 'margin-left:auto;border:0;background:transparent;color:rgba(255,255,255,.5);font-size:11px;font-weight:600;cursor:pointer;padding:2px 0', qsRow);
  qsMore.textContent = '查看全部 ›';
  SW.ui.press(qsMore);
  qsMore.addEventListener('click', function () { SW.toast('「查看全部」为原型演示'); });
  const avs = el('div', 'display:flex;gap:14px;margin:14px 25px 0', scr);
  for (let i = 0; i < 5; i++) {
    const solid = i === 0;
    const a = el('button', 'width:44px;height:44px;border-radius:50%;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:' +
      (solid ? '#C4B5F8' : 'transparent') +
      (solid ? '' : ';border:1.6px dashed rgba(255,255,255,.35)'), avs);
    a.innerHTML = ico(P_PLUS, solid ? 20 : 18, solid ? '#fff' : 'rgba(255,255,255,.75)', 2);
    SW.ui.press(a);
    a.addEventListener('click', function () { SW.toast('添加常用收款人（演示）'); });
  }

  /* 数字键盘：1-9 / ↺ 0 ✕ */
  const padWrap = el('div', 'margin:18px 25px 0;color:#fff', scr);
  padWrap.id = 'sG1-pad';
  SW.ui.keypad({
    el: padWrap,
    bg: '#1C1926',
    keys: [
      { t: '1' }, { t: '2' }, { t: '3' },
      { t: '4' }, { t: '5' }, { t: '6' },
      { t: '7' }, { t: '8' }, { t: '9' },
      { t: 'reset', svg: ico(P_RESET, 22, 'rgba(255,255,255,.9)', 1.8) },
      { t: '0' },
      { t: 'del', svg: ico(P_DEL, 24, 'rgba(255,255,255,.9)', 1.7) }
    ],
    onPress: function (t) {
      if (t === 'reset') digits = '';
      else if (t === 'del') digits = digits.slice(0, -1);
      else { if (digits.length >= 9) return; digits += t; }
      paintAmt();
    }
  });
  padWrap.querySelectorAll('button').forEach(function (b) { b.style.padding = '15px 0'; b.style.fontSize = '20px'; });
  el('div', 'height:96px', scr);

  /* 长按发送（900ms 进度填充 → 成功浮层） */
  const hold = el('button', 'position:absolute;left:0;right:0;bottom:0;z-index:30;height:64px;border:0;border-radius:26px 26px 0 0;background:#C4B5F8;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none', ph.screen);
  hold.id = 'sG1-hold';
  const fill = el('span', 'position:absolute;left:0;top:0;bottom:0;width:0;border-radius:26px 26px 0 0;background:linear-gradient(90deg,#A78BFA,#8B7CF6)', hold);
  fill.id = 'sG1-fill';
  const lab = el('span', 'position:relative;z-index:1;font-size:16px;font-weight:700;letter-spacing:.06em;color:#241D3A', hold);
  lab.textContent = '长按发送';
  SW.ui.press(hold);
  let holdTimer = 0, armed = false, done = false;
  function showSuccess() {
    done = true; armed = false;
    fill.style.transition = 'none'; fill.style.width = '0%';
    const ov = el('div', 'position:absolute;inset:0;z-index:80;background:rgba(10,8,18,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:inherit', ph.screen);
    ov.id = 'sG1-ok';
    const ok = el('div', 'width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,#C4B5F8,#8B7CF6);display:flex;align-items:center;justify-content:center', ov);
    ok.innerHTML = ico(P_CHECK, 38, '#221B3C', 2.6);
    ok.animate([{ transform: 'scale(.4)', opacity: '0' }, { transform: 'scale(1)', opacity: '1' }], { duration: 420, easing: 'cubic-bezier(.3,1.4,.5,1)' });
    el('div', 'font-size:20px;font-weight:800;color:#fff;margin-top:20px', ov).textContent = '转账成功';
    el('div', 'font-size:13.5px;color:rgba(255,255,255,.6);margin-top:8px', ov).textContent = '已转出 ' + moneyFromDigits(digits) + ' ' + curTxt.textContent;
    const dn = el('button', 'margin-top:28px;width:168px;height:46px;border:0;border-radius:999px;background:#C4B5F8;color:#241D3A;font-size:14px;font-weight:800;cursor:pointer', ov);
    dn.textContent = '完成';
    SW.ui.press(dn);
    dn.addEventListener('click', function () { ov.remove(); done = false; });
    SW.audio.ok();
  }
  hold.addEventListener('pointerdown', function (e) {
    if (done) return;
    e.preventDefault();
    armed = true;
    try { hold.setPointerCapture(e.pointerId); } catch (_) {}
    fill.style.transition = 'width .9s linear';
    fill.style.width = '100%';
    holdTimer = setTimeout(showSuccess, 900);
  });
  function abort() {
    if (!armed || done) return;
    armed = false;
    clearTimeout(holdTimer);
    fill.style.transition = 'width .16s ease';
    fill.style.width = '0%';
    SW.toast('再按住一会儿哦');
  }
  hold.addEventListener('pointerup', abort);
  hold.addEventListener('pointercancel', abort);
  hold.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}
