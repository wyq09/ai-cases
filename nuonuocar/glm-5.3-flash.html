<!doctype html>
<html lang="zh-CN">
<head>

<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:#7583c2;
    font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
    touch-action:none;overscroll-behavior:none}
  #stage{position:absolute;inset:0;margin:0 auto;width:100%;max-width:480px;overflow:hidden;background:#aab6ec;
    box-shadow:0 0 44px rgba(20,30,70,.4)}
  #cv{position:absolute;inset:0;display:block;touch-action:none}
  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;z-index:5}
  #btnPause{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;width:46px;height:46px;
    border-radius:50%;border:3px solid rgba(255,255,255,.9);cursor:pointer;pointer-events:auto;
    background:radial-gradient(120% 120% at 30% 22%,#8db8ff 0%,#4a80ea 55%,#2f5ecb 100%);
    box-shadow:0 4px 0 #24499c,0 6px 12px rgba(20,40,110,.4);
    display:flex;align-items:center;justify-content:center}
  #btnPause:active{transform:translateY(2px);box-shadow:0 2px 0 #24499c}
  #lvlPill{position:absolute;top:calc(15px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    background:linear-gradient(180deg,#3c4570,#262d52);color:#fff;font-size:16px;font-weight:800;letter-spacing:1px;
    padding:8px 24px;border-radius:22px;border:2px solid rgba(255,255,255,.25);white-space:nowrap;
    box-shadow:0 4px 10px rgba(20,25,60,.35)}
  #lvlPill .hard{color:#ffd75e}
  #queueSign{position:absolute;top:calc(66px + env(safe-area-inset-top));left:14px;text-align:center;min-width:88px;
    filter:drop-shadow(0 4px 6px rgba(20,40,100,.35));display:flex;flex-direction:column;align-items:center;gap:3px}
  #queueBoard{background:linear-gradient(180deg,#4a83ec,#2b56c8);border:2.5px solid #fff;border-radius:12px 12px 8px 8px;
    padding:3px 14px 4px;box-shadow:inset 0 -4px 0 rgba(10,30,90,.35)}
  #queueNum{color:#fff;font-size:25px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;

  #queueLbl{display:inline-block;background:#ffd23e;color:#7a4c00;font-size:11px;font-weight:900;letter-spacing:2px;

  #coinBox{position:absolute;top:calc(15px + env(safe-area-inset-top));right:12px;display:flex;align-items:center;gap:6px;
    background:linear-gradient(180deg,#3c4570,#262d52);border:2px solid rgba(255,255,255,.25);border-radius:20px;

  #coinBox svg{width:22px;height:22px}

  /* ---------- 道具栏 ---------- */
  #props{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:9px;

  .prop{position:relative;width:62px;height:66px;border:none;border-radius:16px;cursor:pointer;
    background:linear-gradient(180deg,#ffdf74 0%,#fccb3f 55%,#f0b32a 100%);

  .prop:active{transform:translateY(2px);border-bottom-width:2px}
  .prop svg{width:26px;height:26px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.5))}
  .prop .nm{font-size:11px;font-weight:900;color:#6b4600;letter-spacing:1px}
  .prop .bd{position:absolute;top:-8px;left:50%;transform:translateX(-50%);min-width:24px;height:21px;border-radius:11px;
    padding:0 6px;background:#fff;border:2px solid #39c15e;color:#1d8a3c;font-size:12px;font-weight:900;
    display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
    box-shadow:0 2px 5px rgba(0,0,0,.22)}
  .prop .bd.price{border-color:#f2784b;color:#d24a1e}
  .prop.off{filter:grayscale(.78) brightness(.86)}
  .prop.act{outline:3px solid #fff;animation:pulse .8s infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
  /* ---------- 提示 / 横幅 ---------- */
  #toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;
    background:rgba(28,32,58,.9);color:#fff;font-size:15px;font-weight:700;padding:11px 22px;
    border-radius:24px;opacity:0;transition:opacity .25s;max-width:84%;text-align:center;
    box-shadow:0 6px 18px rgba(10,15,40,.4)}
  #banner{position:absolute;left:0;right:0;top:33%;z-index:8;pointer-events:none;text-align:center;
    font-size:44px;font-weight:900;color:#ffdf6b;-webkit-text-stroke:2px #7a4c00;

  #banner.show{animation:ban 1.5s ease forwards}
  @keyframes ban{0%{opacity:0;transform:scale(.5)}18%{opacity:1;transform:scale(1.12)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(-14px)}}
  /* ---------- 弹窗 ---------- */
  #mask{position:absolute;inset:0;background:rgba(15,20,45,.55);z-index:10;display:none;

  #modal{background:linear-gradient(180deg,#ffffff,#f2f5fd);border-radius:24px;padding:24px 20px calc(20px + env(safe-area-inset-bottom));

  @keyframes mup{from{transform:translateY(24px) scale(.94);opacity:0}to{transform:none;opacity:1}}
  #modal h2{font-size:22px;color:#223;margin-bottom:10px}
  #modal .txt{font-size:14px;color:#556;line-height:1.75;margin-bottom:14px;white-space:pre-line}

  .btnrow{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .btn{border:none;border-radius:15px;padding:13px 10px;font-size:16px;font-weight:900;cursor:pointer;letter-spacing:1px}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:linear-gradient(180deg,#6aa6ff,#3b74e8);color:#fff;box-shadow:0 4px 0 #2b56b8}
  .btn.sec{background:#eef1f8;color:#445;box-shadow:0 4px 0 #c9cfdd}
  .btn.warn{background:linear-gradient(180deg,#ffb45e,#f68e2e);color:#fff;box-shadow:0 4px 0 #c96a12}

<body>
<div id="stage">
<canvas id="cv"></canvas>

<div id="hud">
  <button id="btnPause" aria-label="暂停">
    <svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="4" width="4" height="16" rx="2" fill="#fff"/><rect x="14" y="4" width="4" height="16" rx="2" fill="#fff"/></svg>
  </button>
  <div id="lvlPill">第 1 关</div>
  <div id="queueSign">
    <div id="queueBoard"><div id="queueNum">0</div></div>
    <span id="queueLbl">排队人数</span>
  </div>
  <div id="coinBox">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f6b93d" stroke="#c98a1e" stroke-width="2"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="#ffe08a" stroke-width="2.4"/></svg>
    <span id="coinNum">0</span>
  </div>
</div>

<div id="toast"></div>
<div id="banner"></div>

<div id="props"></div>

<div id="mask"><div id="modal"></div></div>

<script>
'use strict';
/* =====================================================================
   挪挪车 · 无限关卡版  (glm-5.3-flash)  v2 立体视觉版
   2.5D 挤出车身 + 倾斜停车场 + 完整「驶入-停车-上客-载客离场」动画链
   ===================================================================== */

/* ---------------- 基础工具 ---------------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const easeOut=t=>1-Math.pow(1-t,3);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seedOf(n){let x=(n*2654435761)>>>0;x^=x>>>13;x=(x*1274126177)>>>0;return (x^(x>>>16))>>>0;}
function shuffleArr(arr,rng){for(let i=arr.length-1;i>0;i--){const j=(rng()*(i+1))|0;[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function angLerp(a,b,t){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return a+d*clamp(t,0,1);}

/* ---------------- 调试探针 ---------------- */
window.__errs=[];window.__win=false;window.__state={};
window.addEventListener('error',e=>__errs.push('err:'+(e.message||e)));
window.addEventListener('unhandledrejection',e=>__errs.push('rej:'+(e.reason||'')));
const _ce=console.error.bind(console);console.error=(...a)=>{__errs.push('ce:'+a.join(' '));_ce(...a);};

/* ---------------- 音效 ---------------- */
const SFX=(()=>{let ac=null;
  function ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return ac;}
  function env(g,t0,a,d,v){g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(0.001,t0+a+d);}
  function tone(f0,f1,dur,type,vol,when){const c=ctx();if(!c||!save.sound)return;const t0=c.currentTime+(when||0);
    const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';
    o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
    env(g,t0,0.008,dur,vol||0.15);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+dur+0.1);}
  function noise(dur,vol,fc){const c=ctx();if(!c||!save.sound)return;const t0=c.currentTime;
    const n=c.createBufferSource(),buf=c.createBuffer(1,Math.max(1,c.sampleRate*dur|0),c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=buf;
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||900;
    const g=c.createGain();env(g,t0,0.01,dur,vol||0.12);n.connect(f).connect(g).connect(c.destination);n.start(t0);}
  let lastEng=0;
  return {
    unlock(){const c=ctx();if(c&&c.state==='suspended')c.resume();},
    click(){tone(760,0,0.05,'triangle',0.10);},
    engine(){const now=performance.now();if(now-lastEng<120)return;lastEng=now;noise(0.28,0.10,520);tone(90,150,0.28,'sawtooth',0.05);},
    bump(){noise(0.09,0.16,300);tone(95,55,0.12,'sine',0.20);},
    park(){tone(520,780,0.10,'triangle',0.14);tone(780,1040,0.12,'triangle',0.12,0.09);},
    seat(){tone(880,1180,0.06,'sine',0.07);},
    leave(){noise(0.35,0.09,700);tone(180,90,0.3,'sawtooth',0.05);},
    coin(){tone(1046,0,0.07,'square',0.09);tone(1568,0,0.12,'square',0.09,0.07);},
    win(){[523,659,784,1046].forEach((f,i)=>tone(f,0,0.16,'triangle',0.14,i*0.11));},
    dead(){tone(300,150,0.35,'sawtooth',0.10);},
  };
})();

/* ---------------- 存档 ---------------- */
const SAVE_KEY='nnChe_glm_v1';
const DEF_SAVE={lv:1,coins:200,props:{hint:3,undo:3,flip:2,remove:1,shuffle:1},stars:{},slots:4,sound:true,seen:false};
let save;
try{save=Object.assign({},DEF_SAVE,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'));
    save.props=Object.assign({},DEF_SAVE.props,save.props);}catch(e){save=JSON.parse(JSON.stringify(DEF_SAVE));}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ---------------- 关卡参数 ---------------- */
function levelParams(n){
  const cols=Math.min(6+Math.floor(n/4),9);
  const rows=Math.min(7+Math.floor(n/3),12);
  const hard=n%10===0;
  let density=Math.min(0.36+n*0.025,0.55)+(hard?0.04:0);
  density=Math.min(density,0.58);
  const cells=cols*rows;
  const nVeh=clamp(Math.round(cells*density/2.4),5,34);
  const busRatio=Math.min(0.15+n*0.02,0.5);
  const obstacles=n<4?0:Math.min(Math.floor((n-2)/3),6);
  const colorCount=n===1?4:5;
  return {cols,rows,nVeh,busRatio,obstacles,colorCount,hard};
}

/* ---------------- 颜色 / 容量 ---------------- */
const COLORS=[
  {body:'#f4b91c',dark:'#b97f08',mid:'#dda41a',light:'#ffd970'},
  {body:'#4d9de8',dark:'#26619f',mid:'#3a80c8',light:'#9ecdf5'},
  {body:'#e8564f',dark:'#9c2e2e',mid:'#c84440',light:'#f79a95'},
  {body:'#54b566',dark:'#2f7440',mid:'#3f9752',light:'#98dba3'},
  {body:'#c06bd9',dark:'#74349a',mid:'#a352ba',light:'#e0a8ef'},
];
const capOf=len=>len===3?8:4;

/* ---------------- 关卡生成（逆推构造，保证有解） ---------------- */
function generateLevel(n){
  const P=levelParams(n);
  for(let att=0;att<30;att++){
    const rng=mulberry32(seedOf(n)^(att*7919+13));
    const res=tryGen(n,P,rng);
    if(res)return res;
  }
  const rng=mulberry32(seedOf(n)^999);
  return tryGen(n,Object.assign({},P,{nVeh:Math.max(5,Math.floor(P.nVeh*0.6)),obstacles:0}),rng);
}
function tryGen(n,P,rng){
  const {cols,rows}=P;
  const occ=Array.from({length:rows},()=>new Array(cols).fill(null));
  const inB=(x,y)=>x>=0&&x<cols&&y>=0&&y<rows;
  const obstacles=[];
  for(let i=0;i<P.obstacles;i++){
    for(let t=0;t<40;t++){
      const x=1+((rng()*(cols-2))|0),y=1+((rng()*(rows-2))|0);
      if(!inB(x,y)||occ[y][x])continue;
      let near=false;for(const o of obstacles)if(Math.abs(o.x-x)+Math.abs(o.y-y)<2)near=true;
      if(near)continue;
      occ[y][x]='o';obstacles.push({x,y});break;
    }
  }
  const vehicles=[];
  for(let i=0;i<P.nVeh;i++){
    vehicles.push({id:i,color:i%P.colorCount,len:rng()<P.busRatio?3:2,
      orient:rng()<0.5?'h':'v',dir:rng()<0.5?1:-1,x:0,y:0});
  }
  const order=shuffleArr(vehicles.slice(),rng);
  const cx=(cols-1)/2,cy=(rows-1)/2;
  for(const v of order){
    const cands=[];
    const Lv=v.len;
    const xs=v.orient==='h'?cols-Lv+1:cols;
    const ys=v.orient==='h'?rows:rows-Lv+1;
    if(xs<=0||ys<=0)return null;
    for(let y=0;y<ys;y++)for(let x=0;x<xs;x++){
      let ok=true;
      for(let k=0;k<Lv;k++){
        const px=v.orient==='h'?x+k:x,py=v.orient==='h'?y:y+k;
        if(occ[py][px]){ok=false;break;}
      }
      if(!ok)continue;
      const axis=v.orient==='h'?'x':'y';
      const head=v.dir>0?(axis==='x'?x+Lv-1:y+Lv-1):(axis==='x'?x:y);
      let c=head+v.dir,clear=true;
      while(axis==='x'?(c>=0&&c<cols):(c>=0&&c<rows)){
        const px=axis==='x'?c:x,py=axis==='x'?y:c;
        if(occ[py][px]){clear=false;break;}
        c+=v.dir;
      }
      if(!clear)continue;
      const ccx=axis==='x'?x+(Lv-1)/2:x,ccy=axis==='x'?y:y+(Lv-1)/2;
      const score=dist(ccx,ccy,cx,cy)+rng()*2.2;
      cands.push({x,y,score});
    }
    if(!cands.length)return null;
    cands.sort((a,b)=>a.score-b.score);
    v.x=cands[0].x;v.y=cands[0].y;
    for(let k=0;k<Lv;k++){
      const px=v.orient==='h'?v.x+k:v.x,py=v.orient==='h'?v.y:v.y+k;
      occ[py][px]=v;
    }
  }
  return {n,params:P,obstacles,vehicles,par:vehicles.length};
}

/* ---------------- 布局几何（含停车场倾角） ---------------- */
const ROT=-0.07;                     // 整个停车场的透视倾角
const COSR=Math.cos(ROT),SINR=Math.sin(ROT);
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const L={};
let propsH=104;
let boardRect={x:0,y:0,w:0,h:0};
function computeLayout(){
  const stage=document.getElementById('stage');
  W=stage.clientWidth;H=stage.clientHeight;
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  const bar=document.getElementById('props');
  propsH=(bar?bar.offsetHeight:96)+14;
  L.stationH=H*0.075;
  L.queueZone=clamp(H*0.12,78,126);
  L.roadH=clamp(H*0.062,42,56);
  L.boardBot=H-propsH;
  L.queuePts=[];
  const qTop=L.stationH+12,qBot=L.stationH+L.queueZone-16;
  const vertX=W*0.86;
  for(let i=0;i<90;i++){
    const d=i*13.5;
    const vertLen=qBot-qTop;
    if(d<vertLen)L.queuePts.push({x:vertX,y:qBot-d});
    else L.queuePts.push({x:clamp(vertX-(d-vertLen),W*0.34,vertX),y:qBot});
  }
  L.dots=[];
  const drng=mulberry32(20260905);
  for(let i=0;i<26;i++)L.dots.push({x:drng()*W,y:L.stationH+drng()*(H-L.stationH-propsH-40),r:3+drng()*7});
  if(G.level)layoutBoard();
}
function layoutBoard(){
  const {cols,rows}=G.level.params;
  const zone=L.boardBot-(L.stationH+L.queueZone)-L.roadH-18;
  const cA=Math.abs(Math.cos(ROT)),sA=Math.abs(Math.sin(ROT));
  let cell=Math.min((W-26)/cols,54,zone/(rows+3.2));
  cell=Math.min(cell,(W-26)/(cols*cA+rows*sA),zone/((cols+rows)*sA+rows*cA+3.2));
  cell=Math.max(cell,20);
  L.cell=cell;
  L.slotH=3*cell+14;
  L.slotW=Math.min(L.slotH*0.66,(W-20-5*6)/6,64);
  L.slotStep=L.slotW+6;
  const totW=6*L.slotW+5*6;
  L.slotX0=(W-totW)/2;
  L.slotRowY=L.stationH+L.queueZone+L.slotH/2+8;
  L.roadY=L.slotRowY+L.slotH/2*Math.cos(ROT)+L.slotH*0.28+5;
  L.roadMid=L.roadY+L.roadH*0.55;
  L.boardTop=L.roadY+L.roadH+6;
  boardRect={x:0,y:L.boardTop,w:W,h:L.boardBot-L.boardTop};
  L.bx=boardRect.x+(boardRect.w-cell*cols)/2;
  L.by=boardRect.y+(boardRect.h-cell*rows)/2;
  L.cx=L.bx+cols*cell/2;L.cy=L.by+rows*cell/2;
  repositionBoardEnts();
  bgDirty=true;
}
function gridToWorld(x,y){ // 网格中心 → 倾斜后的世界坐标
  const u=L.bx+(x+0.5)*L.cell,v=L.by+(y+0.5)*L.cell;
  const dx=u-L.cx,dy=v-L.cy;
  return {px:L.cx+dx*COSR-dy*SINR,py:L.cy+dx*SINR+dy*COSR};
}
function worldToGrid(px,py){
  const dx=px-L.cx,dy=py-L.cy;
  const u=L.cx+dx*COSR+dy*SINR,v=L.cy-dx*SINR+dy*COSR;
  return {gx:Math.floor((u-L.bx)/L.cell),gy:Math.floor((v-L.by)/L.cell)};
}
function repositionBoardEnts(){
  for(const v of G.vehicles){
    if(v.state!=='idle'&&v.state!=='sliding')continue;
    const p=gridToWorld(v.orient==='h'?v.x+(v.len-1)/2:v.x,v.orient==='h'?v.y:v.y+(v.len-1)/2);
    v.px=p.px;v.py=p.py;v.ang=angOf(v)+ROT;
  }
  for(const o of G.obstacles){const p=gridToWorld(o.x,o.y);o.px=p.px;o.py=p.py;}
}

/* ---------------- 游戏状态 ---------------- */
const G={
  level:null,vehicles:[],persons:[],obstacles:[],
  served:0,total:0,moves:0,propsUsed:0,
  snapStack:[],hintVid:-1,hintUntil:0,
  selectMode:null,
  deadlockShown:false,winShown:false,started:false,
  n:1,fx:[],t:0,
};
function occupancy(){
  const {cols,rows}=G.level.params;
  const g=Array.from({length:rows},()=>new Array(cols).fill(null));
  for(const v of G.vehicles){
    if(v.state!=='idle'&&v.state!=='sliding')continue;
    for(let k=0;k<v.len;k++){
      const px=v.orient==='h'?v.x+k:v.x,py=v.orient==='h'?v.y:v.y+k;
      if(py>=0&&py<g.length&&px>=0&&px<g[0].length)g[py][px]=v;
    }
  }
  for(const o of G.obstacles)if(o.y<g.length&&o.x<g[0].length)g[o.y][o.x]='o';
  return g;
}
function cellsHead(v){
  const {cols,rows}=G.level.params;
  const axis=v.orient==='h'?'x':'y';
  const head=v.dir>0?(axis==='x'?v.x+v.len-1:v.y+v.len-1):(axis==='x'?v.x:v.y);
  const lim=v.dir>0?(axis==='x'?cols-1:rows-1):0;
  const g=occupancy();
  let c=head+v.dir,k=0;
  while(axis==='x'?(c>=0&&c<cols):(c>=0&&c<rows)){
    const occCell=axis==='x'?g[v.y][c]:g[c][v.x];
    if(occCell)break;
    k++;c+=v.dir;
  }
  const toEdge=Math.abs(lim-head);
  return {k,exitable:k===toEdge};
}
function vehAt(px,py){
  const {cols,rows}=G.level.params;
  const w=worldToGrid(px,py);
  if(w.gx<0||w.gy<0||w.gx>=cols||w.gy>=rows)return null;
  const v=occupancy()[w.gy][w.gx];
  return (v&&v!=='o'&&v.state==='idle')?v:null;
}

/* ---------------- 开关一关 ---------------- */
function startLevel(n){
  G.n=n;G.level=generateLevel(n);
  G.obstacles=G.level.obstacles.map(o=>Object.assign({},o));
  G.moves=0;G.propsUsed=0;G.served=0;G.total=0;
  G.snapStack=[];G.hintVid=-1;G.selectMode=null;
  G.deadlockShown=false;G.winShown=false;G.fx=[];
  G.vehicles=G.level.vehicles.map(v=>Object.assign({},v,{
    state:'idle',slot:-1,waitIdx:-1,boarded:0,boardTimer:0,toWait:false,
    px:0,py:0,ang:0,path:null,pi:0,pd:0,curSpd:0,
    animFrom:null,animT:0,animDur:0,slideTo:null,
    bump:0,dip:0,shake:0}));
  layoutBoard();
  for(const v of G.vehicles){
    const p=gridToWorld(v.orient==='h'?v.x+(v.len-1)/2:v.x,v.orient==='h'?v.y:v.y+(v.len-1)/2);
    v.px=p.px;v.py=p.py;v.ang=angOf(v)+ROT;
  }
  for(const o of G.obstacles){const p=gridToWorld(o.x,o.y);o.px=p.px;o.py=p.py;}
  G.persons=[];let pid=0;
  const rng=mulberry32(seedOf(n)^777);
  for(const v of G.vehicles)for(let s=0;s<capOf(v.len);s++)
    G.persons.push({id:pid++,ci:v.color,state:'queued',jx:(rng()-0.5)*4,jy:(rng()-0.5)*4,
      fx:0,fy:0,hx:0,hy:0,sx:0,sy:0,t:0,dur:1,tvid:-1,seat:0});
  shuffleArr(G.persons,rng);
  clusterColors(G.persons,rng);
  G.total=G.persons.length;
  save.cur=n;persist();
  updateHud();
  banner('第 '+n+' 关'+(G.level.params.hard?' · 困难':''));
}
function clusterColors(arr,rng){
  const out=[];const pool=arr.slice();
  while(pool.length){
    const c=pool[0].ci;const run=1+(rng()<0.6?1:0)+(rng()<0.3?1:0);
    for(let i=0;i<run;){
      const idx=pool.findIndex(p=>p.ci===c);
      if(idx<0)break;
      out.push(pool.splice(idx,1)[0]);i++;
    }
    if(pool.length){const idx=(rng()*pool.length)|0;out.push(pool.splice(idx,1)[0]);}
  }
  for(let i=0;i<arr.length;i++)arr[i]=out[i];
}
function angOf(v){
  if(v.orient==='h')return v.dir>0?Math.PI/2:-Math.PI/2;
  return v.dir>0?Math.PI:0;
}

/* ---------------- 快照 / 撤销 ---------------- */
function pushSnap(){
  G.snapStack.push({
    vehicles:G.vehicles.map(v=>({id:v.id,state:v.state,slot:v.slot,waitIdx:v.waitIdx,boarded:v.boarded,
      orient:v.orient,dir:v.dir,x:v.x,y:v.y,px:v.px,py:v.py,ang:v.ang})),
    persons:G.persons.map(p=>({id:p.id,state:p.state})),
    served:G.served,moves:G.moves,
  });
  if(G.snapStack.length>120)G.snapStack.shift();
}
function undo(){
  const s=G.snapStack.pop();
  if(!s){toast('已经是初始局面啦');return;}
  for(const sv of s.vehicles){
    const v=G.vehicles.find(w=>w.id===sv.id);if(!v)continue;
    Object.assign(v,sv,{path:null,animFrom:null,bump:0,dip:0,shake:0,boardTimer:0,curSpd:0});
    if(v.state==='idle'){
      const p=gridToWorld(v.orient==='h'?v.x+(v.len-1)/2:v.x,v.orient==='h'?v.y:v.y+(v.len-1)/2);
      v.px=p.px;v.py=p.py;v.ang=angOf(v)+ROT;
    }
  }
  for(const sp of s.persons){const p=G.persons.find(w=>w.id===sp.id);if(p)p.state=sp.state;}
  G.served=s.served;G.moves=s.moves;
  G.hintVid=-1;G.selectMode=null;G.deadlockShown=false;
  SFX.click();toast('已撤销');updateHud();renderProps();
}

/* ---------------- 核心操作 ---------------- */
function tapVehicle(v){
  if(G.selectMode){applySelect(v);return;}
  if(v.state!=='idle')return;
  const fe=cellsHead(v);
  if(fe.exitable){pushSnap();G.moves++;startExit(v,false);}
  else if(fe.k>0){pushSnap();G.moves++;startSlide(v,fe.k);}
  else{v.shake=1;SFX.bump();return;}
  afterAction();
}
function startSlide(v,k){
  const axis=v.orient==='h'?'x':'y';
  const fx=v.px,fy=v.py;
  if(axis==='x')v.x+=k*v.dir;else v.y+=k*v.dir;
  const p=gridToWorld(v.orient==='h'?v.x+(v.len-1)/2:v.x,v.orient==='h'?v.y:v.y+(v.len-1)/2);
  v.state='sliding';v.animFrom={x:fx,y:fy};v.animT=0;v.animDur=0.055*k+0.06;v.slideTo={x:p.px,y:p.py};
  SFX.engine();
}
function slotFree(i){
  return !G.vehicles.some(v=>v.slot===i&&(v.state==='exiting'||v.state==='boarding'||v.state==='waiting'));
}
function firstFreeSlot(){for(let i=0;i<save.slots;i++)if(slotFree(i))return i;return -1;}
function slotCenter(i){ // 车位中心（整排绕左端微倾）
  const lx=i*L.slotStep+L.slotW/2;
  return {x:L.slotX0+lx*Math.cos(ROT),y:L.slotRowY+lx*Math.sin(ROT)};
}
function carLenPx(v){return v.len*L.cell;}
function startExit(v,teleport){
  const axis=v.orient==='h'?'x':'y';
  const {cols,rows}=G.level.params;
  const wps=[];
  const dxv=axis==='x'?v.dir:0, dyv=axis==='y'?v.dir:0;
  const rdx=dxv*COSR-dyv*SINR, rdy=dxv*SINR+dyv*COSR; // 倾斜后的出场方向
  let ex,ey;
  const edge=axis==='x'?(v.dir>0?L.bx+cols*L.cell:L.bx):(v.dir>0?L.by+rows*L.cell:L.by);
  const d=Math.abs(edge-v.px)*0+Math.abs(edge-(axis==='x'?v.px:v.py))+L.cell*0.9+carLenPx(v)/2;
  ex=v.px+rdx*d;ey=v.py+rdy*d;
  wps.push({x:ex,y:ey});
  const s=firstFreeSlot();
  if(ey>L.roadMid+6){
    const sideX=ex<(boardRect.x+boardRect.w/2)?boardRect.x-34:boardRect.x+boardRect.w+34;
    wps.push({x:sideX,y:ey},{x:sideX,y:L.roadMid});
  }else{
    wps.push({x:ex,y:L.roadMid});
  }
  if(teleport){
    if(s>=0){
      v.slot=s;const c=slotCenter(s);
      v.px=c.x;v.py=c.y;v.ang=ROT;v.path=null;v.state='boarding';v.boarded=0;v.boardTimer=0.2;
      SFX.park();return;
    }else{
      v.state='waiting';v.waitIdx=G.vehicles.filter(w=>w.state==='waiting').length;
      v.px=-120-v.waitIdx*76;v.py=L.roadMid;v.ang=Math.PI/2;
      return;
    }
  }
  if(s>=0){
    v.slot=s;const c=slotCenter(s);
    wps.push({x:c.x,y:L.roadMid},{x:c.x,y:c.y});
    v.state='exiting';v.toWait=false;
  }else{
    v.waitIdx=G.vehicles.filter(w=>w.state==='waiting').length;
    v.slot=-1;v.toWait=true;v.state='exiting';
    wps.push({x:-120-v.waitIdx*76,y:L.roadMid});
  }
  v.path=wps;v.pi=0;v.pd=0;v.curSpd=L.cell*13;
  SFX.engine();
}
function promoteWaiting(){
  const w=G.vehicles.filter(v=>v.state==='waiting').sort((a,b)=>a.waitIdx-b.waitIdx)[0];
  if(!w)return;
  const s=firstFreeSlot();if(s<0)return;
  w.slot=s;w.toWait=false;w.state='exiting';
  const c=slotCenter(s);
  w.path=[{x:c.x,y:L.roadMid},{x:c.x,y:c.y}];w.pi=0;w.pd=0;w.curSpd=L.cell*13;
  SFX.engine();
}
function startLeave(v){
  v.state='leaving';v.slot=-1;v.curSpd=L.cell*9;v.dip=1;
  for(let i=0;i<5;i++)G.fx.push({x:v.px+(Math.random()-0.5)*14,y:v.py+carLenPx(v)*0.45,r:4+Math.random()*5,t:-i*0.06,dur:0.7,smoke:true});
  v.path=[{x:v.px,y:L.roadMid},{x:-180,y:L.roadMid}];v.pi=0;v.pd=0;
  SFX.leave();
  setTimeout(promoteWaiting,400);
}
function updateBoarding(dt){
  for(const v of G.vehicles){
    if(v.state!=='boarding')continue;
    v.boardTimer-=dt;
    if(v.boardTimer>0)continue;
    const cap=capOf(v.len);
    const inFlight=G.persons.filter(p=>(p.state==='walking'||p.state==='hopping')&&p.tvid===v.id).length;
    if(v.boarded+inFlight>=cap){v.boardTimer=0.3;continue;}
    const p=G.persons.find(q=>q.state==='queued'&&q.ci===v.color);
    if(!p){v.boardTimer=0.3;continue;}
    p.state='walking';p.tvid=v.id;p.seat=v.boarded+inFlight;p.t=0;
    const qi=G.persons.filter(q=>q.state==='queued').indexOf(p);
    const qp=queuePoint(qi);
    p.fx=qp.x+p.jx;p.fy=qp.y+p.jy;
    const seat=seatPos(v,p.seat);
    p.hx=seat.x;p.hy=seat.y+12;      // 走到车旁地面点
    p.sx=seat.x;p.sy=seat.y;         // 车顶座位
    p.dur=0.18+dist(p.fx,p.fy,p.hx,p.hy)/140;
    v.boardTimer=0.34;
  }
  for(const p of G.persons){
    if(p.state==='walking'){
      p.t+=dt;
      if(p.t>=p.dur){p.state='hopping';p.t=0;p.dur=0.24;}
    }else if(p.state==='hopping'){
      p.t+=dt;
      if(p.t>=p.dur){
        p.state='boarded';p.t=0;
        const v=G.vehicles.find(w=>w.id===p.tvid);
        if(v){
          v.boarded++;v.dip=1;SFX.seat();
          if(v.boarded>=capOf(v.len)){
            v.boardTimer=0.35; // 稍作停留再出发（下方统一检查）
          }
        }
        G.served++;
        if(G.served>=G.total)onAllServed();
      }
    }else if(p.state==='boarded'){
      if(p.t<0.3)p.t+=dt;
    }
  }
  // 坐满 → 出发
  for(const v of G.vehicles){
    if(v.state==='boarding'&&v.boarded>=capOf(v.len)){
      v.boardTimer-=dt;
      if(v.boardTimer<=0)startLeave(v);
    }
  }
}
function queuePoint(i){
  return L.queuePts[Math.min(i,L.queuePts.length-1)]||{x:W*0.8,y:H*0.18};
}
function seatPos(v,idx){ // 车顶座位的世界坐标（随车身朝向旋转）
  const cap=capOf(v.len),rowsN=Math.ceil(cap/2),lenPx=carLenPx(v);
  const col=(idx%2===0)?-1:1,row=Math.floor(idx/2);
  const gapY=(lenPx-34)/Math.max(rowsN-1,1);
  const lx=col*L.cell*0.16,ly=-lenPx/2+20+row*gapY;
  const c=Math.cos(v.ang),s=Math.sin(v.ang);
  return {x:v.px+lx*c-ly*s,y:v.py+lx*s+ly*c};
}
function onAllServed(){
  if(G.winShown)return;G.winShown=true;
  SFX.win();
  setTimeout(showWin,800);
}

/* ---------------- 每帧更新 ---------------- */
function update(dt){
  G.t+=dt;
  for(const v of G.vehicles){
    v.bump=Math.max(0,v.bump-dt*3);v.shake=Math.max(0,v.shake-dt*2.2);v.dip=Math.max(0,v.dip-dt*4);
    if(v.state==='sliding'){
      v.animT+=dt;const k=easeOut(clamp(v.animT/v.animDur,0,1));
      v.px=lerp(v.animFrom.x,v.slideTo.x,k);v.py=lerp(v.animFrom.y,v.slideTo.y,k);
      if(k>=1){v.state='idle';v.bump=1;SFX.bump();}
    }else if(v.state==='exiting'||v.state==='leaving'){
      followPath(v,dt);
    }
  }
  updateBoarding(dt);
  for(const f of G.fx)f.t+=dt;
  G.fx=G.fx.filter(f=>f.t<f.dur);
  checkDeadlock();
  updateHudLight();
}
function followPath(v,dt){
  if(!v.path)return;
  let spd=v.curSpd;
  if(v.state==='leaving'){v.curSpd+=L.cell*26*dt;spd=v.curSpd;}
  const last=v.pi===v.path.length-1;
  if(v.state==='exiting'&&last)spd*=0.55; // 进位减速
  let adv=spd*dt;
  while(adv>0&&v.pi<v.path.length){
    const a=(v.pi===0)?{x:v.px,y:v.py}:v.path[v.pi-1];
    const b=v.path[v.pi];
    const seg=dist(a.x,a.y,b.x,b.y);
    if(seg<0.001){v.pi++;v.pd=0;continue;}
    const remain=seg-v.pd;
    const ta=Math.atan2(b.y-a.y,b.x-a.x);
    v.ang=angLerp(v.ang,ta,clamp(dt*8,0,1));
    if(adv>=remain){v.px=b.x;v.py=b.y;adv-=remain;v.pd=0;v.pi++;}
    else{v.px=a.x+(b.x-a.x)*(v.pd+adv)/seg;v.py=a.y+(b.y-a.y)*(v.pd+adv)/seg;v.pd+=adv;adv=0;}
    const rate=v.state==='leaving'?dt*30:dt*14;
    if(Math.random()<rate)G.fx.push({x:v.px-Math.cos(v.ang)*carLenPx(v)*0.45,y:v.py-Math.sin(v.ang)*carLenPx(v)*0.45,r:3+Math.random()*4,t:0,dur:0.55,smoke:v.state==='leaving'});
  }
  if(v.pi>=v.path.length){
    v.path=null;
    if(v.state==='exiting'){
      if(v.toWait){v.state='waiting';v.ang=Math.PI/2;}
      else{v.state='boarding';v.boarded=v.boarded||0;v.boardTimer=0.3;v.ang=ROT;v.bump=1;SFX.park();}
    }else if(v.state==='leaving'){v.state='gone';}
  }
}
function checkDeadlock(){
  if(G.winShown||G.deadlockShown||!G.started)return;
  const board=G.vehicles.filter(v=>v.state==='idle');
  if(!board.length)return;
  const anyMove=board.some(v=>{const fe=cellsHead(v);return fe.exitable||fe.k>0;});
  if(anyMove)return;
  G.deadlockShown=true;SFX.dead();
  showModal(`<h2>堵死啦！</h2><div class="txt">所有车都动不了了\n用道具救场，或者重开本关</div>
    <div class="btnrow">
      <button class="btn warn" onclick="useProp('shuffle')">用刷新道具重排</button>
      <button class="btn sec" onclick="useProp('undo')">撤销上一步</button>
      <button class="btn pri" onclick="restartLevel()">重开本关</button>
    </div>`);
}

/* ---------------- 道具 ---------------- */
const PROP_META={
  hint:{nm:'提示',price:30},
  undo:{nm:'撤销',price:20},
  flip:{nm:'翻转',price:40},
  remove:{nm:'消除',price:80},
  shuffle:{nm:'刷新',price:60},
};
function useProp(key){
  if(G.selectMode===key){G.selectMode=null;renderProps();return;}
  if(save.props[key]<=0){
    const price=PROP_META[key].price;
    if(save.coins>=price){save.coins-=price;save.props[key]=1;persist();SFX.coin();toast('购买成功 -'+price+'金币');renderProps();updateHud();}
    else{toast('金币不足（还差 '+(price-save.coins)+'）');SFX.bump();}
    return;
  }
  if(key==='hint'){
    const v=bestHint();if(!v){toast('没有能动的车了…试试刷新');return;}
    save.props.hint--;G.propsUsed++;G.hintVid=v.id;G.hintUntil=G.t+3;
    SFX.click();toast(feMsg(v));
  }else if(key==='undo'){
    save.props.undo--;G.propsUsed++;undo();
  }else if(key==='flip'||key==='remove'){
    G.selectMode=key;SFX.click();toast(key==='flip'?'点选一辆车，调头 180°':'点选一辆车，直接送它去接客');
  }else if(key==='shuffle'){
    save.props.shuffle--;G.propsUsed++;doShuffle();
  }
  persist();renderProps();updateHud();hideModal();
}
window.useProp=useProp;
function feMsg(v){const fe=cellsHead(v);return fe.exitable?'这辆车可以出场！':'这辆可以往前挪，先腾腾路';}
function bestHint(){
  const idle=G.vehicles.filter(v=>v.state==='idle');
  let best=null,bs=-1;
  for(const v of idle){
    const fe=cellsHead(v);
    if(fe.exitable){
      const demand=G.persons.filter(p=>p.state==='queued'&&p.ci===v.color).length;
      if(demand>bs){bs=demand;best=v;}
    }
  }
  if(best)return best;
  for(const v of idle){const fe=cellsHead(v);if(fe.k>0&&fe.k>bs){bs=fe.k;best=v;}}
  return best;
}
function applySelect(v){
  if(v.state!=='idle'){toast('这辆车现在选不了');return;}
  const key=G.selectMode;G.selectMode=null;
  if(save.props[key]<=0){renderProps();return;}
  save.props[key]--;G.propsUsed++;pushSnap();
  if(key==='flip'){v.dir*=-1;v.ang=angOf(v)+ROT;SFX.click();toast('已调头');}
  else if(key==='remove'){startExit(v,true);G.moves++;toast('已送出，乘客直接上车');}
  persist();renderProps();afterAction();
}
function doShuffle(){
  const board=G.vehicles.filter(v=>v.state==='idle'||v.state==='sliding');
  if(!board.length){toast('场上没有车了');return;}
  const rng=mulberry32((seedOf(G.n)^((Math.random()*1e9)|0))>>>0);
  const {cols,rows}=G.level.params;
  for(let round=0;round<8;round++){
    const occ=Array.from({length:rows},()=>new Array(cols).fill(null));
    for(const o of G.obstacles)occ[o.y][o.x]='o';
    const order=shuffleArr(board.slice(),rng);
    let ok=true;
    for(const v of order){
      let done=false;
      for(let t=0;t<80&&!done;t++){
        const orient=rng()<0.5?'h':'v',dir=rng()<0.5?1:-1;
        const xs=orient==='h'?cols-v.len+1:cols,ys=orient==='h'?rows:rows-v.len+1;
        if(xs<=0||ys<=0)continue;
        const x=(rng()*xs)|0,y=(rng()*ys)|0;
        let fit=true;
        for(let k=0;k<v.len;k++){const px=orient==='h'?x+k:x,py=orient==='h'?y:y+k;if(occ[py][px]){fit=false;break;}}
        if(!fit)continue;
        const axis=orient==='h'?'x':'y';
        const head=dir>0?(axis==='x'?x+v.len-1:y+v.len-1):(axis==='x'?x:y);
        let c=head+dir,clear=true;
        while(axis==='x'?(c>=0&&c<cols):(c>=0&&c<rows)){
          const px=axis==='x'?c:x,py=axis==='x'?y:c;
          if(occ[py][px]){clear=false;break;}c+=dir;
        }
        if(!clear)continue;
        v.orient=orient;v.dir=dir;v.x=x;v.y=y;v.state='idle';v.animFrom=null;v.slideTo=null;
        for(let k=0;k<v.len;k++){const px=orient==='h'?x+k:x,py=orient==='h'?y:y+k;occ[py][px]=v;}
        done=true;
      }
      if(!done){ok=false;break;}
    }
    if(ok){
      repositionBoardEnts();
      for(const p of G.persons)if(p.state==='walking'||p.state==='hopping')p.state='queued';
      SFX.engine();toast('重新排好啦，依然保证有解');
      afterAction();return;
    }
  }
  toast('这次没排开，稍后再试');
  G.propsUsed--;save.props.shuffle++;
}
function afterAction(){
  G.hintVid=-1;G.deadlockShown=false;
  updateHud();renderProps();
}

/* ---------------- 胜利 / 结算 ---------------- */
function calcStars(){
  const par=G.level.par;
  if(G.moves<=par&&G.propsUsed===0)return 3;
  if(G.moves<=Math.ceil(par*1.6)||G.propsUsed<=1)return 2;
  return 1;
}
function showWin(){
  const stars=calcStars();
  const hard=G.level.params.hard;
  let coins=(20+stars*10)*(hard?2:1);
  const first3=stars===3&&save.stars[G.n]!==3;
  if(first3)coins+=20;
  save.coins+=coins;
  save.stars[G.n]=Math.max(save.stars[G.n]||0,stars);
  save.lv=Math.max(save.lv,G.n+1);
  persist();updateHud();SFX.coin();
  const starStr='★'.repeat(stars)+'<span class="dim">'+'★'.repeat(3-stars)+'</span>';
  showModal(`<h2>通关啦！</h2><div class="stars">${starStr}</div>
    <div class="coin">金币 +${coins}${hard?'（困难 ×2）':''}${first3?'（首次三星 +20）':''}</div>
    <div class="txt">步数 ${G.moves} / 参考 ${G.level.par}　道具 ${G.propsUsed} 个</div>
    <div class="btnrow">
      <button class="btn pri" onclick="nextLevel()">下一关 →</button>
      <button class="btn sec" onclick="restartLevel()">再玩一次</button>
    </div>`);
  window.__win=true;
}

/* ================= 渲 染 ================= */
function rr(c,x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);if(r<0)r=0;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
/* 静态图层缓存：车站/车位/马路只在布局变化时重绘 */
let bgCv=null,bgDirty=true;
function renderStatic(){
  if(!bgCv)bgCv=document.createElement('canvas');
  bgCv.width=cv.width;bgCv.height=cv.height;
  const c=bgCv.getContext('2d');
  c.setTransform(DPR,0,0,DPR,0,0);
  c.fillStyle='#aab6ec';c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.14)';
  for(const d of L.dots){c.beginPath();c.arc(d.x,d.y,d.r,0,7);c.fill();}
  // 车站
  const h=L.stationH;
  c.fillStyle='#dde4f6';c.fillRect(0,0,W,h);
  c.fillStyle='#c3cdea';c.fillRect(0,h-6,W,6);
  const ty=h*0.16,th=h*0.58;
  c.fillStyle='#eef2fb';
  rr(c,-8,ty,W+16,th,th*0.3);c.fill();
  c.strokeStyle='#b9c4e4';c.lineWidth=2;
  rr(c,-8,ty,W+16,th,th*0.3);c.stroke();
  c.fillStyle='#37406b';
  rr(c,-8,ty+th-7,W+16,7,3);c.fill();
  const ww=Math.min(40,W*0.095),wh=th*0.52,wy=ty+th*0.16;
  c.fillStyle='#8fb7ec';
  for(let x=10;x<W-ww-10;x+=ww+13){rr(c,x,wy,ww,wh,5);c.fill();
    c.fillStyle='rgba(255,255,255,.45)';rr(c,x+3,wy+2,ww*0.32,wh-4,3);c.fill();c.fillStyle='#8fb7ec';}
  // 车位
  for(let i=0;i<6;i++){
    const ct=slotCenter(i);
    const unlocked=i<save.slots;
    c.save();
    c.translate(ct.x,ct.y);c.rotate(ROT);
    const w=L.slotW,hh=L.slotH;
    c.fillStyle='rgba(40,50,90,.14)';
    rr(c,-w/2+4,-hh/2+7,w,hh,10);c.fill();
    c.fillStyle=unlocked?'#9aa3ba':'#6d7690';
    rr(c,-w/2,-hh/2,w,hh,10);c.fill();
    c.fillStyle=unlocked?'rgba(255,255,255,.28)':'rgba(255,255,255,.10)';
    rr(c,-w/2+3,-hh/2+3,w-6,hh*0.45,8);c.fill();
    if(unlocked){
      c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=2;c.setLineDash([6,5]);
      rr(c,-w/2+4,-hh/2+4,w-8,hh-8,7);c.stroke();c.setLineDash([]);
      c.fillStyle='rgba(255,255,255,.95)';c.font='900 '+Math.round(w*0.46)+'px system-ui';
      c.textAlign='center';c.textBaseline='middle';
      c.fillText('P',0,2);
    }else{
      const s=w*0.26;
      c.fillStyle='#cdd3e0';
      rr(c,-s*0.75,-s*0.05,s*1.5,s*1.1,3);c.fill();
      c.strokeStyle='#cdd3e0';c.lineWidth=Math.max(2,s*0.26);
      c.beginPath();c.arc(0,-s*0.05,s*0.42,Math.PI,0);c.stroke();
      c.fillStyle='#e7eaf2';c.font='800 10px system-ui';c.textAlign='center';c.textBaseline='middle';
      c.fillText(i===4?'150':'300',0,hh*0.38);
    }
    c.restore();
  }
  c.textBaseline='alphabetic';
  // 马路
  c.fillStyle='#7d8698';c.fillRect(0,L.roadY-7,W,7);
  c.fillStyle='#59616e';c.fillRect(0,L.roadY,W,L.roadH);
  c.fillStyle='#6b7484';c.fillRect(0,L.roadY+L.roadH,W,5);
  c.fillStyle='rgba(255,255,255,.85)';
  for(let x=8;x<W;x+=44)c.fillRect(x,L.roadY+L.roadH/2-1.6,22,3.2);
  bgDirty=false;
}
function render(){
  if(bgDirty||!bgCv||bgCv.width!==cv.width)renderStatic();

/* ---- 排队人群 + 护栏 ---- */
function drawQueue(){
  const people=G.persons.filter(p=>p.state==='queued');
  const nShow=Math.min(people.length,90);
  for(let i=0;i<nShow;i++){
    const p=people[i],pt=queuePoint(i);
    drawPerson(pt.x+p.jx,pt.y+p.jy,COLORS[p.ci],1);
  }
  // 闸口护栏：立柱 + 红白杆
  const gx=W*0.915,gy0=L.stationH+4,gy1=L.stationH+L.queueZone-10;
  ctx.strokeStyle='#8a93ad';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(gx,gy1);ctx.lineTo(gx,gy0);ctx.stroke();
  ctx.strokeStyle='#e05555';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(gx-30,gy1-8);ctx.lineTo(gx,gy1-8);ctx.stroke();
  ctx.fillStyle='#fff';
  for(let x=gx-28;x<gx-4;x+=14)ctx.fillRect(x,gy1-10.5,7,5);
  // 站牌
  const sx=W*0.955,sy=gy1-14;
  ctx.fillStyle='#8a93ad';ctx.fillRect(sx-2,sy,4,18);
  ctx.fillStyle='#ffd23e';
  rr(ctx,sx-11,sy-20,22,20,5);ctx.fill();
  ctx.strokeStyle='#c99a12';ctx.lineWidth=1.5;rr(ctx,sx-11,sy-20,22,20,5);ctx.stroke();
  ctx.fillStyle='#7a4c00';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('巴',sx,sy-10);
  ctx.textBaseline='alphabetic';
}
function drawPerson(x,y,C,s,alpha){
  ctx.save();
  if(alpha!==undefined)ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(40,50,90,.20)';
  ctx.beginPath();ctx.ellipse(x,y+7*s,5.5*s,2.2*s,0,0,7);ctx.fill();
  ctx.fillStyle=C.dark;
  rr(ctx,x-4.7*s,y-4.3*s,9.4*s,12*s,4.5*s);ctx.fill();
  ctx.fillStyle=C.body;
  rr(ctx,x-4.2*s,y-4*s,8.4*s,11.2*s,4.2*s);ctx.fill();
  ctx.beginPath();ctx.arc(x,y-6.8*s,4.6*s,0,7);ctx.fill();
  ctx.fillStyle=C.light;
  ctx.beginPath();ctx.arc(x-1.6*s,y-7.8*s,1.5*s,0,7);ctx.fill();
  ctx.restore();
}
/* ---- 2.5D 车辆 ---- */
function drawVehicle(v,shadowPass){
  const ang=v.ang;
  ctx.save();
  let ox=0,oy=0;
  if(v.shake>0)ox=Math.sin(v.shake*34)*3*v.shake;
  if(v.bump>0)oy+=Math.sin(v.bump*Math.PI)*2.5;
  if(v.dip>0)oy+=Math.sin(v.dip*Math.PI)*2;
  ctx.translate(v.px+ox,v.py+oy);
  ctx.rotate(ang);
  const w=L.cell*0.80,len=carLenPx(v)-6;
  const EXT=Math.max(5,L.cell*0.26);       // 车身高度（向世界下方挤出）
  const dxx=Math.sin(ang)*EXT, dyy=Math.cos(ang)*EXT; // 世界"下方"在车体局部坐标
  const C=COLORS[v.color];
  const R=w*0.34;
  ctx.fillStyle='rgba(25,32,70,.28)';
  rr(ctx,-w/2+3,-len/2+7,w,len,R);ctx.fill();
  if(shadowPass){ctx.restore();return;}
  // 轮毂（在车底侧沿）
  ctx.fillStyle='#232a3d';
  const ww=Math.max(4,w*0.17),wh=Math.max(5,L.cell*0.22);
  const wy1=-len*0.30,wy2=len*0.30-wh;
  rr(ctx,dxx-w/2+1,dyy+wy1,ww,wh,2.5);ctx.fill();
  rr(ctx,dxx+w/2-1-ww,dyy+wy1,ww,wh,2.5);ctx.fill();
  rr(ctx,dxx-w/2+1,dyy+wy2,ww,wh,2.5);ctx.fill();
  rr(ctx,dxx+w/2-1-ww,dyy+wy2,ww,wh,2.5);ctx.fill();
  // 车身：底（深）→ 中 → 顶（本色）三层堆叠出体积
  ctx.fillStyle=C.dark;
  rr(ctx,dxx-w/2,dyy-len/2,w,len,R);ctx.fill();
  ctx.fillStyle=C.mid;
  rr(ctx,dxx*0.55-w/2,dyy*0.55-len/2,w,len,R);ctx.fill();
  ctx.fillStyle=C.body;
  rr(ctx,-w/2,-len/2,w,len,R);ctx.fill();
  ctx.strokeStyle=C.dark;ctx.lineWidth=1.6;
  rr(ctx,-w/2,-len/2,w,len,R);ctx.stroke();
  // 车顶浅色面板
  ctx.fillStyle=C.light;
  rr(ctx,-w*0.40,-len/2+len*0.16,w*0.80,len*0.64,R*0.62);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1;
  rr(ctx,-w*0.40,-len/2+len*0.16,w*0.80,len*0.64,R*0.62);ctx.stroke();
  // 前挡风（车头端深色玻璃带）
  ctx.fillStyle='rgba(22,30,55,.78)';
  rr(ctx,-w*0.36,-len/2+len*0.045,w*0.72,L.cell*0.14,3);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.30)';
  rr(ctx,-w*0.30,-len/2+len*0.06,w*0.26,L.cell*0.08,2);ctx.fill();
  // 后窗
  ctx.fillStyle='rgba(22,30,55,.55)';
  rr(ctx,-w*0.30,len/2-len*0.115,w*0.60,L.cell*0.09,2);ctx.fill();
  // 巴士中缝
  if(v.len===3){ctx.strokeStyle=C.dark;ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(-w*0.40,0);ctx.lineTo(w*0.40,0);ctx.stroke();}
  // 车顶白箭头（柔和投影 + 圆角粗箭头）
  drawArrow(1.6,2.4,w,len,'rgba(40,45,70,.30)');
  drawArrow(0,0,w,len,'#ffffff');
  ctx.restore();
  // 高亮/选中光环（跟随倾角）
  if((G.hintVid===v.id&&G.t<G.hintUntil)||(G.selectMode&&v.state==='idle')){
    const isSel=G.selectMode&&v.state==='idle';
    const p=Math.sin(G.t*6)*0.5+0.5;
    ctx.save();
    ctx.translate(v.px,v.py);ctx.rotate(ang);
    ctx.strokeStyle=isSel?'rgba(255,220,80,'+(0.7+p*0.3)+')':'rgba(120,255,150,'+(0.55+p*0.45)+')';
    ctx.lineWidth=3.5;
    const m=5+p*3;
    rr(ctx,-L.cell/2-m,-carLenPx(v)/2-m,L.cell+m*2,carLenPx(v)+m*2,12);ctx.stroke();
    ctx.restore();
  }
}
function drawArrow(sxo,syo,w,len,color){ // 一体式箭头多边形：杆+头部
  const s=w*0.085,h2=w*0.24,hLen=w*0.46;
  const y0=-len*0.14+syo,y1=len*0.26+syo;
  ctx.beginPath();
  ctx.moveTo(sxo-s,y1);
  ctx.lineTo(sxo-s,y0+hLen);
  ctx.lineTo(sxo-h2,y0+hLen);
  ctx.lineTo(sxo,y0);
  ctx.lineTo(sxo+h2,y0+hLen);
  ctx.lineTo(sxo+s,y0+hLen);
  ctx.lineTo(sxo+s,y1);
  ctx.closePath();
  ctx.fillStyle=color;
  ctx.fill();
  ctx.lineJoin='round';
  ctx.strokeStyle=color;ctx.lineWidth=2.5;
  ctx.stroke();
}
function drawBoardCars(){
  const board=G.vehicles.filter(v=>v.state==='idle'||v.state==='sliding');
  for(const v of board)drawVehicle(v,true);
  for(const v of board)drawVehicle(v,false);
  for(const o of G.obstacles){
    const p={x:o.px,y:o.py};
    ctx.fillStyle='rgba(30,40,80,.20)';
    ctx.beginPath();ctx.ellipse(p.px+2,p.py+5,L.cell*0.34,L.cell*0.2,0,0,7);ctx.fill();
    ctx.fillStyle='#e8563f';
    ctx.beginPath();ctx.moveTo(p.px,p.py-L.cell*0.34);
    ctx.lineTo(p.px+L.cell*0.32,p.py+L.cell*0.22);
    ctx.lineTo(p.px-L.cell*0.32,p.py+L.cell*0.22);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(p.px,p.py-L.cell*0.02,L.cell*0.075,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath();ctx.moveTo(p.px,p.py-L.cell*0.34);
    ctx.lineTo(p.px+L.cell*0.32,p.py+L.cell*0.22);
    ctx.lineTo(p.px+L.cell*0.05,p.py+L.cell*0.22);
    ctx.closePath();ctx.fill();
  }
}
function drawWaitingCars(){
  for(const v of G.vehicles)if(v.state==='waiting')drawVehicle(v);
}
function drawMovingCars(){
  for(const v of G.vehicles){
    if(v.state==='exiting'||v.state==='leaving'){drawVehicle(v);drawRiders(v);continue;}
    if(v.state==='waiting'){drawVehicle(v);continue;}
    if(v.state!=='boarding')continue;
    drawVehicle(v);
    drawRiders(v);
    // 跳车上车中的乘客
    for(const p of G.persons){
      if(p.state!=='hopping'||p.tvid!==v.id)continue;
      const k=clamp(p.t/p.dur,0,1);
      const x=lerp(p.hx,p.sx,k),y=lerp(p.hy,p.sy,k)-Math.sin(k*Math.PI)*13;
      drawPerson(x,y,COLORS[p.ci],0.9+0.25*k);
    }
  }
}
function drawRiders(v){ // 车顶乘客（boarding / leaving 都显示 = 载客离场）
  for(const p of G.persons){
    if(p.state!=='boarded'||p.tvid!==v.id)continue;
    const s=seatPos(v,p.seat);
    const popK=clamp(p.t/0.25,0,1);
    const bob=Math.sin(G.t*3+p.id)*0.8;
    drawPerson(s.x,s.y+bob,COLORS[p.ci],(0.65+0.35*popK)*0.92);
  }
}
function drawWalkingPeople(){
  for(const p of G.persons){
    if(p.state!=='walking')continue;
    const k=easeOut(clamp(p.t/p.dur,0,1));
    const x=lerp(p.fx,p.hx,k),y=lerp(p.fy,p.hy,k)-Math.abs(Math.sin(p.t*11))*4.5;
    drawPerson(x,y,COLORS[p.ci],1.05);
  }
}
function drawFx(){
  for(const f of G.fx){
    if(f.t<0)continue;
    const k=f.t/f.dur;
    ctx.fillStyle=f.smoke?'rgba(235,238,248,'+(0.65*(1-k))+')':'rgba(235,240,250,'+(0.5*(1-k))+')';
    ctx.beginPath();ctx.arc(f.x,f.y-k*(f.smoke?16:8),f.r*(1+k*(f.smoke?2.2:1.6)),0,7);ctx.fill();
  }
}
function drawProgress(){
  const x=8,y0=L.boardTop+14,y1=L.boardBot-34;
  // 进度槽
  ctx.fillStyle='rgba(255,255,255,.6)';
  rr(ctx,x-2,y0,11,y1-y0,6);ctx.fill();
  const k=G.total?G.served/G.total:0;
  if(k>0){ctx.fillStyle='#39c15e';rr(ctx,x-2,y0+(y1-y0)*(1-k),11,Math.max((y1-y0)*k,5),6);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';rr(ctx,x,y0+(y1-y0)*(1-k)+1.5,3,Math.max((y1-y0)*k-3,2),2);ctx.fill();}
  ctx.fillStyle='#23306b';ctx.font='900 12px system-ui';ctx.textAlign='left';
  ctx.fillText(Math.round(k*100)+'%',x-3,y1+16);
  // 小工程师（站在进度槽旁）
  const fx=x+26,fy=y1-6; // 脚底基准
  ctx.save();
  ctx.fillStyle='rgba(30,40,80,.22)';
  ctx.beginPath();ctx.ellipse(fx,fy+1,10,3.2,0,0,7);ctx.fill();
  ctx.fillStyle='#27336b';
  rr(ctx,fx-5.5,fy-9,4.5,9,2);ctx.fill();
  rr(ctx,fx+1,fy-9,4.5,9,2);ctx.fill();
  ctx.fillStyle='#3a6cd8';
  rr(ctx,fx-9,fy-27,18,20,6);ctx.fill();
  ctx.fillStyle='#2c55b0';
  rr(ctx,fx-9,fy-27,18,8,6);ctx.fill();
  ctx.fillStyle='#ffd23e';
  rr(ctx,fx-6.5,fy-24,4,9,2);ctx.fill();
  rr(ctx,fx+2.5,fy-24,4,9,2);ctx.fill();
  ctx.fillStyle='#3a6cd8';
  rr(ctx,fx+8,fy-22,4.5,12,2.2);ctx.fill();
  ctx.fillStyle='#c0392b';
  rr(ctx,fx+7.5,fy-11,6,5,1.5);ctx.fill();
  ctx.fillStyle='#f6c89f';
  ctx.beginPath();ctx.arc(fx,fy-35,7.2,0,7);ctx.fill();
  ctx.fillStyle='#2b2f45';
  ctx.beginPath();ctx.arc(fx-2.4,fy-35.5,1,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(fx+2.4,fy-35.5,1,0,7);ctx.fill();
  ctx.strokeStyle='#b5713f';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(fx,fy-32.8,2.6,0.25*Math.PI,0.75*Math.PI);ctx.stroke();
  ctx.fillStyle='#ffd23e';
  rr(ctx,fx-8.5,fy-46.5,17,8.5,4);ctx.fill();
  rr(ctx,fx-10.5,fy-39.5,21,3.2,1.6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)';
  rr(ctx,fx-6,fy-45,6,3,1.5);ctx.fill();
  ctx.restore();
}
function drawDebug(){
  const q=new URLSearchParams(location.search);
  if(q.get('debug')!=='1')return;
  ctx.strokeStyle='rgba(60,220,110,.9)';ctx.lineWidth=2;
  for(const v of G.vehicles){
    if(v.state!=='idle')continue;
    if(cellsHead(v).exitable){
      ctx.save();ctx.translate(v.px,v.py);ctx.rotate(v.ang);
      rr(ctx,-L.cell/2-3,-carLenPx(v)/2-3,L.cell+6,carLenPx(v)+6,10);ctx.stroke();
      ctx.restore();
    }
  }
}

/* ---------------- 输入 ---------------- */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();SFX.unlock();
  if(!G.started)return;
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  for(let i=save.slots;i<6;i++){
    const c=slotCenter(i);
    if(Math.abs(x-c.x)<L.slotW/2+6&&Math.abs(y-c.y)<L.slotH/2+6){buySlot(i);return;}
  }
  const v=vehAt(x,y);
  if(!v&&G.selectMode){G.selectMode=null;renderProps();return;}
  if(v)tapVehicle(v);
},{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function buySlot(i){
  if(save.slots>i)return;
  const price=i===4?150:300;
  showModal(`<h2>扩建车位</h2><div class="txt">花 ${price} 金币永久解锁第 ${i+1} 个车位\n车位越多，堵车越少</div>
    <div class="btnrow">
      <button class="btn pri" onclick="doBuySlot(${i},${price})" ${save.coins<price?'disabled style="opacity:.5"':''}>解锁（${price} 金币）</button>
      <button class="btn sec" onclick="hideModal()">先不扩了</button>
    </div>`);
}
window.doBuySlot=function(i,price){
  if(save.coins<price){toast('金币不足');return;}
  save.coins-=price;save.slots=Math.max(save.slots,i+1);persist();bgDirty=true;
  SFX.coin();hideModal();updateHud();toast('新车位解锁！');promoteWaiting();
};
document.getElementById('btnPause').addEventListener('click',()=>{SFX.click();showPause();});

/* ---------------- 自动演示 ---------------- */
let autoTimer=null;
function autoStep(){
  if(maskEl.classList.contains('show'))return;
  const idle=G.vehicles.filter(v=>v.state==='idle');
  let best=null,bs=-1;
  for(const v of idle){
    if(cellsHead(v).exitable){
      const d=G.persons.filter(p=>p.state==='queued'&&p.ci===v.color).length;
      if(d>bs){bs=d;best=v;}
    }
  }
  if(best){tapVehicle(best);return;}
  for(const v of idle){if(cellsHead(v).k>0){tapVehicle(v);return;}}
  if(autoTimer){clearInterval(autoTimer);autoTimer=null;}
}
/* ---------------- 主循环 / 启动 ---------------- */
let lastT=0;
function frame(ts){
  const dt=Math.min((ts-lastT)/1000,0.05)||0.016;lastT=ts;
  if(G.started)update(dt);
  render();
  window.__state={n:G.n,served:G.served,total:G.total,vehicles:G.vehicles.length,
    idle:G.vehicles.filter(v=>v.state==='idle').length,
    phase:G.winShown?'win':'play'};
  requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{computeLayout();});
window.addEventListener('orientationchange',()=>setTimeout(computeLayout,250));

function boot(){
  renderProps();
  computeLayout();
  const q=new URLSearchParams(location.search);
  let n=save.lv;
  if(q.get('level')){n=clamp(parseInt(q.get('level'))||1,1,99999);}
  startLevel(n);
  G.started=true;
  if(!save.seen){
    save.seen=true;persist();
    showModal(`<h2>🚗 挪挪车</h2><div class="txt">点击车辆，它会朝着<b>箭头方向</b>行驶：
冲出停车场、倒进顶部车位。

<b>同色乘客</b>会排队上车，坐满就载走。
接走全部乘客即可通关！

车位不够时，点锁定车位花金币扩建。</div>
      <div class="btnrow"><button class="btn pri" onclick="hideModal()">开始游戏</button></div>`);
  }
  if(q.get('autoplay')==='1'){
    setTimeout(()=>{hideModal();autoTimer=setInterval(autoStep,560);},400);
  }
  requestAnimationFrame(frame);
}
boot();
</script>
