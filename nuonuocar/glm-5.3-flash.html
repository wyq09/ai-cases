<!doctype html>
<html lang="zh-CN">
<head>

<title>挪挪车 · PARK &amp; GO</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:#d9ddc8;
    font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
    touch-action:none;overscroll-behavior:none}
  #stage{position:absolute;inset:0;margin:0 auto;width:100%;max-width:480px;overflow:hidden;background:#eef0e2;
    box-shadow:0 0 44px rgba(60,70,50,.25)}
  #cv{position:absolute;inset:0;display:block;touch-action:none}
  /* ---------- 顶栏 ---------- */
  #hud{position:absolute;top:0;left:0;right:0;z-index:5;pointer-events:none;padding:10px 12px 0}
  #hudRow{display:flex;align-items:center;justify-content:space-between}
  #btnPause{width:42px;height:42px;border-radius:50%;border:1.5px solid #d7dcc6;background:#fdfef8;color:#3c4a3a;

    box-shadow:0 2px 6px rgba(70,80,55,.12)}

  #titleBox{text-align:center;line-height:1.15}
  #titleBox .t{font-size:19px;font-weight:900;color:#2f3b32;letter-spacing:6px;text-indent:6px}

  #coinBox{display:flex;align-items:center;gap:5px;background:#fdfef8;border:1.5px solid #d7dcc6;border-radius:18px;

  #coinBox svg{width:19px;height:19px}
  #coinNum{color:#2f3b32;font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}

  /* ---------- 道具栏 ---------- */
  #props{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:9px;

  .prop{position:relative;width:58px;border:none;border-radius:14px;cursor:pointer;padding:9px 0 7px;
    display:flex;flex-direction:column;align-items:center;gap:3px;

  .prop:active{transform:scale(.94)}
  .prop svg{width:22px;height:22px}
  .prop .nm{font-size:11px;font-weight:800;color:#3c4a3a}
  .prop .bd{position:absolute;top:-7px;right:-4px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;
    background:#fff;border:1.5px solid #d7dcc6;color:#3c4a3a;font-size:11px;font-weight:900;
    display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .prop .bd.price{color:#b3542f;border-color:#e4c9a9}
  .prop.off{opacity:.45}
  .prop.act{outline:2.5px solid #7d9078;transform:scale(1.05)}
  /* ---------- 提示 / 横幅 ---------- */
  #toast{position:absolute;left:50%;top:37%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;
    background:rgba(47,59,50,.92);color:#fdfef8;font-size:14px;font-weight:600;padding:10px 20px;
    border-radius:20px;opacity:0;transition:opacity .25s;max-width:84%;text-align:center}
  #banner{position:absolute;left:0;right:0;top:32%;z-index:8;pointer-events:none;text-align:center;
    font-size:42px;font-weight:900;color:#4a5c44;opacity:0;transform:scale(.6)}
  #banner.show{animation:ban 1.4s ease forwards}
  @keyframes ban{0%{opacity:0;transform:scale(.5)}18%{opacity:1;transform:scale(1.1)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.04) translateY(-12px)}}
  /* ---------- 弹窗 ---------- */
  #mask{position:absolute;inset:0;background:rgba(60,70,55,.4);z-index:10;display:none;
    align-items:center;justify-content:center;pointer-events:auto}
  #mask.show{display:flex}
  #modal{background:#fdfef8;border-radius:22px;padding:24px 20px calc(20px + env(safe-area-inset-bottom));
    width:min(86vw,330px);max-height:80vh;overflow:auto;text-align:center;
    box-shadow:0 18px 50px rgba(50,60,40,.35);animation:mup .22s ease}
  @keyframes mup{from{transform:translateY(24px) scale(.94);opacity:0}to{transform:none;opacity:1}}
  #modal h2{font-size:21px;color:#2f3b32;margin-bottom:10px}
  #modal .txt{font-size:14px;color:#5c685a;line-height:1.75;margin-bottom:14px;white-space:pre-line}

  #modal .stars .dim{color:#dde1d2}
  #modal .coin{color:#a8871f;font-weight:900;font-size:16px;margin-bottom:12px}
  .btnrow{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .btn{border:none;border-radius:14px;padding:13px 10px;font-size:15px;font-weight:800;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:#4a5c44;color:#fdfef8;box-shadow:0 3px 0 #35422f}
  .btn.sec{background:#edf0e2;color:#3c4a3a;box-shadow:0 3px 0 #d5dac5}
  .btn.warn{background:#d98a5f;color:#fff;box-shadow:0 3px 0 #b56a3f}
</style>

<body>
<div id="stage">
<canvas id="cv"></canvas>

<div id="hud">
  <div id="hudRow">
    <button id="btnPause" aria-label="暂停">
      <svg viewBox="0 0 24 24" width="17" height="17"><rect x="6" y="4" width="4" height="16" rx="2" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="2" fill="currentColor"/></svg>

    <div id="titleBox"><div class="t">挪挪车</div><div class="s">PARK &amp; GO</div></div>
    <div id="coinBox">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#e5b93c"/><circle cx="12" cy="12" r="10" fill="none" stroke="#c79a22" stroke-width="2"/><path d="M12 7.2l1.2 2.9 3.1.2-2.4 2 .8 3-2.7-1.7-2.7 1.7.8-3-2.4-2 3.1-.2z" fill="#fdf6dc"/></svg>

<div id="mask"><div id="modal"></div></div>
</div>

<script>
'use strict';
/* =====================================================================
   挪挪车 · PARK & GO  (glm-5.3-flash)  v3 等距版
   等距投影棋盘 + 三面体车辆（玻璃座舱/立柱/轮毂/车灯）
   相位动画：出场加速 → miniCar 驶入车位 → 同色乘客逐个上车 → 满员驶离
   ===================================================================== */

/* ---------------- 基础工具 ---------------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seedOf(n){let x=(n*2654435761)>>>0;x^=x>>>13;x=(x*1274126177)>>>0;return (x^(x>>>16))>>>0;}
function shuffleArr(arr,rng){for(let i=arr.length-1;i>0;i--){const j=(rng()*(i+1))|0;[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const dur=ms=>REDUCE?Math.min(ms,90):ms;
/* roundRect 兜底（iOS 15 及以下无原生实现） */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}

/* ---------------- 调试探针 ---------------- */
window.__errs=[];window.__win=false;window.__state={};
window.addEventListener('error',e=>__errs.push('err:'+(e.message||e)));
window.addEventListener('unhandledrejection',e=>__errs.push('rej:'+(e.reason||'')));
const _ce=console.error.bind(console);console.error=(...a)=>{__errs.push('ce:'+a.join(' '));_ce(...a);};

/* ---------------- 音效 ---------------- */
const SFX=(()=>{let ac=null;
  function ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return ac;}
  function env(g,t0,a,d,v){g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(0.001,t0+a+d);}
  function tone(f0,f1,d2,type,vol,when){const c=ctx();if(!c||!save.sound)return;const t0=c.currentTime+(when||0);
    const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';
    o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+d2);
    env(g,t0,0.008,d2,vol||0.15);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+d2+0.1);}
  function noise(d2,vol,fc){const c=ctx();if(!c||!save.sound)return;const t0=c.currentTime;
    const n=c.createBufferSource(),buf=c.createBuffer(1,Math.max(1,c.sampleRate*d2|0),c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=buf;
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||900;
    const g=c.createGain();env(g,t0,0.01,d2,vol||0.12);n.connect(f).connect(g).connect(c.destination);n.start(t0);}
  let lastEng=0;
  return {
    unlock(){const c=ctx();if(c&&c.state==='suspended')c.resume();},
    click(){tone(760,0,0.05,'triangle',0.10);},
    engine(){const now=performance.now();if(now-lastEng<120)return;lastEng=now;noise(0.28,0.10,520);tone(90,150,0.28,'sawtooth',0.05);},
    bump(){noise(0.09,0.16,300);tone(95,55,0.12,'sine',0.20);},
    park(){tone(520,780,0.10,'triangle',0.14);tone(780,1040,0.12,'triangle',0.12,0.09);},
    seat(){tone(880,1180,0.06,'sine',0.07);},
    leave(){noise(0.35,0.09,700);tone(180,90,0.3,'sawtooth',0.05);},
    coin(){tone(1046,0,0.07,'square',0.09);tone(1568,0,0.12,'square',0.09,0.07);},
    win(){[523,659,784,1046].forEach((f,i)=>tone(f,0,0.16,'triangle',0.14,i*0.11));},
    dead(){tone(300,150,0.35,'sawtooth',0.10);},
  };
})();

/* ---------------- 存档 ---------------- */
const SAVE_KEY='nnChe_glm_v1';
const DEF_SAVE={lv:1,coins:200,props:{hint:3,undo:3,flip:2,remove:1,shuffle:1},stars:{},slots:4,sound:true,seen:false};
let save;
try{save=Object.assign({},DEF_SAVE,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'));
    save.props=Object.assign({},DEF_SAVE.props,save.props);}catch(e){save=JSON.parse(JSON.stringify(DEF_SAVE));}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ---------------- 关卡参数 ---------------- */
function levelParams(n){
  const cols=Math.min(6+Math.floor(n/4),9);
  const rows=Math.min(7+Math.floor(n/3),12);
  const hard=n%10===0;
  let density=Math.min(0.42+n*0.02,0.58)+(hard?0.04:0);
  density=Math.min(density,0.58);
  const cells=cols*rows;
  const nVeh=clamp(Math.round(cells*density/2.4),5,34);
  const busRatio=Math.min(0.15+n*0.02,0.5);
  const obstacles=n<4?0:Math.min(Math.floor((n-2)/3),6);
  const colorCount=n===1?4:5;
  return {cols,rows,nVeh,busRatio,obstacles,colorCount,hard};
}

/* ---------------- 调色板（低饱和 6 色 + 方位） ---------------- */
const COLORS=[
  {name:'珊瑚红',body:'#ee786b',top:'#ff9e8d',dark:'#bd4e48',mark:'●'},
  {name:'天空蓝',body:'#54a9d1',top:'#8ad3ec',dark:'#327795',mark:'◆'},
  {name:'柠檬黄',body:'#edbd4d',top:'#ffe491',dark:'#b28b31',mark:'★'},
  {name:'薄荷绿',body:'#71b38b',top:'#a2d9ab',dark:'#45815f',mark:'▲'},
  {name:'葡萄紫',body:'#a38cca',top:'#cbb6e9',dark:'#766195',mark:'✚'},
  {name:'蜜桃橙',body:'#e39757',top:'#ffc88a',dark:'#b3713c',mark:'■'},
];
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const capOf=len=>len===3?8:4;
const dirIndexOf=v=>v.orient==='h'?(v.dir>0?0:2):(v.dir>0?1:3);

/* ---------------- 关卡生成（逆推构造，保证有解） ---------------- */
function generateLevel(n){
  const P=levelParams(n);
  for(let att=0;att<30;att++){
    const rng=mulberry32(seedOf(n)^(att*7919+13));
    const res=tryGen(n,P,rng);
    if(res)return res;
  }
  const rng=mulberry32(seedOf(n)^999);
  return tryGen(n,Object.assign({},P,{nVeh:Math.max(5,Math.floor(P.nVeh*0.6)),obstacles:0}),rng);
}
function tryGen(n,P,rng){
  const {cols,rows}=P;
  const occ=Array.from({length:rows},()=>new Array(cols).fill(null));
  const inB=(x,y)=>x>=0&&x<cols&&y>=0&&y<rows;
  const obstacles=[];
  for(let i=0;i<P.obstacles;i++){
    for(let t=0;t<40;t++){
      const x=1+((rng()*(cols-2))|0),y=1+((rng()*(rows-2))|0);
      if(!inB(x,y)||occ[y][x])continue;
      let near=false;for(const o of obstacles)if(Math.abs(o.x-x)+Math.abs(o.y-y)<2)near=true;
      if(near)continue;
      occ[y][x]='o';obstacles.push({x,y});break;
    }
  }
  const vehicles=[];
  for(let i=0;i<P.nVeh;i++){
    vehicles.push({id:i,color:i%P.colorCount,len:rng()<P.busRatio?3:2,
      orient:rng()<0.5?'h':'v',dir:rng()<0.5?1:-1,x:0,y:0});
  }
  const order=shuffleArr(vehicles.slice(),rng);
  const cx=(cols-1)/2,cy=(rows-1)/2;
  for(const v of order){
    const cands=[];
    const Lv=v.len;
    const xs=v.orient==='h'?cols-Lv+1:cols;
    const ys=v.orient==='h'?rows:rows-Lv+1;
    if(xs<=0||ys<=0)return null;
    for(let y=0;y<ys;y++)for(let x=0;x<xs;x++){
      let ok=true;
      for(let k=0;k<Lv;k++){
        const px=v.orient==='h'?x+k:x,py=v.orient==='h'?y:y+k;
        if(occ[py][px]){ok=false;break;}
      }
      if(!ok)continue;
      const axis=v.orient==='h'?'x':'y';
      const head=v.dir>0?(axis==='x'?x+Lv-1:y+Lv-1):(axis==='x'?x:y);
      let c=head+v.dir,clear=true;
      while(axis==='x'?(c>=0&&c<cols):(c>=0&&c<rows)){
        const px=axis==='x'?c:x,py=axis==='x'?y:c;
        if(occ[py][px]){clear=false;break;}
        c+=v.dir;
      }
      if(!clear)continue;
      const ccx=axis==='x'?x+(Lv-1)/2:x,ccy=axis==='x'?y:y+(Lv-1)/2;
      const score=dist(ccx,ccy,cx,cy)+rng()*2.2;
      cands.push({x,y,score});
    }
    if(!cands.length)return null;
    cands.sort((a,b)=>a.score-b.score);
    v.x=cands[0].x;v.y=cands[0].y;
    for(let k=0;k<Lv;k++){
      const px=v.orient==='h'?v.x+k:v.x,py=v.orient==='h'?v.y:v.y+k;
      occ[py][px]=v;
    }
  }
  return {n,params:P,obstacles,vehicles,par:vehicles.length};
}

/* ---------------- 布局 ---------------- */
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const L={};
let propsH=96,hdrH=0;
function computeLayout(){
  const stage=document.getElementById('stage');
  W=stage.clientWidth;H=stage.clientHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  const hud=document.getElementById('hud');
  hdrH=(hud?hud.offsetHeight:84)+2;
  const bar=document.getElementById('props');
  propsH=(bar?bar.offsetHeight:92)+8;
  // 车站卡片
  L.cardX=10;L.cardY=hdrH+4;L.cardW=W-20;
  L.cardH=158;
  L.queueY=L.cardY+58;
  L.slotsY=L.cardY+80;
  L.slotW=(L.cardW-24-5*8)/6;
  L.slotH=60;
  L.cardBot=L.cardY+L.cardH;
  // 马路
  L.roadY=L.cardBot+8;L.roadH=36;L.roadMid=L.roadY+L.roadH/2;
  // 进度行
  L.progY=L.roadY+L.roadH+24;
  // 等距棋盘区域
  L.boardTop=L.progY+8;
  L.boardBot=H-propsH-6;
  if(G.level)layoutBoard();
  invalidateStatic();
}
function layoutBoard(){
  const {cols,rows}=G.level.params;
  L.u=Math.min((W-20)/(cols+rows+0.4),(L.boardBot-L.boardTop-14)/((cols+rows)*0.58+0.9));
  L.v=L.u*0.58;
  L.ox=W/2+((rows-cols)*L.u)/2;
  L.oy=(L.boardTop+L.boardBot)/2-((cols+rows)*L.v)/2;
}
function project(x,y,z=0){return [L.ox+(x-y)*L.u,L.oy+(x+y)*L.v-(z||0)];}
function slotCenter(i){ // 车位卡片内 miniCar 停靠点（屏幕坐标）
  const x=L.cardX+12+i*(L.slotW+8)+L.slotW/2;
  return {x,y:L.slotsY+L.slotH*0.42};
}

/* ---------------- 游戏状态 ---------------- */
const G={
  level:null,vehicles:[],obstacles:[],queueSeq:[],
  total:0,moves:0,propsUsed:0,
  snapStack:[],hintVid:-1,hintUntil:0,
  selectMode:null,
  deadlockShown:false,winShown:false,started:false,
  n:1,epoch:0,t:0,
  motions:new Map(),   // 棋盘滑动/出场动画 id → motion
  walks:new Map(),     // slot → 上客行走相位
};
function occupancy(){
  const {cols,rows}=G.level.params;
  const g=Array.from({length:rows},()=>new Array(cols).fill(null));
  for(const v of G.vehicles){
    if(v.state!=='idle'&&v.state!=='sliding')continue;
    for(let k=0;k<v.len;k++){
      const px=v.orient==='h'?v.x+k:v.x,py=v.orient==='h'?v.y:v.y+k;
      if(py>=0&&py<g.length&&px>=0&&px<g[0].length)g[py][px]=v;
    }
  }
  for(const o of G.obstacles)if(o.y<g.length&&o.x<g[0].length)g[o.y][o.x]='o';
  return g;
}
function cellsHead(v){
  const {cols,rows}=G.level.params;
  const axis=v.orient==='h'?'x':'y';
  const head=v.dir>0?(axis==='x'?v.x+v.len-1:v.y+v.len-1):(axis==='x'?v.x:v.y);
  const lim=v.dir>0?(axis==='x'?cols-1:rows-1):0;
  const g=occupancy();
  let c=head+v.dir,k=0;
  while(axis==='x'?(c>=0&&c<cols):(c>=0&&c<rows)){
    if(axis==='x'?g[v.y][c]:g[c][v.x])break;
    k++;c+=v.dir;
  }
  const toEdge=Math.abs(lim-head);
  return {k,exitable:k===toEdge};
}
function vehAt(px,py){ // 等距逆投影命中
  const {cols,rows}=G.level.params;
  const a=(px-L.ox)/L.u,b=(py-L.oy)/L.v;
  const gx=Math.floor((a+b)/2),gy=Math.floor((b-a)/2);
  if(gx<0||gy<0||gx>=cols||gy>=rows)return null;
  const v=occupancy()[gy][gx];
  return (v&&v!=='o'&&v.state==='idle')?v:null;
}

/* ---------------- 需求（排队人数 = 未上车座位） ---------------- */
function demandOf(ci){
  let d=0;
  for(const v of G.vehicles)if(v.state!=='gone'&&v.color===ci)d+=capOf(v.len)-v.boarded;
  return d;
}
function demandSum(){let s=0;for(let i=0;i<COLORS.length;i++)s+=demandOf(i);return s;}
function buildQueueSeq(){
  const rng=mulberry32(seedOf(G.n)^4242);
  const pool=[];
  for(const v of G.vehicles)for(let s=0;s<capOf(v.len);s++)pool.push(v.color);
  shuffleArr(pool,rng);
  const out=[];
  while(pool.length){
    const c=pool[0];
    const run=1+(rng()<0.6?1:0)+(rng()<0.35?1:0);
    for(let i=0;i<run;){
      const idx=pool.findIndex(q=>q===c);
      if(idx<0)break;
      out.push(pool.splice(idx,1)[0]);i++;
    }
    if(pool.length)out.push(pool.splice((rng()*pool.length)|0,1)[0]);
  }
  G.queueSeq=out;
}

/* ---------------- 开关一关 ---------------- */
function startLevel(n){
  G.epoch++;
  G.n=n;G.level=generateLevel(n);
  G.obstacles=G.level.obstacles.map(o=>Object.assign({},o));
  G.moves=0;G.propsUsed=0;
  G.snapStack=[];G.hintVid=-1;G.selectMode=null;
  G.deadlockShown=false;G.winShown=false;
  G.motions.clear();G.walks.clear();
  G.vehicles=G.level.vehicles.map(v=>Object.assign({},v,{
    state:'idle',slot:-1,waitIdx:-1,boarded:0,lastBoardAt:0,nextWalk:0}));
  layoutBoard();
  buildQueueSeq();
  G.total=G.vehicles.reduce((s,v)=>s+capOf(v.len),0);
  invalidateStatic();
  save.cur=n;persist();
  updateHud();
  banner('第 '+n+' 关'+(G.level.params.hard?' · 困难':''));
}

/* ---------------- 快照 / 撤销 ---------------- */
function pushSnap(){
  G.snapStack.push({
    vehicles:G.vehicles.map(v=>({id:v.id,state:v.state,slot:v.slot,waitIdx:v.waitIdx,boarded:v.boarded,
      orient:v.orient,dir:v.dir,x:v.x,y:v.y})),
    moves:G.moves,
  });
  if(G.snapStack.length>120)G.snapStack.shift();
}
function undo(){
  const s=G.snapStack.pop();
  if(!s){toast('已经是初始局面啦');return;}
  G.epoch++;G.motions.clear();G.walks.clear();
  for(const sv of s.vehicles){
    const v=G.vehicles.find(w=>w.id===sv.id);if(!v)continue;
    Object.assign(v,sv);
  }
  G.moves=s.moves;
  G.hintVid=-1;G.selectMode=null;G.deadlockShown=false;
  SFX.click();toast('已撤销');updateHud();renderProps();
}

/* ---------------- 核心操作 ---------------- */
function tapVehicle(v){
  if(G.selectMode){applySelect(v);return;}
  if(v.state!=='idle')return;
  const fe=cellsHead(v);
  if(fe.exitable){pushSnap();G.moves++;startExit(v);}
  else if(fe.k>0){pushSnap();G.moves++;startSlide(v,fe.k);}
  else{SFX.bump();return;}
  afterAction();
}
function startSlide(v,k){
  const di=dirIndexOf(v);
  G.motions.set(v.id,{kind:'slide',start:performance.now(),dur:dur(240),
    from:{x:v.x,y:v.y},to:{x:v.x+DIRS[di][0]*k,y:v.y+DIRS[di][1]*k},vid:v.id});
  v.state='sliding';
  SFX.engine();
}
function slotFree(i){
  return !G.vehicles.some(v=>v.slot===i&&['arriving','parked','boarding','waiting','departing'].includes(v.state));
}
function firstFreeSlot(){for(let i=0;i<save.slots;i++)if(slotFree(i))return i;return -1;}
function startExit(v){
  const di=dirIndexOf(v);
  G.motions.set(v.id,{kind:'exit',start:performance.now(),dur:dur(380),
    from:{x:v.x,y:v.y},dir:di,vid:v.id});
  v.state='exiting';
  SFX.engine();
}
function beginArriving(v,now){
  const s=firstFreeSlot();
  const end=project(v.exitEnd[0]+0.5,v.exitEnd[1]+0.5);
  if(s<0){
    v.state='waiting';
    v.waitIdx=G.vehicles.filter(w=>w.state==='waiting').length;
    v.roadPos={x:-64-v.waitIdx*54,y:L.roadMid-13};
    return;
  }
  v.slot=s;v.state='arriving';
  const c=slotCenter(s);
  const side=end[0]<W/2?16:W-16;
  const path=[[end[0],end[1]],[side,clamp(end[1],L.roadY+34,L.boardBot-10)],[side,L.roadMid],[c.x,L.roadMid],[c.x,c.y]];
  v.arrive={start:now,dur:dur(880),path};
  SFX.engine();
}
function promoteWaiting(now){
  const w=G.vehicles.filter(v=>v.state==='waiting').sort((a,b)=>a.waitIdx-b.waitIdx)[0];
  if(!w)return;
  const s=firstFreeSlot();if(s<0)return;
  w.slot=s;w.state='arriving';
  const c=slotCenter(s);
  w.arrive={start:now,dur:dur(760),path:[[w.roadPos.x+27,w.roadPos.y+13],[c.x,L.roadMid],[c.x,c.y]]};
  SFX.engine();
}
function startDepart(v,now){
  v.state='departing';
  const c=slotCenter(v.slot);
  v.depart={start:now,dur:dur(560),path:[[c.x,c.y],[c.x,L.roadMid],[W+72,L.roadMid]]};
  SFX.leave();
}

/* ---------------- 每帧更新 ---------------- */
function update(now){
  G.t=now/1000;
  // 棋盘滑动/出场动画收尾
  for(const m of [...G.motions.values()]){
    if(now-m.start>=m.dur){
      G.motions.delete(m.vid);
      const v=G.vehicles.find(w=>w.id===m.vid);
      if(v){
        if(m.kind==='slide'){
          v.x=m.to.x;v.y=m.to.y;v.state='idle';SFX.bump();
        }else{
          const di=m.dir;
          v.exitEnd=[v.x+DIRS[di][0]*(v.len+0.6),v.y+DIRS[di][1]*(v.len+0.6)];
          beginArriving(v,now);
        }
      }
    }
  }
  // 驶入完成 → 停靠 → 开始上客
  for(const v of G.vehicles){
    if(v.state==='arriving'&&now-v.arrive.start>=v.arrive.dur){
      v.state='parked';v.lastBoardAt=now;SFX.park();
    }
    if(v.state==='parked'&&now-v.lastBoardAt>=dur(220)+60){
      v.state='boarding';
    }
  }
  // 上客调度：每车位同时最多一人
  for(const v of G.vehicles){
    if(v.state!=='boarding')continue;
    const cap=capOf(v.len);
    if(G.walks.has('s'+v.slot))continue;
    if(v.boarded>=cap){
      if(now-(v.lastBoardAt||0)>=dur(320)){
        startDepart(v,now);
      }
      continue;
    }
    if(demandOf(v.color)<=0)continue;
    v.nextWalk=v.nextWalk||now;
    if(now-v.nextWalk>=dur(380)&&now-(v.lastBoardAt||0)>=dur(380)){
      const idx=G.queueSeq.indexOf(v.color);
      if(idx>=0)G.queueSeq.splice(idx,1);
      G.walks.set('s'+v.slot,{start:now,dur:dur(430),color:v.color,vid:v.id});
      v.nextWalk=now;
    }
  }
  // 行走完成 → 上车
  for(const [key,wk] of [...G.walks.entries()]){
    if(now-wk.start>=wk.dur){
      G.walks.delete(key);
      const v=G.vehicles.find(w=>w.id===wk.vid);
      if(v&&v.state==='boarding'){v.boarded++;v.lastBoardAt=now;SFX.seat();}
      checkWin();
    }
  }
  // 驶离完成
  for(const v of G.vehicles){
    if(v.state==='departing'&&now-v.depart.start>=v.depart.dur){
      v.state='gone';v.slot=-1;
      promoteWaiting(now);
      checkWin();
    }
  }
  checkDeadlock();
}
function checkWin(){
  if(G.winShown)return;
  const allGone=G.vehicles.every(v=>v.state==='gone');
  if(allGone&&demandSum()===0&&G.walks.size===0){
    G.winShown=true;SFX.win();
    setTimeout(showWin,650);
  }
}
function checkDeadlock(){
  if(G.winShown||G.deadlockShown||!G.started)return;
  const board=G.vehicles.filter(v=>v.state==='idle');
  if(!board.length)return;
  const anyMove=board.some(v=>{const fe=cellsHead(v);return fe.exitable||fe.k>0;});
  if(anyMove)return;
  G.deadlockShown=true;SFX.dead();
  showModal(`<h2>堵死啦！</h2><div class="txt">所有车都动不了了\n用道具救场，或者重开本关</div>
    <div class="btnrow">
      <button class="btn warn" onclick="useProp('shuffle')">用刷新道具重排</button>
      <button class="btn sec" onclick="useProp('undo')">撤销上一步</button>
      <button class="btn pri" onclick="restartLevel()">重开本关</button>
    </div>`);
}

function useProp(key){
  if(G.selectMode===key){G.selectMode=null;renderProps();return;}
  if(save.props[key]<=0){
    const price=PROP_META[key].price;
    if(save.coins>=price){save.coins-=price;save.props[key]=1;persist();SFX.coin();toast('购买成功 -'+price+'金币');renderProps();updateHud();}
    else{toast('金币不足（还差 '+(price-save.coins)+'）');SFX.bump();}
    return;
  }
  if(key==='hint'){
    const v=bestHint();if(!v){toast('没有能动的车了…试试刷新');return;}
    save.props.hint--;G.propsUsed++;G.hintVid=v.id;G.hintUntil=G.t+3;
    SFX.click();toast(feMsg(v));
  }else if(key==='undo'){
    save.props.undo--;G.propsUsed++;undo();
  }else if(key==='flip'||key==='remove'){
    G.selectMode=key;SFX.click();toast(key==='flip'?'点选一辆车，调头 180°':'点选一辆车，直接送它去接客');
  }else if(key==='shuffle'){
    save.props.shuffle--;G.propsUsed++;doShuffle();
  }
  persist();renderProps();updateHud();hideModal();
}
window.useProp=useProp;
function feMsg(v){const fe=cellsHead(v);return fe.exitable?'这辆车可以出场！':'这辆可以往前挪，先腾腾路';}
function bestHint(){
  const idle=G.vehicles.filter(v=>v.state==='idle');
  let best=null,bs=-1;
  for(const v of idle){
    const fe=cellsHead(v);
    if(fe.exitable){
      const d=demandOf(v.color);
      if(d>bs){bs=d;best=v;}
    }
  }
  if(best)return best;
  for(const v of idle){const fe=cellsHead(v);if(fe.k>0&&fe.k>bs){bs=fe.k;best=v;}}
  return best;
}
function applySelect(v){
  if(v.state!=='idle'){toast('这辆车现在选不了');return;}
  const key=G.selectMode;G.selectMode=null;
  if(save.props[key]<=0){renderProps();return;}
  save.props[key]--;G.propsUsed++;pushSnap();
  if(key==='flip'){v.dir*=-1;SFX.click();toast('已调头');}
  else if(key==='remove'){startExit(v);G.moves++;toast('已送出，乘客直接上车');}
  persist();renderProps();afterAction();
}
function doShuffle(){
  const board=G.vehicles.filter(v=>v.state==='idle');
  if(!board.length){toast('场上没有车了');return;}
  const rng=mulberry32((seedOf(G.n)^((Math.random()*1e9)|0))>>>0);
  const {cols,rows}=G.level.params;
  for(let round=0;round<8;round++){
    const occ=Array.from({length:rows},()=>new Array(cols).fill(null));
    for(const o of G.obstacles)occ[o.y][o.x]='o';
    const order=shuffleArr(board.slice(),rng);
    let ok=true;
    for(const v of order){
      let done=false;
      for(let t=0;t<80&&!done;t++){
        const orient=rng()<0.5?'h':'v',dir=rng()<0.5?1:-1;
        const xs=orient==='h'?cols-v.len+1:cols,ys=orient==='h'?rows:rows-v.len+1;
        if(xs<=0||ys<=0)continue;
        const x=(rng()*xs)|0,y=(rng()*ys)|0;
        let fit=true;
        for(let k=0;k<v.len;k++){const px=orient==='h'?x+k:x,py=orient==='h'?y:y+k;if(occ[py][px]){fit=false;break;}}
        if(!fit)continue;
        const axis=orient==='h'?'x':'y';
        const head=dir>0?(axis==='x'?x+v.len-1:y+v.len-1):(axis==='x'?x:y);
        let c=head+dir,clear=true;
        while(axis==='x'?(c>=0&&c<cols):(c>=0&&c<rows)){
          const px=axis==='x'?c:x,py=axis==='x'?y:c;
          if(occ[py][px]){clear=false;break;}c+=dir;
        }
        if(!clear)continue;
        v.orient=orient;v.dir=dir;v.x=x;v.y=y;
        for(let k=0;k<v.len;k++){const px=orient==='h'?x+k:x,py=orient==='h'?y:y+k;occ[py][px]=v;}
        done=true;
      }
      if(!done){ok=false;break;}
    }
    if(ok){
      SFX.engine();toast('重新排好啦，依然保证有解');
      afterAction();return;
    }
  }
  toast('这次没排开，稍后再试');
  G.propsUsed--;save.props.shuffle++;
}
function afterAction(){
  G.hintVid=-1;G.deadlockShown=false;
  updateHud();renderProps();
}

/* ---------------- 胜利 / 结算 ---------------- */
function calcStars(){
  const par=G.level.par;
  if(G.moves<=par&&G.propsUsed===0)return 3;
  if(G.moves<=Math.ceil(par*1.6)||G.propsUsed<=1)return 2;
  return 1;
}
function showWin(){
  const stars=calcStars();
  const hard=G.level.params.hard;
  let coins=(20+stars*10)*(hard?2:1);
  const first3=stars===3&&save.stars[G.n]!==3;
  if(first3)coins+=20;
  save.coins+=coins;
  save.stars[G.n]=Math.max(save.stars[G.n]||0,stars);
  save.lv=Math.max(save.lv,G.n+1);
  persist();updateHud();SFX.coin();
  const starStr='★'.repeat(stars)+'<span class="dim">'+'★'.repeat(3-stars)+'</span>';
  showModal(`<h2>通关啦！</h2><div class="stars">${starStr}</div>
    <div class="coin">金币 +${coins}${hard?'（困难 ×2）':''}${first3?'（首次三星 +20）':''}</div>
    <div class="txt">步数 ${G.moves} / 参考 ${G.level.par}　道具 ${G.propsUsed} 个</div>
    <div class="btnrow">
      <button class="btn pri" onclick="nextLevel()">下一关 →</button>
      <button class="btn sec" onclick="restartLevel()">再玩一次</button>
    </div>`);
  window.__win=true;
}
function nextLevel(){hideModal();startLevel(G.n+1);}
function restartLevel(){hideModal();startLevel(G.n);}

/* ================= 渲 染 ================= */
function polygon(c,pts,fill,stroke,width){
  c.beginPath();
  pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
  c.closePath();
  if(fill){c.fillStyle=fill;c.fill();}
  if(stroke){c.strokeStyle=stroke;c.lineWidth=width||1;c.stroke();}
}
function plane(c,x,y,w,h,z,fill,stroke){
  const ps=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]].map(p=>project(p[0],p[1],z));
  polygon(c,ps,fill,stroke);
  return ps;
}
function box(c,x,y,w,h,z,top,side,front){
  const p=(a,b,hh)=>project(a,b,hh);
  polygon(c,[p(x+w,y,1),p(x+w,y+h,1),p(x+w,y+h,z),p(x+w,y,z)],side);
  polygon(c,[p(x,y+h,1),p(x+w,y+h,1),p(x+w,y+h,z),p(x,y+h,z)],front);
  return plane(c,x,y,w,h,z,top);
}
/* ---- 静态层缓存：车站/马路/棋盘地台只画一次 ---- */
let topCv=null,boardCv=null,staticDirty=true;
function invalidateStatic(){staticDirty=true;}
function render(now){
  if(staticDirty||!topCv||!boardCv||topCv.width!==cv.width)buildStatic();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(topCv,0,0);
  ctx.drawImage(boardCv,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawStationDynamic(ctx,now);
  drawRoadDynamic(ctx,now);
  drawBoardDynamic(ctx,now);
}
function buildStatic(){
  if(!topCv)topCv=document.createElement('canvas');
  topCv.width=cv.width;topCv.height=cv.height;
  const c=topCv.getContext('2d');
  c.setTransform(DPR,0,0,DPR,0,0);
  c.fillStyle='#eef0e2';c.fillRect(0,0,W,H);
  drawStationCardStatic(c);
  if(!boardCv)boardCv=document.createElement('canvas');
  boardCv.width=cv.width;boardCv.height=cv.height;
  const b=boardCv.getContext('2d');
  b.setTransform(DPR,0,0,DPR,0,0);
  drawBoardStatic(b);
  staticDirty=false;
}
/* ---- 车站卡片（静态壳） ---- */
function drawStationCardStatic(c){
  const x=L.cardX,y=L.cardY,w=L.cardW,h=L.cardH;
  c.save();
  c.shadowColor='#4a5a4220';c.shadowBlur=10;c.shadowOffsetY=3;
  c.fillStyle='#fdfef8';
  c.beginPath();c.roundRect(x,y,w,h,16);c.fill();
  c.restore();
  c.strokeStyle='#e0e4d2';c.lineWidth=1.2;
  c.beginPath();c.roundRect(x,y,w,h,16);c.stroke();
  c.fillStyle='#7d9078';c.beginPath();c.arc(x+18,y+17,3,0,7);c.fill();
  c.fillStyle='#2f3b32';c.font='800 13px system-ui';c.textAlign='left';c.textBaseline='alphabetic';
  c.fillText('\u597d\u5fc3\u60c5\u63a5\u5ba2\u7ad9',x+27,y+21);
  c.fillStyle='#9aa58e';c.font='800 8px system-ui';
  c.fillText('B U S   S T O P',x+27+c.measureText('\u597d\u5fc3\u60c5\u63a5\u5ba2\u7ad9').width+34,y+20);
  c.font='600 10px system-ui';c.fillStyle='#9aa58e';c.textAlign='right';
  c.fillText('\u4eba\u7b49\u8f66',x+w-12,y+22);
  c.textAlign='left';
  c.strokeStyle='#e8ebdb';c.lineWidth=1;
  c.beginPath();c.moveTo(x+12,L.slotsY-10);c.lineTo(x+w-12,L.slotsY-10);c.stroke();
  for(let i=0;i<6;i++){
    const sx=x+12+i*(L.slotW+8),sy=L.slotsY;
    const unlocked=i<save.slots;
    c.fillStyle=unlocked?'#fbfcf3':'#e7ead9';
    c.beginPath();c.roundRect(sx,sy,L.slotW,L.slotH,9);c.fill();
    c.strokeStyle=unlocked?'#dfe3d0':'#cdd3bd';c.lineWidth=1.2;
    c.beginPath();c.roundRect(sx,sy,L.slotW,L.slotH,9);c.stroke();
    if(!unlocked){
      c.strokeStyle='#aab39a';c.lineWidth=2.4;
      c.beginPath();c.arc(sx+L.slotW/2,sy+17,6,Math.PI,0);c.stroke();
      c.fillStyle='#aab39a';
      c.beginPath();c.roundRect(sx+L.slotW/2-8.5,sy+17,17,13,3);c.fill();
      c.fillStyle='#fdfef8';c.beginPath();c.arc(sx+L.slotW/2,sy+23.5,2,0,7);c.fill();
      c.fillStyle='#8f987f';c.font='700 9px system-ui';c.textAlign='center';
      c.fillText(i===4?'150 \u91d1\u5e01':'300 \u91d1\u5e01',sx+L.slotW/2,sy+L.slotH-8);
    }
  }
  c.fillStyle='#7d9078';c.beginPath();c.arc(x+16,y+h-12,2.5,0,7);c.fill();
  c.fillStyle='#5c685a';c.font='600 10px system-ui';c.textAlign='left';
  c.fillText('\u540c\u8272\u4e0a\u8f66 \u00b7 \u6ee1\u5458\u51fa\u53d1',x+24,y+h-8);
  if(save.slots<6){
    c.textAlign='right';c.fillStyle='#9aa58e';
    c.fillText('+ \u589e\u52a0\u8f66\u4f4d '+(save.slots===4?'150':'300')+' \u25cf',x+w-12,y+h-8);
  }
  // \u9a6c\u8def
  c.fillStyle='#b6c5ab';c.fillRect(0,L.roadY,W,L.roadH);
  c.fillStyle='#a3b497';c.fillRect(0,L.roadY+L.roadH-3,W,3);
  c.fillStyle='rgba(255,255,255,.75)';
  for(let rx2=10;rx2<W;rx2+=34)c.fillRect(rx2,L.roadMid-1.4,16,2.8);
  c.fillStyle='rgba(255,255,255,.9)';
  c.font='800 8px system-ui';c.textAlign='center';
  c.fillText('O N E   C O L O R  \u00b7  O N E   H A P P Y   R I D E .',W/2,L.roadY+12);
  // \u8fdb\u5ea6\u884c\u58f3
  c.fillStyle='#7d9078';c.beginPath();c.arc(18,L.progY,2.5,0,7);c.fill();
  const bw=W*0.28;
  c.fillStyle='#dde1cf';
  c.beginPath();c.roundRect(W-bw-50,L.progY-3.5,bw,7,3.5);c.fill();
  c.textAlign='left';
}
/* ---- 车站动态元素 ---- */
function drawStationDynamic(c,now){
  const x=L.cardX,y=L.cardY,w=L.cardW;
  c.textAlign='right';
  c.fillStyle='#2f3b32';c.font='900 18px system-ui';
  c.fillText(String(demandSum()),x+w-56,y+22);
  // 队列小人（大号）
  const capN=Math.floor((w-96)/16);
  const qn=Math.min(G.queueSeq.length,capN);
  c.fillStyle='#9aa58e';c.font='700 8px system-ui';c.textAlign='left';
  c.fillText('\u961f\u9996',x+12,L.queueY+6);
  c.strokeStyle='#b9c2a8';c.lineWidth=1;
  c.beginPath();c.moveTo(x+21,L.queueY-5);c.lineTo(x+21,L.queueY+8);c.stroke();
  c.beginPath();c.moveTo(x+18,L.queueY-2);c.lineTo(x+21,L.queueY-5);c.lineTo(x+24,L.queueY-2);c.stroke();
  for(let i=0;i<qn;i++)drawPerson(c,x+36+i*16,L.queueY-2,G.queueSeq[i],1,0);
  if(G.queueSeq.length>qn){
    c.fillStyle='#9aa58e';c.font='800 11px system-ui';
    c.fillText('\u2026',x+36+qn*16,L.queueY+2);
  }
  // 停靠 miniCar / 驶入 / 驶离
  for(const v of G.vehicles){
    if(v.slot<0)continue;
    if(!['arriving','parked','boarding','departing'].includes(v.state))continue;
    const ct=slotCenter(v.slot);
    const cw=L.slotW*0.86,ch=28;
    if(v.state==='arriving'&&v.arrive){
      const t=clamp((now-v.arrive.start)/v.arrive.dur,0,1);
      const ease=1-Math.pow(1-t,1.6);
      const pos=alongPath(v.arrive.path,ease);
      c.save();c.translate(pos[0],pos[1]);c.rotate(pos[2]-Math.PI/2);
      drawMiniCar(c,v.color,-cw/2,-ch/2,cw,ch,{});
      c.restore();
    }else if(v.state==='departing'&&v.depart){
      const t=clamp((now-v.depart.start)/v.depart.dur,0,1);
      const pos=alongPath(v.depart.path,t*t);
      c.save();c.translate(pos[0],pos[1]);c.rotate(pos[2]-Math.PI/2);
      drawMiniCar(c,v.color,-cw/2,-ch/2,cw,ch,{});
      c.restore();
    }else{
      const doorOpen=v.state==='boarding'&&G.walks.has('s'+v.slot);
      drawMiniCar(c,v.color,ct.x-cw/2,ct.y-ch/2,cw,ch,{door:doorOpen});
      c.fillStyle='#5c685a';c.font='700 9px system-ui';c.textAlign='center';
      const sx=x+12+v.slot*(L.slotW+8)+L.slotW/2;
      const stTxt=v.state==='boarding'?('\u4e0a\u5ba2\u4e2d '+v.boarded+'/'+capOf(v.len)):'\u505c\u9760\u4e2d';
      c.fillText(stTxt,sx,L.slotsY+L.slotH-7);
    }
  }
  // 行走中的乘客（大号）
  for(const wk of G.walks.values()){
    const t=clamp((now-wk.start)/wk.dur,0,1);
    const pos=alongPath(walkPath(wk.slot),t);
    drawPerson(c,pos[0],pos[1],wk.color,1.08,Math.sin(t*Math.PI*8));
  }
  c.textAlign='left';
}
function walkPath(slot){
  const ct=slotCenter(slot);
  const sx=L.cardX+38;
  return [[sx,L.queueY-2],[sx+36,L.queueY+10],[ct.x-8,L.slotsY+L.slotH+4],[ct.x-4,ct.y+12]];
}
function alongPath(points,t){
  const lengths=points.slice(1).map((p,i)=>Math.hypot(p[0]-points[i][0],p[1]-points[i][1]));
  let travel=lengths.reduce((a,b)=>a+b,0)*clamp(t,0,1);
  for(let i=0;i<lengths.length;i++){
    if(travel<=lengths[i]||i===lengths.length-1){
      const f=lengths[i]?travel/lengths[i]:0;
      return [
        points[i][0]+(points[i+1][0]-points[i][0])*f,
        points[i][1]+(points[i+1][1]-points[i][1])*f,
        Math.atan2(points[i+1][1]-points[i][1],points[i+1][0]-points[i][0])+Math.PI/2,
      ];
    }
    travel-=lengths[i];
  }
  return [points[0][0],points[0][1],0];
}
/* ---- 马路动态 ---- */
function drawRoadDynamic(c,now){
  let wi=0;
  for(const v of G.vehicles){
    if(v.state!=='waiting')continue;
    drawMiniCar(c,v.color,-52-wi*54,L.roadY+6,L.slotW*0.78,24,{});
    wi++;
  }
  const leftCount=G.vehicles.filter(v=>v.state==='idle').length;
  c.fillStyle='#3c4a3a';c.font='800 12px system-ui';c.textAlign='left';
  c.fillText(leftCount+' \u8f86\u5f85\u51fa\u53d1',28,L.progY+4);
  const served=G.total?1-demandSum()/G.total:0;
  const bw=W*0.28;
  if(served>0){c.fillStyle='#7d9078';c.beginPath();c.roundRect(W-bw-50,L.progY-3.5,bw*clamp(served,0,1),7,3.5);c.fill();}
  c.fillStyle='#3c4a3a';c.font='800 11px system-ui';c.textAlign='right';
  c.fillText(Math.round(served*100)+'%',W-14,L.progY+4);
  c.textAlign='left';
}
/* ---- 棋盘静态地台 ---- */
function drawBoardStatic(c){
  const s=G.level.params;
  plane(c,-0.35,-0.35,s.cols+0.7,s.rows+0.7,-7,'#bed0b953');
  box(c,-0.18,-0.18,s.cols+0.36,s.rows+0.36,0,'#d3ddce','#b7c8b1','#becfb7');
  plane(c,0,0,s.cols,s.rows,1,'#dce3d5','#eef2e6');
  c.save();
  c.setLineDash([3,5]);c.lineWidth=0.75;c.strokeStyle='#f6f8eb';
  for(let x=1;x<s.cols;x++){
    c.beginPath();c.moveTo(...project(x,0,1));c.lineTo(...project(x,s.rows,1));c.stroke();
  }
  for(let y=1;y<s.rows;y++){
    c.beginPath();c.moveTo(...project(0,y,1));c.lineTo(...project(s.cols,y,1));c.stroke();
  }
  c.restore();
  for(let i=0;i<4;i++){
    plane(c,s.cols*0.5-0.5+i*0.27,-0.18,0.13,0.36,2,'#f7f5dd');
    plane(c,s.cols*0.5-0.5+i*0.27,s.rows-0.18,0.13,0.36,2,'#f7f5dd');
  }
  drawTree(c,-0.75,0.5,0.8);
  drawTree(c,s.cols+0.65,s.rows-1,0.7);
  const [px,py]=project(-0.7,s.rows-1);
  c.save();c.translate(px,py);
  c.fillStyle='#bdc9af';c.fillRect(-1,-24,2,24);
  c.fillStyle='#91aa92';c.beginPath();c.roundRect(-8,-33,16,16,3);c.fill();
  c.font='bold 11px sans-serif';c.fillStyle='#f6f8ec';c.textAlign='center';
  c.fillText('P',0,-21);
  c.restore();
  for(const o of G.obstacles){
    const p=project(o.x+0.5,o.y+0.5);
    c.fillStyle='#a9a08c';
    c.beginPath();c.ellipse(p[0],p[1]+3,L.u*0.24,L.u*0.13,0,0,7);c.fill();
    c.fillStyle='#c9b7a0';
    c.beginPath();c.roundRect(p[0]-L.u*0.19,p[1]-L.u*0.3,L.u*0.38,L.u*0.34,4);c.fill();
    c.fillStyle='#efe4d2';
    c.beginPath();c.roundRect(p[0]-L.u*0.19,p[1]-L.u*0.3,L.u*0.38,L.u*0.14,3);c.fill();
  }
}
/* ---- 棋盘动态：车辆/动画 ---- */
function drawBoardDynamic(c,now){
  const s=G.level.params;
  for(const v of G.vehicles){
    if(v.state!=='idle')continue;
    const horizontal=v.orient==='h';
    plane(c,v.x+0.03,v.y+0.03,horizontal?v.len-0.06:0.94,horizontal?0.94:v.len-0.06,1.2,null,'#fffdf0');
  }
  const cars=G.vehicles.filter(v=>v.state==='idle'&&!G.motions.has(v.id)).sort((a,b)=>a.x+a.y-(b.x+b.y));
  for(const v of cars){
    const active=(G.hintVid===v.id&&G.t<G.hintUntil)||G.selectMode!==null;
    drawCarIso(v,{highlight:active});
  }
  for(const m of G.motions.values()){
    const v=G.vehicles.find(w=>w.id===m.vid);if(!v)continue;
    const t=clamp((now-m.start)/m.dur,0,1);
    const ease=1-Math.pow(1-t,3);
    const ghost=Object.assign({},v);
    if(m.kind==='slide'){
      ghost.x=lerp(m.from.x,m.to.x,ease);
      ghost.y=lerp(m.from.y,m.to.y,ease);
      const shake=Math.sin(t*Math.PI*6)*(1-t)*0.08;
      ghost.x+=shake;ghost.y+=shake;
      drawCarIso(ghost,{ghost:true});
    }else{
      const distance=v.len+1.2;
      ghost.x=m.from.x+DIRS[m.dir][0]*distance*t*t;
      ghost.y=m.from.y+DIRS[m.dir][1]*distance*t*t;
      c.save();
      c.globalAlpha=1-Math.max(0,t-0.65)/0.35;
      drawCarIso(ghost,{ghost:true});
      c.restore();
      const p=project(ghost.x+(v.orient==='h'?v.len/2:0.5),ghost.y+(v.orient==='v'?v.len/2:0.5));
      c.fillStyle='#fffcee80';
      for(let i=0;i<5;i++){
        c.beginPath();c.arc(p[0]-i*5,p[1]+i*3,2+i*0.5,0,7);c.fill();
      }
    }
  }
  const q=new URLSearchParams(location.search);
  if(q.get('debug')==='1'){
    c.strokeStyle='rgba(90,140,90,.9)';c.lineWidth=2;
    for(const v of G.vehicles){
      if(v.state!=='idle')continue;
      if(cellsHead(v).exitable)plane(c,v.x-0.02,v.y-0.02,(v.orient==='h'?v.len:1)+0.04,(v.orient==='v'?v.len:1)+0.04,2,null,'#5a8c5a');
    }
  }
}
function drawTree(c,x,y,size){
  const [px,py]=project(x,y);
  c.save();c.translate(px,py);
  c.fillStyle='#9eb49c35';
  c.beginPath();c.ellipse(3,5,13*size,6*size,0,0,7);c.fill();
  c.fillStyle='#adad8e';c.fillRect(-2,-15*size,4,18*size);
  c.fillStyle='#8fac89';
  c.beginPath();c.ellipse(0,-20*size,11*size,15*size,-0.2,0,7);c.fill();
  c.fillStyle='#abc39b';
  c.beginPath();c.ellipse(-4*size,-25*size,7*size,10*size,-0.2,0,7);c.fill();
  c.restore();
}
/* ---- 等距车辆（加高座舱，无 shadowBlur） ---- */
function drawCarIso(v,options={}){
  const c=ctx,color=COLORS[v.color],horizontal=v.orient==='h';
  const x=v.x+0.12,y=v.y+0.12;
  const w=horizontal?v.len-0.24:0.76,h=horizontal?0.76:v.len-0.24;
  const z=Math.max(9,L.u*0.52),roof=Math.max(16,L.u*1.08);
  const p=(a,b,hh)=>project(a,b,hh);
  // 软阴影（不用 shadowBlur，手机性能友好）
  plane(c,x+0.1,y+0.16,w,h,0,'#3c554038');
  if(options.highlight){
    plane(c,x-0.06,y-0.06,w+0.12,h+0.12,1,'#fff0a8','#fffbd5');
  }
  box(c,x,y,w,h,z,color.top,color.dark,color.body);
  polygon(c,[p(x,y+h,1),p(x+w,y+h,1),p(x+w,y+h,3),p(x,y+h,3)],color.dark);
  const forward=v.dir<2;
  const baseX=horizontal?x+w*0.16:x+0.05,baseY=horizontal?y+0.05:y+h*0.16;
  const baseW=horizontal?w*0.68:w-0.1,baseH=horizontal?h-0.1:h*0.68;
  const rx=baseX+(horizontal?w*0.06:0.05),ry=baseY+(horizontal?0.05:h*0.06);
  const rw=baseW-(horizontal?w*0.12:0.1),rh=baseH-(horizontal?0.1:h*0.12);
  const bottom=[p(baseX,baseY,z),p(baseX+baseW,baseY,z),p(baseX+baseW,baseY+baseH,z),p(baseX,baseY+baseH,z)];
  const top=[p(rx,ry,roof),p(rx+rw,ry,roof),p(rx+rw,ry+rh,roof),p(rx,ry+rh,roof)];
  polygon(c,[bottom[1],bottom[2],top[2],top[1]],'#355963');
  polygon(c,[bottom[3],bottom[2],top[2],top[3]],'#517d87');
  polygon(c,[bottom[0],bottom[1],top[1],top[0]],'#759c9f');
  polygon(c,[bottom[0],bottom[3],top[3],top[0]],'#688f98');
  c.strokeStyle=color.body;c.lineWidth=1.8;
  for(let i=0;i<4;i++){
    c.beginPath();c.moveTo(...bottom[i]);c.lineTo(...top[i]);c.stroke();
  }
  const midA=horizontal?p(baseX+baseW*0.53,baseY+baseH,z):p(baseX+baseW,baseY+baseH*0.53,z);
  const midB=horizontal?p(rx+rw*0.53,ry+rh,roof):p(rx+rw,ry+rh*0.53,roof);
  c.beginPath();c.moveTo(...midA);c.lineTo(...midB);c.stroke();
  polygon(c,top,color.top,'#ffffff45');
  plane(c,rx+0.03,ry+0.03,Math.max(0.1,rw-0.06),Math.max(0.1,rh-0.06),roof+0.2,color.body);
  for(const t of [0.22,0.78]){
    const q=p(horizontal?x+w*t:x+w,horizontal?y+h:y+h*t,1);
    c.fillStyle='#24373c';
    c.beginPath();c.ellipse(q[0],q[1],3.2,4.6,-0.3,0,7);c.fill();
    c.fillStyle='#aebbbb';
    c.beginPath();c.ellipse(q[0],q[1],1.4,2.4,-0.3,0,7);c.fill();
  }
  const frontX=horizontal?(forward?x+w-0.08:x+0.02):x+0.04;
  const frontY=horizontal?y+0.04:forward?y+h-0.08:y+0.02;
  for(const t of [0,0.52])
    plane(c,frontX+(horizontal?0:t),frontY+(horizontal?t:0),horizontal?0.06:0.13,horizontal?0.13:0.06,z+0.5,'#fff3bb');
  const center=[rx+rw/2,ry+rh/2],[dx,dy]=DIRS[dirIndexOf(v)];
  const tail=p(center[0]-dx*0.22,center[1]-dy*0.22,roof+1);
  const head=p(center[0]+dx*0.25,center[1]+dy*0.25,roof+1);
  c.save();
  c.lineCap='round';c.lineJoin='round';
  const a=Math.atan2(head[1]-tail[1],head[0]-tail[0]);
  const arrow=()=>{
    c.beginPath();
    c.moveTo(...tail);c.lineTo(...head);
    c.moveTo(head[0]-4*Math.cos(a-0.7),head[1]-4*Math.sin(a-0.7));
    c.lineTo(...head);
    c.lineTo(head[0]-4*Math.cos(a+0.7),head[1]-4*Math.sin(a+0.7));
    c.stroke();
  };
  c.strokeStyle='#35555b77';c.lineWidth=3.4;arrow();
  c.strokeStyle='#fffef5';c.lineWidth=1.8;arrow();
  c.restore();
}
/* ---- 侧视 miniCar（无 shadowBlur） ---- */
function drawMiniCar(c,ci,x,y,w,h,opt={}){
  const color=COLORS[ci];
  c.save();
  if(opt.alpha!==undefined)c.globalAlpha=opt.alpha;
  const rrd=(a,b,ww,hh,r,fill)=>{
    c.fillStyle=fill;
    c.beginPath();c.roundRect(a,b,ww,hh,r);c.fill();
  };
  rrd(x+2,y+5,w,h,7,'#38564322');
  rrd(x-2,y+h*0.17,5,11,2,'#293e42');
  rrd(x+w-3,y+h*0.17,5,11,2,'#293e42');
  rrd(x-2,y+h*0.7,5,10,2,'#293e42');
  rrd(x+w-3,y+h*0.7,5,10,2,'#293e42');
  rrd(x,y+4,w,h-1,7,color.dark);
  rrd(x,y,w,h-2,7,color.body);
  rrd(x+1,y-2,w-2,h-5,7,color.top);
  rrd(x+4,y+h*0.15,w-8,h*0.63,4,'#426d78');
  rrd(x+6,y+h*0.24-3,w-12,h*0.38,4,color.dark);
  rrd(x+5,y+h*0.24-5,w-10,h*0.38,4,color.top);
  c.strokeStyle='#ffffff55';c.lineWidth=1;
  c.beginPath();c.moveTo(x+7,y+h*0.18);c.lineTo(x+w-6,y+h*0.2);c.stroke();
  rrd(x+3,y+1,5,3,1,'#fff6c5');
  rrd(x+w-8,y+1,5,3,1,'#fff6c5');
  rrd(x+3,y+h-7,4,2,1,'#d45048');
  rrd(x+w-7,y+h-7,4,2,1,'#d45048');
  c.fillStyle='#ffffff';
  c.font='bold 11px sans-serif';c.textAlign='center';
  c.fillText(color.mark,x+w/2,y+h*0.48);
  if(opt.door){
    c.fillStyle=color.body;
    c.beginPath();
    c.moveTo(x,y+h*0.35);
    c.lineTo(x-9,y+h*0.42);
    c.lineTo(x-9,y+h*0.64);
    c.lineTo(x,y+h*0.58);
    c.closePath();c.fill();
    c.strokeStyle=color.dark;c.lineWidth=1;c.stroke();
  }
  c.restore();
}
/* ---- 小人（默认更大） ---- */
function drawPerson(c,x,y,ci,scale=1,walk=0){
  const palette=COLORS[ci];
  c.save();
  c.translate(x,y);
  c.scale(scale,scale);
  c.fillStyle='#516d5725';
  c.beginPath();c.ellipse(1,8,5.5,2.2,0,0,7);c.fill();
  c.strokeStyle=palette.dark;c.lineWidth=2.8;c.lineCap='round';
  c.beginPath();
  c.moveTo(-2.2,3);c.lineTo(-2.2-walk*2.4,7.5);
  c.moveTo(2.2,3);c.lineTo(2.2+walk*2.4,7.5);
  c.stroke();
  c.fillStyle=palette.body;
  c.beginPath();c.roundRect(-4.6,-3.5,9.2,9,3.6);c.fill();
  c.fillStyle=palette.top;
  c.beginPath();c.arc(0,-7.6,4.4,0,7);c.fill();
  c.fillStyle=palette.dark;
  c.fillRect(0,-9.8,1.6,1.6);
  c.restore();
}

/* ---------------- 输入 ---------------- */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();SFX.unlock();
  if(!G.started)return;
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  for(let i=save.slots;i<6;i++){
    const sx=L.cardX+12+i*(L.slotW+8);
    if(x>=sx&&x<=sx+L.slotW&&y>=L.slotsY&&y<=L.slotsY+L.slotH){buySlot(i);return;}
  }
  const v=vehAt(x,y);
  if(!v&&G.selectMode){G.selectMode=null;renderProps();return;}
  if(v)tapVehicle(v);
},{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function buySlot(i){
  if(save.slots>i)return;
  const price=i===4?150:300;
  showModal(`<h2>扩建车位</h2><div class="txt">花 ${price} 金币永久解锁第 ${i+1} 个车位\n车位越多，堵车越少</div>
    <div class="btnrow">
      <button class="btn pri" onclick="doBuySlot(${i},${price})" ${save.coins<price?'disabled style="opacity:.5"':''}>解锁（${price} 金币）</button>
      <button class="btn sec" onclick="hideModal()">先不扩了</button>
    </div>`);
}
window.doBuySlot=function(i,price){
  if(save.coins<price){toast('金币不足');return;}
  save.coins-=price;save.slots=Math.max(save.slots,i+1);persist();invalidateStatic();
  SFX.coin();hideModal();updateHud();toast('新车位解锁！');promoteWaiting(performance.now());
};
document.getElementById('btnPause').addEventListener('click',()=>{SFX.click();showPause();});

/* ---------------- 自动演示 ---------------- */
let autoTimer=null;
function autoStep(){
  if(maskEl.classList.contains('show'))return;
  const idle=G.vehicles.filter(v=>v.state==='idle');
  let best=null,bs=-1;
  for(const v of idle){
    if(cellsHead(v).exitable){
      const d=demandOf(v.color);
      if(d>bs){bs=d;best=v;}
    }
  }
  if(best){tapVehicle(best);return;}
  for(const v of idle){if(cellsHead(v).k>0){tapVehicle(v);return;}}
  if(autoTimer){clearInterval(autoTimer);autoTimer=null;}
}
/* ---------------- 主循环 / 启动 ---------------- */
function frame(now){
  if(G.started)update(now);
  render(now);
  window.__state={n:G.n,remain:demandSum(),total:G.total,
    vehicles:G.vehicles.length,
    idle:G.vehicles.filter(v=>v.state==='idle').length,
    gone:G.vehicles.filter(v=>v.state==='gone').length,
    phase:G.winShown?'win':'play'};
  requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{computeLayout();});
window.addEventListener('orientationchange',()=>setTimeout(computeLayout,250));

function boot(){
  renderProps();
  computeLayout();
  const q=new URLSearchParams(location.search);
  let n=save.lv;
  if(q.get('level')){n=clamp(parseInt(q.get('level'))||1,1,99999);}
  startLevel(n);
  G.started=true;
  if(!save.seen){
    save.seen=true;persist();
    showModal(`<h2>🚗 挪挪车</h2><div class="txt">点击车辆，它会朝着<b>箭头方向</b>驶出停车场，
开到接客站停进车位。

<b>同色乘客</b>会上车，坐满就发车。
接走全部乘客即可通关！

车位不够时，点锁定车位花金币扩建。</div>
      <div class="btnrow"><button class="btn pri" onclick="hideModal()">开始游戏</button></div>`);
  }
  if(q.get('autoplay')==='1'){
    setTimeout(()=>{hideModal();autoTimer=setInterval(autoStep,620);},400);
  }
  requestAnimationFrame(frame);
}
boot();
</script>
