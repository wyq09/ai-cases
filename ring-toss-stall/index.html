<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0b0b">
<title>地摊套圈 · 夜市 Ring Toss</title>
<style>
/* 地摊套圈 — 夜市主题：红布帐篷 + 金黄字，无玻璃拟态无渐变滥用 */
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#150a08;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
* { box-sizing:border-box; }
#app { position:fixed; inset:0; overflow:hidden; touch-action:none;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
#fxlayer { pointer-events:none; z-index:3; }

/* ── HUD 顶栏 ── */
#hud { position:absolute; z-index:5; left:0; right:0; top:0; display:flex; justify-content:space-between;
  align-items:flex-start; padding:calc(8px + env(safe-area-inset-top)) 10px 0; pointer-events:none; }
.hud-left, .hud-right { display:flex; gap:8px; pointer-events:auto; }
.chip { display:flex; align-items:center; gap:6px; background:rgba(64,10,8,.82);
  border:1.5px solid #d8a13a; border-radius:6px; padding:5px 10px; color:#ffd977;
  font-weight:700; font-size:15px; line-height:1; }
.chip img { width:16px; height:16px; display:block; }
.chip i { font-style:normal; font-size:11px; color:#e8b25c; }
.ringDot { width:14px; height:14px; border:4px solid #ffce4d; border-radius:50%; display:block; }
.hbtn { background:#b3241c; color:#ffe08a; border:1.5px solid #e8b25c; border-radius:6px;
  padding:7px 12px; font-size:14px; font-weight:700; letter-spacing:1px; }
.hbtn:active { background:#8f1a14; }

/* ── 底部提示 / 连击 ── */
#aimHint { position:absolute; z-index:4; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom));
  text-align:center; color:#ffcf7d; font-size:13px; letter-spacing:2px; opacity:.9;
  text-shadow:0 1px 2px #000; transition:opacity .4s; pointer-events:none; }
#aimHint.hide { opacity:0; }
#streak { position:absolute; z-index:4; top:calc(52px + env(safe-area-inset-top)); right:10px;
  color:#ffd257; font-weight:800; font-size:14px; text-shadow:0 1px 3px #000; pointer-events:none; }

/* ── 老板气泡 ── */
#bubble { position:absolute; z-index:4; left:12px; top:26%; max-width:62%; background:#fff8ea;
  color:#5a1f10; border:2px solid #b3241c; border-radius:10px 10px 10px 2px;
  padding:8px 12px; font-size:14px; font-weight:600; line-height:1.45;
  box-shadow:0 3px 10px rgba(0,0,0,.45); transition:opacity .25s, transform .25s; }
#bubble.hide { opacity:0; transform:translateY(6px); }
#bubble::after { content:""; position:absolute; left:-8px; bottom:4px; border:6px solid transparent;
  border-right-color:#b3241c; }

/* ── toast ── */
#toast { position:absolute; z-index:6; left:50%; top:18%; transform:translateX(-50%);
  background:rgba(30,6,5,.9); border:1px solid #d8a13a; color:#ffe08a; padding:8px 16px;
  border-radius:6px; font-size:14px; font-weight:600; white-space:nowrap; transition:opacity .3s; }
#toast.hide { opacity:0; }

/* ── 弹层（夜市横幅风：深红底金黄描边）── */
.modal { position:absolute; inset:0; z-index:8; background:rgba(10,3,2,.62);
  display:flex; align-items:flex-end; justify-content:center; }
.modal.hide { display:none; }
.sheet { width:min(420px, 100%); background:#7c1410; border:2px solid #e8b25c; border-bottom:none;
  border-radius:14px 14px 0 0; padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  color:#ffe9b8; max-height:78%; overflow:auto; overscroll-behavior:contain; }
.sheet-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.sheet-bar b { font-size:18px; color:#ffd257; letter-spacing:2px; }
.xbtn { background:none; border:1.5px solid #e8b25c; color:#ffd257; width:30px; height:30px;
  border-radius:6px; font-size:14px; }
.banner-mini { text-align:center; background:#a01d15; border:1.5px dashed #e8b25c; color:#ffdf86;
  font-weight:700; letter-spacing:1px; padding:6px; border-radius:4px; margin-bottom:12px; font-size:13px; }
.buy { display:flex; width:100%; align-items:center; justify-content:space-between;
  background:#c9271d; border:2px solid #ffd257; border-radius:8px; color:#fff3cf;
  padding:13px 16px; margin-bottom:10px; font-size:16px; font-weight:800; }
.buy .q b { font-size:24px; }
.buy .q i { font-style:normal; font-size:12px; }
.buy .p { font-size:15px; color:#ffe08a; }
.buy:active { background:#a01d15; }
.buy.value { background:#8f1a14; }
.buy .tag { background:#ffd257; color:#7c1410; font-size:11px; padding:2px 6px; border-radius:3px; margin-left:8px; }
.buy.free { background:#4a2c14; border-color:#c98f3f; justify-content:space-between; font-size:14px; font-weight:600; }
.buy.free:disabled { opacity:.55; }
.coinGlyph { display:inline-block; width:15px; height:15px; border-radius:50%;
  background:#ffd257; border:2px solid #b57f1f; vertical-align:-2px; margin-right:3px; }
.shop-tip { text-align:center; color:#d9a96f; font-size:12px; margin-top:4px; }

/* ── 图鉴 ── */
#dexGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.dexCell { background:#931d16; border:1.5px solid #c98f3f; border-radius:8px; padding:8px 4px 6px;
  text-align:center; position:relative; }
.dexCell img { width:64px; height:76px; object-fit:contain; display:block; margin:0 auto; filter:drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
.dexCell.locked img { filter:brightness(0) opacity(.5); }
.dexCell .nm { color:#ffe9b8; font-size:12px; font-weight:700; margin-top:2px; }
.dexCell .ct { color:#ffd257; font-size:11px; }
.dexCell .val { position:absolute; top:4px; right:5px; color:#ffcf7d; font-size:10px; opacity:.85; }
.dexCell.rare { border-color:#ffd257; background:#a3221a; }
#dexStats { text-align:center; color:#d9a96f; font-size:12px; margin-top:10px; line-height:1.7; }

/* ── 桌面端：弹层居中 ── */
@media (min-width:768px) and (min-height:560px) {
  .modal { align-items:center; }
  .sheet { border-radius:12px; border-bottom:2px solid #e8b25c; max-height:86%; }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <canvas id="fxlayer"></canvas>
  <div id="hud">
    <div class="hud-left">
      <div class="chip" id="coinChip"><img id="coinIcon" alt=""><b id="coinVal">0</b></div>
      <div class="chip" id="ringChip"><span class="ringDot"></span><b id="ringVal">0</b><i>圈</i></div>
    </div>
    <div class="hud-right">
      <button class="hbtn" id="btnDex" aria-label="图鉴">奖</button>
      <button class="hbtn" id="btnShop" aria-label="买圈">买圈</button>
      <button class="hbtn" id="btnCfg" aria-label="设置">设</button>
    </div>
  </div>
  <div id="streak"></div>
  <div id="aimHint">按住屏幕拖动瞄准 · 松手掷圈</div>
  <div id="bubble" class="hide"><span id="bubbleText"></span></div>
  <div id="toast" class="hide"></div>
  <div id="shop" class="modal hide">
    <div class="sheet">
      <div class="sheet-bar"><b>来来来，买圈圈！</b><button class="xbtn" id="shopClose">✕</button></div>
      <div class="banner-mini">20个币20个圈 · 60个币100个圈</div>
      <button class="buy big" id="buy20"><span class="q">20 <i>圈</i></span><span class="p"><span class="coinGlyph"></span>20 币</span></button>
      <button class="buy big value" id="buy60"><span class="q">100 <i>圈</i></span><span class="p"><span class="coinGlyph"></span>60 币</span><span class="tag">多 40%</span></button>
      <button class="buy free" id="btnFree"><span>币花完了？找老板领 5 币</span><span id="freeCd"></span></button>
      <div class="shop-tip">套中奖品进图鉴；重复的折算成币</div>
    </div>
  </div>
  <div id="dex" class="modal hide">
    <div class="sheet">
      <div class="sheet-bar"><b>战利品图鉴</b><button class="xbtn" id="dexClose">✕</button></div>
      <div id="dexGrid"></div>
      <div id="dexStats"></div>
    </div>
  </div>
  <div id="panel"></div>
</div>
<script>
(function(){var Q={};location.search.replace(/^\?/,'').split('&').forEach(function(kv){var p=kv.split('=');if(!p[0])return;Q[decodeURIComponent(p[0])]=p[1]===undefined?true:decodeURIComponent(p[1]);});if(Q.reset){try{localStorage.removeItem('ringtoss_state_v1');localStorage.removeItem('ringtoss_config_v1');}catch(e){}}window.__errs=[];window.addEventListener('error',function(e){__errs.push(String(e.message||e).slice(0,240)+' @'+(e.lineno||'?'));});window.addEventListener('unhandledrejection',function(e){__errs.push('rej:'+String(e.reason).slice(0,240));});window.__RTQ=Q;})();

<script>
/* ===== src/logic.js ===== */
/* 地摊套圈 — 逻辑核心：布局/物理/判定/预测/蒙特卡洛模拟（纯 JS 无 DOM，可在 Node 跑） */
if (typeof window !== 'undefined') window.RT = window.RT || {};
else if (typeof globalThis !== 'undefined') globalThis.RT = globalThis.RT || {};
var RT = (typeof window !== 'undefined' ? window.RT : globalThis.RT);
RT.LOGIC = (function () {
  'use strict';

  /* ── 物理常量（米/秒） ── */
  var G = 9.8;
  var RING = { ROut: 0.21, RIn: 0.16, tube: 0.045 };      // 圈外半径/内孔半径/管径
  var STOOL_H = 0.36, STOOL_HALF = 0.30;                   // 凳面高/凳半宽
  var THROW_Y = 1.12, THROW_Z = 0.12;                      // 出手高度/纵深

  /* ── 奖品规格（neck 决定套中门槛 RIn−neck：前排门槛大易中，后排门槛小难中） ── */
  var PRIZE_SPEC = {
    goose:  { name: '大白鹅',   h: 0.46, neck: 0.065, body: 0.16, val: 1,  tier: 0 },
    frog:   { name: '青蛙王',   h: 0.44, neck: 0.070, body: 0.18, val: 2,  tier: 0 },
    dog:    { name: '小花狗',   h: 0.42, neck: 0.075, body: 0.17, val: 3,  tier: 0 },
    panda:  { name: '熊猫',     h: 0.44, neck: 0.078, body: 0.19, val: 3,  tier: 1 },
    pig:    { name: '粉猪罐',   h: 0.40, neck: 0.080, body: 0.21, val: 4,  tier: 1 },
    goggle: { name: '护目镜小子', h: 0.50, neck: 0.078, body: 0.15, val: 6,  tier: 1 },
    pug:    { name: '巴哥',     h: 0.42, neck: 0.082, body: 0.16, val: 5,  tier: 2 },
    doll:   { name: '蓝裙娃娃', h: 0.52, neck: 0.088, body: 0.18, val: 8,  tier: 2 },
    dragon: { name: '小火龙',   h: 0.48, neck: 0.092, body: 0.19, val: 10, tier: 2 }
  };

  /* ── 摊位布局（金字塔纵深，凳色循环） ── */
  var ROWS = [
    { z: 1.7, xs: [-1.1, 0, 1.1],    ids: ['goose', 'frog', 'goose'] },
    { z: 2.75, xs: [-1.9, -0.95, 0, 0.95, 1.9], ids: ['dog', 'panda', 'goggle', 'panda', 'pig'] },
    { z: 3.8, xs: [-2.55, -1.7, -0.85, 0, 0.85, 1.7, 2.55], ids: ['dragon', 'doll', 'pug', 'frog', 'pug', 'doll', 'dragon'] }
  ];
  var STOOL_COLORS = ['red', 'green', 'yellow'];

  function buildLayout() {
    var stools = [], i = 0;
    ROWS.forEach(function (row) {
      row.xs.forEach(function (x, k) {
        var id = row.ids[k];
        stools.push({
          i: i, x: x, z: row.z, color: STOOL_COLORS[i % 3],
          prize: id, spec: PRIZE_SPEC[id],
          neckY: STOOL_H + PRIZE_SPEC[id].h * 0.60,
          bodyTop: STOOL_H + PRIZE_SPEC[id].h
        });
        i++;
      });
    });
    return stools;
  }
  var LAYOUT = buildLayout();

  /* ── 随机源（可注入） ── */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss(rng) {
    var u = 0, v = 0;
    while (u === 0) u = rng();
    while (v === 0) v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  /* ── 出手参数 ── */
  // power∈[0.05,1] → 前排~后排；返回初速度。满力颈面穿越约 4.0m，留足余量防饱和
  function throwVel(power, aimX) {
    var vz = 1.70 + power * 2.75;
    var vy = 1.55 + vz * 0.56;
    var vx = aimX * 0.38;
    return { vx: vx, vy: vy, vz: vz, x0: aimX * 0.5 };
  }

  /* ── 落点预测（闭式解，用于瞄准辅助与 rig）。targetY 默认凳面；套圈判定统一用颈部高度。
     半隐式欧拉积分比闭式解多掉 g·t·dt/2 高度 → B 项吸收该偏差，使预测与实机穿越点对齐 ── */
  var DT = 1 / 120;
  function predictLanding(aimX, power, targetY) {
    var v = throwVel(power, aimX);
    var ty = (targetY === undefined) ? STOOL_H : targetY;
    var A = -0.5 * G, B = v.vy - G * DT / 2, C = THROW_Y - ty;
    var disc = B * B - 4 * A * C;
    if (disc < 0) return null;
    var t = (-B - Math.sqrt(disc)) / (2 * A);   // 下落穿越时刻（较大根）
    return { x: v.x0 + v.vx * t, z: THROW_Z + v.vz * t, t: t };
  }

  // 反解：给定目标 (z, 高度) 求 power（vz 单调）
  function powerForZ(targetZ, targetY) {
    var lo = 0.05, hi = 1.0;
    for (var k = 0; k < 24; k++) {
      var mid = (lo + hi) / 2;
      var p = predictLanding(0, mid, targetY);
      if (!p) { hi = mid; continue; }
      if (p.z < targetZ) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }

  /* ── 单圈物理推进。ring: {x,y,z,vx,vy,vz,tilt,state,bounces}，返回事件数组 ── */
  function stepRing(ring, dt, stools) {
    var ev = [];
    if (ring.state !== 'fly') return ev;
    var prevY = ring.y, prevX = ring.x, prevZ = ring.z;
    ring.vy -= G * dt;
    ring.x += ring.vx * dt;
    ring.y += ring.vy * dt;
    ring.z += ring.vz * dt;
    // 圈面姿态：上升时立起，下落时渐放平
    var target = ring.vy > 0.4 ? 1.05 : 0.0;
    var k = ring.vy > 0.4 ? 6 : 2.6;
    ring.tilt += (target - ring.tilt) * Math.min(1, k * dt);

    for (var s = 0; s < stools.length; s++) {
      var st = stools[s];
      if (!st.prize) continue;
      var dx = ring.x - st.x, dz = ring.z - st.z;
      var d = Math.sqrt(dx * dx + dz * dz);
      var sp = st.spec;
      var thr = sp.body + RING.tube * 0.5;

      /* 套中判定：下落穿越颈部高度 + 圈孔套住颈 */
      if (ring.vy < 0 && prevY >= st.neckY && ring.y < st.neckY) {
        if (d + sp.neck <= RING.RIn) {
          ring.state = 'captured'; ring.prizeI = st.i;
          ring.x = st.x; ring.z = st.z; ring.y = st.neckY; ring.tilt = 0.18;
          ev.push({ type: 'capture', stool: st });
          return ev;
        }
        if (d < thr) {  // 落在奖品头顶/肩上没套中 → 弹开（近失）
          var inv = d > 0.001 ? 1 / d : 0;
          ring.vx += dx * inv * 0.9; ring.vz += dz * inv * 0.9;
          ring.vy *= 0.25;
          ring.y = st.neckY;
          ev.push({ type: 'prizeTop', stool: st });
        }
      }
      /* 奖品身体侧碰（柱体）：高度带只到颈部，颈部以上交给套颈/碰头逻辑 */
      else if (ring.y > STOOL_H && ring.y < st.neckY && d < thr) {
        var pdx = prevX - st.x, pdz = prevZ - st.z;
        var prevD = Math.sqrt(pdx * pdx + pdz * pdz);
        if (prevD >= thr || ring.vy > 0) {
          if (d > 0.001) {
            var nx = dx / d, nz = dz / d;
            var vn = ring.vx * nx + ring.vz * nz;
            if (vn < 0) {
              ring.vx -= 1.5 * vn * nx; ring.vz -= 1.5 * vn * nz;
              ring.vx *= 0.55; ring.vz *= 0.55;
              var push = thr - d;
              ring.x += nx * push; ring.z += nz * push;
              ev.push({ type: 'prizeBody', stool: st });
            }
          }
        }
      }
    }
    /* 凳面 */
    for (var j = 0; j < stools.length; j++) {
      var st2 = stools[j];
      var ddx = ring.x - st2.x, ddz = ring.z - st2.z;
      if (Math.abs(ddx) < STOOL_HALF + RING.tube * 0.3 && Math.abs(ddz) < STOOL_HALF + RING.tube * 0.3 &&
          prevY >= STOOL_H && ring.y < STOOL_H && ring.vy < 0) {
        if (ring.tilt > 0.5) {                 // 还立着 → 磕凳弹开
          ring.y = STOOL_H; ring.vy = -ring.vy * 0.34;
          ring.vx += (ddx > 0 ? 0.35 : -0.35); ring.vz -= 0.25;
          ring.bounces++;
          ev.push({ type: 'bounceWood', stool: st2 });
        } else {                               // 已放平 → 停在凳上
          ring.state = 'rest'; ring.y = STOOL_H + RING.tube * 0.4;
          ring.onStool = st2.i;
          ev.push({ type: 'settle', on: 'stool', stool: st2 });
          return ev;
        }
      }
    }
    /* 地面 */
    if (ring.y < RING.tube * 0.45 && ring.vy < 0) {
      ring.y = RING.tube * 0.45;
      if (ring.tilt > 0.45 && ring.bounces < 2) {
        ring.vy = -ring.vy * 0.38;
        ring.vx *= 0.72; ring.vz *= 0.72;
        ring.tilt *= 0.5; ring.bounces++;
        ev.push({ type: 'bounceGround' });
      } else {
        ring.state = 'rest'; ring.vy = 0; ring.vx = 0; ring.vz = 0;
        ring.tilt = 0; ring.y = RING.tube * 0.45;
        ev.push({ type: 'settle', on: 'ground' });
      }
    }
    /* 越界兜底 */
    if (ring.z > 5.2 || Math.abs(ring.x) > 4.4 || ring.z < -0.5) {
      ring.state = 'rest'; ev.push({ type: 'settle', on: 'lost' });
    }
    return ev;
  }

  /* ── 满飞行模拟（simulate / rig 共用） ── */
  function flyOnce(aimX, power, stools, rng) {
    var v = throwVel(power, aimX);
    var ring = { x: v.x0, y: THROW_Y, z: THROW_Z, vx: v.vx, vy: v.vy, vz: v.vz,
                 tilt: 1.0, state: 'fly', bounces: 0 };
    var events = [], dt = 1 / 120, t = 0;
    while (ring.state === 'fly' && t < 3) {
      var e = stepRing(ring, dt, stools);
      for (var i = 0; i < e.length; i++) events.push(e[i]);
      t += dt;
    }
    return { ring: ring, events: events };
  }

  /* ── 反解瞄准：期望落点(穿越 targetY 平面处 x) → aimX。
     aimX 同时给出手位置与横向速度，落点 x = aimX*(0.5+0.38t)，必须反解。 ── */
  function solveAim(targetX, power, targetY) {
    var p = predictLanding(0, power, targetY);
    if (!p) return targetX;
    return targetX / (0.5 + 0.38 * p.t);
  }
  function flyOnceAt(targetX, power, stools) {
    return flyOnce(solveAim(targetX, power), power, stools);
  }

  /* ── 蒙特卡洛：普通玩家噪声模型 → 各奖品命中率 ── */
  // sigma = {x: 横向标准差, z: 纵深标准差}；返回 {total, per:{id:{n,hit}}, byTier}
  function simulate(n, sigma, seed) {
    sigma = sigma || { x: 0.14, z: 0.15 };
    var rng = mulberry32(seed || 42);
    var per = {}, total = 0;
    for (var k in PRIZE_SPEC) per[k] = { n: 0, hit: 0 };
    var picks = LAYOUT.filter(function (s) { return s.prize; });
    for (var i = 0; i < n; i++) {
