<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RT.FX 预览 — 地摊套圈特效层</title>
<style>
  html,body{margin:0;height:100%;background:#26090a;overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #fx{position:absolute;inset:0;width:100%;height:100%;display:block}
  .tag{position:absolute;z-index:9;pointer-events:none;color:#ffe1a0;font-size:11px;line-height:1;
    background:rgba(20,4,3,.6);border:1px solid rgba(232,178,92,.55);
    padding:3px 7px;border-radius:3px;letter-spacing:1px}
  #hdr{position:absolute;z-index:9;left:12px;top:12px;pointer-events:none;color:#ffd257;
    font-size:13px;font-weight:700;letter-spacing:2px;
    background:rgba(20,4,3,.6);border:1px solid rgba(232,178,92,.55);
    padding:5px 10px;border-radius:4px}
</style>
</head>
<body>
<canvas id="fx" width="800" height="1000"></canvas>
<div id="hdr">RT.FX 预览 · 夜市红金 · 定格于 1.05s</div>
<div class="tag" style="left:16px;top:150px">confetti(70)</div>
<div class="tag" style="left:16px;top:330px">bigText(中央金渐变大字)</div>
<div class="tag" style="left:120px;top:358px">spark</div>
<div class="tag" style="left:368px;top:500px">coinBurst</div>
<div class="tag" style="left:576px;top:622px">dust</div>
<div class="tag" style="left:236px;top:752px">popLabel</div>
<script src="../src/fx.js"></script>
<script>
/* 确定性时钟：接管 rAF 与 performance.now，按 60fps 虚拟帧同步泵到 1.05s 后冻结，
   使 headless 截图与真实帧率/虚拟时间无关。仅预览页使用，游戏本体不受影响。 */
(function(){
  var VT=0, END=1050, STEP=1000/60, pending=[], ti=0;
  var plan=[
    [60, function(){ RT.FX.confetti(70); }],
    [60, function(){ RT.FX.flash('#ffdf8e',0.3); }],
    [60, function(){
      RT.FX.bigText('套中啦! 白鹅',{sub:'连击 ×3 · +8 分',scale:1});
      /* 把 WAAPI 定格在停留段(900ms/1750ms)，避免真实时钟走完自毁 */
      try{ document.getAnimations().forEach(function(a){ a.pause(); a.currentTime=900; }); }catch(e){}
    }],
    [60, function(){ RT.FX.coinBurst(420,540,10); }],
    [500,function(){ RT.FX.popLabel(300,790,'+5 币','#ffd257'); }],
    [600,function(){ RT.FX.spark(180,400,'#ffd257',16); }],
    [700,function(){ RT.FX.dust(620,660,12); }]
  ];
  window.requestAnimationFrame=function(cb){ pending.push(cb); return pending.length; };
  try{ performance.now=function(){ return VT; }; }catch(e){}
  RT.FX.init(document.getElementById('fx'));
  window.__pump=function(){
    while(VT<END){
      VT+=STEP;
      while(ti<plan.length&&VT>=plan[ti][0]) plan[ti++][1]();
      var q=pending.splice(0);
      for(var i=0;i<q.length;i++) q[i](VT);
    }
  };
})();
__pump();
</script>
</body>
</html>
