<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ring-toss-stall ART preview</title>
<style>
  body{background:#20242a;color:#ddd;font:12px/1.4 sans-serif;margin:0;padding:14px}
  h1{font-size:15px;margin:2px 0 10px;color:#fff}
  .grid{display:flex;flex-wrap:wrap;gap:10px}
  .cell{width:170px;text-align:center;background:#2b313a;border:1px solid #3a424d;padding:6px 4px 8px;border-radius:4px}
  .cell img{display:block;margin:0 auto}
  .cell b{display:block;margin-top:4px;color:#ffd23f;font-weight:600;font-size:11px}
</style>
</head>
<body>
<h1>ring-toss-stall — ART assets（全部 SVG dataURI）</h1>
<div class="grid" id="g"></div>
<script src="../src/art.js"></script>
<script>
  const g = document.getElementById('g');
  const add = (label, uri, h) => {
    const d = document.createElement('div'); d.className = 'cell';
    const i = new Image(); i.src = uri; i.style.height = h + 'px';
    d.appendChild(i);
    const b = document.createElement('b'); b.textContent = label; d.appendChild(b);
    g.appendChild(d);
  };
  ['goose','frog','panda','dog','pig','pug','goggle','doll','dragon'].forEach(id => add('prize:' + id, RT.ART.prize(id), 175));
  add('vendor', RT.ART.vendor(), 215);
  ['red','green','yellow'].forEach(c => add('stool:' + c, RT.ART.stool(c), 110));
  add('ringStack', RT.ART.ringStack(), 105);
  add('coin', RT.ART.coin(), 88);
  add('bulb', RT.ART.bulb(), 88);
</script>
</body>
</html>
