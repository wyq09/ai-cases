<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>羊了个羊 · 三消羊圈</title>
<style>
  :root {
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --paper: #F7F1E3;
    --wood: #8A6B45;
    --wood-dark: #6B5236;
    --ink: #4A3B2A;
    --grass: #7FA95C;
    --accent: #D96C4F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; justify-content: center; background: #2B231A; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app {
    position: relative; width: 100%; max-width: 100%; height: 100%;
    height: 100dvh; overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; background: #EFE6CE;
  }
  @media (min-width: 700px) {
    #app { max-width: 440px; box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.5); }
  }
  canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- HUD 顶栏 ---- */
  #hud {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(8px + var(--safe-t)) 14px 6px;
    display: flex; align-items: center; gap: 10px; pointer-events: none;
  }
  #hudLv {
    font-weight: 800; font-size: 17px; color: #FFF9EA;
    text-shadow: 0 1px 0 rgba(74,59,42,.85), 0 2px 6px rgba(58,42,20,.5);
    white-space: nowrap;
  }
  #hudLeft {
    flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #F3E9D2;
    text-shadow: 0 1px 0 rgba(74,59,42,.8), 0 2px 5px rgba(58,42,20,.45);
    letter-spacing: .5px;
  }
  #btnMenu {
    pointer-events: auto; width: 38px; height: 38px; border: none; border-radius: 12px;
    background: rgba(58,44,26,.5); backdrop-filter: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #btnMenu:active { transform: scale(.93); }
  #btnMenu svg { display: block; }

  /* ---- 底部道具条 ---- */
  #propBar {
    position: absolute; left: 0; right: 0;
    bottom: calc(10px + var(--safe-b));
    display: flex; justify-content: center; gap: 22px;
  }
  .prop {
    position: relative; width: 60px; height: 60px; border-radius: 18px;
    border: 2px solid var(--wood-dark);
    background: linear-gradient(180deg, #A8825A, #8A6B45);
    box-shadow: 0 4px 0 #57402a, 0 6px 12px rgba(40,26,10,.35);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .prop:active { transform: translateY(2px); box-shadow: 0 2px 0 #57402a; }
  .prop[disabled] { filter: grayscale(.75) brightness(.8); pointer-events: none; }
  .prop .cnt {
    position: absolute; top: -7px; right: -7px; min-width: 22px; height: 22px;
    border-radius: 11px; background: var(--accent); color: #FFF6EA;
    font-size: 13px; font-weight: 800; line-height: 22px; text-align: center;
    border: 2px solid #FFF3DF; padding: 0 4px;
  }
  .prop svg { display: block; }

  /* ---- 弹窗 ---- */
  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(34,25,13,.58); z-index: 30; padding: 24px;
  }
  #overlay.show { display: flex; }
  .dlg {
    width: 100%; max-width: 330px; background: var(--paper);
    border: 3px solid var(--wood); border-radius: 20px;
    padding: 26px 22px 22px; text-align: center;
    box-shadow: 0 10px 0 rgba(74,56,32,.35), 0 22px 44px rgba(20,12,4,.45);
    animation: pop .28s cubic-bezier(.34,1.4,.64,1);
  }
  @keyframes pop { from { transform: scale(.82); opacity: 0; } }
  .dlg h1 { font-size: 30px; font-weight: 900; color: var(--ink); letter-spacing: 2px; }
  .dlg h2 { font-size: 22px; font-weight: 800; color: var(--ink); }
  .dlg .sub { font-size: 13px; color: #8A775D; margin-top: 6px; line-height: 1.6; }
  .dlg .logo-sheep { margin: 4px auto 2px; display: block; }
  .btns { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .mbtn {
    height: 48px; border-radius: 14px; border: 2px solid var(--wood-dark);
    background: linear-gradient(180deg, #F2E7CD, #E7D8B4);
    color: var(--ink); font-size: 16px; font-weight: 800; cursor: pointer;
    box-shadow: 0 3px 0 #C9B890;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .mbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #C9B890; }
  .mbtn.primary { background: linear-gradient(180deg, #94BE6E, #7FA95C); border-color: #5C7F3E; color: #FFFDF4; box-shadow: 0 3px 0 #5C7F3E; }
  .mbtn.primary:active { box-shadow: 0 1px 0 #5C7F3E; }
  .mbtn.warn { background: linear-gradient(180deg, #E08A6C, #D96C4F); border-color: #A84A30; color: #FFF6EA; box-shadow: 0 3px 0 #A84A30; }

  /* ---- toast ---- */
  #toast {
    position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%) translateY(14px);
    background: rgba(58,44,26,.92); color: #FFF6E4; font-size: 14px; font-weight: 600;
    padding: 9px 18px; border-radius: 20px; opacity: 0; transition: all .22s;
    pointer-events: none; z-index: 40; white-space: nowrap; max-width: 86%;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- 配置面板宿主 ---- */
  #panelHost { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
  #panelHost > * { pointer-events: auto; }

  /* ---- 横屏矮窗 ---- */
  @media (max-height: 540px) {
    #hud { padding-top: calc(4px + var(--safe-t)); }
    #hudLv { font-size: 14px; }
    .prop { width: 48px; height: 48px; border-radius: 14px; }
    #propBar { bottom: calc(6px + var(--safe-b)); gap: 16px; }
    .dlg { padding: 14px 16px 14px; }
    .dlg h1 { font-size: 22px; }
    .mbtn { height: 40px; font-size: 14px; }
    #toast { bottom: 72px; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="hudLv">第 1 关</div>
    <div id="hudLeft"></div>
    <button id="btnMenu" aria-label="菜单">
      <svg width="20" height="20" viewBox="0 0 20 20"><g stroke="#FFF3DC" stroke-width="2.4" stroke-linecap="round"><line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/></g></svg>
    </button>
  </div>

  <div id="propBar">
    <button class="prop" id="btnOut" aria-label="移出">
      <svg width="28" height="28" viewBox="0 0 28 28"><rect x="6" y="7" width="16" height="14" rx="3" fill="none" stroke="#FFF3DC" stroke-width="2.2"/><path d="M14 17v-6M11.4 13.2 14 10.6l2.6 2.6" stroke="#FFF3DC" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="cnt">1</span>
    </button>
    <button class="prop" id="btnUndo" aria-label="撤销">
      <svg width="28" height="28" viewBox="0 0 28 28"><path d="M8 13h9a5 5 0 1 1 0 10h-4" fill="none" stroke="#FFF3DC" stroke-width="2.4" stroke-linecap="round"/><path d="M11.6 8.6 7 13l4.6 4.4" fill="none" stroke="#FFF3DC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="cnt">1</span>
    </button>
    <button class="prop" id="btnShuffle" aria-label="洗牌">
      <svg width="28" height="28" viewBox="0 0 28 28"><path d="M5 9h4l9 10h5M23 19l-3-3m3 3-3 3M5 19h4l2.6-2.9M14.5 12l3.5-3h5M23 9l-3-3m3 3-3 3" fill="none" stroke="#FFF3DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="cnt">1</span>
    </button>
  </div>

  <div id="overlay"></div>
  <div id="panelHost"></div>
  <div id="toast"></div>
</div>
<script>
/* ===== src/core.js ===== */
/* sheep-a-sheep core —— URL参数 / reset清档 / 深合并 / 随机源 / 存储（build 序第一，禁止顶层 const SH） */
window.SH = window.SH || {};
SH.core = (function () {
  'use strict';

  var Q = {};
  var HAS_LOC = typeof location !== 'undefined';
  if (HAS_LOC) {
    location.search.replace(/[?&]([\w-]+)(?:=([^&]*))?/g, function (_, k, v) {
      Q[k] = v === undefined ? '1' : v; return '';
    });
  }

  // ?reset=1 必须在任何 localStorage 读取之前清档
  if (Q.reset === '1') {
    try { localStorage.removeItem('sh_state_v1'); localStorage.removeItem('sh_cfg_v1'); } catch (e) {}
  }

  function isObj(o) { return o && typeof o === 'object' && !(o instanceof Array); }

  function deepMerge(base, over) {
    var out = {};
    for (var k in base) out[k] = isObj(base[k]) ? deepMerge(base[k], {}) : base[k];
    if (!over) return out;
    for (var k2 in over) {
      if (isObj(over[k2]) && isObj(out[k2])) out[k2] = deepMerge(out[k2], over[k2]);
      else out[k2] = over[k2];
    }
    return out;
  }

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function levelSeed(n) { return (Math.imul(n, 2654435761) ^ 0x9E3779B9) >>> 0; }

  function loadJSON(k) {
    if (typeof localStorage === 'undefined') return null;
    try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; }
  }
  function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  window.__errs = window.__errs || [];
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('error', function (e) { window.__errs.push(String(e.message || e)); });
    window.addEventListener('unhandledrejection', function (e) { window.__errs.push('rej:' + String((e && e.reason) || e)); });
  }

  return {
    Q: Q, deepMerge: deepMerge, mulberry32: mulberry32, levelSeed: levelSeed,
    loadJSON: loadJSON, saveJSON: saveJSON,
    LS_ST: 'sh_state_v1', LS_CFG: 'sh_cfg_v1',
  };
})();

</script>
<script>
/* ===== src/logic.js ===== */
/* sheep-a-sheep logic —— 难度曲线 / 布局生成 / 可解性求解器 / demo策略 / 难度模拟器
   坐标系：gx2,gy2 为 ×2 半格整数；牌宽=2半格、牌高=2.5半格(1.25比例)；
   几何相交 ⇔ |dx2|<=1 && |dy2|<=2；压牌 ⇔ 相交且 zA>zB；同层由生成保证不重叠(底层行间瓦片重叠除外,z相同不构成遮挡)。 */
window.SH = window.SH || {};
SH.logic = (function () {
  'use strict';

  var C = SH.core;

  var DEFAULT_CFG = {
    // 玩法/难度
    slots: 7,            // 5~9
    kindsStart: 5,       // 3~8 首关种类
    kindsMax: 12,        // 6~14 种类上限
    tilesStart: 30,      // 24~60 首关牌数
    tilesPerLevel: 12,   // 0~24 每关增量
    tilesMax: 150,       // 60~198 牌数上限
    layersStart: 3,      // 2~5
    layersMax: 8,        // 3~9
    density: 0.6,        // 0.40~0.85 叠压密度基准
    sideStacks: 2,       // 0~2 侧堆数量
    sideLen: 5,          // 3~8 侧堆长度
    propsOut: 1, propsUndo: 1, propsShuffle: 1,
    revives: 1,          // 0~3
    guaranteed: true,    // 求解器验证保证可解
    breatherEvery: 5,    // 0~10 每 N 关喘息(0=无)
    // 外观
    icons: {},           // {kindId: dataURI}
    bgCustom: '',
    tileSkin: 0,
    // 音画
    sfxVol: 0.9, bgmVol: 0.45, muted: false,
    audioOverrides: {},
  };

  /* ---------------- 难度曲线 ---------------- */
  function specForLevel(L, cfg) {
    var breather = cfg.breatherEvery > 0 && L > 1 && (L % cfg.breatherEvery === 0);
    var e = breather ? Math.max(1, L - 3) : L;
    var kinds = Math.min(cfg.kindsMax, cfg.kindsStart + Math.floor((e - 1) / 3));
    if (L === 1) kinds = Math.min(kinds, 4); // 教学关
    var tiles = Math.min(cfg.tilesMax, cfg.tilesStart + cfg.tilesPerLevel * (e - 1));
    var layers = Math.min(cfg.layersMax, cfg.layersStart + Math.floor((e - 1) / 2));
    if (L === 1) layers = Math.min(layers, 3);
    var density = Math.min(0.85, cfg.density + (e - 1) * 0.02);
    if (L === 1) density = Math.min(density, 0.5);
    var sideN = cfg.sideStacks > 0 ? (e === 1 ? 1 : cfg.sideStacks) : 0;
    var sideLen = Math.max(3, Math.min(cfg.sideLen, 2 + e));
    return {
      lv: L, kinds: kinds, tiles: tiles, layers: layers, density: density,
      slots: cfg.slots, sideN: sideN, sideLen: sideLen,
      props: { out: cfg.propsOut, undo: cfg.propsUndo, shuf: cfg.propsShuffle, revives: cfg.revives },
    };
  }

  /* ---------------- 几何 ---------------- */
  function overlap(a, b) {
    var dx = a.gx2 - b.gx2; if (dx < 0) dx = -dx;
    if (dx > 1) return false;
    var dy = a.gy2 - b.gy2; if (dy < 0) dy = -dy;
    return dy <= 2;
  }

  /* 覆盖边预计算：covers[i]=i压住的牌id表，blockers[j]=压j的牌id表。tiles 须 z 升序。 */
  function buildCover(tiles) {
    var n = tiles.length, covers = [], blockers = [];
    for (var i = 0; i < n; i++) { covers.push([]); blockers.push([]); }
    for (var a = 0; a < n; a++) {
      for (var b = a + 1; b < n; b++) {
        if (!overlap(tiles[a], tiles[b])) continue;
        var hi, lo;
        if (tiles[a].z > tiles[b].z) { hi = a; lo = b; } else { hi = b; lo = a; }
        covers[hi].push(lo); blockers[lo].push(hi);
      }
    }
    return { covers: covers, blockers: blockers };
  }

  function coveredFlags(tiles) {
    var n = tiles.length, cov = new Uint8Array(n);
    for (var a = 0; a < n; a++)
      for (var b = 0; b < n; b++) {
        if (a === b || tiles[b].z <= tiles[a].z) continue;
        if (overlap(tiles[a], tiles[b])) { cov[a] = 1; break; }
      }
    return cov;
  }

  /* ---------------- 布局生成 ---------------- */
  // 主堆：底层规整网格，上层半格错位逐层收缩
  function buildMain(rng, spec) {
    var shrink = 0.45 + spec.density * 0.5;
    var geo = (1 - Math.pow(shrink, spec.layers)) / (1 - shrink);
    var n0 = Math.max(6, Math.round(spec.mainTiles / geo));
    var cols = Math.max(3, Math.round(Math.sqrt(n0 * 1.3)));
    var rows = Math.max(2, Math.ceil(n0 / cols));

    var layersTiles = [];
    var l0 = [];
    for (var r = 0; r < rows; r++)
      for (var c = 0; c < cols; c++)
        l0.push({ gx2: c * 2, gy2: r * 2 });
    layersTiles.push(l0);

    for (var l = 1; l < spec.layers; l++) {
      var prev = layersTiles[l - 1];
      if (!prev.length) break;
      var want = Math.max(1, Math.round(prev.length * shrink));
      // 候选：上一层每张牌的邻域（含正上对齐）。允许跨层叠（z 序决定压关系），仅要求承托上一层。
      var cand = [];
      var seen = {};
      for (var p = 0; p < prev.length; p++) {
        var base = prev[p];
        for (var ddx = -1; ddx <= 1; ddx++) for (var ddy = 0; ddy <= 2; ddy++) {
          var gx = base.gx2 + ddx, gy = base.gy2 + ddy;
          var key = gx + ',' + gy;
          if (seen[key]) continue;
          seen[key] = 1;
          cand.push({ gx2: gx, gy2: gy });
        }
      }
      // 随机挑 want 个（同层互不重叠：|dx2|<=1 && |dy2|<=2 冲突）
      var placed = [];
      shuffle(cand, rng);
      for (var ci = 0; ci < cand.length && placed.length < want; ci++) {
        var t = cand[ci], ok = true;
        for (var pi = 0; pi < placed.length; pi++) {
          var q = placed[pi];
          var dX = t.gx2 - q.gx2; if (dX < 0) dX = -dX;
          if (dX > 1) continue;
          var dY = t.gy2 - q.gy2; if (dY < 0) dY = -dY;
          if (dY <= 2) { ok = false; break; }
        }
        if (ok) placed.push(t);
      }
      layersTiles.push(placed);
    }
    return layersTiles;
  }

  function shuffle(arr, rng) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = (rng() * (i + 1)) | 0;
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
  }

  function buildBoard(rng, spec) {
    var sideCount = spec.sideN * spec.sideLen;
    var mainTarget = Math.max(24, spec.tiles - sideCount);
    spec.mainTiles = mainTarget;
    var layersTiles = buildMain(rng, spec);

    // 主堆槽位摊平（z=层号）
    var slots = [];
    for (var l = 0; l < layersTiles.length; l++)
      for (var i = 0; i < layersTiles[l].length; i++)
        slots.push({ gx2: layersTiles[l][i].gx2, gy2: layersTiles[l][i].gy2, z: l });

    // 总槽位取 3 倍数：多出的从顶层随机丢
    var total = slots.length + sideCount;
    var T = Math.floor(total / 3) * 3;
    var drop = total - T;
    shuffle(slots, rng);
    slots.sort(function (a, b) { return b.z - a.z; }); // 顶层优先丢
    slots.splice(0, drop);
    slots.sort(function (a, b) { return a.z - b.z; });

    // 侧堆：竖叠瓦片，z 递增向上
    var minX = 0, maxX = 0;
    for (var s = 0; s < slots.length; s++) {
      if (slots[s].gx2 < minX) minX = slots[s].gx2;
      if (slots[s].gx2 > maxX) maxX = slots[s].gx2;
    }
    var sideTiles = [];
    var baseY = 0;
    for (var sd = 0; sd < spec.sideN; sd++) {
      var right = sd === 1; // 堆0左、堆1右
      var sx = right ? maxX + 4 : minX - 4;
      for (var si = 0; si < spec.sideLen; si++) {
        sideTiles.push({ gx2: sx, gy2: baseY + si * 2, z: si, side: 1 });
      }
    }

    var all = slots.concat(sideTiles);
    for (var id = 0; id < all.length; id++) { all[id].id = id; all[id].side = all[id].side || 0; }

    // 图案分配：T/3 组，种类均匀 + 洗牌
    var groups = T / 3;
    var gk = [];
    for (var g = 0; g < groups; g++) gk.push(g % spec.kinds);
    shuffle(gk, rng);
    var order = all.slice();
    shuffle(order, rng);
    for (var o = 0; o < order.length; o++) order[o].kind = gk[(o / 3) | 0];

    // z 升序输出
    all.sort(function (a, b) { return a.z - b.z; });
    for (var r2 = 0; r2 < all.length; r2++) all[r2].id = r2;

    // 包围盒（渲染定位用）
    var mnX = 1e9, mxX = -1e9, mnY = 1e9, mxY = -1e9;
    for (var bb = 0; bb < all.length; bb++) {
      var t = all[bb];
      if (t.gx2 < mnX) mnX = t.gx2;
      if (t.gx2 > mxX) mxX = t.gx2;
      if (t.gy2 < mnY) mnY = t.gy2;
      if (t.gy2 > mxY) mxY = t.gy2;
    }

    return {
      lv: spec.lv, kinds: spec.kinds, slots: spec.slots, props: spec.props,
      tiles: all,
      mainZ: layersTiles.length - 1,
      box: { minX2: mnX, maxX2: mxX, minY2: mnY, maxY2: mxY },
    };
  }

  /* ---------------- 求解器（贪心 + 预算回溯）---------------- */
  // 返回 {ok, steps:[tileId...]}。同 kind 候选最多试 2 张（启发式剪枝，生成场景以重摇兜底）。
  function solve(board, slotsN, opts) {
    opts = opts || {};
    var nodesMax = opts.nodes || 1200;
    var tiles = board.tiles, n = tiles.length;
    var cov = buildCover(tiles);
    var covers = cov.covers, blockers = cov.blockers;

    var alive = new Uint8Array(n);
    var initAlive = opts.alive;
    var leftCnt = 0;
    for (var i0 = 0; i0 < n; i0++) { alive[i0] = initAlive ? (initAlive[i0] ? 1 : 0) : 1; leftCnt += alive[i0]; }
    var remBlk = new Int32Array(n);
    for (var j = 0; j < n; j++) {
      var cnt = 0;
      var bl = blockers[j];
      for (var b2 = 0; b2 < bl.length; b2++) if (alive[bl[b2]]) cnt++;
      remBlk[j] = cnt;
    }
    var left = leftCnt;

    var slotK = (opts.slotKinds || []).slice();   // demo/提示：中途槽状态
    var slotCnt = new Int16Array(16);
    for (var sk = 0; sk < slotK.length; sk++) slotCnt[slotK[sk]]++;
    var kindOf = new Uint8Array(n);
    var zOf = new Int32Array(n);
    for (var k2 = 0; k2 < n; k2++) { kindOf[k2] = tiles[k2].kind; zOf[k2] = tiles[k2].z; }

    var steps = [];
    var nodes = 0;
    var rng = opts.rng || Math.random;

    function match3() {
      for (var k = 0; k < 16; k++) {
        if (slotCnt[k] >= 3) {
          var removed = 0;
          for (var i = slotK.length - 1; i >= 0 && removed < 3; i--) {
            if (slotK[i] === k) { slotK.splice(i, 1); removed++; }
          }
          slotCnt[k] = 0;
          return true;
        }
      }
      return false;
    }

    function take(i) {
      alive[i] = 0; left--;
      var cs = covers[i];
      for (var c = 0; c < cs.length; c++) remBlk[cs[c]]--;
      slotK.push(kindOf[i]); slotCnt[kindOf[i]]++;
      steps.push(i);
    }
    function untake(i) {
      alive[i] = 1; left++;
      var cs = covers[i];
      for (var c = 0; c < cs.length; c++) remBlk[cs[c]]++;
      slotK.pop(); slotCnt[kindOf[i]]--;
      steps.pop();
    }

    function dfs() {
      if (nodes++ > nodesMax) return false;
      while (match3()) ;
      if (left === 0) return true;
      if (slotK.length >= slotsN) return false;

      var cands = [];
      for (var i = 0; i < n; i++) {
        if (!alive[i] || remBlk[i] > 0) continue;
        var c = slotCnt[kindOf[i]];
        var s = c === 2 ? 1000 : c === 1 ? 400 : 100;
        s += zOf[i] * 2 + rng() * 8;
        cands.push({ i: i, s: s });
      }
      cands.sort(function (a, b) { return b.s - a.s; });

      var triedKind = {}, triedPerKind = {};
      for (var ci = 0; ci < cands.length; ci++) {
        var it = cands[ci].i, kd = kindOf[it];
        // 同 kind 只试 2 张（遮挡结构近似，牺牲完备性换速度）
        triedPerKind[kd] = (triedPerKind[kd] || 0) + 1;
        if (triedPerKind[kd] > 2) continue;
        take(it);
        if (dfs()) return true;
        untake(it);
        if (nodes > nodesMax) return false;
      }
      return false;
    }

    var ok = dfs();
    return { ok: ok, steps: ok ? steps.slice() : null };
  }

  /* demo/提示：完整可解路径第一步，失败回落贪心单步。slotKinds=槽内 kind，alive=场上存活标记 */
  function pick(board, slotsN, slotKinds, aliveArr) {
    var r = solve(board, slotsN, { nodes: 600, slotKinds: slotKinds || [], alive: aliveArr });
    if (r.ok && r.steps.length) return r.steps[0];
    // 贪心单步兜底
    var tiles = board.tiles, n = tiles.length;
    var cov = coveredFlags(tiles);
    var slotCnt = new Int16Array(16);
    var bs = slotKinds || [];
    for (var b = 0; b < bs.length; b++) slotCnt[bs[b]]++;
    var best = -1, bestS = -1;
    for (var i = 0; i < n; i++) {
      if (cov[i] || (aliveArr && !aliveArr[i])) continue;
      var c = slotCnt[tiles[i].kind];
      var s = c === 2 ? 1000 : c === 1 ? 400 : 100;
      s += tiles[i].z * 2;
      if (s > bestS) { bestS = s; best = i; }
    }
    return best;
  }

  /* ---------------- 难度模拟器（难度曲线调参用，game 不调用）----------------
     skill: 0 纯随机 ~ 1 完美贪心。返回 {winRate, avgSteps}。 */
  function simulate(nRuns, L, cfg, skill) {
    skill = skill === undefined ? 0.75 : skill;
    var spec = specForLevel(L, cfg);
    var wins = 0, stepsSum = 0;
    for (var run = 0; run < nRuns; run++) {
      var rng = C.mulberry32((Math.random() * 4294967295) >>> 0);
      var sp = Object.assign({}, spec); sp.mainTiles = Math.max(24, spec.tiles - spec.sideN * spec.sideLen);
      var board = buildBoard(rng, sp);
      var covE = buildCover(board.tiles);
      var alive = [], remBlk = [];
      for (var i0 = 0; i0 < board.tiles.length; i0++) { alive.push(1); remBlk.push(covE.blockers[i0].length); }
      var left = board.tiles.length;
      var slot = [];
      var slotCnt = new Int16Array(16);
      var props = { out: spec.props.out, undo: 0, shuf: 0 };
      var tiles = board.tiles;
      var guard = tiles.length * 3;
      var result = 'lose';

      function doMatch3() {
        for (var k = 0; k < 16; k++) {
          if (slotCnt[k] >= 3) {
            var rem = 0;
            for (var x = slot.length - 1; x >= 0 && rem < 3; x--)
              if (slot[x] === k) { slot.splice(x, 1); rem++; }
            slotCnt[k] = 0;
            return true;
          }
        }
        return false;
      }
      function takeIdx(ix) {
        alive[ix] = 0; left--;
        var cs = covE.covers[ix] || []; // useOut 新增的顶层牌无覆盖边（z 最高）
        for (var c = 0; c < cs.length; c++) remBlk[cs[c]]--;
        slot.push(tiles[ix].kind); slotCnt[tiles[ix].kind]++;
      }
      function useOut() {
        props.out--;
        var moved = 0;
        for (var m = 0; m < 3 && slot.length; m++) {
          var k = slot.shift(); slotCnt[k]--;
          // 放回场上顶层随机位置
          var maxZ = 0;
          for (var t2 = 0; t2 < tiles.length; t2++) if (alive[t2] && tiles[t2].z > maxZ) maxZ = tiles[t2].z;
          var ref = tiles[(rng() * tiles.length) | 0];
          var nt = { id: tiles.length, kind: k, gx2: ref.gx2 + ((rng() * 3) | 0) - 1, gy2: ref.gy2 + ((rng() * 3) | 0) - 1, z: maxZ + 1 };
          tiles.push(nt);
          alive.push(1); remBlk.push(0);
          // 新牌压住相交牌
          for (var t3 = 0; t3 < tiles.length - 1; t3++) {
            if (!alive[t3]) continue;
            if (overlap(nt, tiles[t3])) remBlk[t3]++;
          }
          moved++;
        }
        left += moved;
      }

      while (guard-- > 0) {
        while (doMatch3()) ;
        if (left === 0) { result = 'win'; break; }
        if (slot.length >= spec.slots) {
          if (props.out > 0) { useOut(); continue; }
          break; // lose
        }
        // 道具策略：槽临界且无 2 同可凑
        if (slot.length >= spec.slots - 1 && props.out > 0 && rng() < 0.5) {
          var hasPair = false;
          for (var pk = 0; pk < 16; pk++) if (slotCnt[pk] === 2) hasPair = true;
          if (!hasPair && slotCnt[slot[slot.length - 1]] !== 2) { useOut(); continue; }
        }
        var cands = [];
        for (var ci = 0; ci < tiles.length; ci++) {
          if (!alive[ci] || remBlk[ci] > 0) continue;
          var cc = slotCnt[tiles[ci].kind];
          var s = cc === 2 ? 1000 : cc === 1 ? 400 : 100;
          s += tiles[ci].z * 2;
          cands.push({ i: ci, s: s });
        }
        if (!cands.length) break;
        var choice;
        if (rng() < skill) {
          cands.sort(function (a, b) { return b.s - a.s; });
          choice = cands[0].i;
        } else {
          choice = cands[(rng() * cands.length) | 0].i;
        }
        takeIdx(choice);
        stepsSum++;
      }
      if (result === 'win') wins++;
    }
    return { winRate: wins / nRuns, avgSteps: stepsSum / nRuns };
  }

  /* ---------------- 生成入口（可解验证 + 重摇）---------------- */
  function genLevel(L, cfg, rngIn) {
    var spec = specForLevel(L, cfg);
    var base = C.levelSeed(L);
    var tries = cfg.guaranteed ? 40 : 1;
    var last = null;
    for (var a = 0; a < tries; a++) {
      var rng = rngIn || C.mulberry32((base + a * 7919) >>> 0);
      var sp = Object.assign({}, spec);
      sp.mainTiles = Math.max(24, spec.tiles - spec.sideN * spec.sideLen);
      var b = buildBoard(rng, sp);
      last = b;
      if (!cfg.guaranteed) break;
      if (solve(b, spec.slots, { nodes: 1200 }).ok) return b;
    }
    if (cfg.guaranteed) {
      for (var a2 = 0; a2 < 15; a2++) {
        var rng2 = C.mulberry32((base + 999983 + a2 * 7919) >>> 0);
        var sp2 = Object.assign({}, spec);
        sp2.mainTiles = Math.max(24, spec.tiles - spec.sideN * spec.sideLen);
        sp2.density = Math.max(0.4, spec.density * 0.8);
        sp2.layers = Math.max(3, spec.layers - 1);
        var b2 = buildBoard(rng2, sp2);
        if (solve(b2, sp2.slots, { nodes: 1200 }).ok) return b2;
      }
    }
    return last;
  }

  return {
    DEFAULT_CFG: DEFAULT_CFG,
    specForLevel: specForLevel,
    overlap: overlap,
    buildCover: buildCover,
    coveredFlags: coveredFlags,
    genLevel: genLevel,
    solve: solve,
    pick: pick,
    simulate: simulate,
  };
})();

</script>

<script>
/* ===== src/audio.js ===== */
window.SH=window.SH||{}; SH.AUDIO=(()=>{
'use strict';

/* ============================================================
   羊了个羊 · AUDIO 子系统（WebAudio 程序化合成，零外部音频文件）
   - init()：能力探测（仅探测不实例化）；unlock()：首手势内调用，幂等
   - play(name, vol)：cue 即发（vol 数字或 {vol,rate}）
   - startBGM()/stopBGM()/duck(ms)：BGM 走 bgmBus，duck 压到 30%
   - setBGMVolume / setSFXVolume / setMasterVolume（实时生效）
   - applyOverrides(map)：{cue:dataURL} 整表替换；解码成功走 buffer，失败回落合成
   - document.visibilitychange：隐藏停 BGM，回前台续播（unlock 补启 wanted 循环）
   - 无 AudioContext 环境（node 自测）全程静默降级；非有限 freq/vol 一律静默跳过
   ============================================================ */

const NAMES=['pick','place','match','deny','out','undo','shuffle','win','lose','click','revive','bgm'];

/* ---------- 能力检测（仅探测，不实例化；首次 unlock 才 new，避免 autoload 告警） ---------- */
let AC=null;
try{
  if(typeof window!=='undefined') AC=window.AudioContext||window.webkitAudioContext||null;
}catch(e){ AC=null; }

/* ---------- 内部状态 ---------- */
let ctx=null, master=null, sfxBus=null, bgmBus=null, bgmDuck=null, noiseBuf=null;
let masterVol=1, sfxVol=0.9, bgmVol=0.45;           // 默认值与 DEFAULT_CFG 音画字段一致
const DUCK_LVL=0.3;                                 // duck 时 BGM 压到 30%
let duckTimer=0, bgmAutoPaused=false;
const ov={ raw:{}, buf:{} };                        // 自定义音效：dataURL / 解码后 buffer
const loops={
  bgm:{ on:false, wanted:false, timer:0, step:0, nextT:0, nodes:null }
};

function fin(v){ return typeof v==='number'&&isFinite(v); }
function now(){ return ctx?ctx.currentTime:0; }
function clamp01(v){
  v=+v; if(!isFinite(v)||!(v>=0)) return 0;
  return v>1?1:v;
}

/* ---------- 图构建（unlock 时一次） ---------- */
function buildGraph(){
  master=ctx.createGain(); master.gain.value=masterVol; master.connect(ctx.destination);
  bgmDuck=ctx.createGain(); bgmDuck.gain.value=1; bgmDuck.connect(master);
  bgmBus=ctx.createGain(); bgmBus.gain.value=bgmVol; bgmBus.connect(bgmDuck);
  sfxBus=ctx.createGain(); sfxBus.gain.value=sfxVol; sfxBus.connect(master);
  const len=Math.floor(ctx.sampleRate*1.2);
  noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
}

/* ---------- 合成小工具（全部带非有限参数防御） ---------- */
function noiseSrc(t,dur){
  const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  s.start(t); s.stop(t+dur+0.06); return s;
}
function envG(t,a,peak,hold,rel){
  if(!(fin(peak)&&peak>0)) peak=0.0001;             // 坏峰值 → 静默
  a=fin(a)&&a>0?a:0.005; hold=fin(hold)&&hold>0?hold:0; rel=fin(rel)&&rel>0?rel:0.05;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+a);
  if(hold>0) g.gain.setValueAtTime(peak,t+a+hold);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+rel);
  return g;
}
function tone(t,type,f0,f1,dur,peak,dest){
  if(!fin(f0)||f0<=0) return null;                  // 坏 freq → 静默跳过
  if(!fin(dur)||dur<=0) return null;
  if(!fin(peak)||peak<=0) return null;              // 坏 vol → 静默跳过
  const o=ctx.createOscillator(); o.type=type;
  o.frequency.setValueAtTime(f0,t);
  if(fin(f1)&&f1>0&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  const g=envG(t,0.004,peak,0,dur);
  o.connect(g); g.connect(dest||sfxBus);
  o.start(t); o.stop(t+dur+0.1);
  return o;
}
function clickNoise(t,hpF,peak,rel){
  if(!fin(hpF)||hpF<=0) return;
  const n=noiseSrc(t,rel+0.01);
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=hpF;
  const g=envG(t,0.001,peak,0,rel);
  n.connect(hp); hp.connect(g); g.connect(sfxBus);
}
/* 铃/亮铃双分音：基音 + 2.01 倍微失谐泛音，清脆 */
function bell(t,f,vel,dur,dest){
  if(!fin(f)||f<=0) return;
  if(!(fin(vel)&&vel>0)) return;
  if(!fin(dur)||dur<=0) dur=0.3;
  const g=envG(t,0.003,vel,0,dur);
  const o1=ctx.createOscillator(); o1.type='sine'; o1.frequency.value=f;
  const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=f*2.01;
  const g2=ctx.createGain(); g2.gain.value=0.3;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(dest||sfxBus);
  o1.start(t); o1.stop(t+dur+0.15);
  o2.start(t); o2.stop(t+dur*0.5);
}
/* 马林巴：正弦基音 + 快衰 4 倍泛音（共鸣管特征），温润木质 */
function marimba(t,f,vel,dur,dest){
  if(!fin(f)||f<=0) return;
  if(!(fin(vel)&&vel>0)) return;
  if(!fin(dur)||dur<=0) dur=0.3;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3800;
  const g=envG(t,0.004,vel,0,dur);
  const o1=ctx.createOscillator(); o1.type='sine'; o1.frequency.value=f;
  const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=f*4.02;
  const g2=ctx.createGain();
  g2.gain.setValueAtTime(vel*0.28,t);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(dest||sfxBus);
  o1.start(t); o1.stop(t+dur+0.2);
  o2.start(t); o2.stop(t+0.14);
}
/* 口哨：正弦 + 轻颤音 + 极轻呼气噪声；f1 有限且不同则滑音 */
function whistle(t,f0,f1,dur,vel){
  if(!fin(f0)||f0<=0) return;
  if(!fin(dur)||dur<=0) return;
  if(!(fin(vel)&&vel>0)) return;
  const o=ctx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(f0,t);
  const slide=fin(f1)&&f1>0&&f1!==f0;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur*0.85);
  const vib=ctx.createOscillator(); vib.frequency.value=5.8;
  const vg=ctx.createGain(); vg.gain.value=Math.min(30,f0*0.013);
  vib.connect(vg); vg.connect(o.frequency);
  const g=envG(t,0.03,vel,0.08,dur);
  o.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t+dur+0.2);
  vib.start(t); vib.stop(t+dur+0.2);
  const n=noiseSrc(t,dur*0.9);                      // 呼气感
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=2.5;
  bp.frequency.setValueAtTime(Math.max(400,f0*1.5),t);
  if(slide) bp.frequency.exponentialRampToValueAtTime(Math.max(400,f1*1.5),t+dur*0.85);
  const ng=envG(t,0.03,vel*0.12,0.04,dur*0.7);
  n.connect(bp); bp.connect(ng); ng.connect(sfxBus);
}

/* ---------- cue 合成器 ---------- */
const SYNTH={
  /* pick 拾取牌 ~55ms：木鱼短哒，短促不吵（高频出现） */
  pick(t,v){
    tone(t,'sine',980,620,0.05,0.34*v);
    tone(t,'triangle',1960,1500,0.03,0.06*v);
    clickNoise(t,2600,0.1*v,0.014);
  },
  /* place 落槽 ~80ms：木质轻叩，比 pick 略低沉 */
  place(t,v){
    tone(t,'sine',640,380,0.07,0.3*v);
    tone(t+0.006,'sine',240,170,0.06,0.14*v);
    clickNoise(t,1800,0.08*v,0.016);
  },
  /* match 三消 ~0.55s：马林巴上行三音（C6-E6-G6）+ 轻刷弦，清脆悦耳 */
  match(t,v){
    marimba(t,1046.5,0.3*v,0.34);
    marimba(t+0.08,1318.5,0.28*v,0.34);
    marimba(t+0.16,1568.0,0.3*v,0.42);
    const n=noiseSrc(t,0.3);                        // 轻刷弦：带通噪声上扫
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.4;
    bp.frequency.setValueAtTime(1600,t);
    bp.frequency.exponentialRampToValueAtTime(4600,t+0.26);
    const g=envG(t,0.05,0.055*v,0.08,0.16);
    n.connect(bp); bp.connect(g); g.connect(sfxBus);
  },
  /* deny 点被压住的牌 ~110ms：低哑短噗，温和否定不刺耳 */
  deny(t,v){
    tone(t,'sine',185,105,0.09,0.26*v);
    tone(t+0.012,'sine',120,88,0.07,0.1*v);
    const n=noiseSrc(t,0.06);                       // 软噗：低通噪声极轻
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520;
    const g=envG(t,0.008,0.09*v,0,0.05);
    n.connect(lp); lp.connect(g); g.connect(sfxBus);
  },
  /* out 移出道具 ~0.3s：滑哨上滑 */
  out(t,v){
    whistle(t,560,1480,0.26,0.2*v);
  },
  /* undo 撤销 ~0.28s：滑哨下滑 */
  undo(t,v){
    whistle(t,1250,480,0.24,0.19*v);
  },
  /* shuffle 洗牌 ~0.42s：噪声簇（带通摆频）+ 随机小叩 */
  shuffle(t,v){
    const n=noiseSrc(t,0.42);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.9;
    bp.frequency.setValueAtTime(900,t);
    bp.frequency.exponentialRampToValueAtTime(2600,t+0.18);
    bp.frequency.exponentialRampToValueAtTime(1100,t+0.4);
    const g=envG(t,0.03,0.14*v,0.16,0.2);
    n.connect(bp); bp.connect(g); g.connect(sfxBus);
    for(let i=0;i<6;i++){                           // 随机小叩簇
      const dt=0.02+Math.random()*0.3;
      tone(t+dt,'sine',700+Math.random()*900,420+Math.random()*300,0.04,0.09*v);
    }
  },
  /* win 过关 ~1.5s：口哨旋律（G5-C6-E6-G6 长音）+ 马林巴琶音垫底 + 亮点铃 */
  win(t,v){
    whistle(t,783.99,0,0.24,0.16*v);
    whistle(t+0.27,1046.5,0,0.24,0.16*v);
    whistle(t+0.54,1318.5,0,0.24,0.16*v);
    whistle(t+0.81,1568.0,0,0.52,0.18*v);
    const A=[523.25,659.25,783.99,1046.5,1318.5];   // C5 E5 G5 C6 E6 琶音
    for(let i=0;i<A.length;i++) marimba(t+0.02+i*0.07,A[i],0.13*v,0.3);
    bell(t+0.86,2093.0,0.09*v,0.5);
  },
  /* lose 失败 ~0.9s：温和下行三音（E5-C5-G4）+ 小滑尾，滑稽不沮丧 */
  lose(t,v){
    marimba(t,659.25,0.2*v,0.28);
    marimba(t+0.2,523.25,0.18*v,0.28);
    marimba(t+0.4,392.0,0.2*v,0.4);
    tone(t+0.68,'sine',330,262,0.2,0.08*v);
  },
  /* click UI 按键 ~40ms：轻嗒 */
  click(t,v){
    tone(t,'sine',1250,900,0.024,0.18*v);
    clickNoise(t,4400,0.05*v,0.01);
  },
  /* revive 复活 ~0.8s：亮铃上行（C6-E6-G6-C7） */
  revive(t,v){
    bell(t,1046.5,0.2*v,0.35);
    bell(t+0.09,1318.5,0.2*v,0.35);
    bell(t+0.18,1568.0,0.22*v,0.5);
    bell(t+0.27,2093.0,0.16*v,0.6);
  }
  /* bgm 仅作循环（startBGM），无单发形态 */
};

/* ---------- BGM：96bpm C 大调五声音阶（马林巴伴奏 + 口哨感正弦旋律，田园轻快，8 小节循环） ---------- */
const BPM=96, STEP=60/BPM/2;                        // 八分音符步长 0.3125s
const P={G2:98.00,A2:110.00,C3:130.81,D3:146.83,E3:164.81,G3:196.00,
         A4:440.00,C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880.00};
const MEL=[                                         // 4 乐句 ×16 步，null=休止（C 宫五声：C D E G A）
  ['E5',null,'G5',null,'A5',null,'G5','E5','D5',null,'C5',null,'D5',null,null,null],
  ['C5',null,'D5',null,'E5',null,'D5','C5','A4',null,'C5',null,null,null,'A4',null],
  ['A4',null,'C5',null,'D5',null,'E5',null,'G5',null,'A5','G5','E5',null,'D5',null],
  ['C5',null,'D5',null,'E5',null,'G5',null,'E5',null,'D5','C5','C5',null,null,null]
];
const BASS=['C3','G2','A2','G2','C3','A2','G2','C3']; // 每小节根音（8 小节循环）
const FIFTH={C3:'G3',G2:'D3',A2:'E3'};

function marBgm(t,f,vel){                           // 马林巴伴奏音色（走 bgmBus）
  if(!fin(f)||f<=0||!(fin(vel)&&vel>0)) return;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3000;
  const g=envG(t,0.004,vel,0,0.3);
  const o1=ctx.createOscillator(); o1.type='sine'; o1.frequency.value=f;
  const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=f*4.01;
  const g2=ctx.createGain();
  g2.gain.setValueAtTime(vel*0.25,t);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(bgmBus);
  o1.start(t); o1.stop(t+0.42);
  o2.start(t); o2.stop(t+0.1);
}
function whBgm(t,f,vel,dur){                        // 口哨感正弦旋律（走 bgmBus）
  if(!fin(f)||f<=0||!(fin(vel)&&vel>0)) return;
  const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
  const vib=ctx.createOscillator(); vib.frequency.value=5.2;
  const vg=ctx.createGain(); vg.gain.value=f*0.011;
  vib.connect(vg); vg.connect(o.frequency);
  const g=envG(t,0.04,vel,0.06,dur);
  o.connect(g); g.connect(bgmBus);
  o.start(t); o.stop(t+dur+0.25);
  vib.start(t); vib.stop(t+dur+0.25);
}
function shk(t,vel){                                // 轻沙锤（弱拍点缀）
  const n=noiseSrc(t,0.05);
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
  const g=envG(t,0.001,vel,0,0.04);
  n.connect(hp); hp.connect(g); g.connect(bgmBus);
}
function schedStep(step,t){
  const ph=Math.floor(step/16)%4, pos=step%16;
  const bar=Math.floor(step/8)%8, bp=step%8;
  const m=MEL[ph][pos];
  if(m){
    whBgm(t,P[m],(pos%8===0)?0.13:0.1,STEP*1.8);
    if(pos%8===0) marBgm(t,P[m]/2,0.06);            // 乐句起音低八度马林巴同步点缀
  }
  if(bp===0) marBgm(t,P[BASS[bar]],0.12);
  if(bp===4) marBgm(t,P[FIFTH[BASS[bar]]],0.055);
  if(bp===2||bp===6) shk(t,0.018);
}
function bgmPump(){                                 // 前瞻调度器
  const horizon=now()+0.22;
  let guard=0;
  while(loops.bgm.nextT<horizon&&guard++<128){
    schedStep(loops.bgm.step,loops.bgm.nextT);
    loops.bgm.nextT+=STEP;
    loops.bgm.step=(loops.bgm.step+1)%64;           // 64 步 = 8 小节循环
  }
}
function startBgmSched(){
  loops.bgm.step=0; loops.bgm.nextT=now()+0.08;
  bgmPump();
  loops.bgm.timer=setInterval(bgmPump,60);
}

/* ---------- 自定义音效 dataURL 解码（失败回落合成） ---------- */
function decodeRaw(k){
  try{
    const raw=ov.raw[k];
    if(!raw||!ctx||typeof atob!=='function') return;
    const b64=String(raw).split(',').pop()||'';
    const bin=atob(b64);
    const u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const done=(buf)=>{ try{ if(buf&&buf.duration>0) ov.buf[k]=buf; else fail(); }catch(e){} };
    const fail=()=>{ try{ delete ov.raw[k]; }catch(e){} };
    const p=ctx.decodeAudioData(u8.buffer,done,fail);
    if(p&&p.then) p.then(done,fail);
  }catch(e){ try{ delete ov.raw[k]; }catch(e2){} }
}

/* ============================================================
   对外 API
   ============================================================ */
function init(){
  /* 预留接口：仅能力探测。AudioContext 惰性创建于首次 unlock()（首手势内），避免 autoload 告警 */
  return !!AC;
}

function unlock(){
  try{
    if(!AC) return false;
    if(!ctx){ ctx=new AC(); buildGraph(); }
    if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    for(const k in ov.raw) decodeRaw(k);
    for(const k in loops){ if(loops[k].wanted&&!loops[k].on) startLoop(k); }  // 补启 wanted 未启循环
  }catch(e){}
  return !!ctx;
}

function play(name,vol){
  try{
    if(NAMES.indexOf(name)<0||name==='bgm') return;
    if(!ctx) return;
    if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    let v=1, rate=1;
    if(fin(vol)){                                   // play(name, 0.6) 契约签名
      v=Math.max(0,Math.min(2,vol));
    }else if(vol&&typeof vol==='object'){           // 兼容 {vol, rate}
      if(fin(vol.vol)) v=Math.max(0,Math.min(2,vol.vol));
      if(fin(vol.rate)&&vol.rate>0) rate=vol.rate;
    }
    const t=now()+0.02;
    if(ov.buf[name]){                               // 自定义音效优先（走 sfxBus 受 SFX 音量控）
      const s=ctx.createBufferSource(); s.buffer=ov.buf[name];
      s.playbackRate.value=rate;
      s.connect(sfxBus); s.start(t);
      return;
    }
    const f=SYNTH[name];
    if(f) f(t,v);                                   // 合成回落
  }catch(e){}
}

function startLoop(name){
  try{
    if(name!=='bgm') return;
    const L=loops[name];
    if(L.on) return;                                // 重复 start 幂等
    if(!ctx){ L.wanted=true; return; }              // 未解锁：记意图，unlock 后补启
    if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    L.on=true;
    if(ov.buf[name]){                               // 自定义循环音频（走 bgmBus 受 BGM 音量控）
      const s=ctx.createBufferSource(); s.buffer=ov.buf[name]; s.loop=true;
      const t=now();
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(1,t+0.15);
      s.connect(g); g.connect(bgmBus);
      s.start(t);
      L.nodes={src:[s],gains:[g]};
    }else{
      startBgmSched();
    }
  }catch(e){}
}

function stopLoop(name){
  try{
    const L=loops[name];
    if(!L) return;
    L.wanted=false;
    if(!L.on) return;                               // 重复 stop 幂等
    L.on=false;
    if(L.timer){ clearInterval(L.timer); L.timer=0; }
    const N=L.nodes; L.nodes=null;
    if(N){
      const t=now();
      (N.gains||[]).forEach((g)=>{ try{
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(g.gain.value,t);
        g.gain.linearRampToValueAtTime(0.0001,t+0.12);
      }catch(e){} });
      (N.src||[]).forEach((s)=>{ try{ s.stop(t+0.16); }catch(e){} });
    }
  }catch(e){}
}

function startBGM(){ startLoop('bgm'); }
function stopBGM(){ stopLoop('bgm'); }

function duck(ms){
  try{
    if(!ctx||!bgmDuck) return;
    const d=Math.max(80,(fin(ms)&&ms>0)?ms:600);
    if(duckTimer){ clearTimeout(duckTimer); duckTimer=0; }
    const t=now();
    bgmDuck.gain.cancelScheduledValues(t);
    bgmDuck.gain.setTargetAtTime(DUCK_LVL,t,0.05);
    duckTimer=setTimeout(()=>{
      duckTimer=0;
      try{
        if(ctx&&bgmDuck){
          const t2=now();
          bgmDuck.gain.cancelScheduledValues(t2);
          bgmDuck.gain.setTargetAtTime(1,t2,0.15);
        }
      }catch(e){}
    },d);
  }catch(e){}
}

function setMasterVolume(v){
  masterVol=clamp01(v);
  try{ if(master){ const t=now(); master.gain.cancelScheduledValues(t); master.gain.setTargetAtTime(masterVol,t,0.03); } }catch(e){}
}
function setSFXVolume(v){
  sfxVol=clamp01(v);
  try{ if(sfxBus){ const t=now(); sfxBus.gain.cancelScheduledValues(t); sfxBus.gain.setTargetAtTime(sfxVol,t,0.03); } }catch(e){}
}
function setBGMVolume(v){
  bgmVol=clamp01(v);
  try{ if(bgmBus){ const t=now(); bgmBus.gain.cancelScheduledValues(t); bgmBus.gain.setTargetAtTime(bgmVol,t,0.03); } }catch(e){}
}

function applyOverrides(map){
  try{
    ov.raw={}; ov.buf={};                           // 整表替换语义
    if(!map) return;
    for(const k in map){
      if(NAMES.indexOf(k)<0) continue;
      const v=map[k];
      if(!v||typeof v!=='string') continue;
      ov.raw[k]=v;
      if(ctx) decodeRaw(k);
    }
  }catch(e){}
}

/* ---------- 页面隐藏时停 BGM，回前台恢复 ---------- */
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('visibilitychange',()=>{
    try{
      if(document.hidden){
        if(loops.bgm.on){ bgmAutoPaused=true; stopLoop('bgm'); }
      }else{
        if(bgmAutoPaused){ bgmAutoPaused=false; startLoop('bgm'); }
        if(ctx&&ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
      }
    }catch(e){}
  });
}

return {
  init, unlock, play, startLoop, stopLoop, startBGM, stopBGM, duck,
  setBGMVolume, setSFXVolume, setMasterVolume,
  applyOverrides,
  names: NAMES.slice()
};

})();

</script>
<script>
/* ===== src/fx.js ===== */
/* sheep-a-sheep fx —— Canvas 粒子（星屑/彩纸/圆环/飘字），对象池，禁 shadowBlur */
window.SH = window.SH || {};
SH.FX = (function () {
  'use strict';

  var pool = [], MAXN = 320;
  var confettiOn = false, confettiT = 0;
  var W = 0, H = 0;

  function resize(w, h) { W = w; H = h; }
  function clear() { pool.length = 0; confettiOn = false; }

  function spawn(p) { if (pool.length < MAXN) pool.push(p); }

  // 星屑爆发（消除/道具）
  function burst(x, y, color, n) {
    n = n || 14;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 180;
      spawn({
        t: 'spark', x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        g: 320, life: 0.5 + Math.random() * 0.35, age: 0,
        size: 2 + Math.random() * 3.5, rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 10,
        color: color || '#E8B84B',
      });
    }
  }

  // 扩散圆环（消除中心）
  function ring(x, y, color) {
    spawn({ t: 'ring', x: x, y: y, life: 0.38, age: 0, size: 8, color: color || '#FFFFFF' });
  }

  // 飘字
  function float(x, y, text, color, size) {
    spawn({ t: 'text', x: x, y: y, vy: -56, life: 0.8, age: 0, text: text, color: color || '#FFF7E6', size: size || 22 });
  }

  // 过关彩纸：从顶部撒 1.6s
  function confetti() { confettiOn = true; confettiT = 1.6; }

  function step(dt) {
    if (confettiOn) {
      confettiT -= dt;
      if (confettiT <= 0) confettiOn = false;
      if (Math.random() < 0.7) {
        spawn({
          t: 'paper', x: Math.random() * W, y: -12,
          vx: (Math.random() - 0.5) * 60, vy: 90 + Math.random() * 130, g: 30,
          life: 3.4, age: 0, size: 4 + Math.random() * 5, rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 8,
          color: ['#E8B84B', '#8FBF6B', '#E88B5B', '#F5F0E4', '#D9A3A3'][(Math.random() * 5) | 0],
        });
      }
    }
    for (var i = pool.length - 1; i >= 0; i--) {
      var p = pool[i];
      p.age += dt;
      if (p.age >= p.life) { pool.splice(i, 1); continue; }
      if (p.t === 'spark' || p.t === 'paper') {
        p.vy += (p.g || 0) * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      } else if (p.t === 'text') {
        p.y += p.vy * dt;
      }
    }
  }

  function draw(ctx) {
    for (var i = 0; i < pool.length; i++) {
      var p = pool[i];
      var k = 1 - p.age / p.life;
      if (p.t === 'spark') {
        ctx.save();
        ctx.globalAlpha = k;
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      } else if (p.t === 'ring') {
        ctx.save();
        ctx.globalAlpha = k * 0.8;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3 * k + 0.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size + (1 - k) * 46, 0, 6.3);
        ctx.stroke();
        ctx.restore();
      } else if (p.t === 'text') {
        ctx.save();
        ctx.globalAlpha = Math.min(1, k * 2);
        ctx.fillStyle = p.color;
        ctx.font = '700 ' + p.size + 'px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
        ctx.restore();
      } else if (p.t === 'paper') {
        ctx.save();
        ctx.globalAlpha = Math.min(1, k * 3);
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }
    }
  }

  return { resize: resize, clear: clear, burst: burst, ring: ring, float: float, confetti: confetti, step: step, draw: draw };
})();

</script>
<script>
/* ===== src/config-panel.js ===== */
/* =========================================================
 * 羊了个羊 · 游戏内设置面板 — SH.PANEL
 * 契约接口：mount({root,get,onChange,onClose,stats,onClearProgress,audioNames,onAudioOverride})
 *           open() / close() / isOpen()
 * - open() 时 work = sanitize(deepCopy(opts.get()))，缺失字段补默认值
 * - 任何编辑先改 work，再 onChange(完整深拷贝快照)；音效替换额外走 onAudioOverride(map)

  ];

  var TABS = [['play', '玩法'], ['look', '外观'], ['av', '音画/数据']];

  /* 滑杆注册表：key -> [标签, min, max, step, 说明] */
  var SLIDERS = {
    slots:         ['槽位格数', 5, 9, 1, '底部待消槽位数，越少越难'],
    kindsStart:    ['首关种类', 3, 8, 1, '第 1 关出现的图案种类数'],

    layersStart:   ['首关层数', 2, 5, 1, '第 1 关牌堆的叠层层数'],
    layersMax:     ['层数上限', 3, 9, 1, '叠层层数的天花板'],
    density:       ['叠压密度', 0.4, 0.85, 0.05, '上层牌压住下层牌的程度，越高越缠'],
    sideLen:       ['侧堆长度', 3, 8, 1, '每条侧堆柱的牌数'],
    propsOut:      ['移出道具', 0, 9, 1, '「移出」每关可用次数'],

    propsShuffle:  ['洗牌道具', 0, 9, 1, '「洗牌」每关可用次数'],
    revives:       ['复活次数', 0, 3, 1, '失败弹窗里每关可复活的次数'],
    breatherEvery: ['喘息关间隔', 0, 10, 1, '每 N 关安排一关低难喘息关（0=关闭）'],
    sfxVol:        ['音效音量', 0, 1, 0.05, ''],
    bgmVol:        ['音乐音量', 0, 1, 0.05, '']
  };
  var PLAY_ORDER = ['slots', 'kindsStart', 'kindsMax', 'tilesStart', 'tilesPerLevel', 'tilesMax',
                    'layersStart', 'layersMax', 'density', 'sideLen',
                    'propsOut', 'propsUndo', 'propsShuffle', 'revives', 'breatherEvery'];
  var FMT = {
    slots: function (v) { return v + ' 格'; },
    kindsStart: function (v) { return v + ' 种'; },
    kindsMax: function (v) { return v + ' 种'; },
    tilesStart: function (v) { return v + ' 张'; },
    tilesPerLevel: function (v) { return '+' + v + ' 张'; },
    tilesMax: function (v) { return v + ' 张'; },
    layersStart: function (v) { return v + ' 层'; },
    layersMax: function (v) { return v + ' 层'; },

  }
  function stepClamp(v, min, max, step, fb) {
    var n = Number(v);
    if (!isFinite(n)) return fb;
    n = Math.min(max, Math.max(min, n));
    n = min + Math.round((n - min) / step) * step;
    n = Math.min(max, Math.max(min, n));
    return step < 1 ? Math.round(n * 100) / 100 : Math.round(n);
  }

    for (var i = 0; i < CUE_TABLE.length; i++) if (CUE_TABLE[i][0] === id) return CUE_TABLE[i][1];

  /* 难度粗评：按首关牌量 / 种类 / 密度 / 槽位稀缺 / 层数打分 */
  function difficultyLine() {
    if (!work) return '';
    var tn = clamp((work.tilesStart - 24) / 36, 0, 1, 0);
    var kn = clamp((work.kindsStart - 3) / 5, 0, 1, 0);
    var dn = clamp((work.density - 0.4) / 0.45, 0, 1, 0);
    var sn = clamp((9 - work.slots) / 4, 0, 1, 0);
    var ln = clamp((work.layersStart - 2) / 3, 0, 1, 0);
    var score = tn * 0.36 + kn * 0.20 + dn * 0.26 + sn * 0.10 + ln * 0.08;
    var name, desc;
    if (!work.guaranteed) { name = '地狱'; desc = '未验证可解，纯属硬核自虐'; }
    else if (score < 0.36) { name = '休闲'; desc = '牌少层浅，随手点点就能过'; }
    else if (score < 0.56) { name = '进阶'; desc = '有点上头，偶尔要动动脑'; }
    else if (score < 0.76) { name = '硬核'; desc = '槽位紧张，得算着拿牌'; }

  /* ---------------- 白名单 sanitize（全部 clamp 到 schema 区间） ---------------- */
  function sanitize(raw) {
    var d = defaultCfg();
    if (!raw || typeof raw !== 'object') return d;
    d.slots = stepClamp(raw.slots, 5, 9, 1, d.slots);
    d.kindsStart = stepClamp(raw.kindsStart, 3, 8, 1, d.kindsStart);
    d.kindsMax = stepClamp(raw.kindsMax, 6, 14, 1, d.kindsMax);
    d.tilesStart = stepClamp(raw.tilesStart, 24, 60, 3, d.tilesStart);
    d.tilesPerLevel = stepClamp(raw.tilesPerLevel, 0, 24, 1, d.tilesPerLevel);
    d.tilesMax = stepClamp(raw.tilesMax, 60, 198, 3, d.tilesMax);
    d.layersStart = stepClamp(raw.layersStart, 2, 5, 1, d.layersStart);
    d.layersMax = stepClamp(raw.layersMax, 3, 9, 1, d.layersMax);
    d.density = stepClamp(raw.density, 0.4, 0.85, 0.05, d.density);
    d.sideLen = stepClamp(raw.sideLen, 3, 8, 1, d.sideLen);
    d.sideStacks = stepClamp(raw.sideStacks, 0, 2, 1, d.sideStacks);
    d.propsOut = stepClamp(raw.propsOut, 0, 9, 1, d.propsOut);
    d.propsUndo = stepClamp(raw.propsUndo, 0, 9, 1, d.propsUndo);
    d.propsShuffle = stepClamp(raw.propsShuffle, 0, 9, 1, d.propsShuffle);
    d.revives = stepClamp(raw.revives, 0, 3, 1, d.revives);
    d.breatherEvery = stepClamp(raw.breatherEvery, 0, 10, 1, d.breatherEvery);
    d.tileSkin = stepClamp(raw.tileSkin, 0, 2, 1, d.tileSkin);
    d.sfxVol = clamp(raw.sfxVol, 0, 1, d.sfxVol);
    d.bgmVol = clamp(raw.bgmVol, 0, 1, d.bgmVol);
    if (typeof raw.guaranteed === 'boolean') d.guaranteed = raw.guaranteed;
    if (typeof raw.muted === 'boolean') d.muted = raw.muted;
    if (raw.icons && typeof raw.icons === 'object') {
      var ic = {};
      KINDS.forEach(function (id) {
        var v = raw.icons[id];
        if (typeof v === 'string' && v.indexOf('data:image') === 0) ic[id] = v;
      });
      d.icons = ic;
    }
    if (typeof raw.bgCustom === 'string'
        && (raw.bgCustom === '' || raw.bgCustom.indexOf('data:image') === 0)) d.bgCustom = raw.bgCustom;
    if (raw.audioOverrides && typeof raw.audioOverrides === 'object') {
      var ov = {};
      cueList().forEach(function (p) {
        var v = raw.audioOverrides[p[0]];
        if (typeof v === 'string' && v.indexOf('data:') === 0) ov[p[0]] = v;
      });
      d.audioOverrides = ov;
    }
    /* 交叉约束：起点不得超过天花板 */
    if (d.kindsStart > d.kindsMax) d.kindsMax = d.kindsStart;
    if (d.layersStart > d.layersMax) d.layersMax = d.layersStart;
    if (d.tilesStart > d.tilesMax) d.tilesMax = d.tilesStart;
    return d;
  }
