<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TC.ART zoom</title>
<style>
  body{font:13px system-ui;margin:0;background:#7ec3f2;color:#223;padding:10px}
  .row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
  .cell{text-align:center}
  .lbl{font-size:11px}
  .dark{background:#1c3454;border-radius:10px;padding:8px}
</style>
</head>
<body>
<div class="row">
  <div class="cell"><img width="300" src="" id="hk"><div class="lbl">hook 300</div></div>
  <div class="cell dark"><img width="300" src="" id="hk2"><div class="lbl">hook 深底</div></div>
  <div class="cell"><img width="360" src="" id="rm"><div class="lbl">room 360</div></div>
  <div class="cell"><img height="60" src="" id="rm60"><div class="lbl">room 60</div></div>
</div>
<div class="row" id="ic" style="margin-top:14px"></div>
<script src="../src/art.js"></script>
<script>
  var A = window.TC.ART;
  document.getElementById('hk').src = A.hook();
  document.getElementById('hk2').src = A.hook();
  document.getElementById('rm').src = A.room(2);
  document.getElementById('rm60').src = A.room(2);
  var htm = '';
  ['reset','heart','info','trophy','volumeOn','volumeOff','home','play','upload'].forEach(function (n) {
    htm += '<div class="cell"><div class="dark" style="display:inline-block;padding:8px;border-radius:12px"><img width="90" src="' + A.icon(n) + '"></div><div class="lbl">' + n + '</div></div>';
  });
  document.getElementById('ic').innerHTML = htm;
</script>
</body>
</html>
