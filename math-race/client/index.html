<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#c9573f">
<title>口算竞速场 · Math Race</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c9573f'/%3E%3Cpath d='M8 22V10l8 5 8-5v12' stroke='%23fffdf6' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* 口算竞速场 · 校园运动会风：米纸底 / 跑道砖红 / 草地绿 / 墨线描边 */
:root {
  --paper: #f7f2e7;
  --cream: #fffdf6;
  --ink: #2c2620;
  --ink-soft: #7a6f5d;
  --line: #e6dbc4;
  --track: #c9573f;
  --track-dark: #9c3f2c;
  --grass: #3f7a4e;
  --grass-dark: #2f5e3b;
  --water: #2f6b8e;
  --water-dark: #24526d;
  --gold: #d9a13b;
  --silver: #aeb6bd;
  --bronze: #b0713f;
  --ok: #3e8e4e;
  --bad: #c0392b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
#app { min-height: 100%; }
button { font-family: inherit; cursor: pointer; }
input { font-family: inherit; }

.screen {
  min-height: 100dvh;
  max-width: 640px;
  margin: 0 auto;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}

/* ---------- 通用控件 ---------- */
.btn {
  border: 2px solid var(--ink);
  background: var(--cream);
  color: var(--ink);
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 17px;
  font-weight: 700;
  box-shadow: 0 3px 0 rgba(44, 38, 32, 0.85);
}
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn:disabled { opacity: 0.55; pointer-events: none; }
.btn-primary { background: var(--track); color: #fff; border-color: var(--track-dark); box-shadow: 0 4px 0 var(--track-dark); }
.btn-green { background: var(--grass); color: #fff; border-color: var(--grass-dark); box-shadow: 0 4px 0 var(--grass-dark); }
.btn-sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; box-shadow: 0 2px 0 rgba(44, 38, 32, 0.85); }
.btn-danger { color: var(--bad); background: var(--cream); border-color: var(--bad); box-shadow: 0 2px 0 var(--bad); }

.text {
  width: 100%;
  border: 2px solid var(--ink);
  background: #fff;
  border-radius: 9px;
  padding: 12px 14px;
  font-size: 17px;
  color: var(--ink);
  outline: none;
}
.text:focus { border-color: var(--track); }
.text.code { letter-spacing: 6px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; font-size: 22px; }
.text.sm { padding: 6px 8px; font-size: 14px; width: auto; }

.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 9px; overflow: hidden; background: #fff; }
.seg button { border: none; background: #fff; padding: 8px 13px; font-size: 14px; font-weight: 600; color: var(--ink); }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--ink); color: var(--paper); }
.seg button:disabled { opacity: 0.5; cursor: default; }

.field { margin-bottom: 14px; }
.field > .cap { display: block; font-size: 13px; font-weight: 700; color: var(--ink-soft); letter-spacing: 1px; margin-bottom: 6px; }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(8px);
  background: var(--ink); color: var(--paper);
  padding: 10px 18px; border-radius: 9px; font-size: 14px;
  opacity: 0; transition: 0.25s; pointer-events: none; z-index: 90; max-width: 86vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.overlay { position: fixed; inset: 0; background: rgba(44, 38, 32, 0.55); display: grid; place-items: center; z-index: 60; padding: 18px; }
.modal { background: var(--cream); border: 2px solid var(--ink); border-radius: 14px; padding: 22px; width: min(380px, 94vw); box-shadow: 6px 6px 0 rgba(44, 38, 32, 0.8); }
.modal h3 { font-size: 19px; margin-bottom: 12px; }
.modal .qr { display: grid; place-items: center; background: #fff; border: 2px dashed var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.modal .qr svg { width: min(220px, 58vw); height: auto; display: block; }
.modal .link { font-size: 12px; color: var(--ink-soft); word-break: break-all; margin-bottom: 12px; }
.modal .row { display: flex; gap: 8px; }
.modal .row .btn { flex: 1; }

/* ---------- 首页 ---------- */
.home-hero { padding: 26px 2px 18px; position: relative; }
.home-hero h1 { font-size: clamp(34px, 9vw, 44px); font-weight: 900; letter-spacing: 3px; line-height: 1.1; }
.home-hero .sub { margin-top: 8px; color: var(--ink-soft); font-size: 14px; letter-spacing: 1px; }
.bunting { position: absolute; right: 0; top: 8px; width: 110px; }

.panel { background: var(--cream); border: 2px solid var(--ink); border-radius: 12px; padding: 16px; box-shadow: 5px 5px 0 rgba(44, 38, 32, 0.85); }
.panel + .panel { margin-top: 16px; }
.panel .ptitle { font-size: 15px; font-weight: 800; letter-spacing: 2px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.panel .ptitle::after { content: ""; flex: 1; border-top: 2px dashed var(--line); }

.grade-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grade-btn { border: 2px solid var(--ink); background: #fff; border-radius: 9px; padding: 11px 0; font-size: 15px; font-weight: 700; color: var(--ink); }
.grade-btn.on { background: var(--ink); color: var(--paper); }

.home-foot { margin-top: auto; padding-top: 18px; color: var(--ink-soft); font-size: 12px; line-height: 1.8; }

/* ---------- 大厅 ---------- */
.lobby-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lobby-top .lbl { font-size: 12px; color: var(--ink-soft); letter-spacing: 1px; }
.room-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 32px; font-weight: 800; letter-spacing: 4px; line-height: 1; }
.lobby-top .spacer { flex: 1; }
.lobby-meta { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.lobby-meta .cap { font-size: 12px; color: var(--ink-soft); font-weight: 700; }

.players { flex: 1; overflow-y: auto; margin-top: 6px; min-height: 120px; }
.player-row { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px dashed var(--line); }
.player-row.offline { opacity: 0.45; }
.bib { width: 30px; height: 30px; flex: none; background: #fff; border: 2px solid var(--ink); border-radius: 7px; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.pdot { width: 13px; height: 13px; border-radius: 50%; flex: none; border: 2px solid rgba(44, 38, 32, 0.25); }
.pname { font-size: 16px; font-weight: 700; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname .role { font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-left: 4px; }
.grade-badge { border: 1.5px solid var(--ink); border-radius: 5px; padding: 2px 7px; font-size: 12px; font-weight: 700; background: #fff; flex: none; }
button.grade-badge { cursor: pointer; }
.row-end { margin-left: auto; display: flex; gap: 6px; flex: none; }

.lobby-foot { position: sticky; bottom: 0; background: var(--paper); border-top: 2px dashed var(--line); margin-top: 10px; padding: 12px 0 2px; }
.waiting { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 10px 0; letter-spacing: 1px; }

/* ---------- 答题 ---------- */
.race-head { display: flex; align-items: baseline; gap: 12px; }
.timer { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.race-prog { font-size: 15px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.race-head .spacer { flex: 1; }

.lanes { position: relative; display: flex; flex-direction: column; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; margin-top: 10px; background: var(--track); }
.lanes.t-dragon { background: var(--water); }
.lane { position: relative; height: 44px; }
.lanes.mini .lane { height: 30px; }
.lane + .lane { border-top: 1px dashed rgba(255, 255, 255, 0.5); }
.lanes.t-track .lane:nth-child(odd) { background: rgba(0, 0, 0, 0.05); }
.lanes.t-dragon .lane:nth-child(odd) { background: rgba(255, 255, 255, 0.06); }
.finishline { position: absolute; top: 0; bottom: 0; right: 8%; width: 10px; z-index: 1;
  background-image: repeating-conic-gradient(#fffdf6 0% 25%, var(--ink) 0% 50%);
  background-size: 10px 10px; opacity: 0.85; }
.runner { position: absolute; bottom: 3px; left: 4%; display: flex; align-items: center; gap: 5px; z-index: 2; transition: left 0.5s cubic-bezier(0.22, 0.9, 0.36, 1), transform 0.35s ease; }
.runner .avatar { height: 26px; width: auto; display: block; filter: drop-shadow(0 0 1.5px var(--cream)) drop-shadow(0 1px 1px rgba(0, 0, 0, 0.35)); }
.lanes.mini .runner .avatar { height: 18px; }
.runner .tag { background: rgba(255, 253, 246, 0.94); border: 1.5px solid var(--ink); border-radius: 5px; padding: 1px 5px; font-size: 11px; font-weight: 700; white-space: nowrap; max-width: 22vw; overflow: hidden; text-overflow: ellipsis; }
.lanes.mini .runner .tag { display: none; }
.runner.mine .tag { background: var(--ink); color: var(--paper); }
.runner .pct { font-size: 10px; font-weight: 800; color: #fffdf6; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); font-variant-numeric: tabular-nums; white-space: nowrap; }
.runner .rank { background: rgba(255, 253, 246, 0.94); border: 1.5px solid var(--ink); color: var(--ink); border-radius: 50%; width: 17px; height: 17px; display: grid; place-items: center; font-size: 10px; font-weight: 800; flex: none; }
.runner.done .avatar { animation: cheer 0.5s ease infinite alternate; }
/* 冲线后整体翻到终点线左侧，名字与百分比不会被赛道右缘裁掉 */
.runner.at-finish { transform: translateX(-100%); }
.runner.at-finish .pct { order: -1; background: rgba(44, 38, 32, 0.55); border-radius: 4px; padding: 1px 4px; text-shadow: none; }
@keyframes cheer { to { transform: translateY(-4px); } }
.runner.offline-run { opacity: 0.5; }

.qcard { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 8px 0; min-height: 180px; }
.qtext { font-size: clamp(32px, 10.5vw, 54px); font-weight: 800; letter-spacing: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ansline { margin-top: 16px; min-height: 30px; font-size: 21px; color: var(--ink-soft); letter-spacing: 5px; font-variant-numeric: tabular-nums; }
.ansline b { color: var(--ink); }
.feedback { position: absolute; inset: -8px; border-radius: 14px; display: grid; place-items: center; font-size: clamp(22px, 6.4vw, 30px); font-weight: 800; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 5; }
.feedback.show { opacity: 1; }
.feedback.ok { background: rgba(62, 142, 78, 0.16); color: var(--ok); }
.feedback.bad { background: rgba(192, 57, 43, 0.14); color: var(--bad); }

.done-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.done-panel .big { font-size: 30px; font-weight: 900; letter-spacing: 2px; }
.done-panel .sub { color: var(--ink-soft); font-size: 14px; }

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-bottom: 4px; }
.key { padding: 15px 0; font-size: 22px; font-weight: 700; background: #fff; border: 2px solid var(--ink); border-radius: 11px; box-shadow: 0 3px 0 rgba(44, 38, 32, 0.85); }
.key:active { transform: translateY(2px); box-shadow: none; }
.key:disabled { opacity: 0.55; }
.key.submit { background: var(--track); color: #fff; border-color: var(--track-dark); box-shadow: 0 3px 0 var(--track-dark); }

.countdown { position: fixed; inset: 0; background: rgba(247, 242, 231, 0.95); display: grid; place-items: center; z-index: 50; font-size: clamp(88px, 30vw, 150px); font-weight: 900; color: var(--track); }

/* ---------- 结算 ---------- */
.result-title { font-size: 24px; font-weight: 900; letter-spacing: 2px; margin: 8px 0 2px; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 18px 0 8px; }
.podium .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.podium .col .who { font-size: 14px; font-weight: 800; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podium .col .block { width: 84px; border: 2px solid var(--ink); border-radius: 9px 9px 0 0; display: grid; place-items: center; font-size: 28px; font-weight: 900; color: var(--ink); }
.podium .col.p1 .block { height: 108px; background: var(--gold); }
.podium .col.p2 .block { height: 76px; background: var(--silver); }
.podium .col.p3 .block { height: 54px; background: var(--bronze); }
.ranks { margin-top: 12px; }
.rank-row { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px dashed var(--line); font-size: 15px; }
.rank-row .no { width: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.rank-row .acc { margin-left: auto; color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; }
.wrongbox { margin-top: 16px; }
.wrongbox h4 { font-size: 14px; letter-spacing: 1px; color: var(--ink-soft); margin-bottom: 8px; }
.wrong-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 2px; border-bottom: 1px dashed var(--line); font-size: 15px; font-variant-numeric: tabular-nums; }
.wrong-row .m { color: var(--bad); text-decoration: line-through; }
.wrong-row .r { color: var(--ok); font-weight: 800; }
.result-foot { position: sticky; bottom: 0; background: var(--paper); border-top: 2px dashed var(--line); margin-top: 14px; padding: 12px 0 2px; display: flex; gap: 10px; }
.result-foot .btn { flex: 1; }

/* ---------- 大屏 ---------- */
.big { height: 100dvh; display: flex; flex-direction: column; padding: clamp(14px, 3vh, 28px) clamp(16px, 4vw, 52px) clamp(14px, 3vh, 28px); }
.big-head { display: flex; align-items: center; gap: 18px; }
.big-title { font-size: clamp(18px, 2.6vw, 26px); font-weight: 900; letter-spacing: 3px; }
.big-code { font-family: ui-monospace, monospace; font-size: clamp(26px, 4.4vw, 44px); font-weight: 800; letter-spacing: 6px; }
.big-timer { margin-left: auto; font-size: clamp(24px, 3.6vw, 38px); font-weight: 800; font-variant-numeric: tabular-nums; }
.big-timer.low { color: var(--bad); }
.big-exit { flex: none; }
.big-body { flex: 1; min-height: 0; margin-top: 14px; display: flex; flex-direction: column; }
.big-lanes { flex: 1; display: flex; flex-direction: column; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; position: relative; }
.big-lanes .lane { height: auto; flex: 1; }
.big-lanes .runner .avatar { height: 44px; }
.big-lanes .runner .tag { font-size: 15px; padding: 2px 8px; max-width: none; }
.big-lanes .runner .pct { font-size: 14px; }

.big-lobby { flex: 1; display: flex; align-items: center; justify-content: center; gap: clamp(20px, 6vw, 80px); }.big-lobby .qrbox { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 18px; box-shadow: 8px 8px 0 rgba(44, 38, 32, 0.8); }
.big-lobby .qrbox svg { width: min(40vh, 34vw); height: auto; display: block; }
.big-lobby .side { text-align: left; }
.big-lobby .code { font-family: ui-monospace, monospace; font-size: clamp(48px, 9vw, 110px); font-weight: 800; letter-spacing: 12px; line-height: 1.1; }
.big-lobby .hint { font-size: clamp(15px, 1.8vw, 20px); color: var(--ink-soft); margin-top: 10px; letter-spacing: 2px; }
.big-lobby .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; max-width: 40vw; }
.chip { border: 2px solid var(--ink); border-radius: 8px; background: var(--cream); padding: 4px 10px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.chip .pdot { width: 10px; height: 10px; }
.big-wait { text-align: center; margin-top: 22px; font-size: clamp(16px, 2.4vw, 24px); letter-spacing: 4px; color: var(--ink-soft); }

.big .podium { margin: 4vh 0 2vh; }
.big .podium .col .block { width: clamp(90px, 12vw, 180px); font-size: clamp(30px, 4vw, 52px); }
.big .podium .col.p1 .block { height: clamp(120px, 24vh, 240px); }
.big .podium .col.p2 .block { height: clamp(86px, 17vh, 170px); }
.big .podium .col.p3 .block { height: clamp(62px, 12vh, 120px); }
.big .podium .col .who { font-size: clamp(15px, 2vw, 24px); }
.big .ranks { columns: 2; column-gap: 48px; max-width: 900px; margin: 12px auto 0; width: 100%; }
.big .rank-row { font-size: clamp(14px, 1.7vw, 19px); }

.big-foot { text-align: center; color: rgba(44, 38, 32, 0.4); font-size: 12px; letter-spacing: 1px; margin-top: 10px; }

.end-screen { min-height: 100dvh; display: grid; place-items: center; }
.end-card { text-align: center; padding: 24px; }
.end-card h2 { font-size: 26px; letter-spacing: 2px; margin-bottom: 8px; }
.end-card p { color: var(--ink-soft); margin-bottom: 20px; font-size: 15px; }

@media (max-width: 720px) {
  .big-lobby { flex-direction: column; gap: 14px; }
  .big-lobby .chips { max-width: 88vw; justify-content: center; }
  .big-lobby .side { text-align: center; }
}
@media (max-width: 380px) {
  .grade-btn { font-size: 13px; padding: 10px 0; }
  .room-code { font-size: 26px; }
}

/* ---------- 横屏：题目在左、键盘在右，整屏不滚动 ---------- */
@media (orientation: landscape) and (max-height: 560px) {
  .screen.race {
    max-width: none;
    height: 100dvh;
    min-height: 0;
    padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: 1fr minmax(260px, 34vw);
    grid-template-rows: auto auto 1fr;
    grid-template-areas:
      "head head"
      "lanes lanes"
      "qcard keypad";
    column-gap: 18px;
    row-gap: 6px;
  }
  .race-head { grid-area: head; }
  .screen.race > .lanes { grid-area: lanes; margin-top: 0; }
  .lanes.mini .lane { height: 24px; }
  .screen.race > .qcard { grid-area: qcard; margin: 0; min-height: 0; }
  .qtext { font-size: clamp(26px, 7vh, 44px); }
  .ansline { margin-top: 8px; font-size: 17px; min-height: 24px; }
  .screen.race > .keypad { grid-area: keypad; align-self: center; gap: 6px; padding-bottom: 0; }
  .key { padding: 8px 0; font-size: 18px; border-radius: 9px; box-shadow: 0 2px 0 rgba(44, 38, 32, 0.85); }
  .done-panel .big { font-size: 24px; }
  .done-panel .sub { font-size: 13px; }
}

</style>
</head>

  /**

   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        var b0 = bin.read();

        var b2 = read();

      var bytes = [];

        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

          }

<script>
/* ==== core.js ==== */
'use strict';

/* 基础设施：路径、DOM、请求、本地会话、小工具 */

const API = (() => {
  let p = location.pathname.replace(/index\.html$/, '');
  if (!p.endsWith('/')) p += '/';
  return p.replace(/\/$/, '');
})();

const $ = (s, el = document) => el.querySelector(s);

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  }
  return el;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

async function api(path, body, method) {
  try {
    const res = await fetch(API + path, {
      method: method || (body ? 'POST' : 'GET'),
      headers: body ? { 'content-type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  } catch {
    return { ok: false, status: 0, data: { error: '网络开小差了，请重试' } };
  }
}

/* 本地会话：code -> { token, pid }，匿名身份全靠它恢复现场 */
const store = {
  _key: 'mr_sessions',
  all() { try { return JSON.parse(localStorage.getItem(this._key) || '{}'); } catch { return {}; } },
  get(code) { return this.all()[code] || null; },
  set(code, sess) { const a = this.all(); a[code] = sess; localStorage.setItem(this._key, JSON.stringify(a)); },
  del(code) { const a = this.all(); delete a[code]; localStorage.setItem(this._key, JSON.stringify(a)); },
};

const prefs = {
  get nick() { return localStorage.getItem('mr_nick') || ''; },
  set nick(v) { localStorage.setItem('mr_nick', v); },
  get grade() { return Number(localStorage.getItem('mr_grade')) || 3; },
  set grade(v) { localStorage.setItem('mr_grade', String(v)); },
  get sound() { return localStorage.getItem('mr_snd') !== '0'; },
  set sound(v) { localStorage.setItem('mr_snd', v ? '1' : '0'); },
};

const GRADE_NAMES = { 1: '一年级', 2: '二年级', 3: '三年级', 4: '四年级' };

const PALETTE = ['#c94f3d', '#2f6b9e', '#3f7a4e', '#d97f2f', '#2e8b8b', '#b5486b', '#8a5a2b', '#33427a', '#6b7a2f', '#5a7a8a', '#a03a78', '#48639e'];
function colorOf(pid) {
  let x = 0;
  for (const c of pid) x = (x * 31 + c.charCodeAt(0)) >>> 0;
  return PALETTE[x % PALETTE.length];
}

let toastTimer = 0;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = h('div', { id: 'toast', class: 'toast' }); document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* 服务器时间校准：以服务端 now 为准算倒计时 */
let serverSkew = 0;
function calibrate(state) { if (state && state.serverNow) serverSkew = state.serverNow - Date.now(); }
function serverNow() { return Date.now() + serverSkew; }

function fmtClock(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = h('textarea', { style: 'position:fixed;opacity:0' });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
    return ok;
  }
}

function joinUrl(code) {
  return `${location.origin}${API}/?code=${code}`;
}

/* ==== audio.js ==== */
'use strict';

/* WebAudio 极简合成音效，零音频资源 */

const AudioFX = (() => {
  let ctx = null;
  function beep(freq, dur, type, gain, delay) {
    if (!prefs.sound) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      const t0 = ctx.currentTime + (delay || 0);
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(gain || 0.11, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    } catch {}
  }
  return {
    correct() { beep(880, 0.09); beep(1318, 0.14, 'square', 0.11, 0.09); },
    wrong() { beep(220, 0.2, 'sawtooth', 0.09); },
    tick() { beep(660, 0.06, 'square', 0.09); },
    go() { beep(880, 0.1); beep(1174, 0.28, 'square', 0.11, 0.1); },
    finish() { [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.16, 'square', 0.11, i * 0.13)); },
  };
})();

/* ==== views.js ==== */
'use strict';

/* 视图：首页 / 大厅 / 结算 / 分享 / 结束页，以及共享的赛道组件 */

/* ---------- 角色 SVG（程序化，无图片资源） ---------- */

function runnerSVG(color) {
  return `<svg class="avatar" viewBox="0 0 26 30" aria-hidden="true">
    <circle cx="13" cy="5.5" r="4" fill="${color}"/>
    <rect x="9.4" y="10.2" width="7.2" height="9.6" rx="3" fill="${color}"/>
    <rect x="4.6" y="11.2" width="2.6" height="7.6" rx="1.3" fill="${color}" transform="rotate(26 5.9 11.5)"/>
    <rect x="18.8" y="11.2" width="2.6" height="7.6" rx="1.3" fill="${color}" transform="rotate(-26 20.1 11.5)"/>
    <rect x="8.4" y="19.2" width="3" height="9" rx="1.4" fill="${color}" transform="rotate(12 9.9 19.5)"/>
    <rect x="14.6" y="19.2" width="3" height="9" rx="1.4" fill="${color}" transform="rotate(-16 16.1 19.5)"/>
  </svg>`;
}

function boatSVG(color) {
  return `<svg class="avatar" viewBox="0 0 42 26" aria-hidden="true">
    <path d="M2 15 Q5 21 13 21 L29 21 Q38 21 39 14 L33 14 Q20 17 6 14 Z" fill="${color}"/>
    <path d="M35 14 Q41 12 38.5 4.5 Q35 9 31 11 Z" fill="${color}"/>

  </svg>`;
}

function avatarFor(pid, theme) {
  const color = colorOf(pid);
  return theme === 'dragon' ? boatSVG(color) : runnerSVG(color);
}

/* ---------- 赛道组件：mini（手机顶部）/ big（大屏）共用 ---------- */

// 实时名次：先完赛的在前（按完赛时间），未完赛按进度比例——
// 各年级题量不同，不能用答对题数直接比大小
function sortPlayers(st) {
  return [...st.players].sort((a, b) => {
    if (a.finished && b.finished) return (a.finishedAt || 0) - (b.finishedAt || 0);
    if (a.finished) return -1;
    if (b.finished) return 1;
    const ra = a.progress / Math.max(1, a.total);
    const rb = b.progress / Math.max(1, b.total);
    return (rb - ra) || (a.pid < b.pid ? -1 : 1);
  });
}

function lanesEl(mini, selfPid) {
  const box = h('div', { class: 'lanes' + (mini ? ' mini' : '') });
  box.appendChild(h('div', { class: 'finishline' }));
  const rows = new Map(); // pid -> {lane, run, tag, pct, rank}
  let curTheme = '';

  function sync(st) {
    if (st.theme !== curTheme) {
      curTheme = st.theme;
      box.classList.toggle('t-track', st.theme !== 'dragon');
      box.classList.toggle('t-dragon', st.theme === 'dragon');
    }
    const ids = new Set(st.players.map((p) => p.pid));
    for (const [pid, r] of rows) {
      if (!ids.has(pid)) { r.lane.remove(); rows.delete(pid); }
    }
    for (const p of st.players) {
      let r = rows.get(p.pid);
      if (!r) {
        const lane = h('div', { class: 'lane' });
        const rank = h('span', { class: 'rank' }, '');
        const run = h('div', { class: 'runner' + (p.pid === selfPid ? ' mine' : '') });
        run.innerHTML = avatarFor(p.pid, curTheme);
        const tag = h('span', { class: 'tag' }, '');
        const pct = h('span', { class: 'pct' }, '');
        // 冲线后整块翻到终点线左侧，标签顺序也随之镜像，保证"完赛"不压线
        run.append(rank, tag, pct);
        lane.appendChild(run);
        box.appendChild(lane);
        rows.set(p.pid, (r = { lane, run, tag, pct, rank }));
      }
      r.tag.textContent = p.nickname;
      const total = Math.max(1, p.total);
      // 终点线在 92%；冲线后停在 84% 并整体左翻，与终点线留出明显间隙
      const pos = p.finished ? 84 : 4 + (p.progress / total) * 80;
      r.run.style.left = pos + '%';
      r.pct.textContent = p.finished ? '完赛' : `${Math.round((p.progress / total) * 100)}%`;
      r.run.classList.toggle('done', !!p.finished);
      // 冲线后把整块头像翻到终点线左侧，避免跑出赛道被裁掉
      r.run.classList.toggle('at-finish', !!p.finished);
      r.run.classList.toggle('offline-run', !p.online && st.status === 'racing');
    }
    const order = sortPlayers(st);
    order.forEach((p, i) => {
      const r = rows.get(p.pid);
      if (r) r.rank.textContent = String(i + 1);
    });
  }
  return { el: box, sync };
}

/* ---------- 领奖台 + 名次列表 ---------- */

function podiumEl(st) {
  const byPid = new Map(st.players.map((p) => [p.pid, p]));
  const top = (st.ranks && st.ranks.length ? st.ranks : sortPlayers(st).map((p) => p.pid))
    .map((pid) => byPid.get(pid)).filter(Boolean).slice(0, 3);
  const order = [1, 0, 2]; // 视觉：2 1 3
  const box = h('div', { class: 'podium' });
  for (const i of order) {
    const p = top[i];
    const col = h('div', { class: `col p${i + 1}` });
    if (p) {
      col.append(
        h('div', { class: 'who' }, p.nickname),
        h('div', { class: 'block' }, String(i + 1)),

    } else {
      col.append(h('div', { class: 'block', style: 'visibility:hidden' }, '-'));

    box.appendChild(col);
  }

}

function ranksEl(st, selfPid) {
  const byPid = new Map(st.players.map((p) => [p.pid, p]));

  const box = h('div', { class: 'ranks' });
  order.forEach((pid, i) => {
    const p = byPid.get(pid);
    if (!p) return;
    box.appendChild(h('div', { class: 'rank-row' + (pid === selfPid ? ' mine' : '') },
      h('span', { class: 'no' }, `${i + 1}.`),

        p.finished ? `${p.progress}/${p.total} 对 · 完赛` : `${p.progress}/${p.total} 对 · 未冲线`),
    ));
  });

}

function qrSvg(url) {
  try {
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    return qr.createSvgTag({ cellSize: 4, margin: 2 })
      .replace(/\swidth="[^"]+"/, ' width="100%"')
      .replace(/\sheight="[^"]+"/, ' height="100%"');
  } catch { return ''; }
}

function shareModal(code) {
  const url = joinUrl(code);
  const overlay = h('div', { class: 'overlay', onclick: (e) => { if (e.target === overlay) overlay.remove(); } });
  const modal = h('div', { class: 'modal' },
    h('h3', {}, '邀请小伙伴扫码加入'),
    h('div', { class: 'qr', html: qrSvg(url) }),

function segControl(options, onPick) {
  const btns = options.map(([v, label]) =>
    h('button', { type: 'button', onclick: () => onPick(v) }, label));
  const box = h('div', { class: 'seg' }, btns);
  box.update = (val, disabled) => {
    btns.forEach((b, i) => {
      b.classList.toggle('on', options[i][0] === val);
      b.disabled = !!disabled;
    });
  };
  return box;
}

'use strict';

/* 竞速视图：手机答题端 + 大屏观赛端 */

/* ---------- 手机答题端 ---------- */

function mountRace(container, ctx) {
  const root = h('div', { class: 'screen race' });
  const timerEl = h('div', { class: 'timer' }, '--:--');
  const progEl = h('div', { class: 'race-prog' }, '');
  const lanes = lanesEl(true, ctx.sess.pid);

  const qtext = h('div', { class: 'qtext' }, '');
  const ansline = h('div', { class: 'ansline' }, '');
  const feedback = h('div', { class: 'feedback' }, '');
  const donePanel = h('div', { class: 'done-panel', style: 'display:none' },
    h('div', { class: 'big' }, '完赛！'),
    h('div', { class: 'sub' }, ''),
  );

  let input = '';
  let q = (ctx.state.you && ctx.state.you.question) || null;
  let finishedYou = !!(ctx.state.you && ctx.state.you.finished);
  let busy = false;
  let fbTimer = 0;
  let lastCount = -1;

  const keys = [];
  const keypad = h('div', { class: 'keypad' });
  const keyLabels = [['7'], ['8'], ['9'], ['4'], ['5'], ['6'], ['1'], ['2'], ['3'], ['del', '⌫'], ['0'], ['submit', '提交']];
  for (const [k, label] of keyLabels) {
    const isSubmit = k === 'submit';
    const b = h('button', {
      class: 'key' + (isSubmit ? ' submit' : ''),
      type: 'button', 'data-k': k,
      onclick: () => press(k),
    }, label || k);
    keys.push(b);
    keypad.appendChild(b);
  }

  function setKeysDisabled(dis) { keys.forEach((b) => { b.disabled = dis; }); }

  function press(k) {
    if (busy || finishedYou) return;
    if (k === 'del') { input = input.slice(0, -1); }
    else if (k === 'submit') { return submit(); }
    else if (input.length < 7) { input += k; AudioFX.tick(); }
    renderInput();
  }

  function renderInput() {
    ansline.innerHTML = '';
    if (input) ansline.appendChild(h('b', {}, input));
    else ansline.appendChild(document.createTextNode('输入答案…'));
  }

  function flash(type, text, ms) {
    feedback.className = `feedback show ${type}`;
    feedback.textContent = text;
    clearTimeout(fbTimer);
    fbTimer = setTimeout(() => { feedback.className = 'feedback'; }, ms);
  }

  async function submit() {
    if (busy || finishedYou || !q) return;
    if (!input) {
      ansline.style.color = 'var(--bad)';
      setTimeout(() => { ansline.style.color = ''; }, 350);
      return;
    }
    busy = true;
    setKeysDisabled(true);
    const r = await api(`/api/rooms/${ctx.code}/answer`, {
      token: ctx.sess.token, idx: q.idx, answer: Number(input),
    });
    busy = false;
    setKeysDisabled(false);
    if (!r.ok) {
      toast(r.data.error || '提交失败');
      if (r.data.error && r.data.error.includes('完赛')) finishedYou = true;
      renderBody();
      return;
    }
    if (r.data.correct) {
      AudioFX.correct();
      flash('ok', '答对了，前进！', 700);
    } else {
      AudioFX.wrong();
      flash('bad', `答错了 · 正确答案 ${r.data.rightAnswer}`, 1800);
    }
    input = '';
    if (r.data.finished) {
      finishedYou = true;
      AudioFX.finish();
    }
    q = r.data.next;
    renderBody();
    renderInput();
  }

  function renderBody() {
    const showDone = finishedYou;
    donePanel.style.display = showDone ? '' : 'none';
    keypad.style.display = showDone ? 'none' : '';
    qtext.style.visibility = showDone ? 'hidden' : 'visible';
    ansline.style.visibility = showDone ? 'hidden' : 'visible';
    if (showDone) {
      const order = sortPlayers(ctx.state);
      const myRank = order.findIndex((p) => p.pid === ctx.sess.pid) + 1;
      donePanel.querySelector('.sub').textContent = `目前第 ${myRank} 名，等其他小选手冲线…`;
    } else {
      qtext.textContent = q ? q.text : '';
      renderInput();
    }
  }

  const countdown = h('div', { class: 'countdown', style: 'display:none' }, '');

  root.append(
    h('div', { class: 'race-head' },
      timerEl, progEl, h('span', { class: 'spacer' }),
      h('button', { class: 'btn btn-sm', onclick: () => { prefs.sound = !prefs.sound; toast(prefs.sound ? '音效开' : '音效关'); } }, '音效'),
      h('button', { class: 'btn btn-danger btn-sm', onclick: () => leaveRoom(ctx.code) }, '退出'),
    ),
    lanes.el,
    h('div', { class: 'qcard' }, qtext, ansline, feedback, donePanel),
    keypad,
    countdown,
  );
  container.appendChild(root);

  function onKey(e) {
    if (e.key >= '0' && e.key <= '9') press(e.key);
    else if (e.key === 'Backspace') press('del');
    else if (e.key === 'Enter') press('submit');
  }
  document.addEventListener('keydown', onKey);

  function update(st) {
    ctx.state = st;
    lanes.sync(st);
    const left = st.endAt ? st.endAt - serverNow() : st.durationSec * 1000;
    timerEl.textContent = fmtClock(left);
    timerEl.classList.toggle('low', left < 30000 && st.status === 'racing');
    const me = st.players.find((p) => p.pid === ctx.sess.pid);
    if (me) progEl.textContent = `${me.progress}/${me.total} 题`;

    const remain = st.startAt ? st.startAt - serverNow() : 0;
    if (st.status === 'racing' && remain > 0) {
      countdown.style.display = '';
      const n = Math.ceil(remain / 1000);
      const label = n >= 3 ? '3' : n === 2 ? '2' : n === 1 ? '1' : 'GO!';
      if (label !== countdown.textContent) {
        countdown.textContent = label;
        if (label === 'GO!') AudioFX.go(); else AudioFX.tick();
      }
      setKeysDisabled(true);
    } else {
      countdown.style.display = 'none';
      if (!busy && !finishedYou) setKeysDisabled(false);
    }
    if (finishedYou) renderBody(); // 更新实时名次
  }

  update(ctx.state);
  renderBody();
  // 倒计时/计时器靠本地心跳推进；SSE 状态只负责赛道与成员同步
  const ticker = setInterval(() => update(ctx.state), 300);
  return {
    update,
    destroy() {
      document.removeEventListener('keydown', onKey);
      clearTimeout(fbTimer);
      clearInterval(ticker);
    },
    kind: 'race',
  };
}

function mountBig(container, ctx) {

    timerEl,

  );
  root.append(head, body, h('div', { class: 'big-foot' }, '点击画面可全屏 · 手机端扫码加入'));

  function renderLobby(st) {
    body.innerHTML = '';
    body.appendChild(h('div', { class: 'big-lobby' },
      h('div', { class: 'qrbox', html: qrSvg(joinUrl(ctx.code)) }),
      h('div', { class: 'side' },
        h('div', { class: 'code' }, ctx.code),
        h('div', { class: 'hint' }, '手机扫码 / 输房间号即可加入'),
        h('div', { class: 'chips' }, st.players.map((p) =>
          h('span', { class: 'chip' },
            h('span', { class: 'pdot', style: `background:${colorOf(p.pid)}` }),
            `${p.nickname}·${GRADE_NAMES[p.grade]}`,
          ))),
      ),
    ));
    const wait = h('div', { class: 'big-wait' }, st.players.length ? '选手就位，等待房主开始比赛…' : '等待选手加入…');
    body.appendChild(wait);
  }

  function renderRace(st) {
    if (!lanes || lanesTheme !== st.theme) {
      lanesTheme = st.theme;
      lanes = lanesEl(false, null);
      lanes.el.classList.add('big-lanes');
    }
    body.innerHTML = '';
    body.appendChild(lanes.el);
    lanes.sync(st);
  }

  function renderFinished(st) {
    body.innerHTML = '';
    const wrap = h('div', { style: 'flex:1;display:flex;flex-direction:column;min-height:0' },
      h('div', { class: 'big-wait', style: 'margin-top:0' }, '比赛结束 · 恭喜获胜选手！'),
      podiumEl(st),
      ranksEl(st, null),
    );
    body.appendChild(wrap);
  }

  function update(st) {
    ctx.state = st;
    const left = st.endAt ? st.endAt - serverNow() : st.durationSec * 1000;
    timerEl.textContent = st.status === 'lobby' ? '' : fmtClock(left);
    timerEl.classList.toggle('low', st.status === 'racing' && left < 30000);
    if (st.status === 'lobby') { timerEl.textContent = '待开赛'; renderLobby(st); }
    else if (st.status === 'racing') renderRace(st);
    else renderFinished(st);
  }

  const onFs = () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen().catch(() => {});
  };
  root.addEventListener('click', onFs);

  container.innerHTML = '';
  container.appendChild(root);
  update(ctx.state);
  const ticker = setInterval(() => update(ctx.state), 500);
  return {
    update,
    destroy() { root.removeEventListener('click', onFs); clearInterval(ticker); },
    kind: 'big',
  };
}

/* ==== main.js ==== */
'use strict';

/* 路由 + SSE 生命周期 + 房间视图切换 */

const app = $('#app');
let roomCtl = null;   // 当前房间视图 { update, destroy, kind }
let liveES = null;    // EventSource
let livePoll = 0;     // 轮询兜底定时器
let liveSeq = 0;      // 连接代次，防止旧连接回调串场

function stopLive() {
  liveSeq++;
  if (liveES) { try { liveES.close(); } catch {} liveES = null; }
  if (livePoll) { clearInterval(livePoll); livePoll = 0; }
}

/**
 * 建立房间实况连接：SSE 优先，连续失败自动降级为 2s 轮询。
 * token 为空串即观战（大屏）。
 */
function connectLive(code, token, handlers) {
  stopLive();
  const seq = liveSeq;
  const url = `${API}/api/rooms/${code}/events${token ? `?token=${token}` : ''}`;
  let fails = 0;

  const startPolling = () => {
    if (livePoll || seq !== liveSeq) return;
    livePoll = setInterval(async () => {
      if (seq !== liveSeq) return;
      const r = await api(`/api/rooms/${code}/state${token ? `?token=${token}` : ''}`);
      if (seq !== liveSeq) return;
      if (r.status === 404) { stopLive(); handlers.gone && handlers.gone(); return; }
      if (r.ok) handlers.onState(r.data);
    }, 2000);
  };

  try {
    const es = new EventSource(url);
    liveES = es;
    es.addEventListener('state', (e) => {
      fails = 0;
      if (livePoll) { clearInterval(livePoll); livePoll = 0; }
      if (seq === liveSeq) handlers.onState(JSON.parse(e.data));
    });
    es.addEventListener('kicked', () => { if (seq === liveSeq) handlers.onKicked && handlers.onKicked(); });
    es.addEventListener('closed', () => { if (seq === liveSeq) handlers.onClosed && handlers.onClosed(); });
    es.onerror = () => {
      fails++;
      if (fails >= 3) startPolling();
    };
  } catch {
    startPolling();
  }
}

/* ---------- 房间（选手视角） ---------- */

async function openRoom(code) {
  const sess = store.get(code);
  if (!sess) { location.hash = ''; renderHome(code); return; }

  const r = await api(`/api/rooms/${code}/state?token=${sess.token}`);
  if (!r.ok) {
    store.del(code);
    toast(r.data.error || '房间不存在或已解散');
    location.hash = '';
    route();
    return;
  }
  calibrate(r.data);
  const ctx = { code, sess, state: r.data };
  let kind = '';

  function refresh() {
    api(`/api/rooms/${code}/state?token=${sess.token}`).then((x) => {
      if (x.ok) { ctx.state = x.data; syncView(); }
    });
  }

  function switchTo(want) {
    if (roomCtl && roomCtl.destroy) roomCtl.destroy();
    app.innerHTML = '';
    if (want === 'lobby') roomCtl = mountLobby(app, ctx);
    else if (want === 'race') roomCtl = mountRace(app, ctx);
    else roomCtl = mountResult(app, ctx);
  }

  function syncView() {
    const st = ctx.state;
    const want = st.status === 'lobby' ? 'lobby' : st.status === 'racing' ? 'race' : 'result';
    if (want === kind) { roomCtl.update(st); return; }
    kind = want;
    switchTo(want);
  }

  connectLive(code, sess.token, {
    onState: (st) => { calibrate(st); ctx.state = st; syncView(); },
    onKicked: () => { store.del(code); roomCtl = null; stopLive(); mountEndScreen(app, '你已被移出房间', '可以重新扫码输入房间号再加入'); },
    onClosed: () => { store.del(code); roomCtl = null; stopLive(); mountEndScreen(app, '房间已解散', '房主退出了房间'); },
    gone: () => { store.del(code); roomCtl = null; mountEndScreen(app, '房间已结束', '本局比赛已归档'); },
  });

  app.innerHTML = '';
  syncView();
}

async function leaveRoom(code) {
  const sess = store.get(code);
  if (sess) await api(`/api/rooms/${code}/leave`, { token: sess.token });
  store.del(code);
  location.hash = '';
  route();
}

/* ---------- 大屏（观战视角） ---------- */

async function openBig(code) {
  const r = await api(`/api/rooms/${code}/state`);
  if (!r.ok) {
    mountEndScreen(app, '房间不存在', '房主可能还没创建，或房间已解散');
    return;
  }
  calibrate(r.data);
  const ctx = { code, state: r.data };
  connectLive(code, '', {
    onState: (st) => { calibrate(st); ctx.state = st; if (roomCtl) roomCtl.update(st); },
    onClosed: () => { roomCtl = null; stopLive(); mountEndScreen(app, '房间已解散', '房主退出了房间'); },
    gone: () => { roomCtl = null; mountEndScreen(app, '房间已结束', '本局比赛已归档'); },
  });
  app.innerHTML = '';
  roomCtl = mountBig(app, ctx);
}

/* ---------- 路由 ---------- */

function route() {
  stopLive();
  if (roomCtl && roomCtl.destroy) roomCtl.destroy();
  roomCtl = null;
  app.innerHTML = '';

  const prefill = (new URLSearchParams(location.search).get('code') || '').replace(/\D/g, '').slice(0, 8);
  let m = location.hash.match(/^#\/room\/(\d{8})$/);
  if (m) { openRoom(m[1]); return; }
  m = location.hash.match(/^#\/big\/(\d{8})$/);
  if (m) { openBig(m[1]); return; }
  mountHome(app, prefill);
}

window.addEventListener('hashchange', route);
route();

</script>
