<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>林间 — 走进活着的世界</title>
<meta name="description" content="林间 · 一间以耐心的设计、原生草木与更深的守护来修复荒野之地的自然工作室。活世界 Three.js 场景 × 液态金属按钮。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 24'%3E%3Crect width='22' height='24' rx='5' fill='%234a4d44'/%3E%3Cpath d='M11 20.6v-6.2' stroke='%23f2f3ef' stroke-width='1.7' stroke-linecap='round' fill='none'/%3E%3Cpath fill='%23f2f3ef' d='M11 14.4c-.25-3.1-2.4-5.4-5.9-5.4-.2 3.4 2.4 5.9 5.9 5.4Z'/%3E%3Cpath fill='%23e2ead0' d='M11 12.9c.3-3.6 2.8-6 6-5.7.1 3.2-2.7 6-6 5.7Z'/%3E%3C/svg%3E">
<script>document.documentElement.className += " js";</script>
<script>document.documentElement.className += " js";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200..700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  /* ── 设计单位：--u = 1600 × 880 基准帧上的 1px ─────────────────────── */
  :root{
    --u: calc(100vw / 1600);

    --ink:        #ffffff;
    --ink-soft:   rgba(255,255,255,.62);
    --ink-faint:  rgba(255,255,255,.44);
    --rule:       rgba(255,255,255,.055);

    --card:       #f2f3ef;
    --card-ink:   #23261f;
    --card-label: #7c8177;

    --ease:     cubic-bezier(.22,.61,.36,1);
    --ease-out: cubic-bezier(.16,1,.3,1);
  }
  @media (min-width:1900px){ :root{ --u: calc(1900px / 1600); } }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

  html{ background:#383b34; }
  body{
    font-family:'Lexend','Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    font-weight:300;
    color:var(--ink);
    background:#383b34;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* ── hero 外壳 ─────────────────────────────────────────────────────── */
  .hero{
    position:relative;
    width:100%;
    height:100svh;
    min-height:calc(880 * var(--u));
    overflow:hidden;
    isolation:isolate;
    /* 参考屏四角近乎平涂的 #4a4d44——立体感全部来自根茎所在的地面光池 */
    background:
      radial-gradient(64% 52% at 27% 84%, rgba(232,238,222,.085) 0%, rgba(232,238,222,0) 72%),
      radial-gradient(70% 60% at 92% 8%,  rgba(24,28,20,.10) 0%, rgba(24,28,20,0) 68%),
      #4a4d44;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(72% 44% at 50% 117%, rgba(238,243,231,.50) 0%, rgba(238,243,231,.21) 42%, rgba(238,243,231,.04) 72%, rgba(238,243,231,0) 88%),
      linear-gradient(180deg, rgba(238,243,231,0) 54%, rgba(238,243,231,.03) 78%, rgba(238,243,231,.085) 100%);
    pointer-events:none; z-index:0;
  }

  /* 整个构图位于居中的 1600 × 880 舞台上。
      刻意用 margin 而非 transform 居中：transform 会建立堆叠上下文，
      把所有子元素困在 #scene 之下。 */
  .stage{
    position:absolute; left:50%; top:50%;
    margin-left:calc(-800 * var(--u));
    margin-top:calc(-440 * var(--u));
    width:calc(1600 * var(--u));
    height:calc(880 * var(--u));
  }

  /* ── 纵向列参考线（z 1） ───────────────────────────────────────────── */
  .guides{ position:absolute; inset:calc(-40 * var(--u)) 0; z-index:1; pointer-events:none; }
  .guides i{
    position:absolute; top:0; bottom:0; width:1px;
    background:linear-gradient(180deg, rgba(255,255,255,0) 0%, var(--rule) 12%, var(--rule) 78%, rgba(255,255,255,0) 100%);
  }

  /* ── 幽灵字（z 1） ─────────────────────────────────────────────────── */
  .ghost{
    position:absolute; z-index:1;
    left:calc(-16 * var(--u)); bottom:calc(-70 * var(--u));
    font-family:'Noto Serif SC',serif;
    font-weight:900;
    font-size:calc(330 * var(--u));
    line-height:.8;
    letter-spacing:calc(26 * var(--u));
    color:rgba(255,255,255,.05);
    white-space:nowrap; user-select:none; pointer-events:none;
  }

  /* ── three.js 画布（z 3 —— 高于卡片一，低于其余内容） ─────────────── */
  #scene{
    position:absolute; inset:0; z-index:3;
    width:100%; height:100%;
    pointer-events:none;
    opacity:0; transition:opacity .7s var(--ease);
  }
  .is-scene #scene{ opacity:1; }

  /* ── 导航：悬浮 dock（z 5） ───────────────────────────────────────── */
  .dock-wrap{
    position:absolute; z-index:5;
    top:calc(38 * var(--u)); left:0; right:0;
    display:flex; justify-content:center;
    pointer-events:none;
  }
  .dock{
    pointer-events:auto;
    display:flex; align-items:flex-start; gap:calc(3 * var(--u));
    height:calc(46 * var(--u));
    padding:calc(5 * var(--u));
    border-radius:calc(14 * var(--u));
    border:1px solid rgba(255,255,255,.11);
    background:
      linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,0) 42%),
      rgba(34,40,31,.74);
    box-shadow:0 calc(8 * var(--u)) calc(22 * var(--u)) rgba(10,14,8,.30),
               inset 0 1px rgba(255,255,255,.06);
    isolation:isolate;
  }
  .dock-item{
    position:relative; z-index:6;
    display:inline-flex; align-items:center; justify-content:center;
    flex:none;
    height:calc(36 * var(--u));
    gap:calc(8 * var(--u));
    padding:0 calc(15 * var(--u));
    transform-origin:50% 0;
    border:1px solid transparent;
    border-radius:calc(10 * var(--u));
    background:rgba(255,255,255,.04);
    color:var(--ink-faint);
    text-decoration:none; cursor:pointer;
    font-family:inherit;
    font-size:calc(11.5 * var(--u)); font-weight:400;
    letter-spacing:calc(1.5 * var(--u));
    white-space:nowrap;
    will-change:width,height,transform;
    transition:color .18s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
  }
  .dock-item[data-near="true"]{
    z-index:7;
    color:var(--ink);
    border-color:rgba(255,255,255,.19);
    background:rgba(31,37,28,.94);
    box-shadow:0 calc(7 * var(--u)) calc(16 * var(--u)) rgba(10,14,8,.30);
  }
  .dock-item .glyph{
    width:calc(14 * var(--u)); height:calc(14 * var(--u)); flex:none;
    opacity:.66; transition:opacity .18s var(--ease);
  }
  .dock-item .glyph svg{
    display:block; width:100%; height:100%;
    fill:none; stroke:currentColor; stroke-width:1.25;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .dock-item[data-near="true"] .glyph{ opacity:1; }

  .dock-mark{
    width:calc(36 * var(--u)); padding:0;
    background:#eef1e7; border-color:#eef1e7; color:#23261f;
    overflow:hidden;
  }
  .dock-mark svg{ width:56%; height:56%; display:block; }
  .dock-mark[data-near="true"]{ background:#fff; border-color:#fff; color:#1b1e18; }

  .dock-item.is-active{
    background:var(--card); border-color:var(--card); color:var(--card-ink);
    box-shadow:0 calc(6 * var(--u)) calc(16 * var(--u)) rgba(12,17,9,.24);
  }
  .dock-item.is-active .glyph{ opacity:.8; }
  .dock-item--enter{ color:var(--ink); background:rgba(255,255,255,.075); }

  /* ── 镜面高光描边 ─────────────────────────────────────────────────── */
  [data-spec]{ --spec-angle:2.4rad; --spec-bright:0; }
  [data-spec]::after{
    content:''; position:absolute; inset:-1px; z-index:5;
    padding:1px; border-radius:inherit; pointer-events:none;
    opacity:var(--spec-bright);
    background:conic-gradient(from var(--spec-angle) at 50% 50%,
      rgba(240,246,232,0) 0deg, rgba(240,246,232,.08) 14deg, rgba(240,246,232,.95) 28deg,
      rgba(240,246,232,.16) 46deg, rgba(240,246,232,0) 68deg, rgba(240,246,232,0) 180deg,
      rgba(240,246,232,.08) 194deg, rgba(240,246,232,.95) 208deg, rgba(240,246,232,.16) 226deg,
      rgba(240,246,232,0) 248deg, rgba(240,246,232,0) 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }
  .dock{ position:relative; }

  /* ── 标题与导语（z 4） ─────────────────────────────────────────────── */
  .headline{
    position:absolute; z-index:4;
    left:calc(46 * var(--u)); top:calc(196 * var(--u));
    font-size:calc(63 * var(--u)); line-height:calc(68 * var(--u));
    font-weight:300; letter-spacing:calc(2 * var(--u));
    color:var(--ink);
    text-shadow:0 calc(2 * var(--u)) calc(30 * var(--u)) rgba(10,14,8,.35);
  }
  .headline span{ display:block; padding-bottom:.05em; white-space:nowrap; }
  .headline span i{ display:inline-block; font-style:normal; }

  .lede{
    position:absolute; z-index:4;
    left:calc(520 * var(--u)); top:calc(200 * var(--u));
    width:calc(230 * var(--u));
    font-size:calc(16.5 * var(--u)); line-height:calc(24 * var(--u));
    font-weight:300; color:var(--ink-soft);
    text-shadow:0 calc(2 * var(--u)) calc(18 * var(--u)) rgba(10,14,8,.5);
  }

  /* ── 液态金属控件 ─────────────────────────────────────────────────── */
  .pill-clip{
    position:absolute; z-index:4;
    left:calc(644 * var(--u)); top:calc(372 * var(--u));
    width:calc(410 * var(--u)); height:calc(270 * var(--u));
    margin:calc(-135 * var(--u)) 0 0 calc(-205 * var(--u));
    clip-path:inset(calc(72 * var(--u)) calc(60 * var(--u))
                    calc(26 * var(--u)) calc(60 * var(--u)) round calc(62 * var(--u)));
  }
  .pill{
    position:absolute; inset:0; --mr:calc(150 * var(--u));
    display:grid; place-items:center;
  }

  .liquid-stage{
    --lu:calc(var(--h) / 516);
    --bh:var(--h);
    --pad:calc(900 * var(--lu));
    position:relative;
    width:max-content; height:max-content;
    padding:var(--pad);
    display:grid; place-items:center;
    touch-action:manipulation;
    font-family:inherit;
    -webkit-font-smoothing:antialiased;
  }
  .liquid-stage--explore{ --h:calc(64 * var(--u)); }
  .liquid-stage--play{ --h:calc(88 * var(--u)); }

  .liquid-plate{
    position:absolute;
    inset:var(--pad);
    border-radius:999px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.014) 44%, rgba(255,255,255,0) 64%),
      rgba(10,12,10,.42);
    box-shadow:
      0 calc(var(--h) * 0.08) calc(var(--h) * 0.18) rgba(0,0,0,.38),
      0 calc(var(--h) * 0.24) calc(var(--h) * 0.50) rgba(0,0,0,.28),
      0 calc(var(--h) * 0.48) calc(var(--h) * 0.96) rgba(0,0,0,.16),
      inset 0 1px 0 rgba(255,255,255,.13),
      inset 0 calc(var(--h) * -0.02) calc(var(--h) * 0.05) rgba(255,255,255,.05);
    transition:box-shadow .38s cubic-bezier(.22,.61,.36,1),
               background .38s cubic-bezier(.22,.61,.36,1);
  }
  .liquid-stage.hot .liquid-plate{
    background:
      linear-gradient(180deg, rgba(255,255,255,.105), rgba(255,255,255,.02) 44%, rgba(255,255,255,0) 64%),
      rgba(8,10,8,.50);
    box-shadow:
      0 calc(var(--h) * 0.10) calc(var(--h) * 0.22) rgba(0,0,0,.44),
      0 calc(var(--h) * 0.32) calc(var(--h) * 0.66) rgba(0,0,0,.34),
      0 calc(var(--h) * 0.66) calc(var(--h) * 1.32) rgba(0,0,0,.20),
      inset 0 1px 0 rgba(255,255,255,.17),
      inset 0 calc(var(--h) * -0.02) calc(var(--h) * 0.05) rgba(255,255,255,.06);
  }
  .liquid-fx{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .liquid-button{
    position:relative;
    height:var(--bh);
    border:0; background:none;
    border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font-family:inherit; font-weight:400; line-height:1; letter-spacing:calc(1 * var(--lu));
    cursor:pointer; -webkit-tap-highlight-color:transparent; outline:none;
  }
  .liquid-button:focus-visible{
    outline:calc(4 * var(--lu)) solid rgba(255,255,255,.55);
    outline-offset:calc(10 * var(--lu));
  }
  .liquid-button .ico{ display:block; flex:none; overflow:visible; }
  .liquid-button .lbl{ display:block; transform:translateY(calc(2 * var(--lu))); }
  .liquid-button--explore{
    padding:0 calc(150 * var(--lu)) 0 calc(96 * var(--lu));
    gap:calc(84 * var(--lu));
    font-size:calc(118 * var(--lu));
  }
  .liquid-button--explore .ico{
    width:calc(126 * var(--lu)); height:calc(126 * var(--lu));
  }
  .liquid-button--play{
    width:var(--bh); height:var(--bh); padding:0;
  }
  .liquid-button--play .ico{
    width:calc(176 * var(--lu)); height:calc(176 * var(--lu));
    margin-left:calc(14 * var(--lu));
  }
  .liquid-button--play .lbl{ display:none; }
  .liquid-stage.press .liquid-plate{
    background:
      linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.01) 44%, rgba(255,255,255,0) 64%),
      rgba(7,9,7,.55);
    box-shadow:
      0 calc(var(--h) * 0.04) calc(var(--h) * 0.11) rgba(0,0,0,.46),
      0 calc(var(--h) * 0.13) calc(var(--h) * 0.32) rgba(0,0,0,.36),
      0 calc(var(--h) * 0.27) calc(var(--h) * 0.62) rgba(0,0,0,.22),
      inset 0 1px 0 rgba(255,255,255,.10);
    transition-duration:.10s;
  }

  /* ── 播放按钮（z 4） ──────────────────────────────────────────────── */
  .play-wrap{
    position:absolute; z-index:4; pointer-events:none;
    left:calc(187 * var(--u)); top:calc(421 * var(--u));
    width:calc(170 * var(--u)); height:calc(170 * var(--u));
  }
  .play-wrap > *{ pointer-events:auto; }
  .play-clip{
    position:absolute; left:50%; top:50%;
    width:calc(396 * var(--u)); height:calc(396 * var(--u));
    margin:calc(-198 * var(--u)) 0 0 calc(-198 * var(--u));
    clip-path:inset(calc(131 * var(--u)) calc(106 * var(--u))
                    calc(73 * var(--u)) calc(106 * var(--u)) round calc(92 * var(--u)));
  }
  .play-glass{ position:absolute; inset:0; display:grid; place-items:center; }
  .play-ring{
    position:absolute; inset:0; pointer-events:none;
    border:1px solid rgba(255,255,255,.17); border-radius:50%;
  }
  .play-ring::after{
    content:''; position:absolute; inset:calc(-1 * var(--u));
    border:1px solid rgba(255,255,255,.32); border-radius:50%;
    opacity:0; transform:scale(.86);
    transition:opacity .7s var(--ease), transform .9s var(--ease-out);
  }
  .play-clip:hover ~ .play-ring::after,
  .play-clip:focus-within ~ .play-ring::after{ opacity:1; transform:scale(1.06); }

  /* ── 数据（z 4） ───────────────────────────────────────────────────── */
  .stat{ position:absolute; z-index:4; display:flex; align-items:flex-start; gap:calc(9 * var(--u)); }
  .stat--a{ left:calc(1250 * var(--u)); top:calc(216 * var(--u)); }
  .stat--b{ left:calc(1346 * var(--u)); top:calc(326 * var(--u)); }
  .stat .mark{ width:calc(32 * var(--u)); height:calc(32 * var(--u)); flex:none; margin-top:calc(2 * var(--u)); color:rgba(255,255,255,.34); }
  .stat dt{ font-size:calc(13.5 * var(--u)); font-weight:300; color:var(--ink-soft); line-height:calc(19 * var(--u)); letter-spacing:calc(1 * var(--u)); }
  .stat dt, .stat dd{ text-shadow:0 calc(2 * var(--u)) calc(16 * var(--u)) rgba(10,14,8,.6); }
  .stat dd{ font-size:calc(13.5 * var(--u)); font-weight:600; color:var(--ink); line-height:calc(21 * var(--u)); white-space:nowrap; }

  /* ── 卡片 ─────────────────────────────────────────────────────────── */
  .card{
    position:absolute;
    background:var(--card); border-radius:calc(46 * var(--u));
    box-shadow:0 calc(30 * var(--u)) calc(70 * var(--u)) rgba(16,21,13,.30);
    transition:box-shadow .8s var(--ease);
  }
  /* 不设 z-index 是刻意的：卡片保持普通绘制盒沉在 #scene 之下（苔藓压过它的肩），
      而 .knob 在 z 4，仍在苔藓之前。 */
  .card--about{
    left:calc(890 * var(--u)); top:calc(200 * var(--u));
    width:calc(330 * var(--u)); height:calc(305 * var(--u));
  }
  .card--stove{
    z-index:4; will-change:transform;
    left:calc(1237 * var(--u)); top:calc(482 * var(--u));
    width:calc(328 * var(--u)); height:calc(310 * var(--u));
  }
  .card .label{
    position:absolute; left:calc(38 * var(--u));
    font-size:calc(15.5 * var(--u)); font-weight:300; color:var(--card-label);
    letter-spacing:calc(1.5 * var(--u));
  }
  .card h2{
    position:absolute; left:calc(38 * var(--u));
    font-family:'Noto Serif SC',serif;
    font-size:calc(27 * var(--u)); line-height:calc(30 * var(--u));
    font-weight:900; letter-spacing:calc(.5 * var(--u)); color:var(--card-ink);
  }
  .card--about .label{ top:calc(152 * var(--u)); }
  .card--about h2{ top:calc(178 * var(--u)); width:calc(180 * var(--u)); }
  .card--stove .label{ top:calc(45 * var(--u)); }
  .card--stove h2{ top:calc(72 * var(--u)); }
  .card figure{
    position:absolute; left:calc(14 * var(--u)); right:calc(14 * var(--u));
    border-radius:calc(34 * var(--u)); overflow:hidden;
    isolation:isolate; background:#263025;
  }
  .card--stove figure{ bottom:calc(14 * var(--u)); height:calc(158 * var(--u)); }
  .card--about figure{ top:calc(14 * var(--u)); height:calc(122 * var(--u)); }
  .portal-media{
    position:absolute; inset:calc(-9 * var(--u)); z-index:1; display:block;
    will-change:transform,clip-path;
    transform:
      perspective(900px)
      translate3d(calc(var(--px,0) * -11px),calc(var(--py,0) * -7px),0)
      rotateY(calc(var(--px,0) * -1.4deg))
      rotateX(calc(var(--py,0) * .9deg));
    transform-origin:50% 50%;
  }
  .portal-media img{
    width:100%; height:100%; object-fit:cover; display:block;
    transform:scale(1.08);
    filter:saturate(.92) contrast(1.03);
    transition:transform 1.25s var(--ease-out),filter .8s var(--ease);
  }
  .card:hover .portal-media img{ transform:scale(1.13); filter:saturate(1.04) contrast(1.04); }
  .pixel-reveal{
    position:absolute; inset:0; z-index:3; width:100%; height:100%;
    pointer-events:none; opacity:0; mix-blend-mode:screen;
  }
  .card figure::after{
    content:''; position:absolute; z-index:2;
    filter:blur(calc(2 * var(--u))); opacity:0; pointer-events:none;
    top:0; bottom:0; width:26%; left:calc(-13% - 9 * var(--u));
    background:linear-gradient(90deg,transparent,rgba(229,244,209,.2) 42%,rgba(252,255,246,.72) 54%,transparent);
  }

  .knob-float{
    position:absolute; z-index:4; pointer-events:none;
    left:calc(1142 * var(--u)); top:calc(427 * var(--u));
    width:calc(58 * var(--u)); height:calc(58 * var(--u));
  }
  .knob-float > *{ pointer-events:auto; }
  .knob--about{ left:0; top:0; }
  .card .knob, .knob--about{
    position:absolute; z-index:4; right:calc(20 * var(--u)); bottom:calc(20 * var(--u));
    width:calc(58 * var(--u)); height:calc(58 * var(--u));
    border:0; border-radius:50%; cursor:pointer;
    background:#fbfcf8; display:grid; place-items:center;
    box-shadow:0 calc(6 * var(--u)) calc(16 * var(--u)) rgba(16,21,13,.18);
    transition:transform .5s var(--ease-out), background .4s var(--ease);
  }
  .knob--about{ right:auto; bottom:auto; }
  .card--stove .knob{ width:calc(54 * var(--u)); height:calc(54 * var(--u)); right:calc(26 * var(--u)); bottom:calc(26 * var(--u)); }
  .card .knob svg, .knob--about svg{ width:calc(20 * var(--u)); height:calc(20 * var(--u)); display:block; color:#3f453a; }
  .card .knob:hover, .knob--about:hover{ transform:scale(1.1) rotate(8deg); background:#fff; }

(function () {

function clamp01(v){ return v<0?0:v>1?1:v; }
function rand(a,b){ return a+Math.random()*(b-a); }
function makeRng(seed){
  var s=seed>>>0;
  return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
}
function h2n(x,y){ var n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function vnoise(x,y){
  var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  xf=xf*xf*(3-2*xf); yf=yf*yf*(3-2*yf);
  var a=h2n(xi,yi),b=h2n(xi+1,yi),c=h2n(xi,yi+1),d=h2n(xi+1,yi+1);

}

  var s=0,a=.5,f=1,n=0,i;
  for(i=0;i<(o||4);i++){ s+=a*vnoise(x*f,y*f); n+=a; f*=2.03; a*=.5; }

}

function makeCanvas(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

function paintMossCard(){
  var W=880,H=640,c=makeCanvas(W,H),x=c.getContext('2d'),r=makeRng(77),i,n;

  for(i=0;i<11;i++){
    var sx=r()*W, sy=H*.32+r()*H*.75, sr=70+r()*150;
    blob(sx,sy,sr,'#8d927f','#494e41');
    blob(sx-sr*.28,sy-sr*.34,sr*.5,'#cfd3bd','rgba(207,211,189,0)',.32);
    blob(sx+sr*.2,sy+sr*.45,sr*.42,'#20241b','rgba(32,36,27,0)',.30);

  var mossCols=['#55663d','#65794a','#75894f','#87a05e','#93ad67'];
  for(i=0;i<220;i++){
    var mx=r()*W, my=H*(.18+.86*Math.pow(r(),.75))-14*r();

function paintGroveCard(){
  var W=880,H=640,c=makeCanvas(W,H),x=c.getContext('2d'),r=makeRng(31),i,L,s,fy;
  var bg=x.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#b3bcA6'); bg.addColorStop(.45,'#8f9884'); bg.addColorStop(1,'#5a614e');
  x.fillStyle=bg; x.fillRect(0,0,W,H);

  var layers=[
    { col:[152,162,140], n:7, wMin:7,wMax:16,  aMin:.28,aMax:.46 },
    { col:[118,128,106], n:5, wMin:14,wMax:34, aMin:.42,aMax:.62 },
    { col:[80,89,68],    n:4, wMin:24,wMax:52, aMin:.6,aMax:.8 },
    { col:[48,54,40],    n:3, wMin:44,wMax:78, aMin:.78,aMax:.95 }
  ];
  for(L=0;L<layers.length;L++){
    var cfg=layers[L];
    for(i=0;i<cfg.n;i++){
      var tx=(i+.35+r()*.6)*W/cfg.n*(0.94+0.12*r());
      if(tx>W*.98)continue;
      var tw0=cfg.wMin+r()*(cfg.wMax-cfg.wMin);
      var top=-40-r()*60, bot=H+30+r()*40;
      var sway=(r()-.5)*70, thick=r()*tw0*.5;
      var rgba=function(a){ return 'rgba('+cfg.col[0]+','+cfg.col[1]+','+cfg.col[2]+','+a.toFixed(3)+')'; };
      /* 三层套叠模拟柔边 */
      [[1.7,.30],[1.28,.55],[1,.92]].forEach(function(pp,k){
        x.beginPath();
        for(s=0;s<=22;s++){
          var f=s/22, yy=top+(bot-top)*f;
          var cx=tx+sway*Math.sin(f*Math.PI*(.7+.3*r()))*f+thick*Math.sin(f*9+i);
          var w2=tw0*pp[0]*(0.85+0.3*f)+k*2;
          if(s===0)x.moveTo(cx-w2,yy); else x.lineTo(cx-w2,yy);
        }
        for(s=22;s>=0;s--){
          var f2=s/22, yy2=top+(bot-top)*f2;
          var cx2=tx+sway*Math.sin(f2*Math.PI*(.7+.3*r()))*f2+thick*Math.sin(f2*9+i);
          var w22=tw0*pp[0]*(0.85+0.3*f2);
          x.lineTo(cx2+w22,yy2);
        }
        x.closePath();
        var gg=x.createLinearGradient(tx-tw0*2,0,tx+tw0*2,0);
        gg.addColorStop(0,rgba(0)); gg.addColorStop(.5,rgba(cfg.aMin+(cfg.aMax-cfg.aMin)*r()*pp[1]));
        gg.addColorStop(1,rgba(0));
        x.fillStyle=gg; x.fill();
      });
      /* 树冠团 */
      var cy=top+r()*H*.34;
      x.fillStyle=rgba(cfg.aMax*.85);
      x.beginPath(); x.ellipse(tx+sway*.3,cy,tw0*(2.2+r()),tw0*(1.1+r()*.7),(r()-.5)*.5,0,7); x.fill();
    }
    fy=H*(.16+L*.21);
    var fg=x.createLinearGradient(0,fy-46,0,fy+66);
    fg.addColorStop(0,'rgba(228,235,214,0)');
    fg.addColorStop(.5,'rgba(228,235,214,'+(0.13-L*.02)+')');
    fg.addColorStop(1,'rgba(228,235,214,0)');
    x.fillStyle=fg; x.fillRect(0,fy-46,W,112);
  }
  x.globalCompositeOperation='screen';
  for(i=0;i<42;i++){
    x.fillStyle='rgba(236,242,218,'+(0.03+0.09*r())+')';
    x.beginPath(); x.arc(r()*W,r()*H,3+r()*24,0,7); x.fill();
  }
  x.save();
  x.translate(W*.72,-H*.18); x.rotate(.4);
  var ray=x.createLinearGradient(0,0,150,0);
  ray.addColorStop(0,'rgba(240,245,222,0)'); ray.addColorStop(.5,'rgba(240,245,222,.17)'); ray.addColorStop(1,'rgba(240,245,222,0)');
  x.fillStyle=ray; x.fillRect(-40,-80,340,H*2);
  x.restore();
  x.globalCompositeOperation='source-over';
  var gr=x.createLinearGradient(0,H*.66,0,H);
  gr.addColorStop(0,'rgba(26,30,20,0)'); gr.addColorStop(1,'rgba(26,30,20,.48)');
  x.fillStyle=gr; x.fillRect(0,H*.66,W,H*.34);
  var im=x.getImageData(0,0,W,H),d=im.data,p,g;
  for(p=0;p<d.length;p+=4){ g=(fbmN((p/4)%W,(p/4/W)|0,2)-.5)*13; d[p]+=g; d[p+1]+=g; d[p+2]+=g; }
  x.putImageData(im,0,0);
  return c;
}

var LM_VERT='#version 300 es\nin vec2 position; void main(){ gl_Position=vec4(position,0.,1.); }';

var LM_HEAD=[
'#version 300 es',
'precision highp float;',
'out vec4 o;',
'uniform vec2 uC,uHalf;',
'uniform float uT,uHover,uPress;',
'uniform vec4 uRip[3];',
'uniform vec4 uRipK,uRipK2,uPtr,uPtrK;',
'float sdPill(vec2 p,vec2 b,float r){ vec2 q=abs(p)-b+r; return min(max(q.x,q.y),0.)+length(max(q,0.))-r; }',
'float ripple(vec2 p,float t){',
'  float sum=0.;',
'  for(int i=0;i<3;i++){',
'    if(uRip[i].w<.5)continue;',
'    float age=t-uRip[i].z;',
'    if(age<0.||age>4.)continue;',
'    vec2 rp=p-uRip[i].xy;',
'    float facet=1.+uRipK2.x*cos(uRipK2.y*atan(rp.y,rp.x)+age*2.1+float(i)*2.4);',
'    float x=(length(rp)-age*uRipK.x*facet)/uRipK.y;',
'    sum+=exp(-pow(abs(x)+1e-4,uRipK2.z))*exp(-age*uRipK.z);',
'  }',
'  return sum; }',
'float pointerW(vec2 p){',
'  if(uPtr.z<.001)return 0.;',
'  float d=length(p-uPtr.xy)/uPtrK.x;',
'  return exp(-d*d)*uPtr.z; }',
'vec2 pointerWarp(vec2 p){',
'  float w=pointerW(p);',
'  if(w<=0.)return vec2(0.);',
'  return normalize(p-uPtr.xy+vec2(1e-5))*w*(uPtrK.y+uPtrK.z*uPtr.w); }'
].join('\n');

var LM_NOISE=[
'float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }',
'float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);',
'  float a=h21(i),b=h21(i+vec2(1,0)),c=h21(i+vec2(0,1)),d=h21(i+vec2(1,1));',
'  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y)*2.-1.; }',
'float fbmL(vec2 p,float g){ float s=0.,a=1.,n=0.;',
'  for(int i=0;i<4;i++){ s+=a*vn(p); n+=a; p=p*2.03+11.7; a*=g; } return s/n; }',
'float wig(float x,float t,float seed){',
'  return vn(vec2(x,t*.150+seed))*.60+vn(vec2(x*2.07+4.,t*.105+seed))*.27+vn(vec2(x*4.30-7.,t*.080+seed))*.13; }'
].join('\n');

var LM_SCENE_BODY=[
'uniform float uP[21];',
'float valleyAt(vec2 p,float t){ return wig(p.x*uP[0],t,0.)*uP[1]; }',
'float densAt(vec2 p,float t){ return uP[2]*exp(uP[3]*wig(p.x*uP[4]+9.0,t,2.7)); }',
'float surfaceV(vec2 p,float t){',
'  float V=(p.y-valleyAt(p,t))*densAt(p,t);',
'  V+=uP[5]*fbmL(p*vec2(.8,1.7)*uP[6]+vec2(t*.05,-t*.03),uP[17]);',
'  return V-uP[7]; }',
'float tone(float v){ float u=fract(v),e=uP[9],W=uP[10]*.5;',
'  return smoothstep(.5-W-e,.5-W,u)*(1.-smoothstep(.5+W,.5+W+e,u)); }',
'vec3 spec3(float t){ return clamp(vec3(1.5)-abs(4.*t-vec3(3.,2.,1.)),0.,1.); }',
'void main(){',
'  vec2 d=gl_FragCoord.xy-uC;',
'  float sd=sdPill(d,uHalf,uHalf.y);',
'  float pill=1.-smoothstep(-1.,1.,sd);',
'  float S=uHalf.y*2.;',
'  float t=uT;',
'  if(uHover<=.0015||pill<=.0015){ o=vec4(0.); return; }',
'  vec2 p=vec2(d.x,-d.y)/S;',
'  vec2 q=p+pointerWarp(p);',
'  float h0=surfaceV(q,t);',
'  vec2 gp=vec2(dFdx(h0),-dFdy(h0))*S;',
'  float V=surfaceV(q-gp*uP[8]/max(uP[2],.001),t);',
'  float rip=ripple(p,t);',
'  float well=pointerW(p);',
'  V+=rip*uRipK.w;',
'  const int N=21;',
'  float mid=1.-pow(.5,uP[12]);',
'  vec3 col=vec3(0.),wsum=vec3(0.);',
'  for(int i=0;i<N;i++){',
'    float k=float(i)/float(N-1);',
'    vec3 w=spec3(k);',
'    col+=w*tone(V+((1.-pow(1.-k,uP[12]))-mid)*uP[11]);',
'    wsum+=w; }',
'  col/=wsum;',
'  col=pow(col,vec3(uP[15]));',
'  float lit=smoothstep(uP[18],uP[19],q.y-valleyAt(q,t));',
'  lit*=mix(1.,lit,.55);',
'  col*=uP[16]*lit;',
'  col*=1.+rip*1.15+well*.60;',

].join('\n');
var LM_SCENE=LM_HEAD+LM_NOISE+'\n'+LM_SCENE_BODY;

var LM_RIM=[
LM_HEAD,
'uniform float uE[8];',
'void main(){',
'  vec2 d=gl_FragCoord.xy-uC;',
'  float sd=sdPill(d,uHalf,uHalf.y);',

'  float ang=atan(nd.y,nd.x)/6.28318530718;',

'  for(int i=0;i<3;i++){',

'    float age=uT-uRip[i].z;',
'    if(age<0.||age>4.)continue;',
'    vec2 rp=nd-uRip[i].xy;',
'    float rr=length(rp)/(age*uRipK.x*1.2+1e-3);',
'    ripF+=exp(-pow(abs(rr-1.)*6.,2.))*max(0.,1.-age/3.); }',
'  float bright=(uE[0]+uE[1]*lead+topB+uPress*uE[6]+ripF*uE[7])*edge*uHover;',

].join('\n');

var LM_DOWN=[
'#version 300 es','precision highp float;','out vec4 o;',
'uniform sampler2D uT; uniform vec2 uBase;',
'void main(){ o=texture(uT,gl_FragCoord.xy*uBase); }'

var LM_BLUR=[
'#version 300 es','precision highp float;','out vec4 o;',
'uniform sampler2D uT; uniform vec2 uBase,uStep;',
'void main(){',
'  vec2 uv=gl_FragCoord.xy*uBase;',

function mountLiquidMetal(host){
  var btn=host.querySelector('.liquid-button');
  var fx=host.querySelector('.liquid-fx');
  var kind=host.getAttribute('data-liquid-metal');
  var gl;
  try{ gl=fx.getContext('webgl2',{alpha:true,antialias:false,premultipliedAlpha:true}); }catch(e){}
  if(!gl)return null;

  function sh(type,src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.warn(gl.getShaderInfoLog(s)); throw new Error('shader'); } return s; }
  function prog(fs){ var p=gl.createProgram();
    gl.attachShader(p,sh(gl.VERTEX_SHADER,LM_VERT)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
    gl.bindAttribLocation(p,0,'position'); gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
    var u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS),i,info;
    for(i=0;i<n;i++){ info=gl.getActiveUniform(p,i); u[info.name.replace('[0]','')]=gl.getUniformLocation(p,info.name); }
    return {p:p,u:u};
  }
  var pScene,pRim,pDown,pBlur,pCopy,pAdd;
  try{
    pScene=prog(LM_SCENE); pRim=prog(LM_RIM); pDown=prog(LM_DOWN); pBlur=prog(LM_BLUR);
    pCopy=prog(LM_COPY); pAdd=prog(LM_ADD);
  }catch(err){ console.warn('liquid-metal init failed',err); return null; }

  gl.bindVertexArray(gl.createVertexArray());
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.disable(gl.BLEND);
  gl.clearColor(0,0,0,0);

  /* 采样线性过滤 half-float 需要两个扩展齐备，缺一则回退 8bit 目标 */
  var hasFloat=!!gl.getExtension('EXT_color_buffer_half_float')&&!!gl.getExtension('OES_texture_half_float_linear');
  function makeTarget(w,h){
    var tex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,hasFloat?gl.RGBA16F:gl.RGBA,w,h,0,gl.RGBA,hasFloat?gl.HALF_FLOAT:gl.UNSIGNED_BYTE,null);
    var fbo=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return {tex:tex,fbo:fbo,w:w,h:h};
  }

  var PKEYS=Object.keys(LM_P),EKEYS=Object.keys(LM_E);
  var uArr=new Float32Array(PKEYS.length),eArr=new Float32Array(EKEYS.length);
  var W=2,H=2,BW=10,BH=10,CX=5,CY=5,DPR=1,WQ=1,HQ=1;
  var Tscene,Trim,Tsmall,TblurA,TblurB;
  var hover=0,hoverTarget=0,press=0,pressTarget=0,clock=0,last=performance.now(),drawn=false;
  var RIP=[{x:0,y:0,t:-99,on:0},{x:0,y:0,t:-99,on:0},{x:0,y:0,t:-99,on:0}];
  var ripNext=0;
  var ripArr=new Float32Array(12);
  var ptr={x:0,y:0},ptrS={x:0,y:0},ptrPrev={x:0,y:0},ptrSpeed=0,ptrAmt=0;
  var staticCap=REDUCED;

  function localFromClient(cx,cy){
    var b=btn.getBoundingClientRect(),s=b.height||1;
    return [(cx-(b.left+b.width/2))/s,(cy-(b.top+b.height/2))/s];
  }
  function addRipple(lx,ly){
    var r=RIP[ripNext]; ripNext=(ripNext+1)%3;
    r.x=clamp01(lx+2)-2; r.y=ly; r.t=clock; r.on=1;
  }
  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    var hr=host.getBoundingClientRect();
    if(hr.width<2||hr.height<2)return;
    W=Math.max(2,Math.round(hr.width*DPR)); H=Math.max(2,Math.round(hr.height*DPR));
    fx.width=W; fx.height=H;
    var b=btn.getBoundingClientRect();
    BW=Math.max(2,Math.round(b.width*DPR)); BH=Math.max(2,Math.round(b.height*DPR));
    CX=((b.left+b.width/2)-hr.left)*DPR; CY=((b.top+b.height/2)-hr.top)*DPR;
    WQ=Math.max(1,W>>2); HQ=Math.max(1,H>>2);
    Tscene=makeTarget(W,H); Trim=makeTarget(W,H);
    Tsmall=makeTarget(WQ,HQ); TblurA=makeTarget(WQ,HQ); TblurB=makeTarget(WQ,HQ);
    drawn=false;
  }
  function drawTo(t){ gl.bindFramebuffer(gl.FRAMEBUFFER,t?t.fbo:null); gl.viewport(0,0,t?t.w:W,t?t.h:H); gl.drawArrays(gl.TRIANGLES,0,3); }
  function clearTo(t){ gl.bindFramebuffer(gl.FRAMEBUFFER,t?t.fbo:null); gl.viewport(0,0,t?t.w:W,t?t.h:H); gl.clear(gl.COLOR_BUFFER_BIT); }
  function bindTex(unit,tex){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,tex); }

  function frame(now){
    requestAnimationFrame(frame);
    if(staticCap&&drawn)return;
    if(!Tscene)return;
    /* 挂载早于布局完成：按钮实际尺寸一变就重建目标 */
    var brNow=btn.getBoundingClientRect(),hrNow=host.getBoundingClientRect();
    if(hrNow.width>2&&(Math.abs(brNow.width-BW/DPR)>1.5||Math.abs(brNow.height-BH/DPR)>1.5||
       Math.abs(hrNow.width-W/DPR)>1.5||Math.abs(hrNow.height-H/DPR)>1.5)){ resize(); }
    var dt=Math.min((now-last)/1000,.05); last=now;
    clock+=dt;

    hover+=(hoverTarget-hover)*(1-Math.exp(-dt*(hoverTarget>hover?14:6)));
    press+=(pressTarget-press)*(1-Math.exp(-dt*(pressTarget>press?40:9)));
    host.classList.toggle('hot',hover>.04);
    host.classList.toggle('press',press>.5);

    var st=1-Math.pow(PTR.lag,dt);
    ptrS.x+=(ptr.x-ptrS.x)*st; ptrS.y+=(ptr.y-ptrS.y)*st;
    var vx=(ptr.x-ptrPrev.x)/Math.max(dt,1e-3),vy=(ptr.y-ptrPrev.y)/Math.max(dt,1e-3);
    ptrPrev.x=ptr.x; ptrPrev.y=ptr.y;
    ptrSpeed+=(clamp01(Math.hypot(vx,vy)/PTR.vref)-ptrSpeed)*(1-Math.exp(-dt*6));

    var i,r,moving=false;
    for(i=0;i<3;i++){ r=RIP[i]; ripArr[i*4]=r.x; ripArr[i*4+1]=r.y; ripArr[i*4+2]=r.t; ripArr[i*4+3]=r.on;
      if(r.on&&(clock-r.t)>4){ r.on=0; } else if(r.on)moving=true; }

    var k;
    for(i=0,k=0;i<PKEYS.length;i++)uArr[k++]=LM_P[PKEYS[i]];
    for(i=0,k=0;i<EKEYS.length;i++)eArr[k++]=LM_E[EKEYS[i]];

    clearTo(Tscene);
    gl.useProgram(pScene.p);
    gl.uniform2f(pScene.u.uC,CX,CY); gl.uniform2f(pScene.u.uHalf,BW/2,BH/2);
    gl.uniform1f(pScene.u.uT,clock); gl.uniform1f(pScene.u.uHover,hover); gl.uniform1f(pScene.u.uPress,press);
    gl.uniform4fv(pScene.u.uRip,ripArr);
    gl.uniform4f(pScene.u.uRipK,RIPK.speed,RIPK.width,RIPK.decay,RIPK.amp);
    gl.uniform4f(pScene.u.uRipK2,RIPK2.facet,RIPK2.lobes,RIPK2.sharp,RIPK2.emit);
    gl.uniform4f(pScene.u.uPtr,ptrS.x,ptrS.y,ptrAmt,ptrSpeed);
    gl.uniform4f(pScene.u.uPtrK,PTRK.rad,PTRK.amp,PTRK.fast,PTRK.rim);
    gl.uniform1fv(pScene.u.uP,uArr);
    drawTo(Tscene);

    clearTo(Trim);
    gl.useProgram(pRim.p);
    gl.uniform2f(pRim.u.uC,CX,CY); gl.uniform2f(pRim.u.uHalf,BW/2,BH/2);
    gl.uniform1f(pRim.u.uT,clock); gl.uniform1f(pRim.u.uHover,hover); gl.uniform1f(pRim.u.uPress,press);
    gl.uniform4fv(pRim.u.uRip,ripArr);
    gl.uniform4f(pRim.u.uRipK,RIPK.speed,RIPK.width,RIPK.decay,RIPK.amp);
    gl.uniform4f(pRim.u.uRipK2,RIPK2.facet,RIPK2.lobes,RIPK2.sharp,RIPK2.emit);
    gl.uniform4f(pRim.u.uPtr,ptrS.x,ptrS.y,ptrAmt,ptrSpeed);
    gl.uniform4f(pRim.u.uPtrK,PTRK.rad,PTRK.amp,PTRK.fast,PTRK.rim);
    gl.uniform1fv(pRim.u.uE,eArr);
    drawTo(Trim);

    /* 泛光链：整幅 down 一格 + 两向模糊（预乘 α 直加，边缘保持干净） */
    gl.useProgram(pDown.p);
    bindTex(0,Tscene.tex); gl.uniform1i(pDown.u.uT,0);
    gl.uniform2f(pDown.u.uBase,(WQ/W),(HQ/H));
    drawTo(Tsmall);

    gl.useProgram(pBlur.p);
    gl.uniform1i(pBlur.u.uT,0);
    bindTex(0,Tsmall.tex); gl.uniform2f(pBlur.u.uBase,1,1); gl.uniform2f(pBlur.u.uStep,1.55/WQ,0); drawTo(TblurA);
    bindTex(0,TblurA.tex); gl.uniform2f(pBlur.u.uBase,1,1); gl.uniform2f(pBlur.u.uStep,0,1.55/HQ); drawTo(TblurB);

    /* 直绘输出：金属拷贝 → 泛光加法 → 行走描边加法（全部 premultiplied） */
    clearTo(null);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(pCopy.p);
    bindTex(0,Tscene.tex); gl.uniform1i(pCopy.u.uT,0);
    drawTo(null);

    gl.blendFunc(gl.ONE,gl.ONE);
    gl.useProgram(pAdd.p);
    bindTex(0,TblurB.tex); gl.uniform1i(pAdd.u.uT,0);
    gl.uniform2f(pAdd.u.uBase,1/W,1/H);
    gl.uniform1f(pAdd.u.uK,kind==='play'?0.95:0.6);
    gl.uniform1f(pAdd.u.uHv,hover);
    drawTo(null);

    gl.useProgram(pRim.p);
    gl.uniform2f(pRim.u.uC,CX,CY); gl.uniform2f(pRim.u.uHalf,BW/2,BH/2);
    gl.uniform1f(pRim.u.uT,clock); gl.uniform1f(pRim.u.uHover,hover); gl.uniform1f(pRim.u.uPress,press);
    gl.uniform4fv(pRim.u.uRip,ripArr);
    gl.uniform4f(pRim.u.uRipK,RIPK.speed,RIPK.width,RIPK.decay,RIPK.amp);
    gl.uniform4f(pRim.u.uRipK2,RIPK2.facet,RIPK2.lobes,RIPK2.sharp,RIPK2.emit);
    gl.uniform4f(pRim.u.uPtr,ptrS.x,ptrS.y,ptrAmt,ptrSpeed);
    gl.uniform4f(pRim.u.uPtrK,PTRK.rad,PTRK.amp,PTRK.fast,PTRK.rim);
    gl.uniform1fv(pRim.u.uE,eArr);
    drawTo(null);
    gl.disable(gl.BLEND);

    drawn=true;
  }

  host.addEventListener('pointermove',function(e){
    var l=localFromClient(e.clientX,e.clientY);
    ptr.x=l[0]; ptr.y=l[1]; ptrAmt=Math.min(1,ptrAmt+.14);
  },{passive:true});
  host.addEventListener('pointerleave',function(){ ptrAmt=0; });
  btn.addEventListener('pointerenter',function(){ hoverTarget=REDUCED?0:1; });
  btn.addEventListener('pointerleave',function(){ hoverTarget=0; });
  btn.addEventListener('pointerdown',function(e){
    pressTarget=1;
    var l=localFromClient(e.clientX,e.clientY);
    addRipple(l[0],l[1]);
    forwardBurst(host,e.clientX,e.clientY);
  });
  window.addEventListener('pointerup',function(){ pressTarget=0; });
  btn.addEventListener('click',function(e){ e.preventDefault(); });

  resize();
  requestAnimationFrame(frame);
  return {
    resize:resize,
    burstAt:function(cx,cy){ var l=localFromClient(cx,cy); addRipple(clamp01(l[0]/8)*0+l[0],l[1]); },
    get active(){ return hover>.02||movingAny(); }
  };
  function movingAny(){ var i; for(i=0;i<3;i++)if(RIP[i].on)return true; return false; }
}

function forwardBurst(selfHost,cx,cy){
  liquidMounts.forEach(function(m){ if(m.host!==selfHost&&m.api)m.api.burstAt(cx,cy); });

/* =====================================================================
   3 · UI —— 入场编排 / 像素点揭幕 / dock 放大 / 高光描边 / 视差
   ===================================================================== */
var introStart=-1;

var portals=[];
document.querySelectorAll('.portal').forEach(function(fig,idx){
  portals.push({
    fig:fig,
    cv:fig.querySelector('.pixel-reveal'),
    media:fig.querySelector('.portal-media'),
    delay:+fig.getAttribute('data-delay')||900,
    samples: idx===0?cardSources.samples_ethos:cardSources.samples_grove,
    tw:26,th:16,dpr:1,done:!REDUCED?false:true
  });
});
function sizePortals(){
  var dpr=Math.min(devicePixelRatio||1,2);
  portals.forEach(function(pt){
    if(!pt.cv||pt.done)return;
    var r=pt.media.getBoundingClientRect();
    pt.cv.width=Math.max(2,Math.round(r.width*dpr));
    pt.cv.height=Math.max(2,Math.round(r.height*dpr));
    pt.dpr=dpr;
  });
}
function drawPortalDots(now){
  if(introStart<0)return;
  portals.forEach(function(pt){
    if(pt.done||!pt.cv||!pt.samples)return;
    var el=now-introStart-pt.delay;
    if(el<-40)return;
    var CUT_MS=1450,STEPS=12;
    var p=Math.floor(clamp01(el/CUT_MS)*STEPS)/STEPS;
    if(el>CUT_MS+520){ pt.done=true; pt.cv.style.opacity=0; return; }
    var ctx=pt.cv.getContext('2d');
    var W=pt.cv.width,H=pt.cv.height;
    ctx.clearRect(0,0,W,H);
    var edge=W*p;
    if(edge<=1)return;
    var col,row;
    for(col=0;col<pt.tw;col++){
      var cx=(col+.5)/pt.tw*W;
      if(cx>edge)continue;
      var back=(edge-cx)/W;
      var near=clamp01(1-back/.30);
      if(near<=0)continue;
      for(row=0;row<pt.th;row++){
        if(h2n(col,row)>.55+near*.45)continue;
        var s=pt.samples[row*pt.tw+col];
        var lift=.45+near*.4;
        var rr=Math.min(1,s[0]+lift),gg=Math.min(1,s[1]+lift),bb=Math.min(1,s[2]+lift*1.1);
        var a=near*.75*(0.4+0.6*h2n(col*3,row));
        ctx.fillStyle='rgba('+(rr*255|0)+','+(gg*255|0)+','+(bb*255|0)+','+a.toFixed(3)+')';
        var sz=(0.8+h2n(col,row*3)*2.2)*pt.dpr;
        var dy=(h2n(col*7,row)*10-5)*pt.dpr*near;
        ctx.fillRect(cx+W*.004,(row+.5)/pt.th*H+dy-sz/2,sz,sz);
      }
    }
  });
}

/* ---- dock 放大 ---- */
var DOCK={root:document.querySelector('.dock'),items:[],live:false,dirty:true,on:false,u:1};
if(DOCK.root){
  DOCK.root.querySelectorAll('[data-dock]').forEach(function(el){
    DOCK.items.push({el:el,w:0,h:0,v:0,vel:0,target:0});
  });
}
function fineHover(){ return !REDUCED&&matchMedia('(hover:hover) and (pointer:fine)').matches; }
function measureDock(){
  DOCK.on=fineHover(); DOCK.u=unitU();
  DOCK.items.forEach(function(st){
    st.el.style.width=''; st.el.style.height=''; st.el.style.transform='';
    st.el.dataset.near='false';
    st.v=st.vel=st.target=0;
  });
  DOCK.items.forEach(function(st){
    var r=st.el.getBoundingClientRect(); st.w=r.width; st.h=r.height;
  });
  DOCK.live=false; DOCK.dirty=true;
}
function drawDock(dt){
  if(!DOCK.root||!DOCK.on)return;
  var rr,st;
  if(aim.seen&&aim.moved){
    rr=DOCK.root.getBoundingClientRect();
    if(aim.x>rr.left-48&&aim.x<rr.right+48&&aim.y>rr.top-44&&aim.y<rr.bottom+104){
      DOCK.items.forEach(function(st){
        var r=st.el.getBoundingClientRect();
        var prox=clamp01(1-Math.abs(aim.x-(r.left+r.width*.5))/(128*DOCK.u));
        st.target=prox*prox*(3-2*prox);
        st.el.dataset.near=st.target>.08?'true':'false';
      });
      DOCK.live=true; DOCK.dirty=true;
    }else if(DOCK.live){
      DOCK.live=false; DOCK.dirty=true;
      DOCK.items.forEach(function(st){ st.target=0; st.el.dataset.near='false'; });
    }
  }
  if(!DOCK.dirty)return;
  var moving=false;
  DOCK.items.forEach(function(st){
    st.vel+=(st.target-st.v)*190*dt; st.vel*=Math.exp(-23*dt); st.v+=st.vel*dt;
    if(Math.abs(st.target-st.v)<.001&&Math.abs(st.vel)<.004){ st.v=st.target; st.vel=0; }else moving=true;
    var v=Math.min(Math.max(st.v,0),1.08);
    var mark=st.el.classList.contains('dock-mark');
    var ew=mark?14*DOCK.u:Math.min(18*DOCK.u,st.w*.24);
    var eh=mark?14*DOCK.u:16*DOCK.u;
    st.el.style.width=(st.w+ew*v).toFixed(2)+'px';
    st.el.style.height=(st.h+eh*v).toFixed(2)+'px';
    st.el.style.transform='translateY('+(v*3.5*DOCK.u).toFixed(2)+'px)';
  });
  if(!moving)DOCK.dirty=false;
}
function unitU(){ return stageEl.getBoundingClientRect().width/(NARROW.matches?760:1600); }

/* ---- 镜面高光描边 ---- */
var SPEC={items:[],on:true,dirty:true};
document.querySelectorAll('[data-spec]').forEach(function(el){
  SPEC.items.push({el:el,reach:+el.getAttribute('data-reach')||140,ang:2.4,br:0,tAng:2.4,tBr:0});
});
function drawSpec(dt){
  if(!SPEC.on)return;
  if(aim.seen&&aim.moved){
    SPEC.items.forEach(function(st){
      var r=st.el.getBoundingClientRect();
      var cx=r.left+r.width*.5,cy=r.top+r.height*.5;
      var dx=Math.max(r.left-aim.x,0,aim.x-r.right);
      var dy=Math.max(r.top-aim.y,0,aim.y-r.bottom);
      var d=Math.sqrt(dx*dx+dy*dy);
      st.tAng=d===0
        ? Math.atan2(2/Math.max(r.height,1),-2/Math.max(r.width,1))
          + ((aim.x-cx)/Math.max(r.width*.5,1))*.30
          + ((cy-aim.y)/Math.max(r.height*.5,1))*.15
        : Math.atan2(cy-aim.y,aim.x-cx);
      var raw=clamp01(1-d/(st.reach*Math.max(DOCK.u,.2)||140));
      st.tBr=raw*raw*(3-2*raw);
    });
    SPEC.dirty=true;
  }
  if(!SPEC.dirty)return;
  var moving=false;
  SPEC.items.forEach(function(st){
    var diff=((st.tAng-st.ang+Math.PI*3)%(Math.PI*2))-Math.PI;
    st.ang+=diff*(1-Math.exp(-dt*8));
    st.br+=(st.tBr-st.br)*(1-Math.exp(-dt*9));
    if(Math.abs(diff)<.001&&Math.abs(st.tBr-st.br)<.002){ st.ang=st.tAng; st.br=st.tBr; }else moving=true;
    st.el.style.setProperty('--spec-angle',st.ang.toFixed(4)+'rad');
    st.el.style.setProperty('--spec-bright',(clamp01(st.br)*.92).toFixed(3));
  });
  if(!moving)SPEC.dirty=false;
}

/* ---- 总时钟 ---- */
var smoothP={x:0,y:0},lastTick=0;
function tick(now){
  requestAnimationFrame(tick);
  var dt=lastTick?Math.min((now-lastTick)/1000,.05):.016;
  lastTick=now;
  drawDock(dt); drawSpec(dt);
  aim.moved=false;
  smoothP.x+=(pointer.x-smoothP.x)*.055;
  smoothP.y+=(pointer.y-smoothP.y)*.055;
  if(parOn()){
    var nx=Math.round(smoothP.x*1000)/1000,ny=Math.round(smoothP.y*1000)/1000;
    if(nx!==tick.lx||ny!==tick.ly){
      tick.lx=nx; tick.ly=ny;
      hero.style.setProperty('--px',nx);
      hero.style.setProperty('--py',ny);
    }
  }
  drawPortalDots(now);
  if(window.__sceneFrame)window.__sceneFrame(dt,now);
}
requestAnimationFrame(tick);

/* =====================================================================
   4 · 活世界场景
   设计单位坐标系：stage 内 x∈[-800,800]，y∈[-440,440]，+y 向下。
   所有几何在几何入口把 y 翻成世界坐标（向上），材质与相机均按世界系写。
   ===================================================================== */
var sceneBuilt=false;
window.__buildScene=function(){
  if(sceneBuilt)return; sceneBuilt=true;
  if(!window.THREE){ setTimeout(function(){ readyDone||setReady(); },700); return; }

  var canvas=document.getElementById('scene');
  var renderer;
  try{
    renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
  }catch(e){ console.warn('WebGL unavailable',e); readyDone||setReady(); return; }
  renderer.setClearColor(0x000000,0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,REDUCED?1:2));
  renderer.info.autoReset=false;

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(38,1,10,9000);
  var uni={
    uTime:{value:0},uWind:{value:1},
    uScanOn:{value:0},uScanR:{value:0},
    uMouse:{value:new THREE.Vector2(9999,9999)},uMouseR:{value:150},
    uCam:{value:new THREE.Vector3()}
  };
  var pxPerWorld=100;

  /* ---------- GLSL 公共块 ---------- */
  var NOISE_GLSL=[
    'float hh21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }',
    'float vn2(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);',
    '  float a=hh21(i),b=hh21(i+vec2(1.,0.)),c=hh21(i+vec2(0.,1.)),d=hh21(i+vec2(1.,1.));',
    '  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }',
    'float fbmC(vec2 p){ float s=0.,a=.5; for(int i=0;i<4;i++){ s+=a*vn2(p); p=p*2.03+7.3; a*=.5; } return s; }'
  ].join('\n');

  var LIGHT_GLSL=[
    'const vec3 KEYDIRW=normalize(vec3(-.42,.72,.55));',
    'const vec3 KEYCOL=vec3(1.16,1.10,.94);',
    'const vec3 FILLDIRW=normalize(vec3(.06,-.88,.42));',
    'const vec3 FILLCOL=vec3(.84,.845,.68);',
    'const vec3 AMBCOL=vec3(.15,.155,.13);',
    'const vec3 HAZECOL=vec3(.176,.195,.145);',
    'vec3 lightSurf(vec3 N,vec3 alb,float ao){',
    '  float k=max(dot(N,KEYDIRW),0.);',
    '  float f=max(dot(N,FILLDIRW),0.);',
    '  float sky=.5+.5*N.y;',
    '  vec3 c=alb*(AMBCOL*sky+KEYCOL*k+FILLCOL*f);',
    '  return c*ao; }',
    'vec3 applyHaze(vec3 c,vec3 wp,float amt){',
    '  float fz=clamp(length(wp-uCam)*0.00028,0.,1.);',
    '  return mix(c,HAZECOL*1.35+vec3(.06,.07,.05),fz*amt); }',
    'vec3 applyScan(vec3 c,vec3 dp){',
    '  float dd=length(dp.xy-vec2(0.,-130.));',
    '  float band=exp(-pow(abs(dd-uScanR)/90.,2.));',
    '  return c+vec3(.34,.43,.28)*band*uScanOn; }'
  ].join('\n');

  var OUT_GLSL=[
    'vec3 acesFit(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }',
    'vec4 finalize(vec3 c,float a){ return vec4(pow(acesFit(c),vec3(1./1.75)),a); }'
  ].join('\n');

  /* 标准网格着色器：顶点固定，片段自定义 */
  function makeMat(o){
    o=o||{};
    if(o.wobble){
      o.vert='attribute vec3 aTint;\nattribute float aSeed;\n'+[
        'varying vec3 vN,vWP,vTint; varying float vSeed; varying vec3 vLoc;',
        NOISE_GLSL,
        'void main(){',
        '  vLoc=position; vTint=aTint; vSeed=aSeed;',
        '  float wb=(fbmC(position.xy*.008+position.z*.006)-.45)*'+o.wobble+';',
        '  vec3 p2=position+normal*wb;',
        '  vec4 mp=modelMatrix*vec4(p2,1.);',
        '  vWP=mp.xyz;',
        '  vN=normalize(mat3(modelMatrix)*normal);',
        '  gl_Position=projectionMatrix*viewMatrix*mp;',
        '}'].join('\n');
    }
    var vert=o.vert||'attribute vec3 aTint;\nattribute float aSeed;\n'+[
      'varying vec3 vN,vWP,vTint; varying float vSeed; varying vec3 vLoc;',
      'void main(){',
      '  vLoc=position; vTint=aTint; vSeed=aSeed;',
      '  vec4 mp=modelMatrix*vec4(position,1.);',
      '  vWP=mp.xyz;',
      '  vN=normalize(mat3(modelMatrix)*normal);',
      '  gl_Position=projectionMatrix*viewMatrix*mp;',
      '}'
    ].join('\n');
    var frag=[
      'precision highp float;',
      'varying vec3 vN,vWP,vTint; varying float vSeed; varying vec3 vLoc;',
      'uniform float uTime,uWind,uScanOn,uScanR,uMouseR,uHaze;',
      'uniform vec3 uCam;','uniform vec2 uMouse;',

    }
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    g.setAttribute('aDat',new THREE.BufferAttribute(dat,2));
    var m=new THREE.ShaderMaterial({
      uniforms:{ uTime:uni.uTime,uPx:{value:pxPerWorld} },
      vertexShader:[
        'attribute vec2 aDat;',
        'varying float vTw; varying float vBig;',
        'uniform float uTime,uPx;',
        'void main(){',
        '  vec3 p=position; float ph=aDat.x;',
        '  p.x+=sin(uTime*.05+ph)*70.+uTime*4.*fract(ph);',
        '  p.y+=sin(uTime*.041+ph*1.7)*46.+cos(uTime*.033+ph)*30.;',
        '  vTw=.35+.65*(.5+.5*sin(uTime*(.4+fract(ph))+ph*3.));',
        '  vBig=step(2.8,aDat.y);',
        '  vec4 mv=modelViewMatrix*vec4(p,1.);',
        '  gl_PointSize=aDat.y*uPx/max(1.,-mv.z);',
        '  gl_Position=projectionMatrix*mv;',
        '}'
      ].join('\n'),
      fragmentShader:[
        'precision mediump float;',
        'varying float vTw; varying float vBig;',
        'void main(){',
        '  float d=length(gl_PointCoord-.5);',
        '  float m=smoothstep(.5,.08,d);',
        '  vec3 col=mix(vec3(.93,.95,.82),vec3(1.,.98,.88),vBig);',
        '  gl_FragColor=vec4(col*m*vTw*.75,m*vTw*.75);',
        '}'
      ].join('\n'),
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
    });
    var pts=new THREE.Points(g,m);
    pts.frustumCulled=false;
    pts.renderOrder=9;
    return pts;
  })();
  rootWorld.add(motes);

  /* ---------- 蝴蝶 ---------- */
  function wingTexture(){
    var W=128,H=96,c=document.createElement('canvas'); c.width=W; c.height=H;
    var x=c.getContext('2d'),i;
    x.clearRect(0,0,W,H);
    x.fillStyle='#efe6cc';
    x.strokeStyle='rgba(72,60,38,.85)';
    x.lineWidth=3;
    x.beginPath();
    x.moveTo(4,H*.52);
    x.bezierCurveTo(W*.16,-H*.06,W*.78,4,W*.97,H*.34);
    x.bezierCurveTo(W*.86,H*.62,W*.44,H*.66,4,H*.62);
    x.closePath(); x.fill(); x.stroke();
    x.fillStyle='rgba(224,196,132,.9)';
    x.beginPath(); x.ellipse(W*.42,H*.26,W*.20,H*.13,.25,0,7); x.fill();
    x.lineWidth=1.4; x.strokeStyle='rgba(90,74,46,.55)';
    for(i=0;i<5;i++){
      x.beginPath(); x.moveTo(6,H*.5);
      x.quadraticCurveTo(W*.4,H*(.12+.16*i),W*(.8-i*.09),H*(.14+.1*i));
      x.stroke();
    }
    var t=new THREE.CanvasTexture(c);
    t.minFilter=THREE.LinearFilter;
    return t;
  }
  function makeButterfly(side){
    var g=new THREE.Group();
    var wingMat=new THREE.MeshBasicMaterial({map:wingTexture(),transparent:true,opacity:.92,side:THREE.DoubleSide,depthWrite:false,alphaTest:.08});
    var wl=new THREE.Mesh(new THREE.PlaneGeometry(46,32),wingMat);
    wl.geometry.translate(22,0,0);
    var wr=new THREE.Mesh(wl.geometry,wingMat);
    wr.scale.x=-1;
    var wingL=new THREE.Group(); wingL.add(wl);
    var wingR=new THREE.Group(); wingR.add(wr);
    g.add(wingL,wingR);
    var body=new THREE.Mesh(new THREE.CapsuleGeometry(2.2,16,3,8),
      new THREE.MeshBasicMaterial({color:0x3d3320}));
    body.rotation.x=Math.PI/2;
    g.add(body);
    g.scale.setScalar(.68);
    return {
      g:g,wl:wingL,wr:wingR,
      phase:side>0?3.1:0.6,
      cx:side>0?120:-430,cy:-118,
      rx:side>0?260:330,ry:95,
      sp:side>0?.010:.0075
    };
  }
  if(!smallView&&!REDUCED){
    butterflies=[makeButterfly(-1),makeButterfly(1)];
    butterflies.forEach(function(bf){ rootWorld.add(bf.g); });
  }
  function updateButterflies(t){
    butterflies.forEach(function(bf){
      function at(sv){
        sv=sv%1;
        var cy=bf.cy-(isNarrowLayout?215:0);
        return new THREE.Vector3(
          bf.cx+Math.cos(sv*Math.PI*2)*bf.rx*(.85+.15*Math.sin(sv*9)),
          cy+Math.sin(sv*Math.PI*2)*bf.ry+Math.sin(sv*17)*8,
          150+Math.sin(sv*Math.PI*3)*80
        );
      }
      var s=t*bf.sp+bf.phase;
      var p=at(s),pn=at(s+.02);
      bf.g.position.copy(p);
      bf.g.lookAt(pn.x,pn.y,pn.z);
      var flap=Math.sin(t*21+bf.phase*5);
      var glide=Math.max(0,Math.sin(t*.31+bf.phase))>.82?.25:1;
      bf.wl.rotation.z=flap*1.0*glide;
      bf.wr.rotation.z=-flap*1.0*glide;
    });
  }

  /* ---------- 指针光尘喷雾 ---------- */
  var SPRAY_N=120,lastSprayEmit=0,lastPtr=null,ptrCl={x:99999,y:99999};
  sprayPts=(function(){
    var g=new THREE.BufferGeometry();
    var pos=new Float32Array(SPRAY_N*3),alp=new Float32Array(SPRAY_N);
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    g.setAttribute('aA',new THREE.BufferAttribute(alp,1));
    var m=new THREE.ShaderMaterial({
      uniforms:{ uPx:{value:pxPerWorld} },
      vertexShader:[
        'attribute float aA; varying float vA; uniform float uPx;',
        'void main(){',
        '  vA=aA;',
        '  vec4 mv=modelViewMatrix*vec4(position,1.);',
        '  gl_PointSize=(6.+10.*aA)*uPx/max(1.,-mv.z);',
        '  gl_Position=projectionMatrix*mv;',
        '}'
      ].join('\n'),
      fragmentShader:[
        'precision mediump float; varying float vA;',
        'void main(){',
        '  float d=length(gl_PointCoord-.5);',
        '  float m=smoothstep(.5,.05,d)*vA;',
        '  gl_FragColor=vec4(vec3(.88,.95,.74)*m,m*.8);',
        '}'
      ].join('\n'),
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
    });
    var pts=new THREE.Points(g,m);
    pts.frustumCulled=false;
    pts.renderOrder=10;
    rootWorld.add(pts);
    for(var i=0;i<SPRAY_N;i++)sprayData.push({life:0,x:0,y:0,z:0,vx:0,vy:0});
    return pts;
  })();

  window.__scenePointer=function(cx,cy){
    ptrCl.x=cx; ptrCl.y=cy;
    if(!rootWorld)return;
    var r=hero.getBoundingClientRect();
    var dx=(cx-(r.left+r.width/2))/worldU;
    var dy=(cy-(r.top+r.height/2))/worldU-OFF_Y;
    uni.uMouse.value.set(dx,dy);
  };

  function updateSpray(dt,nowSec){
    if(lastPtr){
      var sp=Math.hypot(ptrCl.x-lastPtr.x,ptrCl.y-lastPtr.y);
      var band=isNarrowLayout?[600,940]:[240,520];
      if(sp>4&&nowSec-lastSprayEmit>.02){
        lastSprayEmit=nowSec;
        var dyD=(ptrCl.y-(hero.getBoundingClientRect().top+hero.clientHeight/2))/worldU-OFF_Y;
        var dxd=(ptrCl.x-innerWidth/2)/worldU;
        if(dyD>band[0]&&dyD<band[1]){
          for(var k=0;k<2;k++){
            var sd=null,j;
            for(j=0;j<SPRAY_N;j++)if(sprayData[j].life<=0){ sd=sprayData[j]; break; }
            if(!sd)break;
            sd.life=1; sd.x=dxd+rand(-14,14); sd.y=-dyD+rand(-8,8); sd.z=rand(120,220);
            sd.vx=rand(-9,9)-(ptrCl.x-lastPtr.x)*.10/worldU; sd.vy=rand(2,16);
          }
        }
      }
    }
    if(!lastPtr)lastPtr={x:0,y:0};
    lastPtr.x=ptrCl.x; lastPtr.y=ptrCl.y;
    var pos=sprayPts.geometry.attributes.position.array,
        alp=sprayPts.geometry.attributes.aA.array,i,sd2;
    for(i=0;i<SPRAY_N;i++){
      sd2=sprayData[i];
      if(sd2.life>0){
        sd2.life-=dt*1.15;
        sd2.vy-=dt*26; sd2.vx*=(1-dt*1.6);
        sd2.x+=sd2.vx*dt*8; sd2.y+=sd2.vy*dt*8;
      }
      pos[i*3]=sd2.x; pos[i*3+1]=sd2.y; pos[i*3+2]=sd2.z;
      alp[i]=Math.max(0,sd2.life)*.9;
    }
    sprayPts.geometry.attributes.position.needsUpdate=true;
    sprayPts.geometry.attributes.aA.needsUpdate=true;
  }

  /* ---------- 布局与主循环 ---------- */
  function resizeScene(){
    isNarrowLayout=NARROW.matches;
    worldU=stageEl.getBoundingClientRect().width/(isNarrowLayout?760:1600);
    OFF_Y=isNarrowLayout?500:0;
    rootWorld.scale.setScalar(worldU);
    farGroup.visible=!isNarrowLayout;
    nearGroup.scale.setScalar(isNarrowLayout?1.28:1);
    nearGroup.position.y=isNarrowLayout?26:0;
    var hw=Math.max(2,hero.clientWidth),hh=Math.max(2,hero.clientHeight);
    camera.aspect=hw/hh;
    camera.updateProjectionMatrix();
    camera.position.set(0,0,hh*worldU/(2*Math.tan(camera.fov*Math.PI/360)));
    renderer.setSize(hw,hh,false);
    uni.uCam.value.copy(camera.position);
    /* 世界单位 → 设备像素（点尺寸换算用） */
    pxPerWorld=renderer.domElement.height/hh/worldU;
    motes.material.uniforms.uPx.value=pxPerWorld;
    sprayPts.material.uniforms.uPx.value=pxPerWorld;
  }
  window.__sceneResize=function(){ if(sceneBuilt)resizeScene(); };
  resizeScene();

  var staticDone=false;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      hero.classList.add('is-scene');
      readyDone||setReady();
      scanStartAt=performance.now()+1100;
    });
  });

  window.__sceneFrame=function(dt,nowMs){
    if(!REDUCED){
      uni.uTime.value+=dt;
      uni.uWind.value=Math.max(.35,.72+.28*Math.sin(uni.uTime.value*.27)+.12*Math.sin(uni.uTime.value*1.13));

      if(scanStartAt>0){
        var e=(nowMs-scanStartAt)/2600;
        if(e>=0&&e<=1){
          uni.uScanR.value=(1-Math.pow(1-e,1.35))*2700;
          uni.uScanOn.value=Math.sin(e*Math.PI)*.9;
        }else if(e>1){ uni.uScanOn.value=0; scanStartAt=-1; }
      }

      camera.position.x=-smoothP.x*24;
      camera.position.y=-smoothP.y*15;
    }else if(staticDone){ return; }

    camera.lookAt(camera.position.x*.42,camera.position.y*.42,0);
    uni.uCam.value.copy(camera.position);
    nearGroup.rotation.y=smoothP.x*.055;
    nearGroup.rotation.x=smoothP.y*.026;
    nearGroup.rotation.z=Math.sin(uni.uTime.value*.22)*.0022;
    farGroup.rotation.y=smoothP.x*.030;

    if(!REDUCED){
      updateButterflies(uni.uTime.value);
      updateSpray(dt,nowMs/1000);
    }

    renderer.render(scene,camera);
    staticDone=true;
  };

  window.addEventListener('resize',function(){
    setTimeout(function(){ if(sceneBuilt)resizeScene(); },180);
  });
};

})();
</script>
</body>
