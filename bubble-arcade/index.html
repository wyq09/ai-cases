<style>/* ============================================================
 * 泡泡堂 · BUBBLE ARCADE — 界面样式
 * PC 专用。深色街机厅氛围 + 泡泡糖撞色，纯 CSS 无外部资源。
 * ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: #070b14;
  color: #e9eefc;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
:root {
  --pink: #ff6fa5;
  --cyan: #5fd8ff;
  --lime: #a6f06a;
  --gold: #ffc94d;
  --violet: #a98bff;
  --ink: #0b1020;
  --panel: rgba(14, 20, 38, .86);
  --line: rgba(140, 175, 255, .18);
  --line2: rgba(140, 175, 255, .34);
  --dim: #8fa2c9;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

#app { position: fixed; inset: 0; overflow: hidden; }
#stage {
  position: absolute;
  left: 50%; top: 50%;
  width: 960px; height: 832px;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  border-radius: 18px;
  overflow: hidden;
  background: #0a0f1e;
  box-shadow: 0 40px 120px rgba(0,0,0,.72), 0 0 0 1px rgba(120,160,255,.14), 0 0 90px rgba(90,140,255,.10);
}
#game { display: block; width: 960px; height: 832px; image-rendering: auto; }
#overlay { position: absolute; inset: 0; pointer-events: none; }
#overlay canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------------- HUD ---------------- */
#hud {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 12px 16px; gap: 12px;
}
#scoreStrip { display: flex; gap: 8px; flex-wrap: wrap; max-width: 660px; }
.sc {
  --c: #5fd8ff;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px 6px 6px;
  background: rgba(8, 13, 26, .72);
  border: 1px solid rgba(120,160,255,.16);
  border-radius: 12px;
  backdrop-filter: blur(6px);
  transition: border-color .2s, background .2s, transform .2s;
  min-width: 118px;
}
.sc.dead { opacity: .46; filter: grayscale(.65); }
.sc.win { border-color: rgba(255,201,77,.65); background: rgba(60,44,10,.62); }
.sc.me { border-color: color-mix(in srgb, var(--c) 55%, transparent); }
.sc .av { width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,.07); flex: 0 0 auto; overflow: hidden; }
.sc .av img { width: 100%; height: 100%; display: block; }
.sc .nm { font-size: 12px; font-weight: 700; letter-spacing: .02em; line-height: 1.15; white-space: nowrap; }
.sc .st { display: flex; gap: 5px; margin-top: 3px; font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: .02em; }
.sc .st b { color: #dfe8ff; font-weight: 600; }
.sc .wins { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--c); margin-left: auto; padding-left: 6px; }
.sc .keys { font-family: var(--mono); font-size: 9px; color: var(--dim); opacity: .8; margin-top: 2px; letter-spacing: .04em; }

#topRight { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#timer {
  font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: .04em;
  padding: 4px 14px; border-radius: 12px;
  background: rgba(8,13,26,.74); border: 1px solid rgba(120,160,255,.18);
  color: #eef4ff; min-width: 104px; text-align: center;
}
#timer.warn { color: #ff8b8b; border-color: rgba(255,110,110,.5); animation: pulseWarn .8s ease-in-out infinite; }
#roundTag { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .12em; }
@keyframes pulseWarn { 0%,100% { opacity: 1 } 50% { opacity: .55 } }

#hints {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
  font-family: var(--mono); font-size: 11px; color: rgba(190,208,240,.62);
  background: rgba(8,13,26,.55); border: 1px solid rgba(120,160,255,.10);
  padding: 6px 14px; border-radius: 999px; pointer-events: none;
  max-width: 92%; white-space: nowrap;
}
#hints kbd {
  font-family: var(--mono); font-size: 10px; color: #cfe0ff;
  background: rgba(120,160,255,.13); border: 1px solid rgba(120,160,255,.24);
  border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; margin: 0 1px;
}
#hints .sep { opacity: .3; }
#fps { position: absolute; right: 14px; bottom: 12px; font-family: var(--mono); font-size: 11px; color: #7ee0a0; opacity: 0; transition: opacity .2s; }
#fps.on { opacity: .8; }

#countdown {
  position: absolute; left: 50%; top: 44%; transform: translate(-50%,-50%);
  font-family: var(--mono); font-weight: 900; font-size: 150px; line-height: 1;
  color: #fff; text-shadow: 0 8px 0 rgba(0,0,0,.35), 0 0 60px rgba(120,200,255,.75);
  opacity: 0; pointer-events: none;
}
#countdown.on { animation: cdPop .82s cubic-bezier(.2,.9,.25,1) both; }
@keyframes cdPop {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(1.9); }
  22% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  75% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(.86); }
}

#toast {
  position: absolute; left: 50%; bottom: 68px; transform: translate(-50%, 12px);
  padding: 9px 18px; border-radius: 10px;
  background: rgba(10,16,32,.92); border: 1px solid rgba(120,160,255,.28);
  font-size: 13px; color: #e8f0ff; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; white-space: nowrap; max-width: 90%;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------------- 屏幕层 ---------------- */
.screen {
  position: absolute; inset: 0; display: none;
  align-items: center; justify-content: center;
  background: radial-gradient(120% 90% at 50% 0%, rgba(30,46,92,.82) 0%, rgba(6,9,18,.94) 62%, rgba(4,6,13,.97) 100%);
  backdrop-filter: blur(3px);
  z-index: 30;
}
.screen.on { display: flex; }
.screen .card {
  width: min(780px, 88%); max-height: 94%; overflow: auto;
  padding: 28px 32px 26px;
  background: linear-gradient(180deg, rgba(20,28,52,.94), rgba(12,17,34,.97));
  border: 1px solid var(--line2); border-radius: 20px;
  box-shadow: 0 30px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
}
.screen .card.wide { width: min(900px, 92%); }
.screen::-webkit-scrollbar, .card::-webkit-scrollbar { width: 8px; }
.screen::-webkit-scrollbar-thumb, .card::-webkit-scrollbar-thumb { background: rgba(120,160,255,.22); border-radius: 8px; }

.title-logo { text-align: center; margin-bottom: 4px; }
.title-logo .cn {
  font-size: 58px; font-weight: 900; letter-spacing: .14em; line-height: 1;
  background: linear-gradient(180deg, #fff 0%, #9fe4ff 44%, #4fb4ff 62%, #2a6cff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 0 rgba(20,60,140,.55)) drop-shadow(0 0 30px rgba(90,190,255,.45));
}
.title-logo .en {
  font-family: var(--mono); font-size: 12px; letter-spacing: .5em; color: #7fb8ff;
  margin-top: 12px; text-indent: .5em;
}
.title-logo .sub { font-size: 12.5px; color: var(--dim); margin-top: 14px; letter-spacing: .04em; }

.bubbles-deco { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
.bubbles-deco i {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.85), rgba(120,200,255,.32) 40%, rgba(60,120,255,.05) 70%);
  border: 1px solid rgba(180,225,255,.28);
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(20px) scale(.9); opacity: 0; }
  12% { opacity: .55; }
  85% { opacity: .4; }
  100% { transform: translateY(-120px) scale(1.05); opacity: 0; }
}

.setrow { margin-top: 20px; }
.setgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 18px; }
.setgrid .setrow { margin-top: 14px; }
.setgrid .setrow:nth-child(5) { grid-column: 1 / -1; }
.setrow .lbl {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .22em; color: #7c9bd4;
  margin-bottom: 8px; text-transform: uppercase;
}
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  appearance: none; border: 1px solid rgba(120,160,255,.2);
  background: rgba(255,255,255,.035); color: #b9c9ea;
  font-family: inherit; font-size: 13px; font-weight: 600;
  padding: 9px 15px; border-radius: 11px; cursor: pointer;
  transition: all .16s; display: inline-flex; align-items: center; gap: 7px; line-height: 1.1;
}
.chip:hover { background: rgba(120,170,255,.13); color: #e6efff; border-color: rgba(120,170,255,.42); transform: translateY(-1px); }
.chip.on {
  background: linear-gradient(180deg, rgba(95,216,255,.24), rgba(70,130,255,.2));
  border-color: rgba(95,216,255,.72); color: #fff;
  box-shadow: 0 0 0 1px rgba(95,216,255,.22), 0 6px 22px rgba(40,120,255,.25);
}
.chip .k { font-family: var(--mono); font-size: 10px; color: var(--dim); }
.chip.on .k { color: #bfe9ff; }
.chip[disabled] { opacity: .35; cursor: not-allowed; transform: none; }
.chip.map { min-width: 100px; justify-content: center; flex-direction: column; gap: 3px; padding: 8px 11px; }
.chip.map .mn { font-size: 12.5px; }
.chip.map .mt { font-family: var(--mono); font-size: 9px; color: var(--dim); letter-spacing: .1em; }

.btnrow { display: flex; gap: 12px; margin-top: 22px; align-items: center; flex-wrap: wrap; }
.btn {
  appearance: none; border: none; cursor: pointer; font-family: inherit;
  font-size: 15px; font-weight: 800; letter-spacing: .06em;
  padding: 14px 30px; border-radius: 13px; color: #06121f;
  background: linear-gradient(180deg, #8ff0ff, #45b7ff 55%, #2f86ff);
  box-shadow: 0 6px 0 #1a4fb0, 0 14px 30px rgba(40,130,255,.35);
  transition: transform .12s, box-shadow .12s, filter .12s;
}
.btn:hover { filter: brightness(1.07); transform: translateY(-2px); box-shadow: 0 8px 0 #1a4fb0, 0 18px 36px rgba(40,130,255,.42); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1a4fb0, 0 8px 18px rgba(40,130,255,.3); }
.btn.ghost {
  background: rgba(255,255,255,.055); color: #c7d7f7;
  box-shadow: inset 0 0 0 1px rgba(120,160,255,.22); font-weight: 700;
  padding: 13px 22px;
}
.btn.ghost:hover { background: rgba(120,170,255,.14); color: #fff; box-shadow: inset 0 0 0 1px rgba(120,170,255,.44); transform: translateY(-1px); }
.btn.pink { background: linear-gradient(180deg, #ffb4d0, #ff6fa5 55%, #e8447f); color: #2a0416; box-shadow: 0 6px 0 #a31c4f, 0 14px 30px rgba(255,90,150,.32); }
.btn.pink:hover { box-shadow: 0 8px 0 #a31c4f, 0 18px 36px rgba(255,90,150,.4); }
.btn.pink:active { box-shadow: 0 2px 0 #a31c4f, 0 8px 18px rgba(255,90,150,.3); }
.btn.sm { font-size: 13px; padding: 10px 18px; border-radius: 10px; }

.keys-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 16px; }
.keys-box {
  padding: 14px 16px; border-radius: 13px;
  background: rgba(255,255,255,.035); border: 1px solid var(--line);
}
.keys-box h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .14em; font-family: var(--mono); color: #8fb2ec; font-weight: 600; }
.keys-box .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #c2d2ee; margin-bottom: 7px; }
.keys-box .row:last-child { margin-bottom: 0; }
.keys-box kbd, .kbd {
  font-family: var(--mono); font-size: 11px; color: #eaf3ff; background: rgba(120,160,255,.16);
  border: 1px solid rgba(120,160,255,.3); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px;
  min-width: 22px; text-align: center; display: inline-block;
}
.tips { font-size: 12.5px; line-height: 1.9; color: #a8b9d9; }
.tips b { color: #e9f2ff; font-weight: 700; }
.tips .hl { color: #7fe3ff; font-weight: 700; }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.stat {
  padding: 14px 16px; border-radius: 13px; background: rgba(255,255,255,.035);
  border: 1px solid var(--line);
}
.stat .v { font-family: var(--mono); font-size: 26px; font-weight: 700; color: #eaf4ff; line-height: 1.1; }
.stat .k { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--dim); margin-top: 6px; text-transform: uppercase; }

.round-title { text-align: center; font-size: 15px; letter-spacing: .3em; color: #8fb2ec; font-family: var(--mono); }
.round-big {
  text-align: center; font-size: 62px; font-weight: 900; letter-spacing: .06em; margin: 12px 0 6px;
  background: linear-gradient(180deg, #fff, #ffd76a 60%, #ff9d2f);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 rgba(120,60,0,.5));
}
.round-big.lose { background: linear-gradient(180deg, #fff, #b9c8e8 60%, #7b8db3); filter: drop-shadow(0 4px 0 rgba(30,40,70,.6)); }
.round-sub { text-align: center; font-size: 13.5px; color: #a9bade; letter-spacing: .04em; }
.round-standings { display: flex; gap: 10px; justify-content: center; margin: 22px 0 4px; flex-wrap: wrap; }
.stand {
  display: flex; align-items: center; gap: 9px; padding: 8px 13px 8px 8px; border-radius: 11px;
  background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 12.5px;
}
.stand img { width: 26px; height: 26px; border-radius: 7px; background: rgba(255,255,255,.07); }
.stand .pts { font-family: var(--mono); font-weight: 700; font-size: 13px; margin-left: 3px; }
.stand.out { opacity: .42; }

/* ---------------- 设置面板（settings 屏内复用 chips） ---------------- */
.settings-card .setrow { margin-top: 16px; }
.settings-card .setrow:first-of-type { margin-top: 10px; }
.slider-row { display: flex; align-items: center; gap: 14px; }
input[type=range] {
  -webkit-appearance: none; appearance: none; height: 6px; flex: 1;
  background: linear-gradient(90deg, #5fd8ff var(--p, 50%), rgba(120,160,255,.18) var(--p, 50%));
  border-radius: 6px; outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%;
  background: #eaf6ff; border: 2px solid #4aa8ff; box-shadow: 0 2px 8px rgba(0,0,0,.4); cursor: pointer;
}
input[type=range]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: #eaf6ff; border: 2px solid #4aa8ff; cursor: pointer; }
.slider-val { font-family: var(--mono); font-size: 12px; color: #cfe0ff; min-width: 46px; text-align: right; }
.toggle { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; color: #c2d2ee; }
.toggle i {
  width: 40px; height: 22px; border-radius: 999px; background: rgba(120,160,255,.16);
  position: relative; transition: background .18s; border: 1px solid rgba(120,160,255,.2);
}
.toggle i::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #cfe0ff; transition: transform .18s, background .18s;
}
.toggle.on i { background: rgba(95,216,255,.5); border-color: rgba(95,216,255,.7); }
.toggle.on i::after { transform: translateX(18px); background: #fff; }

/* ---------------- 桌面提示 ---------------- */
#desktopOnly { display: none; position: fixed; inset: 0; z-index: 999; place-items: center; background: #070b14; padding: 24px; }
#desktopOnly.on { display: grid; }
.do-card { max-width: 460px; text-align: center; }
.do-emoji { font-size: 54px; margin-bottom: 14px; }
.do-card h2 { font-size: 24px; margin: 0 0 12px; letter-spacing: .04em; }
.do-card p { font-size: 14px; line-height: 1.8; color: #a8b9d9; margin: 0 0 10px; }
.do-card .do-sub { font-family: var(--mono); font-size: 11.5px; color: #6f86b0; letter-spacing: .06em; }

/* ---------------- 矮屏（笔记本 720p/768p）紧凑排版 ---------------- */
@media (max-height: 1020px) {
  .title-logo .cn { font-size: 50px; }
  .screen .card { padding: 22px 26px 20px; }
  .setrow { margin-top: 13px; }
  .setrow .lbl { margin-bottom: 6px; }
  .chip { padding: 7px 12px; font-size: 12.5px; }
  .btnrow { margin-top: 16px; }
  .btn { padding: 11px 24px; font-size: 14px; }
  .btn.ghost { padding: 10px 18px; }
}
@media (max-height: 860px) {
  .screen .card { padding: 22px 26px 20px; }
  .title-logo .cn { font-size: 52px; }
  .title-logo .sub { margin-top: 10px; }
  .setrow { margin-top: 13px; }
  .setrow .lbl { margin-bottom: 6px; }
  .chip { padding: 7px 12px; font-size: 12.5px; }
  .chip.map { padding: 7px 10px; }
  .btnrow { margin-top: 16px; }
  .btn { padding: 11px 24px; font-size: 14px; }
  .btn.ghost { padding: 10px 18px; }
  .round-big { font-size: 48px; margin: 8px 0 4px; }
  .round-standings { margin: 14px 0 2px; }
  .stats-grid { gap: 8px; }
  .stat { padding: 10px 12px; }
  .stat .v { font-size: 21px; }
  .keys-grid { gap: 9px; }
  .keys-box { padding: 10px 13px; }
  .tips { font-size: 12px; line-height: 1.75; }
}
@media (max-height: 700px) {
  .title-logo .cn { font-size: 42px; }
  .title-logo .en { margin-top: 8px; font-size: 10px; }
  .setrow { margin-top: 10px; }
  .btnrow { margin-top: 12px; }
}
</style>

  function drawHair(x, ch, dir, headY, headR) {

      else if (dir === 'right') { rr(x, headR * .55, headY - 5 * S, headR * .95, 4.6 * S, 2.2 * S); x.fill(); }
      else { rr(x, -headR * 1.06, headY - 5.4 * S, headR * 2.12, 4.6 * S, 2.2 * S); x.fill(); }

  /* ================= 水柱（运行时绘制） ================= */
  // kind: 'center' | 'mid' | 'end'，axis: 'v'|'h'，dir: 端头朝向 -1/1
  function drawGeyser(x, px, py, size, kind, axis, dir, t, color) {
    var c1 = color || '#5fd8ff';
    var g;
    x.save();
    x.translate(px, py);
    var w = size, half = w / 2;
    var wave = Math.sin(t * 11) * 0.06 + 1;
    if (kind === 'center') {
      g = x.createRadialGradient(half, half, 1, half, half, half * 1.05);
      g.addColorStop(0, 'rgba(255,255,255,.96)');
      g.addColorStop(.34, 'rgba(200,245,255,.9)');
      g.addColorStop(.72, c1);
      g.addColorStop(1, 'rgba(120,200,255,.18)');
      x.fillStyle = g;
      x.beginPath(); x.arc(half, half, half * 0.98 * wave, 0, 7); x.fill();
      x.fillStyle = 'rgba(255,255,255,.92)';
      x.beginPath(); x.arc(half, half, half * .34, 0, 7); x.fill();
      // 水花
      x.strokeStyle = 'rgba(255,255,255,.8)'; x.lineWidth = size * .05;
      for (var i = 0; i < 3; i++) {
        var a = t * 4 + i * 2.1;
        x.beginPath();
        x.arc(half, half, half * (.6 + i * .11), a, a + 1.1); x.stroke();
      }
    } else {
      // 水流臂：中段 / 端头
      var thick = size * (kind === 'end' ? .86 : .78);
      var x0, y0, x1, y1;
      if (axis === 'v') {
        x0 = half - thick / 2; y0 = 0; x1 = thick; y1 = size;
        if (kind === 'end' && dir < 0) { y1 = size * .82; }
        if (kind === 'end' && dir > 0) { y0 = size * .18; y1 = size * .82; }
      } else {
        x0 = 0; y0 = half - thick / 2; x1 = size; y1 = thick;
        if (kind === 'end' && dir < 0) { x1 = size * .82; }
        if (kind === 'end' && dir > 0) { x0 = size * .18; x1 = size * .82; }
      }
      g = x.createLinearGradient(x0, y0, x0 + (axis === 'h' ? x1 : 0), y0 + (axis === 'v' ? y1 : 0));
      g.addColorStop(0, 'rgba(160,235,255,.92)');
      g.addColorStop(.45, 'rgba(255,255,255,.92)');
      g.addColorStop(1, 'rgba(140,220,255,.92)');
      x.fillStyle = g;
      rr(x, x0, y0, x1, y1, thick * .3); x.fill();
      // 流动条纹
      x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = size * .045;
      for (var k = 0; k < 3; k++) {
        var o = ((t * 1.6 + k / 3) % 1);
        if (axis === 'v') {
          var yy = y0 + (y1 - y0) * o;
          x.beginPath(); x.moveTo(x0 + x1 * .22, yy); x.lineTo(x0 + x1 * .78, yy); x.stroke();
        } else {
          var xx = x0 + (x1 - x0) * o;
          x.beginPath(); x.moveTo(xx, y0 + y1 * .22); x.lineTo(xx, y0 + y1 * .78); x.stroke();
        }
      }
      // 端头圆润
      if (kind === 'end') {
        var ex = axis === 'v' ? half : (dir < 0 ? x1 : x0);
        var ey = axis === 'v' ? (dir < 0 ? y1 : y0) : half;
        x.fillStyle = 'rgba(235,252,255,.95)';
        x.beginPath(); x.arc(ex, ey, thick * .5, 0, 7); x.fill();
        x.fillStyle = 'rgba(255,255,255,.7)';
        x.beginPath(); x.arc(ex, ey, thick * .26, 0, 7); x.fill();
      }
    }
    x.restore();
  }

  function init() {
    // 预热常用精灵，避免首帧卡顿
    Object.keys(THEMES).forEach(function (th) {

  /* ---------------- 玩家更新 ---------------- */

      // AI（节流：决策 ~26Hz，物理仍 120Hz）
      if (p.ai) {
        p.ai.acc = (p.ai.acc || 0) + dt;
        if (p.ai.acc >= 1 / 26) {
          var adt = p.ai.acc; p.ai.acc = 0;
          BA.AI.think(S, p, adt);
        }
      }

      // 输入方向
      var want = null;
      if (p.isHuman) {
        var st = dirStack[p.id] || [];
        for (var k = st.length - 1; k >= 0; k--) {
          if (keys[dirKeyCode(p, st[k])]) { want = st[k]; break; }
        }
        if (!want && st.length) want = st[st.length - 1];
      } else {
        want = p.wantDir;
      }

      var placed = false;
      // 放泡
      var bombWant = p.isHuman ? p.bombPressed : p.wantBomb;
      if (bombWant) {
        if (p.isHuman) p.bombPressed = false;
        if (placeBomb(p)) placed = true;
      }

      // 移动
      p.moving = false;
      if (want) {
        var v = DIR_VEC[want];
        if (v) {
          p.dir = want;
          var dist = p.speed * dt;
          if (tryMove(p, v[0], v[1], dist)) {
            p.moving = true;
            p.walkT += dt * (p.speed * 1.55);
          }
        }
      } else {
        // 空闲：向格中心对齐（微吸附）
        snapCenter(p, dt);
      }

      // 拾取道具
      var it = itemAt(Math.floor(p.x), Math.floor(p.y));
      if (it) pickItem(p, it);

      // 出界保护
      p.x = U.clamp(p.x, 0.3, W - 0.3);
      p.y = U.clamp(p.y, 0.3, H - 0.3);
    }
  }
  function dirKeyCode(p, dir) {
    return dir === 'up' ? p.keys.up : dir === 'down' ? p.keys.down : dir === 'left' ? p.keys.left : p.keys.right;
  }
  function snapCenter(p, dt) {
    var cx = Math.floor(p.x) + .5, cy = Math.floor(p.y) + .5;
    var k = Math.min(1, dt * 14);
    if (Math.abs(p.x - cx) < 0.42) p.x += (cx - p.x) * k;
    if (Math.abs(p.y - cy) < 0.42) p.y += (cy - p.y) * k;
  }

  var RADIUS = 0.30;
  var REPS = 1e-4;
  function solidAt(x, y) {
    if (!inb(x, y)) return true;
    return S.grid[y][x] !== 0;
  }
  // 玩家所站格（以中心判定）：站在自己泡泡上的那颗泡泡不阻挡，允许走开
  function bombBlocks(p, x, y) {
    var r = RADIUS - 0.02 - REPS;
    var x0 = Math.floor(x - r), x1 = Math.floor(x + r);
    var y0 = Math.floor(y - r), y1 = Math.floor(y + r);
    var ptx = p ? Math.floor(p.x) : -99, pty = p ? Math.floor(p.y) : -99;
    for (var i = 0; i < S.bombs.length; i++) {
      var b = S.bombs[i];
      if (b.moving) continue;
      if (b.tx === ptx && b.ty === pty) continue;   // 中心在脚下
      if (b.ownerInside && b.owner === p) continue;  // 放泡者尚未完全离开
      for (var yy = y0; yy <= y1; yy++) {
        for (var xx = x0; xx <= x1; xx++) {
          if (b.tx === xx && b.ty === yy) return b;
        }
      }
    }
    return null;
  }
  function canStand(p, x, y) {
    var r = RADIUS - 0.02 - REPS;
    var x0 = Math.floor(x - r), x1 = Math.floor(x + r);
    var y0 = Math.floor(y - r), y1 = Math.floor(y + r);
    for (var yy = y0; yy <= y1; yy++) {
      for (var xx = x0; xx <= x1; xx++) {
        if (solidAt(xx, yy)) return false;
      }
    }
    if (bombBlocks(p, x, y)) return false;
    return true;
  }

  function tryMove(p, dx, dy, dist) {
    // 车道锁定：横向移动前先把 y 对齐到最近的行中心，纵向同理。
    // 这样玩家永远不会停在两行之间（否则会被相邻行的箱子卡死）。
    if (dx !== 0) {
      var laneY = Math.round(p.y - 0.5) + 0.5;
      var offY = laneY - p.y;
      if (Math.abs(offY) > 0.004) {
        var stepY = Math.sign(offY) * Math.min(Math.abs(offY), dist * 1.35);
        if (canStand(p, p.x, p.y + stepY)) { p.y += stepY; return true; }
        return false;
      }
      p.y = laneY;
    } else if (dy !== 0) {
      var laneX = Math.round(p.x - 0.5) + 0.5;
      var offX = laneX - p.x;
      if (Math.abs(offX) > 0.004) {
        var stepX = Math.sign(offX) * Math.min(Math.abs(offX), dist * 1.35);
        if (canStand(p, p.x + stepX, p.y)) { p.x += stepX; return true; }
        return false;
      }
      p.x = laneX;
    }

    var nx = p.x + dx * dist, ny = p.y + dy * dist;
    if (canStand(p, nx, ny)) { p.x = nx; p.y = ny; return true; }

    // 踢泡泡
    if (p.kick) {
      var ahead = bombBlocks(p, nx, ny);
      if (ahead && !ahead.moving && !ahead.exploded) {
        var ax = ahead.tx + .5 - p.x, ay = ahead.ty + .5 - p.y;
        if (dx !== 0 && Math.abs(ay) < 0.42 && Math.sign(ax) === Math.sign(dx)) {
          kickBomb(ahead, dx, 0); return false;
        }
        if (dy !== 0 && Math.abs(ax) < 0.42 && Math.sign(ay) === Math.sign(dy)) {
          kickBomb(ahead, 0, dy); return false;
        }
      }
    }

    // 转角辅助：横向被挡时，若偏移很小可沿纵向微调对齐
    if (dx !== 0) {
      var cy = Math.floor(p.y) + .5;
      var diff = cy - p.y;
      if (Math.abs(diff) > 0.008) {
        var nudge = Math.sign(diff) * Math.min(Math.abs(diff), dist * 1.4);
        if (canStand(p, p.x, p.y + nudge) && canStand(p, nx, p.y + nudge)) {
          p.y += nudge;
          p.x = nx;
          return true;
        }
      }
    } else if (dy !== 0) {
      var cx = Math.floor(p.x) + .5;
      var diff2 = cx - p.x;
      if (Math.abs(diff2) > 0.008) {
        var nudge2 = Math.sign(diff2) * Math.min(Math.abs(diff2), dist * 1.4);
        if (canStand(p, p.x + nudge2, p.y) && canStand(p, p.x + nudge2, ny)) {
          p.x += nudge2;
          p.y = ny;
          return true;
        }
      }
    }
    return false;
  }

  /* ---------------- 泡泡 ---------------- */
  function placeBomb(p) {
    if (p.activeBombs >= p.maxBombs) return false;
    var tx = Math.floor(p.x), ty = Math.floor(p.y);
    if (bombAt(tx, ty)) return false;
    if (solidAt(tx, ty)) return false;
    var cfg = CFG.get();
    var b = {
      tx: tx, ty: ty,
      x: tx + .5, y: ty + .5,
      power: p.power,
      fuse: Math.max(0.5, cfg.fuse || P.FUSE),
      maxFuse: Math.max(0.5, cfg.fuse || P.FUSE),
      owner: p,
      exploded: false,
      moving: false,
      dir: null,
      t: 0,
      ownerInside: !!p
    };
    S.bombs.push(b);
    p.activeBombs++;
    S.stats.bombs++;
    A().play('place');
    F().ring(p.x * T, p.y * T, '#bfefff', { r0: 6, r1: 46, ttl: 0.32, lw: 4 });
    return true;
  }

  function kickBomb(b, dx, dy) {
    b.moving = true;
    b.kdx = dx; b.kdy = dy;
    b.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up';
    A().play('kick');
    F().dust(b.x * T, b.y * T, 6);
  }

  function updateBombs(dt) {
    for (var i = S.bombs.length - 1; i >= 0; i--) {
      var b = S.bombs[i];
      b.t += dt;
      if (b.moving) {
        var tx = b.tx + .5, ty = b.ty + .5;
        var dx = tx - b.x, dy = ty - b.y;
        var d = Math.hypot(dx, dy);
        var stepLen = P.KICK_SPEED * dt;
        if (d <= stepLen) {
          b.x = tx; b.y = ty;
          // 下一格
          var nx = b.tx + b.kdx, ny = b.ty + b.kdy;
          if (solidAt(nx, ny) || bombAt(nx, ny) || !inb(nx, ny)) {
            b.moving = false;
            A().play('bump');
          } else {
            b.tx = nx; b.ty = ny;
          }
        } else {
          b.x += dx / d * stepLen;
          b.y += dy / d * stepLen;
        }
        // 撞人 → 困住
        for (var j = 0; j < S.players.length; j++) {
          var p = S.players[j];
          if (!p.alive || p.trapped) continue;
          var ddx = p.x - b.x, ddy = p.y - b.y;
          if (ddx * ddx + ddy * ddy < 0.42 * 0.42) {
            b.moving = false;
            if (p.invuln <= 0 && !p.shield) trapPlayer(p);
            else if (p.shield) { p.shield = false; p.invuln = 1.2; A().play('shield'); }
          }
        }
      }
      if (b.ownerInside && b.owner) {
        var ow = b.owner;
        var rr2 = RADIUS - 0.02 - REPS;
        var overlap = (ow.x + rr2 > b.tx) && (ow.x - rr2 < b.tx + 1) &&
                      (ow.y + rr2 > b.ty) && (ow.y - rr2 < b.ty + 1);
        if (!overlap) b.ownerInside = false;
      }
      b.fuse -= dt;
      if (b.fuse <= 0 && !b.exploded) {
        explodeBomb(b);
      }
    }
  }

  function explodeBomb(b) {
    b.exploded = true;
    var idx = S.bombs.indexOf(b);
    if (idx >= 0) S.bombs.splice(idx, 1);
    if (b.owner) b.owner.activeBombs = Math.max(0, b.owner.activeBombs - 1);

    var cells = [{ x: b.tx, y: b.ty, kind: 'center', axis: null, dir: 0 }];
    for (var di = 0; di < 4; di++) {
      var dx = DIRS[di][0], dy = DIRS[di][1];
      var axis = dx !== 0 ? 'h' : 'v';
      var arm = [];
      for (var r = 1; r <= b.power; r++) {
        var nx = b.tx + dx * r, ny = b.ty + dy * r;
        if (!inb(nx, ny)) break;
        var cell = S.grid[ny][nx];
        if (cell === 1) break;
        if (cell === 2) {
          arm.push({ x: nx, y: ny, kind: 'end', axis: axis, dir: dx || dy });
          break;
        }
        arm.push({ x: nx, y: ny, kind: r === b.power ? 'end' : 'mid', axis: axis, dir: dx || dy });
        var other = bombAt(nx, ny);
        if (other && !other.exploded) {
          other.fuse = Math.min(other.fuse, 0.09);
          break;
        }
      }
      if (arm.length) arm[arm.length - 1].kind = 'end';
      for (var a = 0; a < arm.length; a++) cells.push(arm[a]);
    }

    // 生成水柱
    var brokeHere = {};
    for (var c = 0; c < cells.length; c++) {
      var cl = cells[c];
      S.geysers.push({
        x: cl.x, y: cl.y, kind: cl.kind, axis: cl.axis, dir: cl.dir,
        t: 0, ttl: P.SPLASH, power: b.power
      });
      // 摧毁箱子（箱子吸收水柱，刚掉出的道具不会被同一次爆炸冲毁）
      if (S.grid[cl.y][cl.x] === 2) {
        brokeHere[cl.x + ',' + cl.y] = true;
        destroyBox(cl.x, cl.y);
      }
      // 冲毁地上已有道具
      if (!brokeHere[cl.x + ',' + cl.y]) {
        var it = itemAt(cl.x, cl.y);
        if (it) removeItem(it, false);
      }
    }

    // 伤害
    var hitSet = {};
    for (var c2 = 0; c2 < cells.length; c2++) {
      var cc = cells[c2];
      for (var pi = 0; pi < S.players.length; pi++) {
        var p = S.players[pi];
        if (!p.alive) continue;
        var ptx = Math.floor(p.x), pty = Math.floor(p.y);
        if (ptx === cc.x && pty === cc.y) {
          if (hitSet[p.id]) continue;
          hitSet[p.id] = true;
          hitPlayer(p);
        }
      }
    }

    A().play('pop', { pitch: 0.9 + Math.random() * 0.25 });
    F().splash(b.x * T, b.y * T, 22, { color: '#9fe8ff' });
    F().ring(b.x * T, b.y * T, '#ffffff', { r0: 16, r1: T * 1.5, ttl: 0.36, lw: 7 });
    F().shake(4.5);
    if (BA.UI) BA.UI.danger();
  }

  function destroyBox(x, y) {
    S.grid[y][x] = 0;
    S.stats.blocks++;
    A().play('box');
    F().burst(x * T + T / 2, y * T + T / 2, '#e0b070', 16, { speed: 210, grav: 480 });
    F().dust(x * T + T / 2, y * T + T / 2, 8);
    var cfg = CFG.get();
    if (Math.random() < (cfg.itemChance == null ? 0.3 : cfg.itemChance)) {
      var r = Math.random();
      var type = r < 0.34 ? 'bomb' : r < 0.6 ? 'power' : r < 0.82 ? 'speed' : r < 0.92 ? 'kick' : 'shield';
      S.items.push({ x: x, y: y, type: type, t: 0, ttl: P.ITEM_TTL, spawnT: 0 });
    }
  }

  function updateGeysers(dt) {
    for (var i = S.geysers.length - 1; i >= 0; i--) {
      var g = S.geysers[i];
      g.t += dt;
      if (g.t >= g.ttl) S.geysers.splice(i, 1);
    }
  }

  function updateItems(dt) {
    for (var i = S.items.length - 1; i >= 0; i--) {
      var it = S.items[i];
      it.t += dt;
      it.spawnT = Math.min(1, (it.spawnT || 0) + dt * 4);
      if (it.t >= it.ttl) { removeItem(it, true); }
    }
  }
  function removeItem(it, silent) {
    var i = S.items.indexOf(it);
    if (i >= 0) S.items.splice(i, 1);
    if (!silent) F().burst(it.x * T + T / 2, it.y * T + T / 2, BA.ART.ITEM_META[it.type].color, 8);
  }

  function pickItem(p, it) {
    var i = S.items.indexOf(it);
    if (i < 0) return;
    S.items.splice(i, 1);
    var type = it.type;
    if (type === 'bomb') p.maxBombs = Math.min(P.BOMB_MAX, p.maxBombs + 1);
    else if (type === 'power') p.power = Math.min(P.POWER_MAX, p.power + 1);
    else if (type === 'speed') p.speed = Math.min(P.SPEED_MAX, p.speed + 0.42);
    else if (type === 'kick') p.kick = true;
    else if (type === 'shield') p.shield = true;
    S.stats.items++;
    A().play('item');
    var meta = BA.ART.ITEM_META[type];
    F().burst(it.x * T + T / 2, it.y * T + T / 2, meta.color, 16, { speed: 190 });
    F().text(p.x * T, p.y * T - 30, meta.label, meta.color);
    if (BA.UI) BA.UI.hud(S);
  }

  /* ---------------- 伤害 / 困泡 / 死亡 ---------------- */
  function hitPlayer(p) {
    if (!p.alive || p.invuln > 0) return;
    if (p.trapped) { killPlayer(p, 'water'); return; }
    if (p.shield) {
      p.shield = false;
      p.invuln = 1.3;
      A().play('shield');
      F().ring(p.x * T, p.y * T, '#c9b6ff', { r0: 20, r1: 70, ttl: 0.5, lw: 6 });
      F().text(p.x * T, p.y * T - 34, '护盾抵挡', '#c9b6ff');
      return;
    }
    trapPlayer(p);
  }

  function trapPlayer(p) {
    if (!p.alive || p.trapped) return;
    p.trapped = true;
    p.trapT = P.TRAP_TIME;
    p.trapPress = 0;
    p.trapRescued = false;
    p.dir = 'down';
    S.stats.traps++;
    A().play('trap');
    F().ring(p.x * T, p.y * T, '#8fe6ff', { r0: 26, r1: 58, ttl: 0.45, lw: 5 });
    F().text(p.x * T, p.y * T - 36, '被困！', '#9fe8ff');
    if (BA.UI) BA.UI.hud(S);
  }

  function rescuePlayer(p, how, by) {
    if (!p.trapped) return;
    p.trapped = false;
    p.trapT = 0;
    p.invuln = 1.0;
    p.trapRescued = true;
    S.stats.rescues++;
    SAVE.bump('rescues');
    A().play('rescue');
    F().burst(p.x * T, p.y * T, '#a6f06a', 20, { speed: 200 });
    F().text(p.x * T, p.y * T - 34, how === 'team' ? '队友救援！' : '挣脱！', '#a6f06a');
    if (BA.UI) BA.UI.hud(S);
  }

  function killPlayer(p, cause) {
    if (!p.alive) return;
    p.alive = false;
    p.trapped = false;
    p.deathT = 0;
    S.stats.kills++;
    A().play('death');
    F().splash(p.x * T, p.y * T, 30, { color: '#bfefff' });
    F().burst(p.x * T, p.y * T, p.color, 26, { speed: 260 });
    F().text(p.x * T, p.y * T - 34, cause === 'water' ? '爆泡淘汰' : '泡泡破了', '#ff9db4');
    F().shake(7);
    if (BA.UI) BA.UI.hud(S);
  }

  function checkRoundEnd() {
    if (S.phase !== 'play') return;
    var alive = S.players.filter(function (p) { return p.alive; });
    if (S.mode === 'team') {
      var teams = {};
      alive.forEach(function (p) { teams[p.team] = true; });
      var tkeys = Object.keys(teams);
      if (tkeys.length <= 1) {
        var winner = null;
        if (tkeys.length === 1) {
          var t = +tkeys[0];
          winner = S.players.filter(function (p) { return p.team === t && p.alive; })[0] ||
                   S.players.filter(function (p) { return p.team === t; })[0];
        }
        endRound(winner);
      }
    } else {
      if (alive.length <= 1) endRound(alive[0] || null);
    }
  }

  /* ---------------- 死亡模式 ---------------- */
  function updateSuddenDeath(dt) {
    var cfg = CFG.get();
    if (!cfg.suddenDeath) return;
    if (!S.sudden && S.time >= (cfg.roundTime || 150)) {
      S.sudden = true;
      A().play('sudden');
      F().shake(6);
      if (BA.UI) BA.UI.toast('⚠ 死亡模式：随机落泡');
      return;
    }
    if (!S.sudden) return;
    S.suddenT -= dt;
    if (S.suddenT <= 0) {
      S.suddenT = 1.35;
      // 随机找一个空地落泡
      var cands = [];
      for (var y = 1; y < H - 1; y++) {
        for (var x = 1; x < W - 1; x++) {
          if (S.grid[y][x] === 0 && !bombAt(x, y) && !itemAt(x, y)) cands.push([x, y]);
        }
      }
      if (cands.length) {
        var c = cands[Math.floor(Math.random() * cands.length)];
        var b = {
          tx: c[0], ty: c[1], x: c[0] + .5, y: c[1] + .5,
          power: 2, fuse: 1.25, maxFuse: 1.25, owner: null,
          exploded: false, moving: false, dir: null, t: 0
        };
        S.bombs.push(b);
        F().ring(c[0] * T + T / 2, c[1] * T + T / 2, '#ff8b8b', { r0: 6, r1: 40, ttl: 0.4, lw: 3 });
        A().play('place');
      }
    }
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    if (!ctx) return;
    var c = ctx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, P.BOARD_W, P.BOARD_H);
    if (!S.map || !staticLayer) {
      c.fillStyle = '#0a0f1e';
      c.fillRect(0, 0, P.BOARD_W, P.BOARD_H);
      return;
    }
    c.drawImage(staticLayer, 0, 0, P.BOARD_W, P.BOARD_H);

    // 箱子
    var th = S.map.theme;
    for (var y = 0; y < H; y++) {
      for (var x = 0; x < W; x++) {
        if (S.grid[y][x] === 2) {
          var spr = BA.ART.tile(2, th, (x * 7 + y * 13) % 2);
          c.drawImage(spr, x * T, y * T, T, T);
        }
      }
    }

    // 道具
    for (var i = 0; i < S.items.length; i++) {
      var it = S.items[i];
      var age = it.t;
      var blink = it.ttl - age < 4 ? (Math.sin(age * 16) > -0.1 ? 1 : 0.22) : 1;
      var pop = it.spawnT < 1 ? U.smooth(it.spawnT) : 1;
      var bob = Math.sin(age * 3.1) * 3;
      c.save();
      c.globalAlpha = blink;
      c.translate(it.x * T + T / 2, it.y * T + T / 2 + bob);
      c.scale(pop, pop);
      c.drawImage(BA.ART.item(it.type), -T / 2, -T / 2, T, T);
      c.restore();
    }

    // 泡泡
    for (var bi = 0; bi < S.bombs.length; bi++) {
      var b = S.bombs[bi];
      var frac = 1 - b.fuse / b.maxFuse;
      var frame = Math.floor((b.t * 7 + bi * 2) % 8);
      var sprB = BA.ART.bubble(frame);
      var scale = 1 + Math.sin(b.t * 10) * 0.02;
      if (b.fuse < 0.5) scale *= 1 + (0.5 - b.fuse) * 0.32;
      c.save();
      c.translate(b.x * T, b.y * T);
      c.scale(scale, scale);
      c.drawImage(sprB, -T / 2, -T / 2, T, T);
      c.restore();
      // 引信环
      if (b.fuse < b.maxFuse * 0.72) {
        var ang = -Math.PI / 2 + Math.PI * 2 * frac;
        c.save();
        c.translate(b.x * T, b.y * T);
        c.strokeStyle = b.fuse < 0.7 ? 'rgba(255,120,120,.95)' : 'rgba(255,220,120,.8)';
        c.lineWidth = 4;
        c.lineCap = 'round';
        c.beginPath();
        c.arc(0, 0, T * 0.43, -Math.PI / 2, ang);
        c.stroke();
        c.restore();
      }
      // 踢出速度线
      if (b.moving) {
        c.save();
        c.globalAlpha = 0.5;
        c.strokeStyle = '#bfefff'; c.lineWidth = 3;
        var vx = -b.kdx, vy = -b.kdy;
        for (var s = 1; s <= 3; s++) {
          c.beginPath();
          c.moveTo(b.x * T + vx * s * 7, b.y * T + vy * s * 7);
          c.lineTo(b.x * T + vx * s * 7 + (vy ? 14 : 0), b.y * T + vy * s * 7 + (vx ? 14 : 0));
          c.stroke();
        }
        c.restore();
      }
    }

    // 水柱
    for (var gi = 0; gi < S.geysers.length; gi++) {
      var g = S.geysers[gi];
      var k = g.t / g.ttl;
      var sc = k < 0.18 ? U.smooth(k / 0.18) : (1 - Math.max(0, (k - 0.55) / 0.45) * 0.55);
      c.save();
      c.translate(g.x * T + T / 2, g.y * T + T / 2);
      c.scale(sc, sc);
      c.globalAlpha = k > 0.72 ? 1 - (k - 0.72) / 0.28 : 1;
      BA.ART.drawGeyser(c, -T / 2, -T / 2, T, g.kind, g.axis, g.dir, g.t, S.map.theme === 'candy' ? '#8fd8ff' : '#5fd8ff');
      c.restore();
    }

    // 玩家（按 y 排序）
    var list = S.players.slice().sort(function (a, b) { return a.y - b.y; });
    for (var pi = 0; pi < list.length; pi++) {
      drawPlayer(c, list[pi]);
    }

    // 死亡模式红边
    if (S.sudden) {
      var pulse = 0.18 + Math.sin(performance.now() / 260) * 0.07;
      var vg = c.createRadialGradient(P.BOARD_W / 2, P.BOARD_H / 2, P.BOARD_H * 0.34, P.BOARD_W / 2, P.BOARD_H / 2, P.BOARD_H * 0.78);
      vg.addColorStop(0, 'rgba(255,60,60,0)');
      vg.addColorStop(1, 'rgba(255,40,60,' + pulse.toFixed(3) + ')');
      c.fillStyle = vg;
      c.fillRect(0, 0, P.BOARD_W, P.BOARD_H);
    }
  }

  function drawPlayer(c, p) {
    if (!p.alive) return;
    var px = p.x * T, py = p.y * T;
    // 地面色环
    c.save();
    c.globalAlpha = 0.5;
    c.fillStyle = p.color;
    c.beginPath();
    c.ellipse(px, py + T * 0.30, T * 0.30, T * 0.11, 0, 0, 7);
    c.fill();
    c.restore();

    if (p.trapped) {
      var tf = Math.floor(p.walkT * 2) % 2;
      var tspr = BA.ART.trapped(p.theme, tf);
      c.save();
      c.translate(px, py - T * 0.06);
      var wob = Math.sin(p.walkT * 3) * 0.02;
      c.rotate(wob);
      c.drawImage(tspr, -T / 2, -T / 2, T, T);
      c.restore();
      // 计时环
      var frac = 1 - p.trapT / P.TRAP_TIME;
      c.save();
      c.translate(px, py - T * 0.06);
      c.strokeStyle = 'rgba(255,255,255,.28)';
      c.lineWidth = 4;
      c.beginPath(); c.arc(0, 0, T * 0.46, 0, 7); c.stroke();
      c.strokeStyle = p.trapT < 1.1 ? '#ff6b8a' : '#9fe8ff';
      c.lineCap = 'round';
      c.beginPath();
      c.arc(0, 0, T * 0.46, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
      c.stroke();
      c.restore();
      // 自救进度
      if (p.trapPress > 0) {
        c.save();
        c.fillStyle = 'rgba(8,14,28,.7)';
        c.fillRect(px - 22, py + T * 0.34, 44, 6);
        c.fillStyle = '#9fe8ff';
        c.fillRect(px - 22, py + T * 0.34, 44 * Math.min(1, p.trapPress / P.TRAP_SELF_RESCUE), 6);
        c.restore();
      }
      return;
    }

    var frame = p.moving ? Math.floor(p.walkT) % 4 : 0;
    var spr = BA.ART.player(p.theme, p.dir, frame);
    c.save();
    c.translate(px, py - T * 0.06);
    if (p.invuln > 0 && Math.floor(p.invuln * 12) % 2 === 0) c.globalAlpha = 0.45;
    if (p.moving) {
      var sq = 1 + Math.sin(p.walkT * 3.4) * 0.018;
      c.scale(1 / sq, sq);
    }
    c.drawImage(spr, -T / 2, -T / 2, T, T);
    c.restore();

    // 护盾
    if (p.shield) {
      c.save();
      c.globalAlpha = 0.55 + Math.sin(performance.now() / 220) * 0.16;
      c.strokeStyle = '#c9b6ff';
      c.lineWidth = 3;
      c.beginPath();
      c.arc(px, py - T * 0.06, T * 0.44, 0, 7);
      c.stroke();
      c.globalAlpha = 0.16;
      c.fillStyle = '#a98bff';
      c.fill();
      c.restore();
    }

    // 人类玩家标签
    if (p.isHuman) {
      c.save();
      c.font = '700 11px ui-monospace, monospace';
      c.textAlign = 'center';
      c.fillStyle = 'rgba(6,12,24,.62)';
      var label = p.id === 'p1' ? 'P1' : 'P2';
      var tw = c.measureText(label).width + 10;
      c.beginPath();
      if (c.roundRect) c.roundRect(px - tw / 2, py - T * 0.72, tw, 16, 5);
      else c.rect(px - tw / 2, py - T * 0.72, tw, 16);
      c.fill();
      c.fillStyle = p.color;
      c.fillText(label, px, py - T * 0.72 + 12);
      c.restore();
    }
  }

  /* ---------------- 控制 ---------------- */
  function pause() {
    if (S.phase !== 'play' && S.phase !== 'countdown') return;
    if (S.paused) return;
    S.paused = true;
    A().play('click');
    if (BA.UI) BA.UI.show('pause');
  }
  function resume() {
    if (!S.paused) return;
    S.paused = false;
    A().play('click');
    if (BA.UI) BA.UI.show(null);
  }
  function quit() {
    S.phase = 'idle';
    S.paused = false;
    S.players = [];
    S.bombs = []; S.items = []; S.geysers = [];
    if (BA.FX) BA.FX.clear();
    if (BA.UI) BA.UI.show('title');
  }

  /* ---------------- 测试钩子 ---------------- */
  function expose() {
    window.__ba = {
      get state() { return S; },
      get phase() { return S.phase; },
      get players() { return S.players; },
      get board() { return S.grid; },
      get cfg() { return CFG.get(); },
      get fps() { return Math.round(fps); },
      get errors() { return (window.__errs || []).slice(); },
      start: function (opts) { startMatch(opts || {}); },
      quit: quit,
      pause: pause,
      resume: resume,
      nextRound: nextRound,
      fastForward: function (sec) {
        var n = Math.ceil(sec * 120);
        for (var i = 0; i < n; i++) step(1 / 120);
        render();
        return S.phase;
      },
      setSpeed: function (x) { S.speedMul = x; },
      setBotOnly: function (b) { S.botOnly = !!b; },
      give: function (id, type, n) {
        var p = S.players.filter(function (q) { return q.id === id; })[0];
        if (!p) return false;
        n = n || 1;
        for (var i = 0; i < n; i++) {
          if (type === 'bomb') p.maxBombs = Math.min(P.BOMB_MAX, p.maxBombs + 1);
          else if (type === 'power') p.power = Math.min(P.POWER_MAX, p.power + 1);
          else if (type === 'speed') p.speed = Math.min(P.SPEED_MAX, p.speed + 0.42);
          else if (type === 'kick') p.kick = true;
          else if (type === 'shield') p.shield = true;
        }
        if (BA.UI) BA.UI.hud(S);
        return true;
      },
      teleport: function (id, tx, ty) {
        var p = S.players.filter(function (q) { return q.id === id; })[0];
        if (!p) return false;
        p.x = tx + .5; p.y = ty + .5;
        return true;
      },
      placeBomb: function (id) {
        var p = S.players.filter(function (q) { return q.id === id; })[0];
        return p ? placeBomb(p) : false;
      },
      trap: function (id) {
        var p = S.players.filter(function (q) { return q.id === id; })[0];
        if (p) trapPlayer(p);
        return !!p;
      },
      forceEnd: function (id) {
        var p = S.players.filter(function (q) { return q.id === id; })[0];
        if (p) killPlayer(p, 'water');
        return !!p;
      },
      winNow: function (id) {
        S.players.forEach(function (p) { if (p.id !== id) killPlayer(p, 'water'); });
        checkRoundEnd();
        return S.phase;
      },
      seed: function (n) { S.seed = n >>> 0; },
      setFuse: function (v) { CFG.patch({ fuse: v }); },
      dropItems: function (n) {
        for (var i = 0; i < n; i++) {
          var x = 1 + Math.floor(Math.random() * (W - 2));
          var y = 1 + Math.floor(Math.random() * (H - 2));
          if (S.grid[y][x] !== 0) continue;
          var types = BA.ART.ITEM_TYPES;
          S.items.push({ x: x, y: y, type: types[i % types.length], t: 0, ttl: P.ITEM_TTL, spawnT: 1 });
        }
      },
      bombCount: function () { return S.bombs.length; },
      geyserCount: function () { return S.geysers.length; },
      render: render
    };
  }

  BA.GAME = {
    init: init,
    startMatch: startMatch,
    startRound: startRound,
    nextRound: nextRound,
    pause: pause,
    resume: resume,
    quit: quit,
    render: render,
    expose: expose,
    setBotOnly: function (b) { S.botOnly = !!b; },
    get S() { return S; },
    get fps() { return fps; },
    get frameCount() { return frameCount; }
  };
  expose();
})(window);

      .forEach(function (id) { screens[id] = $(id); });

  }

  /* ---------------- 屏幕切换 ---------------- */
  function show(name) {
    Object.keys(screens).forEach(function (k) {
      if (screens[k]) screens[k].classList.toggle('on', k === 'screen' + cap(name));
    });
    cur = name || null;
    if (!name) {
      Object.keys(screens).forEach(function (k) { screens[k].classList.remove('on'); });
    }
    if (name === 'title') BA.AUDIO.bgm(true);
    else if (name === 'match' || name === 'stats' || name === 'help' || name === 'settings') BA.AUDIO.bgm(true);

  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

  function renderChips(root) {
    var cfg = CFG.get();
    var groups = {
      mode: [
        { v: 'ffa', t: '混战', k: 'FFA' },
        { v: 'team', t: '2 v 2', k: 'TEAM' }
      ],
      humans: [
        { v: '1', t: '单人', k: '1P' },
        { v: '2', t: '双人', k: '2P' }
      ],
      players: [
        { v: '2', t: '2 人' }, { v: '3', t: '3 人' }, { v: '4', t: '4 人' }
      ],
      diff: [
        { v: 'easy', t: '简单' }, { v: 'normal', t: '普通' }, { v: 'hard', t: '困难' }
      ],
      wins: [
        { v: '1', t: '1 胜' }, { v: '2', t: '2 胜' }, { v: '3', t: '3 胜' }, { v: '5', t: '5 胜' }
      ]
    };
    Object.keys(groups).forEach(function (g) {
      var box = root.querySelector('[data-group="' + g + '"]');
      if (!box) return;
      box.innerHTML = '';
      var val = String(cfg['last' + cap(g)] != null ? cfg['last' + cap(g)] : (g === 'wins' ? cfg.winsNeeded : ''));
      if (g === 'wins') val = String(cfg.winsNeeded);
      if (g === 'map') {
        BA.MAPS.LIST.forEach(function (m) {
          var c = mk('button', 'chip map' + (val === m.id ? ' on' : ''));
          c.dataset.v = m.id;
          c.innerHTML = '<span class="mn">' + U.esc(m.name) + '</span><span class="mt">' + U.esc(m.tag) + '</span>';
          box.appendChild(c);
        });
        return;
      }
      groups[g].forEach(function (o) {
        var c = mk('button', 'chip' + (val === o.v ? ' on' : ''));
        c.dataset.v = o.v;
        c.innerHTML = U.esc(o.t) + (o.k ? ' <span class="k">' + o.k + '</span>' : '');
        box.appendChild(c);
      });
    });
    // 地图
    var mapBox = root.querySelector('[data-group="map"]');

  function onPick(g, v) {
    BA.AUDIO.play('click');
    var cfg = CFG.get();
    var patch = {};
    if (g === 'mode') patch.lastMode = v;
    else if (g === 'humans') patch.lastHumans = +v;
    else if (g === 'players') patch.lastPlayers = +v;
    else if (g === 'diff') patch.lastDiff = v;
    else if (g === 'map') patch.lastMap = v;
    else if (g === 'wins') patch.winsNeeded = +v;
    CFG.patch(patch);
    if (g === 'mode' && v === 'team') {
      CFG.patch({ lastPlayers: 4 });
    }
    renderChips(screens.screenTitle);
  }

  function onAct(act) {
    BA.AUDIO.play('click');
    var cfg = CFG.get();
    if (act === 'start') {
      BA.AUDIO.unlock();
      BA.AUDIO.bgm(true);
      BA.GAME.startMatch({
        mode: cfg.lastMode || 'ffa',
        humans: +cfg.lastHumans || 1,
        players: +cfg.lastPlayers || 4,
        diff: cfg.lastDiff || 'normal',
        map: cfg.lastMap || 'garden',
        winsNeeded: cfg.winsNeeded || 3
      });
    } else if (act === 'settings') { fillSettings(); show('settings'); }
    else if (act === 'help') { helpReturn = 'title'; show('help'); }
    else if (act === 'stats') { buildStats(); show('stats'); }
    else if (act === 'resume') BA.GAME.resume();
    else if (act === 'quit') { BA.GAME.quit(); }
    else if (act === 'next') BA.GAME.nextRound();
    else if (act === 'again') {
      BA.GAME.startMatch({
        mode: cfg.lastMode || 'ffa', humans: +cfg.lastHumans || 1,
        players: +cfg.lastPlayers || 4, diff: cfg.lastDiff || 'normal',
        map: cfg.lastMap || 'garden', winsNeeded: cfg.winsNeeded || 3
      });
    } else if (act === 'title') { BA.GAME.quit(); }
    else if (act === 'back') {
      if (helpReturn === 'pause') { show('pause'); }
      else show('title');
    }
  }

      '<div class="setrow"><div class="lbl">起始泡泡 Start Bombs</div><div class="chips" data-group="startBombs"></div></div>' +

      '</div>';
    sc.appendChild(card);

      var btn = e.target.closest('[data-act]');
      if (btn) {
        btn.blur();
        if (btn.dataset.act === 'back') { show('title'); }
        else if (btn.dataset.act === 'resetCfg') {
          CFG.reset(); fillSettings(); toast('已恢复默认设置'); BA.AUDIO.play('click');
        } else if (btn.dataset.act === 'resetSave') {
          SAVE.reset(); toast('战绩已清空'); BA.AUDIO.play('click');
        }
        return;
      }
      var chip = e.target.closest('.chip');
      if (chip) {
        chip.blur();
        var g = chip.closest('.chips').dataset.group;
        var v = parseFloat(chip.dataset.v);
        var patch = {};
        patch[g] = v;
        CFG.patch(patch);
        BA.AUDIO.play('click');
        fillSettings();
        if (g === 'itemChance') BA.GAME.render();
      }
      var tg = e.target.closest('.toggle');
      if (tg) {
        if (tg.blur) tg.blur();
        var cfg = CFG.get();
        if (tg.id === 'tgShake') CFG.patch({ shake: cfg.shake ? 0 : 1 });
        else if (tg.id === 'tgParticles') {
          var on = cfg.particles ? 0 : 1;
          CFG.patch({ particles: on });
          BA.FX.setEnabled(!!on);
        } else if (tg.id === 'tgFps') {
          CFG.patch({ showFps: !cfg.showFps });
          $('fps').classList.toggle('on', !!CFG.get().showFps);
        } else if (tg.id === 'tgMute') {
          var m = !cfg.muted;
          CFG.patch({ muted: m });
          BA.AUDIO.muted(m);
        } else if (tg.id === 'tgSudden') {
          CFG.patch({ suddenDeath: !cfg.suddenDeath });
        }
        BA.AUDIO.play('click');
        fillSettings();
      }
    });
    sc.addEventListener('input', function (e) {
      if (e.target.id === 'setSfx') {
        var v = +e.target.value / 100;
        CFG.patch({ sfxVolume: v });
        BA.AUDIO.setSfx(v);
        $('setSfxV').textContent = Math.round(v * 100) + '%';
        e.target.style.setProperty('--p', (v * 100) + '%');
        BA.AUDIO.play('tick');
      } else if (e.target.id === 'setMusic') {
        var v2 = +e.target.value / 100;
        CFG.patch({ musicVolume: v2 });
        BA.AUDIO.setMusic(v2);
        $('setMusicV').textContent = Math.round(v2 * 100) + '%';
        e.target.style.setProperty('--p', (v2 * 100) + '%');
      }
    });
  }

  function fillSettings() {
    var cfg = CFG.get();
    var sc = screens.screenSettings;
    if (!sc || !sc.querySelector('#setSfx')) return;
    var s1 = sc.querySelector('#setSfx'), s2 = sc.querySelector('#setMusic');
    s1.value = Math.round((cfg.sfxVolume == null ? .8 : cfg.sfxVolume) * 100);
    s2.value = Math.round((cfg.musicVolume == null ? .32 : cfg.musicVolume) * 100);
    s1.style.setProperty('--p', s1.value + '%');
    s2.style.setProperty('--p', s2.value + '%');
    sc.querySelector('#setSfxV').textContent = s1.value + '%';
    sc.querySelector('#setMusicV').textContent = s2.value + '%';
    sc.querySelector('#tgShake').classList.toggle('on', !!cfg.shake);
    sc.querySelector('#tgParticles').classList.toggle('on', !!cfg.particles);
    sc.querySelector('#tgFps').classList.toggle('on', !!cfg.showFps);
    sc.querySelector('#tgMute').classList.toggle('on', !!cfg.muted);
    sc.querySelector('#tgSudden').classList.toggle('on', !!cfg.suddenDeath);
    var groups = {
      fuse: [{ v: 1.4, t: '1.4s 快' }, { v: 2.0, t: '2.0s' }, { v: 2.4, t: '2.4s 标准' }, { v: 3.2, t: '3.2s 慢' }],
      roundTime: [{ v: 60, t: '60s' }, { v: 120, t: '120s' }, { v: 150, t: '150s' }, { v: 240, t: '240s' }],
      itemChance: [{ v: 0.15, t: '15%' }, { v: 0.3, t: '30%' }, { v: 0.45, t: '45%' }, { v: 0.65, t: '65%' }],
      startBombs: [{ v: 1, t: '1' }, { v: 2, t: '2' }, { v: 3, t: '3' }],
      startPower: [{ v: 1, t: '1' }, { v: 2, t: '2' }, { v: 3, t: '3' }]
    };
    Object.keys(groups).forEach(function (g) {
      var box = sc.querySelector('[data-group="' + g + '"]');
      if (!box) return;
      box.innerHTML = '';
      groups[g].forEach(function (o) {
        var on = Math.abs((cfg[g] == null ? o.v : cfg[g]) - o.v) < 1e-6;
        var c = mk('button', 'chip' + (on ? ' on' : ''));
        c.dataset.v = o.v;
        c.textContent = o.t;
        box.appendChild(c);
      });
    });
  }

  /* ---------------- 回合结算 ---------------- */
  function showRound(res) {
    var sc = screens.screenRound;
    sc.innerHTML = '';
    var S = BA.GAME.S;
    var card = mk('div', 'card');
    var win = res.winner;
    var title = '';
    var sub = '';
    var isMatch = !!S.matchWinner;
    if (S.mode === 'team') {
      var teamWins = win ? (S.players.filter(function (p) { return p.team === win.team; })[0] || {}).wins || 0 : 0;
      title = win ? ((win.team === 0 ? '蓝队' : '粉队') + ' 获胜') : '平局';
      sub = '队伍比分 ' + (S.players.filter(function (p) { return p.team === 0; })[0] || {}).wins +
            ' : ' + (S.players.filter(function (p) { return p.team === 1; })[0] || {}).wins;
    } else {
      title = win ? (win.isHuman ? (win.id === 'p1' ? '你赢了！' : 'P2 获胜！') : (win.name + ' 获胜')) : '全员淘汰';
      sub = '本局用时 ' + U.fmtTime(S.time) + ' · 炸箱 ' + S.stats.blocks + ' · 道具 ' + S.stats.items;
    }
    if (isMatch) {
      if (S.mode === 'team') {
        var mwt = S.matchWinner && S.matchWinner.team;
        title = S.matchWinnerHuman ? '比赛胜利！' : (mwt === 0 ? '蓝队获胜' : '粉队获胜');
      } else {
        title = S.matchWinnerHuman ? '比赛胜利！' : ((S.matchWinner && S.matchWinner.name) || '对手') + ' 获胜';
      }
      sub = S.matchWinnerHuman ? '你赢下了这场比赛 · 共 ' + S.round + ' 局' : '比赛结束 · 共 ' + S.round + ' 局';
    }
    var standings = S.players.map(function (p) {
      var pts = p.wins;
      var out = !p.alive && !res.winner ? true : (!p.alive && p !== res.winner);
      var nm = p.isHuman ? (p.id === 'p1' ? '你 (P1)' : 'P2') : p.name;
      return '<div class="stand' + (out ? ' out' : '') + '">' +
        '<img src="' + BA.ART.avatar(p.theme) + '" alt="">' +
        '<span style="color:' + p.color + ';font-weight:700">' + U.esc(nm) + '</span>' +
        '<span class="pts" style="color:' + p.color + '">' + pts + '</span>' +
        '</div>';
    }).join('');

    card.innerHTML =
      '<div class="round-title">ROUND ' + S.round + (isMatch ? ' · MATCH' : '') + '</div>' +
      '<div class="round-big' + (res.humanWon || isMatch && S.matchWinnerHuman ? '' : ' lose') + '">' + U.esc(title) + '</div>' +
      '<div class="round-sub">' + U.esc(sub) + '</div>' +
      '<div class="round-standings">' + standings + '</div>' +
      '<div class="round-sub" style="margin-top:16px;font-size:12px;color:#7f93b8">先到 ' + S.winsNeeded + ' 胜者赢得比赛</div>' +
      '<div class="btnrow" style="justify-content:center">' +
        (isMatch
          ? '<button class="btn" data-act="again">再来一场</button><button class="btn ghost" data-act="title">返回标题</button>'
          : '<button class="btn" data-act="next">下一局 · Space</button><button class="btn ghost" data-act="title">返回标题</button>') +
      '</div>';
    sc.appendChild(card);
    sc.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      btn.blur();
      var a = btn.dataset.act;
      if (a === 'next') { BA.GAME.nextRound(); }
      else if (a === 'again') onAct('again');
      else if (a === 'title') { BA.GAME.quit(); }
    });
    show('round');
  }

  /* ---------------- HUD ---------------- */
  function hud(S) {
    var strip = $('scoreStrip');
    if (!strip) return;
    strip.innerHTML = '';
    S.players.forEach(function (p) {
      var el = mk('div', 'sc' + (p.alive ? '' : ' dead') + (p.isHuman ? ' me' : '') + (S.winner === p ? ' win' : ''));
      el.style.setProperty('--c', p.color);
      var teamTag = S.mode === 'team' ? (p.team === 0 ? '蓝队' : '粉队') : '';
      var nm = p.isHuman ? (p.id === 'p1' ? '你 P1' : 'P2') : p.name;
      var state = p.trapped ? '被困 ' + p.trapT.toFixed(1) + 's' : (p.alive ? '' : '淘汰');
      el.innerHTML =
        '<div class="av"><img src="' + BA.ART.avatar(p.theme) + '" alt=""></div>' +
        '<div>' +
          '<div class="nm" style="color:' + p.color + '">' + U.esc(nm) + (teamTag ? ' <span style="opacity:.6;font-weight:400">' + teamTag + '</span>' : '') + '</div>' +
          '<div class="st">' +
            '<span>💧<b>' + p.maxBombs + '</b></span>' +
            '<span>🔥<b>' + p.power + '</b></span>' +
            (p.kick ? '<span>👢</span>' : '') +
            (p.shield ? '<span>🛡</span>' : '') +
            (state ? '<span style="color:#ff9db4">' + state + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="wins">' + p.wins + '</div>';
      strip.appendChild(el);
    });
  }

  var hudTimerAcc = 0;
  function tickHud(S, dt) {
    hudTimerAcc += dt;
    if (hudTimerAcc < 0.08) return;
    hudTimerAcc = 0;
    var cfg = CFG.get();
    var timeLeft = S.phase === 'play' ? Math.max(0, (cfg.roundTime || 150) - S.time) : (cfg.roundTime || 150);
    if (S.sudden) timeLeft = 0;
    var txt = S.sudden ? '死亡模式' : U.fmtTime(timeLeft);
    var te = $('timer');
    if (te && txt !== lastTimerTxt) {
      te.textContent = txt;
      te.classList.toggle('warn', S.sudden || timeLeft <= 15);
      lastTimerTxt = txt;
    }
    var rt = $('roundTag');
    if (rt) rt.textContent = '第 ' + S.round + ' 局 · 先到 ' + S.winsNeeded + ' 胜';
    var fe = $('fps');
    if (fe) {
      fe.classList.toggle('on', !!cfg.showFps);
      if (cfg.showFps) fe.textContent = BA.GAME.fps + ' FPS · ' + (BA.FX ? BA.FX.count : 0) + ' 粒子';
    }
  }

  /* ---------------- 倒计时 ---------------- */
  function countdown(n) {
    var el = $('countdown');
    if (!el) return;
    if (n <= 0) { el.classList.remove('on'); return; }
    var txt = n > 3 ? String(n) : String(n);
    if (el.textContent !== txt) {
      el.textContent = txt;
      el.classList.remove('on');
      void el.offsetWidth;
      el.classList.add('on');
    }
  }

  /* ---------------- toast ---------------- */
  function toast(msg) {
    var el = $('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('on'); }, 1800);
  }

  function danger() {}

  /* ---------------- 键盘辅助 ---------------- */
  function handleKey(code) {
    if (cur === 'title') {
      if (code === 'Enter' || code === 'Space') { onAct('start'); return true; }
      if (code === 'KeyH') { show('help'); return true; }
      if (code === 'KeyS' && false) return false;
      if (code === 'KeyT') { buildStats(); show('stats'); return true; }
      return false;
    }
    if (cur === 'help') {
      if (code === 'Escape' || code === 'Enter' || code === 'Space') { onAct('back'); return true; }
      return true;
    }
    if (cur === 'stats' || cur === 'settings') {
      if (code === 'Escape' || code === 'Enter') { show('title'); return true; }
      return true;
    }
    if (cur === 'pause') {
      if (code === 'Escape' || code === 'KeyP') { BA.GAME.resume(); return true; }
      return true;
    }
    if (cur === 'round') {
      if (code === 'Space' || code === 'Enter') {
        if (BA.GAME.S.matchWinner) onAct('again');
        else BA.GAME.nextRound();
        return true;
      }
      return true;
    }
    if (cur === 'match') {
      if (code === 'Space' || code === 'Enter') { onAct('again'); return true; }
      if (code === 'Escape') { BA.GAME.quit(); return true; }
      return true;
    }
    return false;
  }

  BA.UI = {
    init: init,
    show: show,
    hud: hud,
    tickHud: tickHud,
    toast: toast,
    countdown: countdown,
    showRound: showRound,
    handleKey: handleKey,
    danger: danger,
    refreshSettings: fillSettings,
    get current() { return cur; }
  };
})(window);


/* ==== boot.js ==== */
/* ============================================================
 * 泡泡堂 · src/boot.js —— 启动引导
 * 缩放舞台 / 移动端拦截 / 初始化各模块 / URL 调试参数
 * ============================================================ */
(function (global) {
  'use strict';
  var BA = global.BA;
  var stage = null;

  function isMobile() {
    var ua = navigator.userAgent || '';
    var touch = (navigator.maxTouchPoints || 0) > 1;
    var mobileUa = /Android|iPhone|iPad|iPod|Windows Phone|Mobile|BlackBerry|Opera Mini/i.test(ua);
    var small = Math.min(window.innerWidth, window.innerHeight) < 620 && touch;
    return mobileUa || small;
  }

  function fitStage() {
    if (!stage) stage = document.getElementById('stage');
    if (!stage) return;
    var pad = 24;
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min((vw - pad * 2) / 960, (vh - pad * 2) / 832);
    s = Math.min(s, 1.28);
    stage.style.transform = 'translate(-50%, -50%) scale(' + s.toFixed(4) + ')';
    if (BA.FX) BA.FX.resize();
  }

  function boot() {
    if (isMobile()) {
      document.getElementById('desktopOnly').classList.add('on');
      // 仍然初始化，防止后台报错（不渲染）
      try { BA.GAME.init(document.getElementById('game')); } catch (e) {}
      return;
    }
    stage = document.getElementById('stage');
    fitStage();
    window.addEventListener('resize', function () {
      fitStage();
      if (BA.FX) BA.FX.resize();
    });

    BA.FX.setEnabled(!!BA.CORE.CFG.get().particles);
    BA.UI.init();
    BA.GAME.init(document.getElementById('game'));
    var hints = document.getElementById('hints');
    if (hints) {
      hints.innerHTML = '<span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>' +
        '<span class="sep">·</span><span><kbd>Space</kbd> 放泡</span>' +
        '<span class="sep">·</span><span><kbd>Esc</kbd> 暂停</span>' +
        '<span class="sep">·</span><span><kbd>M</kbd> 静音</span>';
    }
    BA.UI.hud(BA.GAME.S);
    BA.UI.show('title');

    var Q = global.__BAQ || {};
    if (Q.muted === true || Q.muted === '1') {
      BA.CORE.CFG.patch({ muted: true });
      BA.AUDIO.muted(true);
    }
    if (Q.fps === true || Q.fps === '1') {
      BA.CORE.CFG.patch({ showFps: true });
      document.getElementById('fps').classList.add('on');
    }
    if (Q.speed) BA.GAME.S.speedMul = parseFloat(Q.speed) || 1;
    if (Q.auto === true || Q.auto === '1') {
      // 自动化：直接开始一场 bot-only 演示（测试用）
      setTimeout(function () {
        BA.GAME.startMatch({
          mode: 'ffa', humans: 0, players: 4,
          diff: Q.diff || 'normal', map: Q.map || 'garden', winsNeeded: 3
        });
        BA.GAME.setBotOnly(true);
      }, 60);
    }
    if (Q.map && Q.auto !== true) BA.CORE.CFG.patch({ lastMap: Q.map });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window);
</script>
</body>
</html>
