  }

  /* ---------------- 暂停 ---------------- */
  function buildPause() {
    var sc = screens.screenPause;
    sc.innerHTML = '';
    var card = mk('div', 'card');
    card.style.width = 'min(460px, 86%)';
    card.innerHTML =
      '<div class="round-title">PAUSED</div>' +
      '<div class="round-big" style="font-size:44px">暂停中</div>' +
      '<div class="round-sub">按 <span class="kbd">Esc</span> 或 <span class="kbd">P</span> 继续</div>' +
      '<div class="btnrow" style="justify-content:center">' +
        '<button class="btn" data-act="resume">继续游戏</button>' +
        '<button class="btn ghost" data-act="help">操作说明</button>' +
        '<button class="btn ghost" data-act="quit">退出对战</button>' +
      '</div>';
    sc.appendChild(card);
    sc.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      btn.blur();
      var a = btn.dataset.act;
      if (a === 'resume') BA.GAME.resume();
      else if (a === 'quit') BA.GAME.quit();
      else if (a === 'help') { helpReturn = 'pause'; show('help'); }
    });
  }

  /* ---------------- 回合结算 ---------------- */
  function showRound(res) {
    var sc = screens.screenRound;
    sc.innerHTML = '';
    var S = BA.GAME.S;
    var card = mk('div', 'card');
    var win = res.winner;
    var title = '';
    var sub = '';
    var isMatch = !!S.matchWinner;
    if (S.mode === 'team') {
      var teamWins = win ? (S.players.filter(function (p) { return p.team === win.team; })[0] || {}).wins || 0 : 0;
      title = win ? ((win.team === 0 ? '蓝队' : '粉队') + ' 获胜') : '平局';
      sub = '队伍比分 ' + (S.players.filter(function (p) { return p.team === 0; })[0] || {}).wins +
            ' : ' + (S.players.filter(function (p) { return p.team === 1; })[0] || {}).wins;
    } else {
      title = win ? (win.isHuman ? (win.id === 'p1' ? '你赢了！' : 'P2 获胜！') : (win.name + ' 获胜')) : '全员淘汰';
      sub = '本局用时 ' + U.fmtTime(S.time) + ' · 炸箱 ' + S.stats.blocks + ' · 道具 ' + S.stats.items;
    }
    if (isMatch) {
      if (S.mode === 'team') {
        var mwt = S.matchWinner && S.matchWinner.team;
        title = S.matchWinnerHuman ? '比赛胜利！' : (mwt === 0 ? '蓝队获胜' : '粉队获胜');
      } else {
        title = S.matchWinnerHuman ? '比赛胜利！' : ((S.matchWinner && S.matchWinner.name) || '对手') + ' 获胜';
      }
      sub = S.matchWinnerHuman ? '你赢下了这场比赛 · 共 ' + S.round + ' 局' : '比赛结束 · 共 ' + S.round + ' 局';
    }
    var standings = S.players.map(function (p) {
      var pts = p.wins;
      var out = !p.alive && !res.winner ? true : (!p.alive && p !== res.winner);
      var nm = p.isHuman ? (p.id === 'p1' ? '你 (P1)' : 'P2') : p.name;
      return '<div class="stand' + (out ? ' out' : '') + '">' +
        '<img src="' + BA.ART.avatar(p.theme) + '" alt="">' +
        '<span style="color:' + p.color + ';font-weight:700">' + U.esc(nm) + '</span>' +
        '<span class="pts" style="color:' + p.color + '">' + pts + '</span>' +
        '</div>';
    }).join('');

    card.innerHTML =
      '<div class="round-title">ROUND ' + S.round + (isMatch ? ' · MATCH' : '') + '</div>' +
      '<div class="round-big' + (res.humanWon || isMatch && S.matchWinnerHuman ? '' : ' lose') + '">' + U.esc(title) + '</div>' +
      '<div class="round-sub">' + U.esc(sub) + '</div>' +
      '<div class="round-standings">' + standings + '</div>' +
      '<div class="round-sub" style="margin-top:16px;font-size:12px;color:#7f93b8">先到 ' + S.winsNeeded + ' 胜者赢得比赛</div>' +
      '<div class="btnrow" style="justify-content:center">' +
        (isMatch
          ? '<button class="btn" data-act="again">再来一场</button><button class="btn ghost" data-act="title">返回标题</button>'
          : '<button class="btn" data-act="next">下一局 · Space</button><button class="btn ghost" data-act="title">返回标题</button>') +
      '</div>';
    sc.appendChild(card);
    sc.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      btn.blur();
      var a = btn.dataset.act;
      if (a === 'next') { BA.GAME.nextRound(); }
      else if (a === 'again') onAct('again');
      else if (a === 'title') { BA.GAME.quit(); }
    });
    show('round');
  }

  /* ---------------- HUD ---------------- */
  function hud(S) {
    var strip = $('scoreStrip');
    if (!strip) return;
    strip.innerHTML = '';
    S.players.forEach(function (p) {
      var el = mk('div', 'sc' + (p.alive ? '' : ' dead') + (p.isHuman ? ' me' : '') + (S.winner === p ? ' win' : ''));
      el.style.setProperty('--c', p.color);
      var teamTag = S.mode === 'team' ? (p.team === 0 ? '蓝队' : '粉队') : '';
      var nm = p.isHuman ? (p.id === 'p1' ? '你 P1' : 'P2') : p.name;
      var state = p.trapped ? (p.popT > 0 ? '被戳破 ' + p.popT.toFixed(1) + 's' : '被困 ' + p.trapT.toFixed(1) + 's') : (p.alive ? '' : '淘汰');
      el.innerHTML =
        '<div class="av"><img src="' + BA.ART.avatar(p.theme) + '" alt=""></div>' +
        '<div>' +
          '<div class="nm" style="color:' + p.color + '">' + U.esc(nm) + (teamTag ? ' <span style="opacity:.6;font-weight:400">' + teamTag + '</span>' : '') + '</div>' +
          '<div class="st">' +
            '<span>💧<b>' + p.maxBombs + '</b></span>' +
            '<span>🔥<b>' + p.power + '</b></span>' +
            '<span>👟<b>' + p.speed.toFixed(1) + '</b></span>' +
            (p.kick ? '<span title="踢靴">👢</span>' : '') +
            (p.shield ? '<span title="护盾">🛡</span>' : '') +
            (p.needle ? '<span title="银针：自动脱困">🪡</span>' : '') +
            (p.bombPass ? '<span title="泡泡靴：可穿过泡泡">🧊</span>' : '') +
            (p.pierce ? '<span title="钻头：水柱穿透软箱">🔩</span>' : '') +
            (p.magnet ? '<span title="磁铁：吸取道具">🧲</span>' : '') +
            (p.glove ? '<span title="手套：举泡投掷">🧤</span>' : '') +
            (p.held ? '<span style="color:#ffd166">举泡</span>' : '') +
            (state ? '<span style="color:#ff9db4">' + state + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="wins">' + p.wins + '</div>';
      strip.appendChild(el);
    });
  }

  var hudTimerAcc = 0;
  function tickHud(S, dt) {
    hudTimerAcc += dt;
    if (hudTimerAcc < 0.08) return;
    hudTimerAcc = 0;
    var cfg = CFG.get();
    var timeLeft = S.phase === 'play' ? Math.max(0, (cfg.roundTime || 150) - S.time) : (cfg.roundTime || 150);
    if (S.sudden) timeLeft = 0;
    var txt = S.sudden ? '死亡模式' : U.fmtTime(timeLeft);
    var te = $('timer');
    if (te && txt !== lastTimerTxt) {
      te.textContent = txt;
      te.classList.toggle('warn', S.sudden || timeLeft <= 15);
      lastTimerTxt = txt;
    }
    var rt = $('roundTag');
    if (rt) rt.textContent = '第 ' + S.round + ' 局 · 先到 ' + S.winsNeeded + ' 胜';
    var fe = $('fps');
    if (fe) {
      fe.classList.toggle('on', !!cfg.showFps);
      if (cfg.showFps) fe.textContent = BA.GAME.fps + ' FPS · ' + (BA.FX ? BA.FX.count : 0) + ' 粒子';
    }
  }

  /* ---------------- 倒计时 ---------------- */
  function countdown(n) {
    var el = $('countdown');
    if (!el) return;
    if (n <= 0) { el.classList.remove('on'); return; }
    var txt = n > 3 ? String(n) : String(n);
    if (el.textContent !== txt) {
      el.textContent = txt;
      el.classList.remove('on');
      void el.offsetWidth;
      el.classList.add('on');
    }
  }

  /* ---------------- toast ---------------- */
  function toast(msg) {
    var el = $('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('on'); }, 1800);
  }

  function danger() {}

  /* ---------------- 键盘辅助 ---------------- */
  function handleKey(code) {
    if (cur === 'title') {
      if (code === 'Enter' || code === 'Space') { onAct('start'); return true; }
      if (code === 'KeyH') { show('help'); return true; }
      if (code === 'KeyS' && false) return false;
      if (code === 'KeyT') { buildStats(); show('stats'); return true; }
      return false;
    }
    if (cur === 'help') {
      if (code === 'Escape' || code === 'Enter' || code === 'Space') { onAct('back'); return true; }
      return true;
    }
    if (cur === 'stats' || cur === 'settings') {
      if (code === 'Escape' || code === 'Enter') { show('title'); return true; }
      return true;
    }
    if (cur === 'pause') {
      if (code === 'Escape' || code === 'KeyP') { BA.GAME.resume(); return true; }
      return true;
    }
    if (cur === 'round') {
      if (code === 'Space' || code === 'Enter') {
        if (BA.GAME.S.matchWinner) onAct('again');
        else BA.GAME.nextRound();
        return true;
      }
      return true;
    }
    if (cur === 'match') {
      if (code === 'Space' || code === 'Enter') { onAct('again'); return true; }
      if (code === 'Escape') { BA.GAME.quit(); return true; }
      return true;
    }
    return false;
  }

  BA.UI = {
    init: init,
    show: show,
    hud: hud,
    tickHud: tickHud,
    toast: toast,
    countdown: countdown,
    showRound: showRound,
    handleKey: handleKey,
    danger: danger,
    refreshSettings: fillSettings,
    get current() { return cur; }
  };
})(window);


/* ==== touch.js ==== */
/* ============================================================
 * 泡泡堂 · src/touch.js —— 触屏操作层
 * 动态虚拟摇杆（左手热区）+ 放泡大按钮（右手）+ 暂停按钮
 * 手感：按下处为摇杆原点；4 向吸附 + 轴间迟滞防抖；
 *       死区内原地站定；被困时摇杆变向 / 连点放泡键均可计入自救
 * ============================================================ */
(function (global) {
  'use strict';
  var BA = global.BA;

  var layer = null, zone = null, base = null, knob = null;
  var bombBtn = null, pauseBtn = null, ghost = null;
  var joyId = null;        // 占用摇杆的 touch identifier
  var ox = 0, oy = 0;      // 摇杆原点（视口坐标）
  var outDir = null;       // 当前输出给游戏的四向
  var bombDown = false;
  var usedOnce = false;
  var enabled = false;
  var syncTimer = 0;

  var R = 56;              // 摇杆最大半径（CSS px）
  var DEAD = 12;           // 死区：视为原地站定
  var K_AXIS = 1.35;       // 轴间切换迟滞：新轴分量需 > 当前轴分量 × K
  var M_AXIS = 10;         // 轴间切换迟滞：且需超出 M px

  var ICON_BOMB =
    '<svg viewBox="0 0 48 48" width="42" height="42" aria-hidden="true">' +
    '<circle cx="21" cy="28" r="13" fill="#6ec8ff" opacity=".92"/>' +
    '<circle cx="16.5" cy="23.5" r="4.4" fill="#fff" opacity=".9"/>' +
    '<path d="M28 18 q2.5-7 9.5-8" stroke="#ffd27a" stroke-width="3.2" fill="none" stroke-linecap="round"/>' +
    '<circle cx="39" cy="9" r="3.2" fill="#ffcf5e"/>' +
    '</svg>';
  var ICON_PAUSE =
    '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">' +
    '<rect x="6" y="4" width="4.2" height="16" rx="1.6" fill="#cfe0f8"/>' +
    '<rect x="13.8" y="4" width="4.2" height="16" rx="1.6" fill="#cfe0f8"/>' +
    '</svg>';

  function inPlay() {
    var S = BA.GAME && BA.GAME.S;
    return !!S && (S.phase === 'play' || S.phase === 'countdown');
  }

  function markUsed() {
    if (usedOnce) return;
    usedOnce = true;
    if (ghost) ghost.classList.add('gone');
  }

  /* 4 向吸附 + 迟滞：当前横轴时，纵轴分量需明显占优才切换，防 45° 抖动 */
  function pickDir(dx, dy) {
    var mag = Math.hypot(dx, dy);
    if (mag < DEAD) return null;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (outDir === 'left' || outDir === 'right') {
      if (ay > ax * K_AXIS && ay > ax + M_AXIS) return dy < 0 ? 'up' : 'down';
      return dx >= 0 ? 'right' : 'left';
    }
    if (outDir === 'up' || outDir === 'down') {
      if (ax > ay * K_AXIS && ax > ay + M_AXIS) return dx < 0 ? 'left' : 'right';
      return dy >= 0 ? 'down' : 'up';
    }
    return ax >= ay ? (dx >= 0 ? 'right' : 'left') : (dy >= 0 ? 'down' : 'up');
  }

  function showBase(x, y) {
    base.style.left = x + 'px';
    base.style.top = y + 'px';
    base.classList.add('on');
    moveKnob(0, 0);
  }
  function moveKnob(dx, dy) {
    var mag = Math.hypot(dx, dy);
    if (mag > R) { dx = dx / mag * R; dy = dy / mag * R; }
    knob.style.transform = 'translate(calc(-50% + ' + dx.toFixed(1) + 'px), calc(-50% + ' + dy.toFixed(1) + 'px))';
  }
  function hideBase() {
    base.classList.remove('on');
    joyId = null;
  }

  function joystickStart(t) {
    joyId = t.identifier;
    ox = t.clientX; oy = t.clientY;
    outDir = null;
    showBase(ox, oy);
    markUsed();
  }
  function joystickMove(t) {
    var dx = t.clientX - ox, dy = t.clientY - oy;
    moveKnob(dx, dy);
    var d = pickDir(dx, dy);
    if (d !== outDir) {
      outDir = d;
      if (BA.GAME.touch) BA.GAME.touch.dir(d);
    }
  }
  function joystickEnd() {
    if (outDir && BA.GAME.touch) BA.GAME.touch.dir(null);
    outDir = null;
    hideBase();
  }

  function setBomb(down) {
    if (bombDown === down) return;
    bombDown = down;
    bombBtn.classList.toggle('press', down);
    if (BA.GAME.touch) BA.GAME.touch.bomb(down);
  }

  function syncVisible() {
    if (!layer || !enabled) return;
    var S = BA.GAME && BA.GAME.S;
    var on = inPlay() && !(S && S.botOnly);
    layer.classList.toggle('on', on);
    layer.classList.toggle('paused', !!(on && S.paused));
  }

  function init() {
    if (enabled) return;
    layer = document.getElementById('touchLayer');
    if (!layer) return;
    enabled = true;

    layer.innerHTML =
      '<div class="tl-zone"></div>' +
      '<div class="tl-ghost"><i></i></div>' +
      '<div class="tl-base"><div class="tl-knob"></div></div>' +
      '<div class="tl-bomb">' + ICON_BOMB + '</div>' +
      '<button class="tl-pause" type="button" aria-label="暂停">' + ICON_PAUSE + '</button>';

    zone = layer.querySelector('.tl-zone');
    ghost = layer.querySelector('.tl-ghost');
    base = layer.querySelector('.tl-base');
    knob = layer.querySelector('.tl-knob');
    bombBtn = layer.querySelector('.tl-bomb');
    pauseBtn = layer.querySelector('.tl-pause');

    zone.addEventListener('touchstart', function (e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (joyId === null) joystickStart(e.changedTouches[i]);
      }
    }, { passive: false });

    window.addEventListener('touchmove', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyId) {
          e.preventDefault();
          joystickMove(e.changedTouches[i]);
        }
      }
    }, { passive: false });

    var release = function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyId) joystickEnd();
      }
    };
    window.addEventListener('touchend', release);
    window.addEventListener('touchcancel', release);

    bombBtn.addEventListener('touchstart', function (e) {
      e.preventDefault(); e.stopPropagation(); setBomb(true);
    }, { passive: false });
    bombBtn.addEventListener('touchend', function (e) { e.preventDefault(); setBomb(false); }, { passive: false });
    bombBtn.addEventListener('touchcancel', function () { setBomb(false); });
    bombBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    /* ?touch=1 桌面调试用 */
    bombBtn.addEventListener('mousedown', function () { setBomb(true); });
    window.addEventListener('mouseup', function () { if (bombDown) setBomb(false); });

    pauseBtn.addEventListener('click', function (e) {
      e.preventDefault();
      var S = BA.GAME && BA.GAME.S;
      if (!S) return;
      if (S.paused) BA.GAME.resume();
      else if (inPlay()) BA.GAME.pause();
    });

    layer.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    if (syncTimer) clearInterval(syncTimer);
    syncTimer = setInterval(syncVisible, 300);
    syncVisible();

    if (window.__ba) {
      window.__ba.touch = {
        get dir() { return outDir; },
        get bomb() { return bombDown; }
      };
    }
  }

  BA.TOUCH = {
    init: init,
    get enabled() { return enabled; }
  };
})(window);


/* ==== boot.js ==== */
/* ============================================================
 * 泡泡堂 · src/boot.js —— 启动引导
 * 缩放舞台 / 触屏模式 / 初始化各模块 / URL 调试参数
 * ============================================================ */
(function (global) {
  'use strict';
  var BA = global.BA;
  var stage = null;

  /* 触屏设备判定：?touch=1 强制开启 / ?touch=0 强制关闭 */
  function preferTouch() {
    var Q = global.__BAQ || {};
    if (Q.touch === '0') return false;
    if (Q.touch === '1') return true;
    var touch = (navigator.maxTouchPoints || 0) > 0;
    var coarse = false;
    try { coarse = global.matchMedia('(pointer: coarse)').matches; } catch (e) {}
    var ua = /Android|iPhone|iPad|iPod|Windows Phone|Mobile/i.test(navigator.userAgent || '');
    return (touch && coarse) || (touch && ua);
  }

  /* 竖屏给底部操作区多留白，横屏少留白 */
  function reserveFor(vw, vh) { return vh > vw ? 186 : 118; }

  function fitStage(reserveBottom) {
    if (!stage) stage = document.getElementById('stage');
    if (!stage) return;
    var pad = reserveBottom > 0 ? 10 : 24;
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min((vw - pad * 2) / 960, (vh - pad * 2 - reserveBottom) / 832);
    s = Math.min(s, 1.28);
    stage.style.left = '50%';
    stage.style.top = reserveBottom > 0 ? Math.round((vh - reserveBottom) / 2) + 'px' : '50%';
    stage.style.transform = 'translate(-50%, -50%) scale(' + s.toFixed(4) + ')';
    if (BA.FX) BA.FX.resize();
  }

  function boot() {
    var touchMode = preferTouch();
    stage = document.getElementById('stage');
    fitStage(touchMode ? reserveFor(window.innerWidth, window.innerHeight) : 0);
    var onResize = function () {
      fitStage(touchMode ? reserveFor(window.innerWidth, window.innerHeight) : 0);
      if (BA.FX) BA.FX.resize();
    };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', function () { setTimeout(onResize, 120); });

    BA.FX.setEnabled(!!BA.CORE.CFG.get().particles);
    BA.GAME.init(document.getElementById('game'));
    /* TOUCH 先于 UI：标题/帮助屏按触屏模式生成提示文案 */
    if (touchMode && BA.TOUCH) BA.TOUCH.init();
    BA.UI.init();

    var hints = document.getElementById('hints');
    if (hints) {
      hints.innerHTML = touchMode
        ? '<span>左侧滑动移动</span><span class="sep">·</span><span>右下按钮放泡</span><span class="sep">·</span><span>右上按钮暂停</span>'
        : '<span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>' +
          '<span class="sep">·</span><span><kbd>Space</kbd> 放泡</span>' +
          '<span class="sep">·</span><span><kbd>Esc</kbd> 暂停</span>' +
          '<span class="sep">·</span><span><kbd>M</kbd> 静音</span>';
    }
    BA.UI.hud(BA.GAME.S);
    BA.UI.show('title');

    var Q = global.__BAQ || {};
    if (Q.muted === true || Q.muted === '1') {
      BA.CORE.CFG.patch({ muted: true });
      BA.AUDIO.muted(true);
    }
    if (Q.fps === true || Q.fps === '1') {
      BA.CORE.CFG.patch({ showFps: true });
      document.getElementById('fps').classList.add('on');
    }
    if (Q.speed) BA.GAME.S.speedMul = parseFloat(Q.speed) || 1;
    if (Q.auto === true || Q.auto === '1') {
      // 自动化：直接开始一场 bot-only 演示（测试用）
      setTimeout(function () {
        BA.GAME.startMatch({
          mode: 'ffa', humans: 0, players: 4,
          diff: Q.diff || 'normal', map: Q.map || 'garden', winsNeeded: 3
        });
        BA.GAME.setBotOnly(true);
      }, 60);
    }
    if (Q.map && Q.auto !== true) BA.CORE.CFG.patch({ lastMap: Q.map });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window);
</script>
