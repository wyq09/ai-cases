<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>泡泡堂 · BUBBLE ARCADE</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="泡泡堂 H5 复刻 · 15×13 棋盘 · 放泡水柱十字爆破 · 混战与 2v2 · 本地双人 + AI">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%236ec8ff' opacity='.85'/%3E%3Ccircle cx='23' cy='23' r='8' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<style>/* ============================================================
 * 泡泡堂 · BUBBLE ARCADE — 界面样式
 * PC 专用。深色街机厅氛围 + 泡泡糖撞色，纯 CSS 无外部资源。
 * ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: #070b14;
  color: #e9eefc;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
:root {
  --pink: #ff6fa5;
  --cyan: #5fd8ff;
  --lime: #a6f06a;
  --gold: #ffc94d;
  --violet: #a98bff;
  --ink: #0b1020;
  --panel: rgba(14, 20, 38, .86);
  --line: rgba(140, 175, 255, .18);
  --line2: rgba(140, 175, 255, .34);
  --dim: #8fa2c9;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

#app { position: fixed; inset: 0; overflow: hidden; }
#stage {
  position: absolute;
  left: 50%; top: 50%;
  width: 960px; height: 832px;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  border-radius: 18px;
  overflow: hidden;
  background: #0a0f1e;
  box-shadow: 0 40px 120px rgba(0,0,0,.72), 0 0 0 1px rgba(120,160,255,.14), 0 0 90px rgba(90,140,255,.10);
}
#game { display: block; width: 960px; height: 832px; image-rendering: auto; }
#overlay { position: absolute; inset: 0; pointer-events: none; }
#overlay canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------------- HUD ---------------- */
#hud {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 12px 16px; gap: 12px;
}
#scoreStrip { display: flex; gap: 8px; flex-wrap: wrap; max-width: 660px; }
.sc {
  --c: #5fd8ff;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px 6px 6px;
  background: rgba(8, 13, 26, .72);
  border: 1px solid rgba(120,160,255,.16);
  border-radius: 12px;
  backdrop-filter: blur(6px);
  transition: border-color .2s, background .2s, transform .2s;
  min-width: 118px;
}
.sc.dead { opacity: .46; filter: grayscale(.65); }
.sc.win { border-color: rgba(255,201,77,.65); background: rgba(60,44,10,.62); }
.sc.me { border-color: color-mix(in srgb, var(--c) 55%, transparent); }
.sc .av { width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,.07); flex: 0 0 auto; overflow: hidden; }
.sc .av img { width: 100%; height: 100%; display: block; }
.sc .nm { font-size: 12px; font-weight: 700; letter-spacing: .02em; line-height: 1.15; white-space: nowrap; }
.sc .st { display: flex; gap: 5px; margin-top: 3px; font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: .02em; }
.sc .st b { color: #dfe8ff; font-weight: 600; }
.sc .wins { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--c); margin-left: auto; padding-left: 6px; }
.sc .keys { font-family: var(--mono); font-size: 9px; color: var(--dim); opacity: .8; margin-top: 2px; letter-spacing: .04em; }

#topRight { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#timer {
  font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: .04em;
  padding: 4px 14px; border-radius: 12px;
  background: rgba(8,13,26,.74); border: 1px solid rgba(120,160,255,.18);
  color: #eef4ff; min-width: 104px; text-align: center;
}
#timer.warn { color: #ff8b8b; border-color: rgba(255,110,110,.5); animation: pulseWarn .8s ease-in-out infinite; }
#roundTag { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .12em; }
@keyframes pulseWarn { 0%,100% { opacity: 1 } 50% { opacity: .55 } }

#hints {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
  font-family: var(--mono); font-size: 11px; color: rgba(190,208,240,.62);
  background: rgba(8,13,26,.55); border: 1px solid rgba(120,160,255,.10);
  padding: 6px 14px; border-radius: 999px; pointer-events: none;
  max-width: 92%; white-space: nowrap;
}
#hints kbd {
  font-family: var(--mono); font-size: 10px; color: #cfe0ff;
  background: rgba(120,160,255,.13); border: 1px solid rgba(120,160,255,.24);
  border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; margin: 0 1px;
}
#hints .sep { opacity: .3; }
#fps { position: absolute; right: 14px; bottom: 12px; font-family: var(--mono); font-size: 11px; color: #7ee0a0; opacity: 0; transition: opacity .2s; }
#fps.on { opacity: .8; }

#countdown {
  position: absolute; left: 50%; top: 44%; transform: translate(-50%,-50%);
  font-family: var(--mono); font-weight: 900; font-size: 150px; line-height: 1;
  color: #fff; text-shadow: 0 8px 0 rgba(0,0,0,.35), 0 0 60px rgba(120,200,255,.75);
  opacity: 0; pointer-events: none;
}
#countdown.on { animation: cdPop .82s cubic-bezier(.2,.9,.25,1) both; }
@keyframes cdPop {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(1.9); }
  22% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  75% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(.86); }
}

#toast {
  position: absolute; left: 50%; bottom: 68px; transform: translate(-50%, 12px);
  padding: 9px 18px; border-radius: 10px;
  background: rgba(10,16,32,.92); border: 1px solid rgba(120,160,255,.28);
  font-size: 13px; color: #e8f0ff; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; white-space: nowrap; max-width: 90%;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------------- 屏幕层 ---------------- */
.screen {
  position: absolute; inset: 0; display: none;
  align-items: center; justify-content: center;
  background: radial-gradient(120% 90% at 50% 0%, rgba(30,46,92,.82) 0%, rgba(6,9,18,.94) 62%, rgba(4,6,13,.97) 100%);
  backdrop-filter: blur(3px);
  z-index: 30;
}
.screen.on { display: flex; }
.screen .card {
  width: min(780px, 88%); max-height: 94%; overflow: auto;
  padding: 28px 32px 26px;
  background: linear-gradient(180deg, rgba(20,28,52,.94), rgba(12,17,34,.97));
  border: 1px solid var(--line2); border-radius: 20px;
  box-shadow: 0 30px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
}
.screen .card.wide { width: min(900px, 92%); }
.screen::-webkit-scrollbar, .card::-webkit-scrollbar { width: 8px; }
.screen::-webkit-scrollbar-thumb, .card::-webkit-scrollbar-thumb { background: rgba(120,160,255,.22); border-radius: 8px; }

.title-logo { text-align: center; margin-bottom: 4px; }
.title-logo .cn {
  font-size: 58px; font-weight: 900; letter-spacing: .14em; line-height: 1;
  background: linear-gradient(180deg, #fff 0%, #9fe4ff 44%, #4fb4ff 62%, #2a6cff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 0 rgba(20,60,140,.55)) drop-shadow(0 0 30px rgba(90,190,255,.45));
}
.title-logo .en {
  font-family: var(--mono); font-size: 12px; letter-spacing: .5em; color: #7fb8ff;
  margin-top: 12px; text-indent: .5em;
}
.title-logo .sub { font-size: 12.5px; color: var(--dim); margin-top: 14px; letter-spacing: .04em; }

.bubbles-deco { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
.bubbles-deco i {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.85), rgba(120,200,255,.32) 40%, rgba(60,120,255,.05) 70%);
  border: 1px solid rgba(180,225,255,.28);
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(20px) scale(.9); opacity: 0; }
  12% { opacity: .55; }
  85% { opacity: .4; }
  100% { transform: translateY(-120px) scale(1.05); opacity: 0; }
}

.setrow { margin-top: 20px; }
.setgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 18px; }
.setgrid .setrow { margin-top: 14px; }
.setgrid .setrow:nth-child(5) { grid-column: 1 / -1; }
.setrow .lbl {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .22em; color: #7c9bd4;
  margin-bottom: 8px; text-transform: uppercase;
}
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  appearance: none; border: 1px solid rgba(120,160,255,.2);
  background: rgba(255,255,255,.035); color: #b9c9ea;
  font-family: inherit; font-size: 13px; font-weight: 600;
  padding: 9px 15px; border-radius: 11px; cursor: pointer;
  transition: all .16s; display: inline-flex; align-items: center; gap: 7px; line-height: 1.1;
}
.chip:hover { background: rgba(120,170,255,.13); color: #e6efff; border-color: rgba(120,170,255,.42); transform: translateY(-1px); }
.chip.on {
  background: linear-gradient(180deg, rgba(95,216,255,.24), rgba(70,130,255,.2));
  border-color: rgba(95,216,255,.72); color: #fff;
  box-shadow: 0 0 0 1px rgba(95,216,255,.22), 0 6px 22px rgba(40,120,255,.25);
}
.chip .k { font-family: var(--mono); font-size: 10px; color: var(--dim); }
.chip.on .k { color: #bfe9ff; }
.chip[disabled] { opacity: .35; cursor: not-allowed; transform: none; }
.chip.map { min-width: 100px; justify-content: center; flex-direction: column; gap: 3px; padding: 8px 11px; }
.chip.map .mn { font-size: 12.5px; }
.chip.map .mt { font-family: var(--mono); font-size: 9px; color: var(--dim); letter-spacing: .1em; }

.btnrow { display: flex; gap: 12px; margin-top: 22px; align-items: center; flex-wrap: wrap; }
.btn {
  appearance: none; border: none; cursor: pointer; font-family: inherit;
  font-size: 15px; font-weight: 800; letter-spacing: .06em;
  padding: 14px 30px; border-radius: 13px; color: #06121f;
  background: linear-gradient(180deg, #8ff0ff, #45b7ff 55%, #2f86ff);
  box-shadow: 0 6px 0 #1a4fb0, 0 14px 30px rgba(40,130,255,.35);
  transition: transform .12s, box-shadow .12s, filter .12s;
}
.btn:hover { filter: brightness(1.07); transform: translateY(-2px); box-shadow: 0 8px 0 #1a4fb0, 0 18px 36px rgba(40,130,255,.42); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1a4fb0, 0 8px 18px rgba(40,130,255,.3); }
.btn.ghost {
  background: rgba(255,255,255,.055); color: #c7d7f7;
  box-shadow: inset 0 0 0 1px rgba(120,160,255,.22); font-weight: 700;
  padding: 13px 22px;
}
.btn.ghost:hover { background: rgba(120,170,255,.14); color: #fff; box-shadow: inset 0 0 0 1px rgba(120,170,255,.44); transform: translateY(-1px); }
.btn.pink { background: linear-gradient(180deg, #ffb4d0, #ff6fa5 55%, #e8447f); color: #2a0416; box-shadow: 0 6px 0 #a31c4f, 0 14px 30px rgba(255,90,150,.32); }
.btn.pink:hover { box-shadow: 0 8px 0 #a31c4f, 0 18px 36px rgba(255,90,150,.4); }
.btn.pink:active { box-shadow: 0 2px 0 #a31c4f, 0 8px 18px rgba(255,90,150,.3); }
.btn.sm { font-size: 13px; padding: 10px 18px; border-radius: 10px; }

.keys-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 16px; }
.keys-box {
  padding: 14px 16px; border-radius: 13px;
  background: rgba(255,255,255,.035); border: 1px solid var(--line);
}
.keys-box h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .14em; font-family: var(--mono); color: #8fb2ec; font-weight: 600; }
.keys-box .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #c2d2ee; margin-bottom: 7px; }
.keys-box .row:last-child { margin-bottom: 0; }
.keys-box kbd, .kbd {
  font-family: var(--mono); font-size: 11px; color: #eaf3ff; background: rgba(120,160,255,.16);
  border: 1px solid rgba(120,160,255,.3); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px;
  min-width: 22px; text-align: center; display: inline-block;
}
.tips { font-size: 12.5px; line-height: 1.9; color: #a8b9d9; }
.tips b { color: #e9f2ff; font-weight: 700; }
.tips .hl { color: #7fe3ff; font-weight: 700; }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.stat {
  padding: 14px 16px; border-radius: 13px; background: rgba(255,255,255,.035);
  border: 1px solid var(--line);
}
.stat .v { font-family: var(--mono); font-size: 26px; font-weight: 700; color: #eaf4ff; line-height: 1.1; }
.stat .k { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--dim); margin-top: 6px; text-transform: uppercase; }

.round-title { text-align: center; font-size: 15px; letter-spacing: .3em; color: #8fb2ec; font-family: var(--mono); }
.round-big {
  text-align: center; font-size: 62px; font-weight: 900; letter-spacing: .06em; margin: 12px 0 6px;
  background: linear-gradient(180deg, #fff, #ffd76a 60%, #ff9d2f);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 rgba(120,60,0,.5));
}
.round-big.lose { background: linear-gradient(180deg, #fff, #b9c8e8 60%, #7b8db3); filter: drop-shadow(0 4px 0 rgba(30,40,70,.6)); }
.round-sub { text-align: center; font-size: 13.5px; color: #a9bade; letter-spacing: .04em; }
.round-standings { display: flex; gap: 10px; justify-content: center; margin: 22px 0 4px; flex-wrap: wrap; }
.stand {
  display: flex; align-items: center; gap: 9px; padding: 8px 13px 8px 8px; border-radius: 11px;
  background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 12.5px;
}
.stand img { width: 26px; height: 26px; border-radius: 7px; background: rgba(255,255,255,.07); }
.stand .pts { font-family: var(--mono); font-weight: 700; font-size: 13px; margin-left: 3px; }
.stand.out { opacity: .42; }

/* ---------------- 设置面板（settings 屏内复用 chips） ---------------- */
.settings-card .setrow { margin-top: 16px; }
.settings-card .setrow:first-of-type { margin-top: 10px; }
.slider-row { display: flex; align-items: center; gap: 14px; }
input[type=range] {
  -webkit-appearance: none; appearance: none; height: 6px; flex: 1;
  background: linear-gradient(90deg, #5fd8ff var(--p, 50%), rgba(120,160,255,.18) var(--p, 50%));
  border-radius: 6px; outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%;
  background: #eaf6ff; border: 2px solid #4aa8ff; box-shadow: 0 2px 8px rgba(0,0,0,.4); cursor: pointer;
}
input[type=range]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: #eaf6ff; border: 2px solid #4aa8ff; cursor: pointer; }
.slider-val { font-family: var(--mono); font-size: 12px; color: #cfe0ff; min-width: 46px; text-align: right; }
.toggle { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; color: #c2d2ee; }
.toggle i {
  width: 40px; height: 22px; border-radius: 999px; background: rgba(120,160,255,.16);
  position: relative; transition: background .18s; border: 1px solid rgba(120,160,255,.2);
}
.toggle i::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #cfe0ff; transition: transform .18s, background .18s;
}
.toggle.on i { background: rgba(95,216,255,.5); border-color: rgba(95,216,255,.7); }
.toggle.on i::after { transform: translateX(18px); background: #fff; }

/* ---------------- 触屏操作层 ---------------- */
#touchLayer {
  position: fixed; inset: 0; z-index: 40;
  display: none; pointer-events: none;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#touchLayer.on { display: block; }
/* 摇杆热区：左手拇指自然落点，按下处即摇杆原点 */
.tl-zone {
  position: absolute; left: 0; bottom: 0;
  width: 58%; height: 56%;
  pointer-events: auto;
}
/* 菜单/暂停时收起操作控件，暂停键保持可点 */
#touchLayer.paused .tl-zone,
#touchLayer.paused .tl-bomb,
#touchLayer.paused .tl-ghost { display: none; }
/* 摇杆本体（视觉层，不接事件） */
.tl-base {
  position: fixed; left: -999px; top: -999px;
  width: 118px; height: 118px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1.5px solid rgba(150,200,255,.32);
  background: rgba(10,18,32,.30);
  opacity: 0; transition: opacity .12s;
  pointer-events: none;
}
.tl-base.on { opacity: 1; }
.tl-knob {
  position: absolute; left: 50%; top: 50%;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(232,242,255,.88);
  box-shadow: 0 2px 10px rgba(4,10,22,.45), inset 0 -3px 6px rgba(110,170,240,.35);
  transform: translate(-50%, -50%);
}
/* 首次进入的落点提示：淡入淡出的呼吸圈 */
.tl-ghost {
  position: absolute;
  left: calc(96px + env(safe-area-inset-left));
  bottom: calc(118px + env(safe-area-inset-bottom));
  width: 104px; height: 104px;
  border-radius: 50%;
  border: 1.5px dashed rgba(150,200,255,.30);
  pointer-events: none;
  animation: tlBreath 2.6s ease-in-out infinite;
}
.tl-ghost i {
  position: absolute; left: 50%; top: 50%;
  width: 40px; height: 40px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: rgba(180,215,255,.14);
}
.tl-ghost.gone { animation: tlFade .4s forwards; }
@keyframes tlBreath { 0%, 100% { opacity: .38; } 50% { opacity: .8; } }
@keyframes tlFade { to { opacity: 0; visibility: hidden; } }
/* 放泡大按钮 */
.tl-bomb {
  position: absolute;
  right: calc(26px + env(safe-area-inset-right));
  bottom: calc(38px + env(safe-area-inset-bottom));
  width: 86px; height: 86px;
  border-radius: 50%;
  border: 1.5px solid rgba(140,190,255,.42);
  background: rgba(10,18,32,.44);
  display: flex; align-items: center; justify-content: center;
  pointer-events: auto;
  transition: transform .08s, background .08s, border-color .08s;
}
.tl-bomb.press {
  transform: scale(.9);
  background: rgba(24,48,84,.62);
  border-color: rgba(190,225,255,.8);
}
/* 暂停键（暂停屏打开时仍可点，用于恢复） */
.tl-pause {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  right: calc(14px + env(safe-area-inset-right));
  width: 44px; height: 44px;
  border-radius: 11px;
  border: 1.5px solid rgba(140,190,255,.35);
  background: rgba(10,18,32,.44);
  display: flex; align-items: center; justify-content: center;
  pointer-events: auto;
  padding: 0;
  cursor: pointer;
  transition: background .12s;
}
.tl-pause:active { background: rgba(24,48,84,.62); }

/* ---------------- 矮屏（笔记本 720p/768p）紧凑排版 ---------------- */
@media (max-height: 1020px) {
  .title-logo .cn { font-size: 50px; }
  .screen .card { padding: 22px 26px 20px; }
  .setrow { margin-top: 13px; }
  .setrow .lbl { margin-bottom: 6px; }
  .chip { padding: 7px 12px; font-size: 12.5px; }
  .btnrow { margin-top: 16px; }
  .btn { padding: 11px 24px; font-size: 14px; }
  .btn.ghost { padding: 10px 18px; }
}
@media (max-height: 860px) {
  .screen .card { padding: 22px 26px 20px; }
  .title-logo .cn { font-size: 52px; }
  .title-logo .sub { margin-top: 10px; }
  .setrow { margin-top: 13px; }
  .setrow .lbl { margin-bottom: 6px; }
  .chip { padding: 7px 12px; font-size: 12.5px; }
  .chip.map { padding: 7px 10px; }
  .btnrow { margin-top: 16px; }
  .btn { padding: 11px 24px; font-size: 14px; }
  .btn.ghost { padding: 10px 18px; }
  .round-big { font-size: 48px; margin: 8px 0 4px; }
  .round-standings { margin: 14px 0 2px; }
  .stats-grid { gap: 8px; }
  .stat { padding: 10px 12px; }

      var dodge = dodgeCount(S, ax, ay, cx, cy, p.power);
      var v = dodge === 0 ? 1.4 : dodge === 1 ? 0.6 : 0.25;
      var s = w[i] * v;
      if (s > best) best = s;
    }
    return best;
  }

  /* ---------------- 道具价值 ---------------- */
  var ITEM_VALUE = {
    bomb: 3.0, power: 2.6, speed: 2.4, shield: 2.6, kick: 2.0,
    needle: 2.2, bombpass: 2.0, pierce: 2.0, magnet: 1.6, glove: 1.8
  };
  function itemValue(p, type) {
    var v = ITEM_VALUE[type] || 1.5;
    if (type === 'bomb' && p.maxBombs >= 5) v *= 0.6;
    if (type === 'power' && p.power >= 5) v *= 0.7;
    if (type === 'speed' && p.speed >= 5.2) v *= 0.6;
    return v;
  }

  /* ---------------- 目标选择 ---------------- */
  // 返回 {path, goal:[x,y], kind}
  function chooseGoal(S, p, ctx) {
    var me = ctx.me;
    var diff = ctx.diff;
    var dist = ctx.dist;                    // 距离场（格数）
    var danger = ctx.danger;
    var comps = ctx.comps;
    var myComp = comps.id[me[1] * W + me[0]];
    var mySize = comps.size[myComp] || 1;

    // --- 1) 敌人被泡泡困住 → 走过去戳破（直接淘汰） ---
    var foes = enemiesOf(S, p);
    var popTarget = null, popD = INF;
    for (var i = 0; i < foes.length; i++) {
      if (!foes[i].trapped) continue;
      var fx = Math.floor(foes[i].x), fy = Math.floor(foes[i].y);
      var d = dist[fy * W + fx];
      if (d >= 0 && d < popD) { popD = d; popTarget = [fx, fy]; }
    }
    if (popTarget && popD < 14) {
      return { path: pathFromDist(S, dist, popTarget[0], popTarget[1], me[0], me[1]), goal: popTarget, kind: 'pop' };
    }

    // --- 2) 敌人预判落点：从某格放泡能炸到他 ---
    //    找出"站上去放泡就能炸到预判点"的最佳站位
    var fuse = S.cfg.fuse || P.FUSE;
    var bestAim = null, bestAimScore = 0;
    for (var f = 0; f < foes.length; f++) {
      var e = foes[f];
      if (e.trapped) continue;
      var aim = predictPos(S, e, fuse);
      // 站位候选：与预判点同行/同列、且在威力内
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          if (!walkable(S, x, y)) continue;
          if (Math.abs(x - aim[0]) > p.power || Math.abs(y - aim[1]) > p.power) continue;
          if (x !== aim[0] && y !== aim[1]) continue;         // 必须同行或同列
          if (!canHit(S, x, y, aim[0], aim[1], p.power)) continue;
          var dd = dist[y * W + x];
          if (dd < 0) continue;
          if (danger[y * W + x] > 0) continue;                 // 站位本身不安全
          // 分越高越优先：只认"有把握"的机会，不做无用追人
          var eDist = Math.abs(e.x - (x + 0.5)) + Math.abs(e.y - (y + 0.5));
          var score = 0;
          // 敌人无路可躲 → 这位置能一击致命
          if (dodgeCount(S, aim[0], aim[1], x, y, p.power) === 0) score += 8;
          // 走廊封路位：敌人被堵在尽头，一泡一个准
          if (corridorKillAt(S, x, y, e, fuse) > 0) score += 12;
          if (foeCommitted(S, p, e)) score += 4;      // 对方方向明确，预判可信
          score += Math.max(0, 12 - eDist) * 0.5;    // 离得近一点
          score += Math.max(0, 10 - dd) * 0.3;       // 自己别跑太远
          if (score > bestAimScore) { bestAimScore = score; bestAim = [x, y]; }
        }
      }
    }
    if (bestAim && bestAimScore > diff.huntScore) {
      return { path: pathFromDist(S, dist, bestAim[0], bestAim[1], me[0], me[1]), goal: bestAim, kind: 'hunt' };
    }

    // --- 3) 道具 ---
    var bestItem = null, bestItemScore = 0;
    for (var it = 0; it < S.items.length; it++) {
      var item = S.items[it];
      var ix = Math.floor(item.x), iy = Math.floor(item.y);
      var idist = dist[iy * W + ix];
      if (idist < 0) continue;
      if (danger[iy * W + ix] > 0) continue;
      var val = itemValue(p, item.type);
      var sc = val * 6 / (idist + 2.5);
      if (sc > bestItemScore) { bestItemScore = sc; bestItem = [ix, iy]; }
    }
    if (bestItem && bestItemScore > diff.itemScore) {
      return { path: pathFromDist(S, dist, bestItem[0], bestItem[1], me[0], me[1]), goal: bestItem, kind: 'item' };
    }

    // --- 4) 区域太小 → 找能炸开、连通更大区域的软箱 ---
    if (mySize < diff.roomWant) {
      var bestBox = null, bestBoxGain = 0;
      for (var by = 0; by < H; by++) {
        for (var bx = 0; bx < W; bx++) {
          if (S.grid[by][bx] !== 2) continue;
          // 炸掉它之后能连到多大的区域
          var gain = 0, seenC = {};
          for (var di = 0; di < 4; di++) {
            var nx = bx + DIRS[di][0], ny = by + DIRS[di][1];
            if (!inb(nx, ny)) continue;
            if (!walkable(S, nx, ny)) continue;
            var cid = comps.id[ny * W + nx];
            if (seenC[cid]) continue;
            seenC[cid] = 1;
            gain += comps.size[cid] || 0;
          }
          var g2 = gain - mySize;
          if (g2 <= bestBoxGain) continue;
          // 站到箱子旁边
          var stand = null;
          for (var di2 = 0; di2 < 4; di2++) {
            var sx2 = bx + DIRS[di2][0], sy2 = by + DIRS[di2][1];
            if (!walkable(S, sx2, sy2)) continue;
            if (comps.id[sy2 * W + sx2] !== myComp) continue;   // 必须在自己的区域内
            var sd = dist[sy2 * W + sx2];
            if (sd < 0) continue;
            if (!stand || sd < stand[1]) stand = [sx2, sy2, sd];
          }
          if (!stand) continue;
          bestBoxGain = g2; bestBox = [stand[0], stand[1], bx, by];
        }
      }
      if (bestBox) {
        return { path: pathFromDist(S, dist, bestBox[0], bestBox[1], me[0], me[1]), goal: [bestBox[0], bestBox[1]], kind: 'open', box: [bestBox[2], bestBox[3]] };
      }
    }

    // --- 5) 游走：挑一个大区域里的远处安全格 ---
    var bestW = null, bestWDist = -1;
    for (var tries = 0; tries < 26; tries++) {
      var rx = 1 + Math.floor(rnd(p.ai) * (W - 2));
      var ry = 1 + Math.floor(rnd(p.ai) * (H - 2));
      if (!walkable(S, rx, ry)) continue;
      var rk = ry * W + rx;
      if (dist[rk] < 0) continue;
      if (danger[rk] > 0) continue;
      var csize = comps.size[comps.id[rk]] || 0;
      var score2 = dist[rk] * 0.5 + csize * 0.35;
      if (score2 > bestWDist) { bestWDist = score2; bestW = [rx, ry]; }
    }
    if (bestW) {
      return { path: pathFromDist(S, dist, bestW[0], bestW[1], me[0], me[1]), goal: bestW, kind: 'roam' };
    }
    // 兜底：待在原地
    return { path: null, goal: me, kind: 'idle' };
  }

  /* ---------------- 主决策 ---------------- */
  function think(S, p, dt) {
    if (!p.alive || p.trapped) { p.wantDir = null; p.wantBomb = false; return; }
    var ai = p.ai;
    var diff = ai.diff;
    ai.t = (ai.t || 0) + dt;
    ai.replan = (ai.replan || 0) - dt;
    ai.bombCd = (ai.bombCd || 0) - dt;

    var me = tileOf(p);
    var danger = dangerMap(S);
    var myDanger = danger[me[1] * W + me[0]];
    updateFoeMemory(S, p, ai);

    // ---------- 危险：全力逃生 ----------
    if (myDanger > 0) {
      // 刚从安全切到危险：立刻重算路线，不能沿用旧的游走路径
      var justEntered = ai.mode !== 'flee';
      ai.mode = 'flee';
      if (justEntered || ai.replan <= 0 || !ai.path || !ai.path.length) {
        ai.replan = 0.08;
        var esc = escapeSearch(S, p, danger, me, { margin: 0.20, noDeadEnd: true });
        if (!esc || !esc.path || !esc.path.length) {
          esc = escapeSearch(S, p, danger, me, { margin: 0.20 });
        }
        ai.path = esc ? esc.path : null;
        ai.escapeSafe = esc ? esc.safe : false;
      }
      var fdir = steer(p, ai.path);
      if (!fdir && ai.path && ai.path.length) { ai.path = null; ai.replan = 0; }
      if (!fdir && !ai.path) fdir = desperateMove(S, p, danger, me);  // 没路也要挪窝
      p.wantDir = fdir;
      p.wantBomb = false;
      // 逃生中不乱转：只允许"清路径重规划"
      noteStuck(S, p, ai, dt, false);
      return;
    }

    // ---------- 安全：规划 ----------
    ai.mode = 'safe';
    var dir = null;
    // 走到目标/路径失效就立刻换目标，绝不站着发呆
    for (var tries = 0; tries < 2; tries++) {
      if (ai.replan <= 0 || !ai.path || !ai.path.length) {
        planGoal(S, p, ai, danger, me, diff);
        ai.replan = diff.replan;
      }
      dir = steer(p, ai.path);
      if (dir) break;
      if (ai.path && ai.path.length) ai.path = null;   // 路径失效 → 重规划
      else ai.replan = 0;                              // 走到头了 → 立刻换目标
    }
    p.wantDir = dir;

    // ---------- 放泡决策 ----------
    var wantBomb = false;
    if (ai.bombCd <= 0 && p.activeBombs < p.maxBombs) {
      wantBomb = decideBomb(S, p, ai, danger, me);
    }
    p.wantBomb = wantBomb;
    noteStuck(S, p, ai, dt, true);
  }

  // 规划一条新路线：区域分析 + 距离场 + 目标选择
  function planGoal(S, p, ai, danger, me, diff) {
    var comps = components(S);
    var dist = distField(S, me[0], me[1], { avoidBomb: true, danger: danger });
    var plan = chooseGoal(S, p, {
      me: me, danger: danger, comps: comps, dist: dist, diff: diff
    });
    ai.path = plan && plan.path ? plan.path : null;
    ai.goal = plan ? plan.goal : me;
    ai.goalKind = plan ? plan.kind : 'idle';
    ai.boxGoal = plan ? (plan.box || null) : null;
  }

  // 绝境兜底：没有可用路线时，至少往"最晚爆炸"的方向挪一格，别站着等死
  function desperateMove(S, p, danger, me) {
    var best = null, bestT = -1;
    for (var di = 0; di < 4; di++) {
      var nx = me[0] + DIRS[di][0], ny = me[1] + DIRS[di][1];
      if (!walkable(S, nx, ny)) continue;
      if (bombAt(S, nx, ny)) continue;
      var t = danger[ny * W + nx];
      if (t > bestT) { bestT = t; best = ['up', 'right', 'down', 'left'][di]; }
    }
    return best;
  }

  // 卡住检测：想走却走不动 → 换方向重来
  function noteStuck(S, p, ai, dt, allowNudge) {
    var moved = Math.abs(p.x - (ai.lx == null ? p.x : ai.lx)) +
                Math.abs(p.y - (ai.ly == null ? p.y : ai.ly));
    ai.lx = p.x; ai.ly = p.y;
    if (moved < 0.012) ai.stuck = (ai.stuck || 0) + dt;
    else ai.stuck = 0;
    if (ai.stuck > 0.35) {
      ai.path = null; ai.replan = 0; ai.stuck = 0;
      if (!allowNudge) return;
      // 蹭一下别的方向，脱离墙角
      var cur = tileOf(p);
      var opts = [];
      for (var di = 0; di < 4; di++) {
        var nx = cur[0] + DIRS[di][0], ny = cur[1] + DIRS[di][1];
        if (walkable(S, nx, ny)) opts.push(['up', 'right', 'down', 'left'][di]);
      }
      if (opts.length) p.wantDir = opts[Math.floor(rnd(ai) * opts.length)];
    }
  }

  // 该不该在此刻放泡：能炸到人 / 能炸开通路 / 有敌人在旁边
  function decideBomb(S, p, ai, danger, me) {
    var diff = ai.diff;
    var fuse = S.cfg.fuse || P.FUSE;
    var foes = enemiesOf(S, p);

    // 1) 能炸到预判位置 → 放（这是"堵人"）
    var hitChance = 0;
    var aimSet = {};
    for (var i = 0; i < foes.length; i++) {
      var e = foes[i];
      if (e.trapped) continue;
      var kc = killChance(S, p, e, fuse);
      if (kc > hitChance) hitChance = kc;
      var aim = predictPos(S, e, fuse);
      aimSet[aim[0] + ',' + aim[1]] = 1;
    }
    var killVal = hitChance * diff.killWeight;

    // 2) 炸软箱：当前目标就是箱子，或旁边有箱子
    var boxVal = 0;
    for (var di = 0; di < 4; di++) {
      var nx = me[0] + DIRS[di][0], ny = me[1] + DIRS[di][1];
      if (!inb(nx, ny)) continue;
      if (S.grid[ny][nx] === 2) { boxVal += diff.boxWeight; break; }
    }
    // 目标本身是箱子（站在旁边准备炸）→ 直接炸
    if (ai.boxGoal && ai.goalKind === 'open') {
      var bx = ai.boxGoal[0], by = ai.boxGoal[1];
      if (Math.abs(bx - me[0]) + Math.abs(by - me[1]) === 1) boxVal += diff.boxWeight * 1.6;
    }
    // 踩在炸弹+1/威力道具旁边也值得炸
    for (var it = 0; it < S.items.length; it++) {
      var item = S.items[it];
      if (Math.abs(item.x - (me[0] + 0.5)) < 1.2 && Math.abs(item.y - (me[1] + 0.5)) < 1.2) {
        boxVal += diff.boxWeight * 0.5;
        break;
      }
    }

    // 3) 敌人在旁边 → 偶尔堵
    var nearEnemy = false;
    for (var f = 0; f < foes.length; f++) {
      var o = foes[f];
      if (Math.abs(o.x - p.x) + Math.abs(o.y - p.y) < 2.6) { nearEnemy = true; break; }
    }
    var aggr = (nearEnemy ? diff.aggr : 0) * 0.5;

    var score = killVal + boxVal + aggr + (rnd(ai) - 0.5) * diff.noise;
    if (score < diff.bombScore) return false;

    // 关键：放完必须跑得掉
    if (!canEscape(S, p, me[0], me[1])) return false;
    ai.bombCd = diff.bombCd;
    ai.path = null; ai.replan = 0;
    ai.lastKillAim = aimSet;
    ai.bombReason = killVal >= boxVal ? 'kill' : 'box';
    if (ai.bombReason === 'kill') ai.bombKillN = (ai.bombKillN || 0) + 1;
    else ai.bombBoxN = (ai.bombBoxN || 0) + 1;
    return true;
  }

  /* ---------------- 难度档 ---------------- */
  BA.AI = {
    think: think,
    dangerMap: dangerMap,
    bfs: bfs,
    canEscape: canEscape,
    escapeSearch: escapeSearch,
    components: components,
    DIFF: {
      // replan 决策间隔(s) / bombCd 放泡冷却 / aggr 侵略性 / hunt 追人倾向
      // killWeight 击杀权重 / boxWeight 炸箱权重 / bombScore 放泡阈值 / roomWant 想要多大区域
      easy: {
        replan: 0.34, bombCd: 2.0, aggr: 0.25, hunt: 0.2, itemRange: 6,
        speedMul: 0.84, mistake: 0.22, mashRate: 3,
        killWeight: 0.8, boxWeight: 0.7, bombScore: 1.15, noise: 0.5,
        huntScore: 12, itemScore: 1.1, roomWant: 26
      },
      normal: {
        replan: 0.16, bombCd: 1.3, aggr: 0.6, hunt: 0.6, itemRange: 10,
        speedMul: 0.97, mistake: 0.06, mashRate: 11,
        killWeight: 1.3, boxWeight: 1.0, bombScore: 0.95, noise: 0.25,
        huntScore: 10, itemScore: 0.9, roomWant: 20
      },
      hard: {
        replan: 0.08, bombCd: 0.75, aggr: 0.9, hunt: 0.9, itemRange: 14,
        speedMul: 1.0, mistake: 0, mashRate: 17,
        killWeight: 1.8, boxWeight: 1.2, bombScore: 0.75, noise: 0.1,
        huntScore: 8, itemScore: 0.7, roomWant: 16
      }
    }
  };
})(window);

  var DIR_NAMES = ['up', 'right', 'down', 'left'];

  var THEME_ORDER = ['blue', 'pink', 'green', 'violet'];
