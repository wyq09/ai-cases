<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SUNSET RIDE · 日落摩托</title>
<style>
  :root {
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --panel: #2a1420;
    --panel-bd: #4a2432;
    --amber: #ffd23f;
    --paper: #f5f0e6;
    --crt-i: 0.55;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #app { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: #000; }
  canvas#game {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  /* ---- CRT 覆盖层：扫描线 + 暗角 ---- */
  #crt {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background:
      radial-gradient(ellipse 130% 105% at 50% 48%, transparent 58%, rgba(0,0,0,.42) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0 1px, transparent 1px 3px);
    opacity: var(--crt-i);
  }
  #crt.off { display: none; }

  /* ---- 触控按钮 ---- */
  #ui { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  #ui button {
    pointer-events: auto; border: 2px solid var(--panel-bd); background: rgba(42,20,32,.82);
    color: var(--paper); font-family: inherit; font-weight: 700; letter-spacing: 1px;
    cursor: pointer; border-radius: 4px;
  }
  #ui button:active { transform: translateY(2px); filter: brightness(1.25); }
  #btn-brake, #btn-nitro {
    position: absolute; bottom: calc(14px + var(--safe-b));
    width: 88px; height: 72px; font-size: 15px; display: none; align-items: center; justify-content: center;
  }
  #btn-brake { left: calc(14px + env(safe-area-inset-left, 0px)); color: #ffb0a0; }
  #btn-nitro { right: calc(14px + env(safe-area-inset-right, 0px)); color: var(--amber); border-color: #6b4a1e; }
  #btn-nitro .sub, #btn-brake .sub { display: block; font-size: 10px; opacity: .75; letter-spacing: 0; }
  body.state-racing.touch #btn-brake, body.state-racing.touch #btn-nitro { display: flex; }
  #btn-pause, #btn-gear {
    position: absolute; top: calc(10px + var(--safe-t)); width: 38px; height: 38px;
    font-size: 15px; line-height: 1; display: none; align-items: center; justify-content: center;
  }
  #btn-pause { right: calc(10px + var(--safe-t) + env(safe-area-inset-right, 0px)); }
  #btn-gear  { right: calc(56px + var(--safe-t) + env(safe-area-inset-right, 0px)); }
  body.state-racing #btn-pause { display: flex; }
  body.state-title #btn-gear, body.state-racing #btn-gear { display: flex; }
  /* 车库色块（标题画面） */
  #swatches { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(52px + var(--safe-b)); display: none; gap: 12px; }
  body.state-title.touch #swatches { display: flex; }
  #swatches button { width: 30px; height: 30px; padding: 0; border-radius: 4px; }
  #swatches button.sel { outline: 2px solid var(--paper); outline-offset: 2px; }

  /* ---- 对话框（暂停/结算/时间到） ---- */
  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10,4,10,.62); z-index: 20; padding: 20px;
  }
  #overlay.show { display: flex; }
  .dlg {
    width: 100%; max-width: 340px; background: var(--panel); border: 2px solid var(--panel-bd);
    border-radius: 4px; padding: 20px 18px 16px; color: var(--paper); text-align: center;
  }
  .dlg h1 { font-size: 22px; color: var(--amber); letter-spacing: 2px; margin-bottom: 6px; }
  .dlg .sub { font-size: 12px; opacity: .8; line-height: 1.7; margin-bottom: 12px; }
  .btns { display: flex; flex-direction: column; gap: 8px; }
  .mbtn {
    height: 42px; border: 2px solid var(--panel-bd); background: #3a1c2c; color: var(--paper);
    font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; border-radius: 4px;
  }
  .mbtn:active { filter: brightness(1.3); }
  .mbtn.primary { background: #7a5a10; border-color: #8a6a20; color: #ffe98a; }

  /* ---- toast / 面板宿主 ---- */
  #toast {
    position: absolute; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translateX(-50%) translateY(12px);
    background: rgba(42,20,32,.94); color: var(--paper); font-size: 13px; padding: 8px 16px;
    border: 1px solid var(--panel-bd); border-radius: 4px; opacity: 0; transition: all .22s;
    pointer-events: none; z-index: 40; white-space: nowrap; max-width: 86%;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #panelHost { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
  #panelHost > * { pointer-events: auto; }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="crt"></div>
  <div id="ui">
    <button id="btn-brake" aria-label="刹车"><span>BRAKE<span class="sub">刹车</span></span></button>
    <button id="btn-nitro" aria-label="氮气"><span>NITRO<span class="sub">氮气</span></span></button>
    <button id="btn-gear" aria-label="设置">⚙</button>
    <button id="btn-pause" aria-label="暂停">II</button>
    <div id="swatches"></div>
  </div>
  <div id="overlay"></div>
  <div id="panelHost"></div>
  <div id="toast"></div>
</div>
<!-- MODULE_SCRIPTS -->
</body>
</html>
