ht:100%;width:0;background:linear-gradient(#dccc72,#7b962f);transition:width .3s}.bottom{position:absolute;left:36px;right:36px;bottom:20px;display:flex;justify-content:space-between;align-items:flex-end}.logo{font-size:35px;font-weight:bold;letter-spacing:8px;color:#e2c16e;text-shadow:2px 3px #24140a}.logo small{font-size:10px;letter-spacing:5px;display:block;color:#b99559;margin-top:3px}.hint{font-family:'Songti SC',serif;font-size:13px;color:#c7aa79;margin:10px 0 0}.tools{display:flex;gap:16px;align-items:center}.tool{position:relative;background:none;border:0;padding:0;min-width:60px;text-align:center}.tool-disc{display:grid;place-items:center;width:54px;height:54px;border:4px ridge #c09a51;border-radius:50%;background:radial-gradient(at 35% 25%,#8b8047,#314428 70%,#182214);box-shadow:0 3px 0 #25150b;font-size:26px;font-weight:bold;margin:auto}.tool-label{font-size:12px;letter-spacing:2px;margin-top:5px;display:block}.tool-count{position:absolute;top:-4px;right:0;min-width:21px;height:21px;line-height:19px;background:#54220f;border:1px solid #cda65a;border-radius:50%;font-size:12px}.tool.selected .tool-disc{outline:3px solid #fae28b}.tool:disabled{opacity:.4;cursor:default}.tool svg{width:27px;height:27px;stroke:#efdc9f;stroke-width:2;fill:none}#banner{position:absolute;left:50%;top:26%;transform:translate(-50%,-8px);white-space:nowrap;background:linear-gradient(90deg,transparent,#291b10e8 20%,#291b10e8 80%,transparent);padding:14px 65px;font-size:24px;letter-spacing:3px;opacity:0;transition:opacity .4s,transform .4s;color:#ffe49a;text-shadow:0 2px #3d260a}#banner.show{opacity:1;transform:translate(-50%,0)}#overlay{position:fixed;inset:0;background:#100b08bd;display:grid;place-items:center;padding:20px;z-index:10;backdrop-filter:blur(3px)}#overlay[hidden]{display:none}.dialog{width:min(430px,94vw);padding:30px 28px 24px;border:6px ridge #b38e4c;background:radial-gradient(at 50% 0%,#715331,#3b2818);box-shadow:0 14px 60px #0009;text-align:center}.ornament{color:#c </style></head><body><canvas id="game" aria-label="祖玛游戏区域，瞄准珠链后点击发射，空格换球"></canvas><div id="board-ui"><header class="hud"><div class="level-group"><div class="level-medallion" id="level">1</div><div><span class="eyebrow">无尽旅程</span><strong id="level-name">失落神庙</strong></div></div><div><div class="score-label">SCORE</div><div class="score" id="score">000000</div></div><div class="top-actions"><div class="best">最高纪录<br><span id="best">0</span></div><button class="icon-button" id="settings" aria-label="游戏设置">⚙</button><button class="icon-button" id="pause" aria-label="暂停游戏">Ⅱ</button></div></header><div class="progress-wrap"><div class="progress-track" role="progressbar" aria-label="关卡消除进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div><span id="remaining"></span></div><div id="banner" aria-live="polite"></div><footer class="bottom"><div><div class="logo">祖玛<small>无 尽 遗 迹</small></div><p class="hint">瞄准后松手发射<br>点击青蛙或空格换球</p></div><div class="tools"><button class="tool" id="swap" aria-label="交换当前球和下一球"><span class="tool-disc"><svg viewBox="0 0 32 32"><path d="M5 11h21l-6-6M27 21H6l6 6"/></svg></span><span class="tool-label">换球</span></button><button class="tool" id="bomb" aria-label="装填爆破弹"><span class="tool-disc"><svg viewBox="0 0 32 32"><circle cx="14" cy="19" r="9"/><path d="m19 11 4-5 4 1M24 2l2 3M29 5l-2 2"/></svg></span><span class="tool-count" id="bomb-count">2</span><span class="tool-label">爆破</span></button><button class="tool" id="slow" aria-label="减慢珠链8秒"><span class="tool-disc"><svg viewBox="0 0 32 32"><circle cx="16" cy="17" r="11"/><path d="M16 8v10l6 3M11 2h10M16 2v4"/></svg></span><span class="tool-count" id="slow-count">2</span><span class="tool-label">缓行</span></button></div></footer></div><div id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="ornament">◇ ◆ ◇</div><h1 id="dialog-title">暂停片刻</h1><p id="dialog-message"></p><p id="result"></p><div id="settings-fields" hidden><label class="setting-row">瞄准辅助线<input id="aim-toggle" type="checkbox" checked></label><label class="setting-row">触觉反馈<input id="vibration-toggle" type="checkbox" checked></label><div class="setting-buttons"><button class="stone secondary" id="sound">声音开</button><button class="stone secondary" id="auto">自动演示</button></div><p style="font-size:12px">每关各有 2 次免费道具，无广告。<br>进度自动保存，横竖屏切换不会重开。</p></div><div class="dialog-actions"><button class="stone" id="resume">继续游戏</button><button class="stone secondary" id="restart">重玩本关</button></div></section></div><!-- MODULE_SCRIPTS --></body></html>
