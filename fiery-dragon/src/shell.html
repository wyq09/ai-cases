<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FIERY DRAGON · 火龙珠水果机</title>
<meta name="description" content="经典街机火龙珠水果机 1:1 H5 复刻 · 押注跑灯 · 比倍猜大小 · JACKPOT">
<style>
/* ============ 基础 ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0405}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
svg{display:block}

/* ============ 舞台缩放（750×1610 设计坐标系） ============ */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 30%,#24100e 0%,#140708 55%,#0a0304 100%)}
#stage{position:relative;width:750px;height:1610px;flex:none;transform-origin:center center}

/* ============ 机箱 ============ */
#machine{position:absolute;inset:0;border-radius:36px;overflow:hidden;
  background:
    radial-gradient(140% 60% at 50% 0%,rgba(255,120,60,.10),transparent 60%),
    repeating-linear-gradient(97deg,rgba(0,0,0,.14) 0 3px,rgba(0,0,0,0) 3px 9px),
    linear-gradient(180deg,#6d201a 0%,#54150f 18%,#43110c 55%,#3a0d09 82%,#2a0906 100%);
  box-shadow:inset 0 0 140px rgba(0,0,0,.75), inset 0 0 0 2px #1c0605, 0 30px 80px rgba(0,0,0,.8)}
/* 机头暗腔 */
#headCavity{position:absolute;left:36px;right:36px;top:118px;height:196px;border-radius:22px;z-index:1;
  background:linear-gradient(180deg,#1c0806,#2e0d08 70%,#200a06);
  box-shadow:inset 0 8px 24px rgba(0,0,0,.85),inset 0 -2px 0 rgba(255,140,80,.12)}
#archGlow{position:absolute;left:80px;right:80px;top:126px;height:70px;border-radius:35px;
  background:radial-gradient(60% 160% at 50% 100%,rgba(255,90,40,.4),rgba(120,20,8,.1) 70%,transparent);filter:blur(2px)}
/* 机身灯泡跑马 */
.bulb{position:absolute;width:13px;height:13px;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 35% 30%,#ffe9b0,#ffb23e 55%,#a83c08 100%);
  box-shadow:0 0 10px 2px rgba(255,150,40,.55);
  animation:bulbBlink 1.4s ease-in-out infinite}
@keyframes bulbBlink{0%,100%{filter:brightness(1.25)}50%{filter:brightness(.4)}}
.winner .bulb{animation-duration:.28s}
.lucky .bulb{animation-duration:.45s}

/* ============ 顶部：菜单 / LED跑马屏 / info ============ */
.corner-btn{position:absolute;top:158px;width:62px;height:58px;border:none;border-radius:14px;z-index:20;cursor:pointer;
  background:linear-gradient(180deg,#5a4a3a,#33261c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 8px rgba(0,0,0,.5),0 0 0 2px #1c110a;
  display:flex;align-items:center;justify-content:center;color:#e8d9b0;font-size:30px;font-weight:700}
.corner-btn:active{transform:translateY(2px)}
#menuBtn{left:22px}#infoBtn{right:22px;font-size:26px;font-style:italic;font-family:Georgia,serif}
#marqueeNest{position:absolute;left:150px;right:150px;top:150px;height:104px;z-index:2;
  border-radius:16px;padding:9px;
  background:linear-gradient(180deg,#2e0f0b,#200a07);
  box-shadow:inset 0 4px 14px rgba(0,0,0,.9),0 1px 0 rgba(255,160,90,.15)}
#ticker{position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;
  background:radial-gradient(120% 160% at 50% 50%,#5e1006 0%,#3f0a04 55%,#2a0602 100%);
  box-shadow:inset 0 0 30px rgba(0,0,0,.85),inset 0 4px 16px rgba(255,60,20,.25)}
#ticker::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background-image:radial-gradient(rgba(40,4,2,.55) 34%,transparent 38%);background-size:5px 5px}
#tickerText{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;will-change:transform;
  font-family:"Courier New",monospace;font-weight:700;font-size:42px;letter-spacing:6px;color:#ff5533;
  text-shadow:0 0 10px rgba(255,90,40,1),0 0 26px rgba(255,70,25,.75)}

/* ============ LED 计分行 ============ */
#ledRow{position:absolute;left:45px;right:45px;top:312px;height:104px;display:flex;justify-content:space-between;z-index:4}
.led-group{width:306px}
.led-label{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:21px;letter-spacing:2px;
  color:#e8d9b8;text-shadow:0 1px 3px #000;text-align:center;margin-bottom:4px}
.led-frame{height:78px;border-radius:10px;padding:7px;
  background:linear-gradient(180deg,#8a744c,#5f4c2e 40%,#83704a);
  box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,230,170,.4)}
.led-inner{width:100%;height:100%;border-radius:6px;background:linear-gradient(180deg,#4a5026,#333818 70%,#2a2e12);
  box-shadow:inset 0 3px 12px rgba(0,0,0,.85),inset 0 -2px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:3px}
.led-inner.flash{animation:ledFlash .5s steps(2) 3}
@keyframes ledFlash{50%{filter:brightness(1.8)}}

/* ============ 主板（灯环+中央） ============ */
#board{position:absolute;left:45px;top:424px;width:660px;height:648px;z-index:4;
  background:linear-gradient(160deg,#e8dcb4,#d8c896);border-radius:8px;
  box-shadow:0 4px 10px rgba(0,0,0,.55),inset 0 0 0 3px #b8a26c}
.cell{position:absolute;border-radius:6px;overflow:hidden;
  background:linear-gradient(160deg,#f4ebcd 0%,#ecdfba 60%,#dfcfa4 100%);
  box-shadow:inset 0 0 0 2px #cdbb90, inset 0 -6px 12px rgba(120,90,40,.28), 0 2px 3px rgba(0,0,0,.55)}
.cell .sym{position:absolute;inset:10% 12% 20%;display:flex;align-items:center;justify-content:center}
.cell .sym svg{width:100%;height:100%}
.cell .x3{position:absolute;left:0;right:0;bottom:1px;text-align:center;
  font-family:Georgia,serif;font-weight:900;font-size:25px;letter-spacing:1px;color:#26221a;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.cellbar{position:absolute;left:6%;right:6%;top:12%;text-align:center}
.cellbar .b{display:block;background:#101010;color:#fff;padding:1px 3px;margin:0 auto 2px;width:max-content;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:20px;line-height:1.02;letter-spacing:.5px}
.cellbar .m{display:block;background:#101010;color:#ffd23e;padding:1px 3px;margin:0 auto;width:max-content;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:20px;line-height:1.02;letter-spacing:.5px}
/* 灯亮 —— 原图级强光：整格橙金透光+外辉光 */
.cell.lit{z-index:5;filter:brightness(1.12);box-shadow:inset 0 0 0 2px #ffdf8e, inset 0 -6px 12px rgba(255,160,30,.4), 0 0 28px 10px rgba(255,150,30,.8), 0 0 64px 22px rgba(255,110,10,.42)}
.cell.lit::after{content:"";position:absolute;inset:0;border-radius:6px;
  background:radial-gradient(115% 115% at 50% 45%,rgba(255,250,215,.97) 0%,#ffdb70 32%,#ffab2e 58%,#ff7010 100%);
  animation:cellPulse .5s ease-in-out infinite alternate}
.cell.lit .sym,.cell.lit .x3{z-index:2;filter:drop-shadow(0 0 9px rgba(200,70,0,.9)) contrast(1.05)}
@keyframes cellPulse{from{opacity:.88}to{opacity:1}}
/* 中奖格爆闪 */
.cell.hitwin{box-shadow:inset 0 0 0 2px #fff3c4, 0 0 40px 14px rgba(255,170,30,.95), 0 0 90px 30px rgba(255,120,0,.5)}
.cell.hitwin::after{background:radial-gradient(95% 95% at 50% 45%,#fffdf2 0%,#ffe066 35%,#ffab1f 65%,#ff6a00 100%);animation:hitBlink .14s steps(2) infinite}
@keyframes hitBlink{50%{opacity:.2}}
/* LUCK 触发闪烁 */
.cell.hitluck{box-shadow:inset 0 0 0 2px #d8f6ff, 0 0 34px 12px rgba(70,200,255,.85), 0 0 80px 26px rgba(30,150,255,.45)}
.cell.hitluck::after{background:radial-gradient(90% 90% at 50% 45%,#f2fcff 0%,#7adcff 40%,#1e9fe0 100%);animation:hitBlink .2s steps(2) infinite}
/* 待机巡游微亮 */
.cell.attract::after{content:"";position:absolute;inset:0;border-radius:6px;
  background:radial-gradient(80% 80% at 50% 50%,rgba(255,220,130,.5),transparent 75%);animation:cellPulse .5s ease-in-out infinite alternate}

/* ============ 中央画面 ============ */
#center{position:absolute;left:96px;top:96px;width:468px;height:456px;border-radius:8px;overflow:hidden;
  box-shadow:0 0 0 4px #b89a5e,0 0 0 6px #6d5426,0 6px 18px rgba(0,0,0,.6);z-index:6;background:#5e3a68}
#sceneHolder{position:absolute;inset:0}
#sceneHolder svg{width:100%;height:100%}
#jpCoin{position:absolute;left:50%;top:37%;width:86px;height:86px;transform:translate(-50%,-50%);z-index:3;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
#jpCoin svg{width:100%;height:100%}
#jpCoin.jpburst{animation:jpSpin .5s ease-in-out infinite}
@keyframes jpSpin{50%{transform:translate(-50%,-50%) scale(1.14) rotate(8deg)}}
#jpTag{position:absolute;left:50%;top:49.5%;transform:translateX(-50%);z-index:3;
  background:rgba(20,8,4,.72);border:1px solid #caa14e;border-radius:8px;padding:1px 9px;
  color:#ffd23e;font-size:15px;font-weight:700;letter-spacing:1px;font-family:Georgia,serif;white-space:nowrap}
/* 中央 LED（比倍额） */
#centerLED{position:absolute;left:50%;top:59%;transform:translateX(-50%);z-index:9;width:128px;height:52px;
  border-radius:8px;background:linear-gradient(180deg,#151008,#0a0703);border:2px solid #241a10;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.9),0 1px 0 rgba(255,220,150,.25);
  display:flex;align-items:center;justify-content:center}
/* 比倍轮盘覆盖层 */
#wheel{position:absolute;inset:0;z-index:8;display:none;background:radial-gradient(80% 80% at 50% 42%,rgba(28,8,40,.94),rgba(10,2,14,.97));
  align-items:center;justify-content:center}
#wheel.show{display:flex}
#wheelDisc{position:relative;width:400px;height:400px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 42%,#3a1440,#1c0a24 70%);
  box-shadow:0 0 0 6px #c9a24e,0 0 0 10px #59401c,0 10px 40px rgba(0,0,0,.8),inset 0 0 60px rgba(0,0,0,.6)}
.wnum{position:absolute;width:64px;height:44px;margin:-22px 0 0 -32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:26px;color:#ffd985;
  background:linear-gradient(180deg,#4b2c10,#2c1808);box-shadow:inset 0 0 0 2px #8a6428,0 2px 4px rgba(0,0,0,.6)}
.wnum.seven{color:#ff6a4d}
.wnum.lit{background:linear-gradient(180deg,#ffd23e,#e88a10);color:#4a1d02;box-shadow:0 0 22px 4px rgba(255,180,40,.75),inset 0 0 0 2px #fff0c0}
.wnum.kill{background:linear-gradient(180deg,#7a1410,#3f0806)}
#wheelTip{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;color:#ffe9b0;font-weight:800;font-size:27px;letter-spacing:2px;text-shadow:0 2px 6px #000;z-index:2;width:240px}
#wheelTip small{display:block;font-size:15px;color:#d9b98a;margin-top:8px;letter-spacing:1px;font-weight:400}

/* ============ 按钮排 ============ */
#controls{position:absolute;left:26px;right:26px;top:1086px;height:130px;z-index:8;
  display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.pbtn{border:none;cursor:pointer;position:relative;flex:none;
  transition:transform .06s ease,filter .06s ease}
.pbtn:active,.pbtn.down{transform:translateY(4px);filter:brightness(1.12)}
.pbtn .cap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:Arial Black,Arial,sans-serif;font-weight:900;letter-spacing:1px;text-shadow:0 2px 2px rgba(0,0,0,.35)}
.pbtn:disabled{filter:saturate(.3) brightness(.65);cursor:default}
.pbtn:disabled:active{transform:none}
/* ALL+1 圆钮 */
#btnAll{width:104px;height:104px;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#b9e078 0%,#8bc34a 45%,#4e7a23 100%);
  box-shadow:0 7px 0 #2c4a12,0 10px 14px rgba(0,0,0,.6),inset 0 2px 6px rgba(255,255,255,.5)}
#btnAll .cap{color:#1d3a08;font-size:26px;line-height:1.1;text-align:center;flex-direction:column}
/* 箭头方块 */
.arw{width:94px;height:90px;border-radius:20px;
  background:linear-gradient(180deg,#4fd8b2 0%,#23b492 55%,#0e8a6d 100%);
  box-shadow:0 7px 0 #085c48,0 10px 14px rgba(0,0,0,.55),inset 0 2px 5px rgba(255,255,255,.45)}
.arw .cap{color:#0b3d30;font-size:38px}
/* 1-6 / 8-13 圆钮 */
.ypill{width:98px;height:98px;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#ffe89a 0%,#f2c94c 48%,#c08a12 100%);
  box-shadow:0 7px 0 #7a5406,0 10px 14px rgba(0,0,0,.6),inset 0 2px 6px rgba(255,255,255,.55)}
.ypill .cap{color:#5d3d03;font-size:25px}
/* GO */
#btnGo{width:148px;height:102px;border-radius:24px;
  background:linear-gradient(180deg,#ff7a52 0%,#e8452a 45%,#b01f10 100%);
  box-shadow:0 8px 0 #6d1006,0 12px 18px rgba(0,0,0,.65),inset 0 2px 6px rgba(255,255,255,.4);
  animation:goBreath 1.6s ease-in-out infinite}
@keyframes goBreath{50%{filter:brightness(1.14)}}
#btnGo .cap{color:#fff;font-size:44px;letter-spacing:3px;text-shadow:0 3px 3px rgba(90,10,0,.6)}
#btnGo:disabled{animation:none}

/* ============ 倍率行 ============ */
#paytable{position:absolute;left:45px;right:45px;top:1226px;height:60px;z-index:6;display:flex;gap:5px}
.pt-cell{flex:1;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-weight:900;font-size:29px;letter-spacing:1px;color:#f7c948;
  background:linear-gradient(180deg,#3d1410,#2a0c08);
  box-shadow:inset 0 0 0 2px #6d3a1a, inset 0 2px 6px rgba(0,0,0,.7),0 1px 0 rgba(255,200,120,.14);
  text-shadow:0 0 8px rgba(255,170,40,.35);position:relative}
.pt-cell.edge{flex:1.15;background:linear-gradient(180deg,#1d3a12,#12250a);box-shadow:inset 0 0 0 2px #3f6a22,inset 0 2px 6px rgba(0,0,0,.7)}
.pt-cell.bet{background:linear-gradient(180deg,#ff5a2a,#c81f0a);color:#ffe9a0;
  box-shadow:inset 0 0 0 2px #ffb060,0 0 16px rgba(255,90,30,.55);text-shadow:0 0 10px rgba(255,220,120,.8);animation:ptBet 1s ease-in-out infinite alternate}
@keyframes ptBet{to{filter:brightness(1.25)}}

/* ============ 押注 LED 行 ============ */
#betLeds{position:absolute;left:45px;right:45px;top:1294px;height:50px;z-index:6;display:flex;gap:5px}
.bl-cell{flex:1;border-radius:5px;background:linear-gradient(180deg,#1c1008,#100802);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.9),0 1px 0 rgba(255,200,120,.12);display:flex;align-items:center;justify-content:center}

/* ============ 押注按钮行 ============ */
#betBtns{position:absolute;left:30px;right:30px;top:1356px;height:116px;z-index:8;display:flex;justify-content:space-between;padding:0 2px}
.bbtn{border:none;cursor:pointer;position:relative;border-radius:50%;width:80px;height:80px;flex:none;
  background:radial-gradient(circle at 38% 28%,#a8d46a 0%,#7ab53c 48%,#43701d 100%);
  box-shadow:0 6px 0 #234208,0 9px 12px rgba(0,0,0,.6),inset 0 2px 5px rgba(255,255,255,.45);
  transition:transform .06s ease,filter .06s ease}
.bbtn:active,.bbtn.down{transform:translateY(4px);filter:brightness(1.15)}
.bbtn:disabled{filter:saturate(.3) brightness(.65)}
.bbtn .bsym{position:absolute;inset:15% 15% 21%;display:flex;align-items:center;justify-content:center}
.bbtn .bsym svg{width:100%;height:100%}
.bbtn .bbar{position:absolute;inset:26% 10%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.bbtn .bbar i{font-style:normal;font-family:Arial Black,Arial,sans-serif;font-weight:900;font-size:12.5px;line-height:1.1;color:#fff;background:#111;padding:1px 3px;letter-spacing:.5px}
.bbtn.beton{box-shadow:0 6px 0 #234208,0 9px 12px rgba(0,0,0,.6),inset 0 2px 5px rgba(255,255,255,.45),0 0 22px 5px rgba(180,255,80,.55)}
.bbtn.beton::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid rgba(220,255,140,.9);animation:ptBet .5s ease-in-out infinite alternate}
.bbtn.winflash{animation:winBtn .18s steps(2) infinite}
@keyframes winBtn{50%{filter:brightness(1.75)}}

/* ============ 底座 ============ */
#base{position:absolute;left:0;right:0;top:1486px;bottom:0;z-index:2;
  background:linear-gradient(180deg,#38100b,#240906 60%,#180503)}
#base::before{content:"";position:absolute;left:56px;right:130px;top:10px;height:44px;border-radius:10px;
  background:linear-gradient(180deg,#120705,#0a0403);box-shadow:inset 0 4px 12px rgba(0,0,0,.9),0 1px 0 rgba(255,160,90,.14)}
#trayLabel{position:absolute;left:56px;right:130px;top:21px;text-align:center;color:#9a6a42;font-size:15px;letter-spacing:8px;font-weight:700;z-index:2;opacity:.85}

/* ============ 投币工具条（演示用） ============ */
#coinDock{position:absolute;left:45px;right:130px;top:1548px;height:50px;z-index:9;display:flex;gap:10px}
.cdk{flex:1;border:none;border-radius:25px;cursor:pointer;font-weight:800;font-size:21px;letter-spacing:1px;
  color:#ffe9b0;font-family:inherit;
  background:linear-gradient(180deg,#7a4a1c,#4c2a0c);box-shadow:0 5px 0 #2c1604,0 6px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,220,150,.35);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s}
.cdk:active{transform:translateY(3px)}
.cdk.gold{background:linear-gradient(180deg,#e8b23e,#a86e10);color:#3a2000;box-shadow:0 5px 0 #5c3a04,0 6px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,240,180,.5)}
.cdk.on{background:linear-gradient(180deg,#57d86e,#1e9438);color:#04330e;box-shadow:0 5px 0 #0c4d1a,0 6px 10px rgba(0,0,0,.5)}
#coinIcon{display:inline-block;width:26px;height:26px;flex:none}
#coinIcon svg{width:100%;height:100%}

/* ============ 金币飞行 ============ */
.flycoin{position:absolute;z-index:60;width:40px;height:40px;pointer-events:none;left:0;top:0;
  transition:transform .45s cubic-bezier(.3,-0.3,.6,1);opacity:.95}
/* 天女散花飞行物与落格奖分 */
.scatter-fly{position:absolute;left:0;top:0;width:38px;height:38px;z-index:65;pointer-events:none;
  filter:drop-shadow(0 0 10px rgba(255,190,60,.95))}
.scatter-pay{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%);
  font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:26px;color:#ffe27a;
  text-shadow:0 0 8px rgba(255,140,20,.9),0 2px 3px #000;
  animation:scatterPay 1s ease-out forwards}
@keyframes scatterPay{from{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}to{opacity:0;transform:translate(-50%,-52px) scale(1)}}
/* 菜单配置输入 */
.cfg-in{width:64px;background:#1c0d08;border:1px solid #7a4a2a;border-radius:6px;color:#ffd23e;
  font-weight:800;font-size:20px;text-align:center;padding:6px 4px;font-family:inherit}
.cfg-in:focus{outline:none;border-color:#caa14e}
.cfg-lab{display:inline-flex;align-items:center;gap:6px;margin:4px 10px 4px 0;font-size:19px;color:#e8d5a8}

/* ============ 弹层：菜单 / 说明 / toast ============ */
#overlay{position:absolute;inset:0;z-index:90;display:none;background:rgba(8,2,2,.72);backdrop-filter:blur(3px)}
#overlay.show{display:block}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:620px;max-height:1250px;overflow:auto;
  background:linear-gradient(180deg,#2e1210,#1c0a08);border:2px solid #8a6428;border-radius:18px;padding:30px 34px;
  box-shadow:0 20px 60px rgba(0,0,0,.8);color:#f0dfb8}
.sheet h3{font-size:30px;letter-spacing:4px;color:#ffd23e;margin-bottom:20px;text-align:center}
.sheet .row{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px dashed #5a3a20;font-size:23px}
.sheet .row:last-child{border-bottom:none}
.switch{width:74px;height:38px;border-radius:19px;background:#4a2418;position:relative;cursor:pointer;border:1px solid #7a4a2a;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:4px;width:30px;height:30px;border-radius:50%;background:#c9a07a;transition:all .2s}
.switch.on{background:#1e9438}.switch.on::after{left:38px;background:#eaffe0}
.mini{border:none;border-radius:10px;padding:10px 18px;margin:6px 6px 0 0;font-size:20px;font-weight:700;cursor:pointer;
  background:linear-gradient(180deg,#e8b23e,#a86e10);color:#3a2000}
.mini.red{background:linear-gradient(180deg,#e85540,#a81f10);color:#fff}
.rules{font-size:20px;line-height:1.75;color:#e8d5a8}
.rules b{color:#ffd23e}
.rules table{width:100%;border-collapse:collapse;margin:12px 0;font-size:19px;text-align:center}
.rules td,.rules th{border:1px solid #5a3a20;padding:6px 4px}
.rules th{color:#ffd23e;background:#33150e}
.close-x{position:absolute;right:18px;top:14px;width:44px;height:44px;border:none;border-radius:50%;cursor:pointer;
  background:#5a2a1a;color:#ffd8a8;font-size:22px;font-weight:700}
#toasts{position:absolute;left:0;right:0;top:32%;z-index:95;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.toast{background:rgba(20,6,4,.92);border:1px solid #c9a24e;color:#ffe9b0;border-radius:14px;padding:14px 30px;
  font-size:24px;font-weight:700;letter-spacing:1px;box-shadow:0 8px 24px rgba(0,0,0,.6);
  animation:toastIn .25s ease,toastOut .3s ease 2.2s forwards;max-width:600px;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-14px)}}

/* 静音钮 */
#muteBtn{position:absolute;right:45px;top:1548px;z-index:30;width:64px;height:50px;border-radius:25px;border:none;cursor:pointer;
  background:linear-gradient(180deg,#4a3a28,#2a1c10);color:#ffd8a8;font-size:24px;
  box-shadow:0 5px 0 #16100a,inset 0 1px 0 rgba(255,220,150,.3)}
#muteBtn.off{color:#7a5a44;text-shadow:none}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="machine">
      <!-- 顶部 -->
      <div id="headCavity"></div>
      <div id="archGlow"></div>
      <button class="corner-btn" id="menuBtn">≡</button>
      <button class="corner-btn" id="infoBtn">i</button>
      <div id="marqueeNest"><div id="ticker"><div id="tickerText">★ FIERY DRAGON ★ 火龙珠祝您好运 ★</div></div></div>
      <!-- LED 计分行 -->
      <div id="ledRow">
        <div class="led-group"><div class="led-label">BONUS-WIN</div><div class="led-frame"><div class="led-inner" id="ledBonus"></div></div></div>
        <div class="led-group"><div class="led-label">CREDIT</div><div class="led-frame"><div class="led-inner" id="ledCredit"></div></div></div>
      </div>
      <!-- 主板 -->
      <div id="board">
        <div id="center">
          <div id="sceneHolder"></div>
          <div id="jpCoin"></div>
          <div id="jpTag">JP 500</div>
          <div id="centerLED"></div>
          <div id="wheel"><div id="wheelDisc"><div id="wheelTip">比倍猜大小<small>← → 调整比倍额<br>猜对翻倍 · 7 通杀</small></div></div></div>
        </div>
      </div>
      <!-- 按钮排 -->
      <div id="controls">
        <button class="pbtn" id="btnAll"><span class="cap">ALL<br>+1</span></button>
        <button class="pbtn arw" id="btnLeft"><span class="cap">←</span></button>
        <button class="pbtn arw" id="btnRight"><span class="cap">→</span></button>
        <button class="pbtn ypill" id="btnSmall"><span class="cap">1-6</span></button>
        <button class="pbtn ypill" id="btnBig"><span class="cap">8-13</span></button>
        <button class="pbtn" id="btnGo"><span class="cap">GO</span></button>
      </div>
      <!-- 倍率行 -->
      <div id="paytable"></div>
      <!-- 押注LED -->
      <div id="betLeds"></div>
      <!-- 押注按钮 -->
      <div id="betBtns"></div>
      <!-- 底座 -->
      <div id="base"></div>
      <div id="trayLabel">· FIERY DRAGON ·</div>
      <!-- 投币坞 -->
      <div id="coinDock">
        <button class="cdk gold" id="dockCoin"><span id="coinIcon"></span>投币 +1</button>
        <button class="cdk" id="dockAdd">上分 +100</button>
        <button class="cdk" id="dockAuto">自动投币</button>
      </div>
      <button id="muteBtn">♪</button>
      <div id="toasts"></div>
      <div id="overlay"></div>
    </div>
  </div>
</div>
<!-- MODULE_SCRIPTS -->

</body>
</html>
