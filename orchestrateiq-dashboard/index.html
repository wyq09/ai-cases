/* ============ OrchestrateIQ design system ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: 'tnum' 1;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
svg { display: block; }

:root {
  --bg: #E7E9EF;
  --panel: #FAFBFC;
  --card: #FFFFFF;
  --canvas: #F3F4F6;
  --canvas2: #EEEFF2;
  --line: #ECEEF2;
  --line2: #E2E5EA;
  --ink: #1A1C20;
  --ink2: #5D6673;
  --ink3: #98A1AC;
  --blue: #2E6BE6;
  --blue-deep: #245BD0;
  --blue-weak: #EAF1FE;
  --blue-softer: #F4F8FE;
  --green: #1F9D5F;
  --green-weak: #E4F6EC;
  --green-dot: #33C481;
  --red: #E5484D;
  --red-weak: #FDEDED;
  --red-dot: #F04438;
  --amber: #F5A623;
  --amber-weak: #FDF3DC;
  --amber-ink: #C77E08;
  --purple: #7C5CFC;
  --purple-weak: #F0EBFE;
  --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 10px 28px -14px rgba(16,24,40,.08);
  --shadow-pop: 0 4px 10px rgba(16,24,40,.06), 0 20px 44px -16px rgba(16,24,40,.18);
  --shadow-float: 0 24px 70px -18px rgba(30,40,70,.25);
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px; --r-pill: 999px;
  --nav-h: 64px;
}
[data-theme="dark"] {
  --bg: #0F1115;
  --panel: #16181D;
  --card: #1C1F26;
  --canvas: #22252D;
  --canvas2: #262A33;
  --line: #2A2E37;
  --line2: #343945;
  --ink: #E9EBEF;
  --ink2: #A2ABB8;
  --ink3: #6B7482;
  --blue: #5B8DEF;
  --blue-deep: #3F76E4;
  --blue-weak: #1D2B47;
  --blue-softer: #1A2438;
  --green: #3FC98A;
  --green-weak: #16332A;
  --green-dot: #3FC98A;
  --red: #F26D72;
  --red-weak: #3A2226;
  --red-dot: #F26D72;
  --amber: #F7B84B;
  --amber-weak: #392C15;
  --amber-ink: #F7B84B;
  --purple: #9D85FF;
  --purple-weak: #262042;
  --shadow-card: 0 1px 2px rgba(0,0,0,.25), 0 10px 28px -14px rgba(0,0,0,.5);
  --shadow-pop: 0 4px 10px rgba(0,0,0,.35), 0 20px 44px -16px rgba(0,0,0,.55);
  --shadow-float: 0 24px 70px -18px rgba(0,0,0,.6);
}

/* ============ stage / app panel ============ */
.stage { min-height: 100%; padding: 26px; display: flex; }
.app-panel {
  position: relative;
  flex: 1;
  min-width: 0;
  background: var(--panel);
  border-radius: 30px;
  box-shadow: var(--shadow-float), 0 0 0 1px rgba(255,255,255,.55) inset;
  display: flex;
  flex-direction: column;
  overflow: clip;
  min-height: calc(100vh - 52px);
}
[data-theme="dark"] .app-panel { box-shadow: var(--shadow-float), 0 0 0 1px rgba(255,255,255,.06) inset; }

/* ============ top nav ============ */
.topnav {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 26px 10px;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border-radius: var(--r-pill);
  padding: 9px 20px 9px 12px; box-shadow: var(--shadow-card);
  font-size: 16.5px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap;
}
.brand .logo-tile { width: 32px; height: 32px; border-radius: 10px; background: var(--blue-weak); color: var(--blue); display: grid; place-items: center; }
.pagenav {
  display: flex; align-items: center; gap: 2px;
  background: var(--card); border-radius: var(--r-pill);
  padding: 5px; box-shadow: var(--shadow-card);
  margin: 0 auto;
}
.pagenav button {
  padding: 8px 17px; border-radius: var(--r-pill);
  font-size: 14px; font-weight: 500; color: var(--ink);
  transition: background .18s, color .18s; white-space: nowrap;
}
.pagenav button:hover { background: var(--canvas); }
.pagenav button.active { background: var(--blue); color: #fff; font-weight: 600; }
.nav-right { display: flex; align-items: center; gap: 10px; }
.nav-pill {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border-radius: var(--r-pill);
  padding: 8px 14px; box-shadow: var(--shadow-card);
}
.live-badge { display: flex; align-items: center; gap: 7px; background: var(--green-weak); color: var(--green); border-radius: var(--r-pill); padding: 6px 13px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.live-badge .dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--green-dot); animation: pulse 1.6s ease-in-out infinite; }
.live-badge.paused { background: var(--canvas); color: var(--ink3); }
.live-badge.paused .dot-live { animation: none; background: var(--ink3); }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .45; transform: scale(.8);} }
.range-btn { font-weight: 500; color: var(--ink); font-size: 13.5px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  color: var(--ink2); position: relative; transition: background .15s;
}
.icon-btn:hover { background: var(--canvas); }
.icon-btn .notif-dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--red-dot); border: 1.5px solid var(--card); }
.avatar-btn { display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 6px; border-radius: var(--r-pill); background: var(--card); box-shadow: var(--shadow-card); }
.avatar-btn:hover { background: var(--blue-softer); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #FFB199 0%, #F97C5B 45%, #E85A3A 100%); }
.avatar-btn b { display: block; font-size: 13.5px; font-weight: 700; line-height: 1.2; }
.avatar-btn span { display: block; font-size: 11.5px; color: var(--ink3); line-height: 1.2; }

/* ============ body row / rail ============ */
.body-row { display: flex; flex: 1; min-height: 0; padding: 8px 26px 26px; gap: 18px; }
.rail { display: flex; flex-direction: column; gap: 14px; width: 56px; flex: none; }
.rail-group { background: var(--card); border-radius: 999px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 6px; }
.rail-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); transition: background .15s, color .15s; position: relative; }
.rail-btn:hover { background: var(--canvas); color: var(--ink); }
.rail-btn.active { background: var(--blue); color: #fff; }
.rail-spacer { flex: 1; }

/* ============ page root ============ */
.page-root { flex: 1; min-width: 0; min-height: 0; }
.page-enter { animation: pageIn .3s ease both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }

/* ============ shared components ============ */
.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
.card-pad { padding: 22px; }
.card-title { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.sub { color: var(--ink3); font-size: 13.5px; }
.lbl { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }

.pill-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--card); border-radius: var(--r-pill); box-shadow: var(--shadow-card);
  padding: 9px 16px; font-weight: 500; font-size: 13.5px; color: var(--ink);
  transition: background .15s, transform .1s;
}
.pill-btn:hover { background: var(--blue-softer); }
.pill-btn:active { transform: scale(.97); }
.pill-btn.gray { background: var(--canvas); box-shadow: none; }
.pill-btn.gray:hover { background: var(--canvas2); }
.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--blue); color: #fff; border-radius: var(--r-pill);
  padding: 11px 20px; font-weight: 600; font-size: 14px;
  transition: background .15s, transform .1s, box-shadow .15s;
  box-shadow: 0 6px 16px -6px rgba(46,107,230,.55);
}
.btn-primary:hover { background: var(--blue-deep); }
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { opacity: .55; cursor: default; }

.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot-green { background: var(--green-dot); } .dot-red { background: var(--red-dot); }
.dot-amber { background: var(--amber); } .dot-gray { background: #C4C9D0; }
.dot-blue { background: var(--blue); } .dot-purple { background: var(--purple); }

.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-pill); padding: 4px 11px; font-size: 12.5px; font-weight: 600; }
.badge-green { background: var(--green-weak); color: var(--green); }
.badge-red { background: var(--red-weak); color: var(--red); }
.badge-amber { background: var(--amber-weak); color: var(--amber-ink); }
.badge-purple { background: var(--purple-weak); color: var(--purple); }
.badge-gray { background: var(--canvas); color: var(--ink2); }

.chip {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--blue-weak); color: var(--blue);
  border-radius: var(--r-pill); padding: 6px 8px 6px 13px; font-size: 13px; font-weight: 500;
}
.chip-x { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--blue); opacity: .7; transition: background .12s, opacity .12s; }
.chip-x:hover { opacity: 1; background: rgba(46,107,230,.15); }
.add-filter {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1.5px dashed var(--line2); color: var(--ink2);
  border-radius: var(--r-pill); padding: 6px 14px; font-size: 13px; font-weight: 500;
  transition: border-color .15s, color .15s, background .15s;
}
.add-filter:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-softer); }

.toolbar-pill {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-pill); padding: 8px 14px; font-size: 13.5px; font-weight: 500; color: var(--ink);
  transition: background .15s; box-shadow: none;
}
.toolbar-pill:hover { background: var(--canvas); }

.kv { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 16px; min-width: 0; }
.kv .k { font-size: 12.5px; color: var(--ink2); margin-bottom: 3px; }
.kv .v { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.kv .note { font-size: 12px; color: var(--ink3); margin-top: 3px; }
.kv .note.red { color: var(--red); }

.stat-row { display: flex; align-items: center; justify-content: space-between; background: var(--canvas); border-radius: var(--r-sm); padding: 9px 14px; font-size: 13.5px; }
.stat-row .sk { color: var(--ink2); }
.stat-row .sv { font-weight: 700; }

.searchbar {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 12px 16px; color: var(--ink3);
}
.searchbar input { flex: 1; border: 0; outline: 0; background: none; font-size: 14px; color: var(--ink); }
.searchbar input::placeholder { color: var(--ink3); }
.kbd { font-size: 11px; color: var(--ink3); border: 1px solid var(--line2); border-radius: 6px; padding: 2px 7px; background: var(--canvas); }

.callout { display: flex; align-items: flex-start; gap: 9px; border-radius: var(--r-md); padding: 12px 16px; font-size: 13.5px; }
.callout.red { background: var(--red-weak); color: var(--red); }
.callout.blue { background: var(--blue-weak); color: var(--blue); }
.callout.amber { background: var(--amber-weak); color: var(--amber-ink); }

.table-g { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
.table-g th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); padding: 0 16px 2px; }
.table-g td { background: var(--card); padding: 13px 16px; font-size: 13.5px; vertical-align: middle; }
.table-g tr > td:first-child { border-radius: var(--r-md) 0 0 var(--r-md); }
.table-g tr > td:last-child { border-radius: 0 var(--r-md) var(--r-md) 0; }
.table-g tbody tr { cursor: pointer; transition: transform .12s; }
.table-g tbody tr:hover td { background: var(--blue-softer); }
.table-g .mono { font-weight: 700; letter-spacing: -.01em; }
.wf-pill { display: inline-block; background: var(--canvas); color: var(--ink2); border-radius: 8px; padding: 4px 11px; font-size: 12.5px; }

.tabbar { display: flex; gap: 6px; }
.tabbar button { padding: 8px 16px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 500; color: var(--ink2); transition: background .15s, color .15s; }
.tabbar button:hover { background: var(--canvas); color: var(--ink); }
.tabbar button.active { background: var(--blue-weak); color: var(--blue); font-weight: 600; }

.ai-orb { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto;
  background: radial-gradient(circle at 34% 30%, #DCE9FF 0%, #9DBCFA 40%, #5D8BEF 78%, #4A78DE 100%);
  box-shadow: 0 14px 30px -10px rgba(93,139,239,.65), inset 0 -6px 14px rgba(30,64,150,.25);
  animation: orbFloat 5s ease-in-out infinite;
}
@keyframes orbFloat { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-6px);} }

/* icon-circle (stat card leading icon) */
.ic-circle { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ic-green { background: var(--green-weak); color: var(--green); }
.ic-red { background: var(--red-weak); color: var(--red); }
.ic-amber { background: var(--amber-weak); color: var(--amber-ink); }
.ic-blue { background: var(--blue-weak); color: var(--blue); }
.ic-purple { background: var(--purple-weak); color: var(--purple); }

/* ============ dropdown ============ */
.dd-menu {
  position: fixed; z-index: 120; min-width: 180px;
  background: var(--card); border-radius: 14px; box-shadow: var(--shadow-pop);
  border: 1px solid var(--line); padding: 6px;
  animation: ddIn .14s ease both;
}
@keyframes ddIn { from { opacity: 0; transform: translateY(-4px) scale(.98);} to { opacity: 1; transform: none;} }
.dd-item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 9px 12px; border-radius: 9px; font-size: 13.5px; font-weight: 500; transition: background .12s; }
.dd-item:hover { background: var(--canvas); }
.dd-item.danger { color: var(--red); }
.dd-item .grow { flex: 1; }
.dd-item .check { color: var(--blue); }
.dd-sep { height: 1px; background: var(--line); margin: 5px 8px; }
.dd-head { padding: 8px 12px 4px; }

/* notif panel */
.notif-panel { position: fixed; z-index: 90; width: 340px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow-pop); border: 1px solid var(--line); padding: 8px; animation: ddIn .14s ease both; }
.notif-row { display: flex; gap: 10px; padding: 11px 12px; border-radius: 11px; cursor: pointer; }
.notif-row:hover { background: var(--canvas); }
.notif-row b { font-size: 13.5px; display: block; }
.notif-row span { font-size: 12.5px; color: var(--ink3); display: block; margin-top: 1px; }

/* ============ modal ============ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(24,28,38,.42);
  display: grid; place-items: center; padding: 30px;
  animation: fadeIn .18s ease both;
  backdrop-filter: blur(3px);
}
@keyframes fadeIn { from { opacity: 0;} to { opacity: 1;} }
.modal {
  width: 520px; max-width: 100%; max-height: 86vh; overflow: auto;
  background: var(--card); border-radius: 22px; box-shadow: var(--shadow-pop);
  padding: 24px; animation: modalIn .22s cubic-bezier(.2,.9,.3,1.2) both;
}
.modal.wide { width: 860px; }
@keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.97);} to { opacity: 1; transform: none;} }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal-head h3 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.modal-x { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink3); }
.modal-x:hover { background: var(--canvas); color: var(--ink); }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

/* ============ toast ============ */
.toast-root { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 9px;
  background: #23262E; color: #F2F4F8; border-radius: var(--r-pill);
  padding: 11px 20px; font-size: 13.5px; font-weight: 500;
  box-shadow: var(--shadow-pop); animation: toastIn .25s cubic-bezier(.2,.9,.3,1.15) both;
  pointer-events: auto;
}
.toast.success { background: #123B2A; color: #7FE0AE; }
.toast.warn { background: #3B2F12; color: #F7C873; }
.toast.error { background: #421C1F; color: #FF9B9E; }
.toast button.undo { color: #8FB8FF; font-weight: 700; margin-left: 4px; }
.toast.out { animation: toastOut .25s ease both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.95);} to { opacity: 1; transform: none;} }
@keyframes toastOut { to { opacity: 0; transform: translateY(10px) scale(.95);} }

/* ============ command palette ============ */
.cmdk-overlay { position: fixed; inset: 0; z-index: 110; background: rgba(24,28,38,.4); display: flex; justify-content: center; padding-top: 14vh; animation: fadeIn .15s ease both; backdrop-filter: blur(3px); }
.cmdk { width: 560px; max-width: 92vw; background: var(--card); border-radius: 18px; box-shadow: var(--shadow-pop); overflow: hidden; height: fit-content; animation: modalIn .2s ease both; }
.cmdk-input { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); color: var(--ink3); }
.cmdk-input input { flex: 1; border: 0; outline: 0; background: none; font-size: 15.5px; color: var(--ink); }
.cmdk-list { max-height: 320px; overflow: auto; padding: 8px; }
.cmdk-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; }
.cmdk-item.sel, .cmdk-item:hover { background: var(--blue-weak); }
.cmdk-item .ck { margin-left: auto; font-size: 11.5px; color: var(--ink3); }
.cmdk-empty { padding: 26px; text-align: center; color: var(--ink3); font-size: 13.5px; }

/* ============ scrollbars ============ */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--ink3); background-clip: content-box; border: 2px solid transparent; }
::-webkit-scrollbar-track { background: transparent; }

/* generic page scaffold used by all pages */
.pg { display: flex; flex-direction: column; gap: 18px; height: 100%; }
.pg-scroll { overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 18px; padding-bottom: 6px; }
.pg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.pg-head h1 { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

/* tooltip */
.tip { position: fixed; z-index: 95; background: #23262E; color: #F2F4F8; border-radius: 9px; padding: 7px 11px; font-size: 12px; font-weight: 500; pointer-events: none; box-shadow: var(--shadow-pop); animation: ddIn .12s ease both; white-space: nowrap; }
.tip b { color: #fff; }

/* responsive */
@media (max-width: 1240px) {
  .pagenav button { padding: 8px 12px; }
  .brand { padding-right: 14px; }
}
@media (max-width: 1060px) {
  .stage { padding: 12px; }
  .app-panel { border-radius: 20px; }
  .topnav { flex-wrap: wrap; }
  .pagenav { order: 3; width: 100%; overflow-x: auto; }
  .body-row { padding: 8px 14px 14px; }
}
@media (max-width: 780px) {
  .rail { display: none; }
  .grid-2 { grid-template-columns: 1fr; }
  .pg-head h1 { font-size: 27px; }
  .avatar-btn div { display: none; }
}

/* ==== css-extra.css ==== */
/* ==== css-extra.css — Workflows / Live Map / Incidents / Insights (all under .pgx) ==== */

.pgx { }

.pgx .pgx-head { padding: 22px 26px 20px; }

.pgx .pgx-actions { display: flex; align-items: center; gap: 10px; flex: none; }

.pgx .ic-gray { background: var(--canvas); color: var(--ink3); }

/* modal form (body element carries .pgx so it stays namespaced) */

.pgx .pgx-input {
  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--card);
  padding: 11px 14px; font-size: 14px; color: var(--ink); outline: 0; transition: border-color .15s, box-shadow .15s;
}
.pgx .pgx-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-weak); }
.pgx .pgx-input::placeholder { color: var(--ink3); }

.pgx .pgx-form-note { font-size: 12.5px; color: var(--ink3); margin-top: 6px; }

/* ================= Workflows ================= */
.pgx-workflows .pgx-wf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1360px) { .pgx-workflows .pgx-wf-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 780px) { .pgx-workflows .pgx-wf-grid { grid-template-columns: 1fr; } }
.pgx .pgx-wf-card {
  text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 13px; min-width: 0;
  transition: transform .18s cubic-bezier(.2,.9,.3,1.2), box-shadow .18s, border-color .18s;
  animation: pgxCardIn .4s ease both; animation-delay: var(--d, 0ms);
}
.pgx .pgx-wf-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-pop); border-color: var(--line2); }
.pgx .pgx-wf-card:active { transform: translateY(-1px) scale(.99); }
@keyframes pgxCardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.pgx .pgx-wf-top { display: flex; align-items: center; gap: 10px; }
.pgx .pgx-wf-top .ic-circle { width: 38px; height: 38px; flex: none; }
.pgx .pgx-wf-name { flex: 1; min-width: 0; }
.pgx .pgx-wf-name b { display: block; font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pgx .pgx-wf-name i { display: block; font-style: normal; font-size: 12px; color: var(--ink3); margin-top: 1px; }
.pgx .pgx-wf-top .badge { flex: none; font-size: 12px; padding: 3px 9px; }
.pgx .pgx-wf-stats { display: flex; gap: 22px; }
.pgx .pgx-wf-stat b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.pgx .pgx-wf-stat span { font-size: 12px; color: var(--ink3); }
.pgx .pgx-wf-spark { height: 44px; margin-top: auto; }
.pgx .pgx-wf-spark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.pgx .pgx-wf-spark svg.tone-green { color: var(--green-dot); }
.pgx .pgx-wf-spark svg.tone-amber { color: var(--amber); }
.pgx .pgx-wf-spark svg.tone-green .sa, .pgx .pgx-wf-spark svg.tone-amber .sa { stop-color: currentColor; }
.pgx .pgx-wf-spark svg .sb { stop-color: currentColor; }
.pgx .pgx-spark-line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pgx .pgx-spark-end { fill: currentColor; }

/* ================= Live Map ================= */
.pgx-livemap .pgx-lm-tools { display: flex; align-items: center; gap: 8px; flex: none; }
.pgx-livemap .pgx-lm-live.off { color: var(--ink3); }
.pgx .pgx-lm-canvas {
  position: relative; height: 560px; background: var(--canvas); border-radius: 16px;
  overflow: hidden; cursor: grab; touch-action: none;
}
.pgx .pgx-lm-canvas.grabbing { cursor: grabbing; }
.pgx .pgx-lm-world { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
.pgx .pgx-lm-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pgx .pgx-lm-edge {
  fill: none; stroke: var(--ink3); stroke-opacity: .4; stroke-width: 1.6;
  transition: stroke-opacity .2s, stroke .2s, stroke-width .2s;
}
.pgx .pgx-lm-edge.tone-amber { stroke: var(--amber); stroke-opacity: .9; }
.pgx .pgx-lm-edge.tone-blue { stroke: var(--blue); stroke-opacity: .9; }
.pgx .pgx-lm-edge.tone-red { stroke: var(--red-dot); stroke-opacity: .85; }
.pgx .pgx-lm-canvas.dimmed .pgx-lm-edge:not(.rel) { stroke-opacity: .08; }
.pgx .pgx-lm-edge.rel { stroke-opacity: 1; stroke-width: 2.4; }
.pgx .pgx-lm-edge.rel.tone-gray { stroke: var(--ink2); }
.pgx .pgx-lm-pdot { stroke: var(--card); stroke-width: 1.4; transition: opacity .25s; }
.pgx .pgx-lm-pdot.tone-gray { fill: var(--blue); opacity: .8; }
.pgx .pgx-lm-pdot.tone-blue { fill: var(--blue); }
.pgx .pgx-lm-pdot.tone-amber { fill: var(--amber); }
.pgx .pgx-lm-pdot.tone-red { fill: var(--red-dot); }
.pgx .pgx-lm-node { position: absolute; transform: translate(-50%, -50%); transition: opacity .2s; z-index: 2; }
.pgx .pgx-lm-canvas.dimmed .pgx-lm-node:not(.rel) { opacity: .25; }
.pgx .pgx-lm-box {
  display: flex; align-items: center; gap: 9px; background: var(--card); border-radius: 13px;
  padding: 7px 14px 7px 8px; box-shadow: var(--shadow-card); text-align: left;
  transition: transform .18s cubic-bezier(.2,.9,.3,1.4), box-shadow .18s;
}
.pgx .pgx-lm-node:hover .pgx-lm-box { transform: scale(1.07); position: relative; z-index: 4; }
.pgx .pgx-lm-node.amber .pgx-lm-box { background: var(--amber-weak); border: 1.5px dashed var(--amber); }
.pgx .pgx-lm-node.red .pgx-lm-box { background: var(--red-weak); border: 1.5px solid var(--red-dot); animation: pgxPulse 1.6s ease-in-out infinite; }
.pgx .pgx-lm-node.gray .pgx-lm-box { opacity: .78; }
@keyframes pgxPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
.pgx .pgx-lm-box .ic-circle { width: 30px; height: 30px; flex: none; }
.pgx .pgx-lm-node.red .pgx-lm-box .ic-circle { background: var(--card); }
.pgx .pgx-lm-txt { min-width: 0; }
.pgx .pgx-lm-txt b { display: block; font-size: 13px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.pgx .pgx-lm-txt i { display: block; font-style: normal; font-size: 11.5px; color: var(--ink3); white-space: nowrap; margin-top: 1px; }
.pgx .pgx-lm-node.amber .pgx-lm-txt i { color: var(--amber-ink); }
.pgx .pgx-lm-node.red .pgx-lm-txt i { color: var(--red); }
.pgx .pgx-lm-legend {
  position: absolute; top: 14px; right: 14px; display: flex; align-items: center; gap: 14px;
  background: var(--card); border-radius: var(--r-pill); padding: 8px 16px; box-shadow: var(--shadow-card); z-index: 3;
}
.pgx .pgx-l-lg { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink2); white-space: nowrap; }
.pgx .pgx-lm-zoomchip {
  position: absolute; left: 14px; bottom: 12px; z-index: 3; background: var(--card); color: var(--ink2);
  border-radius: var(--r-pill); padding: 5px 12px; font-size: 12px; font-weight: 600; box-shadow: var(--shadow-card);
}

/* ================= Incidents ================= */
.pgx-incidents .pgx-inc-list { display: flex; flex-direction: column; gap: 14px; }
.pgx .pgx-inc-row {
  position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
  overflow: hidden; transition: box-shadow .18s, border-color .18s, opacity .25s;
  animation: pgxCardIn .4s ease both; animation-delay: var(--d, 0ms);
}
.pgx .pgx-inc-row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--red-dot); z-index: 1; }
.pgx .pgx-inc-row.tone-amber::before { background: var(--amber); }
.pgx .pgx-inc-row.open { border-color: var(--line2); box-shadow: var(--shadow-card); }
.pgx .pgx-inc-row.acked { opacity: .55; }
.pgx .pgx-inc-row.acked::before { background: var(--line2); }
.pgx .pgx-inc-row .pgx-inc-head {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 14px 18px 14px 21px; transition: background .15s;
}
.pgx .pgx-inc-row .pgx-inc-head:hover { background: var(--blue-softer); }
.pgx .pgx-inc-row .pgx-inc-head .badge { flex: none; font-size: 12px; padding: 3px 10px; }
.pgx .pgx-inc-id { font-weight: 700; font-size: 12.5px; color: var(--ink3); letter-spacing: .02em; width: 66px; flex: none; }
.pgx .pgx-inc-main { flex: 1; min-width: 0; }
.pgx .pgx-inc-main b { display: block; font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pgx .pgx-inc-main i { display: block; font-style: normal; font-size: 12.5px; color: var(--ink3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pgx .pgx-inc-age { color: var(--ink3); font-size: 13px; flex: none; }
.pgx .pgx-inc-chev { color: var(--ink3); flex: none; display: grid; place-items: center; transition: transform .25s; }
.pgx .pgx-inc-row.open .pgx-inc-chev { transform: rotate(180deg); }
.pgx .pgx-inc-body { max-height: 0; overflow: hidden; transition: max-height .32s ease; }
.pgx .pgx-inc-inner { padding: 14px 20px 18px 21px; border-top: 1px solid var(--line); }
.pgx .pgx-inc-inner p { font-size: 13.5px; color: var(--ink2); line-height: 1.55; margin-bottom: 14px; }
.pgx .pgx-tl { margin-top: 10px; }
.pgx .pgx-tl-row { display: flex; gap: 12px; padding: 6px 0; }
.pgx .pgx-tl-time { flex: none; width: 44px; font-size: 12.5px; font-weight: 700; color: var(--ink2); padding-top: 1px; }
.pgx .pgx-tl-dot { position: relative; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--blue); margin-top: 4px; box-shadow: 0 0 0 3px var(--blue-weak); }
.pgx .pgx-tl-dot.amber { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-weak); }
.pgx .pgx-tl-dot.red { background: var(--red-dot); box-shadow: 0 0 0 3px var(--red-weak); }
.pgx .pgx-tl-dot:not(.last)::after { content: ''; position: absolute; left: 3.5px; top: 14px; height: 18px; width: 2px; background: var(--line2); }
.pgx .pgx-tl-tx { font-size: 13.5px; padding-top: .5px; }
.pgx .pgx-inc-actions { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.pgx .pgx-inc-actions .btn-primary { padding: 9px 16px; font-size: 13.5px; gap: 7px; }
.pgx .pgx-res-label { margin-bottom: 10px; }
.pgx .pgx-res { display: flex; flex-direction: column; gap: 10px; }
.pgx .pgx-res-row {
  display: flex; align-items: center; gap: 12px; text-align: left; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--r-md); padding: 11px 14px; opacity: .72;
  transition: opacity .15s, border-color .15s, background .15s;
}
.pgx .pgx-res-row:hover { opacity: 1; border-color: var(--line2); background: var(--blue-softer); }
.pgx .pgx-res-row .ic-circle { width: 34px; height: 34px; flex: none; }
.pgx .pgx-res-main { flex: 1; min-width: 0; }
.pgx .pgx-res-main b { display: block; font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pgx .pgx-res-main i { display: block; font-style: normal; font-size: 12.5px; color: var(--ink3); margin-top: 1px; }
.pgx .pgx-res-row .badge { flex: none; font-size: 12px; }

/* ================= Insights ================= */
.pgx-insights .pgx-is-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 1060px) { .pgx-insights .pgx-is-grid { grid-template-columns: 1fr; } }
.pgx .pgx-card { padding: 20px 22px; }
.pgx .pgx-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
.pgx .pgx-is-trend { grid-column: 1 / -1; }
.pgx .pgx-trend-total { text-align: right; flex: none; }
.pgx .pgx-trend-total b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.pgx .pgx-trend-total span { font-size: 12.5px; color: var(--ink3); }
.pgx .pgx-trend-wrap { position: relative; }
.pgx .pgx-trend-wrap svg { width: 100%; height: auto; display: block; }
.pgx .pgx-grid { stroke: var(--line2); stroke-dasharray: 3 5; }
.pgx .pgx-trend-wrap text { font-size: 11px; font-weight: 500; fill: var(--ink3); }
.pgx .pgx-trend-line { fill: none; stroke: var(--blue); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .9s cubic-bezier(.3,.7,.3,1); }
.pgx .pgx-trend-line.drawn { stroke-dashoffset: 0; }
.pgx .pgx-is-trend .sa, .pgx .pgx-is-trend .sb { stop-color: var(--blue); }
.pgx .pgx-cursor { stroke: var(--ink3); stroke-dasharray: 3 4; }
.pgx .pgx-cursor-dot { fill: var(--blue); stroke: var(--card); stroke-width: 2; }
.pgx .pgx-hover { cursor: crosshair; }
.pgx .pgx-runs { display: flex; flex-direction: column; gap: 10px; }
.pgx .pgx-bar-row { min-width: 0; }
.pgx .pgx-bar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.pgx .pgx-bar-top span { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pgx .pgx-bar-top b { font-size: 14px; font-weight: 700; letter-spacing: -.01em; flex: none; }
.pgx .pgx-bar-track { height: 8px; border-radius: var(--r-pill); background: var(--canvas2); overflow: hidden; cursor: default; }
.pgx .pgx-bar-fill { height: 100%; width: 0; border-radius: var(--r-pill); transition: width .8s cubic-bezier(.3,.7,.3,1); }
.pgx .pgx-bar-fill.tone-blue { background: var(--blue); }
.pgx .pgx-bar-fill.tone-red { background: var(--red-dot); }
.pgx .pgx-bar-fill.tone-amber { background: var(--amber); }
.pgx .pgx-bar-fill.tone-purple { background: var(--purple); }
.pgx .pgx-donut-wrap { display: grid; grid-template-columns: 190px 1fr; gap: 20px; align-items: center; }
@media (max-width: 560px) { .pgx .pgx-donut-wrap { grid-template-columns: 1fr; } }
.pgx .pgx-donut-wrap svg { width: 190px; height: 190px; }
.pgx .pgx-donut-track { fill: none; stroke: var(--canvas2); stroke-width: 24; }
.pgx .pgx-donut-seg { fill: none; stroke-width: 24; transition: stroke-dasharray .8s cubic-bezier(.3,.7,.3,1), stroke-dashoffset .8s cubic-bezier(.3,.7,.3,1); cursor: default; }
.pgx .pgx-donut-seg.tone-blue { stroke: var(--blue); }
.pgx .pgx-donut-seg.tone-purple { stroke: var(--purple); }
.pgx .pgx-donut-seg.tone-green { stroke: var(--green-dot); }
.pgx .pgx-donut-big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; fill: var(--ink); }
.pgx .pgx-donut-cap { font-size: 11.5px; fill: var(--ink3); }
.pgx .pgx-dl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pgx .pgx-dl-row { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 13.5px; }
.pgx .pgx-dl-row + .pgx-dl-row { border-top: 1px solid var(--line); }
.pgx .pgx-dl-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pgx .pgx-dl-row b { font-weight: 700; letter-spacing: -.01em; }
.pgx .pgx-dl-pct { width: 40px; text-align: right; color: var(--ink3); font-size: 12.5px; }
.pgx .pgx-fail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; }
@media (max-width: 640px) { .pgx .pgx-fail-grid { grid-template-columns: 1fr; } }

/* ==== css-handoff.css ==== */
/* ==== css-handoff.css — Handoff Inspector (Router → Billing) ==== */
.pg-handoff {
  --ho-cols: 1.45fr 1fr 1.08fr 0.72fr;
  --ho-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
}
.pg-handoff.no-anim *,
.pg-handoff.no-anim *::before,
.pg-handoff.no-anim *::after { animation: none !important; transition: none !important; }

/* ---------- header card ---------- */
.pg-handoff .ho-head { padding: 20px 24px 24px; }
.pg-handoff .ho-crumbs { display: flex; align-items: center; gap: 9px; font-size: 13px; }
.pg-handoff .ho-crumbs button { color: var(--ink3); font-size: 13px; font-weight: 500; transition: color .15s; }
.pg-handoff .ho-crumbs button:hover { color: var(--blue); }
.pg-handoff .ho-crumbs .cur { color: var(--ink2); font-weight: 500; }
.pg-handoff .ho-crumbs .sep { color: var(--ink3); opacity: .75; }
.pg-handoff .ho-headrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-top: 10px; }
.pg-handoff .ho-titlebar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pg-handoff .ho-titlebar h1 { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.pg-handoff .ho-degraded { padding: 6px 13px; }
.pg-handoff .ho-degraded .dot { width: 7px; height: 7px; }
.pg-handoff .ho-sub { color: var(--ink3); font-size: 13.5px; margin-top: 6px; }
.pg-handoff .ho-actions { display: flex; gap: 10px; flex: none; margin-top: 4px; }

/* ---------- handoff path ---------- */
.pg-handoff .ho-pathsec { margin-top: 18px; }
.pg-handoff .ho-pathsec > .lbl { display: block; margin-bottom: 12px; }
.pg-handoff .ho-path { display: flex; align-items: center; gap: 14px; }
.pg-handoff .ho-node { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-radius: 16px; flex: none; }
.pg-handoff .ho-node .ho-nname { font-weight: 700; font-size: 14.5px; letter-spacing: -.01em; white-space: nowrap; }
.pg-handoff .ho-node .ho-nsub { font-size: 12.5px; color: var(--ink3); margin-top: 2px; white-space: nowrap; }
.pg-handoff .ho-from { background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card); }
.pg-handoff .ho-from .ho-nicon { width: 40px; height: 40px; border-radius: 50%; background: var(--green-weak); color: var(--green); display: grid; place-items: center; flex: none; }
.pg-handoff .ho-to { border: 1.6px dashed var(--red-dot); background: var(--red-weak); }
.pg-handoff .ho-to .ho-nicon { color: var(--red); display: grid; place-items: center; flex: none; }
.pg-handoff .ho-to .ho-nsub { color: var(--red); }

.pg-handoff .ho-line { position: relative; flex: 1; height: 24px; min-width: 48px; }
.pg-handoff .ho-line .ln { position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 3px; transform-origin: left center; }
.pg-handoff .ho-lgreen .ln { background: var(--green-dot); animation: hoDraw .42s .08s cubic-bezier(.3, .7, .4, 1) both; }
.pg-handoff .ho-lgreen .tipdot { position: absolute; left: 0; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--green-dot); animation: hoIn .25s both; }
.pg-handoff .ho-lamber .ln { background: var(--amber); animation: hoDraw .46s .32s cubic-bezier(.3, .7, .4, 1) both; }
.pg-handoff .ho-slash { position: absolute; top: 50%; width: 3px; height: 16px; margin-top: -10px; border-radius: 3px; background: var(--red-dot); transform: rotate(24deg); animation: hoIn .22s both; }
.pg-handoff .ho-slash.s1 { right: 52px; animation-delay: .7s; }
.pg-handoff .ho-slash.s2 { right: 43px; animation-delay: .78s; }
.pg-handoff .ho-arrow { position: absolute; right: -2px; top: 50%; transform: translateY(-50%); color: var(--red-dot); animation: hoIn .3s .82s both; }
@keyframes hoDraw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes hoIn { from { opacity: 0; } to { opacity: 1; } }

.pg-handoff .ho-stats { display: flex; gap: 24px; padding: 12px 22px; border-radius: var(--r-pill); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card); flex: none; }
.pg-handoff .ho-stat b { display: block; font-size: 14px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.pg-handoff .ho-stat span { display: block; font-size: 11px; color: var(--ink3); margin-top: 1px; white-space: nowrap; }

/* ---------- main grid ---------- */
.pg-handoff .ho-grid { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr); gap: 18px; align-items: start; }

/* ---------- context comparison ---------- */
.pg-handoff .ho-ctx { padding: 22px 24px 20px; }
.pg-handoff .ho-ctx-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.pg-handoff .ho-ctx-head h2 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.pg-handoff .ho-ctx-head .badge { padding: 7px 13px; flex: none; }
.pg-handoff .ho-thead,
.pg-handoff .ho-tr { display: grid; grid-template-columns: var(--ho-cols); gap: 10px; align-items: center; }
.pg-handoff .ho-thead { padding: 0 17px 9px; }
.pg-handoff .ho-rows { display: flex; flex-direction: column; gap: 8px; }
.pg-handoff .ho-rowwrap { border-radius: 12px; }
.pg-handoff .ho-tr { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; cursor: pointer; transition: background .15s, border-color .15s; }
.pg-handoff .ho-tr:hover { background: var(--blue-softer); border-color: var(--line2); }
.pg-handoff .ho-rowwrap.bad .ho-tr { background: var(--red-weak); border-color: transparent; }
.pg-handoff .ho-rowwrap.bad .ho-tr:hover { border-color: var(--red-dot); }
.pg-handoff .ho-f { font-weight: 700; font-size: 13.5px; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-handoff .ho-f.red { color: var(--red); }
.pg-handoff .ho-c { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink2); min-width: 0; }
.pg-handoff .ho-c .ic { display: grid; place-items: center; flex: none; }
.pg-handoff .ho-c .ic.ok { color: var(--green); }
.pg-handoff .ho-c .ic.no { color: var(--red); }
.pg-handoff .ho-c.err { color: var(--red); font-weight: 500; }
.pg-handoff .ho-c.na { color: var(--ink3); }
.pg-handoff .ho-c .dash { font-weight: 600; width: 14px; text-align: center; flex: none; }
.pg-handoff .ho-tr .badge { justify-self: start; }
.pg-handoff .ho-missing { color: var(--red); font-size: 13px; font-weight: 700; }

.pg-handoff .ho-sample { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
.pg-handoff .ho-sample > div { overflow: hidden; min-height: 0; }
.pg-handoff .ho-rowwrap.open .ho-sample { grid-template-rows: 1fr; }
.pg-handoff .ho-sample code { display: block; margin: 8px 2px 2px; background: var(--canvas); border-radius: 9px; padding: 9px 13px; font-family: var(--ho-mono); font-size: 12.3px; color: var(--ink2); white-space: nowrap; overflow-x: auto; }

.pg-handoff .ho-drop { margin-top: 14px; font-size: 13.3px; }
.pg-handoff .ho-drop svg { flex: none; margin-top: 1px; }

.pg-handoff .ho-payload { margin-top: 18px; }
.pg-handoff .ho-prow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
.pg-handoff .ho-pval { font-size: 13px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.pg-handoff .ho-bar { height: 10px; border-radius: var(--r-pill); background: var(--canvas2); overflow: hidden; }
.pg-handoff .ho-bar i { display: block; height: 100%; width: 0; border-radius: var(--r-pill); background: linear-gradient(90deg, var(--amber), var(--red-dot)); animation: hoFill .85s .3s cubic-bezier(.25, .8, .3, 1) forwards; }
@keyframes hoFill { to { width: var(--ho-fill, 62%); } }
.pg-handoff .ho-bloat { color: var(--red); font-size: 12.8px; margin-top: 9px; }

.pg-handoff .ho-recent { margin-top: 20px; }
.pg-handoff .ho-recent > .lbl { display: block; margin-bottom: 8px; }
.pg-handoff .ho-rrow { display: grid; grid-template-columns: 88px minmax(0, 1fr) 72px 66px 52px; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 14px; border-radius: 11px; transition: background .15s; }
.pg-handoff .ho-rrow:hover { background: var(--blue-softer); }
.pg-handoff .ho-rrow .rid { font-weight: 700; font-size: 13.5px; letter-spacing: -.01em; }
.pg-handoff .ho-rrow .rst { display: flex; align-items: center; gap: 8px; font-size: 13.2px; color: var(--ink2); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pg-handoff .ho-rrow .rst.bad { color: var(--red); }
.pg-handoff .ho-rrow .rn { text-align: right; font-size: 13px; color: var(--ink2); white-space: nowrap; }

/* ---------- blast radius column ---------- */
.pg-handoff .ho-blast { padding: 20px 22px 22px; }
.pg-handoff .ho-blast > .lbl { display: block; margin-bottom: 12px; }
.pg-handoff .ho-kvs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pg-handoff .ho-ai { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; }
.pg-handoff .ho-iq { width: 30px; height: 30px; border-radius: 50%; background: var(--purple-weak); color: var(--purple); display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
.pg-handoff .ho-ai b { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.pg-handoff .ho-analysis { font-size: 13.4px; color: var(--ink2); line-height: 1.55; }
.pg-handoff .ho-fixbox { background: var(--blue-weak); border-radius: var(--r-md); padding: 14px 16px; margin-top: 14px; transition: background .3s; }
.pg-handoff .ho-fixbox .fx-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.pg-handoff .ho-fixbox .fx-head .badge { flex: none; }
.pg-handoff .ho-fixbox .fx-title { color: var(--blue); font-weight: 700; font-size: 14px; }
.pg-handoff .ho-fixbox p { font-size: 13px; color: var(--ink2); line-height: 1.5; }
.pg-handoff .ho-fixbox.applied { background: var(--green-weak); }
.pg-handoff .ho-fixbox.applied .fx-title { color: var(--green); }
.pg-handoff .ho-fixslot { margin-top: 14px; }
.pg-handoff .ho-create { width: 100%; }
.pg-handoff .ho-viewfix { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--green-weak); color: var(--green); border-radius: var(--r-pill); padding: 11px 20px; font-weight: 600; font-size: 14px; transition: transform .1s, filter .15s; }
.pg-handoff .ho-viewfix:hover { filter: brightness(.96); }
.pg-handoff .ho-viewfix:active { transform: scale(.98); }
.pg-handoff .ho-dismiss { display: flex; align-items: center; gap: 7px; margin: 13px auto 0; color: var(--ink3); font-size: 13.5px; font-weight: 500; transition: color .15s; }
.pg-handoff .ho-dismiss:hover { color: var(--ink); }
.pg-handoff .ho-undobar { display: none; width: 100%; align-items: center; justify-content: center; gap: 6px; margin: 14px auto 0; padding: 12px 14px; border: 1.5px dashed var(--line2); border-radius: var(--r-md); background: none; color: var(--ink3); font-size: 13px; font-weight: 500; transition: color .15s, border-color .15s; }
.pg-handoff .ho-undobar b { color: inherit; font-weight: 700; }
.pg-handoff .ho-undobar:hover { color: var(--blue); border-color: var(--blue); }
.pg-handoff .ho-else { margin-top: 16px; }
.pg-handoff .ho-else > .lbl { display: block; margin-bottom: 10px; }
.pg-handoff .ho-ecard { display: flex; align-items: flex-start; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; }
.pg-handoff .ho-ecard + .ho-ecard { margin-top: 8px; }
.pg-handoff .ho-ecard .dot { margin-top: 5px; }
.pg-handoff .ho-ecard b { display: block; font-size: 13.5px; letter-spacing: -.01em; }
.pg-handoff .ho-ecard span { display: block; font-size: 12.3px; color: var(--ink3); margin-top: 1px; }

/* ---------- create-fix modal (body element carries .pg-handoff class) ---------- */
.pg-handoff .ho-fixmodal .ho-diffhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.pg-handoff .ho-fixmodal .ho-file { font-family: var(--ho-mono); font-size: 12px; color: var(--ink3); background: var(--canvas); border-radius: 7px; padding: 4px 9px; }
.pg-handoff .ho-difflist { margin-bottom: 14px; }
.pg-handoff .ho-diffrow { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; border-radius: 10px; padding: 10px 13px; margin-bottom: 8px; }
.pg-handoff .ho-diffrow code { font-family: var(--ho-mono); font-size: 13px; font-weight: 600; white-space: nowrap; }
.pg-handoff .ho-diffrow span { font-size: 12px; color: var(--ink3); text-align: right; }
.pg-handoff .ho-diffrow.add { background: var(--green-weak); color: var(--green); }
.pg-handoff .ho-diffrow.del { background: var(--red-weak); color: var(--red); }
.pg-handoff .ho-fixmodal .callout { font-size: 13px; }

/* ---------- responsive ---------- */
@media (max-width: 1500px) {
  .pg-handoff .ho-path { gap: 10px; }
  .pg-handoff .ho-stats { gap: 16px; padding: 11px 16px; }
}
@media (max-width: 1320px) {
  .pg-handoff .ho-grid { grid-template-columns: minmax(0, 1.42fr) minmax(0, 1fr); }
  .pg-handoff { --ho-cols: 1.25fr .95fr 1fr .72fr; }
  .pg-handoff .ho-node { padding: 12px 14px; }
}
@media (max-width: 1080px) {
  .pg-handoff .ho-grid { grid-template-columns: 1fr; }
}

/* ==== css-overview.css ==== */
/* ==== css-overview.css — Overview page. All selectors under .pg-overview ==== */

.pg-overview { display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
.pg-overview.ov-in-modal { display: block; min-height: 0; }
.pg-overview.no-anim *, .pg-overview.no-anim *::before, .pg-overview.no-anim *::after { transition: none !important; animation: none !important; }

.pg-overview .ov-card { padding: 20px 22px; }
.pg-overview .ov-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }

.pg-overview .ov-row-top { display: grid; grid-template-columns: minmax(330px, 1fr) 2.02fr; gap: 18px; }
.pg-overview .ov-row-bottom { display: grid; grid-template-columns: 1fr 0.97fr 1.05fr; gap: 18px; align-items: stretch; }
@media (max-width: 1120px) {
  .pg-overview .ov-row-top, .pg-overview .ov-row-bottom { grid-template-columns: 1fr; }
}

/* ---------------- Health card ---------------- */
.pg-overview .ov-health-body { display: grid; grid-template-columns: 1.05fr 1fr; gap: 20px; align-items: center; margin-top: 10px; }

.pg-trace .td-tl-l2 { font-size: 12.5px; color: var(--ink3); margin-top: 2px; }

/* ---------- context tab ---------- */
.pg-trace .td-ctxlist { display: flex; flex-direction: column; margin-top: 14px; }
.pg-trace .td-ctxhop { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--card); padding: 14px 18px; }
.pg-trace .td-ctxhop.bad { border: 1.5px dashed var(--red); background: var(--red-weak); }
.pg-trace .td-ctxwho { flex: 1; min-width: 0; }
.pg-trace .td-ctxwho b { font-size: 15px; display: block; }
.pg-trace .td-ctxwho > span { font-size: 12.5px; color: var(--ink3); display: block; margin-top: 1px; }
.pg-trace .td-ctxhop.bad .td-ctxwho b, .pg-trace .td-ctxhop.bad .td-ctxwho > span { color: var(--red); }
.pg-trace .td-kbbar { display: block; height: 6px; border-radius: 4px; background: var(--canvas); margin-top: 8px; overflow: hidden; max-width: 420px; }
.pg-trace .td-kbbar i { display: block; height: 100%; border-radius: 4px; background: var(--blue); transition: width .3s ease; }
.pg-trace .td-ctxhop.bad .td-kbbar { background: color-mix(in srgb, var(--red) 15%, transparent); }
.pg-trace .td-ctxhop.bad .td-kbbar i { background: var(--red); }
.pg-trace .td-ctxarrow { display: grid; place-items: center; color: var(--ink3); padding: 4px 0; }
.pg-trace .td-ctxarrow svg { transform: rotate(90deg); }
.pg-trace .td-ctxcallout { margin-top: 16px; }

/* ---------- metadata tab ---------- */
.pg-trace .td-mdgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.pg-trace .td-mdgrid .kv .v.red { color: var(--red); }

/* ---------- raw json tab ---------- */
.pg-trace .td-json { margin-top: 14px; background: var(--canvas); border-radius: var(--r-md); padding: 16px 18px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.65; overflow: auto; max-height: 640px; white-space: pre; color: var(--ink2); }
.pg-trace .td-json .j-key { color: var(--blue); }
.pg-trace .td-json .j-str { color: var(--green); }
.pg-trace .td-json .j-num { color: var(--amber-ink); }
.pg-trace .td-json .j-bool { color: var(--purple); }

/* ---------- responsive ---------- */
@media (max-width: 1360px) {
  .pg-trace .td-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1100px) {
  .pg-trace .td-grid { grid-template-columns: 1fr; }
  .pg-trace .td-right { position: static; }
  .pg-trace .td-mdgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pg-trace .td-body { min-height: 0; }
}
@media (max-width: 760px) {
  .pg-trace .td-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pg-trace .td-axis, .pg-trace .td-row { grid-template-columns: 128px minmax(0, 1fr) 88px; }
  .pg-trace .td-mdgrid { grid-template-columns: 1fr; }
}

/* ==== css-traces.css ==== */
/* ==== css-traces.css — Traces list page (all selectors scoped to .pg-traces) ==== */
.pg-traces { gap: 16px; }

/* ---- header card: title + actions + search + filter row ---- */
.pg-traces .tr-headcard { padding: 22px 26px 18px; display: flex; flex-direction: column; gap: 15px; }
.pg-traces .tr-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.pg-traces .tr-head h1 { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.08; }
.pg-traces .tr-head .sub { margin-top: 5px; }
.pg-traces .tr-actions { display: flex; align-items: center; gap: 12px; flex: none; }
.pg-traces .tr-actions .pill-btn, .pg-traces .tr-actions .btn-primary { gap: 8px; }

/* search */
.pg-traces .searchbar { transition: border-color .15s, box-shadow .15s; }
.pg-traces .searchbar:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-weak); }

/* filter row */
.pg-traces .tr-filterrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.pg-traces .tr-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; min-width: 0; }
.pg-traces .tr-count { font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }

/* ---- table card ---- */
.pg-traces .tr-tablecard { padding: 20px 26px 12px; }
.pg-traces .table-g th { padding: 0 16px 10px; }
.pg-traces .table-g th:first-child, .pg-traces .table-g td:first-child { padding-left: 20px; }
.pg-traces .table-g th:nth-child(1) { width: 14.5%; }
.pg-traces .table-g th:nth-child(2) { width: 21%; }
.pg-traces .table-g th:nth-child(3) { width: 10%; }
.pg-traces .table-g th:nth-child(4) { width: 10%; }
.pg-traces .table-g th:nth-child(5) { width: 7%; }
.pg-traces .table-g th:nth-child(6) { width: 9.5%; }
.pg-traces .table-g th:nth-child(7) { width: 8%; }
.pg-traces .table-g th:nth-child(8) { width: 11%; }
.pg-traces .table-g td { padding: 9px 16px; }
.pg-traces .wf-pill { padding: 3px 10px; font-size: 12.5px; line-height: 1.35; }
.pg-traces .badge { padding: 3px 10px; font-size: 12.5px; line-height: 1.35; }
.pg-traces .tr-idcell { display: flex; align-items: center; gap: 10px; }
.pg-traces .td-dim { color: var(--ink2); }
.pg-traces .td-strong { font-weight: 700; letter-spacing: -.01em; }
.pg-traces .td-chev { color: var(--ink3); width: 40px; }
.pg-traces .badge .dot { width: 7px; height: 7px; }

/* row entrance (first paint stagger) + live-stream freshness */
.pg-traces tbody tr { animation: trRowIn .38s ease both; animation-delay: var(--d, 0ms); }
.pg-traces tbody.no-anim tr { animation: none; }
@keyframes trRowIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
.pg-traces tbody tr.fresh { animation: trFreshIn .5s cubic-bezier(.2, .9, .3, 1.1) both; }
.pg-traces tbody tr.fresh > td { animation: trFreshBg 1.8s ease; }
@keyframes trFreshIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
@keyframes trFreshBg { 0%, 35% { background: var(--blue-weak); } 100% { background: var(--card); } }

/* ---- footer ---- */
.pg-traces .tr-foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-top: 12px; }
.pg-traces .tr-footnote { color: var(--ink3); font-size: 13px; }
.pg-traces .tr-foot b { font-weight: 600; }

/* ---- empty state ---- */
.pg-traces .tr-empty[hidden] { display: none; }
.pg-traces .tr-empty { padding: 48px 20px 42px; display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center; }
.pg-traces .tr-empty .ic { width: 46px; height: 46px; border-radius: 50%; background: var(--canvas); color: var(--ink3); display: grid; place-items: center; margin-bottom: 6px; }
.pg-traces .tr-empty b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.pg-traces .tr-empty .pill-btn { margin-top: 10px; gap: 7px; }

</style>

  /* ============ data aggregation (all numbers derived from OIQ_DATA) ============ */
  function aggWorkflows() {
    const map = {};
    D.workflows.forEach((w) => { map[w] = { name: w, runs: 0, ok: 0, fail: 0, cost: 0, tokens: 0 }; });
    D.traces.forEach((t) => {
      const m = map[t.workflow]; if (!m) return;
      m.runs++; m.cost += t.cost; m.tokens += t.tokens;
      if (t.status === 'Success') m.ok++; else m.fail++;
    });
    return D.workflows.map((w) => map[w]).sort((a, b) => b.runs - a.runs);
  }
  function aggRunsByWorkflow() { return aggWorkflows().map((m) => ({ name: m.name, count: m.runs })); }
  function aggTokensByModel() {
    const fam = { 'GPT-5': 'GPT-5', 'GPT-5 mini': 'GPT-5', 'Claude Sonnet 4.6': 'Claude', 'Gemini 2.5 Pro': 'Gemini' };
    const out = { 'GPT-5': 0, 'Claude': 0, 'Gemini': 0 };
    let total = 0;
    D.traces.forEach((t) => { total += t.tokens; });
    D.traces.forEach((t) => (t.spans || []).forEach((s) => { const k = fam[s.model]; if (k) out[k] += s.tok; }));
    const spanned = out['GPT-5'] + out['Claude'] + out['Gemini'] || 1;
    // normalise the three shares onto the trace-level token total
    const keys = ['GPT-5', 'Claude', 'Gemini'];
    keys.forEach((k) => { out[k] = Math.round(out[k] / spanned * total); });
    return { shares: out, total };
  }
  const FAIL_CATS = [['Context loss', 'red'], ['Timeout', 'amber'], ['Validation', 'purple'], ['Tool failure', 'blue']];
  function aggFailures() {
    const counts = {}; FAIL_CATS.forEach(([c]) => { counts[c] = 0; });
    let failed = 0;
    D.traces.forEach((t) => {
      if (t.status !== 'Failed') return;
      failed++;
      const c = t.rootCause && counts[t.rootCause] !== undefined ? t.rootCause : 'Tool failure';
      counts[c]++;
    });
    return { counts, failed };
  }
  function agentCallStats() {
    const st = {};
    D.traces.forEach((t) => (t.spans || []).forEach((s) => {
      st[s.agent] = st[s.agent] || { calls: 0, ok: 0 };
      st[s.agent].calls++;
      if (!s.err) st[s.agent].ok++;
    }));
    return st;
  }

  function wfSpark(name, succ, degraded) {
    const W = 232, Hh = 44, px = 4, py = 6;
    const r = rngFrom(hashStr('wfspark:' + name));
    const ptsV = [];
    let v = 50;
    const drift = (succ === null ? 0 : (succ >= 55 ? 1.5 : -1.6));
    for (let i = 0; i < 18; i++) { v += (r() - 0.5) * 16 + drift; v = Math.max(8, Math.min(92, v)); ptsV.push(v); }
    const lo = Math.min.apply(null, ptsV), hi = Math.max.apply(null, ptsV), span = (hi - lo) || 1;
    const pts = ptsV.map((val, i) => [px + i * (W - 2 * px) / (ptsV.length - 1), py + (1 - (val - lo) / span) * (Hh - 2 * py)]);
    const gid = 'xsg' + (++uid);
    const tone = degraded ? 'amber' : 'green';
    const dLine = smoothPath(pts);
    return '<svg class="tone-' + tone + '" viewBox="0 0 ' + W + ' ' + Hh + '" preserveAspectRatio="none" aria-hidden="true">'
      + '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
      + '<stop class="sa" offset="0" stop-opacity="0.2"></stop><stop class="sb" offset="1" stop-opacity="0"></stop>'
      + '</linearGradient></defs>'
      + '<path class="pgx-spark-area" d="' + dLine + ' L ' + (W - px) + ' ' + (Hh - 1) + ' L ' + px + ' ' + (Hh - 1) + ' Z" fill="url(#' + gid + ')"></path>'
      + '<path class="pgx-spark-line" d="' + dLine + '" vector-effect="non-scaling-stroke"></path>'
      + '<circle class="pgx-spark-end" cx="' + pts[pts.length - 1][0].toFixed(1) + '" cy="' + pts[pts.length - 1][1].toFixed(1) + '" r="2.6"></circle>'
      + '</svg>';
  }

        + '<button class="toolbar-pill" data-a="zin">Zoom in</button>'

      root.appendChild(page);
      const scroll = page.querySelector('.pg-scroll');

      const canvas = el('<div class="pgx-lm-canvas"><div class="pgx-lm-world">'
        + '<svg class="pgx-lm-svg" aria-hidden="true">'
        + LM_EDGES.map((e, i) => '<path class="pgx-lm-edge tone-' + e[2] + '" data-i="' + i + '"></path>').join('')
        + '</svg></div>'
        + '<div class="pgx-lm-legend">' + D.network.legend.map((l) => '<span class="pgx-l-lg"><span class="dot dot-' + l[1] + '"></span>' + esc(l[0]) + '</span>').join('') + '</div>'
        + '<div class="pgx-lm-zoomchip" data-ref="zoom">100%</div>'
        + '</div>');
      scroll.appendChild(canvas);
      const world = canvas.querySelector('.pgx-lm-world');
      const svg = canvas.querySelector('.pgx-lm-svg');
      const edgeEls = Array.prototype.slice.call(svg.querySelectorAll('.pgx-lm-edge'));

      // nodes
      const nodeEls = {};
      nodes.forEach((n) => {
        const nb = el('<button class="pgx-lm-node ' + n.health + (n.degraded ? ' degraded' : '') + '" data-id="' + n.id + '" style="left:clamp(78px, ' + n.x + '%, calc(100% - 78px));top:clamp(26px, ' + n.y + '%, calc(100% - 26px))">'
          + '<span class="pgx-lm-box"><span class="ic-circle ' + (IC_TONE[n.health] || 'ic-blue') + '">' + icon(n.icon, 15) + '</span>'
          + '<span class="pgx-lm-txt"><b>' + esc(n.label) + '</b><i>' + esc(n.sub) + '</i></span></span></button>');
        world.appendChild(nb);
        nodeEls[n.id] = nb;
        nb.addEventListener('mouseenter', (e) => { hover(n.id); showTip('<b>' + esc(n.label) + '</b> · ' + esc(n.sub), e); });
        nb.addEventListener('mousemove', moveTip);
        nb.addEventListener('mouseleave', () => { hover(null); hideTip(); });
        nb.addEventListener('click', () => goTracesFiltered(n.label));
      });
      function hover(id) {
        canvas.classList.toggle('dimmed', !!id);
        edgeEls.forEach((p) => {
          const e = LM_EDGES[+p.dataset.i];
          p.classList.toggle('rel', !!id && (e[0] === id || e[1] === id));
        });
        Object.keys(nodeEls).forEach((k) => {
          const linked = LM_EDGES.some((e) => (e[0] === id && e[1] === k) || (e[1] === id && e[0] === k));
          nodeEls[k].classList.toggle('rel', !id || k === id || linked);
        });
      }

      // ---- geometry: measure node anchors at scale 1, build bezier edges ----
      let geo = []; // [{p0,c1,c2,p1,dur,len}]
      function draw() {
        const wr = world.getBoundingClientRect();
        if (!wr.width || !wr.height) return;
        const s = view.s || 1;
        const box = {};
        nodes.forEach((n) => {
          const r = nodeEls[n.id].querySelector('.pgx-lm-box').getBoundingClientRect();
          box[n.id] = {
            l: (r.left - wr.left) / s, r: (r.right - wr.left) / s,
            t: (r.top - wr.top) / s, b: (r.bottom - wr.top) / s,
            cy: (r.top + r.height / 2 - wr.top) / s,
          };
        });
        geo = LM_EDGES.map((e, i) => {
          const a = box[e[0]], b = box[e[1]];
          const p0 = { x: a.r, y: a.cy }, p1 = { x: b.l, y: b.cy };
          const mx = (p0.x + p1.x) / 2;
          const c1 = { x: mx + 14, y: p0.y }, c2 = { x: mx - 14, y: p1.y };
          let len = 0, px = p0.x, py = p0.y;
          for (let k = 1; k <= 8; k++) {
            const q = bez({ p0, c1, c2, p1 }, k / 8);
            len += Math.hypot(q.x - px, q.y - py); px = q.x; py = q.y;
          }
          edgeEls[i].setAttribute('d', 'M ' + p0.x.toFixed(1) + ' ' + p0.y.toFixed(1)
            + ' C ' + c1.x.toFixed(1) + ' ' + c1.y.toFixed(1) + ', ' + c2.x.toFixed(1) + ' ' + c2.y.toFixed(1) + ', ' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1));
          return { p0, c1, c2, p1, len, dur: 2.2 + len / 240 };
        });
      }
      function bez(g, t) {
        const u = 1 - t;
        return {
          x: u * u * u * g.p0.x + 3 * u * u * t * g.c1.x + 3 * u * t * t * g.c2.x + t * t * t * g.p1.x,
          y: u * u * u * g.p0.y + 3 * u * u * t * g.c1.y + 3 * u * t * t * g.c2.y + t * t * t * g.p1.y,
        };
      }

      // ---- flow particles (rAF along the beziers) ----
      const parts = []; // {el, ei, t, speed}
      const SVGNS = 'http://www.w3.org/2000/svg';
      const rr = rngFrom(777001);
      LM_EDGES.forEach((e, i) => {
        const n = e[2] === 'gray' ? 2 : 3;
        for (let k = 0; k < n; k++) {
          const c = document.createElementNS(SVGNS, 'circle');
          c.setAttribute('class', 'pgx-lm-pdot tone-' + e[2]);
          c.setAttribute('r', e[2] === 'gray' ? 3 : 3.6);
          svg.appendChild(c);
          parts.push({ el: c, ei: i, t: rr(), speed: 0.85 + rr() * 0.4 });
        }
      });
      let liveOn = !OIQ.freeze;
      let lastT = 0;
      function tick(now) {
        const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i], g = geo[p.ei];
          if (!g) continue;
          p.t = (p.t + dt * p.speed / g.dur) % 1;
          const q = bez(g, p.t);
          p.el.setAttribute('cx', q.x.toFixed(1));
          p.el.setAttribute('cy', q.y.toFixed(1));
        }
        clean.raf = requestAnimationFrame(tick);
      }
      function setLive(on) {
        liveOn = on;
        if (clean.raf) { cancelAnimationFrame(clean.raf); clean.raf = 0; }
        if (on) { lastT = performance.now(); clean.raf = requestAnimationFrame(tick); }
        parts.forEach((p) => { p.el.style.opacity = on ? '' : '0.25'; });
        const dot = page.querySelector('[data-ref="livedot"]');
        dot.className = 'dot ' + (on ? 'dot-green' : 'dot-gray');
        page.querySelector('.pgx-lm-live').classList.toggle('off', !on);
      }

      // ---- zoom / fit / pan ----
      const view = { s: 1, tx: 0, ty: 0 };
      function applyView() {
        world.style.transform = 'translate(' + view.tx.toFixed(1) + 'px,' + view.ty.toFixed(1) + 'px) scale(' + view.s.toFixed(3) + ')';
        canvas.querySelector('[data-ref="zoom"]').textContent = Math.round(view.s * 100) + '%';
      }
      function zoom(k) {
        const r = canvas.getBoundingClientRect();
        const ns = Math.max(0.5, Math.min(2, view.s * k));
        const kk = ns / view.s;
        view.tx = r.width / 2 - kk * (r.width / 2 - view.tx);
        view.ty = r.height / 2 - kk * (r.height / 2 - view.ty);
        view.s = ns;
        applyView();
      }
      function fit() { view.s = 1; view.tx = 0; view.ty = 0; applyView(); }
      page.querySelector('[data-a="zout"]').addEventListener('click', () => zoom(1 / 1.25));
      page.querySelector('[data-a="zin"]').addEventListener('click', () => zoom(1.25));
      page.querySelector('[data-a="fit"]').addEventListener('click', () => { fit(); toast('View reset to fit', 'info'); });
      page.querySelector('[data-a="live"]').addEventListener('click', () => {
        setLive(!liveOn);
        toast(liveOn ? 'Live updates resumed' : 'Live updates paused', liveOn ? 'success' : 'warn');
      });
      let pan = null;
      const onDown = (e) => {
        if (e.target.closest('.pgx-lm-node') || e.target.closest('.pgx-lm-legend')) return;
        pan = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty };
        canvas.classList.add('grabbing');
      };
      const onMove = (e) => {
        if (!pan) return;
        view.tx = pan.tx + (e.clientX - pan.x);
        view.ty = pan.ty + (e.clientY - pan.y);
        applyView();
      };
      const onUp = () => { pan = null; canvas.classList.remove('grabbing'); };
      canvas.addEventListener('pointerdown', onDown);
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      clean.unbinds.add(() => {
        canvas.removeEventListener('pointerdown', onDown);
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      });

      const ro = new ResizeObserver(draw);
      ro.observe(canvas);
      nodes.forEach((n) => ro.observe(nodeEls[n.id]));
      clean.robs.add(ro);
      requestAnimationFrame(draw);
      later(draw, 350);
      applyView();
      setLive(liveOn);
    },
    unmount() { clearAll(); },
  });

        const ok = t.status === 'Success';
        const dot = ok ? 'dot-green' : 'dot-red';
        return `<tr data-id="${esc(t.id)}" class="${cls || ''}" style="--d:${i * 28}ms">
          <td><span class="tr-idcell"><span class="dot ${dot}"></span><span class="mono">${esc(t.id)}</span></span></td>
          <td><span class="wf-pill">${esc(t.workflow)}</span></td>
          <td class="td-dim">${esc(t.startedClock)}</td>
          <td class="td-strong">${esc(t.durText)}</td>
          <td>${t.agents}</td>
          <td>${fmt.num(t.tokens)}</td>
          <td class="td-strong">${fmt.money(t.cost)}</td>
          <td><span class="badge ${ok ? 'badge-green' : 'badge-red'}"><span class="dot ${dot}"></span>${ok ? 'Success' : 'Failed'}</span></td>
          <td class="td-chev">${icon('chevron-right', 16)}</td>
        </tr>`;
      }

      function update(opts = {}) {
        const list = filtered();
        const stagger = opts.anim === 'stagger';
        const slice = list.slice(0, st.pageSize);
        refs.tbody.className = stagger ? '' : 'no-anim';
        refs.tbody.innerHTML = slice.map((t, i) => rowHtml(t, i, opts.fresh && i === 0 ? 'fresh' : '')).join('');
        refs.count.textContent = `${list.length} ${list.length === 1 ? 'trace matches' : 'traces match'}`;
        refs.foot.textContent = `Showing ${slice.length} of ${list.length} matching traces · streaming live`;
        refs.empty.hidden = list.length > 0;
        refs.table.hidden = list.length === 0;
      }

      function renderChips() {
        const box = refs.chips;
        box.innerHTML = '';
        st.chips.forEach((c, i) => {
          box.appendChild(el(`<span class="chip">${esc(c.text)}<button class="chip-x" data-i="${i}" title="Remove filter">${icon('x', 11)}</button></span>`));
        });
        const has = (type) => st.chips.some((c) => c.type === type);
        const add = el(`<button class="add-filter">${icon('plus', 14)}Add filter</button>`);
        add.onclick = () => OIQ.ui.dropdown(add, [
          { head: 'Filter by' },
          ...CATS.map(([type, label, ic]) => ({ label, icon: ic, value: type, checked: has(type) })),
        ], (it) => {
          if (has(it.value)) { toast('That filter is already active', 'info'); return; }
          st.chips.push(CHIP[it.value]());
          st.interactive = true;
          renderChips();
          update();
        });
        box.appendChild(add);
      }

      // ---- header actions ----
      page.querySelector('[data-act="saved"]').onclick = (e) => {
        OIQ.ui.dropdown(e.currentTarget, [
          { head: 'Saved views' },
          ...VIEWS.map((v) => ({ label: v.label, icon: v.icon, value: v.label })),
        ], (it) => {
          const v = VIEWS.find((x) => x.label === it.value);
          if (!v) return;
          st.chips = v.make();
          st.interactive = true;
          renderChips();
          update();
          toast(`Saved view “${v.label}” applied`, 'success');
        });
      };

      page.querySelector('[data-act="export"]').onclick = () => {
        const list = filtered();
        const head = 'Trace ID,Workflow,Started,Duration,Agents,Tokens,Cost USD,Status';
        const lines = list.map((t) => [
          t.id, `"${t.workflow}"`, t.startedClock, t.durText, t.agents, t.tokens, t.cost.toFixed(2), t.status,
        ].join(','));
        const blob = new Blob([head + '\n' + lines.join('\n') + '\n'], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'traces_export.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        toast(`Exported ${list.length} traces to traces_export.csv`, 'success');
      };

      page.querySelector('[data-act="clear"]').onclick = () => {
        st.chips = [];
        st.query = '';
        OIQ.state.traceQuery = '';
        refs.input.value = '';
        st.interactive = true;
        renderChips();
        update();
        toast('All filters cleared', 'success');
      };

      // ---- search (two-way with OIQ.state.traceQuery) ----
      refs.input.value = st.query;
      refs.input.addEventListener('input', () => {
        st.query = refs.input.value;
        OIQ.state.traceQuery = refs.input.value;
        st.interactive = true;
        update();
      });
      refs.input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && refs.input.value) {
          st.query = '';
          OIQ.state.traceQuery = '';
          refs.input.value = '';
          update();
          refs.input.blur();
        }
      });
      // ⌘K / Ctrl-K focuses the trace search (contract §8); capture phase so the
      // global command-palette handler in core.js is skipped while on this page.
      const onKeyCap = (e) => {
        if ((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() === 'k') {
          if (document.querySelector('.cmdk-overlay')) return;
          e.preventDefault();
          e.stopPropagation();
          refs.input.focus();
          refs.input.select();
        }
      };
      document.addEventListener('keydown', onKeyCap, true);

      // ---- chips: remove / add ----
      refs.chips.addEventListener('click', (e) => {
        const x = e.target.closest('.chip-x');
        if (!x) return;
        st.chips.splice(+x.dataset.i, 1);
        st.interactive = true;
        renderChips();
        update();
      });

      // ---- row click -> trace detail ----
      refs.table.addEventListener('click', (e) => {
        const tr = e.target.closest('tbody tr');
        if (tr && tr.dataset.id) OIQ.go('#/trace/' + tr.dataset.id);
      });

      // ---- rows per page ----
      refs.rpp.onclick = () => OIQ.ui.dropdown(refs.rpp, [
        { head: 'Rows per page' },
        ...[12, 24, 48].map((n) => ({ label: String(n), value: n, checked: st.pageSize === n })),
      ], (it) => {
        st.pageSize = it.value;
        refs.rppn.textContent = it.value;
        update();
      });

      // ---- live stream: new trace slides in at the top ----
      const offLive = OIQ.on('live-trace', (t) => {
        st.rows.unshift(t);
        const list = filtered();
        update({ fresh: list.length > 0 && list[0].id === t.id });
      });

      // ---- first paint ----
      renderChips();
      update({ anim: 'stagger' });

      cleanup = () => {
        offLive();
        document.removeEventListener('keydown', onKeyCap, true);
      };
    },

    unmount() {
      if (cleanup) { cleanup(); cleanup = null; }
    },
  });
})();

</script>
</body>
</html>
