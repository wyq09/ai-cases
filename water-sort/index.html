<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>倒水挑战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #2A211B;
    display: flex; justify-content: center;
  }
  #app {
    position: relative; width: 100%; max-width: 100%; height: 100%;
    height: 100dvh;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    background: #F7A83B;
  }
  @media (min-width: 700px) {
    #app { max-width: 440px; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 14px 44px rgba(0,0,0,.45); }
  }
  .snap *, .snap *::before, .snap *::after { transition: none !important; animation: none !important; }

  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gameCanvas { z-index: 1; }
  #fxCanvas { z-index: 2; pointer-events: none; }

  /* ---------- 启动页 ---------- */
  #splash {
    position: absolute; inset: 0; z-index: 60;
    display: flex; flex-direction: column; align-items: center;
    background:
      radial-gradient(ellipse 5px 8px at 88px 82px, #D8821F 98%, transparent 100%),
      radial-gradient(ellipse 5px 8px at 112px 82px, #D8821F 98%, transparent 100%),
      radial-gradient(ellipse 30px 24px at 100px 82px, rgba(232,149,44,.85) 97%, transparent 100%),
      radial-gradient(ellipse 5px 8px at 186px 168px, #D8821F 98%, transparent 100%),
      radial-gradient(ellipse 5px 8px at 210px 168px, #D8821F 98%, transparent 100%),
      radial-gradient(ellipse 30px 24px at 198px 168px, rgba(232,149,44,.85) 97%, transparent 100%),
      radial-gradient(ellipse 5px 8px at 26px 190px, #D8821F 98%, transparent 100%),
      radial-gradient(ellipse 5px 8px at 50px 190px, #D8821F 98%, transparent 100%),
      radial-gradient(ellipse 30px 24px at 38px 190px, rgba(232,149,44,.85) 97%, transparent 100%),
      linear-gradient(180deg, #F8AC41, #F29A28);
    background-size: 236px 236px, 236px 236px, 236px 236px, 236px 236px, 236px 236px, 236px 236px, 236px 236px, 236px 236px, 236px 236px, 100% 100%;
    transition: opacity .45s ease, visibility .45s;
  }
  #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #splashLogo { width: 72%; max-width: 340px; margin-top: 9%; filter: drop-shadow(0 6px 0 rgba(140,70,10,.25)); }
  #splashPig { width: 62%; max-width: 300px; margin-top: 4%; animation: rideBob 2.2s ease-in-out infinite; }
  @keyframes rideBob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-7px) rotate(1.2deg); }
  }
  #splashBar {
    width: 70%; max-width: 320px; height: 22px; border-radius: 999px;
    background: #D8821F; border: 2px solid #C06F14;
    margin-top: auto; overflow: hidden; position: relative;
  }
  #splashFill {
    position: absolute; inset: 2px; width: 0%; border-radius: 999px;
    background: #4FA8E0; transition: width 1.15s cubic-bezier(.3,.6,.4,1);
  }
  #splashFill::after {
    content: ""; position: absolute; left: 6px; right: 6px; top: 3px; height: 5px;
    border-radius: 999px; background: rgba(255,255,255,.45);
  }
  #splashStart {
    margin-top: 14px; display: none;
    font: 800 20px/1 inherit; letter-spacing: 6px; text-indent: 6px; color: #fff;
    background: #4FA8E0; border: 0; border-bottom: 4px solid #2F7FB8;
    padding: 13px 52px; border-radius: 999px; cursor: pointer; font-family: inherit;
  }
  #splashStart:active { transform: translateY(2px); border-bottom-width: 2px; }
  #splash.ready #splashStart { display: block; animation: popIn .3s ease; }
  @keyframes popIn { from { transform: scale(.6); opacity: 0; } }
  #splashFoot {
    margin: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
    font-size: 11px; color: rgba(122,62,10,.75); letter-spacing: 1px;
  }
  #splash.ready #splashBar { display: none; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; z-index: 10; left: 0; right: 0;
    top: env(safe-area-inset-top, 0px);
    padding: 10px 10px 0; display: flex; align-items: center; gap: 8px;
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  .hbtn {
    width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto;
    background: #F5B93C; border: 0; border-bottom: 4px solid #D89A28;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .hbtn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .hbtn img { width: 22px; height: 22px; }
  #levelPill, #pctPill {
    background: #FFF7E8; color: #7A4A1E; border-radius: 999px;
    font-weight: 800; font-size: 16px; line-height: 1;
    padding: 9px 16px; box-shadow: 0 2px 0 rgba(90,50,10,.18);
  }
  #levelPill { margin-left: 4px; }
  #pctPill { margin-left: auto; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }

  /* ---------- 底部工具条 ---------- */
  #toolbar {
    position: absolute; z-index: 10; left: 0; right: 0;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center; gap: 10px; padding: 0 12px;
  }
  .tbtn {
    flex: 1; max-width: 86px;
    background: #FFF3DC; border: 2px solid #E8CFA5; border-bottom-width: 4px;
    border-radius: 14px; padding: 7px 2px 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: #8A5A2A; font: 700 11px/1 inherit; font-family: inherit;
    position: relative;
  }
  .tbtn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .tbtn img { width: 22px; height: 22px; }
  .tbtn[disabled] { opacity: .45; pointer-events: none; }
  .tbtn .bdg {
    position: absolute; top: -7px; right: -4px;
    background: #E2483D; color: #fff; border-radius: 999px;
    font: 800 10px/1 inherit; padding: 3px 6px; border: 2px solid #FFF3DC;
  }

  /* ---------- 新手气泡 ---------- */
  #bubble {
    position: absolute; z-index: 9; left: 14px; right: 14px;
    bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 0;
    transition: opacity .4s, transform .4s;
  }
  #bubble.hide { opacity: 0; transform: translateY(8px); pointer-events: none; }
  #bubbleFace {
    width: 56px; height: 56px; border-radius: 50%; flex: 0 0 auto;
    background: #BFE3F0; border: 3px solid #FFF7E8; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
  }
  #bubbleFace img { width: 150%; display: block; }
  #bubbleText {
    position: relative; margin-left: -6px;
    background: #FFF7E8; color: #7A4A1E; font-weight: 700; font-size: 15px;
    border-radius: 14px; padding: 12px 16px; box-shadow: 0 2px 0 rgba(90,50,10,.15);
  }
  #bubbleText::before {
    content: ""; position: absolute; left: -7px; top: 50%; margin-top: -7px;
    border: 7px solid transparent; border-right-color: #FFF7E8; border-left: 0;
  }

  /* ---------- 覆盖层通用 ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(43, 24, 8, .5);
    display: flex; align-items: center; justify-content: center;
    opacity: 1; transition: opacity .25s; padding: 24px;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .card {
    width: 100%; max-width: 300px; background: #FFF7E8;
    border-radius: 20px; padding: 22px 20px 18px; text-align: center;
    box-shadow: 0 10px 30px rgba(40,20,0,.35);
    transform: translateY(0); transition: transform .25s;
  }
  .overlay.hidden .card { transform: translateY(14px); }
  .card h2 { color: #7A4A1E; font-size: 24px; margin-bottom: 4px; }
  .card .sub { color: #A5794A; font-size: 13px; margin-bottom: 14px; }
  .card .stars { font-size: 0; margin: 2px 0 10px; display: flex; justify-content: center; gap: 6px; }
  .card .stars img { width: 38px; height: 38px; }
  .card .stars img.dim { opacity: .22; filter: grayscale(1); }
  .mbtn {
    display: block; width: 100%; margin-top: 10px;
    font: 800 17px/1 inherit; font-family: inherit; border-radius: 999px;
    padding: 13px 0; cursor: pointer;
    background: #FFF7E8; color: #8A5A2A; border: 2px solid #E0C194;
  }
  .mbtn:active { transform: scale(.98); }
  .mbtn.primary { background: #4FA8E0; border: 0; border-bottom: 4px solid #2F7FB8; color: #fff; font-size: 18px; padding: 14px 0; }
  .mbtn.primary:active { transform: translateY(2px); border-bottom-width: 2px; }

  /* ---------- toast ---------- */
  #toast {
    position: absolute; z-index: 40; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(6px);
    background: rgba(60,34,10,.88); color: #FFEFD6;
    font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 999px;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    max-width: 82%; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #panelHost { position: absolute; inset: 0; z-index: 35; pointer-events: none; }
  #panelHost > * { pointer-events: auto; }

  /* ---------- 横屏矮窗 ---------- */
  @media (max-height: 540px) {
    #splashLogo { width: 46%; margin-top: 3%; }
    #splashPig { width: 34%; margin-top: 1%; }
    #splashBar { margin-top: 10px; width: 46%; }
    #hud { padding-top: 6px; }
    .hbtn { width: 38px; height: 38px; border-bottom-width: 3px; }
    #levelPill, #pctPill { font-size: 14px; padding: 7px 13px; }
    #toolbar { bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
    .tbtn { flex-direction: row; padding: 8px 10px; max-width: none; gap: 6px; }
    #bubble { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gameCanvas"></canvas>
    <canvas id="fxCanvas"></canvas>

    <div id="hud">
      <button id="pauseBtn" class="hbtn" aria-label="暂停"><img alt=""></button>
      <div id="levelPill">第 1 关</div>
      <div id="pctPill">0%</div>
    </div>

    <div id="toolbar">
      <button class="tbtn" id="undoBtn"><img alt=""><span>撤销</span></button>
      <button class="tbtn" id="hintBtn"><img alt=""><span>提示</span></button>
      <button class="tbtn" id="addBtn"><img alt=""><span>加瓶</span><b class="bdg">1</b></button>
      <button class="tbtn" id="restartBtn"><img alt=""><span>重开</span></button>
    </div>

    <div id="bubble">
      <div id="bubbleFace"><img alt=""></div>
      <div id="bubbleText">把同色的水倒入一个瓶子里</div>
    </div>

    <div id="pauseMenu" class="overlay hidden">
      <div class="card">
        <h2>游戏暂停</h2>
        <div class="sub" id="pauseSub">第 1 关</div>
        <button class="mbtn primary" id="pmResume">继续游戏</button>
        <button class="mbtn" id="pmRestart">重玩本关</button>
        <button class="mbtn" id="pmSkip">跳过此关</button>
        <button class="mbtn" id="pmSettings">设 置</button>
        <button class="mbtn" id="pmHome">回到封面</button>
      </div>
    </div>

    <div id="winPanel" class="overlay hidden">
      <div class="card">
        <h2>过关！</h2>
        <div class="stars" id="winStars"></div>
        <div class="sub" id="winSub">用了 0 步</div>
        <button class="mbtn primary" id="winNext">下一关</button>
        <button class="mbtn" id="winReplay">再玩一次</button>
      </div>
    </div>

    <div id="panelHost"></div>
    <div id="toast"></div>
  </div>

  <div id="splash">
    <img id="splashLogo" alt="倒水挑战">
    <img id="splashPig" alt="">
    <div id="splashBar"><div id="splashFill"></div></div>
    <button id="splashStart">开始游戏</button>
    <div id="splashFoot">倒水挑战 · 同人复刻演示 · 无限关卡</div>
  </div>
</div>
<script>
/* ===== src/logic.js ===== */
/* 倒水挑战 — 逻辑：RNG / 关卡规格 / 生成（必可解）/ 求解器 / 纯函数操作 */
window.WS = window.WS || {};
WS.LOGIC = (() => {
  const LS_ST = 'ws_state_v1';
  const LS_CFG = 'ws_cfg_v1';

  const DEFAULT_CFG = {
    capacity: 4,      // 每瓶容量 3|4|5
    empties: 2,       // 空瓶数 1|2
    maxColors: 10,    // 色数上限 4..10
    addBottle: 1,     // 每关可加空瓶次数 0..2
    animSpeed: 1,     // 动画速度倍率 0.5..2
    hintOn: true,     // 提示按钮
    room: 'warm',     // 房间色板 warm|mint|dusk
    liquidSet: 'classic', // 水色板 classic|candy|ocean
    bgmVol: 0.4,
    sfxVol: 0.9,
  };

  // ---------- RNG ----------
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const levelSeed = n => (Math.imul(n, 2654435761) ^ 0x9E3779B9) >>> 0;

  // ---------- 关卡规格 ----------
  // 颜色数：1,2关→3；3,4关→4；5,6关→5 …… 封顶 maxColors(≤10)；封顶后每第 7 关降 3 色作喘息关
  function specForLevel(n, cfg) {
    const cap = Math.max(3, Math.min(5, cfg.capacity || 4));
    let K = Math.min(3 + Math.floor((n - 1) / 2), Math.max(3, Math.min(10, cfg.maxColors || 10)));
    if (n > 20 && n % 7 === 0) K = Math.max(4, K - 3);
    const E = Math.max(1, Math.min(2, cfg.empties || 2));
    return { K, E, cap, bottles: K + E };
  }

  // ---------- 瓶操作（瓶 = 色id数组，底→顶） ----------
  function topRun(b) {
    if (!b.length) return null;
    const color = b[b.length - 1];
    let n = 0;
    for (let i = b.length - 1; i >= 0 && b[i] === color; i--) n++;
    return { color, n };
  }
  const isComplete = (b, cap) => b.length === cap && topRun(b).n === cap;
  function isWin(bottles, cap) {
    for (const b of bottles) if (b.length && !isComplete(b, cap)) return false;
    return true;
  }
  function completedColors(bottles, cap) {
    let k = 0;
    for (const b of bottles) if (isComplete(b, cap)) k++;
    return k;
  }
  // 可倒格数（0=不可）
  function canPour(src, dst, cap) {
    if (!src.length || isComplete(src, cap)) return 0;
    const r = topRun(src);
    if (!dst.length) return r.n === src.length ? 0 : Math.min(r.n, cap); // 纯色整瓶倒空瓶=无意义
    if (dst.length >= cap || dst[dst.length - 1] !== r.color) return 0;
    return Math.min(r.n, cap - dst.length);
  }
  // 纯函数：返回新瓶数组
  function applyPour(bottles, from, to, cap) {
    const nb = bottles.map(b => b.slice());
    const n = canPour(nb[from], nb[to], cap);
    if (!n) return null;
    const color = nb[from][nb[from].length - 1];
    for (let i = 0; i < n; i++) { nb[from].pop(); nb[to].push(color); }
    return { bottles: nb, n, color };
  }

  // ---------- 求解器：DFS + 访问集 + 剪枝 ----------
  // 返回步序 [{from,to,n}] 或 null（null=不可解/超节点上限）
  function solve(bottles, cap, maxNodes = 30000) {
    const seen = new Set();
    let nodes = 0;
    const path = [];
    const runCache = bottles.map(b => topRun(b));

    const key = bs => bs.map(b => b.join('.')).sort().join('|');

    function dfs(bs, runs) {
      if (isWin(bs, cap)) return true;
      if (++nodes > maxNodes) return false;
      const k = key(bs);
      if (seen.has(k)) return false;
      seen.add(k);
      // 候选走法按启发式排序：并满一瓶 > 并入同色 > 大段优先 > 腾空源瓶
      const cands = [];
      for (let i = 0; i < bs.length; i++) {
        const s = bs[i];
        if (!s.length || isComplete(s, cap)) continue;
        const r = runs[i];
        for (let j = 0; j < bs.length; j++) {
          if (i === j) continue;
          const d = bs[j];
          if (!d.length) {
            if (r.n === s.length) continue; // 纯色→空瓶无意义
          } else {
            if (d.length >= cap || d[d.length - 1] !== r.color) continue;
          }
          const n = Math.min(r.n, cap - d.length);
          let score = n * 2;
          if (d.length) score += 40;                                   // 并入同色瓶
          if (d.length + n === cap && d.length) score += 100;          // 并满一瓶
          if (n === s.length) score += 25;                             // 源瓶腾空
          cands.push({ i, j, n, score });
        }
      }
      cands.sort((a, b) => b.score - a.score);
      for (const c of cands) {
        const { i, j, n } = c;
        const s = bs[i], d = bs[j], r = runs[i];
        for (let t = 0; t < n; t++) { s.pop(); d.push(r.color); }
        runs[i] = topRun(s); runs[j] = topRun(d);
        path.push({ from: i, to: j, n });
        if (dfs(bs, runs)) return true;
        path.pop();
        for (let t = 0; t < n; t++) { d.pop(); s.push(r.color); }
        runs[i] = r; runs[j] = topRun(d);
      }
      return false;
    }
    const bs = bottles.map(b => b.slice());
    const runs = bs.map(b => topRun(b));
    return dfs(bs, runs) ? path.slice() : null;
  }
  // 提示：当前局面最优下一手（不可解返回 null）
  const hintMove = (bottles, cap) => {
    const sol = solve(bottles, cap);
    return sol && sol.length ? sol[0] : null;
  };

  // ---------- 关卡生成（必可解 + 开局无现成纯色瓶） ----------
  function genLevel(n, cfg) {
    const { K, E, cap } = specForLevel(n, cfg);
    const base = levelSeed(n);
    const total = K * cap;
    for (let attempt = 0; attempt < 60; attempt++) {
      const seed = (base + attempt * 7919) >>> 0;
      const rng = mulberry32(seed);
      const units = [];
      for (let c = 0; c < K; c++) for (let i = 0; i < cap; i++) units.push(c);
      for (let i = total - 1; i > 0; i--) {
        const j = (rng() * (i + 1)) | 0;
        const t = units[i]; units[i] = units[j]; units[j] = t;
      }
      let ok = true;
      const bottles = [];
      for (let c = 0; c < K; c++) {
        const b = units.slice(c * cap, (c + 1) * cap);
        if (isComplete(b, cap)) { ok = false; break; }
        bottles.push(b);
      }
      if (!ok) continue;
      for (let e = 0; e < E; e++) bottles.push([]);
      if (solve(bottles, cap)) return { bottles, K, E, cap, seed };
    }
    // 兜底（几乎不可能走到）：从已解状态反向随机倒推构造，天然可解
    const rng = mulberry32(base ^ 0xBEEF);
    const bottles = [];
    for (let c = 0; c < K; c++) bottles.push(Array(cap).fill(c));
    for (let e = 0; e < E; e++) bottles.push([]);
    for (let m = 0; m < K * 3; m++) {
      const froms = [];
      for (let i = 0; i < bottles.length; i++) if (bottles[i].length) froms.push(i);
      if (!froms.length) break;
      const from = froms[(rng() * froms.length) | 0];
      const empt = [];
      for (let j = 0; j < bottles.length; j++) if (j !== from && bottles[j].length < cap) empt.push(j);
      if (!empt.length) break;
      const to = empt[(rng() * empt.length) | 0];
      const n1 = canPour(bottles[from], bottles[to], cap);
      if (n1) { const r = applyPour(bottles, from, to, cap); if (r) { bottles[from] = r.bottles[from]; bottles[to] = r.bottles[to]; } }
    }
    return { bottles, K, E, cap, seed: base ^ 0xBEEF };
  }

  return {
    LS_ST, LS_CFG, DEFAULT_CFG,
    mulberry32, levelSeed, specForLevel,
    topRun, isComplete, isWin, completedColors, canPour, applyPour,
    solve, hintMove, genLevel,
  };
})();

</script>
<script>
/* ===== src/art.js ===== */
window.WS=window.WS||{};WS.ART=(()=>{
'use strict';
// ---------------- 基础 ----------------
const uri=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const svg=(w,h,b)=>'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'">'+b+'</svg>';
const cache={};
function memo(k,make){if(!(k in cache))cache[k]=make();return cache[k]}
const imgs=[];
function warm(src){const im=new Image();im.src=src;imgs.push(im);return src}

// ---------------- 房间色板 ----------------

/* ---------- 图构建（unlock 时一次） ---------- */
function buildGraph(){
  master=ctx.createGain(); master.gain.value=masterVol; master.connect(ctx.destination);
  bgmDuck=ctx.createGain(); bgmDuck.gain.value=1; bgmDuck.connect(master);
  bgmBus=ctx.createGain(); bgmBus.gain.value=bgmVol; bgmBus.connect(bgmDuck);
  sfxBus=ctx.createGain(); sfxBus.gain.value=sfxVol; sfxBus.connect(master);
  const len=Math.floor(ctx.sampleRate*1.2);
  noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
}

/* ---------- 合成小工具 ---------- */
function noiseSrc(t,dur){
  const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  s.start(t); s.stop(t+dur+0.06); return s;
}
function envG(t,a,peak,hold,rel){
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+a);
  if(hold>0) g.gain.setValueAtTime(peak,t+a+hold);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+rel);
  return g;
}
function tone(t,type,f0,f1,dur,peak,dest){
  const o=ctx.createOscillator(); o.type=type;
  o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  const g=envG(t,0.004,peak,0,dur);
  o.connect(g); g.connect(dest||sfxBus);
  o.start(t); o.stop(t+dur+0.1);
  return o;
}
function clickNoise(t,hpF,peak,rel){
  const n=noiseSrc(t,rel+0.01);
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=hpF;
  const g=envG(t,0.001,peak,0,rel);
  n.connect(hp); hp.connect(g); g.connect(sfxBus);
}
/* 铃/八音盒双分音：基音 + 2.01 倍微失谐泛音，清脆 */
function bell(t,f,vel,dur){
  const g=envG(t,0.003,vel,0,dur);
  const o1=ctx.createOscillator(); o1.type='sine'; o1.frequency.value=f;
  const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=f*2.01;
  const g2=ctx.createGain(); g2.gain.value=0.3;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(sfxBus);
  o1.start(t); o1.stop(t+dur+0.15);
  o2.start(t); o2.stop(t+dur*0.5);
}
/* 猪哼：锯齿滑音过窄带通 = 鼻音闷哼 */
function oink(t,f0,f1,dur,bpF,vel){
  const o=ctx.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=bpF; bp.Q.value=2.2;
  const g=envG(t,0.01,vel,0.02,dur*0.8);
  o.connect(bp); bp.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t+dur+0.12);
}

/* ---------- cue 合成器 ---------- */
const SYNTH={
  /* pick 拿起瓶子 ~80ms：木质/玻璃轻 pop（上扬 chirp + 高频轻嗒） */
  pick(t,v){
    tone(t,'sine',380,860,0.06,0.42*v);
    clickNoise(t,3200,0.12*v,0.016);
  },
  /* pour 倒水咕嘟 ~700ms：窄带噪声咕噜(LFO 摆频) + 一串气泡上滑音 + 低频水身，一次性 */
  pour(t,v){
    const n=noiseSrc(t,0.72);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=4.5;
    bp.frequency.setValueAtTime(680,t);
    const lfo=ctx.createOscillator(); lfo.frequency.value=4.2;
    const lg=ctx.createGain(); lg.gain.value=160;
    lfo.connect(lg); lg.connect(bp.frequency);
    const ng=envG(t,0.05,0.17*v,0.42,0.22);
    n.connect(bp); bp.connect(ng); ng.connect(sfxBus);
    lfo.start(t); lfo.stop(t+0.78);
    tone(t,'sine',150,95,0.6,0.1*v);
    const B=[[0.02,300],[0.10,390],[0.175,330],[0.26,470],[0.345,410],
             [0.43,560],[0.51,480],[0.59,640],[0.665,560]];
    for(let i=0;i<B.length;i++){
      const dt=B[i][0], f=B[i][1], vel=(i%2?0.13:0.16)*v;
      const o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(f,t+dt);
      o.frequency.exponentialRampToValueAtTime(f*1.9,t+dt+0.07);
      const g=envG(t+dt,0.006,vel,0,0.06);
      o.connect(g); g.connect(sfxBus);
      o.start(t+dt); o.stop(t+dt+0.1);
    }
  },
  /* deny 不允许 ~120ms：闷嗒（方波下滑过低通 + 软嗒） */
  deny(t,v){
    const o=ctx.createOscillator(); o.type='square';
    o.frequency.setValueAtTime(210,t);
    o.frequency.exponentialRampToValueAtTime(135,t+0.1);
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=460;
    const g=envG(t,0.006,0.34*v,0.02,0.09);
    o.connect(lp); lp.connect(g); g.connect(sfxBus);
    o.start(t); o.stop(t+0.16);
    clickNoise(t,1200,0.08*v,0.018);
  },
  /* drop 一格液体落定 ~60ms：短促哒（下滑 blip + 低频垫 + 微嗒） */
  drop(t,v){
    tone(t,'sine',640,260,0.042,0.36*v);
    tone(t+0.008,'sine',210,150,0.05,0.16*v);
    clickNoise(t,2800,0.07*v,0.012);
  },
  /* colorDone 一色完成 ~500ms：上行小滑音 + 清脆叮 */
  colorDone(t,v){
    tone(t,'sine',784,1245,0.14,0.15*v);
    bell(t+0.1,1318.5,0.24*v,0.4);
  },
  /* pig 小猪哼欢 ~250ms：滑音双音（两声欢快鼻音哼） */
  pig(t,v){
    oink(t,210,360,0.085,620,0.3*v);
    oink(t+0.125,440,290,0.105,820,0.26*v);
  },
  /* win 过关 ~1.1s：上行四音 fanfare（C5-E5-G5-C6，三角波柔和 + 尾音亮点） */
  win(t,v){
    const seq=[[0,523.25,0.2],[0.15,659.25,0.2],[0.3,783.99,0.2],[0.46,1046.5,0.55]];
    for(let i=0;i<seq.length;i++){
      const dt=seq[i][0], f=seq[i][1], d=seq[i][2];
      const o1=ctx.createOscillator(); o1.type='triangle'; o1.frequency.value=f;
      const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=f*2;
      const g2=ctx.createGain(); g2.gain.value=0.1;
      const g=envG(t+dt,0.01,0.2*v,0.1,d);
      o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(sfxBus);
      o1.start(t+dt); o1.stop(t+dt+d+0.3);
      o2.start(t+dt); o2.stop(t+dt+d+0.3);
    }
    bell(t+0.46,1567.98,0.07*v,0.5);
  },
  /* click UI 轻嗒 ~40ms */
  click(t,v){
    tone(t,'sine',1180,820,0.026,0.2*v);
    clickNoise(t,4200,0.05*v,0.01);
  },
  /* start 开始 ~300ms：whoosh（带通噪声上扫）+ 叮 */
  start(t,v){
    const n=noiseSrc(t,0.22);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.1;
    bp.frequency.setValueAtTime(450,t);
    bp.frequency.exponentialRampToValueAtTime(2800,t+0.2);
    const g=envG(t,0.03,0.2*v,0.06,0.14);
    n.connect(bp); bp.connect(g); g.connect(sfxBus);
    bell(t+0.16,1046.5,0.26*v,0.24);
  }
  /* bgm 仅作循环（startLoop('bgm')），无单发形态 */
};

/* ---------- BGM：100bpm C 大调五声音阶 八音盒（轻盈、音量天然压低） ---------- */
const BPM=100, STEP=60/BPM/2;                       // 八分音符步长 0.3s
const P={G2:98.00,A2:110.00,C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,
         C4:261.63,G4:392.00,A4:440.00,
         C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880.00,C6:1046.50,D6:1174.66};
const MEL=[                                         // 4 乐句 ×16 步，null=休止
  ['C5',null,'E5',null,'G5',null,'A5','G5','E5',null,'D5',null,'C5',null,null,null],
  ['E5',null,'G5',null,'C6',null,'D6',null,'C6','A5',null,'G5','E5',null,'G5',null],
  ['A4',null,'C5',null,'E5',null,'G5','A5','C6',null,'A5',null,'G5',null,'E5','D5'],
  ['C5',null,'E5',null,'D5',null,'C5',null,'A4',null,'C5',null,'D5',null,'C5',null]
];
const BASS=['C3','G2','A2','F3','C3','G2','F3','G3']; // 每小节根音（8 小节循环）
const FIFTH={C3:'G3',G2:'D3',A2:'E3',F3:'C4',G3:'D4'};

function box(t,f,vel){                              // 八音盒音色：正弦 + 快衰 4 倍泛音
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600;
  const g=envG(t,0.003,vel,0,0.4);
  const o1=ctx.createOscillator(); o1.type='sine'; o1.frequency.value=f;
  const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=f*3.98;
  const g2=ctx.createGain();
  g2.gain.setValueAtTime(vel*0.3,t);
  g2.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(bgmBus);
  o1.start(t); o1.stop(t+0.5);
  o2.start(t); o2.stop(t+0.12);
}
function hat(t,vel){
  const n=noiseSrc(t,0.04);
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7500;
  const g=envG(t,0.001,vel,0,0.03);
  n.connect(hp); hp.connect(g); g.connect(bgmBus);
}
function schedStep(step,t){
  const ph=Math.floor(step/16)%4, pos=step%16;
  const bar=Math.floor(step/8)%8, bp=step%8;
  const m=MEL[ph][pos];
  if(m) box(t,P[m],(pos%8===0)?0.15:0.11);
  if(bp===0) box(t,P[BASS[bar]],0.15);
  if(bp===4) box(t,P[FIFTH[BASS[bar]]],0.06);
  if(bp===2||bp===6) hat(t,0.026);
}
function bgmPump(){                                 // 前瞻调度器
  const horizon=now()+0.22;
  let guard=0;
  while(loops.bgm.nextT<horizon&&guard++<128){
    schedStep(loops.bgm.step,loops.bgm.nextT);
    loops.bgm.nextT+=STEP;
    loops.bgm.step=(loops.bgm.step+1)%64;
  }
}
function startBgmSched(){
  loops.bgm.step=0; loops.bgm.nextT=now()+0.08;
  bgmPump();
  loops.bgm.timer=setInterval(bgmPump,60);
}

/* ---------- 自定义音效 dataURL 解码（失败回落合成） ---------- */
function decodeRaw(k){
  try{
    const raw=ov.raw[k];
    if(!raw||!ctx||typeof atob!=='function') return;
    const b64=String(raw).split(',').pop()||'';
    const bin=atob(b64);
    const u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const done=(buf)=>{ try{ if(buf&&buf.duration>0) ov.buf[k]=buf; else fail(); }catch(e){} };
    const fail=()=>{ try{ delete ov.raw[k]; }catch(e){} };
    const p=ctx.decodeAudioData(u8.buffer,done,fail);
    if(p&&p.then) p.then(done,fail);
  }catch(e){ try{ delete ov.raw[k]; }catch(e2){} }
}

/* ============================================================
   对外 API
   ============================================================ */
function unlock(){
  try{
    if(!AC) return false;
    if(!ctx){ ctx=new AC(); buildGraph(); }
    if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    for(const k in ov.raw) decodeRaw(k);
    for(const k in loops){ if(loops[k].wanted&&!loops[k].on) startLoop(k); }
  }catch(e){}
  return !!ctx;
}

function play(name,opts){
  try{
    if(NAMES.indexOf(name)<0||name==='bgm') return;
    if(!ctx) return;
    if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    opts=opts||{};
    const v=(opts.vol==null?1:Math.max(0,Math.min(2,+opts.vol||0)));
    const t=now()+0.02;
    if(ov.buf[name]){                               // 自定义音效优先（走 sfxBus 受 SFX 音量控）
      const s=ctx.createBufferSource(); s.buffer=ov.buf[name];
      s.playbackRate.value=(opts.rate>0?opts.rate:1);
      s.connect(sfxBus); s.start(t);
      return;
    }
    const f=SYNTH[name];
    if(f) f(t,v);                                   // 合成回落
  }catch(e){}
}

function startLoop(name){
  try{
    if(name!=='bgm') return;
    const L=loops[name];
    if(L.on) return;                                // 重复 start 幂等
    if(!ctx){ L.wanted=true; return; }              // 未解锁：记意图，unlock 后补启
    if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    L.on=true;
    if(ov.buf[name]){                               // 自定义循环音频（走 bgmBus 受 BGM 音量控）
      const s=ctx.createBufferSource(); s.buffer=ov.buf[name]; s.loop=true;
      const t=now();
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(1,t+0.15);
      s.connect(g); g.connect(bgmBus);
      s.start(t);
      L.nodes={src:[s],gains:[g]};
    }else{
      startBgmSched();
    }
  }catch(e){}
}

function stopLoop(name){
  try{
    const L=loops[name];
    if(!L) return;
    L.wanted=false;
    if(!L.on) return;                               // 重复 stop 幂等
    L.on=false;
    if(L.timer){ clearInterval(L.timer); L.timer=0; }
    const N=L.nodes; L.nodes=null;
    if(N){
      const t=now();
      (N.gains||[]).forEach((g)=>{ try{
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(g.gain.value,t);
        g.gain.linearRampToValueAtTime(0.0001,t+0.12);
      }catch(e){} });
      (N.src||[]).forEach((s)=>{ try{ s.stop(t+0.16); }catch(e){} });
    }
  }catch(e){}
}

function duck(ms){
  try{
    if(!ctx||!bgmDuck) return;
    const d=Math.max(80,Number(ms)||600);
    if(duckTimer){ clearTimeout(duckTimer); duckTimer=0; }
    const t=now();
    bgmDuck.gain.cancelScheduledValues(t);
    bgmDuck.gain.setTargetAtTime(DUCK_LVL,t,0.05);
    duckTimer=setTimeout(()=>{
      duckTimer=0;
      try{
        if(ctx&&bgmDuck){
          const t2=now();
          bgmDuck.gain.cancelScheduledValues(t2);
          bgmDuck.gain.setTargetAtTime(1,t2,0.15);
        }
      }catch(e){}
    },d);
  }catch(e){}
}

function setMasterVolume(v){
  masterVol=clamp01(v);
  try{ if(master){ const t=now(); master.gain.cancelScheduledValues(t); master.gain.setTargetAtTime(masterVol,t,0.03); } }catch(e){}
}
function setSFXVolume(v){
  sfxVol=clamp01(v);
  try{ if(sfxBus){ const t=now(); sfxBus.gain.cancelScheduledValues(t); sfxBus.gain.setTargetAtTime(sfxVol,t,0.03); } }catch(e){}
}
function setBGMVolume(v){
  bgmVol=clamp01(v);
  try{ if(bgmBus){ const t=now(); bgmBus.gain.cancelScheduledValues(t); bgmBus.gain.setTargetAtTime(bgmVol,t,0.03); } }catch(e){}
}

function applyOverrides(map){
  try{
    ov.raw={}; ov.buf={};                           // 整表替换语义
    if(!map) return;
    for(const k in map){
      if(NAMES.indexOf(k)<0) continue;
      const v=map[k];
      if(!v||typeof v!=='string') continue;
      ov.raw[k]=v;
      if(ctx) decodeRaw(k);
    }
  }catch(e){}
}

/* ---------- 页面隐藏时停 BGM，回前台恢复 ---------- */
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('visibilitychange',()=>{
    try{
      if(document.hidden){
        if(loops.bgm.on){ bgmAutoPaused=true; stopLoop('bgm'); }
      }else{
        if(bgmAutoPaused){ bgmAutoPaused=false; startLoop('bgm'); }
        if(ctx&&ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
      }
    }catch(e){}
  });
}

return {
  unlock, play, startLoop, stopLoop, duck,
  setBGMVolume, setSFXVolume, setMasterVolume,
  applyOverrides,
  names: NAMES.slice()
};

})();

</script>
<script>
/* ===== src/fx.js ===== */
window.WS=window.WS||{};
WS.FX=(()=>{
'use strict';
// 倒水挑战 · canvas 粒子特效层
// droplets 倒水落点液滴（重力弧线回落）｜sparkle 一色完成瓶口星火小爆｜confetti 过关全屏彩带雨 2.2s
// 红线：禁 shadowBlur——发光一律预渲染径向渐变贴图 + globalCompositeOperation='lighter'
var LIQ=['#F5C542','#E2483D','#3FA0D8','#59B35B','#F08A3C','#EF7FA4','#8E6FC8','#4EC8C0'];
var WHITE='#FFFFFF';
var MAXP=288;                    // 池总容：彩带≤160 + 单次液滴≤64 + 星火/环余量
var CONF_MAX=160, DROP_MAX=64;   // 单次调用粒子数上限

var pool=[], cur=0, live=0, i;
for(i=0;i<MAXP;i++)pool.push({on:false,kind:'',x:0,y:0,bx:0,vx:0,vy:0,g:0,t:0,life:1,
  size:2,size2:0,color:WHITE,rgb:'',a:1,rot:0,vr:0,sway:0,ph:0,fr:0});

var cv=null, ctx=null, W=0, H=0, dpr=1;
var running=false, rafId=0, lastT=0, errRun=0;
var glowCache={}, rgbCache={};

function rnd(a,b){return a+Math.random()*(b-a);}
function acquire(){                        // 池满则丢弃新粒子，绝不超上限
  for(var n=0;n<MAXP;n++){cur=(cur+1)%MAXP;var p=pool[cur];if(!p.on)return p;}
  return null;
}
function kill(p){if(p.on){p.on=false;live--;}}
function hex2rgb(hex){                     // '#RRGGBB' -> 'r,g,b'
  var s=rgbCache[hex]; if(s)return s;
  var v=0;
  try{v=parseInt(String(hex).replace('#',''),16)||0;}catch(e){v=0;}
  s=((v>>16)&255)+','+((v>>8)&255)+','+(v&255);
  rgbCache[hex]=s; return s;
}
// 预渲染径向渐变光斑贴图（代替 shadowBlur），绘制时配 lighter 叠色
function glow(rgb){
  var s=glowCache[rgb]; if(s)return s;
  s=document.createElement('canvas'); s.width=s.height=64;
  var g=s.getContext('2d');
  var gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba('+rgb+',0.9)');
  gr.addColorStop(0.35,'rgba('+rgb+',0.35)');
  gr.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  glowCache[rgb]=s; return s;
}

// ---- rAF 自驱：有粒子才跑，帧空自动停表不空转 ----
function ensure(){
  if(!ctx)return false;
  if(running)return true;
  running=true; errRun=0; lastT=0;
  rafId=requestAnimationFrame(loop);
  return true;
}
function halt(){
  running=false;
  if(rafId){cancelAnimationFrame(rafId);rafId=0;}
}
function loop(ts){
  rafId=0;
  if(!running)return;
  try{ step(ts); errRun=0; }
  catch(e){ if(++errRun>90){halt();return;} }      // 单帧异常不终止循环
  if(running&&!rafId)rafId=requestAnimationFrame(loop);
}

function step(ts){
  if(!lastT)lastT=ts;
  var dt=(ts-lastT)/1000; lastT=ts;
  if(!(dt>0))dt=0.016; else if(dt>0.1)dt=0.1;      // 防节流恢复大跳帧
  var BH=H||1200, BW=W||800;
  for(var idx=0;idx<MAXP;idx++){
    var p=pool[idx]; if(!p.on)continue;
    p.t+=dt;
    if(p.t>=p.life){kill(p);continue;}
    var k=p.kind;
    if(k==='drop'){                                // 液滴：重力抛物线
      p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.y>BH+30||p.x<-30||p.x>BW+30){kill(p);continue;}
    }else if(k==='ember'){                         // 星火光斑：放射+阻尼
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      p.vx-=p.vx*2.6*dt; p.vy-=p.vy*2.6*dt; p.vy+=90*dt;
    }else if(k==='flake'||k==='bit'){              // 彩带/屑：缓降+正弦横摆+翻面
      p.y+=p.vy*dt; p.ph+=p.fr*dt;
      p.x=p.bx+Math.sin(p.ph)*p.sway; p.rot+=p.vr*dt;
      if(p.y>BH+14){kill(p);continue;}
    }else if(k==='ring'){                          // 冲击环：扩张
      p.size+=p.vr*dt;
    }
  }
  draw();
  if(live===0){                                    // 无粒子自动停表省电
    if(W&&H)ctx.clearRect(0,0,W,H);
    halt();
  }
}

function draw(){
  if(W&&H)ctx.clearRect(0,0,W,H);
  for(var idx=0;idx<MAXP;idx++){
    var p=pool[idx]; if(!p.on)continue;
    var k=p.t/p.life;
    var al=p.a*(k>0.7?1-(k-0.7)/0.3:1);
    if(p.kind==='drop'){
      ctx.globalAlpha=al; ctx.fillStyle=p.color;
      var sp=p.vx<0?-p.vx:p.vx, sv=p.vy<0?-p.vy:p.vy;
      sp=sp+sv;
      var st=sp>230?((sp-230)/520):0; if(st>0.85)st=0.85;   // 高速拉成短流线
      if(st>0.06){
        ctx.save(); ctx.translate(p.x,p.y);
        ctx.rotate(Math.atan2(p.vy,p.vx));
        ctx.scale(1+st,1);
        ctx.beginPath(); ctx.arc(0,0,p.size,0,6.2832); ctx.fill();
        ctx.restore();
      }else{
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.2832); ctx.fill();
      }
      if(p.size>2.6){                              // 大珠点白高光（扁平克制）
        ctx.globalAlpha=al*0.8; ctx.fillStyle='rgba(255,255,255,0.85)';
        ctx.beginPath(); ctx.arc(p.x-p.size*0.32,p.y-p.size*0.32,p.size*0.3,0,6.2832); ctx.fill();
      }
    }else if(p.kind==='ember'){
      var r=p.size*(1+k*1.5);
      ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=al;
      ctx.drawImage(glow(p.rgb),p.x-r,p.y-r,r*2,r*2);
      ctx.globalCompositeOperation='source-over';
    }else if(p.kind==='ring'){
      ctx.globalAlpha=al;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.2832);
      ctx.lineWidth=2.5*(1-k)+0.6; ctx.strokeStyle=p.color; ctx.stroke();
    }else if(p.kind==='flake'){
      ctx.globalAlpha=al;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.scale(1,0.3+0.7*Math.abs(Math.sin(p.ph)));   // 翻面飘动
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.size/2,-p.size2/2,p.size,p.size2);
      ctx.restore();
    }else if(p.kind==='bit'){
      ctx.globalAlpha=al; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

// ---- 粒子工厂 ----
// 倒水落点：小液滴上扇喷溅→重力回落，色随倒入的液体
function droplets(x,y,color,n){
  if(!ctx)return;
  n=(n==null)?8:(n|0);
  if(n<1)n=1; else if(n>DROP_MAX)n=DROP_MAX;
  ensure();
  var col=color||LIQ[0], rgb=hex2rgb(col), p, ang, sp;
  for(var j=0;j<n;j++){
    p=acquire(); if(!p)break;
    ang=-1.5708+rnd(-1.3,1.3);                     // 上半扇形
    sp=rnd(110,330);
    p.on=true; live++;
    p.kind='drop'; p.t=0; p.life=rnd(0.45,0.9); p.a=1;
    p.x=x+rnd(-5,5); p.y=y+rnd(-3,3);
    p.vx=Math.cos(ang)*sp; p.vy=Math.sin(ang)*sp-rnd(20,90);
    p.g=rnd(1350,1750);
    p.color=(Math.random()<0.86)?col:WHITE;
    p.size=rnd(1.8,3.8); p.rgb='';
  }
  p=acquire();                                     // 落点柔光一闪
  if(p){
    p.on=true; live++;
    p.kind='ember'; p.t=0; p.life=0.28; p.a=0.8;
    p.x=x; p.y=y; p.vx=0; p.vy=0; p.size=rnd(7,11); p.rgb=rgb;
  }
}
// 一色完成：瓶口星火小爆——放射光斑+重力小珠+闪光+扩散环
function sparkle(x,y,color){
  if(!ctx)return;
  ensure();
  var col=color||LIQ[0], rgb=hex2rgb(col), p, ang, s2;
  for(var j=0;j<10;j++){                           // 放射光斑
    p=acquire(); if(!p)break;
    ang=(j/10)*6.2832+rnd(-0.25,0.25);
    s2=rnd(60,190);
    p.on=true; live++;
    p.kind='ember'; p.t=0; p.life=rnd(0.35,0.6); p.a=1;
    p.x=x; p.y=y;
    p.vx=Math.cos(ang)*s2; p.vy=Math.sin(ang)*s2-rnd(0,40);
    p.size=rnd(3,6); p.rgb=(j%3===0)?'255,255,255':rgb;
  }
  for(j=0;j<7;j++){                                // 实色小珠带重力
    p=acquire(); if(!p)break;
    ang=-1.5708+rnd(-1.5,1.5); s2=rnd(70,230);
    p.on=true; live++;
    p.kind='drop'; p.t=0; p.life=rnd(0.4,0.75); p.a=1;
    p.x=x; p.y=y;
    p.vx=Math.cos(ang)*s2; p.vy=Math.sin(ang)*s2;
    p.g=rnd(900,1300);
    p.color=(j%3===0)?WHITE:col; p.size=rnd(1.4,2.6); p.rgb='';
  }
  p=acquire();                                     // 中心白闪
  if(p){
    p.on=true; live++;
    p.kind='ember'; p.t=0; p.life=0.22; p.a=1;
    p.x=x; p.y=y; p.vx=0; p.vy=0; p.size=13; p.rgb='255,255,255';
  }
  p=acquire();                                     // 扩散环
  if(p){
    p.on=true; live++;
    p.kind='ring'; p.t=0; p.life=0.38; p.a=0.9;
    p.x=x; p.y=y; p.size=6; p.vr=120; p.color='rgba(255,255,255,0.9)';
  }
}
// 过关：全屏彩带纸屑矩形旋转飘落，整体约 2.2s
function confetti(w,h){
  if(!ctx)return;
  ensure();
  var cw=Math.max(1,w||W), ch=Math.max(1,h||H);
  if(!W)W=cw; if(!H)H=ch;                          // 未 resize 兜底
  var p;
  for(var j=0;j<CONF_MAX;j++){
    p=acquire(); if(!p)break;
    p.on=true; live++;
    p.kind=(j%6===0)?'bit':'flake'; p.t=0; p.life=rnd(1.9,2.35); p.a=1;
    p.bx=rnd(4,cw-4);
    p.y=(j<CONF_MAX*0.55)?-rnd(8,ch*0.55):rnd(-30,ch*0.12);  // 错峰入场成雨
    p.x=p.bx;
    p.vy=rnd(240,430)*((j%6===0)?1.15:1);
    p.sway=rnd(10,34); p.ph=rnd(0,6.2832); p.fr=rnd(1.6,3.4);
    p.rot=rnd(0,6.2832); p.vr=rnd(-7,7);
    p.color=(Math.random()<0.12)?WHITE:LIQ[(Math.random()*LIQ.length)|0];
    if(j%6===0){p.size=rnd(1.6,3); p.size2=0;}
    else{p.size=rnd(6,11); p.size2=rnd(3.5,6);}
  }
}

function stop(){                                   // 停表清屏，粒子保留待续
  halt();
  if(ctx&&W&&H)ctx.clearRect(0,0,W,H);
}
function clear(){                                  // 全清：粒子+画布
  for(var idx=0;idx<MAXP;idx++)pool[idx].on=false;
  live=0;
  if(ctx&&W&&H)ctx.clearRect(0,0,W,H);
}

return {
  init:function(canvas){
    cv=canvas||null;
    ctx=cv?cv.getContext('2d'):null;
    if(ctx&&!W&&cv.width)W=cv.width;
    if(ctx&&!H&&cv.height)H=cv.height;
    if(ctx)ctx.setTransform(dpr,0,0,dpr,0,0);
    return !!ctx;
  },
  resize:function(w,h,d){
    W=Math.max(1,Math.round(w)); H=Math.max(1,Math.round(h));
    dpr=Math.max(1,Math.min(2,d||1));              // dpr≤2
    if(!cv||!ctx)return;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
  },
  droplets:droplets,
  sparkle:sparkle,
  confetti:confetti,
  stop:stop,
  clear:clear
};
})();

</script>
