    '.wscp-statcell + .wscp-statcell{border-left:2px solid #EFD9B8;}',
    '.wscp-statnum{font:italic 900 24px/1.2 system-ui;color:#7A4A1E;}',
    '.wscp-statkey{font-size:11px;color:#A5794A;letter-spacing:2px;margin-top:3px;}',
    '.wscp-btnrow{display:flex;gap:8px;margin:10px 0 2px;}',
    '.wscp-btnrow .wscp-btn{flex:1;min-width:0;padding:0 6px;}',
    '.wscp-btn-block{display:block;width:100%;}',
    '.wscp-foot{flex:0 0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:2px solid #EFD9B8;}',
    '.wscp-done{width:100%;height:44px;font-size:15px;letter-spacing:8px;text-indent:8px;}',
    '.wscp-toast{position:absolute;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);',
      'z-index:6;max-width:86%;background:#5B3A1E;color:#FFF3DC;font-size:13px;line-height:1.4;padding:8px 14px;',
      'border-radius:999px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}',
    '.wscp-toast[hidden]{display:none!important;}',
    '.wscp-file{display:none!important;}',
    '.wscp-hide{display:none!important;}',
    '@media (min-width:700px){.wscp-drawer{left:auto;top:0;width:400px;max-height:none;height:100%;',
      'border-bottom:2px solid #E0C194;border-radius:18px 0 0 18px;transform:translateX(105%);}',
      '.wscp-root.wscp-open .wscp-drawer{transform:translateX(0);}}'
  ].join('\n');

  function ensureStyle() {
    if (document.getElementById('wscp-style')) return;
    var st = document.createElement('style');
    st.id = 'wscp-style';
    st.textContent = CSS;
    (document.head || document.documentElement).appendChild(st);
  }

  /* ---------------- HTML ---------------- */
  function segHTML(key) {
    var s = SEGS[key];
    var btns = s.vals.map(function (v) {
      return '<button type="button" data-seg="' + key + '" data-val="' + v + '">' + v + '</button>';
    }).join('');
    return '<div class="wscp-row"><span class="wscp-lab">' + s.label
      + '<span class="wscp-sub">' + s.sub + '</span></span>'
      + '<span class="wscp-seg" data-seggroup="' + key + '">' + btns + '</span></div>';
  }
  function volRowHTML(k, label) {
    return '<div class="wscp-vol"><div class="wscp-volhead"><span class="wscp-lab">' + label + '</span>'
      + '<span class="wscp-volval" data-volval="' + k + '">0%</span></div>'
      + '<input type="range" class="wscp-range" data-vol="' + k + '" min="0" max="1" step="0.05" aria-label="' + label + '"></div>';
  }
  function cueRowHTML(cue, label) {
    return '<div class="wscp-cue" data-cue="' + cue + '">'
      + '<span class="wscp-cuename">' + label + '<span class="wscp-chip wscp-hide">已自定义</span></span>'
      + '<button type="button" class="wscp-btn wscp-hide" data-sact="play">试听</button>'
      + '<button type="button" class="wscp-btn" data-sact="up">换音</button>'
      + '<button type="button" class="wscp-btn wscp-hide" data-sact="reset">恢复</button>'
      + '</div>';
  }
  function palCardHTML(list, role, swatches, names) {
    return list.map(function (p, i) {
      var sw = swatches(p[0], i).map(function (c) { return '<i style="background:' + c + '"></i>'; }).join('');
      return '<button type="button" class="wscp-pal" data-' + role + '="' + p[0] + '">'
        + '<span class="wscp-palsw">' + sw + '</span>'
        + '<span class="wscp-palname">' + (names ? names[i] : p[1]) + '</span></button>';
    }).join('');
  }
  function liquidSwatches(key) {
    try {
      var L = window.WS && window.WS.ART && window.WS.ART.liquids;
      if (L && L[key]) return L[key].slice(0, 6);
    } catch (e) {}
    var fb = { classic: ['#F5C542', '#E2483D', '#3FA0D8', '#59B35B', '#F08A3C', '#EF7FA4'],
               candy: ['#FF8FB2', '#FFD166', '#7FD8BE', '#9B8CFF', '#FF9F68', '#6FC7E1'],
               ocean: ['#2E86AB', '#7ADCC7', '#F6C445', '#E4717A', '#9BDE7E', '#5E60CE'] };
    return fb[key] || fb.classic;
  }

  function buildDOM() {
    root = document.createElement('div');
    root.className = 'wscp-root';
    root.setAttribute('aria-hidden', 'true');
    root.innerHTML = ''
      + '<div class="wscp-mask"></div>'
      + '<section class="wscp-drawer" role="dialog" aria-modal="true" aria-label="设置">'
      +   '<header class="wscp-head"><div class="wscp-title">设 置</div>'
      +     '<button type="button" class="wscp-close" aria-label="关闭设置">✕</button></header>'
      +   '<nav class="wscp-tabs">' + TABS.map(function (t) {
            return '<button type="button" class="wscp-tab" data-tab="' + t[0] + '">' + t[1] + '</button>';
          }).join('') + '</nav>'
      +   '<div class="wscp-body">'
      +     '<div class="wscp-panel" data-panel="play">'
      +       '<p class="wscp-note">难度参数在「下一关」生效；外观与音量即时生效。</p>'
      +       segHTML('capacity') + segHTML('empties')
      +       '<div class="wscp-row"><span class="wscp-lab">色数上限<span class="wscp-sub">关卡颜色数的成长天花板（下一关生效）</span></span>'
      +         '<span class="wscp-volval" data-volval="maxColors">10</span></div>'
      +       '<input type="range" class="wscp-range" data-vol="maxColors" min="4" max="10" step="1" aria-label="色数上限">'
      +       segHTML('addBottle')
      +       '<div class="wscp-row"><span class="wscp-lab">动画速度<span class="wscp-sub">倒水演出快慢</span></span>'
      +         '<span class="wscp-volval" data-volval="animSpeed">1×</span></div>'
      +       '<input type="range" class="wscp-range" data-vol="animSpeed" min="0.5" max="2" step="0.25" aria-label="动画速度">'
      +       '<div class="wscp-row"><span class="wscp-lab">提示按钮<span class="wscp-sub">关闭后隐藏底部「提示」</span></span>'
      +         '<label class="wscp-sw"><input type="checkbox" data-role="hint" aria-label="提示按钮">'
      +         '<span class="wscp-track"></span><span class="wscp-knob"></span></label></div>'
      +     '</div>'
      +     '<div class="wscp-panel" data-panel="audio" hidden>'
      +       '<div class="wscp-sec">房间</div>'
      +       '<div class="wscp-pals" data-role="rooms">' + palCardHTML(ROOMS, 'room', function (k) {
                var r = null; ROOMS.forEach(function (x) { if (x[0] === k) r = x[2]; }); return r || ['#ccc'];
              }) + '</div>'
      +       '<div class="wscp-sec">水色</div>'
      +       '<div class="wscp-pals" data-role="liquids">' + palCardHTML(
                [['classic'], ['candy'], ['ocean']], 'liquid', liquidSwatches, ['经典', '糖果', '海洋']) + '</div>'
      +       '<div class="wscp-sec">音量</div>'
      +       volRowHTML('bgmVol', '音乐音量') + volRowHTML('sfxVol', '音效音量')
      +       '<div class="wscp-sec">自定义音效</div>'
      +       '<p class="wscp-note">上传本地音频替换对应音效（≤3MB），可试听、可恢复合成音。</p>'
      +       '<div data-role="cuelist"></div>'
      +       '<input type="file" class="wscp-file" accept="audio/*" data-role="sndfile">'
      +     '</div>'
      +     '<div class="wscp-panel" data-panel="data" hidden>'
      +       '<div class="wscp-stats">'
      +         '<div class="wscp-statcell"><div class="wscp-statnum" data-role="statLv">—</div><div class="wscp-statkey">当前关卡</div></div>'
      +         '<div class="wscp-statcell"><div class="wscp-statnum" data-role="statClears">—</div><div class="wscp-statkey">累计过关</div></div>'
      +         '<div class="wscp-statcell"><div class="wscp-statnum" data-role="statMoves">—</div><div class="wscp-statkey">累计步数</div></div>'
      +       '</div>'
      +       '<div class="wscp-btnrow"><button type="button" class="wscp-btn wscp-btn-warn" data-act="clearprog">清空进度</button></div>'
      +       '<p class="wscp-note">导出全部配置（含自定义音效）为 JSON 文件；导入会立即覆盖当前配置。</p>'
      +       '<div class="wscp-btnrow">'
      +         '<button type="button" class="wscp-btn" data-act="export">导出配置</button>'
      +         '<button type="button" class="wscp-btn" data-act="import">导入配置</button>'
      +       '</div>'
      +       '<div class="wscp-sec">恢复</div>'
      +       '<p class="wscp-note">把全部参数恢复为默认值（不影响关卡进度）。</p>'
      +       '<button type="button" class="wscp-btn wscp-btn-warn wscp-btn-block" data-act="resetcfg">恢复默认配置</button>'
      +       '<input type="file" class="wscp-file" accept="application/json,.json,text/plain" data-role="cfgfile">'
      +     '</div>'
      +   '</div>'
      +   '<footer class="wscp-foot"><button type="button" class="wscp-btn wscp-btn-primary wscp-done" data-act="done">完 成</button></footer>'
      +   '<div class="wscp-toast" data-role="toast" hidden></div>'
      + '</section>';

    ui.toast = root.querySelector('[data-role="toast"]');
    ui.tabs = Array.prototype.slice.call(root.querySelectorAll('.wscp-tab'));
    ui.panels = Array.prototype.slice.call(root.querySelectorAll('.wscp-panel'));
    ui.cuelist = root.querySelector('[data-role="cuelist"]');
    ui.hint = root.querySelector('[data-role="hint"]');
    ui.sndfile = root.querySelector('[data-role="sndfile"]');
    ui.cfgfile = root.querySelector('[data-role="cfgfile"]');
    ui.btnReset = root.querySelector('[data-act="resetcfg"]');
    ui.statLv = root.querySelector('[data-role="statLv"]');
    ui.statClears = root.querySelector('[data-role="statClears"]');
    ui.statMoves = root.querySelector('[data-role="statMoves"]');
    ui.vols = {}; ui.volv = {};
    ['bgmVol', 'sfxVol', 'maxColors', 'animSpeed'].forEach(function (k) {
      ui.vols[k] = root.querySelector('[data-vol="' + k + '"]');
      ui.volv[k] = root.querySelector('[data-volval="' + k + '"]');
    });
    buildCueList();
    root.addEventListener('click', onClick, false);
    root.addEventListener('input', onInput, false);
    root.addEventListener('change', onInputChange, false);
    document.addEventListener('keydown', onKey, false);
  }

  function buildCueList() {
    if (!ui.cuelist) return;
    ui.cuelist.innerHTML = cueList().map(function (p) { return cueRowHTML(p[0], p[1]); }).join('');
  }

  /* ---------------- 事件 ---------------- */
  function onClick(e) {
    var t = e.target;
    if (!(t instanceof Element)) return;
    if (t.closest('.wscp-mask') || t.closest('.wscp-close')) { close(); return; }
    var tab = t.closest('.wscp-tab');
    if (tab) { showTab(tab.getAttribute('data-tab')); return; }
    var seg = t.closest('[data-seg]');
    if (seg) {
      var key = seg.getAttribute('data-seg');
      var v = +seg.getAttribute('data-val');
      if (work && work[key] !== v) { work[key] = v; notify(); syncUI(); }
      return;
    }
    var room = t.closest('[data-room]');
    if (room) { if (work) { work.room = room.getAttribute('data-room'); notify(); syncUI(); } return; }
    var liq = t.closest('[data-liquid]');
    if (liq) { if (work) { work.liquidSet = liq.getAttribute('data-liquid'); notify(); syncUI(); } return; }
    var sact = t.closest('[data-sact]');
    if (sact) { doCueAct(sact.closest('[data-cue]'), sact.getAttribute('data-sact')); return; }
    var act = t.closest('[data-act]');
    if (act) doAct(act.getAttribute('data-act'));
  }

  function onInput(e) {
    if (!work) return;
    var t = e.target;
    if (t.classList && t.classList.contains('wscp-range')) {
      var k = t.getAttribute('data-vol');
      if (!k) return;
      if (k === 'bgmVol' || k === 'sfxVol') work[k] = clamp(t.value, 0, 1, work[k]);
      else if (k === 'maxColors') work[k] = clamp(t.value, 4, 10, work[k]);
      else if (k === 'animSpeed') work[k] = clamp(t.value, 0.5, 2, work[k]);
      notify();
      syncVol(k);
    }
  }

  function onInputChange(e) {
    if (!work) return;
    var t = e.target;
    if (t === ui.hint) { work.hintOn = !!ui.hint.checked; notify(); return; }
    if (t === ui.sndfile) {
      var f = ui.sndfile.files && ui.sndfile.files[0];
      ui.sndfile.value = '';
      handleSndFile(sndCue, f);
      return;
    }
    if (t === ui.cfgfile) {
      var cf = ui.cfgfile.files && ui.cfgfile.files[0];
      ui.cfgfile.value = '';
      handleCfgFile(cf);
      return;
    }
  }

  function onKey(e) {
    if (opened && (e.key === 'Escape' || e.keyCode === 27)) close();
  }

  /* ---------------- 音效自定义 ---------------- */
  function doCueAct(row, act) {
    if (!row || !work) return;
    var cue = row.getAttribute('data-cue');
    if (act === 'play') { previewCue(cue); return; }
    if (act === 'up') {
      sndCue = cue;
      ui.sndfile.click();
    } else if (act === 'reset') {
      delete work.audioOverrides[cue];
      notify(); syncUI();
      toast('「' + cueLabel(cue) + '」已恢复合成音');
    }
  }
  function previewCue(cue) {
    var A = window.WS && window.WS.AUDIO;
    if (A && typeof A.play === 'function') {
      try {
        if (typeof A.unlock === 'function') A.unlock();
        if (typeof A.setSFXVolume === 'function') A.setSFXVolume(clamp(work.sfxVol, 0, 1, 0.9));
        if (typeof A.applyOverrides === 'function') A.applyOverrides(deepCopy(work.audioOverrides || {}));
        A.play(cue);
      } catch (err) { toast('试听失败'); }
      return;
    }
    toast('音效模块未加载，无法试听');
  }
  function handleSndFile(cue, file) {
    if (!cue || !file) return;
    if (file.type && !/^audio\//.test(file.type)) { toast('请选择音频文件'); return; }
    if (file.size > 3 * 1024 * 1024) { toast('音频过大（超过 3MB）'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      if (typeof fr.result !== 'string') { toast('音频读取失败'); return; }
      if (!work) return;
      work.audioOverrides[cue] = fr.result;
      notify(); syncUI();
      toast('「' + cueLabel(cue) + '」音效已更新');
    };
    fr.onerror = function () { toast('音频读取失败'); };
    try { fr.readAsDataURL(file); } catch (e) { toast('音频读取失败'); }
  }
  function handleCfgFile(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
      if (typeof fr.result !== 'string') { toast('导入失败：文件读取失败'); return; }
      var obj;
      try { obj = JSON.parse(fr.result); } catch (e) { toast('导入失败：不是有效的 JSON 文件'); return; }
      if (!obj || typeof obj !== 'object') { toast('导入失败：配置格式不正确'); return; }
      if (!work) return;
      work = sanitize(obj);
      notify(); syncUI();
      toast('配置已导入');
    };
    fr.onerror = function () { toast('导入失败：文件读取失败'); };
    try { fr.readAsText(file); } catch (e) { toast('导入失败'); }
  }
  function doExport() {
    try {
      var data = JSON.stringify(deepCopy(work), null, 2);
      var blob = new Blob([data], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'water-sort-config.json';
      document.body.appendChild(a); a.click();
      a.parentNode.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 800);
      toast('配置已导出');
    } catch (e) { toast('导出失败'); }
  }

  /* ---------------- 数据动作 ---------------- */
  function disarm() {
    armed = false;
    clearTimeout(armTimer);
    if (ui.btnReset) { ui.btnReset.textContent = '恢复默认配置'; ui.btnReset.classList.remove('wscp-armed'); }
  }
  function doAct(act) {
    if (!work) return;
    switch (act) {
      case 'done': close(); break;
      case 'export': doExport(); break;
      case 'import': ui.cfgfile.click(); break;
      case 'clearprog':
        if (opts && typeof opts.onClearProgress === 'function') {
          try { opts.onClearProgress(); } catch (e) {}
          toast('进度已清空');
        }
        break;
      case 'resetcfg':
        if (!armed) {
          armed = true;
          ui.btnReset.textContent = '再点一次，确认恢复默认';
          ui.btnReset.classList.add('wscp-armed');
          clearTimeout(armTimer);
          armTimer = setTimeout(disarm, 3000);
        } else {
          disarm();
          work = sanitize(defaultCfg());
          notify(); syncUI();
          toast('已恢复默认配置（进度不受影响）');
        }
        break;
    }
  }

  /* ---------------- 渲染同步 ---------------- */
  function showTab(tab) {
    for (var i = 0; i < TABS.length; i++) if (TABS[i][0] === tab) curTab = tab;
    ui.tabs.forEach(function (b) {
      var on = b.getAttribute('data-tab') === curTab;
      b.classList.toggle('wscp-on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    ui.panels.forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== curTab; });
  }

  function syncVol(k) {
    if (ui.vols[k]) ui.vols[k].value = String(work[k]);
    if (ui.volv[k]) {
      ui.volv[k].textContent = (k === 'bgmVol' || k === 'sfxVol') ? pct(work[k])
        : (k === 'animSpeed' ? work[k] + '×' : String(work[k]));
    }
  }

  function syncUI() {
    if (!root || !work) return;
    Object.keys(SEGS).forEach(function (key) {
      Array.prototype.forEach.call(root.querySelectorAll('[data-seg="' + key + '"]'), function (b) {
        b.classList.toggle('wscp-on', +b.getAttribute('data-val') === work[key]);
      });
    });
    ['bgmVol', 'sfxVol', 'maxColors', 'animSpeed'].forEach(syncVol);
    if (ui.hint) ui.hint.checked = !!work.hintOn;
    Array.prototype.forEach.call(root.querySelectorAll('[data-room]'), function (b) {
      b.classList.toggle('wscp-on', b.getAttribute('data-room') === work.room);
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-liquid]'), function (b) {
      b.classList.toggle('wscp-on', b.getAttribute('data-liquid') === work.liquidSet);
    });
    Array.prototype.forEach.call(root.querySelectorAll('.wscp-cue'), function (row) {
      var cue = row.getAttribute('data-cue');
      var custom = typeof work.audioOverrides[cue] === 'string' && work.audioOverrides[cue];
      var chip = row.querySelector('.wscp-chip');
      var rb = row.querySelector('[data-sact="reset"]');
      if (chip) chip.classList.toggle('wscp-hide', !custom);
      if (rb) rb.classList.toggle('wscp-hide', !custom);
    });
    var okAudio = hasAudio();
    Array.prototype.forEach.call(root.querySelectorAll('[data-sact="play"]'), function (b) {
      b.classList.toggle('wscp-hide', !okAudio);
    });
  }

  function renderStats() {
    var s = opts && typeof opts.stats === 'function' ? opts.stats() : null;
    if (ui.statLv) ui.statLv.textContent = s && s.lv ? s.lv : '—';
    if (ui.statClears) ui.statClears.textContent = s && s.clears != null ? s.clears : '—';
    if (ui.statMoves) ui.statMoves.textContent = s && s.moves != null ? s.moves : '—';
  }

  function toast(msg) {
    if (!ui.toast) return;
    ui.toast.textContent = msg;
    ui.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { if (ui.toast) ui.toast.hidden = true; }, 1800);
  }

  /* ---------------- 对外接口 ---------------- */
  function notify() {
    if (!work) return;
    var snap = deepCopy(work);
    if (opts && typeof opts.onChange === 'function') {
      try { opts.onChange(snap); } catch (e) {}
    }
  }

  function mount(o) {
    opts = o || {};
    ensureStyle();
    var host = opts.root || document.body;
    if (root && root.parentNode === host) return;
    if (root && root.parentNode) root.parentNode.removeChild(root);
    buildDOM();
    root.hidden = true;
    host.appendChild(root);
  }

  function open() {
    if (!root) mount(opts);
    var c = (opts && typeof opts.get === 'function') ? opts.get() : defaultCfg();
    work = sanitize(deepCopy(c));
    buildCueList();
    disarm();
    showTab('play');
    syncUI();
    renderStats();
    opened = true;
    root.hidden = false;
    root.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { root.classList.add('wscp-open'); });
    });
  }

  function close() {
    if (!root || !opened) return;
    opened = false;
    disarm();
    root.classList.remove('wscp-open');
    root.setAttribute('aria-hidden', 'true');
    setTimeout(function () { if (!opened && root) root.hidden = true; }, 300);
    if (opts && typeof opts.onClose === 'function') { try { opts.onClose(); } catch (e) {} }
  }

  function isOpen() { return opened; }

  return { mount: mount, open: open, close: close, isOpen: isOpen };
})();

</script>
<script>
/* ===== src/game.js ===== */
/* 倒水挑战 — 主游戏：状态机 / 画布渲染 / 倒水动画 / 持久化 / AI 演示 */
window.WS = window.WS || {};
WS.GAME = (() => {
  const L = WS.LOGIC;
  const noop = () => {};
  // 缺模块兜底（开发期子代理未就绪也能跑）
  const svg = d => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(d);
  const ART = WS.ART || (() => {
    // 极简兜底：能跑通流程的素坯（正常路径走子代理美术）
    const FALLBACK_LIQUIDS = {
      classic: ['#F5C542', '#E2483D', '#3FA0D8', '#59B35B', '#F08A3C', '#EF7FA4', '#8E6FC8', '#4EC8C0', '#A5714A', '#A8C93A'],
      candy: ['#FF8FB2', '#FFD166', '#7FD8BE', '#9B8CFF', '#FF9F68', '#6FC7E1', '#C3E88D', '#F78FB0', '#BFA76A', '#7986CB'],
      ocean: ['#2E86AB', '#7ADCC7', '#F6C445', '#E4717A', '#9BDE7E', '#5E60CE', '#F49FBC', '#43AA8B', '#F8961E', '#90BE6D'],
    };
    const bottleSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 190"><path d="M38 12 h24 v6 c0 8 3 14 8 22 c6 10 9 20 9 34 v94 c0 10 -7 16 -16 16 h-26 c-9 0 -16 -6 -16 -16 v-94 c0 -14 3 -24 9 -34 c5 -8 8 -14 8 -22 z" fill="rgba(255,255,255,.28)" stroke="rgba(255,255,255,.55)" stroke-width="3"/><rect x="24" y="70" width="7" height="86" rx="3.5" fill="rgba(255,255,255,.4)"/></svg>';
    return {
      ready: Promise.resolve(),
      bg: () => svg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 1232"><rect width="690" height="1232" fill="#A96A3F"/><rect width="690" height="271" fill="#8A6FA5"/><rect y="271" width="690" height="65" fill="#8A5533"/></svg>'),
      pig: () => svg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170"><circle cx="100" cy="85" r="70" fill="#F2A9B8"/></svg>'),
      scooterPig: () => svg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300"><circle cx="180" cy="150" r="90" fill="#F2A9B8"/></svg>'),
      logo: () => svg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260"><text x="260" y="170" font-size="120" font-weight="900" text-anchor="middle" fill="#FFC93C" stroke="#fff" stroke-width="10">倒水挑战</text></svg>'),
      bottle: () => ({ img: svg(bottleSVG), innerD: 'M30 70 h40 v106 a14 14 0 0 1 -14 14 h-12 a14 14 0 0 1 -14 -14 z', inner: { x: 30, y: 70, w: 40, h: 120 }, mouth: { x: 50, y: 12 }, W: 100, H: 190 }),
      icon: (n) => svg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><circle cx="24" cy="24" r="16" fill="#8A5A2A"/></svg>'),
      setRoom: noop, rooms: {}, liquids: FALLBACK_LIQUIDS,
    };
  })();
  const AUDIO = WS.AUDIO || { unlock: noop, play: noop, startLoop: noop, stopLoop: noop, duck: noop, setBGMVolume: noop, setSFXVolume: noop, setMasterVolume: noop, applyOverrides: noop, names: [] };
  const FX = WS.FX || { init: noop, resize: noop, droplets: noop, sparkle: noop, confetti: noop, stop: noop, clear: noop };
  const PANEL = WS.PANEL || { mount: noop, open: noop, close: noop, isOpen: () => false, onChange: noop };

  // ?reset=1 必须在任何 localStorage 读取之前
  if (location.search.indexOf('reset=1') >= 0) {
    try { localStorage.removeItem(L.LS_ST); localStorage.removeItem(L.LS_CFG); } catch (e) {}
  }
  const qs = k => {
    const m = location.search.match(new RegExp('[?&]' + k + '=([\\w-]+)'));
    return m ? m[1] : null;
  };
  // 错误探针（测试用）
  window.__errs = [];
  window.addEventListener('error', e => window.__errs.push('ERR: ' + e.message + ' @' + (e.filename || '') + ':' + e.lineno));
  window.addEventListener('unhandledrejection', e => window.__errs.push('REJ: ' + (e.reason && e.reason.message || e.reason)));
  // ?snap=1 零动画
  const SNAP = location.search.indexOf('snap=1') >= 0;
  if (SNAP) document.documentElement.classList.add('snap');

  function deepMerge(base, patch) {
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    if (!patch || typeof patch !== 'object') return out;
    for (const k of Object.keys(patch)) {
      const v = patch[k];
      out[k] = (v && typeof v === 'object' && !Array.isArray(v)) ? deepMerge(base[k] || {}, v) : v;
    }
    return out;
  }
  const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const saveJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  let cfg = deepMerge(L.DEFAULT_CFG, loadJSON(L.LS_CFG));
  const st = { lv: 1, stats: { clears: 0, movesTotal: 0 }, best: {} };
  const saved = loadJSON(L.LS_ST);
  if (saved && typeof saved === 'object') {
    if (saved.lv > 0) st.lv = saved.lv;
    if (saved.stats) st.stats = saved.stats;
    if (saved.best) st.best = saved.best;
  }
  const qlv = qs('level');
  if (qlv && +qlv > 0) st.lv = +qlv;
  const MUTED = qs('muted') === '1';
  const DEMO = qs('demo') === '1';

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const el = {
    app: $('app'), splash: $('splash'), splashLogo: $('splashLogo'), splashPig: $('splashPig'),
    splashBar: $('splashBar'), splashFill: $('splashFill'), splashStart: $('splashStart'),
    canvas: $('gameCanvas'), fxCanvas: $('fxCanvas'),
    pauseBtn: $('pauseBtn'), levelPill: $('levelPill'), pctPill: $('pctPill'),
    undoBtn: $('undoBtn'), hintBtn: $('hintBtn'), addBtn: $('addBtn'), restartBtn: $('restartBtn'),
    bubble: $('bubble'), bubbleFace: $('bubbleFace'),
    pauseMenu: $('pauseMenu'), pauseSub: $('pauseSub'),
    pmResume: $('pmResume'), pmRestart: $('pmRestart'), pmSkip: $('pmSkip'), pmSettings: $('pmSettings'), pmHome: $('pmHome'),
    winPanel: $('winPanel'), winStars: $('winStars'), winSub: $('winSub'), winNext: $('winNext'), winReplay: $('winReplay'),
    toast: $('toast'),
  };

  // ---------- 画布 ----------
  const ctx = el.canvas.getContext('2d');
  const fctx = el.fxCanvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let bgOff = null;           // 预渲染背景
  let bgMap = { s: 1, dx: 0, dy: 0 }; // cover 映射
  const BG_W = 690, BG_H = 1232;
  const LOCAL = { counterTop: 271, counterBot: 336, pigBase: 278 }; // bg viewBox 内的吧台线

  // ---------- 资源 ----------
  const IMG = {}; // name -> HTMLImageElement
  function loadImg(key, dataURI) {
    if (!dataURI) return Promise.resolve();
    return new Promise(res => {
      const im = new Image();
      im.onload = () => { IMG[key] = im; res(); };
      im.onerror = res;
      im.src = dataURI;
    });
  }
  let BOTTLE = ART.bottle();
  let innerPath = null;
  try { innerPath = new Path2D(BOTTLE.innerD); } catch (e) {}

  // ---------- 游戏状态 ----------
  let mode = 'splash';        // splash | playing | anim | win
  let lvData = null;          // genLevel 结果
  let bottles = [];
  let par = 0;                // 本关求解器步数（星级基准）
  let sel = -1;
  let moves = 0, addedUsed = 0, addedIds = 0;
  let undoStack = [];
  let pour = null;            // 倒水动画
  let selLift = 0;            // 选中瓶抬起量（px，缓动）
  let anims = {};             // i -> {deny: 剩余ms}
  let cheerUntil = 0;         // 猪欢呼截止
  let winShownAt = 0;
  let finishedLv = 0;         // 刚过关的关号（再玩一次用）
  let curLv = st.lv;          // 当前游玩关号（st.lv 是进度指针，重玩旧关时二者不同）
  let demoTimer = 0;
  const PIG_ACCENTS = ['#E8483F', '#F5B93C', '#3FA0D8'];

  const palette = () => (ART.liquids && (ART.liquids[cfg.liquidSet] || ART.liquids.classic)) || [];
  const liquidColor = c => palette()[c] || '#ccc';
  const dur = ms => SNAP ? 0 : ms / (cfg.animSpeed || 1);
  const busy = () => mode === 'anim' || PANEL.isOpen() || el.pauseMenu.classList.contains('hidden') === false;

  // ---------- 布局 ----------
  let slots = [];             // i -> {x,y} 瓶盒左上角（css px）
  let BW = 54, BH = 128;      // 瓶盒尺寸
  let pigPos = [];            // 三只猪 {x, w}
  let pigImgs = ['', '', ''];
  let pigCheer = ['', '', ''];

  function layout() {
    const rect = el.canvas.getBoundingClientRect();
    W = Math.round(rect.width); H = Math.round(rect.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of [el.canvas, el.fxCanvas]) { c.width = W * DPR; c.height = H * DPR; }
    FX.resize(W, H, DPR);
    // 背景 cover 映射
    const s = Math.max(W / BG_W, H / BG_H);
    bgMap = { s, dx: (W - BG_W * s) / 2, dy: (H - BG_H * s) / 2 };
    buildBG();
    // 猪位置
    const pw = 150 * s;
    pigPos = [0, 1, 2].map(i => ({ x: W / 2 + (i - 1) * pw * 1.06 - pw / 2, w: pw }));
    layoutBottles();
  }

  function buildBG() {
    const im = IMG.bg;
    bgOff = document.createElement('canvas');
    bgOff.width = W * DPR; bgOff.height = H * DPR;
    const b = bgOff.getContext('2d');
    b.scale(DPR, DPR);
    if (im) b.drawImage(im, bgMap.dx, bgMap.dy, BG_W * bgMap.s, BG_H * bgMap.s);
    else { b.fillStyle = '#A96A3F'; b.fillRect(0, 0, W, H); }
  }

  function toolbarTop() {
    const r = el.toolbar ? document.getElementById('toolbar').getBoundingClientRect() : { top: H - 80 };
    return r.top;
  }

  function layoutBottles() {
    const n = bottles.length;
    if (!n || !W) { slots = []; return; }
    const s = bgMap.s;
    const areaTop = bgMap.dy + LOCAL.counterBot * s + 8;
    const areaBot = toolbarTop() - 12;
    const rows = n > 6 ? 2 : 1;
    const cols = Math.ceil(n / rows);
    const gap = Math.max(8, W * 0.024);
    const rowGap = 18;
    let bw = Math.min((W * 0.92 - (cols - 1) * gap) / cols, 66);
    let bh = bw * (BOTTLE.H / BOTTLE.W);
    const maxBH = (areaBot - areaTop - (rows - 1) * rowGap) / rows * 0.97;
    if (bh > maxBH) { bh = maxBH; bw = bh * (BOTTLE.W / BOTTLE.H); }
    BW = bw; BH = bh;
    slots = [];
    const totalW = cols * bw + (cols - 1) * gap;
    const x0 = (W - totalW) / 2;
    const gridH = rows * bh + (rows - 1) * rowGap;
    const y0 = areaTop + Math.max(0, (areaBot - areaTop - gridH) / 2);
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / cols), c = i % cols;
      const rowCount = (r === rows - 1) ? (n - r * cols) : cols;
      const rowW = rowCount * bw + (rowCount - 1) * gap;
      const rx0 = (W - rowW) / 2;
      slots.push({ x: rx0 + c * (bw + gap), y: y0 + r * (bh + rowGap) });
    }
  }

  // ---------- 渲染 ----------
  let lastDraw = 0;
  function tick(now) {
    requestAnimationFrame(tick);
    if (now - lastDraw < 28) return;
    lastDraw = now;
    draw(now);
  }
  setInterval(() => { if (performance.now() - lastDraw > 140) { lastDraw = performance.now(); draw(performance.now()); } }, 120);

  function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  function draw(now) {
    if (!W) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (bgOff) ctx.drawImage(bgOff, 0, 0, W, H);
    drawPigs(now);
    // 倒水中的两个瓶最后画（在最上层）
    const skip = pour ? [pour.from, pour.to] : [];
    for (let i = 0; i < bottles.length; i++) {
      if (skip.indexOf(i) >= 0) continue;
      drawBottle(i, now, {});
    }
    if (pour) drawPouring(now);
  }

  function drawPigs(now) {
    const s = bgMap.s;
    // 横屏等矮窗时吧台被 cover 裁出屏外，把猪夹到贴顶露出
    let baseY = bgMap.dy + LOCAL.pigBase * s;
    const pigH = pigPos[0] ? pigPos[0].w * (170 / 200) : 0;
    baseY = Math.max(baseY, pigH * 0.94);
    const cheering = now < cheerUntil;
    for (let i = 0; i < 3; i++) {
      const im = cheering && pigCheer[i] ? (IMG['pigCheer' + i] || IMG['pig' + i]) : IMG['pig' + i];
      if (!im || !pigPos[i]) continue;
      const bob = Math.sin(now / 620 + i * 1.25) * 2.2 * s;
      let jump = 0;
      if (cheering) {
        const p = 1 - (cheerUntil - now) / 950;
        jump = -Math.abs(Math.sin(p * Math.PI * 3)) * 13 * s;
      }
      const w = pigPos[i].w, h = w * (170 / 200);
      ctx.drawImage(im, pigPos[i].x, baseY - h + bob + jump, w, h);
    }
  }

  // unitsF: 浮点格数（倒水动画中）；返回液面 y（盒内 css px）
  function drawLiquid(i, unitsF) {
    const inner = BOTTLE.inner;
    const unitH = inner.h / cfg.capacity;
    const bottom = inner.y + inner.h;
    let remaining = unitsF;
    for (let k = 0; k < Math.ceil(unitsF) && k < cfg.capacity + 1; k++) {
      const frac = Math.max(0, Math.min(1, remaining));
      if (frac <= 0) break;
      const h = frac * unitH;
      const yTop = bottom - (k + 1) * unitH + (1 - frac) * unitH;
      ctx.fillStyle = liquidColor(bottles[i][k]);
      ctx.fillRect((inner.x - 1.5) * BW / 100, yTop * BH / 190, (inner.w + 3) * BW / 100, h * BH / 190 + 0.6);
      remaining -= 1;
    }
    if (unitsF > 0) {
      // 层间暗线 + 顶面高光
      ctx.fillStyle = 'rgba(0,0,0,.08)';
      for (let k = 1; k < Math.floor(unitsF + 0.001); k++) {
        const y = (bottom - k * unitH) * BH / 190;
        ctx.fillRect((inner.x - 1.5) * BW / 100, y - 0.7, (inner.w + 3) * BW / 100, 1.4);
      }
      const ySurf = (bottom - unitsF * unitH) * BH / 190;
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.fillRect((inner.x) * BW / 100, ySurf, (inner.w) * BW / 100, Math.max(1.6, BH * 0.012));
    }
    return (bottom - unitsF * unitH) * BH / 190;
  }

  function drawBottle(i, now, opt) {
    const p = slots[i]; if (!p) return;
    const a = anims[i] || {};
    let dx = 0;
    if (a.deny > 0) dx = Math.sin(now / 26) * 4 * (a.deny / 320);
    ctx.save();
    if (opt.pivot) {
      const mx = BOTTLE.mouth.x * BW / 100, my = BOTTLE.mouth.y * BH / 190;
      ctx.translate(opt.pivot.x, opt.pivot.y);
      ctx.rotate(opt.pivot.angle);
      ctx.translate(-mx, -my);
    } else {
      ctx.translate(p.x + dx, p.y - (opt.lift || 0));
    }
    // 液体（裁剪进瓶内路径）
    if (innerPath) {
      ctx.save();
      ctx.scale(BW / 100, BH / 190);
      ctx.clip(innerPath);
      ctx.restore();
      // clip 不跨 restore 保留，改为缩放坐标系内画
      ctx.save();
      ctx.scale(BW / 100, BH / 190);
      ctx.clip(innerPath);
      drawLiquidInLocal(i, opt.units != null ? opt.units : bottles[i].length);
      ctx.restore();
    }
    // 玻璃
    if (IMG.bottle) ctx.drawImage(IMG.bottle, 0, 0, BW, BH);
    // 选中描边
    if (opt.lift > 4 && !opt.pivot) {
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = 3;
      roundRect(ctx, 3, 3, BW - 6, BH - 6, BW * 0.16);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 在已缩放到 100×190 坐标系且已 clip 的上下文里画液体
  function drawLiquidInLocal(i, unitsF) {
    const inner = BOTTLE.inner;
    const unitH = inner.h / cfg.capacity;
    const bottom = inner.y + inner.h;
    let remaining = unitsF;
    for (let k = 0; k < Math.ceil(unitsF + 0.0001) && k < cfg.capacity + 1; k++) {
      const frac = Math.max(0, Math.min(1, remaining));
      if (frac <= 0) break;
      const h = frac * unitH;
      const yTop = bottom - (k + 1) * unitH + (1 - frac) * unitH;
      ctx.fillStyle = liquidColor(bottles[i][k]);
      ctx.fillRect(inner.x - 2, yTop, inner.w + 4, h + 0.5);
      remaining -= 1;
    }
    if (unitsF > 0.01) {
      ctx.fillStyle = 'rgba(0,0,0,.08)';
      for (let k = 1; k < Math.floor(unitsF + 0.001); k++) {
        ctx.fillRect(inner.x - 2, bottom - k * unitH - 0.7, inner.w + 4, 1.4);
      }
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.fillRect(inner.x, bottom - unitsF * unitH, inner.w, Math.max(1.4, 190 * 0.008));
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // ---------- 倒水动画 ----------
  function mouthWorld(slotPos) {
    return { x: slotPos.x + BOTTLE.mouth.x * BW / 100, y: slotPos.y + BOTTLE.mouth.y * BH / 190 };
  }

  function startPour(from, to) {
    const n = L.canPour(bottles[from], bottles[to], cfg.capacity);
    if (!n) return Promise.resolve(false);
    pushUndo();
    const srcUnits = bottles[from].length, dstUnits = bottles[to].length;
    const color = bottles[from][bottles[from].length - 1];
    const dir = (slots[to].x + BW / 2) >= (slots[from].x + BW / 2) ? 1 : -1;
    const tm = mouthWorld(slots[to]);
    const pivotFrom = { x: mouthWorld(slots[from]).x, y: mouthWorld(slots[from]).y - selLift };
    const pivotTo = { x: tm.x - dir * BW * 1.02, y: tm.y - BH * 0.56 };
    const angleTo = dir * 1.16;
    pour = {
      from, to, n, color, dir, srcUnits, dstUnits,
      t0: performance.now(),
      flyMs: dur(200), unitMs: dur(170), backMs: dur(220),
      pivotFrom, pivotTo, angleTo,
      lastDroplet: 0,
    };
    sel = -1;
    mode = 'anim';
    AUDIO.play('pour');
    return new Promise(res => { pour.resolve = res; });
  }

  function pourPhase(now) {
    const p = pour;
    const t1 = p.flyMs;
    const t2 = t1 + p.n * p.unitMs;
    const t3 = t2 + p.backMs;
    const t = now - p.t0;
    if (t < t1) {
      const k = ease(t / Math.max(1, t1));
      return {
        phase: 'fly', k,
        pivot: { x: p.pivotFrom.x + (p.pivotTo.x - p.pivotFrom.x) * k, y: p.pivotFrom.y + (p.pivotTo.y - p.pivotFrom.y) * k, angle: p.angleTo * k },
        srcF: p.srcUnits, dstF: p.dstUnits,
      };
    }
    if (t < t2) {
      const k = (t - t1) / Math.max(1, p.n * p.unitMs);
      return {
        phase: 'pour', k,
        pivot: { x: p.pivotTo.x, y: p.pivotTo.y, angle: p.angleTo },
        srcF: p.srcUnits - p.n * k, dstF: p.dstUnits + p.n * k,
      };
    }
    if (t < t3) {
      const k = ease((t - t2) / Math.max(1, p.backMs));
      const home = mouthWorld(slots[p.from]);
      return {
        phase: 'back', k,
        pivot: { x: p.pivotTo.x + (home.x - p.pivotTo.x) * k, y: p.pivotTo.y + (home.y - p.pivotTo.y) * k, angle: p.angleTo * (1 - k) },
        srcF: p.srcUnits - p.n, dstF: p.dstUnits + p.n,
      };
    }
    return { phase: 'done' };
  }

  function drawPouring(now) {
    const ph = pourPhase(now);
    if (ph.phase === 'done') { finishPour(); return; }
    // 目标瓶（正常位）
    drawBottle(pour.to, now, { units: ph.dstF });
    // 源瓶（变换位）
    drawBottle(pour.from, now, { pivot: ph.pivot, units: ph.srcF });
    // 液流
    if (ph.phase === 'pour' && ph.pivot.angle * pour.dir > 0.45) {
      const inner = BOTTLE.inner;
      const surfY = slots[pour.to].y + (inner.y + inner.h - ph.dstF * (inner.h / cfg.capacity)) * BH / 190;
      const endX = slots[pour.to].x + (inner.x + inner.w / 2) * BW / 100;
      const mx = ph.pivot.x, my = ph.pivot.y;
      const wStream = Math.max(5, Math.min(8, BW * 0.13));
      ctx.strokeStyle = liquidColor(pour.color);
      ctx.lineWidth = wStream;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(mx + pour.dir * 2, my + 2);
      ctx.quadraticCurveTo(mx + pour.dir * 10, my + (surfY - my) * 0.35, endX, surfY - 2);
      ctx.stroke();
      // 落点液面扰动
      ctx.fillStyle = liquidColor(pour.color);
      ctx.globalAlpha = .9;
      ctx.beginPath();
      ctx.ellipse(endX, surfY - 1, wStream * 1.4, wStream * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      if (now - pour.lastDroplet > 110) {
        pour.lastDroplet = now;
        FX.droplets(endX, surfY, liquidColor(pour.color), 2);
      }
    }
  }

  function finishPour() {
    const p = pour; pour = null;
    const r = L.applyPour(bottles, p.from, p.to, cfg.capacity);
    bottles = r.bottles;
    moves++; st.stats.movesTotal++;
    const doneColors = L.completedColors(bottles, cfg.capacity);
    const justDone = L.isComplete(bottles[p.to], cfg.capacity);
    hideBubble();
    if (justDone) {
      const tp = slots[p.to];
      FX.sparkle(tp.x + BW / 2, tp.y + 6, liquidColor(bottles[p.to][0]));
      AUDIO.play('colorDone'); AUDIO.play('pig');
      cheerUntil = performance.now() + 950;
    }
    updateHUD();
    if (L.isWin(bottles, cfg.capacity)) {
      mode = 'win';
      winSequence();
    } else {
      mode = 'playing';
    }
    if (p.resolve) p.resolve(true);
  }

  // ---------- 胜利 ----------
  function winSequence() {
    finishedLv = curLv;
    st.stats.clears++;
    const prevBest = st.best[finishedLv];
    if (!prevBest || moves < prevBest) st.best[finishedLv] = moves;
    st.lv = Math.max(st.lv, finishedLv + 1);
    saveState();
    AUDIO.play('win');
    AUDIO.duck(1400);
    cheerUntil = performance.now() + 1600;
    FX.confetti(W, H);
    updateHUD();
    setTimeout(() => {
      if (mode !== 'win') return;
      showWin();
    }, dur(700));
  }

  function showWin() {
    winShownAt = performance.now();
    const starsN = moves <= par ? 3 : (moves <= Math.ceil(par * 1.6) ? 2 : 1);
    el.winStars.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const im = document.createElement('img');
      im.src = IMG['icon_star'] ? IMG['icon_star'].src : '';
      if (i >= starsN) im.className = 'dim';
      el.winStars.appendChild(im);
    }
    const best = st.best[finishedLv];
    el.winSub.textContent = '第 ' + finishedLv + ' 关 · 用了 ' + moves + ' 步' + (best ? ' · 最佳 ' + best + ' 步' : '');
    el.winNext.textContent = '下一关 · 第 ' + (finishedLv + 1) + ' 关';
    el.winPanel.classList.remove('hidden');
  }

  // ---------- 关卡流程 ----------
  function startLevel(n) {
    if (demoTimer) { clearInterval(demoTimer); demoTimer = 0; } // demoWanted 保留，关底自续
    curLv = n;
    lvData = L.genLevel(n, cfg);
    bottles = lvData.bottles.map(b => b.slice());
    cfg.capacity = lvData.cap;
    par = (L.solve(bottles, cfg.capacity) || []).length || 20;
    sel = -1; moves = 0; addedUsed = 0; undoStack = []; pour = null;
    mode = 'playing';
    layoutBottles();
    el.levelPill.textContent = '第 ' + n + ' 关';
    updateHUD();
    saveState();
    el.bubble.classList.toggle('hide', !(st.stats.clears === 0 && n <= 2));
    if (demoWanted) startDemo();
  }

  function updateHUD() {
    const done = L.completedColors(bottles, cfg.capacity);
    const pct = lvData ? Math.round(done / lvData.K * 100) : 0;
    el.pctPill.textContent = pct + '%';
    el.undoBtn.disabled = undoStack.length === 0;
    el.addBtn.disabled = addedUsed >= (cfg.addBottle || 0);
    el.addBtn.querySelector('.bdg').textContent = Math.max(0, (cfg.addBottle || 0) - addedUsed);
    el.hintBtn.style.display = cfg.hintOn ? '' : 'none';
  }

  function hideBubble() { el.bubble.classList.add('hide'); }

  // ---------- 输入 ----------
  function bottleAt(x, y) {
    for (let i = 0; i < slots.length; i++) {
      const p = slots[i];
      if (x >= p.x - 6 && x <= p.x + BW + 6 && y >= p.y - 10 && y <= p.y + BH + 8) return i;
    }
    return -1;
  }

  el.canvas.addEventListener('pointerdown', e => {
    AUDIO.unlock();
    if (busy() || mode !== 'playing') return;
    const rect = el.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const i = bottleAt(x, y);
    if (i < 0) { if (sel >= 0) { sel = -1; } return; }
    if (sel === -1) {
      if (!bottles[i].length) return deny(i);
      sel = i;
      AUDIO.play('pick');
    } else if (sel === i) {
      sel = -1;
    } else {
      const from = sel; sel = -1;
      startPour(from, i);
    }
  });

  function deny(i) {
    anims[i] = anims[i] || {};
    anims[i].deny = 320;
    AUDIO.play('deny');
  }
  setInterval(() => { for (const k in anims) if (anims[k].deny > 0) anims[k].deny -= 40; }, 40);

  // sel 抬起量缓动
  setInterval(() => {
    const target = sel >= 0 ? 16 : 0;
    selLift += (target - selLift) * 0.35;
  }, 40);

  // ---------- 工具条 ----------
  function pushUndo() {
    undoStack.push({ bottles: bottles.map(b => b.slice()), moves, addedUsed });
    if (undoStack.length > 200) undoStack.shift();
  }
  function undo() {
    if (!undoStack.length || busy() || mode !== 'playing') return;
    const u = undoStack.pop();
    bottles = u.bottles; moves = u.moves; addedUsed = u.addedUsed;
    sel = -1;
    layoutBottles();
    updateHUD();
    AUDIO.play('click');
  }
  el.undoBtn.addEventListener('click', undo);
  el.restartBtn.addEventListener('click', () => {
    if (busy()) return;
    AUDIO.play('click');
    startLevel(curLv);
  });
  el.hintBtn.addEventListener('click', () => {
    if (busy() || mode !== 'playing') return;
    const m = L.hintMove(bottles, cfg.capacity);
    if (!m) { toast('卡住啦，试试撤销或加瓶'); return; }
    AUDIO.play('click');
    startPour(m.from, m.to);
  });
  el.addBtn.addEventListener('click', () => {
    if (busy() || mode !== 'playing') return;
    if (addedUsed >= (cfg.addBottle || 0)) return;
    pushUndo();
    addedUsed++;
    bottles.push([]);
    addedIds++;
    sel = -1;
    layoutBottles();
    updateHUD();
    AUDIO.play('click');
    toast('加了一个空瓶');
  });

  // ---------- 暂停菜单 ----------
  el.pauseBtn.addEventListener('click', () => {
    AUDIO.unlock(); AUDIO.play('click');
    el.pauseSub.textContent = '第 ' + curLv + ' 关';
    el.pauseMenu.classList.remove('hidden');
  });
  el.pmResume.addEventListener('click', () => { AUDIO.play('click'); el.pauseMenu.classList.add('hidden'); });
  el.pmRestart.addEventListener('click', () => { AUDIO.play('click'); el.pauseMenu.classList.add('hidden'); startLevel(curLv); });
  el.pmSkip.addEventListener('click', () => {
    AUDIO.play('click');
    el.pauseMenu.classList.add('hidden');
    st.lv = Math.max(st.lv, curLv + 1); saveState();
    startLevel(st.lv);
    toast('已跳到第 ' + st.lv + ' 关');
  });
  el.pmSettings.addEventListener('click', () => { AUDIO.play('click'); PANEL.open(); });
  el.pmHome.addEventListener('click', () => {
    AUDIO.play('click');
    el.pauseMenu.classList.add('hidden');
    goSplash();
  });

  el.winNext.addEventListener('click', () => {
    AUDIO.play('click');
    el.winPanel.classList.add('hidden');
    startLevel(st.lv);
  });
  el.winReplay.addEventListener('click', () => {
    AUDIO.play('click');
    el.winPanel.classList.add('hidden');
    startLevel(finishedLv || st.lv);
  });

  function goSplash() {
    mode = 'splash';
    stopDemo();
    el.splash.classList.remove('hide');
    el.splash.classList.add('ready');
    el.splashStart.textContent = st.lv > 1 ? '继续 · 第 ' + st.lv + ' 关' : '开始游戏';
  }

  // ---------- toast ----------
  let toastTimer = 0;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1800);
  }

  // ---------- AI 演示 ----------
  let demoWanted = false;      // demo 意图跨关卡存活：startLevel 里的 stopDemo 后由它自续
  function stopDemo() { demoWanted = false; if (demoTimer) { clearInterval(demoTimer); demoTimer = 0; } }
  function startDemo() {
    stopDemo();
    demoWanted = true;
    demoTimer = setInterval(() => {
      if (PANEL.isOpen() || !el.pauseMenu.classList.contains('hidden')) return;
      if (mode === 'playing') {
        const m = L.hintMove(bottles, cfg.capacity);
        if (m) startPour(m.from, m.to);
        else if (undoStack.length) undo();
        else startLevel(st.lv);
      } else if (mode === 'win' && !el.winPanel.classList.contains('hidden')) {
        if (performance.now() - winShownAt > 1500) el.winNext.click();
      }
    }, 460);
  }

  // ---------- 持久化 ----------
  function saveState() { saveJSON(L.LS_ST, st); }
  function saveCfg() { saveJSON(L.LS_CFG, cfg); }

  // ---------- 配置面板 ----------
  PANEL.mount({
    root: $('panelHost'),
    get: () => cfg,
    onChange: (next) => {
      const prev = cfg;
      cfg = deepMerge(L.DEFAULT_CFG, next);
      if (cfg.bgmVol !== prev.bgmVol) AUDIO.setBGMVolume(cfg.bgmVol);
      if (cfg.sfxVol !== prev.sfxVol) AUDIO.setSFXVolume(cfg.sfxVol);
      if (cfg.room !== prev.room || cfg.liquidSet !== prev.liquidSet) {
        ART.setRoom(cfg.room);
        reloadArt().then(() => { buildBG(); });
      }
      saveCfg();
      updateHUD();
    },
    stats: () => ({ lv: st.lv, clears: st.stats.clears, moves: st.stats.movesTotal }),
    onClearProgress: () => {
      st.lv = 1; st.stats = { clears: 0, movesTotal: 0 }; st.best = {};
      saveState();
      el.pauseMenu.classList.add('hidden');
      el.winPanel.classList.add('hidden');
      startLevel(1);
      toast('进度已清空');
    },
    audioNames: AUDIO.names || [],
    onAudioOverride: (map) => { AUDIO.applyOverrides(map); cfg.audioOverrides = map; saveCfg(); },
  });

  async function reloadArt() {
    await loadImg('bg', ART.bg());
    pigImgs = await Promise.all(PIG_ACCENTS.map(a => loadImg('pig' + PIG_ACCENTS.indexOf(a), ART.pig(a, 'idle')) && IMG['pig' + PIG_ACCENTS.indexOf(a)]));
    pigCheer = await Promise.all(PIG_ACCENTS.map((a, i) => loadImg('pigCheer' + i, ART.pig(a, 'cheer'))));
    await loadImg('bottle', BOTTLE.img);
  }

  // ---------- 启动 ----------
  async function boot() {
    // 画布尺寸先就位
    layout();
    window.addEventListener('resize', () => { layout(); });
    window.addEventListener('orientationchange', () => setTimeout(layout, 250));

    // 资源（有 ART.ready 就等它，保证 SVG 已解码）
    try { if (ART.ready) await Promise.race([ART.ready, new Promise(r => setTimeout(r, 3000))]); } catch (e) {}
    BOTTLE = ART.bottle();
    try { innerPath = new Path2D(BOTTLE.innerD); } catch (e) {}
    await loadImg('bg', ART.bg());
    await loadImg('logo', ART.logo());
    await loadImg('scooter', ART.scooterPig());
    await Promise.all(PIG_ACCENTS.map((a, i) => loadImg('pig' + i, ART.pig(a, 'idle'))));
    await Promise.all(PIG_ACCENTS.map((a, i) => loadImg('pigCheer' + i, ART.pig(a, 'cheer'))));
    await loadImg('bottle', BOTTLE.img);
    for (const name of ['pause', 'play', 'gear', 'undo', 'refresh', 'plus', 'bulb', 'sound', 'soundOff', 'close', 'star']) {
      await loadImg('icon_' + name, ART.icon(name));
    }
    await loadImg('bubblePig', ART.pig(PIG_ACCENTS[2], 'cheer'));
    // 图标落位
    el.pauseBtn.firstElementChild.src = IMG.icon_pause ? IMG.icon_pause.src : '';
    el.undoBtn.firstElementChild.src = IMG.icon_undo ? IMG.icon_undo.src : '';
    el.hintBtn.firstElementChild.src = IMG.icon_bulb ? IMG.icon_bulb.src : '';
    el.addBtn.firstElementChild.src = IMG.icon_plus ? IMG.icon_plus.src : '';
    el.restartBtn.firstElementChild.src = IMG.icon_refresh ? IMG.icon_refresh.src : '';
    el.bubbleFace.firstElementChild.src = IMG.bubblePig ? IMG.bubblePig.src : '';
    el.splashLogo.src = IMG.logo ? IMG.logo.src : '';
    el.splashPig.src = IMG.scooter ? IMG.scooter.src : '';
    // 房间/音量
    ART.setRoom(cfg.room);
    await loadImg('bg', ART.bg());
    buildBG();
    AUDIO.setBGMVolume(cfg.bgmVol); AUDIO.setSFXVolume(cfg.sfxVol);
    if (MUTED) AUDIO.setMasterVolume(0);
    if (cfg.audioOverrides) AUDIO.applyOverrides(cfg.audioOverrides);

    layout(); // 背景映射重算（图片就位后）

    // 启动页流程
    requestAnimationFrame(tick);
    setTimeout(() => { el.splashFill.style.width = '100%'; }, 120);
    const readyIn = SNAP ? 50 : 1350;
    setTimeout(() => {
      el.splash.classList.add('ready');
      el.splashStart.textContent = st.lv > 1 ? '继续 · 第 ' + st.lv + ' 关' : '开始游戏';
    }, readyIn);

    el.splashStart.addEventListener('click', enterGame);
    if (DEMO) setTimeout(enterGame, 500);
  }

  let entered = false;
  function enterGame() {
    if (entered) return;
    entered = true;
    AUDIO.unlock();
    if (!MUTED) AUDIO.play('start');
    AUDIO.startLoop && AUDIO.startLoop('bgm');
    el.splash.classList.add('hide');
    startLevel(st.lv);
    if (DEMO) startDemo();
  }

  // ---------- 测试钩子 ----------
  window.__ws = {
    get st() { return st; },
    get cfg() { return cfg; },
    get busy() { return busy() || mode === 'anim'; },
    get mode() { return mode; },
    level: () => curLv,
    state: () => bottles.map(b => b.slice()),
    slots: () => slots.map(s => ({ x: s.x, y: s.y, w: BW, h: BH })),
    par: () => par,
    solve: () => L.solve(bottles, cfg.capacity),
    apply: (from, to) => startPour(from, to),
    startLevel: n => startLevel(n),
    enterGame,
    startDemo, stopDemo,
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return {};
})();

</script>

</body>
</html>
