<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>最后半个像素 · The Last Half Pixel</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #14161c;
      --panel: rgba(14, 16, 22, 0.92);
      --text: #f2f4f8;
      --dim: #a4abb8;
      --sel: #2b5cff;
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
      background: #ffffff;
    }
    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #ui > * { pointer-events: auto; }
    body.idle { cursor: none; }

    .notes {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 18px max(24px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
      background: var(--panel);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 32px;
      align-items: start;
    }
    .notes p {
      margin: 0;
      max-width: 72ch;
      font-size: 18px;
      line-height: 1.55;
      white-space: pre-line;
      color: var(--text);
    }
    .notes .meta {
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
      font-size: 14px;
    }

    .over {
      position: absolute;
      inset: 0;
      background: rgba(10, 12, 17, 0.96);
      backdrop-filter: blur(14px);
      overflow: auto;
      padding: 40px max(40px, env(safe-area-inset-right, 0px)) 40px max(40px, env(safe-area-inset-left, 0px));
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
      gap: 22px;
      align-content: start;
    }
    .over button {
      all: unset;
      cursor: pointer;
      display: grid;
      gap: 8px;
    }
    .over .th {
      aspect-ratio: 16 / 9;
      background: #1b1f2a center / cover no-repeat;
      border-radius: 4px;
      overflow: hidden;
      outline: 2px solid rgba(255, 255, 255, 0.08);
      outline-offset: 3px;
      transition: outline-color 0.18s ease, transform 0.18s ease;
    }
    .over button:hover .th,
    .over button:focus-visible .th,
    .over button[aria-current="true"] .th {
      outline-color: var(--sel);
    }
    .over button:hover .th {
      transform: translateY(-2px);
    }
    .over .th-fallback {
      width: 100%;
      height: 100%;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .over .th-fallback small {
      font-size: 11px;
      opacity: 0.7;
      letter-spacing: 0.04em;
    }
    .over .th-fallback strong {
      font-size: 16px;
      font-weight: 600;
    }
    .over span {
      color: var(--dim);
      font-size: 14px;
    }

    .help {
      position: absolute;
      right: 24px;
      bottom: 24px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 18px 22px;
      display: grid;
      grid-template-columns: auto auto;
      gap: 6px 22px;
      max-width: calc(100vw - 48px);
      font-size: 14px;
    }
    .help b { font-weight: 500; color: var(--text); }
    .help span { color: var(--dim); }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
      color: var(--text);
      transition: opacity 0.4s ease;
    }

    .load {
      position: absolute;
      inset: 0;
      background: #ffffff;
      color: #404040;
      display: grid;
      place-content: center;
      gap: 14px;
      font: 17px "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
    }
    .load p { margin: 0; text-align: center; letter-spacing: 0.02em; }
    .load div {
      width: min(320px, 70vw);
      height: 10px;
      border: 1px solid #b5bcc8;
      background: #eef1f5;
      border-radius: 2px;
      overflow: hidden;
    }
    .load i {
      display: block;
      height: 100%;
      width: 0;
      background: #2b5cff;
      transition: width 0.12s linear;
    }
  </style>
</head>
<body>
  <canvas id="stage" tabindex="0" aria-label="最后半个像素 演示文稿"></canvas>
  <div id="ui"></div>
  /*INLINE_BUNDLE*/
</body>
</html>
