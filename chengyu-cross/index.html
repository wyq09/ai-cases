<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3c0d55">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d1157'/%3E%3Crect x='14' y='14' width='36' height='36' rx='8' fill='%23f2e7cf'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='%23453526' font-family='serif' font-weight='bold'%3E成%3C/text%3E%3C/svg%3E">
<title>填成语 · 十字填字</title>
<style>
:root{
  --bg1:#3c0d55; --bg2:#6d1157; --bg3:#a3165f;
  --cream:#f2e7cf; --cream-dim:rgba(242,231,207,.82);
  --cream-edge:#d9c8a6; --ink:#453526;
  --green:#2fa75e; --green-edge:#1f7d43;
  --empty-a:rgba(226,166,244,.26); --empty-b:rgba(178,108,204,.22);
  --accent:#ffb43a; --gold:#ffd94a;
  --bar:#e9dcb4; --bar-dim:rgba(196,160,183,.45);
  --font-cn:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","SimSun",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:#24052e;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
#app{height:100dvh;display:flex;justify-content:center;}
#stage{
  position:relative;width:100%;max-width:480px;height:100%;
  display:flex;flex-direction:column;
  background:linear-gradient(178deg,var(--bg1) 0%,var(--bg2) 46%,var(--bg3) 100%);
  overflow:hidden;
}
@media (min-width:520px){
  #stage{box-shadow:0 0 60px rgba(0,0,0,.55);}
}

/* ---------- 顶栏 ---------- */
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 12px) 12px 6px;
}
.tb-btn{
  width:44px;height:40px;border:0;border-radius:10px;
  background:rgba(28,5,44,.5);color:var(--cream);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.tb-btn:active{background:rgba(28,5,44,.75);}
#title{
  font-family:var(--font-cn);font-size:23px;letter-spacing:6px;text-indent:6px;
  color:var(--cream);font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.3);
}
#tb-right{display:flex;align-items:center;gap:8px;}
#coin-chip{
  display:flex;align-items:center;gap:5px;
  background:rgba(28,5,44,.5);border-radius:20px;padding:5px 11px 5px 7px;
  color:var(--gold);font-weight:700;font-size:15px;
}
#coin-chip svg{width:16px;height:16px;}
#menu-dots{letter-spacing:2px;font-weight:700;}

/* ---------- 统计行 ---------- */
#statbar{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;
  padding:8px 14px 2px;
}
#statbar .lbl{font-size:14px;color:var(--cream-dim);margin-bottom:2px;}
#stat-words{font-size:34px;font-weight:800;color:#fff;line-height:1;}
.stat-right{text-align:right;}
.att{line-height:1;}
#stat-attempts{font-size:42px;font-weight:800;color:var(--gold);}
.att i{font-style:normal;font-size:15px;color:var(--cream-dim);margin-left:2px;}

/* ---------- 里程碑链 ---------- */
#chain{display:flex;align-items:flex-start;justify-content:center;padding:0 2px;min-width:0;}
.chain-node{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;}
.chain-label{font-size:11px;color:var(--cream-dim);margin-bottom:4px;white-space:nowrap;}
.badge{position:relative;width:clamp(44px,12.5vw,56px);height:clamp(44px,12.5vw,56px);}
.badge svg{width:100%;height:100%;display:block;}
.badge path{fill:#f6d87e;}
.badge-in{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1.05;
}
.badge .zg{font-size:9px;color:#b06a3a;transform:translateY(1px);}
.badge .amt{font-size:clamp(12px,3.4vw,15px);font-weight:800;color:#d5482f;}
.chain-node.done .badge{filter:drop-shadow(0 0 10px rgba(250,220,130,.85));}
.chain-node.next .badge{animation:bpulse 2.4s ease-in-out infinite alternate;}
.chain-node.lock .badge path{fill:#cfc0c4;}
.chain-node.lock .zg{color:#a5969c;}
.chain-node.lock .amt{color:#c26a5c;}
.chain-bar{
  flex:1 1 12px;height:9px;border-radius:5px;margin-top:calc(clamp(44px,12.5vw,56px)*.45);
  min-width:10px;max-width:56px;background:var(--bar-dim);
}
.chain-bar.lit{background:var(--bar);}
@keyframes bpulse{
  from{filter:drop-shadow(0 0 3px rgba(250,220,130,.35));}
  to{filter:drop-shadow(0 0 11px rgba(250,220,130,.8));}
}

/* ---------- 关卡横幅 ---------- */
#banner{
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:12px 0 6px;
}
#banner-text{
  font-family:var(--font-cn);font-size:23px;letter-spacing:3px;
  color:#ecd5a8;font-weight:700;
}
.orn{position:relative;width:min(96px,20vw);height:1px;flex:0 0 auto;}
.orn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(202,160,106,.9));}
.orn::after{
  content:'';position:absolute;top:-3.5px;width:7px;height:7px;
  border:1px solid rgba(202,160,106,.9);transform:rotate(45deg);
}
.orn.l::after{right:0;}
.orn.r{transform:scaleX(-1);}

/* ---------- 棋盘区（棋盘+候选字） ---------- */
#main-row{flex:1;min-height:0;display:flex;flex-direction:column;}
#board{flex:1;min-height:0;position:relative;}
#grid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
.cell{
  position:absolute;width:var(--cell);height:var(--cell);
  border-radius:18%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-cn);font-weight:700;font-size:calc(var(--cell)*.56);
  user-select:none;
}
.cell.given{
  background:linear-gradient(180deg,#f7eed9,#efe2c5);color:var(--ink);
  box-shadow:inset 0 -3px 0 rgba(160,138,96,.5),0 1px 3px rgba(0,0,0,.28);
}
.cell.filled{
  background:linear-gradient(180deg,#38b164,#2c9c55);color:#fff;
  box-shadow:inset 0 -3px 0 var(--green-edge),0 1px 3px rgba(0,0,0,.28);
}
.cell.empty{
  background:linear-gradient(180deg,rgba(214,160,235,.17),rgba(172,102,198,.13));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.045),inset 0 -2px 0 rgba(255,255,255,.04);
}
.cell.sel{
  outline:3px solid var(--accent);outline-offset:1px;
  box-shadow:0 0 16px rgba(255,180,58,.55);
}
.cell.pop{animation:pop .32s ease-out;}
@keyframes pop{0%{transform:scale(.55);}70%{transform:scale(1.07);}100%{transform:scale(1);}}
.cell.wrong{animation:shake .38s ease-in-out;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-5px);}40%{transform:translateX(5px);}
  60%{transform:translateX(-4px);}80%{transform:translateX(3px);}
}
.cell.wdone{animation:wdone .6s ease-out;}
@keyframes wdone{0%{filter:brightness(1.75);}100%{filter:brightness(1);}}

/* ---------- 候选字 ---------- */
#rack{
  border-top:1px solid rgba(255,255,255,.16);
  margin:2px 14px 0;
  padding:16px 2px calc(env(safe-area-inset-bottom) + 16px);
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:12px;min-height:132px;
}
.tile{
  width:min(64px,15.5vw);aspect-ratio:1;border:0;border-radius:14px;
  background:linear-gradient(180deg,#f7eed9,#efe2c5);color:var(--ink);
  font-family:var(--font-cn);font-weight:700;font-size:min(34px,8.2vw);
  box-shadow:inset 0 -3px 0 rgba(160,138,96,.5),0 2px 4px rgba(0,0,0,.3);
  transition:opacity .28s,transform .28s;
}
.tile:active{transform:scale(.93)!important;}
.tile.gone{opacity:0;transform:scale(.5)!important;pointer-events:none;}
.tile.wrong{animation:shake .38s ease-in-out;}

/* ---------- 菜单 ---------- */
#menu-pop{
  position:absolute;top:calc(env(safe-area-inset-top) + 58px);right:12px;
  background:#360f3f;border:1px solid rgba(255,255,255,.14);border-radius:12px;
  padding:6px;min-width:158px;display:none;z-index:30;
  box-shadow:0 10px 26px rgba(0,0,0,.45);
}
#menu-pop.on{display:block;}
.mi{
  display:block;width:100%;text-align:left;padding:11px 14px;
  color:var(--cream);background:none;border:0;font-size:15px;border-radius:8px;
}
.mi:active{background:rgba(255,255,255,.09);}

/* ---------- 弹窗 ---------- */
#modal-root .mask{
  position:fixed;inset:0;background:rgba(14,2,21,.66);
  display:flex;align-items:center;justify-content:center;z-index:45;
  animation:fadein .18s ease-out;
}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.modal{
  width:min(360px,88vw);max-height:82dvh;overflow:auto;
  background:linear-gradient(180deg,#4e1354,#42104a);
  border:1px solid rgba(255,255,255,.14);border-radius:16px;
  padding:22px 18px 16px;color:var(--cream);text-align:center;
  box-shadow:0 16px 44px rgba(0,0,0,.5);
}
.modal.wide{width:min(500px,94vw);text-align:left;}
.modal h3{font-family:var(--font-cn);font-size:22px;letter-spacing:4px;margin-bottom:8px;}
.win-sub{font-size:14px;color:var(--cream-dim);margin-bottom:12px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px;}
.chip{
  font-family:var(--font-cn);font-size:15px;letter-spacing:2px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  border-radius:8px;padding:5px 10px;
}
.btns{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
.btn{
  border:0;border-radius:11px;padding:12px;font-size:16px;font-weight:600;
  background:rgba(255,255,255,.1);color:var(--cream);
}
.btn.primary{background:linear-gradient(180deg,#f9e096,#f2c95c);color:#5a2f16;box-shadow:inset 0 -2px 0 rgba(140,90,20,.35);}
.btn.primary:disabled{opacity:.45;}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.22);}
.num-in{
  width:100%;margin-top:4px;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.28);color:var(--cream);font-size:18px;text-align:center;
}

/* ---------- 导入分析 ---------- */
.imp-tip{font-size:13px;color:var(--cream-dim);line-height:1.6;margin-bottom:10px;}
#imp-text{
  width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.28);color:var(--cream);font-size:15px;line-height:1.7;resize:vertical;
  font-family:var(--font-cn);
}
.imp-ops{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
.imp-ops .btn{padding:9px 13px;font-size:14px;border-radius:9px;}
#imp-report{margin-top:6px;}
.imp-loading{padding:14px;text-align:center;color:var(--cream-dim);font-size:14px;}
.imp-sec{font-size:13.5px;line-height:1.7;padding:7px 2px;color:var(--cream-dim);}
.imp-sec b{color:var(--cream);}
.imp-sec.good{color:#9fe0b4;}
.imp-sec.warn{color:#f3c98a;}
.imp-sec.bad{color:#f09c8c;}
.imp-sec.verdict.full{color:#9fe0b4;font-weight:700;}
.imp-sec.verdict.partial{color:#f3c98a;font-weight:700;}
.imp-sec.verdict.none{color:#f09c8c;font-weight:700;}
.pv-wrap{display:flex;justify-content:center;padding:10px 0 4px;}
.pv-grid{display:grid;gap:2px;}
.pv-cell{
  display:flex;align-items:center;justify-content:center;
  width:100%;aspect-ratio:1;border-radius:4px;
  background:#efe2c5;color:var(--ink);
  font-family:var(--font-cn);font-weight:700;font-size:13px;
}

/* ---------- Toast / 抽屉 ---------- */
#toast{
  position:fixed;left:50%;bottom:24dvh;transform:translateX(-50%) translateY(8px);
  background:rgba(18,3,27,.88);color:var(--cream);
  padding:10px 18px;border-radius:22px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:60;
  max-width:86vw;text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
#drawer{z-index:40;}
body.reduced *{animation:none!important;transition:none!important;}

/* ---------- 横屏矮视口：棋盘居左、候选字居右列 ---------- */
@media (orientation:landscape) and (max-height:520px){
  #topbar{padding-top:calc(env(safe-area-inset-top) + 6px);}
  .tb-btn{width:38px;height:34px;}
  #title{font-size:19px;}
  #statbar{padding:4px 14px 0;}
  #stat-words{font-size:24px;}
  #stat-attempts{font-size:30px;}
  .chain-label{font-size:10px;margin-bottom:2px;}
  .badge{width:40px;height:40px;}
  .badge .amt{font-size:11px;}
  .badge .zg{font-size:8px;}
  .chain-bar{margin-top:16px;height:7px;}
  #banner{padding:6px 0 2px;}
  #banner-text{font-size:18px;}
  .orn{width:60px;}
  #main-row{flex-direction:row;align-items:stretch;}
  #rack{
    flex:0 0 auto;width:min(26vw,200px);border-top:0;
    border-left:1px solid rgba(255,255,255,.16);margin:0;
    padding:12px 10px calc(env(safe-area-inset-bottom) + 12px);
    flex-flow:column wrap;align-content:flex-start;gap:9px;min-height:0;
  }
  .tile{width:46px;font-size:24px;border-radius:10px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <header id="topbar">
      <button class="tb-btn" id="btn-back" aria-label="重新开始">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
      </button>
      <div id="title">填成语</div>
      <div id="tb-right">
        <div id="coin-chip" title="金币">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f2c95c"/><circle cx="12" cy="12" r="7" fill="none" stroke="#c98f2e" stroke-width="1.6"/><path d="M12 8v8M9.5 9.8h5M9.5 14.2h5" stroke="#8a5a1c" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span id="coin-num">0</span>
        </div>
        <button class="tb-btn" id="btn-menu" aria-label="菜单"><span id="menu-dots">•••</span></button>
      </div>
    </header>
    <section id="statbar">
      <div class="stat-left"><div class="lbl">成语</div><div id="stat-words">0</div></div>
      <div id="chain"></div>
      <div class="stat-right"><div class="lbl">剩余次数</div><div class="att"><span id="stat-attempts">5</span><i>次</i></div></div>
    </section>
    <div id="banner"><i class="orn l"></i><span id="banner-text">第一关</span><i class="orn r"></i></div>
    <main id="main-row">
      <div id="board"><div id="grid"></div></div>
      <footer id="rack"></footer>
    </main>
    <div id="menu-pop">
      <button class="mi" id="menu-hint">提示（花金币填一格）</button>
      <button class="mi" id="menu-restart">重新开始本关</button>
      <button class="mi" id="menu-jump">跳关</button>
      <button class="mi" id="menu-import">自定义词库导入</button>
      <button class="mi" id="menu-cfg">设置</button>
    </div>
  </div>
  <aside id="drawer"></aside>
  <div id="modal-root"></div>
  <div id="toast"></div>
</div>
<script>
(function(){
  window.__errs=[];
  window.addEventListener('error',function(e){window.__errs.push(String(e.message||e));});
  window.addEventListener('unhandledrejection',function(e){window.__errs.push('rej:'+(e.reason&&e.reason.message||e.reason));});
})();
</script>
<script>
/* ==== config.js ==== */
/* 填成语 — 配置与存档（?key 必须在本模块最先处理，先于任何 localStorage 读取） */
(function () {
  'use strict';
  var KEYS = { cfg: 'cy_cfg_v2', state: 'cy_state_v2', custom: 'cy_custom_v2' };
  try {
    if (typeof location !== 'undefined' && location.search.indexOf('reset=1') >= 0) {
      Object.keys(KEYS).forEach(function (k) { localStorage.removeItem(KEYS[k]); });
      if (history && history.replaceState) {
        history.replaceState(null, '', location.pathname + location.hash);
      }
    }
  } catch (e) { /* 隐私模式等 */ }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function isObj(o) { return o && typeof o === 'object' && !Array.isArray(o); }
  function deepMerge(base, extra) {
    var out = clone(base);
    if (!isObj(extra)) return out;
    Object.keys(extra).forEach(function (k) {
      if (isObj(extra[k]) && isObj(out[k])) out[k] = deepMerge(out[k], extra[k]);
      else if (extra[k] !== undefined) out[k] = clone(extra[k]);
    });
    return out;
  }
  function deepEqual(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function clamp(v, lo, hi, dft) {
    v = Number(v);
    if (!isFinite(v)) return dft;
    return Math.min(hi, Math.max(lo, v));
  }

  var DEFAULTS = {
    level: { startWords: 4, growthEvery: 2, maxWords: 14, givenRatio: 0.30, givenDecay: 0.008, attempts: 5, maxSpan: 9 },
    rewards: { milestones: [1, 3, 14], amounts: [120, 120, 240], completeCoins: 0 },
    props: { hintCost: 80, reviveCost: 150, reviveAttempts: 3 },
    audio: { master: 0.9, sfx: 0.8, bgm: 0.25, muted: false },
    motion: { reduced: false },
    bank: { source: 'builtin' }
  };

  /* 校验+钳制：非法数组整体回退默认；数值钳制进合法区间 */
  function sanitize(raw) {
    var c = deepMerge(DEFAULTS, raw);
    c.level.startWords = Math.round(clamp(c.level.startWords, 3, 8, 4));
    c.level.growthEvery = Math.round(clamp(c.level.growthEvery, 1, 5, 2));
    c.level.maxWords = Math.round(clamp(c.level.maxWords, 4, 16, 14));
    if (c.level.maxWords < c.level.startWords) c.level.maxWords = c.level.startWords;
    c.level.givenRatio = clamp(c.level.givenRatio, 0, 0.6, 0.3);
    c.level.givenDecay = clamp(c.level.givenDecay, 0, 0.03, 0.008);
    c.level.attempts = Math.round(clamp(c.level.attempts, 1, 20, 5));
    c.level.maxSpan = Math.round(clamp(c.level.maxSpan, 6, 12, 9));
    c.rewards.completeCoins = Math.round(clamp(c.rewards.completeCoins, 0, 999, 0));
    c.props.hintCost = Math.round(clamp(c.props.hintCost, 0, 9999, 80));
    c.props.reviveCost = Math.round(clamp(c.props.reviveCost, 0, 9999, 150));
    c.props.reviveAttempts = Math.round(clamp(c.props.reviveAttempts, 1, 20, 3));
    ['master', 'sfx', 'bgm'].forEach(function (k) {
      c.audio[k] = clamp(c.audio[k], 0, 1, DEFAULTS.audio[k]);
    });
    c.audio.muted = !!c.audio.muted;
    c.motion.reduced = !!c.motion.reduced;
    function fixList(arr, dft) {
      if (!Array.isArray(arr) || !arr.length) return dft;
      var out = [];
      for (var i = 0; i < arr.length; i++) {
        var v = Number(arr[i]);
        if (!isFinite(v) || v <= 0) return dft;
        out.push(Math.round(v));
      }
      for (var j = 1; j < out.length; j++) if (out[j] <= out[j - 1]) return dft;
      if (out[out.length - 1] > 999) return dft;
      return out;
    }
    var ms = fixList(c.rewards.milestones, DEFAULTS.rewards.milestones);
    var am = fixList(c.rewards.amounts, DEFAULTS.rewards.amounts);
    if (ms.length !== am.length) { ms = DEFAULTS.rewards.milestones; am = DEFAULTS.rewards.amounts; }
    am = am.map(function (v) { return Math.round(clamp(v, 0, 9999, 0)); });
    c.rewards.milestones = ms; c.rewards.amounts = am;
    if (typeof c.bank.source !== 'string' || !c.bank.source) c.bank.source = 'builtin';
    return c;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEYS.cfg);
      return raw ? sanitize(JSON.parse(raw)) : clone(DEFAULTS);
    } catch (e) { return clone(DEFAULTS); }
  }

  var listeners = [];
  var cfg = load();
  var root = typeof window !== 'undefined' ? window : globalThis;
  root.CY = root.CY || {};

  function save() {
    try { localStorage.setItem(KEYS.cfg, JSON.stringify(cfg)); } catch (e) { }
  }
  function notify() {
    var snapshot = clone(cfg);
    listeners.forEach(function (cb) {
      try { cb(snapshot); } catch (e) { console.error(e); }
    });
  }

    KEYS: KEYS,
    defaults: function () { return clone(DEFAULTS); },
    get: function () { return clone(cfg); },
    set: function (patch) {
      var next = sanitize(deepMerge(cfg, patch));
      var changed = !deepEqual(next, cfg);
      cfg = next;
      if (changed) { save(); notify(); }
      return clone(cfg);
    },
    onChange: function (cb) {
      listeners.push(cb);
      return function () {
        var i = listeners.indexOf(cb);
        if (i >= 0) listeners.splice(i, 1);

    export: function () {
      var st = null, cu = [];
      try { st = JSON.parse(localStorage.getItem(KEYS.state) || 'null'); } catch (e) { }
      try { cu = JSON.parse(localStorage.getItem(KEYS.custom) || '[]'); } catch (e) { }
      return JSON.stringify({ v: 2, cfg: cfg, state: st, custom: cu });
    },
    importJson: function (str) {
      try {
        var data = JSON.parse(str);
        if (!isObj(data)) return false;
        if (isObj(data.cfg)) { cfg = sanitize(deepMerge(DEFAULTS, data.cfg)); save(); }

          if (isObj(data.state)) localStorage.setItem(KEYS.state, JSON.stringify(data.state));
          if (Array.isArray(data.custom)) localStorage.setItem(KEYS.custom, JSON.stringify(data.custom));
        } catch (e) { }
        notify();
        return true;
      } catch (e) { return false; }
    },
    resetAll: function () {
      Object.keys(KEYS).forEach(function (k) {
        try { localStorage.removeItem(KEYS[k]); } catch (e) { }
      });
      if (typeof location !== 'undefined') location.reload();
    }
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.CY.config;
})();

  var freq = Object.create(null);
  var order = [];
  for (var m = 0; m < list.length; m++) {

      if (!freq[ch]) { freq[ch] = 0; order.push(ch); }

      .slice(0, Math.max(220, COMMON_CHARS.length));
  }

// 填成语 · 音效模块（代理B）
// 全 WebAudio 程序化合成，零外部文件。中国风柔和拨弦（古筝/琵琶质感）+ 木鱼短点。
// 接口（契约 §2）：
//   CY.audio = { init, unlock, play(name), setVol({master,sfx,bgm}),
//                applyOverrides(map), startBgm(), stopBgm(), _lastPlayed }
// node 环境（无 window/AudioContext）加载与调用均安全降级，不抛错。
(function (root) {
  'use strict';

  // ---------- 状态 ----------
  var S = {
    ctx: null,          // AudioContext（懒建）
    master: null,       // 主通道增益
    sfx: null,          // 音效通道增益
    bgm: null,          // 背景音乐通道增益
    vol: { master: 0.9, sfx: 0.8, bgm: 0.25 }, // 与契约 config.audio 默认一致
    muted: false,
    bgmOn: false,       // 主线 startBgm() 后为 true，stopBgm()/静音时暂停
    hidden: false,
    bgmTimer: null,
    visInstalled: false
  };

  // 五声音阶（宫商角徵羽 = C D E G A）常用音高
  var NOTE = {
    C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.00, A4: 440.00,
    C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.00,
    C6: 1046.50, D6: 1174.66, E6: 1318.51, G6: 1567.98, A6: 1760.00
  };
  var BGM_POOL = [NOTE.C4, NOTE.D4, NOTE.E4, NOTE.G4, NOTE.A4, NOTE.C5, NOTE.D5, NOTE.E5];

  // ---------- 工具 ----------
  function getAC() {
    if (typeof window === 'undefined') return null;
    return window.AudioContext || window.webkitAudioContext || null;
  }
  function clamp01(v) {
    v = Number(v);
    if (isNaN(v)) return 0;
    return Math.min(1, Math.max(0, v));
  }

  function applyGains(smooth) {
    if (!S.ctx) return;
    var t = S.ctx.currentTime;
    try {
      if (smooth && S.master.gain.setTargetAtTime) {
        S.master.gain.setTargetAtTime(S.muted ? 0 : S.vol.master, t, 0.02);
        S.sfx.gain.setTargetAtTime(S.vol.sfx, t, 0.02);
        S.bgm.gain.setTargetAtTime(S.vol.bgm, t, 0.02);
      } else {
        S.master.gain.value = S.muted ? 0 : S.vol.master;
        S.sfx.gain.value = S.vol.sfx;
        S.bgm.gain.value = S.vol.bgm;
      }
    } catch (err) { /* 降级 */ }
  }

  // ---------- 合成基元 ----------

  // 拨弦（古筝/琵琶质感）：多泛音正弦 + 低通扫频 + 指甲瞬态噪声
  function pluck(dest, freq, t0, dur, peak, bendCents, withAttack) {
    var e = S.ctx;
    if (!e || !dest) return;
    var g = e.createGain();
    var lp = e.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = 0.6;
    var fStart = Math.min(freq * 9, 8500);
    var fEnd = Math.max(Math.min(freq * 2.2, 4200), 80);
    lp.frequency.setValueAtTime(fStart, t0);
    lp.frequency.exponentialRampToValueAtTime(fEnd, t0 + dur * 0.85);

    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.007);
    g.gain.exponentialRampToValueAtTime(0.0006, t0 + dur);

    g.connect(lp);
    lp.connect(dest);

    var PARTIALS = [[1, 1.0], [2, 0.40], [3, 0.15], [4.02, 0.06]];
    for (var i = 0; i < PARTIALS.length; i++) {
      var mult = PARTIALS[i][0], amt = PARTIALS[i][1];
      var o = e.createOscillator();
      o.type = 'sine';
      var f = freq * mult;
      o.frequency.setValueAtTime(f, t0);
      if (bendCents) { // 负值 = 轻微下滑（叹气感）
        o.frequency.exponentialRampToValueAtTime(f * Math.pow(2, bendCents / 1200), t0 + dur);
      }
      var og = e.createGain();
      og.gain.value = amt;
      o.connect(og);
      og.connect(g);
      o.start(t0);
      o.stop(t0 + dur + 0.06);
    }
    if (withAttack) {
      attackNoise(dest, Math.min(freq * 3.2, 6500), t0, Math.min(peak * 0.22, 0.12));
    }
  }

  // 拨弦起振的指甲瞬态（极短带通噪声）
  function attackNoise(dest, freq, t0, amt) {
    var e = S.ctx;
    if (!e || !dest || amt <= 0) return;
    var n = Math.max(64, Math.floor(e.sampleRate * 0.018));
    var buf = e.createBuffer(1, n, e.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = e.createBufferSource();
    src.buffer = buf;
    var bp = e.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = freq;
    bp.Q.value = 1.1;
    var g = e.createGain();
    g.gain.setValueAtTime(amt, t0);
    g.gain.exponentialRampToValueAtTime(0.0005, t0 + 0.025);
    src.connect(bp);
    bp.connect(g);
    g.connect(dest);
    src.start(t0);
  }

  // 柔和噪声洗（用于 wrong 的轻微噪声层）
  function noiseWash(dest, freq, t0, dur, amt) {
    var e = S.ctx;
    if (!e || !dest || amt <= 0) return;
    var n = Math.max(64, Math.floor(e.sampleRate * dur));
    var buf = e.createBuffer(1, n, e.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) {
      var k = 1 - i / n;
      d[i] = (Math.random() * 2 - 1) * k * k;
    }
    var src = e.createBufferSource();
    src.buffer = buf;
    var lp = e.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = freq;
    var g = e.createGain();
    g.gain.setValueAtTime(amt, t0);
    g.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
    src.connect(lp);
    lp.connect(g);
    g.connect(dest);
    src.start(t0);
  }

  // 铃（加分音列的高频泛音，清而不刺）
  function bellTone(dest, freq, t0, dur, peak) {
    var e = S.ctx;
    if (!e || !dest) return;
    var g = e.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
    g.connect(dest);
    var PARTS = [[1, 1.0], [2.756, 0.32], [5.404, 0.10], [8.933, 0.04]];
    for (var i = 0; i < PARTS.length; i++) {
      var o = e.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * PARTS[i][0], t0);
      var og = e.createGain();
      og.gain.value = PARTS[i][1];
      o.connect(og);
      og.connect(g);
      o.start(t0);
      o.stop(t0 + dur + 0.06);
    }
  }

  // ---------- 具体音效 ----------

  // tap：木鱼式极短轻点（约 50ms，柔和）
  function sTap(t0) {
    var dest = S.sfx;
    var o = S.ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(1150, t0);
    o.frequency.exponentialRampToValueAtTime(780, t0 + 0.04);
    var g = S.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.30, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.05);
    o.connect(g);
    g.connect(dest);
    o.start(t0);
    o.stop(t0 + 0.09);
    attackNoise(dest, 2600, t0, 0.05);
  }

  // wrong：低频闷响 + 轻微噪声（约 150ms，不刺耳）
  function sWrong(t0) {
    var dest = S.sfx;
    var o = S.ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(165, t0);
    o.frequency.exponentialRampToValueAtTime(105, t0 + 0.13);
    var lp = S.ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 380;
    lp.Q.value = 0.5;
    var g = S.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.50, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.15);
    o.connect(lp);
    lp.connect(g);

        for (var i = 1; i < cell.words.length; i++) {

      for (var i = 1; i < pz.words.length; i++) {

  /* ---------- 自定义词库可行性分析 ---------- */
  /* 返回 {parsed, valid, invalid, duplicates, isolated, placement{placed,unplaced,ms,iters}, verdict, adopt} */
  function analyzeImport(text, opt) {
    opt = opt || {};
    var maxMs = opt.maxMs || 1500, maxIters = opt.maxIters || 250000;
    var tries = opt.tries || 12, maxSpan = opt.maxSpan || 9;
    var t0 = Date.now();
    var tokens = String(text || '')
      .split(/[\s,，、;；:：!！?？.。·•\-—_|]+/)
      .map(function (s) { return s.trim(); })
      .filter(Boolean);
    var valid = [], invalid = [], duplicates = [];
    var seen = {};
    tokens.forEach(function (tk) {
      var w = tk.replace(/^[「『【(''“‘<《]+|[」』】)''”’>》]+$/g, '');
      if (!w) return;
      if (!/^[\u4e00-\u9fff]+$/.test(w)) { invalid.push({ w: tk, reason: '含非汉字字符' }); return; }
      if (w.length !== 4) { invalid.push({ w: w, reason: '不是四个字' }); return; }
      if (seen[w]) { duplicates.push(w); return; }
      seen[w] = 1; valid.push(w);
    });
    /* 共字并查集 → 孤立词识别 */
    var parent = valid.map(function (_, i) { return i; });
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function union(a, b) { a = find(a); b = find(b); if (a !== b) parent[a] = b; }
    var charNode = new Map();
    valid.forEach(function (w, i) {
      for (var p = 0; p < w.length; p++) {
        var ch = w[p];
        var n = charNode.get(ch);
        if (n === undefined) { n = valid.length + charNode.size; charNode.set(ch, n); parent[n] = n; }
        union(i, n);
      }
    });
    var compSize = {};
    valid.forEach(function (_, i) {
      var rt = find(i);
      compSize[rt] = (compSize[rt] || 0) + 1;
    });
    var isolated = [], pool = [];
    valid.forEach(function (w, i) {
      if (compSize[find(i)] === 1) isolated.push(w); else pool.push(w);
    });
    /* 摆放求解：多种子贪心，保留最大可行子集。
       跨度自适应：池子大时自动放大网格（9×9 只容得下 ~20 词），否则"全部连起来"无从谈起 */
    var span = opt.maxSpan || 9;
    if (pool.length > 10) {
      span = Math.min(20, Math.max(span, Math.ceil(Math.sqrt(pool.length * 3.2)) + 2));
    }
    var best = null, iters = 0;
    if (pool.length) {
      for (var s = 0; s < tries; s++) {
        if (iters > maxIters || Date.now() - t0 > maxMs) break;
        var rng = rng32(fnv1a(text) ^ Math.imul(s + 1, 0x85EBCA6B));
        var shuffled = pool.slice();
        shuffle(shuffled, rng);
        var res = generateCore(rng, shuffled, pool.length, span, function (it) {
          iters = it;
          return it <= maxIters && Date.now() - t0 <= maxMs;
        });
        if (!best || res.words.length > best.words.length) best = res;
        if (best.words.length >= pool.length) break;
      }
    }
    var placed = best ? best.words : [];
    var placedSet = {};
    placed.forEach(function (x) { placedSet[x.w] = 1; });
    var unplaced = pool.filter(function (w) { return !placedSet[w]; })
      .map(function (w) { return { w: w, reason: '与已摆成语字位冲突，暂无法连入' }; });
    var verdict;
    if (valid.length === 0 || placed.length < 2) verdict = 'none';
    else if (placed.length === valid.length && isolated.length === 0 &&
             invalid.length === 0 && duplicates.length === 0) verdict = 'full';
    else verdict = 'partial';
    return {
      parsed: tokens.length,
      valid: valid,
      invalid: invalid,
      duplicates: duplicates,
      isolated: isolated,
      placement: {
        placed: placed,
        unplaced: unplaced,
        ms: Date.now() - t0,
        iters: iters
      },
      verdict: verdict,
      adopt: placed.map(function (x) { return x.w; })
    };
  }

  /* ---------- 里程碑 ---------- */
  /* total 累计填对数；从 idx 起推进，返回 {idx, gains:[{target,amount}]} */
  function advanceMilestones(total, milestones, amounts, idx) {
    var gains = [];
    while (idx < milestones.length && total >= milestones[idx]) {

    return { idx: idx, gains: gains };

  /* ---------- 玩法逻辑 ---------- */
  function wordCells(wi) {

  /* ---------- 词库导入与可行性分析 ---------- */
  var SAMPLE_IMPORT = '光彩夺目 举目千里 千家万户 万事大吉 大功告成 七步成章\n光明磊落 落落大方 大快人心 心想事成 成千上万 万紫千红';

  /* 换摆法：加盐重跑，结果确定性可复现 */

    placedWords.forEach(function (x) {
      for (var i = 0; i < 4; i++) {
        var k = (x.r + (x.dir === 'V' ? i : 0)) + ',' + (x.c + (x.dir === 'H' ? i : 0));
        map[k] = x.w[i];
      }
    });
    var rows = maxR - minR + 1, cols = maxC - minC + 1;
    var size = rows > 8 || cols > 8 ? 18 : 24;
    var html = '<div class="pv-grid" style="grid-template-columns:repeat(' + cols + ',' + size + 'px);">';
    for (var r = minR; r <= maxR; r++) {
      for (var c = minC; c <= maxC; c++) {
        var ch = map[r + ',' + c];
        html += ch ? '<span class="pv-cell">' + ch + '</span>' : '<span class="pv-blank"></span>';
      }
    }
    return html + '</div>';
  }
  function adoptAnalysis(r, text, andPlay) {
    if (!r.valid.length) { toast('没有有效成语可保存'); return; }
    var pkg = {
      id: 'c' + Date.now().toString(36),
      name: (r.valid[0] || '') + '等' + r.valid.length + '条',
      text: text,
      adopt: r.adopt,
      createdAt: Date.now()
    };
    CustomStore.save(pkg);
    if (andPlay && r.adopt.length >= 2) {
      window.CY.config.set({ bank: { source: 'custom:' + pkg.id } });
      toast('已切换自定义词库（' + r.adopt.length + ' 条可行）');
    } else {
      toast('词库已保存，可在设置→数据中启用');
    }
    closeModal();
  }

  /* ---------- 配置联动 ---------- */
  window.CY.config.onChange(function (c) {
    var old = cfg;
    cfg = c;
    try {
      if (root.CY.audio) {
        CY.audio.setVol(c.audio);
        CY.audio.applyOverrides({ muted: !!c.audio.muted });
      }
    } catch (e) { }
    document.body.classList.toggle('reduced', !!c.motion.reduced);
    if (!state.puzzle) return;
    if (old.bank.source !== c.bank.source) {
      ensurePuzzle(true); render(); return;
    }
    if (old.level.attempts !== c.level.attempts) {
      state.progress.attempts = c.level.attempts;
      saveState();
    }
    /* 里程碑配置变化 → 从累计数重推进度（不补发金币） */
    state.milestoneIdx = L.advanceMilestones(state.totalFilled, c.rewards.milestones, c.rewards.amounts, 0).idx;
    render();
  });

  /* ---------- 事件绑定与启动 ---------- */
  function bind() {
    $('grid').addEventListener('click', function (e) {
      var el = e.target.closest('.cell');
      if (!el) return;
      var k = el.dataset.key;
      var cell = state.puzzle.cells[k];
      if (cell.given || state.progress.fills[k]) return;
      sfx('tap');
      selWord = pickWordFor(k);
      selectKey(k);
    });
    $('rack').addEventListener('click', function (e) {
      var el = e.target.closest('.tile');
      if (!el || el.classList.contains('gone')) return;
      tapTile(+el.dataset.idx);
    });
    $('btn-menu').addEventListener('click', function (e) {
      e.stopPropagation();
      sfx('tap');
      var m = $('menu-pop');
      m.classList.contains('on') ? closeMenu() : openMenu();
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('#menu-pop') && !e.target.closest('#btn-menu')) closeMenu();
    });
    $('btn-back').addEventListener('click', function () {
      showModal('<h3>重新开始本关？</h3><div class="win-sub">当前进度将清空（成语总数与金币保留）</div>',
        [{ label: '重开本关', primary: true, cb: function () { restartLevel(); closeModal(); } }, { label: '取消', cb: closeModal }]);
    });
    $('menu-hint').addEventListener('click', hint);
    $('menu-restart').addEventListener('click', function () { closeMenu(); restartLevel(); });
    $('menu-jump').addEventListener('click', function () {
      closeMenu();
      showModal(
        '<h3>跳关</h3><div class="win-sub">输入关卡号（1 ~ 999999），直达对应谜面</div>' +
        '<input id="jump-num" class="num-in" type="number" min="1" max="999999" value="' + state.level + '">',
        [{
          label: '跳过去', primary: true, cb: function () { gotoLevel($('jump-num').value); }
        }, { label: '取消', cb: closeModal }]);
    });
    $('menu-import').addEventListener('click', openImport);
    $('menu-cfg').addEventListener('click', function () {
      closeMenu();
      if (root.CY.panel) CY.panel.open();
      else toast('设置面板未加载');
    });
    window.addEventListener('resize', function () { renderGrid(); });
    document.addEventListener('visibilitychange', function () { });
    document.addEventListener('pointerdown', function unlockAudio() {
      try {
        if (root.CY.audio) {
          CY.audio.init();
          CY.audio.unlock();
          CY.audio.setVol(cfg.audio);
          CY.audio.applyOverrides({ muted: !!cfg.audio.muted });
          if (!cfg.audio.muted && cfg.audio.bgm > 0) CY.audio.startBgm();
        }
      } catch (e) { }
      document.removeEventListener('pointerdown', unlockAudio);
    });
  }

  function start() {
    if (!root.CY_BANK || !CY_BANK.list || CY_BANK.list.length < 10) {
      /* 词库模块缺失/过小时用兜底词库，游戏不死锁 */
    }
    ensurePuzzle(false);
    bind();
    render();
    selectEmptyKey(firstEmptyKey());
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  /* ---------- 调试钩子 ---------- */
  root.__cy = {
    get state() { return state; },
    get selWord() { return selWord; },
    cfg: function () { return window.CY.config.get(); },
    fill: function (r, c, ch) {
      var k = r + ',' + c;
      selectKey(k);
      var pz = state.puzzle;
      for (var i = 0; i < pz.pool.length; i++) {
        if (pz.pool[i] === (ch || pz.cells[k].ch) && (state.progress.used || []).indexOf(i) < 0) { tapTile(i); return true; }
      }
      return false;
    },
    puzzle: function () { return state.puzzle; },
    analyze: function (t) { return L.analyzeImport(t, { maxMs: 1500 }); },
    gotoLevel: gotoLevel,
    setCoins: function (n) { state.coins = n | 0; saveState(); renderTop(); },
    openImport: openImport,
    restart: restartLevel,
    get report() { return lastReport; }
  };
  if (typeof module !== 'undefined' && module.exports) { /* 浏览器专属，node 不导出 */ }
})();

</script>
</body>
</html>
