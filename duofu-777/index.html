<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d0830">
<title>多福巨奖 777 · 澳门老虎机</title>
<style>
/* ================= 基础 ================= */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#0b0414;color:#f6e7c8;overflow:hidden;position:fixed;inset:0;
  touch-action:manipulation;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;touch-action:manipulation}
b,label{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ================= 舞台与机柜 ================= */
#stage{height:100dvh;width:100vw;display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#cabinet{
  width:min(1060px,100vw);height:100%;max-height:100dvh;display:flex;flex-direction:column;gap:6px;
  padding:10px 10px 12px;position:relative;overflow:hidden;
  background:linear-gradient(165deg,#41135f 0%,#20082f 48%,#310d4d 100%);
  border:2px solid #6d2ec0;border-radius:22px;
  box-shadow:0 0 0 3px #14051f,0 0 38px 8px rgba(150,60,255,.4),inset 0 0 70px rgba(0,0,0,.55);
}
/* 机柜霓虹呼吸 */
#cabinet::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
  box-shadow:inset 0 0 26px 4px rgba(178,107,255,.28);animation:neon 4.5s ease-in-out infinite}
@keyframes neon{0%,100%{opacity:.55}50%{opacity:1}}

/* ================= 顶屏：LOGO+四奖池 ================= */
#logoWrap{display:flex;justify-content:center;flex:0 0 auto}
#logoBox{height:52px;aspect-ratio:4.4/1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
#logoBox svg,#logoBox img{width:100%;height:100%;display:block}
#topScreen{
  flex:0 0 auto;position:relative;border-radius:14px;padding:7px 9px;overflow:hidden;
  border:2px solid #d9a83f;background:#3a0710;
  box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 0 12px rgba(217,168,63,.25);
}
#topBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
#potRow{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pot{position:relative;border:1.5px solid #caa14a;border-radius:9px;padding:4px 6px 5px;text-align:center;
  background:linear-gradient(180deg,rgba(122,18,32,.92),rgba(58,7,16,.94));overflow:hidden}
.pot{min-width:0}
.pot-name{font-size:11px;font-weight:700;letter-spacing:1px;white-space:nowrap;overflow:hidden;color:#ffe9b0;
  background:linear-gradient(180deg,#f8d67d,#d99b2e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 10px rgba(248,214,125,.25)}
.pot-val{font-size:clamp(11px,1.6vw,17px);font-weight:800;color:#fff3cf;white-space:nowrap;letter-spacing:-.3px;text-shadow:0 0 8px rgba(255,190,80,.55)}
.pot.grand .pot-val{color:#ffe08a}.pot.mini .pot-val{color:#ffd9d0}
.pot-rail{display:flex;justify-content:center;gap:2px;margin-top:3px;height:5px}
.pot-rail i{width:7px;height:5px;border-radius:2px;background:rgba(255,220,140,.16);border:1px solid rgba(255,220,140,.25)}
.pot-rail.dots i.on{background:radial-gradient(circle at 30% 30%,#fff3c4,#f2b93c);box-shadow:0 0 5px rgba(255,200,90,.9);border-color:#fff0bd}
.pot-rail.bar{position:relative;height:6px;border-radius:3px;background:rgba(255,220,140,.12);border:1px solid rgba(255,220,140,.28);overflow:hidden}
.pot-rail.bar i{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:3px;
  background:linear-gradient(90deg,#c9862e,#f2b93c 60%,#fff0bd);box-shadow:0 0 6px rgba(255,200,90,.8);transition:width .45s ease}
.pot.full{animation:potFull .8s ease-in-out infinite}
@keyframes potFull{0%,100%{box-shadow:0 0 6px 2px rgba(255,205,90,.5)}50%{box-shadow:0 0 18px 6px rgba(255,205,90,.95)}}
.pot.bump .pot-val{animation:potBump .4s ease}
@keyframes potBump{40%{transform:scale(1.22);color:#fff}}
/* 侧赔付表（宽屏） */
.payside{position:absolute;top:6px;bottom:6px;width:150px;display:none;flex-direction:column;gap:4px;
  font-size:9px;color:#e8cfa0;pointer-events:none}
#paySide{right:8px}#paySideL{left:8px}
.payside .ps-row{display:flex;align-items:center;gap:5px;background:rgba(46,6,14,.9);
  border:1px solid rgba(202,161,74,.65);border-radius:6px;padding:2px 6px;color:#ffdca0;font-size:10px;font-weight:700}
.payside .ps-row img{width:22px;height:22px;flex:0 0 auto}
.payside .ps-row .ps-pays{margin-left:auto;text-align:right;line-height:1.25;font-weight:800;color:#ffe9b0;font-size:10px}

/* ================= 主屏 ================= */
#mainScreen{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;border-radius:14px;
  border:2px solid #d9a83f;overflow:hidden;background:#33040e;
  box-shadow:inset 0 0 40px rgba(0,0,0,.65)}
#mainBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
#freeBanner{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:30;
  padding:5px 18px;border-radius:999px;font-size:14px;font-weight:800;color:#5d1503;white-space:nowrap;
  background:linear-gradient(180deg,#ffe9a8,#f0b64a);box-shadow:0 2px 14px rgba(255,190,80,.5);border:2px solid #fff3cf}
#reelBox{position:relative;flex:1;display:flex;gap:4px;padding:10px 12px;min-height:0;z-index:5}
.reel{position:relative;flex:1;overflow:hidden;border-radius:8px;background:linear-gradient(180deg,#20030a,#3a0813 30%,#2a050d);
  box-shadow:inset 0 8px 14px rgba(0,0,0,.55),inset 0 -8px 14px rgba(0,0,0,.55)}
.reel .strip{position:absolute;left:0;top:0;width:100%;will-change:transform}
.cell{display:flex;align-items:center;justify-content:center;position:relative}
.cell img{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.cell.gold img{filter:drop-shadow(0 0 7px rgba(255,205,90,.75)) drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.reel.blur .strip{filter:blur(1.6px)}
#reelFrame{position:absolute;inset:0;pointer-events:none;z-index:20;border-radius:10px;
  background:linear-gradient(160deg,rgba(255,255,255,.14),transparent 32%)}
#reelFrame::before{content:"";position:absolute;left:10px;right:10px;top:calc(10px + var(--rowH));height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(255,215,130,.5),transparent)}
#reelFrame::after{content:"";position:absolute;left:10px;right:10px;top:calc(10px + var(--rowH)*2);height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(255,215,130,.5),transparent)}
.cell.hit::before{content:"";position:absolute;inset:2%;border-radius:12px;z-index:-1;
  background:radial-gradient(circle,rgba(255,214,110,.5),rgba(255,180,60,.12) 70%);animation:hitGlow .5s ease-in-out infinite alternate}
.cell.hit img{animation:hitZoom .5s ease-in-out infinite alternate}
@keyframes hitGlow{from{opacity:.5}to{opacity:1}}
@keyframes hitZoom{from{transform:scale(1)}to{transform:scale(1.14)}}
#reelMsg{position:absolute;left:0;right:0;bottom:12%;text-align:center;z-index:25;pointer-events:none;
  font-size:clamp(15px,2.6vw,24px);font-weight:900;letter-spacing:2px;
  color:#ffe9b0;text-shadow:0 0 14px rgba(255,190,80,.9),0 2px 3px rgba(0,0,0,.7);opacity:0;transition:opacity .25s}
#reelMsg.show{opacity:1}

/* 底部信息条 */
#bottomBar{position:relative;z-index:6;flex:0 0 auto;display:flex;gap:6px;padding:5px 10px 7px}
.bb{flex:1;display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#170309,#3a0713);
  border:1.5px solid #b98a35;border-radius:9px;padding:4px 10px;min-width:0}
.bb label{font-size:11px;color:#d9b877;white-space:nowrap}
.bb b{font-size:clamp(13px,2.4vw,19px);font-weight:800;color:#fff3cf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb.win b{color:#ffd257;text-shadow:0 0 10px rgba(255,190,60,.6)}

/* ================= 按键面板 ================= */
#deck{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px 4px}
#betRow{flex:1;display:flex;align-items:center;gap:6px;justify-content:center;min-width:0}
.dbtn{flex:0 0 auto;min-width:52px;padding:8px 10px;border-radius:12px;font-size:13px;font-weight:800;color:#ffe6b3;
  background:linear-gradient(180deg,#3c1560,#22093a);border:1.5px solid #a565e8;
  box-shadow:0 2px 0 #160526,0 0 10px rgba(150,80,240,.35);display:flex;flex-direction:column;align-items:center;gap:1px}
.dbtn small{font-size:9px;font-weight:600;color:#c9a5ee}
.dbtn:active{transform:translateY(2px);box-shadow:0 0 0 #160526}
.dbtn.on{background:linear-gradient(180deg,#a855f7,#6d28d9);color:#fff;box-shadow:0 2px 0 #3b0f6e,0 0 16px rgba(168,85,247,.7)}
.dbtn:disabled{opacity:.38}
#betGroup{flex:1;display:flex;align-items:center;gap:6px;justify-content:center}
#betDots{display:flex;gap:5px}
#betDots i{width:10px;height:10px;border-radius:50%;background:#3a1c5c;border:1.5px solid #8b5cf6}
#betDots i.on{background:radial-gradient(circle at 32% 30%,#ffe9a8,#f0a92e);border-color:#fff0c2;box-shadow:0 0 7px rgba(255,200,90,.9)}
#btnSpin{flex:0 0 auto;width:clamp(74px,13vw,104px);aspect-ratio:1;border-radius:50%;position:relative;
  font-size:clamp(15px,2.6vw,21px);font-weight:900;letter-spacing:3px;color:#fff8e8;
  background:radial-gradient(circle at 32% 28%,#ff7a52,#e02c1d 55%,#8f0f08 90%);
  border:3px solid #ffdf9e;box-shadow:0 4px 0 #5c0703,0 0 22px rgba(255,90,50,.55),inset 0 -8px 14px rgba(120,10,0,.7);
  text-shadow:0 2px 4px rgba(90,0,0,.6)}
#btnSpin:active{transform:translateY(3px);box-shadow:0 1px 0 #5c0703,0 0 22px rgba(255,90,50,.55)}
#btnSpin.stop{background:radial-gradient(circle at 32% 28%,#ffd97a,#f0a12e 55%,#9a6208 90%);color:#5d1503}
#btnSpin:disabled{filter:grayscale(.7) brightness(.75)}

/* ================= 弹层通用 ================= */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:rgba(8,2,16,.72);backdrop-filter:blur(3px);padding:16px}
.sheet{width:min(560px,94vw);max-height:86dvh;overflow:auto;border-radius:16px;padding:14px 16px 18px;
  background:linear-gradient(170deg,#2c0a18,#160309 70%);border:2px solid #d9a83f;
  box-shadow:0 10px 50px rgba(0,0,0,.7),0 0 20px rgba(217,168,63,.3)}
.sheet h2{font-size:17px;text-align:center;color:#ffe2a0;letter-spacing:4px;margin-bottom:10px}
.sheet .x{position:sticky;top:0;float:right;width:30px;height:30px;border-radius:50%;font-size:16px;color:#ffdca0;
  background:rgba(120,20,40,.8);border:1px solid #d9a83f;z-index:2}
.menu-list{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.mitem{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-size:15px;font-weight:700;color:#ffe6b3;
  background:linear-gradient(180deg,#3c1560,#22093a);border:1.5px solid #a565e8;text-align:left}
.mitem:active{transform:scale(.98)}
.mitem .ic{font-size:20px}
.mitem small{margin-left:auto;font-size:11px;font-weight:500;color:#c9a5ee}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat-grid .st{background:rgba(60,10,26,.6);border:1px solid rgba(217,168,63,.5);border-radius:10px;padding:8px 10px}
.stat-grid .st label{display:block;font-size:11px;color:#d9b877}
.stat-grid .st b{font-size:16px;color:#fff3cf}
/* 赔付表 */
.pay-table{width:100%;border-collapse:collapse;font-size:12px}
.pay-table th{color:#ffdca0;font-size:11px;padding:4px;border-bottom:1px solid rgba(217,168,63,.5)}
.pay-table td{padding:4px 6px;border-bottom:1px solid rgba(217,168,63,.18);text-align:center}
.pay-table td:first-child{text-align:left}
.pay-table img{width:26px;height:26px;vertical-align:middle}
.pay-table .gold-row{background:rgba(255,200,90,.06)}
.rules{font-size:12px;line-height:1.75;color:#e8cfa0;margin-top:10px}
.rules h3{color:#ffdca0;font-size:13px;margin:8px 0 3px}
.rules b{color:#ffd257}

/* 选奖 */
#pickBonus{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,rgba(90,20,10,.92),rgba(10,2,6,.96));padding:12px;gap:10px}
#pickTitle{font-size:clamp(20px,4.5vw,30px);font-weight:900;letter-spacing:6px;
  background:linear-gradient(180deg,#fff3c4,#f2b93c 60%,#c9862e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 12px rgba(255,200,80,.8))}
#pickSub{font-size:13px;color:#ffe6b3}
#pickGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.6vw,12px);width:min(480px,92vw)}
.pcoin{aspect-ratio:1;border-radius:50%;position:relative;transition:transform .2s;
  background:radial-gradient(circle at 32% 28%,#ffe9a8,#f2b93c 55%,#a8721f 90%);
  border:3px solid #fff0c2;box-shadow:0 3px 0 #7a4e0e,0 0 14px rgba(255,200,90,.5)}
.pcoin:not(.done):active{transform:scale(.92)}
.pcoin .back{position:absolute;inset:14%;opacity:.9}
.pcoin .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:50%;font-weight:900;transform:rotateY(180deg);backface-visibility:hidden}
.pcoin.open .face{transform:rotateY(0)}
.pcoin.open .back{opacity:0}
.pcoin.done{opacity:.42;pointer-events:none}
.pcoin.win{animation:pickWin .6s ease-in-out infinite;box-shadow:0 0 26px 8px rgba(255,210,90,.95)}
@keyframes pickWin{50%{transform:scale(1.12)}}
.pcoin .face .pf-name{font-size:clamp(12px,2.4vw,17px);letter-spacing:1px}
.pcoin .face .pf-val{font-size:clamp(9px,1.8vw,12px);font-weight:700;opacity:.9}
.pcoin.mini .face{background:radial-gradient(circle at 32% 28%,#ffd9c9,#f2937c 60%,#a83a26)}
.pcoin.minor .face{background:radial-gradient(circle at 32% 28%,#c9e0ff,#7ca8f2 60%,#2a4ea8)}
.pcoin.major .face{background:radial-gradient(circle at 32% 28%,#e2c9ff,#a87cf2 60%,#5a2aa8)}
.pcoin.grand .face{background:radial-gradient(circle at 32% 28%,#fff3b0,#f2d23c 60%,#a8861f)}
.pcoin.fu .face{background:radial-gradient(circle at 32% 28%,#d0ffe0,#7cf2a8 60%,#1fa85a)}
#pickGot{display:flex;gap:14px;font-size:13px;font-weight:800;color:#ffe6b3;min-height:20px}
#pickGot span{opacity:.35}#pickGot span.live{opacity:1}

/* 大奖演出 */
#bigWinOverlay{position:fixed;inset:0;z-index:85;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:radial-gradient(circle at 50% 42%,rgba(70,10,30,.88),rgba(8,1,10,.95));cursor:pointer}
#bigWinLabel{font-size:clamp(34px,9vw,72px);font-weight:900;letter-spacing:8px;
  background:linear-gradient(180deg,#fff8d8,#ffd257 45%,#e08a1e 75%,#8a4a08);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,190,60,.9));animation:bigIn .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes bigIn{from{transform:scale(.2);opacity:0}}
#bigWinAmt{font-size:clamp(22px,5.5vw,44px);font-weight:900;color:#fff3cf;text-shadow:0 0 16px rgba(255,190,60,.8)}
#bigWinHint{font-size:12px;color:#e8cfa0;opacity:.75;margin-top:14px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(14dvh + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;
  background:rgba(20,4,30,.92);border:1.5px solid #d9a83f;color:#ffe6b3;font-size:13px;font-weight:700;
  padding:9px 18px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.6);opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1}

#fxLayer{position:fixed;inset:0;z-index:100;pointer-events:none}
#configMount{position:fixed;inset:0;z-index:95;pointer-events:none}
#configMount>*{pointer-events:auto}

/* ================= 响应式 ================= */
/* 竖屏手机：奖池 2×2、隐藏侧表、按键两行 */
@media (max-width:719px){
  #cabinet{border-radius:0;border-left:none;border-right:none;width:100%}
  #logoBox{height:40px}
  #potRow{grid-template-columns:repeat(2,1fr);gap:5px}
  .pot-name{font-size:10px}
  .pot-val{font-size:13px}
  .pot-rail{height:4px}.pot-rail.bar{height:5px}
  #reelBox{padding:8px 6px;gap:3px}
  #bottomBar{padding:4px 6px 6px;gap:4px}
  .bb{padding:3px 7px;gap:4px}
  .bb label{font-size:9px}
  .bb b{font-size:12px}
  #deck{flex-wrap:wrap;justify-content:space-evenly;gap:6px;padding:4px 6px 6px}
  #betRow{flex:1 0 100%}
  .dbtn{min-width:46px;padding:7px 6px;font-size:12px}
  #btnSpin{width:68px}
}
/* 宽屏（平板横/桌面）：顶部三栏 logo+奖池+侧赔付表 */
@media (min-width:900px){
  #topScreen{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:9px 12px}
  #logoBox{grid-column:1;justify-self:start;height:58px;width:auto;aspect-ratio:auto;min-width:200px}
  #potRow{grid-column:2;width:min(500px,46vw)}
  .payside{display:flex;position:static;width:auto}
  #paySide{grid-column:3;grid-row:1}
  #paySideL{grid-column:1;grid-row:1;justify-self:start}
}
/* 超宽：机柜留边距 */
@media (min-width:1100px){ #cabinet{height:min(100dvh - 24px,860px)} }
/* 横屏矮屏（手机横放） */
@media (max-height:479px) and (orientation:landscape){
  #logoBox{height:34px}
  #topScreen{padding:4px 8px}
  #potRow{gap:5px}.pot{padding:2px 4px}.pot-name{font-size:9px}.pot-rail{display:none}
  #reelBox{padding:6px 8px}
  #deck{padding:2px 8px}.dbtn{padding:4px 8px;font-size:11px;min-width:44px}
  #btnSpin{width:64px}
  .bb{padding:2px 8px}.bb b{font-size:14px}
}
</style>
</head>
<body>
<div id="stage">
  <div id="cabinet">
    <header id="logoWrap"><div id="logoBox"></div></header>

    <section id="topScreen">
      <div id="potRow">
        <div class="pot grand" id="pot-grand"><div class="pot-name">多福巨奖 GRAND</div><div class="pot-val">$0.00</div><div class="pot-rail"></div></div>
        <div class="pot major" id="pot-major"><div class="pot-name">多财大奖 MAJOR</div><div class="pot-val">$0.00</div><div class="pot-rail"></div></div>
        <div class="pot minor" id="pot-minor"><div class="pot-name">多福中奖 MINOR</div><div class="pot-val">$0.00</div><div class="pot-rail"></div></div>
        <div class="pot mini"  id="pot-mini"><div class="pot-name">多福小奖 MINI</div><div class="pot-val">$0.00</div><div class="pot-rail"></div></div>
      </div>
      <aside id="paySideL" class="payside"></aside>
      <aside id="paySide" class="payside"></aside>
    </section>

    <section id="mainScreen">
      <div id="freeBanner" hidden>免费局 <b id="fsLeft">0</b> 次 · 累计 <b id="fsWin">$0.00</b></div>
      <div id="reelBox"></div>
      <div id="reelMsg"></div>
      <div id="bottomBar">
        <div class="bb"><label>余额</label><b id="creditVal">$0.00</b></div>
        <div class="bb"><label>押注</label><b id="betVal">$8.00</b></div>
        <div class="bb win"><label>赢分</label><b id="winVal">$0.00</b></div>
      </div>
    </section>

    <section id="deck">

<script>
/* ===== src/logic.js ===== */
/* 多福巨奖 777 — 核心算法：滚轮条 / 243路结算(含福Wild) / 奖池 / 免费局 / 12币选奖 / RTP模拟
   机制对齐官方《多福多財 DUO FU DUO CAI》说明书：押注档 8/18/38/68/88、福Wild 仅 2/3/4 轮、
   3+ 金锣 10 次免费局(+10 追加、剔除低符)、12 金币选奖(结果预定)、四奖池每注注入 0.1%~1%。 */
window.DF = window.DF || {};
DF.LOGIC = (function () {
  'use strict';

  var LOW = ['10', 'J', 'Q', 'K', 'A'];
  var PREM = ['koi', 'frog', 'turtle', 'dragon', 'ingot'];
  var GOLD_POT = { frog: 'mini', koi: 'minor', turtle: 'major', ingot: 'grand' };
  var GOLD_OF = { g_koi: 'koi', g_frog: 'frog', g_turtle: 'turtle', g_ingot: 'ingot' };
  var POT_ORDER = ['grand', 'major', 'minor', 'mini'];
  var POT_CN = { grand: '多福巨奖', major: '多财大奖', minor: '多福中奖', mini: '多福小奖', fu: '福' };
  var POT_TIER = { mini: 1, minor: 2, major: 3, grand: 4 };
  var WILD_REELS = [1, 2, 3];   // 福Wild 仅 2/3/4 轮（0 基）

  // 每路赔付（× 押注 / payDivisor）
  var PAYS = {
    ingot:  { 3: 25, 4: 100, 5: 500 },
    dragon: { 3: 15, 4: 50,  5: 250 },
    turtle: { 3: 10, 4: 30,  5: 150 },
    frog:   { 3: 8,  4: 20,  5: 120 },
    koi:    { 3: 5,  4: 15,  5: 100 },
    A:      { 3: 3,  4: 10,  5: 50 },
    K:      { 3: 3,  4: 8,   5: 40 },
    Q:      { 3: 2,  4: 6,   5: 30 },
    J:      { 3: 2,  4: 5,   5: 25 },
    '10':   { 3: 2,  4: 4,   5: 20 }
  };
  var SCATTER_PAY = { 3: 5, 4: 10, 5: 50 };  // × 押注

  function defaultCfg() {
    return {
      startCredits: 10000,
      betTiers: [8, 18, 38, 68, 88],
      railNeed: { mini: 80, minor: 115, major: 160, grand: 215 },
      pickWeights: { mini: 0.70, minor: 0.22, major: 0.065, grand: 0.015 },  // 选奖预定结果分布
      fsRemove: ['10', 'J', 'Q'],
      freeSpins: 10, freeRetrigger: 10, tier5Boost: 1.2, fsScale: 1.0,
      stripGold: { frog: 1, koi: 1, turtle: 1, ingot: 1 },
      wildPerReel: 1,
      payDivisor: 12, winScale: 1.0, bigWinTiers: [15, 30],
      jackpots: {
        grand: { seed: 38888.88, grow: 0.010 },
        major: { seed: 6888.88,  grow: 0.006 },
        minor: { seed: 688.88,   grow: 0.003 },
        mini:  { seed: 188.88,   grow: 0.0015 }
      },
      vols: { master: 1, bgm: 0.5, sfx: 1 },
      icons: {}, sounds: {},
      turbo: false, autoStopBigWin: true, sound: true
    };
  }

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function mod(a, n) { return ((a % n) + n) % n; }
  function shuffle(bag, rng) {
    for (var i = bag.length - 1; i > 0; i--) {
      var k = Math.floor((rng || Math.random)() * (i + 1));
      var t = bag[i]; bag[i] = bag[k]; bag[k] = t;
    }
    return bag;
  }

  /* ---------- 滚轮条 ---------- */
  function makeStrips(cfg, seed) {
    cfg = cfg || {};
    var rng = mulberry32(seed || 20260911);
    var strips = [];
    for (var r = 0; r < 5; r++) {
      var bag = [];
      LOW.forEach(function (s) { for (var i = 0; i < 7; i++) bag.push(s); });
      bag.push('koi', 'koi', 'koi', 'koi', 'g_koi');
      bag.push('frog', 'frog', 'frog', 'frog', 'g_frog');
      bag.push('turtle', 'turtle', 'turtle', 'turtle', 'g_turtle');
      bag.push('dragon', 'dragon', 'dragon', 'dragon', 'dragon');
      bag.push('ingot', 'ingot', 'g_ingot');
      bag.push('gong', 'gong');
      for (var w = 0; w < (cfg.wildPerReel || 0); w++) bag.push('wild');   // 仅 2/3/4 轮
      if (WILD_REELS.indexOf(r) < 0) bag.splice(bag.indexOf('wild'), Math.max(0, (cfg.wildPerReel || 0)));
      // Fisher-Yates；金锣间距 <3 重洗（触发率与排列无关）
      for (var tries = 0; tries < 60; tries++) {
        shuffle(bag, rng);
        var pos = [], ok = true;
        for (var x = 0; x < bag.length; x++) if (bag[x] === 'gong') pos.push(x);
        for (var y = 1; y < pos.length; y++) if (pos[y] - pos[y - 1] < 3) { ok = false; break; }
        if (ok && pos.length > 1 && bag.length - pos[pos.length - 1] + pos[0] < 3) ok = false;
        if (ok) break;
      }
      strips.push(bag);
    }
    return strips;
  }

  function stripView(strip, fs, cfg) {
    if (!fs) return strip;
    var rm = (cfg && cfg.fsRemove) || LOW;
    return strip.filter(function (s) { return rm.indexOf(s) < 0; });
  }

  function cellOf(raw, opts) {
    var s = GOLD_OF[raw] || raw;
    var pot = GOLD_POT[s];
    return {
      s: s, gold: !!GOLD_OF[raw] && !!pot && (opts.fs || opts.tier >= POT_TIER[pot]), raw: raw
    };
  }

  function spinOnce(strips, opts) {
    var rng = opts.rng || Math.random;
    var cfg = opts.cfg || {};
    var grid = [], stops = [];
    for (var c = 0; c < 5; c++) {
      var view = stripView(strips[c], opts.fs, cfg);
      var idx = Math.floor(rng() * view.length);
      stops.push(idx);
      var col = [];
      for (var r = 0; r < 3; r++) col.push(cellOf(view[(idx + r) % view.length], opts));
      grid.push(col);
    }
    return { stops: stops, grid: grid };
  }

  function gridFromStops(strips, stops, opts) {
    var cfg = opts.cfg || {};
    var grid = [];
    for (var c = 0; c < 5; c++) {
      var view = stripView(strips[c], opts.fs, cfg);
      var col = [];
      for (var r = 0; r < 3; r++) col.push(cellOf(view[mod(stops[c] + r, view.length)], opts));
      grid.push(col);
    }
    return grid;
  }

  /* ---------- 243 路结算（福Wild 替代，仅出现在 2~4 轮充当替代符） ---------- */
  function evalGrid(grid, bet, cfg, tier, fs) {
    cfg = cfg || {};
    var ways = [], win = 0;
    var scale = (cfg.winScale || 1) * (tier >= 5 ? (cfg.tier5Boost || 1) : 1) * (fs ? (cfg.fsScale || 1) : 1);
    var per = bet / (cfg.payDivisor || 8);
    PREM.concat(LOW).forEach(function (s) {
      // 首轮必须有真符号（Wild 不在第 1 轮，天然锚定，无重复计路）
      var rows0 = [];
      for (var r = 0; r < 3; r++) if (grid[0][r].s === s) rows0.push(r);
      if (!rows0.length) return;
      var n = 1, colRows = [rows0];
      for (var c = 1; c < 5; c++) {
        var rows = [];
        for (r = 0; r < 3; r++) { var cs = grid[c][r].s; if (cs === s || cs === 'wild') rows.push(r); }
        if (!rows.length) break;
        n++; colRows.push(rows);
      }
      if (n >= 3 && PAYS[s] && PAYS[s][n]) {
        var cnt = 1;
        colRows.forEach(function (rr) { cnt *= rr.length; });
        var amt = PAYS[s][n] * per * scale;
        var combos = [[]];
        colRows.forEach(function (rr) {
          var next = [];
          combos.forEach(function (pre) { rr.forEach(function (x) { next.push(pre.concat(x)); }); });
          combos = next;
        });
        combos.forEach(function (path) {
          ways.push({ s: s, n: n, amt: amt, cells: path.map(function (rr, i) { return { c: i, r: rr }; }) });
        });
        win += amt * cnt;
      }
    });
    var sc = 0;
    for (var c2 = 0; c2 < 5; c2++) for (var r2 = 0; r2 < 3; r2++) if (grid[c2][r2].s === 'gong') sc++;
    var scPay = sc >= 3 ? (SCATTER_PAY[Math.min(sc, 5)] || 50) * bet * scale : 0;
    return { ways: ways, win: win, scatterCount: sc, scatterPay: scPay };
  }

  function goldHits(grid) {
    var hits = { mini: 0, minor: 0, major: 0, grand: 0 };
    for (var c = 0; c < 5; c++) for (var r = 0; r < 3; r++) {
      var cell = grid[c][r];
      if (cell.gold && GOLD_POT[cell.s]) hits[GOLD_POT[cell.s]]++;
    }
    return hits;
  }

  /* ---------- 12 金币选奖（官方口径：结果预定，翻币是演出） ---------- */
  // 预定中奖池（按权重）
  function pickWon(cfg, rng) {
    var w = cfg.pickWeights || { mini: 0.68, minor: 0.22, major: 0.08, grand: 0.02 };
    var r = (rng || Math.random)(), acc = 0;
    var keys = ['mini', 'minor', 'major', 'grand'];
    for (var i = 0; i < keys.length; i++) { acc += w[keys[i]]; if (r < acc) return keys[i]; }
    return 'mini';
  }
  // 12 币布局：中奖池×4 + 其余各×2 + 福×2（只有中奖池能凑满 3）
  function pickPlan(cfg, won, rng) {
    var others = ['mini', 'minor', 'major', 'grand'].filter(function (p) { return p !== won; });
    var bag = [won, won, won, won, others[0], others[0], others[1], others[1], others[2], others[2], 'fu', 'fu'];
    return shuffle(bag, rng);
  }
  function pickOutcome(plan, won) { return won; }  // 预定

  /* ---------- RTP 模拟（稳态） ---------- */
  function simulate(nRounds, cfg, seed, onProgress) {
    cfg = cfg || defaultCfg();
    var strips = makeStrips(cfg, seed || 1);
    var rng = mulberry32(seed ? seed + 77 : 99);
    var pots = {}, rails = {};
    POT_ORDER.forEach(function (p) { pots[p] = cfg.jackpots[p].seed; rails[p] = 0; });
    var need = cfg.railNeed;
    var totalBet = 0, totalWin = 0, hits = 0, fsTrig = 0;
    var potAwards = { mini: 0, minor: 0, major: 0, grand: 0 };
    var potAwardAmt = 0, fsWinTotal = 0, baseWinTotal = 0, goldSpins = 0, wildSpins = 0;
    var CHECK = Math.max(1000, Math.floor(nRounds / 20));

    for (var i = 0; i < nRounds; i++) {
      var tier = 1 + Math.floor(rng() * 5);
      var bet = cfg.betTiers[tier - 1];
      totalBet += bet;
      POT_ORDER.forEach(function (p) { pots[p] += bet * cfg.jackpots[p].grow; });

      var sp = spinOnce(strips, { tier: tier, rng: rng, cfg: cfg });
      var ev = evalGrid(sp.grid, bet, cfg, tier, false);
      if (sp.grid.some(function (col) { return col.some(function (cell) { return cell.s === 'wild'; }); })) wildSpins++;
      var gh = goldHits(sp.grid), gAny = false;
      for (var p0 in gh) { rails[p0] = Math.min(need[p0], rails[p0] + gh[p0]); if (gh[p0]) gAny = true; }
      if (gAny) goldSpins++;

      var roundWin = ev.win + ev.scatterPay;
      baseWinTotal += roundWin;

      var fsLeft = ev.scatterCount >= 3 ? cfg.freeSpins : 0;
      var fsWin = 0;
      if (fsLeft) {
        fsTrig++;
        var guard = 0;
        while (fsLeft > 0 && guard++ < 500) {
          fsLeft--;
          var f = spinOnce(strips, { fs: true, tier: tier, rng: rng, cfg: cfg });
          var fe = evalGrid(f.grid, bet, cfg, tier, true);
          var fg = goldHits(f.grid);
          for (var q in fg) rails[q] = Math.min(need[q], rails[q] + fg[q]);
          fsWin += fe.win + fe.scatterPay;
          if (fe.scatterCount >= 3) fsLeft += cfg.freeRetrigger;
        }
      }
      roundWin += fsWin; fsWinTotal += fsWin;

      var pickCount = 0;
      for (;;) {
        var full = POT_ORDER.filter(function (p) { return rails[p] >= need[p]; });
        if (!full.length) break;
        var won = pickWon(cfg, rng);
        potAwards[won]++; potAwardAmt += pots[won];
        roundWin += pots[won];
        pots[won] = cfg.jackpots[won].seed;
        full.forEach(function (p) { rails[p] = 0; });
        if (++pickCount > 3) break;
      }

      totalWin += roundWin;
      if (roundWin > 0) hits++;
      if (onProgress && i % CHECK === 0) onProgress(i, totalWin / totalBet);
    }
    return {
      rtp: totalWin / totalBet, baseRtp: baseWinTotal / totalBet,
      fsRtp: fsWinTotal / totalBet, jackpotRtp: potAwardAmt / totalBet,
      hitRate: hits / nRounds, fsRate: fsTrig / nRounds, goldRate: goldSpins / nRounds,
      wildRate: wildSpins / nRounds,
      pickRate: (potAwards.mini + potAwards.minor + potAwards.major + potAwards.grand) / nRounds,
      potAwards: potAwards, rounds: nRounds
    };
  }

  return {
    LOW: LOW, PREM: PREM, GOLD_POT: GOLD_POT, GOLD_OF: GOLD_OF,
    POT_ORDER: POT_ORDER, POT_CN: POT_CN, POT_TIER: POT_TIER, WILD_REELS: WILD_REELS,
    PAYS: PAYS, SCATTER_PAY: SCATTER_PAY,
    defaultCfg: defaultCfg, makeStrips: makeStrips, stripView: stripView,
    spinOnce: spinOnce, gridFromStops: gridFromStops, evalGrid: evalGrid, goldHits: goldHits,
    pickWon: pickWon, pickPlan: pickPlan, pickOutcome: pickOutcome,
    simulate: simulate, mulberry32: mulberry32
  };
})();

</script>

 * 信号链: voices → [sfxBus | bgmBus(×0.5)→bgmVol→duck→bgmFade] → comp → master → out
 *         另有噪声 IR 混响发送（send → convolver → return → comp）
 * ========================================================================= */
window.DF = window.DF || {};
DF.AUDIO = (() => {
  'use strict';

  /* ------------------------------ 基础状态 ------------------------------ */
  const NAMES = ['bgm', 'reelSpin', 'reelStop', 'allStop', 'betUp', 'betDown',
    'button', 'goldLand', 'railFill', 'countTick', 'wayWin', 'winSmall',
    'winMid', 'winBig', 'jackpot', 'freeTrigger', 'pickReveal', 'pickMatch',
    'coinRain', 'refill', 'error'];
  const LOOP_CUES = { bgm: 1, reelSpin: 1 };

  const BPM = 80;
  const STEP = 60 / BPM / 2;          // 八分音符时长 (0.375s)
  const LOOP_STEPS = 96;              // 12 小节 × 8 → 36s 无缝循环
  const CHIME = [88, 91, 93, 96];     // 风铃音池 E6 G6 A6 C7（五声）

  let ctx = null, comp = null, master = null, sfxBus = null;
  let bgmBus = null, bgmVol = null, duckGain = null, bgmFade = null;
  let revSend = null, noiseBuf = null, visBound = false;

  const vols = { master: 1, bgm: 0.5, sfx: 1 }; // 默认对齐 cfg.vols

  const loops = {};                   // name -> {playing, stop()}
  let bgmTimer = null, bgmStep = 0, bgmTime = 0, bgmWanted = false;
  const bgmLive = new Set();          // bgm 已调度声源，stopLoop 时强制停

  const ovPending = {};               // cue -> dataURL（待解码）
  const ovBuf = {};                   // cue -> AudioBuffer
  const ovFailed = {};                // cue -> 1（解码失败，永久回落合成）

  /* ------------------------------ 小工具 ------------------------------ */
  const clamp01 = (x) => { x = +x; if (x !== x) x = 0; return Math.min(1, Math.max(0, x)); };
  const now = () => ctx.currentTime;
  const midi2f = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const rt = (o) => (o && o.rate > 0) ? +o.rate : 1;
  const vv = (o) => (o && o.volume != null) ? clamp01(o.volume) : 1;

  // 增益包络：快起音 + 指数衰减（尾音落到 0.0001 后统一 stop）
  function envG(g, t, peak, a, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(Math.max(peak, 0.0001), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }

  /* 声部容器 V：登记全部节点，done() 在最后一个声源结束时统一 stop+disconnect，
   * sink 用于循环型（bgm）强制停止登记。 */
  function V(bus, sink) {
    const nodes = [], srcs = [];
    let end = 0;
    return {
      g(val, dest) { const g = ctx.createGain(); g.gain.value = val == null ? 1 : val; nodes.push(g); g.connect(dest || bus); return g; },
      f(type, fr, q, dest) { const F = ctx.createBiquadFilter(); F.type = type; F.frequency.value = Math.max(fr, 1); if (q != null) F.Q.value = q; nodes.push(F); F.connect(dest || bus); return F; },
      o(type, fr, t0, dest, det) { const s = ctx.createOscillator(); s.type = type; s.frequency.setValueAtTime(Math.max(fr, 1), t0); if (det) s.detune.value = det; nodes.push(s); srcs.push(s); s.connect(dest || bus); s.start(t0); return s; },
      n(t0, dest, loop) { const s = ctx.createBufferSource(); s.buffer = noiseBuf; if (loop) s.loop = true; nodes.push(s); srcs.push(s); s.connect(dest || bus); s.start(t0); return s; },
      lfo(f, t0, param, amt) { const s = ctx.createOscillator(); s.frequency.value = f; const g = ctx.createGain(); g.gain.value = amt; nodes.push(s, g); srcs.push(s); s.connect(g); g.connect(param); s.start(t0); return s; },
      wet(from, amt) { const g = ctx.createGain(); g.gain.value = amt; nodes.push(g); from.connect(g); g.connect(revSend); return g; },
      keep(t1) { if (t1 > end) end = t1; },
      done(margin) {
        const stopAt = (end || now()) + (margin == null ? 0.05 : margin);
        let n = srcs.length;
        const clean = () => { if (--n > 0) return; for (const x of nodes) { try { x.disconnect(); } catch (_) {} } };
        for (const s of srcs) { try { s.stop(stopAt); } catch (_) {} s.onended = clean; }
        if (!n) clean();
        if (sink) for (const s of srcs) { sink.add(s); s.addEventListener('ended', () => { sink.delete(s); }); }
      }
    };
  }

  /* --------------------------- 通用发声积木 --------------------------- */
  function blip(v, t, f, vel, dec) {                 // 短 UI 音
    const g = v.g(0); envG(g, t, vel, 0.004, dec);
    const lp = v.f('lowpass', 6500, 0.7, g);
    v.o('triangle', f, t, lp);
    const g2 = v.g(0.25, lp); v.o('sine', f * 2, t, g2);
  }
  function pluckS(v, t, f, vel, dec, dest) {         // 古筝拨弦（SFX 亮版）
    const g = v.g(0, dest); envG(g, t, vel, 0.003, dec);
    const lp = v.f('lowpass', Math.min(f * 8, 9500), 0.8, g);
    lp.frequency.setValueAtTime(Math.min(f * 8, 9500), t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(f * 2.2, 500), t + dec);
    v.o('triangle', f, t, lp);
    const g2 = v.g(0.35, lp); v.o('sine', f * 2.003, t, g2);
    v.wet(g, 0.12);
  }
  function bellS(v, t, f, vel, dec, dest) {          // 铃/叮（含 2.756 非谐泛音）
    const g = v.g(0, dest); envG(g, t, vel, 0.002, dec);
    v.o('sine', f, t, g);
    const g2 = v.g(0.32, g); v.o('sine', f * 2.756, t, g2);
    const g3 = v.g(0.12, g); v.o('sine', f * 5.404, t, g3);
    v.wet(g, 0.25);
  }
  function nzHit(v, t, vel, dec, type, freq, q, dest) { // 噪声打击
    const g = v.g(0, dest); envG(g, t, vel, 0.001, dec);
    const F = v.f(type, freq, q, g);
    v.n(t, F);
  }
  function boom(v, t, vel, f0, f1, dec) {            // 低频落地
    const g = v.g(0); envG(g, t, vel, 0.005, dec);
    const o = v.o('sine', f0, t, g);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dec * 0.6);
    v.wet(g, 0.2);
  }
  function cymbal(v, t, vel, dec) {                  // 镲片气声
    const g = v.g(0); envG(g, t, vel, 0.004, dec);
    const hp = v.f('highpass', 6200, 0.7, g);
    v.n(t, hp); v.wet(g, 0.4);
  }
  function chordPad(v, t, notes, dur, vel) {         // 和弦垫
    const g = v.g(0);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + 0.07);
    g.gain.setValueAtTime(vel, t + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const lp = v.f('lowpass', 2800, 0.5, g);
    for (const m of notes) { v.o('triangle', midi2f(m), t, lp); const sg = v.g(0.5, lp); v.o('sawtooth', midi2f(m), t, sg, 6); }
    v.wet(g, 0.25);
  }
  function horn(v, t, notes, dur, vel) {             // 号角 stab（失谐锯齿）
    const g = v.g(0);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + 0.035);
    g.gain.setValueAtTime(vel * 0.85, t + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const lp = v.f('lowpass', 2400, 0.4, g);
    for (const m of notes) { v.o('sawtooth', midi2f(m), t, lp); v.o('sawtooth', midi2f(m), t, lp, 8); }
    v.wet(g, 0.3);
  }
  function timpRoll(v, t, dur, vel) {                // 定音鼓滚（低通噪声+颤音）
    const g = v.g(0);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + dur * 0.75);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.2);
    const vg = v.g(1, g);
    const lp = v.f('lowpass', 280, 0.6, vg);
    v.n(t, lp, true);
    v.lfo(13, t, vg.gain, 0.5);
    v.wet(g, 0.15);
  }
  function coinPing(v, t, vel, f) {                  // 单枚金币叮
    const g = v.g(0); envG(g, t, vel, 0.001, 0.09 + Math.random() * 0.08);
    v.o('sine', f, t, g);
    const g2 = v.g(0.5, g); v.o('sine', f * 1.34 + Math.random() * 40, t, g2);
    v.wet(g, 0.3);
  }
  function shimmer(v, t, dur, vel) {                 // 高频沙沙幕
    const g = v.g(0);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + dur * 0.35);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    const hp = v.f('highpass', 7600, 0.7, g);
    v.n(t, hp, true);
    v.lfo(9, t, g.gain, vel * 0.5);
    v.wet(g, 0.3);
  }

  /* ------------------------------ BGM 部分 ------------------------------ */
  // 宫调式五声音阶 C D E G A；旋律手工编排 12 小节（36s），低音垫+轻鼓+风铃
  const MEL = [
    // A 段 (1-4)
    [0,72,2],[2,76,1],[3,79,1],[4,81,2],[6,79,2],
    [8,76,2],[10,74,2],[12,72,2],[14,67,2],
    [16,69,2],[18,72,2],[20,76,2],[22,74,2],
    [24,72,3],[28,64,1],[29,67,1],[30,69,1],[31,74,1],
    // A' 段 (5-8)
    [32,76,2],[34,79,1],[35,81,1],[36,84,2],[38,81,2],
    [40,79,2],[42,76,2],[44,79,2],[46,81,2],
    [48,79,1],[49,76,1],[50,74,2],[52,72,2],[54,69,2],
    [56,72,2],[58,67,2],[60,64,2],[62,67,2],
    // B 段 (9-12)，尾音 G4 引回 C5 无缝循环
    [64,69,2],[66,72,2],[68,74,2],[70,76,2],
    [72,79,3],[75,76,1],[76,74,2],[78,72,2],
    [80,74,2],[82,76,2],[84,79,2],[86,81,2],
    [88,84,4],[92,72,2],[94,67,2]
  ];
  const MELMAP = new Map();
  for (const [s, m, l] of MEL) MELMAP.set(s, [m, l, (s % 4 === 0) ? 1 : 0.8]);
  const ROOTS = [48, 48, 45, 43, 48, 48, 45, 43, 48, 45, 43, 43]; // C A G 循环

  function zheng(midi, t, dur, vel) {                // 古筝拨弦：双失谐三角波+八度泛音+触弦噪声
    const f = midi2f(midi);
    const dec = Math.min(Math.max(dur, 0.5) + 0.9, 1.6);
    const v = V(bgmBus, bgmLive);
    const g = v.g(0); envG(g, t, vel, 0.004, dec);
    const lp = v.f('lowpass', 3600, 0.7, g);
    lp.frequency.setValueAtTime(3600, t);
    lp.frequency.exponentialRampToValueAtTime(1100, t + dec);
    const o1 = v.o('triangle', f, t, lp); o1.detune.value = -5;
    v.o('triangle', f, t, lp, 6);
    const g2 = v.g(0.35, lp); v.o('sine', f * 2, t, g2);
    const ng = v.g(0); envG(ng, t, vel * 0.45, 0.001, 0.03);
    const bp = v.f('bandpass', 2600, 1.2, ng);
    v.n(t, bp);
    v.wet(g, 0.18);
    v.keep(t + dec + 0.1); v.done();
  }
  function bassPad(midi, t, dur, vel) {              // 低音垫：三角波+次八度正弦
    const f = midi2f(midi);
    const v = V(bgmBus, bgmLive);
    const g = v.g(0);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vel, t + 0.12);
    g.gain.setValueAtTime(vel, t + Math.max(dur - 0.05, 0.12));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.2);
    const lp = v.f('lowpass', 420, 0.5, g);
    v.o('triangle', f, t, lp);
    const g2 = v.g(0.55, lp); v.o('sine', f / 2, t, g2);
    v.keep(t + dur + 0.25); v.done();
  }
  function thump(t, vel) {                           // 轻鼓点
    const v = V(bgmBus, bgmLive);
    const g = v.g(0); envG(g, t, vel, 0.002, 0.16);
    const o = v.o('sine', 120, t, g);
    o.frequency.exponentialRampToValueAtTime(58, t + 0.10);
    v.keep(t + 0.2); v.done();
  }
  function block(t, vel) {                           // 木鱼/梆子点
    const v = V(bgmBus, bgmLive);
    const g = v.g(0); envG(g, t, vel, 0.001, 0.05);
    const bp = v.f('bandpass', 1900, 4, g);
    v.n(t, bp);
    v.keep(t + 0.1); v.done();
  }
  function chime(midi, t) {                          // 风铃
    const f = midi2f(midi);
    const v = V(bgmBus, bgmLive);
    const g = v.g(0); envG(g, t, 0.05, 0.002, 2.6);
    v.o('sine', f, t, g);
    const g2 = v.g(0.4, g); v.o('sine', f * 2.02, t, g2);
    v.wet(g, 0.6);
    v.keep(t + 2.8); v.done();
  }
  function schedStep(step, t) {
    const mel = MELMAP.get(step);
    if (mel) zheng(mel[0], t, mel[1] * STEP, 0.15 * mel[2]);
    const bar = ((step / 8) | 0) % 12, ib = step % 8;
    const root = ROOTS[bar];
    if (ib === 0) { bassPad(root, t, 4 * STEP, 0.12); thump(t, 0.13); }
    else if (ib === 4) { bassPad(root + 7, t, 2 * STEP, 0.085); thump(t, 0.06); }
    else if (ib === 6) { bassPad(root + 12, t, 2 * STEP, 0.06); }
    if ((ib & 1) === 1 && Math.random() < 0.09) block(t, 0.05);
    if (ib === 0 && (bar & 1) === 1 && Math.random() < 0.45) {  // 偶尔风铃点缀
      const n = 1 + ((Math.random() * 3) | 0);
      for (let i = 0; i < n; i++) chime(CHIME[(Math.random() * CHIME.length) | 0], t + Math.random() * STEP * 6);
    }
  }
  function bgmTick() {
    if (!loops.bgm || !loops.bgm.playing || !ctx) return;
    const n = now();
    if (bgmTime < n - 0.05) bgmTime = n + 0.05;      // 唤醒/卡顿后重新对齐
    const ahead = n + 0.45;                          // look-ahead 调度，天然无缝
    while (bgmTime < ahead) { schedStep(bgmStep % LOOP_STEPS, bgmTime); bgmStep++; bgmTime += STEP; }
  }
  function holdParam(p) {
    const t = now();
    if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t);
    else { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); }
  }
  function startBgmSynth() {
    loops.bgm.stop = stopBgmSynth;
    const t = now();
    holdParam(bgmFade.gain);
    bgmFade.gain.setTargetAtTime(1, t, 0.3);
    if (bgmStep >= LOOP_STEPS) bgmStep = 0;
    bgmTime = t + 0.12;
    if (!bgmTimer) bgmTimer = setInterval(bgmTick, 90);
    bgmTick();
  }
  function stopBgmSynth() {
    holdParam(bgmFade.gain);
    bgmFade.gain.setTargetAtTime(0.0001, now(), 0.09);
  }

  /* ---------------------------- reelSpin 循环 ---------------------------- */
  function startReelSpin() {
    const L = loops.reelSpin, t = now();
    const g = ctx.createGain(); g.gain.value = 0.0001; g.connect(sfxBus);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 680; bp.Q.value = 1.1; bp.connect(g);
    const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 230;
    const g2 = ctx.createGain(); g2.gain.value = 0.5;
    const nz = ctx.createBufferSource(); nz.buffer = noiseBuf; nz.loop = true;
    nz.connect(bp); nz.connect(lp2); lp2.connect(g2); g2.connect(g);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.7;   // 呼啸扫频
    const lg = ctx.createGain(); lg.gain.value = 240; lfo.connect(lg); lg.connect(bp.frequency);
    const fl = ctx.createOscillator(); fl.frequency.value = 15;      // 滚动颗粒抖动
    const fg = ctx.createGain(); fg.gain.value = 0.07; fl.connect(fg); fg.connect(g.gain);
    nz.start(t); lfo.start(t); fl.start(t);
    g.gain.setTargetAtTime(0.45, t, 0.06);
    const all = [nz, lfo, fl, g, bp, lp2, g2, lg, fg];
    L.stop = () => {
      const s = now();
      try { g.gain.cancelScheduledValues(s); g.gain.setValueAtTime(g.gain.value, s); g.gain.setTargetAtTime(0.0001, s, 0.05); } catch (_) {}
      for (const x of [nz, lfo, fl]) { try { x.stop(s + 0.25); } catch (_) {} }
      nz.onended = () => { for (const x of all) { try { x.disconnect(); } catch (_) {} } };
    };
  }

  /* ------------------------- 循环注册表启停 ------------------------- */
  function startBufLoop(name, buf, vol) {            // 覆盖音效的循环（buffer 走此路径）
    const L = loops[name], t = now();
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const g = ctx.createGain(); g.gain.value = 0.0001;
    src.connect(g); g.connect(name === 'bgm' ? bgmBus : sfxBus);
    src.start(t);
    g.gain.setTargetAtTime(vol, t, 0.08);
    L.stop = () => {
      const s = now();
      try { g.gain.cancelScheduledValues(s); g.gain.setValueAtTime(g.gain.value, s); g.gain.setTargetAtTime(0.0001, s, 0.06); } catch (_) {}
      try { src.stop(s + 0.35); } catch (_) {}
      src.onended = () => { try { src.disconnect(); g.disconnect(); } catch (_) {} };
    };
  }
  function startLoop(name) {
    if (!LOOP_CUES[name]) return;
    ensureCtx(); if (!ctx) return;
    let L = loops[name];
    if (L && L.playing) return;                      // 幂等
    if (!L) L = loops[name] = { playing: false, stop: null };
    const buf = getOv(name);
    if (buf) startBufLoop(name, buf, name === 'bgm' ? 0.9 : 0.85);
    else if (name === 'bgm') startBgmSynth();
    else startReelSpin();
    L.playing = true;
  }
  function stopLoop(name) {
    const L = loops[name];
    if (!L || !L.playing) return;                    // 幂等
    L.playing = false;
    if (name === 'bgm' && bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    if (L.stop) { try { L.stop(); } catch (_) {} L.stop = null; }
    if (name === 'bgm') {                            // 停干净：斩掉所有已调度声源
      const s = now();
      bgmLive.forEach((x) => { try { x.stop(s + 0.4); } catch (_) {} });
      bgmLive.clear();
    }
  }

  /* --------------------------- 一次性 cue 合成 --------------------------- */
  const SYNTH = {
    // 滚轮制动：低频顿 + click + 轻金属泛音
    reelStop(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      const g = v.g(0); envG(g, t, 0.85 * vel, 0.003, 0.13);
      const s = v.o('sine', F(175), t, g);
      s.frequency.exponentialRampToValueAtTime(Math.max(F(62), 1), T(0.09));
      nzHit(v, t, 0.5 * vel, 0.03, 'highpass', F(2600), 0.7);
      const g2 = v.g(0); envG(g2, t, 0.12 * vel, 0.002, 0.18);
      v.o('triangle', F(988), T(0.004), g2);
      v.keep(T(0.35)); v.done();
    },
    // 全部落定重音：更沉的落地 + 低通噪声 + 金属泛音簇
    allStop(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      const g = v.g(0); envG(g, t, 0.9 * vel, 0.004, 0.28);
      const s = v.o('sine', F(135), t, g);
      s.frequency.exponentialRampToValueAtTime(Math.max(F(46), 1), T(0.22));
      nzHit(v, t, 0.6 * vel, 0.06, 'lowpass', F(380), 0.8);
      nzHit(v, t, 0.35 * vel, 0.025, 'highpass', F(3000), 0.7);
      const mg = v.g(0); envG(mg, T(0.005), 0.16 * vel, 0.002, 0.7);
      [659, 987, 1318].forEach((f, i) => {
        const gi = v.g([1, 0.6, 0.35][i], mg);
        v.o('triangle', F(f) * (1 + (i - 1) * 0.002), T(0.004 * i), gi);
      });
      v.wet(mg, 0.3);
      v.keep(T(1.0)); v.done();
    },
    // 押注+：上行双音
    betUp(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      blip(v, t, F(midi2f(79)), 0.30 * vel, 0.09);
      blip(v, T(0.075), F(midi2f(84)), 0.34 * vel, 0.14);
      v.keep(T(0.3)); v.done();
    },
    // 押注-：下行双音
    betDown(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      blip(v, t, F(midi2f(84)), 0.30 * vel, 0.09);
      blip(v, T(0.075), F(midi2f(79)), 0.32 * vel, 0.14);
      v.keep(T(0.3)); v.done();
    },
    // 通用按键嗒
    button(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      nzHit(v, t, 0.45 * vel, 0.02, 'bandpass', F(1900), 1.4);
      const g = v.g(0); envG(g, t, 0.22 * vel, 0.001, 0.03);
      v.o('sine', F(950), t, g);
      v.keep(T(0.1)); v.done();
    },
    // 金身上桌：清亮叮（高频正弦+非谐泛音）
    goldLand(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      nzHit(v, t, 0.18 * vel, 0.015, 'highpass', F(5000), 0.7);
      bellS(v, t, F(1480), 0.42 * vel, 0.75);
      v.keep(T(0.9)); v.done();
    },
    // 奖池轨道推进：五声上行 blip + 噪声 riser
    railFill(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      [72, 74, 76, 79, 81, 84].forEach((m, i) => blip(v, T(i * 0.055), F(midi2f(m)), 0.26 * vel, 0.07));
      const g = v.g(0);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.10 * vel, T(0.3));
      g.gain.exponentialRampToValueAtTime(0.0001, T(0.42));
      const bp = v.f('bandpass', F(500), 1.2, g);
      bp.frequency.setValueAtTime(F(500), t);
      bp.frequency.exponentialRampToValueAtTime(Math.max(F(3200), 1), T(0.35));
      v.n(t, bp);
      v.keep(T(0.5)); v.done();
    },
    // 计分滴答：opts.rate 变调（计分加速）
    countTick(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      const g = v.g(0); envG(g, t, 0.35 * vel, 0.001, 0.022);
      const lp = v.f('lowpass', 7000, 0.7, g);
      v.o('square', F(1750), t, lp);
      nzHit(v, t, 0.12 * vel, 0.012, 'highpass', F(4500), 0.7);
      v.keep(T(0.06)); v.done();
    },
    // 中奖和弦闪：五声和弦轻拨 + E6 星光
    wayWin(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      [72, 76, 79, 84].forEach((m, i) => pluckS(v, T(i * 0.02), F(midi2f(m)), 0.30 * vel, 0.4));
      bellS(v, T(0.09), F(midi2f(88)), 0.12 * vel, 0.35);
      v.keep(T(0.6)); v.done();
    },
    // 小赢 jingle ~0.8s：C5 E5 G5 C6 琶音 + 镲
    winSmall(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      [72, 76, 79, 84].forEach((m, i) => pluckS(v, T(i * 0.08), F(midi2f(m)), (0.26 + i * 0.04) * vel, 0.5));
      cymbal(v, T(0.24), 0.10 * vel, 0.4);
      v.keep(T(0.9)); v.done();
    },
    // 中赢 jingle ~1.5s：五音琶音 + 和弦垫 + 镲 + 起鼓
    winMid(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      boom(v, t, 0.25 * vel, F(150), F(60), 0.25);
      [72, 76, 79, 84, 88].forEach((m, i) => pluckS(v, T(0.06 + i * 0.07), F(midi2f(m)), (0.24 + i * 0.03) * vel, 0.5));
      chordPad(v, T(0.44), [84, 88, 91], 0.6, 0.10 * vel);
      cymbal(v, T(0.44), 0.12 * vel, 0.55);
      v.keep(T(1.4)); v.done();
    },
    // 大赢 jingle ~2.5s：定音鼓+八度速弹+和弦垫+高音收尾
    winBig(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      boom(v, t, 0.5 * vel, F(120), F(42), 0.5);
      timpRoll(v, t, 0.45, 0.18 * vel);
      [72, 74, 76, 79, 81, 84, 86, 88].forEach((m, i) =>
        pluckS(v, T(0.10 + i * 0.085), F(midi2f(m)), (0.22 + i * 0.018) * vel, 0.45));
      chordPad(v, T(0.85), [72, 79, 84, 88], 0.9, 0.12 * vel);
      cymbal(v, T(0.85), 0.14 * vel, 0.7);
      bellS(v, T(1.75), F(midi2f(93)), 0.20 * vel, 0.7);
      cymbal(v, T(1.75), 0.10 * vel, 0.5);
      v.keep(T(2.5)); v.done();
    },
    // 奖池巨奖 ~4s：定音鼓滚 + 号角 fanfare + 五声速弹 + 金币雨 + 终止大叮
    jackpot(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      timpRoll(v, t, 1.1, 0.30 * vel);
      boom(v, t, 0.6 * vel, F(110), F(40), 0.6);
      horn(v, T(0.02), [60, 64, 67], 0.16, 0.30 * vel);
      horn(v, T(0.22), [60, 64, 67], 0.16, 0.32 * vel);
      horn(v, T(0.42), [60, 64, 67], 0.16, 0.34 * vel);
      horn(v, T(0.66), [67, 72, 74], 0.30, 0.36 * vel);
      horn(v, T(1.10), [72, 76, 79, 84], 1.15, 0.34 * vel);
      [72, 74, 76, 79, 81, 84, 86, 88, 91, 93, 96].forEach((m, i) =>
        pluckS(v, T(1.15 + i * 0.06), F(midi2f(m)), (0.16 + i * 0.012) * vel, 0.35));
      chordPad(v, T(2.05), [72, 76, 79, 84], 1.1, 0.13 * vel);
      cymbal(v, T(1.10), 0.16 * vel, 0.9);
      for (let i = 0; i < 22; i++)
        coinPing(v, T(1.4 + Math.random() * 2.2), (0.05 + Math.random() * 0.05) * vel, F(2200 * Math.pow(2, Math.random() * 1.8)));
      shimmer(v, T(1.4), 2.3, 0.05 * vel);
      bellS(v, T(3.0), F(1568), 0.30 * vel, 1.0);
      boom(v, T(3.0), 0.4 * vel, F(90), F(38), 0.7);
      cymbal(v, T(3.0), 0.14 * vel, 0.9);
      v.keep(T(4.1)); v.done();
    },
    // 免费局触发：金锣（低频非谐泛音长衰减）+ 噪声涌起（欢呼感）
    freeTrigger(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      const f0 = F(98);
      const g = v.g(0);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.5 * vel, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, T(3.8));
      [[1, 1], [1.52, 0.55], [2.24, 0.42], [2.92, 0.30], [3.64, 0.22], [4.51, 0.14], [5.83, 0.09]]
        .forEach(([ra, a]) => {
          const gi = v.g(a, g);
          const p = v.o('sine', f0 * ra * (1 + (Math.random() - 0.5) * 0.01), t, gi);
          p.frequency.exponentialRampToValueAtTime(Math.max(f0 * ra * 0.985, 1), T(3.5));
        });
      nzHit(v, t, 0.5 * vel, 0.09, 'bandpass', F(420), 1.0);
      boom(v, t, 0.5 * vel, F(60), F(36), 1.0);
      v.wet(g, 0.35);
      const cg = v.g(0);                              // 人群欢呼感：中频噪声涌起+微颤
      cg.gain.setValueAtTime(0.0001, T(0.15));
      cg.gain.linearRampToValueAtTime(0.09 * vel, T(0.7));
      cg.gain.exponentialRampToValueAtTime(0.0001, T(2.8));
      const bp = v.f('bandpass', F(950), 0.6, cg);
      v.n(T(0.15), bp);
      v.lfo(6, T(0.4), cg.gain, 0.02);
      v.keep(T(4.0)); v.done();
    },
    // 翻币：啪嗒 + 上滑 + 短叮
    pickReveal(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      nzHit(v, t, 0.4 * vel, 0.018, 'highpass', F(3800), 0.8);
      const g = v.g(0); envG(g, T(0.02), 0.2 * vel, 0.002, 0.05);
      const s = v.o('sine', F(620), T(0.02), g);
      s.frequency.exponentialRampToValueAtTime(F(980), T(0.06));
      bellS(v, T(0.06), F(2093), 0.20 * vel, 0.28);
      v.keep(T(0.5)); v.done();
    },
    // 选奖凑齐：双音叮咚（E6 → C6 钟声）
    pickMatch(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      bellS(v, t, F(1319), 0.30 * vel, 0.30);
      bellS(v, T(0.14), F(1047), 0.34 * vel, 0.5);
      v.keep(T(0.8)); v.done();
    },
    // 金币雨：密集随机高频叮 + 高频沙沙幕
    coinRain(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      for (let i = 0; i < 26; i++)
        coinPing(v, T(Math.random() * 1.25), (0.06 + Math.random() * 0.06) * vel, F(2400 * Math.pow(2, Math.random() * 1.7)));
      shimmer(v, t, 1.4, 0.045 * vel);
      v.keep(T(1.6)); v.done();
    },
    // 补币流入：颤动噪声带下扫 + 散落叮 + 落定
    refill(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      const g = v.g(0);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.16 * vel, T(0.08));
      g.gain.setValueAtTime(0.16 * vel, T(0.5));
      g.gain.exponentialRampToValueAtTime(0.0001, T(0.78));
      const bp = v.f('bandpass', F(4200), 1.1, g);
      bp.frequency.setValueAtTime(F(4200), t);
      bp.frequency.exponentialRampToValueAtTime(Math.max(F(1400), 1), T(0.7));
      v.n(t, bp);
      v.lfo(17, t, g.gain, 0.07 * vel);
      for (let i = 0; i < 10; i++)
        coinPing(v, T(0.05 + Math.random() * 0.6), (0.05 + Math.random() * 0.04) * vel, F(2600 * Math.pow(2, Math.random() * 1.5)));
      boom(v, T(0.72), 0.25 * vel, F(170), F(70), 0.18);
      v.keep(T(1.0)); v.done();
    },
    // 无效操作：低鸣双降音
    error(t, o) {
      const R = rt(o), vel = vv(o), v = V(sfxBus), T = (d) => t + d / R, F = (f) => f * R;
      const lp = v.f('lowpass', F(650), 0.7);
      const g = v.g(0, lp);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.4 * vel, t + 0.012);
      g.gain.setValueAtTime(0.4 * vel, T(0.10));
      g.gain.exponentialRampToValueAtTime(0.0001, T(0.16));
      const s1 = v.o('sawtooth', F(196), t, lp);
      s1.frequency.exponentialRampToValueAtTime(Math.max(F(165), 1), T(0.14));
      const g2 = v.g(0, lp);
      g2.gain.setValueAtTime(0.0001, T(0.20));
      g2.gain.linearRampToValueAtTime(0.4 * vel, T(0.21));
      g2.gain.setValueAtTime(0.4 * vel, T(0.30));
      g2.gain.exponentialRampToValueAtTime(0.0001, T(0.40));
      const s2 = v.o('sawtooth', F(175), T(0.20), lp);
      s2.frequency.exponentialRampToValueAtTime(Math.max(F(130), 1), T(0.38));
      v.keep(T(0.5)); v.done();
    }
  };

  /* ------------------------------ 引擎基建 ------------------------------ */
  function makeNoise(sec) {
    const rate = ctx.sampleRate, len = (sec * rate) | 0;
    const b = ctx.createBuffer(1, len, rate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function makeIR(sec, decay) {                      // 噪声指数衰减立体声 IR
    const rate = ctx.sampleRate, len = (sec * rate) | 0;
    const buf = ctx.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  function onVis() {                                 // 页面隐藏自动停 BGM，恢复显示后续播
    if (!ctx) return;
    if (document.hidden) {
      if (loops.bgm && loops.bgm.playing) { bgmWanted = true; stopLoop('bgm'); }
    } else {
      if (bgmWanted) {
        bgmWanted = false;
        if (ctx.state === 'suspended') { try { ctx.resume(); } catch (_) {} }
        startLoop('bgm');
      }
    }
  }
  function ensureCtx() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 20; comp.ratio.value = 5;
    comp.attack.value = 0.004; comp.release.value = 0.24;
    master = ctx.createGain(); master.gain.value = vols.master;
    comp.connect(master); master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = vols.sfx; sfxBus.connect(comp);
    bgmBus = ctx.createGain(); bgmBus.gain.value = 0.5;      // BGM 单独 ×0.5，不喧宾
    bgmVol = ctx.createGain(); bgmVol.gain.value = vols.bgm;
    duckGain = ctx.createGain(); duckGain.gain.value = 1;
    bgmFade = ctx.createGain(); bgmFade.gain.value = 0;      // 循环淡入淡出
    bgmBus.connect(bgmVol); bgmVol.connect(duckGain); duckGain.connect(bgmFade); bgmFade.connect(comp);
    revSend = ctx.createGain(); revSend.gain.value = 1;
    const cv = ctx.createConvolver(); cv.buffer = makeIR(1.8, 2.4);
    const rv = ctx.createGain(); rv.gain.value = 0.30;
    revSend.connect(cv); cv.connect(rv); rv.connect(comp);
    noiseBuf = makeNoise(1.5);
    if (!visBound && typeof document !== 'undefined' && document.addEventListener) {
      visBound = true;
      document.addEventListener('visibilitychange', onVis);
    }
    flushOverrides();
    return ctx;
  }

  /* ------------------------------ 覆盖音效 ------------------------------ */
  function dataURLToAB(url) {
    const i = url.indexOf(',');
    const b64 = i >= 0 ? url.slice(i + 1) : url;
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let j = 0; j < bin.length; j++) u8[j] = bin.charCodeAt(j);
    return u8.buffer;
  }
  function decodeUrl(url, cb) {                      // 兼容回调式与 Promise 式
    let ab;
    try { ab = dataURLToAB(url); } catch (e) { cb(e); return; }
    let settled = false;
    const ok = (b) => { if (!settled) { settled = true; cb(null, b); } };
    const bad = (e) => { if (!settled) { settled = true; cb(e || new Error('decodeAudioData failed')); } };
    try {
      const p = ctx.decodeAudioData(ab, ok, bad);
      if (p && typeof p.then === 'function') p.then(ok).catch(bad);
    } catch (e) { bad(e); }
  }
  function flushOverrides() {
    if (!ctx) return;
    for (const k of Object.keys(ovPending)) {
      if (ovFailed[k]) { delete ovPending[k]; continue; }
      decodeUrl(ovPending[k], (err, buf) => {
        if (err || !buf) {
          ovFailed[k] = 1; delete ovBuf[k];
          console.warn('[DF.AUDIO] 音效覆盖解码失败，回落合成:', k, err);
        } else ovBuf[k] = buf;
        delete ovPending[k];
      });
    }
  }
  function applyOverrides(map) {
    if (!map) return;
    for (const k in map) {
      if (NAMES.indexOf(k) < 0) continue;
      const url = map[k];
      if (!url || typeof url !== 'string') continue;
      ovPending[k] = url; delete ovFailed[k]; delete ovBuf[k];
    }
    if (ctx) flushOverrides();                       // ctx 未建则推迟到 unlock 时解码
  }
  const getOv = (name) => ovBuf[name] || null;
  function playBuf(buf, opts, t) {
    const src = ctx.createBufferSource(); src.buffer = buf;
    src.playbackRate.value = opts.rate > 0 ? opts.rate : 1;
    const g = ctx.createGain(); g.gain.value = opts.volume != null ? clamp01(opts.volume) : 1;
    src.connect(g); g.connect(sfxBus);
    src.start(t);
    src.onended = () => { try { src.disconnect(); g.disconnect(); } catch (_) {} };
  }

  /* ------------------------------ 公开接口 ------------------------------ */
  function unlock() {                                // 幂等；首次手势调用
    ensureCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended' && ctx.resume) { try { ctx.resume(); } catch (_) {} }
  }
  function play(name, opts) {
    opts = opts || {};
    if (LOOP_CUES[name]) { startLoop(name); return; } // 循环型防御性转发
    ensureCtx(); if (!ctx) return;
    if (ctx.state !== 'running') { try { ctx.resume(); } catch (_) {} }
    if (ctx.state !== 'running') return;             // 未解锁不排队，避免手势后爆音
    const t = now() + 0.02;
    const buf = getOv(name);
    if (buf) { playBuf(buf, opts, t); return; }
    const fn = SYNTH[name];
    if (!fn) return;
    try { fn(t, opts); } catch (e) { console.warn('[DF.AUDIO] 合成失败:', name, e); }
  }
  function duck(ms) {                                // BGM 闪避后自动恢复
    if (!ctx || !duckGain) return;
    const g = duckGain.gain, t = now(), d = Math.max(50, +ms || 800) / 1000;
    holdParam(g);
    g.linearRampToValueAtTime(0.12, t + 0.08);
    g.setValueAtTime(0.12, t + d);
    g.linearRampToValueAtTime(1, t + d + 0.45);
  }
  function setMasterVolume(v) { vols.master = clamp01(v); if (master) master.gain.setTargetAtTime(vols.master, now(), 0.03); }
  function setBGMVolume(v) { vols.bgm = clamp01(v); if (bgmVol) bgmVol.gain.setTargetAtTime(vols.bgm, now(), 0.03); }
  function setSFXVolume(v) { vols.sfx = clamp01(v); if (sfxBus) sfxBus.gain.setTargetAtTime(vols.sfx, now(), 0.03); }

  return { unlock, play, startLoop, stopLoop, duck, setBGMVolume, setSFXVolume, setMasterVolume, applyOverrides, names: NAMES };
})();
