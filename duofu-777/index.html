<script>
/* ===== src/fx.js ===== */
/* 多福巨奖 777 — FX 模块：Canvas2D 粒子特效叠加层
   零依赖 / 不用阴影模糊（发光 = 径向渐变 + lighter 半透明叠色）/ 粒子对象池
   金币为离屏预渲染翻转帧（scaleX 模拟翻转），风格红金喜庆澳门赌场 */
window.DF = window.DF || {};
DF.FX = (() => {
  'use strict';
  const TAU = Math.PI * 2;
  const SPR = 2;                 // 离屏贴图超采样倍率（= DPR 上限）
  const MAX_PARTS = 900;         // 粒子总量上限（保护低端机）
  const rnd = (a, b) => a + Math.random() * (b - a);

  /* ---------------- 模块状态 ---------------- */
  let host = null, canvas = null, ctx = null;
  let W = 0, H = 0, dpr = 1;
  let rafId = 0, loopOn = false, hiddenPaused = false, lastTs = 0;

  const parts = [];              // 活跃粒子  kind: 0金币 1彩带 2星光
  const pool = [];               // 空闲对象池
  const flashes = [];            // 全屏闪光
  const rings = [];              // 冲击波圆环
  const texts = new Set();       // bigText DOM（stopAll 一并清理）

  /* ---------------- 颜色工具 ---------------- */
  function toRgb(c) {
    if (typeof c !== 'string' || !c) return { r: 255, g: 214, b: 100 };
    let m = c.match(/^#([0-9a-f]{3})$/i);
    if (m) return {
      r: parseInt(m[1][0] + m[1][0], 16), g: parseInt(m[1][1] + m[1][1], 16), b: parseInt(m[1][2] + m[1][2], 16)
    };
    m = c.match(/^#([0-9a-f]{6})/i);
    if (m) { const v = parseInt(m[1], 16); return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 }; }
    m = c.match(/rgba?\(([^)]+)\)/i);
    if (m) { const p = m[1].split(','); return { r: +p[0] || 0, g: +p[1] || 0, b: +p[2] || 0 }; }
    return { r: 255, g: 214, b: 100 };
  }
  const rgba = (c, a) => 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';

  /* ---------------- 金币离屏贴图：10 帧翻转（scaleX = cos） ----------------
     配色参照原机金币：金径向渐变 + 深金描边 + 虚线内圈 + 浮雕「福」+ 高光 */
  const NFR = 10, COIN = 46;
  let coinFrames = null;

  function coinFace(c, S) {
    const R = S / 2 - 2;
    const g = c.createRadialGradient(-R * 0.35, -R * 0.42, R * 0.14, 0, 0, R);
    g.addColorStop(0, '#fff7cf'); g.addColorStop(.45, '#ffd964');
    g.addColorStop(.8, '#e8a51e'); g.addColorStop(1, '#9a6406');
    c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fillStyle = g; c.fill();
    c.lineWidth = 3; c.strokeStyle = '#6b3e00'; c.stroke();
    c.beginPath(); c.arc(0, 0, R * 0.8, 0, TAU);
    c.lineWidth = 1.6; c.setLineDash([5, 4]); c.strokeStyle = 'rgba(138,90,0,.8)'; c.stroke(); c.setLineDash([]);
    c.beginPath(); c.arc(0, 0, R * 0.64, 0, TAU);
    c.lineWidth = 2; c.strokeStyle = 'rgba(160,106,8,.7)'; c.stroke();
    c.font = '900 ' + (R * 1.02).toFixed(1) + 'px "Songti SC","STSong","SimSun","Noto Serif SC",serif';
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
    const tg = c.createLinearGradient(0, -R * 0.62, 0, R * 0.62);
    tg.addColorStop(0, '#fff3bd'); tg.addColorStop(.5, '#ffcf4d'); tg.addColorStop(1, '#c98a12');
    c.lineWidth = 3; c.strokeStyle = '#7a4a00';
    c.strokeText('福', 0, R * 0.06);
    c.fillStyle = tg; c.fillText('福', 0, R * 0.06);
    c.save(); c.rotate(-0.62);
    c.beginPath(); c.ellipse(-R * 0.36, -R * 0.5, R * 0.32, R * 0.15, 0, 0, TAU);
    c.fillStyle = 'rgba(255,255,255,.35)'; c.fill(); c.restore();
  }

  function buildCoins() {
    if (coinFrames) return;
    const P = COIN * SPR;
    coinFrames = [];
    for (let i = 0; i < NFR; i++) {
      const sx = Math.cos(i / NFR * Math.PI);          // 1 → -1 翻转
      const cv = document.createElement('canvas');
      cv.width = cv.height = P;
      const c = cv.getContext('2d');
      const ax = Math.abs(sx);
      if (ax < 0.15) {                                  // 侧面：窄厚边
        c.setTransform(1, 0, 0, 1, P / 2, P / 2);
        const w = Math.max(2.4, COIN * SPR * ax * 0.9);
        const g = c.createLinearGradient(-w, 0, w, 0);
        g.addColorStop(0, '#8a5a10'); g.addColorStop(.5, '#ffe9a0'); g.addColorStop(1, '#8a5a10');
        c.beginPath(); c.ellipse(0, 0, w / 2, COIN * SPR * 0.47, 0, 0, TAU);
        c.fillStyle = g; c.fill();
        c.lineWidth = SPR; c.strokeStyle = '#6b3e00'; c.stroke();
      } else {                                          // 正/背面
        c.setTransform(1, 0, 0, 1, P / 2, P / 2);
        c.scale(SPR * sx, SPR);
        coinFace(c, COIN);
        if (sx < 0) {                                   // 背面略暗
          c.beginPath(); c.arc(0, 0, COIN / 2 - 2, 0, TAU);
          c.fillStyle = 'rgba(96,50,0,.26)'; c.fill();
        }
      }
      coinFrames.push(cv);
    }
  }

  /* ---------------- 星光离屏贴图（4/6 角星芒 + 径向光晕），按色缓存 ---------------- */
  const SPARK_S = 64;
  const sparkCache = new Map();
  function sparkSprites(color) {
    const key = color || '#ffd964';
    let s = sparkCache.get(key);
    if (s) return s;
    const rgb = toRgb(key);
    const mk = pts => {
      const cv = document.createElement('canvas');
      cv.width = cv.height = SPARK_S * SPR;
      const c = cv.getContext('2d');
      c.setTransform(SPR, 0, 0, SPR, cv.width / 2, cv.height / 2);   // 逻辑坐标：中心原点，按 SPR 超采样
      const R = SPARK_S / 2 * 0.95;
      let g = c.createRadialGradient(0, 0, 0, 0, 0, R);           // 径向渐变光晕（替代阴影模糊）
      g.addColorStop(0, rgba(rgb, .5)); g.addColorStop(.35, rgba(rgb, .16)); g.addColorStop(1, rgba(rgb, 0));
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fill();
      const r2 = R * 0.15;                                        // 星芒
      c.beginPath();
      for (let i = 0; i < pts; i++) {
        const a0 = i / pts * TAU, a1 = (i + 0.5) / pts * TAU;
        c.lineTo(Math.cos(a0) * R, Math.sin(a0) * R);
        c.lineTo(Math.cos(a1) * r2, Math.sin(a1) * r2);
      }
      c.closePath();
      g = c.createRadialGradient(0, 0, 0, 0, 0, R);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.3, rgba(rgb, .95)); g.addColorStop(1, rgba(rgb, .5));
      c.fillStyle = g; c.fill();
      c.beginPath(); c.arc(0, 0, R * 0.11, 0, TAU); c.fillStyle = '#fff'; c.fill();
      return cv;
    };
    s = { a: mk(4), b: mk(6) };
    sparkCache.set(key, s);
    return s;
  }

  /* ---------------- 对象池 ---------------- */
  const acquire = () => pool.pop() || {};
  const release = p => { if (pool.length < 1200) pool.push(p); };
  function addPart(p) {
    if (parts.length < MAX_PARTS) parts.push(p); else release(p);
  }
  function recycle(i, p) {
    parts[i] = parts[parts.length - 1]; parts.pop(); release(p);
  }

  /* ---------------- 粒子物理 ---------------- */
  function step(p, dt) {
    p.age += dt;
    p.vy += p.g * dt;
    if (p.drag) { const d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy *= d; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    p.frame += p.vf * dt;
    if (p.sway) p.x += Math.sin(p.phase + p.age * p.swf) * p.sway * dt;
    p.dead = p.age >= p.life ||
      (p.vy > 0 && p.y - p.size > H + 70) ||
      p.x < -160 || p.x > W + 160;
  }

  /* ---------------- 绘制 ---------------- */
  function drawCoin(p) {
    let fi = p.frame % NFR; if (fi < 0) fi += NFR;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.drawImage(coinFrames[fi | 0], -p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();
  }
  function drawConfetti(p) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.scale(1, 0.22 + Math.abs(Math.sin(p.phase + p.age * p.swf)) * 0.78);  // 翻面飘动
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  function drawSpark(p) {
    const tt = p.age / p.life;
    const sp = sparkSprites(p.color);
    const k = p.size * (1 - tt * 0.5);
    ctx.globalAlpha = Math.max(0, 1 - tt * tt);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.drawImage(p.six ? sp.b : sp.a, -k / 2, -k / 2, k, k);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function drawRings(dt) {
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.t += dt;
      const tt = r.t / r.dur;
      if (tt >= 1) { rings.splice(i, 1); continue; }
      const rad = 16 + (r.max - 16) * (1 - Math.pow(1 - tt, 2.2));
      const a = Math.pow(1 - tt, 1.4);
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineWidth = 3 + 9 * (1 - tt);
      ctx.strokeStyle = rgba(r.rgb, a * 0.9);
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
      ctx.lineWidth = 1.5 + 3 * (1 - tt);
      ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.55).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(r.x, r.y, rad * 0.9, 0, TAU); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  function drawFlashes(dt) {
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.t += dt;
      const tt = f.t / f.dur;
      if (tt >= 1) { flashes.splice(i, 1); continue; }
      ctx.fillStyle = rgba(f.rgb, f.a * Math.pow(1 - tt, 1.7));
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ---------------- 主循环（rAF 驱动，空闲自停，页面隐藏暂停） ---------------- */
  function tick(ts) {
    rafId = 0;
    if (!loopOn || !ctx) return;
    let dt = lastTs ? (ts - lastTs) / 1000 : 0.0166;
    lastTs = ts;
    if (!(dt > 0)) dt = 0.0166;
    if (dt > 0.05) dt = 0.05;

    ctx.clearRect(0, 0, W, H);
    drawRings(dt);

    for (let i = parts.length - 1; i >= 0; i--) {       // 金币 / 彩带
      const p = parts[i];
      if (p.kind === 2) continue;
      step(p, dt);
      if (p.dead) { recycle(i, p); continue; }
      if (p.kind === 0) drawCoin(p); else drawConfetti(p);
    }

    ctx.globalCompositeOperation = 'lighter';            // 星光叠色发光
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.kind !== 2) continue;
      step(p, dt);
      if (p.dead) { recycle(i, p); continue; }
      drawSpark(p);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    drawFlashes(dt);

    if (parts.length || flashes.length || rings.length) {
      rafId = requestAnimationFrame(tick);
    } else { loopOn = false; lastTs = 0; }
  }
  function kick() {
    if (!ctx || loopOn || hiddenPaused) return;
    loopOn = true; lastTs = 0;
    rafId = requestAnimationFrame(tick);
  }
  function onVis() {
    if (document.hidden) {
      hiddenPaused = true;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      loopOn = false;
    } else {
      hiddenPaused = false;
      if (parts.length || flashes.length || rings.length) kick();
    }
  }

  /* ---------------- 尺寸 / 初始化 ---------------- */
  function resize() {
    if (!canvas || !ctx) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function init(hostEl) {
    host = hostEl || document.body;
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.className = 'df-fx-canvas';
      canvas.style.cssText =
        'position:fixed;left:0;top:0;margin:0;padding:0;' +
        'width:100%;height:100%;pointer-events:none;';
      ctx = canvas.getContext('2d');
      document.addEventListener('visibilitychange', onVis);
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', resize);
    }
    if (canvas.parentNode !== host) host.appendChild(canvas);
    resize();
  }

  /* ---------------- 发射器 ---------------- */
  function coinBurst(x, y, n, opt) {
    if (!ctx) return;
    buildCoins();
    opt = opt || {};
    const spread = opt.spread == null ? 1.05 : opt.spread;
    const g = opt.gravity == null ? 1500 : opt.gravity;
    const pw = opt.power || 1;
    n = Math.max(0, n | 0);
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + rnd(-spread, spread);
      const sp = rnd(380, 860) * pw;
      const p = acquire();
      p.kind = 0; p.x = x + rnd(-8, 8); p.y = y + rnd(-6, 6);
      p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
      p.g = g; p.drag = 0; p.size = rnd(20, 38);
      p.rot = rnd(0, TAU); p.vr = rnd(-6, 6);
      p.frame = rnd(0, NFR); p.vf = rnd(5, 13);
      p.age = 0; p.life = rnd(1.8, 2.6);
      p.sway = 0; p.swf = 0; p.phase = 0;
      addPart(p);
    }
    kick();
  }

  function coinRain(n) {
    if (!ctx) return;
    buildCoins();
    n = Math.max(0, n | 0);
    for (let i = 0; i < n; i++) {
      const p = acquire();
      p.kind = 0;
      p.x = rnd(10, Math.max(20, W - 10));
      p.y = -rnd(20, 60) - (i / (n + 1)) * H * 0.55 - rnd(0, 90);
      p.vx = rnd(-70, 70); p.vy = rnd(-30, 60);
      p.g = rnd(620, 820); p.drag = 0; p.size = rnd(24, 44);
      p.rot = rnd(0, TAU); p.vr = rnd(-5, 5);
      p.frame = rnd(0, NFR); p.vf = rnd(4, 11);
      p.age = 0; p.life = 5.5;
      p.sway = rnd(10, 46); p.swf = rnd(3, 7); p.phase = rnd(0, TAU);
      addPart(p);
    }
    kick();
  }

  const CONF_COLORS = ['#ffd964', '#f2c14e', '#fff3bd', '#e03535', '#c31432', '#ff9e3d'];
  function confetti(n) {
    if (!ctx) return;
    n = Math.max(0, n | 0);
    for (let i = 0; i < n; i++) {
      const L = (i & 1) === 0;                                  // 左右双炮台
      const a = -Math.PI / 2 + (L ? 1 : -1) * rnd(0.12, 0.72);
      const sp = rnd(650, 1300);
      const p = acquire();
      p.kind = 1;
      p.x = L ? -12 : W + 12;
      p.y = H * rnd(0.78, 0.98);
      p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
      p.g = rnd(820, 1000); p.drag = 0.4;
      p.w = rnd(6, 10); p.h = rnd(9, 17); p.size = Math.max(p.w, p.h);
      p.rot = rnd(0, TAU); p.vr = rnd(-9, 9);
      p.frame = 0; p.vf = 0;
      p.age = 0; p.life = rnd(2.2, 3.4);
      p.sway = rnd(24, 70); p.swf = rnd(6, 12); p.phase = rnd(0, TAU);
      p.color = CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0];
      addPart(p);
    }
    kick();
  }

  function spark(x, y, color, n, opt) {
    if (!ctx) return;
    opt = opt || {};
    const g = opt.gravity == null ? 240 : opt.gravity;
    const pw = opt.power || 1;
    const col = color || '#ffd964';
    n = Math.max(0, n | 0);
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU);
      const sp = rnd(90, 430) * pw;
      const p = acquire();
      p.kind = 2; p.x = x; p.y = y;
      p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
      p.g = g; p.drag = 2.1; p.size = rnd(13, 30);
      p.rot = rnd(0, TAU); p.vr = rnd(-6.5, 6.5);
      p.frame = 0; p.vf = 0;
      p.age = 0; p.life = rnd(0.45, 0.85);
      p.sway = 0; p.swf = 0; p.phase = 0;
      p.color = col;
      p.six = Math.random() < 0.45;             // 4 角 / 6 角星混发
      addPart(p);
    }
    kick();
  }

  function flash(color, alpha) {
    if (!ctx) return;
    flashes.push({
      rgb: toRgb(color), a: alpha == null ? 0.75 : Math.max(0, Math.min(1, alpha)),
      t: 0, dur: 0.34
    });
    kick();
  }

  function ring(x, y, color) {
    if (!ctx) return;
    rings.push({
      x, y, rgb: toRgb(color), t: 0, dur: 0.55,
      max: Math.max(90, Math.min(W, H) * 0.22)
    });
    kick();
  }

  /* ---------------- bigText：DOM 金渐变描边大字（弹入 → 停留 1.4s → 淡出自毁） ---------------- */
  function bigText(text, opt) {
    if (!host || typeof text !== 'string' || !text) return;
    opt = opt || {};
    const scale = opt.scale || 1;
    const vw = Math.max(window.innerWidth, 320);
    let fs = Math.min(vw * 0.135, 122) * scale;
    if (text.length > 5) fs *= 5 / text.length;
    fs = Math.round(fs);
    const fam = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif';

    const wrap = document.createElement('div');
    texts.add(wrap);
    wrap.style.cssText =
      'position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);' +
      'display:flex;flex-direction:column;align-items:center;pointer-events:none;' +
      'white-space:nowrap;z-index:2147483000;will-change:transform,opacity;';

    const glow = document.createElement('div');               // 径向渐变光环底
    const gs = Math.round(fs * (text.length * 0.8 + 2.2));
    glow.style.cssText =
      'position:absolute;left:50%;top:46%;width:' + gs + 'px;height:' + gs + 'px;' +
      'transform:translate(-50%,-50%);border-radius:50%;' +
      'background:radial-gradient(circle,rgba(255,206,84,.4) 0%,rgba(216,52,52,.24) 36%,' +
      'rgba(120,10,16,.1) 55%,rgba(0,0,0,0) 70%);';
    wrap.appendChild(glow);

    const stack = document.createElement('div');
    stack.style.cssText = 'position:relative;filter:drop-shadow(0 8px 22px rgba(40,0,0,.5));text-align:center;';
    const base = 'font-family:' + fam + ';font-weight:900;font-size:' + fs +
      'px;line-height:1.14;letter-spacing:.05em;text-align:center;';
    const stroke = document.createElement('div');              // 深红描边层
    stroke.textContent = text;
    stroke.style.cssText = base + 'position:absolute;left:0;top:0;width:100%;color:transparent;' +
      '-webkit-text-stroke:' + Math.max(5, Math.round(fs * 0.1)) + 'px #6e060d;';
    const fill = document.createElement('div');                // 金渐变填充层
    fill.textContent = text;
    fill.style.cssText = base + 'position:relative;' + (opt.color
      ? 'color:' + opt.color + ';'
      : 'background:linear-gradient(180deg,#fff8dc 6%,#ffe9a2 30%,#ffcf4d 52%,#eda91c 74%,#ffc23a 100%);' +
        '-webkit-background-clip:text;background-clip:text;color:transparent;');
    stack.appendChild(stroke); stack.appendChild(fill);
    wrap.appendChild(stack);

    if (opt.sub) {                                             // 金色小字副标题
      const sub = document.createElement('div');
      sub.textContent = String(opt.sub);
      const ss = Math.max(16, Math.round(fs * 0.32));
      sub.style.cssText =
        'position:relative;margin-top:' + Math.max(6, Math.round(fs * 0.1)) + 'px;' +
        'font-family:' + fam + ';font-weight:800;font-size:' + ss + 'px;letter-spacing:.14em;' +
        'color:#ffd964;text-shadow:0 2px 0 #6e2a00,0 0 16px rgba(255,190,70,.55),0 4px 10px rgba(0,0,0,.6);';
      wrap.appendChild(sub);
    }

    host.appendChild(wrap);

    const DUR = 2400;                                          // 弹入(.26) → 停留≈1.4s → 淡出
    const kf = [
      { transform: 'translate(-50%,-50%) scale(.18) rotate(-5deg)', opacity: 0 },
      { transform: 'translate(-50%,-50%) scale(1.16) rotate(1.5deg)', opacity: 1, offset: 0.16 },
      { transform: 'translate(-50%,-50%) scale(.97)', opacity: 1, offset: 0.24 },
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: 0.26 },
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: 0.85 },
      { transform: 'translate(-50%,-50%) scale(1.09)', opacity: 0 }
    ];
    let tm = 0;
    const done = () => {
      if (tm) { clearTimeout(tm); tm = 0; }
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      texts.delete(wrap);
    };
    tm = setTimeout(done, DUR + 300);                          // 兜底自毁（动画时钟异常时仍能清理）
    if (wrap.animate) {
      const an = wrap.animate(kf, { duration: DUR, easing: 'cubic-bezier(.22,.9,.32,1.08)', fill: 'both' });
      an.onfinish = done; an.oncancel = done;
    }
  }

  /* ---------------- 全部清空 ---------------- */
  function stopAll() {
    for (let i = 0; i < parts.length; i++) release(parts[i]);
    parts.length = 0;
    flashes.length = 0;
    rings.length = 0;
    texts.forEach(el => { if (el.parentNode) el.parentNode.removeChild(el); });
    texts.clear();
    if (ctx) ctx.clearRect(0, 0, W, H);
  }

  return {
    init, coinBurst, coinRain, confetti, spark,
    flash, ring, bigText, stopAll
  };
})();

</script>
<script>
/* ===== src/config-panel.js ===== */
/* 多福巨奖 777 — DF.CONFIG_PANEL 游戏内配置面板（图标/音效/玩法/数据 四标签）
   面板持有 work 副本（open 时从 DF.cfg 深拷贝），所有编辑改 work 后立即
   onChange(完整 cfg 深拷贝快照)；持久化由主线负责，本模块不碰 localStorage。 */
window.DF = window.DF || {};
DF.CONFIG_PANEL = (() => {
  'use strict';

  /* ------------------------------ 常量 ------------------------------ */
  var TABS = [
    { key: 'icons', label: '图标' },
    { key: 'sound', label: '音效' },
    { key: 'play',  label: '玩法' },

  function readImageToDataURL(file, maxSize, mime, quality, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, maxSize / Math.max(img.width || 1, img.height || 1));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round((img.width || maxSize) * s));
        cv.height = Math.max(1, Math.round((img.height || maxSize) * s));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL(mime, quality));
      };
      img.onerror = function () { cb(null); };
      img.src = fr.result;
    };
    fr.onerror = function () { cb(null); };
    fr.readAsDataURL(file);
  }
  function readFileAs(file, as, cb) {
    var fr = new FileReader();
    fr.onload = function () { cb(fr.result); };
    fr.onerror = function () { cb(null); };
    if (as === 'text') fr.readAsText(file); else fr.readAsDataURL(file);

    input.type = 'number';
    input.inputMode = 'decimal';
    Object.keys(attrs).forEach(function (k) { input.setAttribute(k, attrs[k]); });

    input.addEventListener('change', function () {
      var v = parseFloat(input.value);

      if (attrs.min != null) v = Math.max(parseFloat(attrs.min), v);

  }
  function fieldRow(label, hint, control) {

  function checkRow(label, get, set) {

  function renderPlayPane(pane) {

    sec.appendChild(fieldRow('初始积分', null,
      numField({ min: '0', step: '100' }, function () { return work.startCredits; },

    sec.appendChild(arrRow('押注档位', work.betTiers.map(function (_, i) {
      return {
        sub: '档' + (i + 1),
        attrs: { min: '1', step: '1' },
        get: function () { return work.betTiers[i]; },
        set: function (v) { work.betTiers[i] = v; }
      };
    })));
    pane.appendChild(sec);

    var rail = el('details', 'dfcp-sec');
    rail.open = true;
    rail.appendChild(el('summary', null, '奖池轨道需求'));

    ].map(function (r) {

    pane.appendChild(fs);

    var win = el('details', 'dfcp-sec');
    win.open = true;
    win.appendChild(el('summary', null, '赔付与大奖'));
    var tierArr = el('div', 'dfcp-arr');
    [['大奖 ≥', 0], ['超级大奖 ≥', 1]].forEach(function (p) {

        function (v) { work.payDivisor = v; })));
    win.appendChild(checkRow('大奖自动停', function () { return work.autoStopBigWin; },

  /* ------------------------------ 数据页 ------------------------------ */
  function renderDataPane(pane) {
    pane.textContent = '';
    var wrap = el('div', 'dfcp-data');

    wrap.appendChild(el('p', null, '导出当前全部配置（含自定义图标/音效的 dataURL）为 JSON 文件；导入会覆盖当前配置并立即生效。'));

    var exp = btn('导出配置 JSON', function () {

        showMsg('已导出 df777-config.json');
      } catch (e) { showMsg('导出失败：' + e.message); }
    }, 'gold wide');
    wrap.appendChild(exp);

    var imp = btn('导入配置 JSON', function () {
      pending = { type: 'cfgjson' };
      fileInput.accept = '.json,application/json';
      fileInput.value = '';
      fileInput.click();
    }, 'wide');
    wrap.appendChild(imp);

    var rst = btn('一键恢复出厂', function () {
      if (!resetArmed) {
        resetArmed = true;
        rst.textContent = '再点一次确认恢复出厂';
        rst.classList.add('danger');
        clearTimeout(resetTimer);
        resetTimer = setTimeout(function () {
          resetArmed = false;
          if (rst.isConnected) { rst.textContent = '一键恢复出厂'; rst.classList.remove('danger'); }
        }, 3000);
        return;
      }
      resetArmed = false;
      clearTimeout(resetTimer);
      var base = fallbackCfg();
      try { if (DF.LOGIC && typeof DF.LOGIC.defaultCfg === 'function') base = DF.LOGIC.defaultCfg(); } catch (e) { /* 忽略 */ }
      base = normalize(base);
      base.icons = {};
      base.sounds = {};
      base.vols = deep(work.vols);   // 保留音量听感设置
      base.sound = !!work.sound;
      work = base;
      emit();
      setTab(curTab);               // 重绘当前页（切页时其余页会重绘）
      showMsg('已恢复出厂设置（保留音量）');
    }, 'danger wide');
    wrap.appendChild(rst);

    wrap.appendChild(el('p', null, '提示：积分、奖池等运行时进度存于游戏存档，此处仅管理配置。'));
    pane.appendChild(wrap);
  }

  /* ------------------------------ 文件选择分发 ------------------------------ */
  function onFilePicked() {
    var f = fileInput.files && fileInput.files[0];
    var req = pending;
    pending = null;
    fileInput.value = '';
    if (!f || !req) return;

    if (req.type === 'icon') {
      readImageToDataURL(f, 128, 'image/png', 0.92, function (dataURL) {
        if (!dataURL) { showMsg('图片读取失败'); return; }
        work.icons[req.id] = dataURL;
        emit();
        setTab('icons');  // 重绘以刷新该行预览
        showMsg('图标已更新：' + (ICON_DEFS.filter(function (d) { return d.id === req.id; })[0] || {}).name);
      });
    } else if (req.type === 'sound') {
      readFileAs(f, 'url', function (dataURL) {
        if (!dataURL) { showMsg('音频读取失败'); return; }
        work.sounds[req.id] = dataURL;
        emit();
        setTab('sound');
        showMsg('音效已更新：' + (CUE_CN[req.id] || req.id));
      });
    } else if (req.type === 'cfgjson') {
      readFileAs(f, 'text', function (text) {
        var obj;
        try { obj = JSON.parse(text); } catch (e) { showMsg('JSON 解析失败'); return; }
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) { showMsg('配置格式不正确'); return; }
        work = normalize(deepMerge(work, obj));
        emit();
        setTab(curTab);
        showMsg('配置已导入并生效');
      });
    }
  }

  /* ------------------------------ 对外 API ------------------------------ */
  function tabKey(t) {
    if (t == null) return null;
    return TAB_ALIAS[t] || (TABS.some(function (x) { return x.key === t; }) ? t : null);
  }
  function mount(containerEl) {
    var host = containerEl || document.body;
    if (container === host && rootEl && rootEl.isConnected) return;
    if (rootEl && rootEl.isConnected && rootEl.parentNode) rootEl.parentNode.removeChild(rootEl);
    if (styleEl && styleEl.parentNode) styleEl.parentNode.removeChild(styleEl);
    container = host;
    buildSkeleton();
    if (visible) { rootEl.hidden = false; rootEl.classList.add('open'); setTab(curTab); }
  }
  function open(tab) {
    if (!rootEl || !rootEl.isConnected) mount(document.body);
    work = normalize(deep((typeof DF !== 'undefined' && DF.cfg) ? DF.cfg : fallbackCfg()));
    var k = tabKey(tab);
    visible = true;
    rootEl.hidden = false;
    void rootEl.offsetWidth;   // 强制回流，保证抽屉滑入过渡生效
    rootEl.classList.add('open');
    setTab(k || curTab || 'icons');
  }
  function close() {
    if (!rootEl) return;
    visible = false;
    rootEl.classList.remove('open');
    setTimeout(function () { if (!visible && rootEl) rootEl.hidden = true; }, 300);
  }
  function isOpen() { return !!visible; }
  function onChange(cb) {
    if (typeof cb !== 'function') return function () {};
    cbs.push(cb);
    return function () {
      var i = cbs.indexOf(cb);
      if (i >= 0) cbs.splice(i, 1);
    };
  }

  return { mount: mount, open: open, close: close, isOpen: isOpen, onChange: onChange };
})();

<script>
/* ===== src/reels.js ===== */
/* 多福巨奖 777 — 滚轮动画引擎：DOM 回收格 + rAF 虚拟滚动 + 落轮回弹 */
window.DF = window.DF || {};
DF.REELS = (function () {
  'use strict';

  var CELL_N = 7;               // 每轮格数：1 上过冲 + 3 可见 + 3 下余量
  var reelEls = [], stripEls = [], cellEls = [], imgEls = [];
  var H = 100;                  // 单格高 px，layout() 实测
  var resolveSrc = function () { return ''; }; // rawId -> 图片 dataURL
  var raf = 0;
  var reels = [];               // 运行时状态
  var mod = function (a, n) { return ((a % n) + n) % n; };

  function makeReel(c) {
    var reel = document.createElement('div');
    reel.className = 'reel';
    var strip = document.createElement('div');
    strip.className = 'strip';
    var cells = [], imgs = [];
    for (var k = 0; k < CELL_N; k++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var img = document.createElement('img');
      img.draggable = false;
      cell.appendChild(img);
      strip.appendChild(cell);
      cells.push(cell); imgs.push(img);
    }
    reel.appendChild(strip);
    return { reel: reel, strip: strip, cells: cells, imgs: imgs };
  }

  function mount(container, cfg) {
    container.innerHTML = '';
    reelEls = []; stripEls = []; cellEls = []; imgEls = []; reels = [];
    for (var c = 0; c < 5; c++) {
      var m = makeReel(c);
      container.appendChild(m.reel);
      reelEls.push(m.reel); stripEls.push(m.strip);
      cellEls.push(m.cells); imgEls.push(m.imgs);
      reels.push({ pos: 0, v: 0, phase: 'idle', view: null, S: 0, t0: 0 });
    }
    layout();
    window.addEventListener('resize', layout);
    window.addEventListener('load', layout);
    if (window.ResizeObserver) new ResizeObserver(layout).observe(container);
    // 字体/图片就绪后再量一次，并连测两帧防止布局抖动
    requestAnimationFrame(function () { requestAnimationFrame(layout); });
    setTimeout(layout, 300);
    setTimeout(layout, 900);
  }

  function layout() {
    for (var c = 0; c < 5; c++) {
      var h = reelEls[c].clientHeight;
      if (h > 0) H = h / 3;
      var w = reelEls[c].clientWidth;
      for (var k = 0; k < CELL_N; k++) {
        cellEls[c][k].style.height = H + 'px';
      }
      stripEls[c].style.height = (H * CELL_N) + 'px';
      reelEls[c].style.setProperty('--cw', w + 'px');
      reelEls[c].style.setProperty('--rowH', H + 'px');
    }
    renderAll();
  }

  // 视图数组：label 与滚动都用它
  function setViews(views, stops) {
    for (var c = 0; c < 5; c++) {
      reels[c].view = views[c];
      reels[c].pos = stops ? stops[c] : Math.floor(Math.random() * views[c].length);
      reels[c].phase = 'idle';
      reelEls[c].classList.remove('blur');
    }
    renderAll();
  }

  function renderAll() {
    for (var c = 0; c < 5; c++) renderReel(c);
  }

  function renderReel(c) {
    var r = reels[c];
    if (!r.view) return;
    var base = Math.floor(r.pos), f = r.pos - base;
    stripEls[c].style.transform = 'translate3d(0,' + (-(1 + f) * H).toFixed(2) + 'px,0)';
    var len = r.view.length;
    for (var k = 0; k < CELL_N; k++) {
      var raw = r.view[mod(base + k - 1, len)];
      var img = imgEls[c][k];
      var gold = raw.charAt(0) === 'g';
      var src = resolveSrc(raw);
      if (img.dataset.raw !== raw || img.dataset.src !== src) {
        img.src = src; img.dataset.raw = raw; img.dataset.src = src;
      }
      cellEls[c][k].classList.toggle('gold', gold && src === img.dataset.src);
    }
  }

  /* ---------- 旋转 ---------- */
  // spinTo(stops, views, opts) -> Promise(allSettled)
  // opts: {turbo, startDelay, stagger, onReelStop(c), forceStopSignal:{stop:false}}
  function spinTo(stops, views, opts) {
    opts = opts || {};
    var turbo = !!opts.turbo;
    var VMAX = turbo ? 52 : 26;              // 格/秒
    var ACC = turbo ? 0.09 : 0.13;           // 加速段秒
    var STAG = turbo ? 55 : 170;             // 逐轮停间隔 ms
    var BASE = turbo ? 260 : 620;            // 首轮最短旋转 ms
    var OVERSHOOT = turbo ? 0.35 : 0.6;      // 过冲格数
    var startAt = performance.now() + (opts.startDelay || 0);
    var promises = [];
    var now0 = performance.now();

    for (var c = 0; c < 5; c++) {
      (function (c) {
        var r = reels[c];
        r.view = views[c];
        r.S = mod(stops[c], views[c].length);
        // 总行程：至少两圈 + 逐轮递增，保证节奏
        var extra = (turbo ? 1 : 2) * views[c].length + c * 3 + 6;
        r.pos = r.S + extra;
        r.phase = 'wait';
        r.v = 0;
        r.t0 = startAt + (opts.startDelay ? 0 : 0);
        r.stopAt = startAt + BASE + c * STAG;
        r.decelDur = turbo ? 240 : 480;
        r.overshoot = OVERSHOOT;
        reelEls[c].classList.add('blur');
        promises.push(new Promise(function (res) { r.resolve = res; }));
      })(c);
    }

    var tPrev = performance.now();
    var iv = 0;
    function frame(t) {
      try {
      var dt = Math.min(0.25, (t - tPrev) / 1000);
      tPrev = t;
      var allDone = true;
      for (var c = 0; c < 5; c++) {
        var r = reels[c];
        if (r.phase === 'done') continue;
        allDone = false;
        if (dt <= 0) continue;
        if (r.phase === 'wait') {
          if (t >= r.t0) { r.phase = 'acc'; r.tp = t; }
          continue;
        }
        if (r.phase === 'acc') {
          var k = Math.min(1, (t - r.tp) / (ACC * 1000));
          r.v = VMAX * (k * k);
          r.pos -= r.v * dt;
          if (k >= 1) { r.phase = 'cruise'; }
        } else if (r.phase === 'cruise') {
          var slam = opts.forceStopSignal && opts.forceStopSignal.stop && t > now0 + 350;
          if (t >= r.stopAt || slam) {
            r.phase = 'decel';
            r.tp = t;
            // 减速目标：落点 + 过冲（沿运动方向再往前）
            var target = r.S - r.overshoot;      // pos 减小方向，过冲 = 更小
            // 保证减速距离 ≥ 当前速度 * 一点半径
            var minDist = r.v * (r.decelDur / 1000) * 0.5;
            while (r.pos - target < minDist) target -= r.view.length;
            r.from = r.pos;
            r.to = target;
          } else {
            r.pos -= r.v * dt;
          }
        }
        if (r.phase === 'decel') {
          var k2 = Math.min(1, (t - r.tp) / r.decelDur);
          var e = 1 - Math.pow(1 - k2, 3);       // easeOutCubic
          r.pos = r.from + (r.to - r.from) * e;
          if (k2 >= 1) {
            r.phase = 'bounce';
            r.tp = t;
            r.from = r.to;
            r.to = r.S;
          }
        } else if (r.phase === 'bounce') {
          var k3 = Math.min(1, (t - r.tp) / 200);
          var eb = Math.sin(k3 * Math.PI / 2);   // easeOutSine 回弹
          r.pos = r.from + (r.to - r.from) * eb;
          if (k3 >= 1) {
            r.pos = r.S;
            r.phase = 'done';
            reelEls[c].classList.remove('blur');
            renderReel(c);
            if (opts.onReelStop) opts.onReelStop(c);
            if (r.resolve) { r.resolve(); r.resolve = null; }
            continue;
          }
        }
        renderReel(c);
      }
      if (allDone) { clearInterval(iv); return; }
      raf = requestAnimationFrame(frame);
      } catch (e) {
        console.error('reel frame error', e);
        raf = requestAnimationFrame(frame);
      }
    }
    // rAF + 定时器双驱动：页面被遮挡 rAF 节流/暂停时仍能走完（后台降速但不停）
    tPrev = performance.now();
    raf = requestAnimationFrame(frame);
    iv = setInterval(function () { frame(performance.now()); }, 120);
    return Promise.all(promises);
  }

  // 立即停（用户拍停）
  function slamStop() {
    if (!slamStop.signal) slamStop.signal = { stop: false };
    slamStop.signal.stop = true;
  }
  function resetSlam() { slamStop.signal = { stop: false }; }

  /* ---------- 高亮 ---------- */
  function cellAt(c, r) { return cellEls[c][r + 1]; }  // 落定后 f=0，行 r → k=r+1
  function highlight(cells, on) {
    cells.forEach(function (p) {
      var el = cellAt(p.c, p.r);
      if (el) el.classList.toggle('hit', !!on);
    });
  }
  function clearHighlight() {
    for (var c = 0; c < 5; c++) for (var k = 0; k < CELL_N; k++) cellEls[c][k].classList.remove('hit');
  }

  return {
    mount: mount, layout: layout, setViews: setViews,
    spinTo: spinTo, slamStop: slamStop, resetSlam: resetSlam,
    highlight: highlight, clearHighlight: clearHighlight,
    setResolver: function (fn) { resolveSrc = fn; renderAll(); },
    cellAt: cellAt
  };
})();

</script>
<script>
/* ===== src/game.js ===== */
/* 多福巨奖 777 — 主线：状态机 / 持久化 / 押注 / 自动 / 免费局 / 选奖 / 演出 / 接线 */
window.DF = window.DF || {};
DF.GAME = (function () {
  'use strict';

  var L = DF.LOGIC, A = DF.AUDIO, R = DF.REELS;
  var noop = function () {};
  var NOOP_FX = new Proxy({ spark: noop, coinRain: noop, bigText: noop, coinBurst: noop,
    confetti: noop, flash: noop, ring: noop, stopAll: noop, init: noop,
    sparkCells: noop, sparkAtReel: noop }, {
    get: function (t, k) { return k in t ? t[k] : noop; }
  });
  function F() { return DF.FX || NOOP_FX; }   // 惰性解析（fx.js 后置装载，缺省空实现）
  var $ = function (id) { return document.getElementById(id); };
  var STATE_KEY = 'df777_state_v1', CFG_KEY = 'df777_config_v1';
  var QS = new URLSearchParams(location.search);

  /* ---------- 配置与状态 ---------- */
  function deepMerge(base, ext) {
    if (ext === null || ext === undefined) return base;
    if (Array.isArray(ext)) return ext.slice();
    if (typeof ext !== 'object') return ext;
    var out = (typeof base === 'object' && base !== null && !Array.isArray(base)) ? Object.assign({}, base) : {};
    Object.keys(ext).forEach(function (k) { out[k] = deepMerge(out[k], ext[k]); });
    return out;
  }
  // ?reset=1 必须在读取任何存储前生效
  if (new URLSearchParams(location.search).get('reset') === '1') {
    try { localStorage.removeItem(STATE_KEY); localStorage.removeItem(CFG_KEY); } catch (e) {}
  }
  var cfg = L.defaultCfg();
  try {
    var savedCfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
    if (savedCfg) cfg = deepMerge(cfg, savedCfg);
  } catch (e) {}

  var S = null;
  function freshState() {
    var pots = {};
    L.POT_ORDER.forEach(function (p) { pots[p] = cfg.jackpots[p].seed; });
    return {
      v: 1, credits: cfg.startCredits, jackpots: pots,
      rails: { mini: 0, minor: 0, major: 0, grand: 0 },
      betIdx: Math.min(2, cfg.betTiers.length - 1),
      stats: { spins: 0, bet: 0, win: 0, maxWin: 0, picks: 0, fs: 0 },
      ts: Date.now(), stripSeed: (Math.random() * 1e9) | 0
    };
  }
  function loadState() {
    try {
      var d = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
      if (d && d.v === 1) {
        d.rails = deepMerge({ mini: 0, minor: 0, major: 0, grand: 0 }, d.rails);
        L.POT_ORDER.forEach(function (p) {
          d.jackpots[p] = Math.max(cfg.jackpots[p].seed, +d.jackpots[p] || cfg.jackpots[p].seed);
        });
        d.stats = deepMerge({ spins: 0, bet: 0, win: 0, maxWin: 0, picks: 0, fs: 0 }, d.stats);
        return d;
      }
    } catch (e) {}
    return null;
  }
  function saveState() {
    if (!S) return;
    S.ts = Date.now();
    try { localStorage.setItem(STATE_KEY, JSON.stringify(S)); } catch (e) {}
  }
  function saveCfg() {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  }

  // 离线奖池漂移：每小时 +seed×0.02%，封顶 +5%
  function offlineDrift() {
    if (!S) return;
    var hrs = Math.max(0, (Date.now() - (S.ts || Date.now())) / 36e5);
    if (hrs < 0.02) return;
    L.POT_ORDER.forEach(function (p) {
      var add = Math.min(hrs * cfg.jackpots[p].seed * 0.0002, cfg.jackpots[p].seed * 0.05);
      S.jackpots[p] += add;
    });
  }

  /* ---------- 工具 ---------- */
  function fmt(n) {
    return '$' + (typeof n === 'number' ? n : 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  var r2 = function (v) { return Math.round(v * 100) / 100; };
  var delay = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var toastTimer = 0;
  function toast(msg, ms) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 2200);
  }
  function countUp(el, from, to, dur, tick) {
    return new Promise(function (res) {
      var t0 = performance.now(), done = false;
      el._skip = function () { done = true; };
      (function step(t) {
        var k = done ? 1 : Math.min(1, (t - t0) / dur);
        var v = from + (to - from) * (1 - Math.pow(1 - k, 2));
        v = to >= from ? Math.max(from, Math.min(to, v)) : Math.min(from, Math.max(to, v));
        el.textContent = fmt(v);
        if (k < 1) requestAnimationFrame(step); else res();
      })(t0);
      if (tick) {
        var iv = setInterval(function () {
          if (done) { clearInterval(iv); return; }
          A.play('countTick', { rate: 1 + Math.random() * 0.3 });
        }, 90);
        setTimeout(function () { clearInterval(iv); }, dur + 150);
      }
    });
  }
  function skippable(ms) {
    return new Promise(function (res) {
      var t = setTimeout(done, ms);
      function done() { clearTimeout(t); document.removeEventListener('pointerdown', done); res(); }
      document.addEventListener('pointerdown', done);
    });
  }

  /* ---------- 全局句柄 ---------- */
  var strips = [], viewBase = [], viewFS = [];
  var busy = false;            // 演出/旋转/选奖进行中
  var fsLeft = 0, fsWinAcc = 0, fsActive = false;
  var autoLeft = 0;            // 0=关；Infinity=∞
  var lastWin = 0;
  var rig = QS.get('rig') || '';

  function buildStrips() {
    strips = L.makeStrips(cfg, S.stripSeed || 20260911);
    rebuildViews();
  }
  function rebuildViews() {
    viewBase = []; viewFS = [];
    for (var c = 0; c < 5; c++) {
      viewBase.push(L.stripView(strips[c], false, cfg));
      viewFS.push(L.stripView(strips[c], true, cfg));
    }
  }
  function viewsFor(fs) { return fs ? viewFS : viewBase; }

  /* ---------- UI 刷新 ---------- */
  function updateBar() {
    $('creditVal').textContent = fmt(S.credits);
    $('betVal').textContent = fmt(bet());
    $('winVal').textContent = fmt(lastWin);
  }
  function bet() { return cfg.betTiers[S.betIdx]; }
  function tier() { return S.betIdx + 1; }

  function updatePots(bump) {
    L.POT_ORDER.forEach(function (p) {
      var el = $('pot-' + p);
      el.querySelector('.pot-val').textContent = fmt(S.jackpots[p]);
      var rail = el.querySelector('.pot-rail');
      var need = cfg.railNeed[p];
      if (need <= 20) {
        if (!rail.classList.contains('dots')) { rail.className = 'pot-rail dots'; }
        if (rail.childElementCount !== need) {
          rail.innerHTML = '';
          for (var i = 0; i < need; i++) rail.appendChild(document.createElement('i'));
        }
        var dots = rail.children;
        for (var j = 0; j < need; j++) dots[j].classList.toggle('on', j < S.rails[p]);
      } else {
        if (!rail.classList.contains('bar')) { rail.className = 'pot-rail bar'; rail.innerHTML = '<i></i>'; }
        rail.firstChild.style.width = Math.min(100, S.rails[p] / need * 100).toFixed(1) + '%';
      }
      el.classList.toggle('full', S.rails[p] >= need);
      if (bump === p || (Array.isArray(bump) && bump.indexOf(p) >= 0)) {
        el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      }
    });
  }
  function updateDots() {
    var d = $('betDots');
    if (d.childElementCount !== cfg.betTiers.length) {
      d.innerHTML = '';
      cfg.betTiers.forEach(function () { d.appendChild(document.createElement('i')); });
    }
    for (var i = 0; i < d.children.length; i++) d.children[i].classList.toggle('on', i <= S.betIdx);
  }
  function updateButtons() {
    var idle = !busy;
    $('btnBetDown').disabled = !idle || fsActive || S.betIdx === 0;
    $('btnBetUp').disabled = !idle || fsActive || S.betIdx >= cfg.betTiers.length - 1;
    $('btnAuto').classList.toggle('on', autoLeft > 0);
    $('btnAuto').querySelector('small').textContent =
      autoLeft === Infinity ? '自动∞' : autoLeft > 0 ? '剩' + autoLeft : '自动';
    $('btnTurbo').classList.toggle('on', !!cfg.turbo);
    $('btnSpin').disabled = false;
    $('spinLabel').textContent = busy && phaseSpin ? '停止' : (fsActive ? '免费' : '旋转');
    $('btnSound').style.opacity = cfg.sound ? 1 : 0.45;
    $('btnSound').firstChild.textContent = cfg.sound ? '🔊' : '🔇';
  }
  var phaseSpin = false;   // 正在滚轮旋转（用于旋转/停止按钮语义）
  function updateFreeBanner() {
    var b = $('freeBanner');
    b.hidden = !fsActive;
    if (fsActive) {
      $('fsLeft').textContent = fsLeft;
      $('fsWin').textContent = fmt(fsWinAcc);
    }
  }

  /* ---------- 图标解析（默认 SVG + 用户覆盖） ---------- */
  function resolveSrc(raw) {
    var ov = cfg.icons && cfg.icons[raw];
    if (ov) return ov;
    if (raw === 'coin') return DF.ART.coin();
    if (raw.indexOf('g_') === 0) return DF.ART.gold(raw.slice(2));
    if (raw === 'gong') return DF.ART.symbol('gong');
    return DF.ART.symbol(raw);
  }

  /* ---------- 旋转核心 ---------- */
  var pendingPicks = [];   // 待选奖的已满轨道 [{pot}]
  var rigQueue = null;     // rig 覆盖的 stops

  function findStop(view, want, row) {
    for (var i = 0; i < view.length; i++) {
      if (view[(i + row) % view.length] === want) return i;
    }
    return null;
  }
  // 测试演出：构造必中 stops
  function applyRig(fs, spinResult) {
    if (!rig) return spinResult;
    var views = viewsFor(fs), stops = spinResult.stops.slice();
    var ok = true;
    function set(sym, row, reels) {
      reels.forEach(function (c) {
        var i = findStop(views[c], sym, row);
        if (i === null) ok = false; else stops[c] = i;
      });
    }
    if (rig === 'win') { set('ingot', 1, [0, 1, 2]); }
    else if (rig === 'bigwin') { set('ingot', 1, [0, 1, 2, 3, 4]); }
    else if (rig === 'fs') { set('gong', 0, [0, 2, 4]); }
    else if (rig === 'gold') { set('g_frog', 1, [0, 2]); }
    if (ok && rig !== 'fs') { /* fs 也走 stops */ }
    rigQueue = null;
    if (ok) { spinResult.stops = stops; spinResult.rigged = rig; }
    rig = '';  // 一次性
    return spinResult;
  }

  function spinRound(fs) {
    return new Promise(function (resolve) {
      if (S.credits < bet() && !fs) { toast('余额不足，请补币'); A.play('error'); resolve(false); return; }
      busy = true; phaseSpin = true; lastWin = 0;
      if (!fs) {
        S.credits = r2(S.credits - bet());
        S.stats.bet = r2(S.stats.bet + bet());
        S.stats.spins++;
        L.POT_ORDER.forEach(function (p) { S.jackpots[p] = r2(S.jackpots[p] + bet() * cfg.jackpots[p].grow); });
      } else {
        fsLeft--;
      }
      updateBar(); updatePots(); updateFreeBanner(); updateButtons();
      $('winVal').textContent = fmt(0);
      R.clearHighlight();
      $('reelMsg').classList.remove('show');

      A.play('spinStart');
      A.startLoop('reelSpin');
      R.resetSlam();

      var res = L.spinOnce(strips, { fs: !!fs, tier: tier(), cfg: cfg, rng: Math.random });
      if (rig) res = applyRig(!!fs, res);
      var stops = res.stops;

      R.spinTo(stops, viewsFor(!!fs), {
        turbo: !!cfg.turbo,
        forceStopSignal: R.slamStop.signal,
        onReelStop: function (c) {
          try {
          A.play('reelStop');
          // 金身落桌提示
          var view = viewsFor(!!fs)[c];
          var tierN = tier();
          for (var r = 0; r < 3; r++) {
            var raw = view[(stops[c] + r) % view.length];
            var pot = L.GOLD_POT[L.GOLD_OF[raw] || ''];
            if (raw.indexOf('g_') === 0 && pot && (fs || tierN >= L.POT_TIER[pot])) {
              A.play('goldLand');
              F().sparkAtReel(c, r);
              break;
            }
          }
          } catch (e) { console.warn('onReelStop', e); }
        }
      }).then(function () {
        A.stopLoop('reelSpin');
        A.play('allStop');
        phaseSpin = false;
        updateButtons();
        var grid = L.gridFromStops(strips, stops, { fs: !!fs, tier: tier(), cfg: cfg });
        resolve({ stops: stops, grid: grid, fs: !!fs });
      });
    });
  }

  /* ---------- 结算与演出 ---------- */
  function settle(round) {
    return new Promise(function (resolve) {
      var fs = round.fs, grid = round.grid;
      var ev = L.evalGrid(grid, bet(), cfg, tier(), fs);
      var gh = L.goldHits(grid);
      var bumped = [];
      for (var p in gh) {
        if (gh[p]) {
          S.rails[p] = Math.min(cfg.railNeed[p], S.rails[p] + gh[p]);
          bumped.push(p);
          A.play('railFill');
          if (S.rails[p] >= cfg.railNeed[p]) pendingPicks.push(p);
        }
      }
      if (bumped.length) updatePots(bumped);

      var win = r2(ev.win + ev.scatterPay);
      var winParts = [];

      // 免费局触发/追加
      var fsTriggered = false;
      if (ev.scatterCount >= 3 && !fs) { fsTriggered = true; }
      if (ev.scatterCount >= 3 && fs) { fsLeft += cfg.freeRetrigger; toast('🎉 再中 ' + cfg.freeRetrigger + ' 次免费局！'); A.play('freeTrigger'); updateFreeBanner(); }

      (function present() {
        var chain = Promise.resolve();
        if (win > 0) {
          lastWin = win;
          $('winVal').textContent = fmt(win);
          var x = win / bet();
          var bigLevel = x >= cfg.bigWinTiers[1] ? 2 : x >= cfg.bigWinTiers[0] ? 1 : 0;
          chain = chain.then(function () {
            if (bigLevel > 0) {
              A.duck(bigLevel === 2 ? 3600 : 2400);
              A.play(bigLevel === 2 ? 'winBig' : 'winMid');
              F().coinRain(bigLevel === 2 ? 46 : 26);
              F().bigText(bigLevel === 2 ? '超级大奖!' : '大奖!', { color: '#ffd257' });
              $('bigWinLabel').textContent = bigLevel === 2 ? '超 级 大 奖' : '大 奖';
              $('bigWinOverlay').hidden = false;
              return countUp($('bigWinAmt'), 0, win, bigLevel === 2 ? 2600 : 1700, true).then(function () {
                return skippable(bigLevel === 2 ? 1500 : 1100);
              }).then(function () { $('bigWinOverlay').hidden = true; });
            }
            A.play('winSmall');
            return countUp($('winVal'), 0, win, Math.min(1600, 350 + win / bet() * 60), true);
          });
          // 逐路展示（去重最多 10 条）
          var seen = {}, ways = [];
          ev.ways.forEach(function (w) {
            var k = w.s + 'x' + w.n;
            if (!seen[k]) { seen[k] = 1; ways.push(w); }
          });
          ways = ways.slice(0, 10);
          ways.forEach(function (w) {
            chain = chain.then(function () {
              R.highlight(w.cells, true);
              var cn = { ingot: '元宝碗', dragon: '金龙', turtle: '金龟', frog: '金蟾', koi: '金鱼' }[w.s] || w.s;
              var msg = $('reelMsg');
              msg.textContent = cn + ' ×' + w.n + '  ' + fmt(w.amt);
              msg.classList.add('show');
              A.play('wayWin');
              F().sparkCells(w.cells);
              return skippable(cfg.turbo ? 380 : 750).then(function () {
                R.highlight(w.cells, false);
                msg.classList.remove('show');
              });
            });
          });
        }
        if (fsTriggered) {
          chain = chain.then(function () {
            A.duck(2600);
            A.play('freeTrigger');
            F().bigText('免费局!', { color: '#ffe9b0', sub: cfg.freeSpins + ' 次' });
            fsActive = true; fsLeft = cfg.freeSpins; fsWinAcc = 0;
            S.stats.fs++;
            updateFreeBanner();
            return delay(1400);
          });
        }
        chain.then(function () { resolve({ win: win, ev: ev }); });
      })();
    });
  }

  /* ---------- 选奖（官方口径：12 金币，结果预定，翻币是演出） ---------- */
  function runPick() {
    return new Promise(function (resolve) {
      var won = L.pickWon(cfg, Math.random);            // 命运已定
      var coins = L.pickPlan(cfg, won, Math.random);    // 12 币布局：中奖池×4 + 其余各×2 + 福×2
      var cnt = { mini: 0, minor: 0, major: 0, grand: 0 };
      var gotEl = $('pickGot'), gridEl = $('pickGrid');
      gotEl.innerHTML = '';
      ['mini', 'minor', 'major', 'grand'].forEach(function (p) {
        var sp = document.createElement('span');
        sp.id = 'pickGot-' + p;
        sp.textContent = L.POT_CN[p] + ' 0/3';
        gotEl.appendChild(sp);
      });
      gridEl.innerHTML = '';
      var coinEls = coins.map(function (pot) {
        var b = document.createElement('button');
        b.className = 'pcoin ' + pot;
        var faceName = pot === 'fu' ? '福' : L.POT_CN[pot];
        var faceEn = pot === 'fu' ? 'FU' : pot.toUpperCase();
        b.innerHTML = '<span class="back"><img src="' + DF.ART.coin() + '" style="width:100%;height:100%"></span>' +
          '<span class="face"><span class="pf-name">' + faceName + '</span><span class="pf-val">' + faceEn + '</span></span>';
        b._pot = pot; b._open = false;
        gridEl.appendChild(b);
        return b;
      });
      $('pickTitle').textContent = '福 娃 选 奖';
      $('pickSub').textContent = '翻开金币 · 集齐 3 枚相同奖名即中该奖池';
      $('pickBonus').hidden = false;
      A.duck(4000);
      A.play('freeTrigger');

      var wonPot = null, idleT = 0, done = false;
      function reveal(b, byUser) {
        if (b._open || done) return;
        b._open = true;
        b.classList.add('open');
        A.play('pickReveal');
        if (cnt[b._pot] !== undefined) {
          cnt[b._pot]++;
          var g = $('pickGot-' + b._pot);
          g.textContent = L.POT_CN[b._pot] + ' ' + Math.min(cnt[b._pot], 3) + '/3';
          g.classList.add('live');
          if (cnt[b._pot] >= 3 && !wonPot) {
            wonPot = b._pot;
            b.classList.add('win');
            finish();
            return;
          }
        }
        if (byUser) {
          var r = b.getBoundingClientRect();
          F().spark(r.left + r.width / 2, r.top + r.height / 2, '#ffd257', 10);
        }
      }
      function finish() {
        done = true;
        clearTimeout(idleT);
        coinEls.forEach(function (b, i) {
          setTimeout(function () {
            if (!b._open) { b._open = true; b.classList.add('open'); }
            b.classList.add('done');
          }, 300 + i * 80);
        });
        setTimeout(function () {
          A.play('pickMatch');
          var amt = S.jackpots[wonPot];
          showJackpotWin(wonPot, amt).then(function () {
            S.credits = r2(S.credits + amt);
            S.stats.win = r2(S.stats.win + amt);
            S.stats.picks++;
            S.jackpots[wonPot] = cfg.jackpots[wonPot].seed;
            // 清零中奖池轨道 + 本批已满轨道
            L.POT_ORDER.forEach(function (p) {
              if (p === wonPot || S.rails[p] >= cfg.railNeed[p]) S.rails[p] = 0;
            });
            pendingPicks = [];
            updateBar(); updatePots();
            $('pickBonus').hidden = true;
            saveState();
            resolve(wonPot);
          });
        }, 300 + coins.length * 80 + 300);
      }
      gridEl.addEventListener('click', function (e) {
        var b = e.target.closest('.pcoin');
        if (!b || b._open || done) return;
        A.play('button');
        reveal(b, true);
      });
      // 20s 无操作自动翻
      (function armIdle() {
        clearTimeout(idleT);
        idleT = setTimeout(function () {
          var rest = coinEls.filter(function (b) { return !b._open && !done; });
          if (rest.length) { reveal(rest[(Math.random() * rest.length) | 0], false); armIdle(); }
        }, 20000);
      })();
    });
  }

  function showJackpotWin(pot, amt) {
    return new Promise(function (res) {
      A.play('jackpot');
      F().coinRain(60);
      F().bigText(L.POT_CN[pot] + '!', { color: '#ffe08a' });
      $('bigWinLabel').textContent = L.POT_CN[pot];
      $('bigWinOverlay').hidden = false;
      countUp($('bigWinAmt'), 0, amt, 2400, true).then(function () {
        return skippable(1600);
      }).then(function () {
        $('bigWinOverlay').hidden = true;
        res();
      });
    });
  }

  /* ---------- 回合编排 ---------- */
  async function playRound(fs) {
    var round = await spinRound(fs);
    if (!round) return false;                       // 余额不足
    var out = await settle(round);
    var win = out.win;

    if (fs) {
      fsWinAcc = r2(fsWinAcc + win);
      S.stats.win = r2(S.stats.win + win);
      S.credits = r2(S.credits + win);
      S.stats.maxWin = Math.max(S.stats.maxWin, win);
      updateBar(); updateFreeBanner();
    } else {
      lastWin = win;
      S.stats.win = r2(S.stats.win + win);
      S.credits = r2(S.credits + win);
      S.stats.maxWin = Math.max(S.stats.maxWin, win);
      updateBar();
    }

    // 免费局循环
    if (fsActive) {
      if (fsLeft > 0) {
        saveState();
        await delay(cfg.turbo ? 350 : 800);
        return playRound(true);
      }
      // 免费局结束
      fsActive = false;
      updateFreeBanner();
      A.play('winMid');
      F().bigText('免费局结束', { color: '#ffe9b0', sub: '共赢 ' + fmt(fsWinAcc) });
      await delay(1600);
    }

    // 选奖（轨道满）
    while (pendingPicks.length) {
      var p = pendingPicks[0];
      await runPick();
      await delay(500);
    }

    // 大奖自动停
    if (autoLeft > 0 && cfg.autoStopBigWin && win >= bet() * cfg.bigWinTiers[0]) {
      autoLeft = 0;
      toast('已按设置停止自动');
    }

    saveState();
    busy = false;
    updateButtons(); updateBar();
    return true;
  }

  function autoNext() {
    if (autoLeft <= 0) return;
    if (S.credits < bet()) { autoLeft = 0; toast('余额不足，自动停止'); updateButtons(); return; }
    if (autoLeft !== Infinity) autoLeft--;
    updateButtons();
    setTimeout(function () { if (!busy && autoLeft >= 0) playRound(false).then(function (ok) { if (ok) autoNext(); }); },
      cfg.turbo ? 350 : 750);
  }

  function startSpin() {
    if (busy) {
      if (phaseSpin) { R.slamStop(); }
      return;
    }
    if (fsActive) return;
    A.unlock();
    playRound(false);
  }

  /* ---------- 菜单 / 赔付表 / 统计 ---------- */
  function renderStats() {
    var g = $('statGrid');
    var st = S.stats;
    var rtp = st.bet > 0 ? (st.win / st.bet * 100).toFixed(1) + '%' : '—';
    g.innerHTML =
      '<div class="st"><label>余额</label><b>' + fmt(S.credits) + '</b></div>' +
      '<div class="st"><label>总旋转</label><b>' + st.spins + '</b></div>' +
      '<div class="st"><label>总押注</label><b>' + fmt(st.bet) + '</b></div>' +
      '<div class="st"><label>总赢分</label><b>' + fmt(st.win) + '</b></div>' +
      '<div class="st"><label>最大单赢</label><b>' + fmt(st.maxWin) + '</b></div>' +
      '<div class="st"><label>实际回报</label><b>' + rtp + '</b></div>' +
      '<div class="st"><label>选奖次数</label><b>' + st.picks + '</b></div>' +
      '<div class="st"><label>免费局触发</label><b>' + st.fs + '</b></div>';
  }

  var SYM_CN = { ingot: '元宝碗', dragon: '金龙', turtle: '金龟', frog: '金蟾', koi: '金鱼', gong: '金锣', wild: '福WILD', A: 'A', K: 'K', Q: 'Q', J: 'J', '10': '10' };
  function renderPaytable() {
    var b = $('paytableBody');
    var rows = L.PREM.concat(L.LOW).map(function (s) {
      var p = L.PAYS[s], img = resolveSrc(s);
      return '<tr><td><img src="' + img + '"> ' + SYM_CN[s] + '</td><td>' + p[3] + '</td><td>' + p[4] + '</td><td>' + p[5] + '</td></tr>';
    }).join('');
    var goldRows = L.PREM.filter(function (s) { return L.GOLD_POT[s]; }).map(function (s) {
      var p = L.GOLD_POT[s];
      return '<tr class="gold-row"><td><img src="' + resolveSrc('g_' + s) + '"> 金' + SYM_CN[s] + '</td><td colspan="3">填充「' + L.POT_CN[p] + '」轨道 ' +
        cfg.railNeed[p] + ' 格 → 福娃选奖</td></tr>';
    }).join('');
    b.innerHTML =
      '<table class="pay-table"><tr><th>符号（每路赢分 = 赔付 × 押注 ÷ ' + cfg.payDivisor + '）</th><th>3连</th><th>4连</th><th>5连</th></tr>' + rows + '</table>' +
      '<table class="pay-table" style="margin-top:10px"><tr><th>金身符号（押注档位解锁）</th><th colspan="3">奖池轨道</th></tr>' + goldRows + '</table>' +
      '<div class="rules">' +
      '<h3>243 路</h3>5 轮 3 行全 ways 玩法：符号从<b>最左轮</b>起在相邻轮出现即连成路，任意行位组合各算一路。' +
      '<h3>福 WILD</h3><img src="' + resolveSrc('wild') + '" style="width:22px;vertical-align:middle"> 福字万能符只出现在 <b>2/3/4 轮</b>，替代除金锣外任意符号，帮你连成更多路。' +
      '<h3>押注档与金身</h3>押注 5 档（' + cfg.betTiers.join('/') + '）：档1 开金蟾、档2 +金鱼、档3 +金龟、档4 +金元宝、档5 全开且所有中奖 <b>×' + cfg.tier5Boost + '</b>。金身落桌为其奖池轨道 +1。' +
      '<h3>四大奖池 · 福娃选奖</h3>任一轨道填满 → 进入选奖：<b>12 枚金币</b>盖置翻牌，集齐 3 枚相同奖名即中该奖池（多福巨奖 <b>' + fmt(S.jackpots.grand) + '</b> 起）。中奖池回落到起点，其余轨道保留。' +
      '<h3>免费局</h3>任意位置 <b>3 个金锣</b> → ' + cfg.freeSpins + ' 次免费局（按触发押注计）；免费局剔除 ' + cfg.fsRemove.join('/') + ' 低符、金身按押注档开启；再中 3 锣 +' + cfg.freeRetrigger + ' 次。' +
      '<h3>大奖演出</h3>单轮赢分 ≥ <b>' + cfg.bigWinTiers[0] + '×</b> 押注中大奖，≥ <b>' + cfg.bigWinTiers[1] + '×</b> 中超级大奖。' +
      '</div>';
    var sideRows = L.PREM.concat(['gong']).slice(0, 6).map(function (s) {
      var p = L.PAYS[s] || { 3: '—', 4: '—', 5: '—' };
      return '<div class="ps-row"><img src="' + resolveSrc(s) + '">' + SYM_CN[s] +
        '<span class="ps-pays">' + p[3] + '/' + p[4] + '/' + p[5] + '</span></div>';
    }).join('');
    $('paySide').innerHTML = sideRows;
    $('paySideL').innerHTML = sideRows;
  }

  /* ---------- 押注 / 自动 / 加速 ---------- */
  function changeBet(d) {
    if (busy || fsActive) { toast('旋转中不能改押注'); A.play('error'); return; }
    var ni = S.betIdx + d;
    if (ni < 0 || ni >= cfg.betTiers.length) { A.play('error'); return; }
    S.betIdx = ni;
    A.play(d > 0 ? 'betUp' : 'betDown');
    updateBar(); updateDots(); updateButtons(); renderPaytable(); saveState();
  }
  function setAuto(n) {
    if (n > 0 && S.credits < bet()) { toast('余额不足，请先补币'); A.play('error'); return; }
    autoLeft = n;
    $('autoModal').hidden = true;
    updateButtons();
    if (autoLeft > 0 && !busy && !fsActive) {
      if (autoLeft !== Infinity) autoLeft--;
      playRound(false).then(function (ok) { if (ok) autoNext(); });
    }
  }

  /* ---------- 弹层 ---------- */
  function openModal(id) { $(id).hidden = false; A.play('button'); }
  document.addEventListener('click', function (e) {
    var x = e.target.closest('[data-close]');
    if (x) { $(x.dataset.close).hidden = true; A.play('button'); }
  });

  function buildAutoList() {
    var list = $('autoList');
    list.innerHTML = '';
    [10, 25, 50, 100, Infinity, 0].forEach(function (n) {
      var b = document.createElement('button');
      b.className = 'mitem';
      b.innerHTML = n === 0 ? '<span class="ic">⏹</span>停止自动' :
        '<span class="ic">⟳</span>自动 ' + (n === Infinity ? '∞（直到手动停）' : n + ' 次');
      b.addEventListener('click', function () { setAuto(n); });
      list.appendChild(b);
    });
    $('autoNote').innerHTML = '自动旋转中遇到<b>免费局/选奖</b>会先演完再停；大奖自动停可在「游戏配置 → 玩法」关闭。';
  }

  /* ---------- 配置面板回调 ---------- */
  function applyAudioCfg() {
    A.setMasterVolume(cfg.sound ? cfg.vols.master : 0);
    A.setBGMVolume(cfg.vols.bgm);
    A.setSFXVolume(cfg.vols.sfx);
    A.applyOverrides(cfg.sounds || {});
  }
  function onCfgChange(newCfg) {
    cfg = deepMerge(L.defaultCfg(), newCfg);
    saveCfg();
    applyAudioCfg();
    R.setResolver(resolveSrc);
    if (S.betIdx >= cfg.betTiers.length) S.betIdx = cfg.betTiers.length - 1;
    buildStrips();
    var fs = fsActive;
    if (!busy) R.setViews(viewsFor(fs), null);
    updateBar(); updateDots(); updatePots(); updateButtons(); renderPaytable(); renderStats();
    toast('配置已生效');
  }

  /* ---------- 事件绑定 ---------- */
  function bindEvents() {
    $('btnSpin').addEventListener('click', startSpin);
    $('btnBetDown').addEventListener('click', function () { A.unlock(); changeBet(-1); });
    $('btnBetUp').addEventListener('click', function () { A.unlock(); changeBet(1); });
    $('btnTurbo').addEventListener('click', function () {
      cfg.turbo = !cfg.turbo; A.play('button'); updateButtons(); saveCfg();
    });
    $('btnAuto').addEventListener('click', function () {
      A.unlock(); A.play('button');
      if (autoLeft > 0) { setAuto(0); } else { openModal('autoModal'); }
    });
    $('btnSound').addEventListener('click', function () {
      cfg.sound = !cfg.sound; applyAudioCfg(); updateButtons(); saveCfg();
      if (cfg.sound) { A.unlock(); A.startLoop('bgm'); toast('声音开'); } else toast('声音关');
    });
    $('btnMenu').addEventListener('click', function () { renderStats(); openModal('menuModal'); });
    $('miPaytable').addEventListener('click', function () { renderPaytable(); openModal('paytableModal'); });
    $('miConfig').addEventListener('click', function () {
      $('menuModal').hidden = true;
      DF.CONFIG_PANEL.open();
    });
    $('miRefill').addEventListener('click', function () {
      S.credits = r2(S.credits + 10000);
      A.play('refill'); F().coinRain(18);
      updateBar(); renderStats(); saveState();
      toast('已补充 10,000，玩得开心！');
    });
    $('miResetRun').addEventListener('click', function () {
      localStorage.removeItem(STATE_KEY);
      localStorage.removeItem(CFG_KEY);
      location.replace(location.pathname + '?fresh=' + Date.now());
    });
    $('autoModal').addEventListener('click', function (e) { if (e.target === this) this.hidden = true; });
    $('bigWinOverlay').addEventListener('click', function () { this.hidden = true; });
    $('bigWinOverlay').addEventListener('pointerdown', function () {
      var el = $('bigWinAmt'); if (el._skip) el._skip();
    });

    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space') { e.preventDefault(); startSpin(); }
      else if (e.code === 'ArrowUp') changeBet(1);
      else if (e.code === 'ArrowDown') changeBet(-1);
    });

    // 首次手势：解锁音频 + BGM
    var once = function () {
      A.unlock();
      if (cfg.sound) A.startLoop('bgm');
      document.removeEventListener('pointerdown', once);
      document.removeEventListener('keydown', once);
    };
    document.addEventListener('pointerdown', once);
    document.addEventListener('keydown', once);

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) saveState();
    });
    window.addEventListener('beforeunload', saveState);
    window.addEventListener('pagehide', saveState);
  }

  /* ---------- 侧赔付表 / 顶屏 ---------- */
  function buildTop() {
    $('logoBox').innerHTML = '<img src="' + DF.ART.logo() + '" alt="多福巨奖" style="width:100%;height:100%">';
    $('mainScreen').insertAdjacentHTML('afterbegin',
      '<img id="mainBg" src="' + DF.ART.bgMain() + '" alt="">');
    $('topScreen').insertAdjacentHTML('afterbegin',
      '<img id="topBg" src="' + DF.ART.bgTop() + '" alt="">');
  }

  /* ---------- 测试钩子 ---------- */
  function exposeTestHooks() {
    window.__df = {
      version: '1.0',
      get state() { return S; },
      get cfg() { return cfg; },
      get fs() { return { active: fsActive, left: fsLeft, acc: fsWinAcc }; },
      get busy() { return busy; },
      get pendingPicks() { return pendingPicks.slice(); },
      grid: function () {
        // 当前落定网格
        var out = [];
        for (var c = 0; c < 5; c++) {
          var col = [];
          for (var r = 0; r < 3; r++) {
            var cell = R.cellAt(c, r);
            col.push(cell ? (cell.querySelector('img').dataset.raw || '?') : '?');
          }
          out.push(col);
        }
        return out;
      },
      spin: function () { startSpin(); },
      rig: function (name) { rig = name; },
      setCredits: function (v) { S.credits = r2(v); updateBar(); saveState(); },
      fillRail: function (pot, n) {
        S.rails[pot] = n == null ? cfg.railNeed[pot] : n;
        if (S.rails[pot] >= cfg.railNeed[pot] && pendingPicks.indexOf(pot) < 0) pendingPicks.push(pot);
        updatePots();
      },
      setAuto: setAuto, save: saveState,
      fmt: fmt
    };
  }

  /* ---------- 启动 ---------- */
  function boot() {
    S = loadState() || freshState();
    offlineDrift();

    buildTop();
    R.mount($('reelBox'));
    R.setResolver(resolveSrc);
    buildStrips();
    R.setViews(viewBase, null);
    layoutTopRails();

    if (DF.FX && DF.FX.init) {
      DF.FX.init($('fxLayer'));
      DF.FX.sparkCells = function (cells) {
      cells.forEach(function (p) {
        var el = R.cellAt(p.c, p.r);
        if (!el) return;
        var b = el.getBoundingClientRect();
        F().spark(b.left + b.width / 2, b.top + b.height / 2, '#ffd257', 8);
      });
    };
      DF.FX.sparkAtReel = function (c, r) { DF.FX.sparkCells([{ c: c, r: r }]); };
    }
    applyAudioCfg();
    if (QS.get('muted') === '1') { cfg.sound = false; applyAudioCfg(); }

    if (DF.CONFIG_PANEL) {
      DF.CONFIG_PANEL.mount($('configMount'));
      DF.CONFIG_PANEL.onChange(onCfgChange);
    }

    updateBar(); updateDots(); updatePots(); updateButtons(); updateFreeBanner();
    renderPaytable(); buildAutoList(); renderStats();
    bindEvents();
    exposeTestHooks();

    if (QS.get('bet')) {
      var idx = cfg.betTiers.indexOf(+QS.get('bet'));
      if (idx >= 0) { S.betIdx = idx; updateBar(); updateDots(); }
    }
    if (QS.get('auto')) setAuto(+QS.get('auto') || 0);

    setTimeout(function () {
      if (!localStorage.getItem(STATE_KEY)) toast('欢迎光临！已赠送 ' + fmt(S.credits) + ' 开始游戏');
      else toast('已恢复上次进度');
    }, 400);
  }

  function layoutTopRails() { updatePots(); }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return { boot: boot };
})();

</script>

</body>
</html>
