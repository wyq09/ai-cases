<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>多福巨奖 CONFIG_PANEL 预览</title>
<style>
  body{background:#1c0726;margin:0;font-family:Arial,sans-serif;color:#e8b455}
  #pagePad{padding:18px;font-size:13px;line-height:1.8}
  #onChangeLog{position:fixed;left:10px;top:10px;z-index:200;background:rgba(0,0,0,.65);border:1px solid #d9a83f;
    border-radius:8px;padding:6px 10px;font-size:11px;color:#9fe8b0;max-width:220px;word-break:break-all}
</style>
</head>
<body>
<div id="pagePad">
  <h3>CONFIG_PANEL 预览（stub ART/AUDIO + DF.LOGIC 默认 cfg）</h3>
  <p>?tab=icons|sound|play|data 可直接打开指定标签。</p>
  <p>背景内容用于检查遮罩与抽屉层叠。</p>
</div>
<div id="onChangeLog">onChange: 0</div>
<script>/* 调试：把未捕获错误显示出来 */
window.addEventListener('error', function (e) {
  var d = document.getElementById('onChangeLog');
  d.textContent = 'ERROR: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno;
  d.style.color = '#ff8f7a';
});</script>
<style>/* 截图/回归用：跳过过渡动画，直接呈现终态 */
  .dfcp-root,.dfcp-root *{transition:none!important;animation:none!important}
</style>
<div id="configMount"></div>

<script src="../src/logic.js"></script>
<script src="../src/config-panel.js"></script>
<script>
/* ---- stub DF.ART（简易占位图，独立于 art.js） ---- */
window.DF = window.DF || {};
DF.ART = (() => {
  const PAL = { '10':'#7ca8f2', J:'#7cd0f2', Q:'#7cf2c9', K:'#9df27c', A:'#f2e27c',
    koi:'#f29a7c', frog:'#7cf2a8', turtle:'#7cc9f2', dragon:'#f2c97c', ingot:'#f2ae7c',
    gong:'#e07c5a', wild:'#f25a7c', koiG:'#ffd257', frogG:'#ffd257', turtleG:'#ffd257', ingotG:'#ffd257' };
  function svg(txt){ return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">'+txt+'</svg>'); }
  function disc(color, label, ring){
    return svg('<circle cx="50" cy="50" r="40" fill="'+color+'" stroke="'+(ring||'#5c0703')+'" stroke-width="6"/>'+
      '<text x="50" y="63" font-size="40" font-weight="bold" text-anchor="middle" fill="#3a0a04">'+label+'</text>');
  }
  return {
    symbol(id){ return disc(PAL[id]||'#ccc', id.length>2 ? id.slice(0,2) : id); },
    gold(id){ return disc(PAL[id+'G']||'#ffd257', (id||'').slice(0,2), '#e02c1d'); },
    coin(){ return disc('#f2c14e','福','#a8721f'); },
    logo(){ return svg('<rect width="100" height="100" fill="#8f0f08"/><text x="50" y="60" font-size="26" text-anchor="middle" fill="#ffd257">LOGO</text>'); }
  };
})();
/* ---- stub DF.AUDIO ---- */
DF.AUDIO = {
  names: ['bgm','reelSpin','reelStop','allStop','betUp','betDown','button','goldLand','railFill',
    'countTick','wayWin','winSmall','winMid','winBig','jackpot','freeTrigger','pickReveal',
    'pickMatch','coinRain','refill','error'],
  play(){}, applyOverrides(){}
};

/* ---- DF.cfg = 逻辑默认 ---- */
DF.cfg = DF.LOGIC.defaultCfg();

/* ---- 挂载面板 ---- */
DF.CONFIG_PANEL.mount(document.getElementById('configMount'));
DF.CONFIG_PANEL.onChange(function (cfg) {
  DF.cfg = cfg;  // 模拟主线：应用 + 持久化
  const n = parseInt((document.getElementById('onChangeLog').dataset.n || '0'), 10) + 1;
  document.getElementById('onChangeLog').dataset.n = n;
  document.getElementById('onChangeLog').textContent =
    'onChange: ' + n + ' 次 | startCredits=' + cfg.startCredits + ' icons=' + Object.keys(cfg.icons).length;
});

const m = location.search.match(/tab=(\w+)/);
DF.CONFIG_PANEL.open(m ? m[1] : 'icons');
if (/scroll=1/.test(location.search)) {   // 截图用：滚到页底
  setTimeout(function () {
    const body = document.querySelector('.dfcp-body');
    if (body) body.scrollTop = body.scrollHeight;
  }, 60);
}
</script>
</body>
</html>
