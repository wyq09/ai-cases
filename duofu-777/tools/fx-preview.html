<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DF.FX 特效预览 — 多福巨奖 777</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #7a1440 0%, #4a0a2e 46%, #1c0316 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #ffe9b0; user-select: none;
  }
  #logo {
    position: fixed; left: 50%; top: 12%; transform: translateX(-50%);
    font-size: clamp(34px, 7vw, 64px); font-weight: 900; letter-spacing: .12em;
    background: linear-gradient(180deg, #fff8dc 5%, #ffe9a2 32%, #ffcf4d 55%, #eda91c 78%, #ffc23a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 2px #6e060d; text-align: center; pointer-events: none;
  }
  #sub { position: fixed; left: 50%; top: calc(12% + clamp(44px, 8vw, 76px)); transform: translateX(-50%);
    font-size: 13px; letter-spacing: .3em; color: #d9a441; opacity: .8; pointer-events: none; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 14px 10px 16px;
    background: linear-gradient(180deg, rgba(28,3,22,0), rgba(40,3,8,.9) 34%);
  }
  #panel button {
    appearance: none; cursor: pointer; pointer-events: auto;
    font: 800 13px/1 "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: .08em;
    color: #6e060d; padding: 10px 14px; border-radius: 9px;
    background: linear-gradient(180deg, #ffe9a2, #ffcf4d 55%, #e8a51e);
    border: 1px solid #8a5a10; box-shadow: 0 2px 0 #7a4a00, 0 4px 10px rgba(0,0,0,.45);
  }
  #panel button:active { transform: translateY(2px); box-shadow: 0 0 0 #7a4a00, 0 2px 6px rgba(0,0,0,.45); }
  #panel button.stop { background: linear-gradient(180deg, #e07070, #c31432 55%, #8a0f20); color: #ffe9c0; border-color: #4d0308; box-shadow: 0 2px 0 #4d0308, 0 4px 10px rgba(0,0,0,.45); }
  #reel {
    position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%);
    display: flex; gap: 10px; padding: 14px; border-radius: 16px;
    background: linear-gradient(180deg, #5e0a14, #36050c);
    border: 3px solid #c98a12; box-shadow: inset 0 0 30px rgba(0,0,0,.6), 0 10px 30px rgba(0,0,0,.5);
    pointer-events: none;
  }
  #reel span {
    width: 52px; height: 52px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; color: #ffd964;
    background: radial-gradient(circle at 50% 32%, #a1307e, #420d44 75%);
    border: 1.5px solid #8a5a10;
  }
  #fxLayer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
</style>
</head>
<body>
  <div id="logo">多福巨奖 777</div>
  <div id="sub">FX PARTICLE PREVIEW</div>
  <div id="reel"><span>福</span><span>龙</span><span>777</span><span>蟾</span><span>锣</span></div>
  <div id="fxLayer"></div>
  <div id="panel"></div>

  <!-- 截图自检：headless 下用 --virtual-time-budget=毫数 控制拍摄时机（配合下方自动演示循环） -->
  <script src="../src/fx.js"></script>
  <script>
  (function () {
    const FX = DF.FX;
    FX.init(document.getElementById('fxLayer'));
    const cx = () => innerWidth / 2, cy = () => innerHeight * 0.44;

    const acts = {
      burst:  function () { FX.coinBurst(cx(), cy(), 46); FX.ring(cx(), cy(), '#ffd964'); },
      rain:   function () { FX.coinRain(70); FX.flash('#ffdf8e', .22); },
      conf:   function () { FX.confetti(110); },
      spark:  function () { FX.spark(cx(), cy(), '#ffd964', 34); FX.spark(cx() - 160, cy() + 90, '#ff6a4a', 20); },
      flash:  function () { FX.flash('#ffd964', .6); },
      ring:   function () { FX.ring(cx(), cy(), '#ff5a4a'); FX.ring(cx(), cy(), '#ffd964'); },
      big1:   function () { FX.bigText('大奖!'); FX.coinBurst(cx(), cy(), 40); },
      big2:   function () { FX.bigText('免费局', { sub: '10 次' }); FX.confetti(90); },
      big3:   function () { FX.bigText('多福巨奖', { sub: '共赢 $123.00', scale: 1.05 }); FX.coinRain(60); },
      big4:   function () { FX.bigText('多福巨奖', { color: '#ffffff', sub: 'GRAND JACKPOT' }); },
      stop:   function () { FX.stopAll(); }
    };
    const panel = document.getElementById('panel');
    Object.keys(acts).forEach(function (k) {
      const b = document.createElement('button');
      b.textContent = { burst: '金币喷泉', rain: '金币雨', conf: '红金彩带', spark: '星光迸发',
        flash: '全屏闪光', ring: '冲击波', big1: '大字·大奖!', big2: '大字·免费局(sub)',
        big3: '大字·共赢(sub)', big4: '大字·自定义色', stop: '全部停止' }[k];
      if (k === 'stop') b.className = 'stop';
      b.addEventListener('click', acts[k]);
      panel.appendChild(b);
    });

    /* #only=burst|rain|conf|spark|flash|ring|big1..big4 → 只重复触发单个特效（截图定点验证） */
    const only = (location.hash.match(/only=(\w+)/) || [])[1];
    if (only && acts[only]) { setTimeout(acts[only], 350); setInterval(acts[only], 220); return; }

    /* 自动演示循环（供 headless 截图 / 挂机预览） */
    const demos = [
      function () {                                             // 大奖组合
        acts.big1();
        setTimeout(function () { FX.spark(cx(), cy(), '#ffd964', 30); FX.ring(cx(), cy(), '#ffd964'); FX.flash('#ffdf8e', .25); }, 500);
      },
      function () { acts.rain(); },
      function () { acts.big2(); acts.conf(); },
      function () { acts.big3(); FX.confetti(70); },
      function () { acts.spark(); FX.ring(cx(), cy(), '#ff5a4a'); }
    ];
    let di = 0;
    const next = function () { demos[di % demos.length](); di++; };
    setTimeout(next, 350);
    setInterval(next, 3200);
  })();
  </script>
</body>
</html>
