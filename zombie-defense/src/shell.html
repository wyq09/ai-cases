<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>僵尸防线 · 孤哨</title>
<style>
/*STYLE_INLINE*/
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-cell" id="hudWave"><span class="lab">波次</span><b id="hwWave">1</b></div>
        <div class="hud-cell"><span class="lab">击杀</span><b id="hwKills">0</b></div>
        <div class="hud-cell cur"><svg class="ic"><use href="#i-coin"/></svg><b id="hwCoin">0</b></div>
        <div class="hud-cell cur"><svg class="ic"><use href="#i-dia"/></svg><b id="hwDia">0</b></div>
        <div class="hud-cell lv"><span class="lab">LV</span><b id="hwLv">1</b><i id="xpbar"><u id="xpfill"></u></i></div>
        <button class="hud-btn" id="btnSpeed" aria-label="倍速">×1</button>
        <button class="hud-btn" id="btnPause" aria-label="暂停"><svg class="ic"><use href="#i-pause"/></svg></button>
      </div>
      <div id="skillDock" class="hidden"></div>
      <div id="waveBanner" class="hidden"></div>
    </div>
    <div id="overlay" class="hidden"></div>
  </div>
  <svg id="icons" xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#f2c14e" stroke="#8a6420" stroke-width="1.6"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="#b8862e" stroke-width="1.4"/><path d="M12 8.6v6.8M9.8 10.2h4.4" stroke="#8a6420" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-dia" viewBox="0 0 24 24"><path d="M12 2.8 20 9.4 12 21.2 4 9.4Z" fill="#7dd3e0" stroke="#2e7f96" stroke-width="1.5" stroke-linejoin="round"/><path d="M4 9.4h16M12 2.8l-3.4 6.6L12 21.2l3.4-11.8Z" fill="none" stroke="#bdeef7" stroke-width="1.1" opacity=".8"/></symbol>
    <symbol id="i-gem" viewBox="0 0 24 24"><path d="M7 3h10l4 6-9 12L3 9Z" fill="#ff5ce1" stroke="#9b2f88" stroke-width="1.4" stroke-linejoin="round"/><path d="M3 9h18M7 3l2 6 3 12M17 3l-2 6-3 12" fill="none" stroke="#ffc9f2" stroke-width="1" opacity=".75"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.6" height="14" rx="1" fill="currentColor"/><rect x="13.9" y="5" width="3.6" height="14" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.4v13.2L19 12Z" fill="currentColor"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L13 19V5L7.6 9.5Z" fill="currentColor"/><path d="M15.8 8.6a5 5 0 0 1 0 6.8M18.2 6.4a8.2 8.2 0 0 1 0 11.2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L13 19V5L7.6 9.5Z" fill="currentColor"/><path d="m16 9.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 4.5 5 12h4.2v7.5h5.6V12H19Z" fill="currentColor"/></symbol>
    <symbol id="i-chest" viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="11.5" rx="1.6" fill="currentColor" opacity=".28" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 12.6h17M10.3 12.6v3.2h3.4v-3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 11a3.4 3.4 0 0 1 3.4-3.4h10.2A3.4 3.4 0 0 1 20.5 11" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-pay" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M6.4 14.8h4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-skull" viewBox="0 0 24 24"><path d="M12 3c4.7 0 8 3.2 8 7.6 0 2.6-1.2 4.3-2.8 5.4l-.4 3.2a1.4 1.4 0 0 1-1.4 1.2H8.6a1.4 1.4 0 0 1-1.4-1.2l-.4-3.2C5.2 14.9 4 13.2 4 10.6 4 6.2 7.3 3 12 3Z" fill="currentColor"/><circle cx="9" cy="11" r="2" fill="#0b1016"/><circle cx="15" cy="11" r="2" fill="#0b1016"/><path d="M12 13.6 11 16h2Z" fill="#0b1016"/></symbol>
  </svg>
</div>
<script>
/*RESET_INLINE*/
/*MODULE_SCRIPTS*/
</script>
</body>
</html>
