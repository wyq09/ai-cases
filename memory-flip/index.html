<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F6EFE2">
<title>翻牌赢好礼 · 记忆翻牌</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { overflow: hidden; position: fixed; inset: 0; }
  body {
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    background: #E8DFCC;
    color: #2B2622;
  }
  button { font-family: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
  img { display: block; -webkit-user-drag: none; }

  /* ===== 通高列 ===== */
  #mf-app {
    position: relative; height: 100dvh; max-height: 100dvh;
    width: min(100vw, 410px); margin: 0 auto;
    background: #F6EFE2;
    background-image: radial-gradient(rgba(58,46,36,.055) 1px, transparent 1.2px);
    background-size: 16px 16px;
    border-left: 1px solid rgba(58,46,36,.14); border-right: 1px solid rgba(58,46,36,.14);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  @media (min-width: 480px) {
    #mf-app { border-radius: 0; }
  }

  /* ===== 顶栏 ===== */
  #mf-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 14px 8px;
    border-bottom: 2px solid #2B2622;
    background: #F6EFE2;
    position: relative; z-index: 25; /* 盖过封面：开始页也能用声音/设置 */
  }
  #mf-top .brand { display: flex; align-items: center; gap: 9px; }
  #mf-top .seal {
    width: 34px; height: 34px; background: #B93A2B; color: #FFF6E8;
    border: 2px solid #3A2E24; border-radius: 6px;
    box-shadow: 2px 2px 0 rgba(58,46,36,.85);
    display: grid; place-items: center;
    font-family: "Songti SC", "STSong", "SimSun", serif; font-weight: 900; font-size: 19px;
    transform: rotate(-4deg);
  }
  #mf-top h1 { font-size: 19px; font-weight: 900; letter-spacing: 1px; }
  #mf-top h1 small { display: block; font-size: 10px; font-weight: 600; letter-spacing: 3px; color: #8F2B20; }
  #mf-top .ops { display: flex; gap: 8px; }
  #mf-top .ops button {
    width: 36px; height: 36px; border: 2px solid #3A2E24; border-radius: 8px;
    background: #FFF9EE; box-shadow: 2px 2px 0 rgba(58,46,36,.85);
    display: grid; place-items: center; transition: transform .06s, box-shadow .06s;
  }
  #mf-top .ops button:active { transform: translate(2px, 2px); box-shadow: none; }
  #mf-top .ops svg { width: 19px; height: 19px; }

  /* ===== HUD ===== */
  #mf-hud { padding: 10px 14px 6px; position: relative; z-index: 4; }
  #mf-hud .timerow { display: flex; align-items: center; gap: 9px; }
  #mf-hud .bar {
    flex: 1; height: 12px; border: 2px solid #3A2E24; border-radius: 7px;
    background: #FFF9EE; overflow: hidden;
  }
  #mf-hud .bar i {
    display: block; height: 100%; width: 100%;
    background: #B93A2B;
    transition: width .25s linear;
  }
  #mf-hud .bar i.low { background: #8F2B20; animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .55; } }
  #mf-time-num { font-size: 14px; font-weight: 900; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  #mf-hud .stats {
    display: flex; align-items: center; gap: 14px; margin-top: 7px;
    font-size: 12px; color: #6B5F52;
  }
  #mf-hud .stats b { font-size: 14px; color: #2B2622; font-variant-numeric: tabular-nums; }
  #mf-hud .stats .div { width: 1px; height: 12px; background: rgba(58,46,36,.25); }
  #mf-combo {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 1px 8px; border: 2px solid #8F2B20; border-radius: 6px;
    background: #F4D8A8; color: #8F2B20; font-weight: 900;
  }
  #mf-combo.pop { animation: comboPop .28s cubic-bezier(.3,1.6,.5,1); }
  @keyframes comboPop { 40% { transform: scale(1.28) rotate(-3deg); } }
  #mf-combo[hidden] { display: none; }

  /* ===== 收集栏 ===== */
  #mf-tray { padding: 2px 14px 8px; position: relative; z-index: 4; }
  #mf-tray .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #mf-tray .cap { font-size: 11px; color: #6B5F52; margin-right: 4px; white-space: nowrap; }
  #mf-tray .cap b { color: #8F2B20; }
  #mf-tray .slot {
    width: 30px; height: 30px; border: 2px dashed rgba(58,46,36,.35); border-radius: 50%;
    background: rgba(255,249,238,.6); display: grid; place-items: center; overflow: hidden;
  }
  #mf-tray .slot img { width: 82%; height: 82%; opacity: 0; transform: scale(.2); }
  #mf-tray .slot.got { border: 2px solid #3A2E24; background: #F4D8A8; box-shadow: 2px 2px 0 rgba(58,46,36,.7); }
  #mf-tray .slot.got img { opacity: 1; transform: scale(1); transition: transform .3s cubic-bezier(.3,1.8,.5,1), opacity .15s; }

  /* ===== 牌桌 ===== */
  #mf-board {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: repeat(var(--cols, 4), var(--cw, 80px));
    grid-auto-rows: var(--ch, 106px);
    gap: clamp(6px, 1.6vw, 10px);
    justify-content: center; align-content: center;
    padding: 6px 14px calc(14px + env(safe-area-inset-bottom));
    position: relative; z-index: 3;
  }
  .card { position: relative; width: var(--cw, 80px); height: var(--ch, 106px); perspective: 700px; display: block; padding: 0; }
  .card-inner {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.25, .9, .35, 1.12);
  }
  .card.open .card-inner, .card.peek .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 8px; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 2px solid #3A2E24; box-shadow: 3px 3px 0 rgba(58,46,36,.8);
  }
  .face.back { background: #A93426; }
  .face.back img { width: 100%; height: 100%; object-fit: cover; }
  .face.front {
    transform: rotateY(180deg);
    background: #FFF9EE;
    display: grid; place-items: center;
  }
  .face.front img { width: 76%; height: 76%; object-fit: contain; }
  .card:active .card-inner { transition-duration: .3s; }
  .card.matched { pointer-events: none; }
  .card.matched .face.front { border-color: #C99A3C; box-shadow: 3px 3px 0 rgba(201,154,60,.55); }
  .card.matched .face.front::after {
    content: ""; position: absolute; right: 3px; top: 3px; width: 10px; height: 10px;
    background: #C99A3C; border-radius: 50%; border: 1.5px solid #3A2E24;
  }
  .card.wrong { animation: shake .4s; }
  @keyframes shake {
    20% { transform: translateX(-4px); } 40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); } 80% { transform: translateX(2px); }
  }
  .card.hit { animation: hitPop .35s cubic-bezier(.3,1.8,.5,1); }
  @keyframes hitPop { 45% { transform: scale(1.09); } }

  /* ===== 封面 ===== */
  #mf-cover {
    position: absolute; inset: 0; z-index: 20;
    background: #F6EFE2;
    background-image: radial-gradient(rgba(58,46,36,.055) 1px, transparent 1.2px);
    background-size: 16px 16px;
    display: flex; flex-direction: column;
    padding: calc(70px + env(safe-area-inset-top)) 22px calc(16px + env(safe-area-inset-bottom));
    overflow-y: auto; overscroll-behavior: contain;
    transition: transform .4s cubic-bezier(.4,0,.2,1), opacity .35s;
  }
  #mf-cover.off { transform: translateY(-14px); opacity: 0; pointer-events: none; }
  #mf-cover .hero { text-align: center; padding: 10px 0 4px; }
  #mf-cover .hero .seal {
    width: 58px; height: 58px; margin: 0 auto 12px;
    background: #B93A2B; color: #FFF6E8;
    border: 2.5px solid #3A2E24; border-radius: 10px;
    box-shadow: 3px 3px 0 rgba(58,46,36,.85);
    display: grid; place-items: center;
    font-family: "Songti SC", "STSong", "SimSun", serif; font-weight: 900; font-size: 32px;
    transform: rotate(-5deg);
  }
  #mf-cover .hero h2 {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 34px; font-weight: 900; letter-spacing: 4px; color: #B93A2B;
  }
  #mf-cover .hero .sub { margin-top: 6px; font-size: 12px; letter-spacing: 5px; color: #6B5F52; }
  #mf-cover .rules { margin: 18px 0 0; border-top: 2px solid #2B2622; }
  #mf-cover .rules li {
    list-style: none; display: flex; gap: 10px; align-items: baseline;
    padding: 9px 2px; border-bottom: 1px solid rgba(58,46,36,.2);
    font-size: 13px; line-height: 1.5;
  }
  #mf-cover .rules li i { font-style: normal; font-weight: 900; color: #B93A2B; font-size: 12px; }
  #mf-cover .sec { margin-top: 16px; font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #6B5F52; }
  #mf-diff { display: flex; margin-top: 8px; border: 2px solid #3A2E24; border-radius: 8px; overflow: hidden; background: #FFF9EE; box-shadow: 3px 3px 0 rgba(58,46,36,.85); }
  #mf-diff button {
    flex: 1; padding: 10px 0 8px; text-align: center; font-size: 13px; font-weight: 700;
    border-right: 2px solid #3A2E24; color: #2B2622;
  }
  #mf-diff button:last-child { border-right: 0; }
  #mf-diff button small { display: block; font-size: 10px; font-weight: 500; color: #6B5F52; margin-top: 1px; }
  #mf-diff button.on { background: #B93A2B; color: #FFF6E8; }
  #mf-diff button.on small { color: #F4D8A8; }
  #mf-best { margin-top: 10px; font-size: 12px; color: #6B5F52; min-height: 18px; }
  #mf-best b { color: #8F2B20; }
  #mf-btn-start {
    margin-top: 16px; padding: 15px 0;
    background: #B93A2B; color: #FFF6E8;
    border: 2.5px solid #3A2E24; border-radius: 10px;
    box-shadow: 4px 4px 0 rgba(58,46,36,.9);
    font-size: 18px; font-weight: 900; letter-spacing: 6px;
    transition: transform .06s, box-shadow .06s;
  }
  #mf-btn-start:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 rgba(58,46,36,.9); }
  #mf-btn-start[disabled] { background: #B7A893; color: #F6EFE2; }
  #mf-plays { margin-top: 10px; text-align: center; font-size: 12px; color: #6B5F52; min-height: 16px; }
  #mf-plays b { color: #8F2B20; }
  #mf-cover .foot { margin-top: auto; padding-top: 14px; text-align: center; font-size: 10px; letter-spacing: 2px; color: rgba(58,46,36,.4); }

  /* ===== 结算 ===== */
  #mf-result {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(43,38,34,.5);
    display: grid; place-items: center; padding: 20px;
  }
  #mf-result[hidden] { display: none; }
  #mf-result .paper {
    width: min(100%, 330px);
    background: #FFF9EE;
    background-image: radial-gradient(rgba(58,46,36,.05) 1px, transparent 1.2px);
    background-size: 14px 14px;
    border: 2.5px solid #3A2E24; border-radius: 12px;
    box-shadow: 6px 6px 0 rgba(43,38,34,.55);
    padding: 22px 20px calc(18px);
    text-align: center;
    animation: paperIn .38s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes paperIn { from { transform: translateY(26px) scale(.94); opacity: 0; } }
  #mf-result .rt { font-size: 12px; letter-spacing: 4px; color: #6B5F52; }
  #mf-result h3 { font-family: "Songti SC", "STSong", serif; font-size: 26px; font-weight: 900; color: #B93A2B; margin-top: 2px; letter-spacing: 3px; }
  #mf-result .starRow { display: flex; justify-content: center; gap: 6px; margin: 10px 0 4px; }
  #mf-result .starRow svg { width: 34px; height: 34px; }
  #mf-result .starRow svg path { fill: #C99A3C; stroke: #3A2E24; stroke-width: 1.6; }
  #mf-result .starRow .st { opacity: .22; transform: scale(.85); }
  #mf-result .starRow .st.on { opacity: 1; animation: starPop .4s cubic-bezier(.3,1.8,.5,1) backwards; }
  @keyframes starPop { 55% { transform: scale(1.35) rotate(8deg); } }
  #mf-result .bigscore { font-size: 40px; font-weight: 900; color: #2B2622; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #mf-result .bigscore small { font-size: 12px; font-weight: 700; color: #6B5F52; letter-spacing: 2px; display: block; }
  #mf-result .rows { margin: 14px 0 0; border-top: 1.5px solid rgba(58,46,36,.25); }
  #mf-result .rows div {
    display: flex; justify-content: space-between; padding: 7px 2px;
    border-bottom: 1px solid rgba(58,46,36,.18); font-size: 13px; color: #6B5F52;
  }
  #mf-result .rows div b { color: #2B2622; font-variant-numeric: tabular-nums; }
  #mf-result .prizeRow {
    display: flex; justify-content: center; gap: 5px; flex-wrap: wrap;
    margin: 13px 0 0; padding: 10px 8px;
    border: 2px dashed rgba(143,43,32,.5); border-radius: 8px; background: #FBF3DF;
  }
  #mf-result .prizeRow img { width: 30px; height: 30px; }
  #mf-result .prizeRow .lack { align-self: center; font-size: 12px; color: #6B5F52; }
  #mf-result .code {
    margin-top: 12px; padding: 9px; border: 2px solid #8F2B20; border-radius: 8px;
    background: #F4D8A8; font-weight: 900; letter-spacing: 2px; color: #8F2B20; font-size: 17px;
  }
  #mf-result .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
  #mf-result .btns button {
    padding: 12px 0; border: 2.5px solid #3A2E24; border-radius: 9px;
    font-size: 15px; font-weight: 900; letter-spacing: 3px;
    box-shadow: 3px 3px 0 rgba(58,46,36,.85);
    transition: transform .06s, box-shadow .06s;
  }
  #mf-result .btns button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(58,46,36,.85); }
  #mf-result .btns .main { background: #B93A2B; color: #FFF6E8; }
  #mf-result .btns .ghost { background: #FFF9EE; color: #2B2622; }

  /* ===== FX 容器 / toast ===== */
  #mf-fx { position: absolute; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
  #mf-toast {
    position: absolute; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    background: #2B2622; color: #F6EFE2; font-size: 13px;
    padding: 9px 16px; border-radius: 8px; border: 2px solid #F6EFE2;
    opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s;
    z-index: 60; max-width: 82%; text-align: center;
  }
  #mf-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="mf-app">
  <header id="mf-top">
    <div class="brand">
      <span class="seal">礼</span>
      <h1>翻牌赢好礼<small>MEMORY FLIP</small></h1>
    </div>
    <div class="ops">
      <button id="mf-btn-sound" aria-label="声音开关"></button>
      <button id="mf-btn-cfg" aria-label="设置"></button>
    </div>
  </header>

  <section id="mf-hud">
    <div class="timerow">
      <div class="bar"><i id="mf-timebar"></i></div>
      <b id="mf-time-num">--</b>
    </div>
    <div class="stats">
      <span>步数 <b id="mf-moves">0</b></span>
      <span class="div"></span>
      <span id="mf-combo" hidden>连击×<b id="mf-combo-n">2</b></span>
      <span class="div"></span>
      <span>得分 <b id="mf-score">0</b></span>
    </div>
  </section>

  <section id="mf-tray"><div class="row" id="mf-tray-row"></div></section>

  <main id="mf-board" aria-label="牌桌"></main>

  <div id="mf-cover">
    <div class="hero">
      <div class="seal">礼</div>
      <h2>翻牌赢好礼</h2>
      <div class="sub">经 典 记 忆 翻 牌 挑 战</div>
    </div>
    <ul class="rules">
      <li><i>01</i>开局有短暂记忆时间，亮出的卡面要记牢</li>
      <li><i>02</i>连续配对成功触发连击，奖励分数翻倍</li>
      <li><i>03</i>限定时间内全部配对成功，即可领取全部好礼</li>
    </ul>
    <div class="sec">选择难度</div>
    <div id="mf-diff"></div>
    <div id="mf-best"></div>
    <button id="mf-btn-start">开始挑战</button>
    <div id="mf-plays"></div>
    <div class="foot">活动最终解释权归本店所有 · 纯本地演示</div>
  </div>

  <div id="mf-result" hidden>
    <div class="paper">
      <div class="rt" id="mf-rt">挑战结果</div>
      <h3 id="mf-rt-title">挑战成功</h3>
      <div class="starRow" id="mf-stars"></div>
      <div class="bigscore"><span id="mf-r-score">0</span><small>本局得分</small></div>
      <div class="rows" id="mf-rows"></div>
      <div class="prizeRow" id="mf-prizes"></div>
      <div class="code" id="mf-code" hidden></div>
      <div class="btns">
        <button class="main" id="mf-btn-claim">一键领取好礼</button>
        <button class="ghost" id="mf-btn-again">再来一局</button>
        <button class="ghost" id="mf-btn-share" hidden>分享战绩</button>
      </div>
    </div>
  </div>

  <div id="mf-cfg-host"></div>
  <div id="mf-fx"></div>
  <div id="mf-toast"></div>
</div>
<script>
/* ===== src/logic.js ===== */
/* ===== 翻牌赢好礼 · logic.js —— 常量/纯函数/配置默认值（主线） ===== */
window.MF = window.MF || {};
MF.LOGIC = (() => {
  const LS_CFG = 'mf_config_v1', LS_ST = 'mf_state_v1';

  // ?reset=1 清档：必须发生在任何模块读 localStorage 之前（本文件是构建链第一个模块）
  const Q = new URLSearchParams(location.search);
  if (Q.get('reset') === '1') {
    try { localStorage.removeItem(LS_CFG); localStorage.removeItem(LS_ST); } catch (e) {}
  }

  const ICONS = [
    { id: 'ingot',    name: '金元宝' },
    { id: 'hongbao',  name: '红包' },
    { id: 'coupon',   name: '优惠券' },
    { id: 'gift',     name: '礼盒' },
    { id: 'koi',      name: '锦鲤' },
    { id: 'cat',      name: '招财猫' },
    { id: 'crown',    name: '王冠' },
    { id: 'gem',      name: '宝石' },
    { id: 'firework', name: '礼花' },
    { id: 'coin',     name: '铜钱' },
  ];
  const ICON_NAME = {}; ICONS.forEach(i => { ICON_NAME[i.id] = i.name; });

  // 列 x 行；pairs ≤ ICONS.length
  const GRIDS = {
    '4x3': { cols: 4, rows: 3, pairs: 6,  label: '轻松' },
    '4x4': { cols: 4, rows: 4, pairs: 8,  label: '标准' },
    '5x4': { cols: 5, rows: 4, pairs: 10, label: '挑战' },
  };

  function defaultCfg() {
    return {
      grid: '4x4',
      timeLimit: 90,
      peekSec: 2,
      comboOn: true,
      baseScore: 100,
      timeBonus: 10,
      dailyLimit: 0,
      vols: { bgm: 0.4, sfx: 0.9, master: 1 },
      icons: {},
      sounds: {},
    };
  }

  function deepMerge(base, patch) {
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    if (!patch || typeof patch !== 'object') return out;
    for (const k of Object.keys(patch)) {
      const v = patch[k];
      const b = base ? base[k] : undefined;
      if (v && typeof v === 'object' && !Array.isArray(v) && b && typeof b === 'object' && !Array.isArray(b)) {
        out[k] = deepMerge(b, v);
      } else if (v !== undefined) {
        out[k] = (v && typeof v === 'object') ? JSON.parse(JSON.stringify(v)) : v;
      }
    }
    return out;
  }

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function shuffle(arr, rng) {
    const r = rng || Math.random;
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // 发牌：取前 pairs 种图标，每种两张，洗成面朝下的一叠
  function dealPairs(gridKey, rng) {
    const g = GRIDS[gridKey] || GRIDS['4x4'];
    const ids = shuffle(ICONS.map(i => i.id), rng).slice(0, g.pairs);
    return shuffle(ids.concat(ids), rng);
  }

  // combo 为第几对连续配对（1 起）；封顶 ×4
  function comboMult(combo, comboOn) {
    if (!comboOn) return 1;
    return clamp(combo, 1, 4);
  }
  function pairScore(base, combo, comboOn) { return base * comboMult(combo, comboOn); }

  function stars(pairs, moves) {
    const acc = pairs / Math.max(moves, 1);
    return acc >= 0.66 ? 3 : acc >= 0.45 ? 2 : 1;
  }

  const p2 = n => String(n).padStart(2, '0');

  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return m > 0 ? m + '分' + p2(s) + '秒' : s + '秒';
  }

  return { LS_CFG, LS_ST, Q, ICONS, ICON_NAME, GRIDS, defaultCfg, deepMerge, clamp, shuffle, dealPairs, comboMult, pairScore, stars, today, fmtTime };
})();

<script>
/* ===== src/audio.js ===== */
/* ============================================================
 * memory-flip · MF.AUDIO — WebAudio 程序化音效（零依赖 / 零外部音频）
 * 总线: sfx/bgm -> master -> compressor -> destination（防爆音）
 * 配方: 拨弦=三角波+低通扫频短衰减 | 叮=正弦+2倍频泛音(+3倍频微光)
 *       木鱼=带通噪声脉冲 | fanfare=方波低通柔化+微上滑音 | 沙=带通/高通噪声
 * 引擎: AudioContext 惰性创建；unlock 幂等；循环 lookahead 调度，
 *       stopLoop 清定时器+全部源 stop；visibilitychange 停/续 BGM；
 *       duck(ms) 压 BGM 后恢复；applyOverrides(dataURL) 优先、失败回落合成。
 * ============================================================ */
window.MF = window.MF || {};
MF.AUDIO = (function () {
  'use strict';

  var names = ['flip', 'match', 'miss', 'combo', 'win', 'lose', 'tick', 'click', 'bgm'];

  /* ----- 状态 ----- */
  var ctx = null, master = null, sfx = null, bgm = null, noiseBuf = null;
  var vBGM = 0.4, vSFX = 0.9, vMaster = 1;   // BGM 默认自压低 0.4
  var unlocked = false, duckTimer = 0, visBound = false;
  var loops = {};      // name -> {running,timer,pending[],step,nextTime,bufferSrc}
  var wanted = {};     // 用户意图（页面隐藏 halt，可见恢复）
  var overrides = {};  // name -> AudioBuffer（自定义音效优先）
  var pendingOv = {};  // name -> dataURL（待解码）
  var decBusy = {};
  var curPending = null; // 正在调度的循环的「待停源」列表

  /* ----- BGM 素材：C 宫五声音阶（C D E G A），92bpm 八分音符 ----- */
  var STEP = 60 / 92 / 2;                  // ≈0.326s
  var NOTE = { C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.00, A4: 440.00, C5: 523.25, D5: 587.33, E5: 659.26 };
  var MEL = ['C4', 'E4', 'G4', 'A4', 'C5', 0, 'A4', 'G4',
             'E4', 0, 'G4', 'A4', 'D5', 0, 'C5', 'A4',
             'C4', 'E4', 'G4', 'A4', 'C5', 0, 'D5', 'E5',
             'G4', 0, 'E5', 'D5', 'C5', 'A4', 'G4', 0];   // 32 步 = 4 小节
  var WOOD = { 2: 1, 6: 1, 18: 1, 22: 1, 29: 1 };         // 木鱼点缀
  var COMBO_F = [440, 523.25, 659.25, 880];               // A4 C5 E5 A5

  function clamp01(v) { v = +v; if (v !== v) v = 1; return v < 0 ? 0 : (v > 1 ? 1 : v); }

  /* ---------- 基础件：源用完 stop()+disconnect()，循环源登记待停 ---------- */
  function bye(src, aux, pend) {
    src.onended = function () {
      try { src.disconnect(); } catch (e) {}
      if (aux) for (var i = 0; i < aux.length; i++) { try { aux[i].disconnect(); } catch (e2) {} }
      if (pend) { var k = pend.indexOf(src); if (k >= 0) pend.splice(k, 1); }
    };
  }
  function env(dest, t0, peak, atk, dec) {
    var g = ctx.createGain(), p = g.gain;
    p.setValueAtTime(0.0001, t0);
    try {
      p.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + atk);
      p.exponentialRampToValueAtTime(0.0001, t0 + atk + dec);
    } catch (e) { try { p.value = peak; } catch (e2) {} }
    g.connect(dest);
    return g;
  }
  function oscAt(type, f, t0, dur, dest, aux) {
    var o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    o.connect(dest);
    o.start(t0);
    o.stop(t0 + dur);
    if (curPending) curPending.push(o);
    bye(o, aux, curPending);
    return o;
  }
  function noiseHit(t0, dur, ftype, freq, Q, peak, atk, dec, dest) {
    if (!noiseBuf) return null;
    var s = ctx.createBufferSource();
    s.buffer = noiseBuf; s.loop = true;
    var f = ctx.createBiquadFilter();
    f.type = ftype; f.frequency.value = freq; f.Q.value = Q;
    var g = env(dest, t0, peak, atk, dec);
    s.connect(f); f.connect(g);
    try { s.start(t0, Math.random() * 0.4); } catch (e) { try { s.start(t0); } catch (e2) {} }
    s.stop(t0 + dur);
    if (curPending) curPending.push(s);
    bye(s, [f, g], curPending);
    return s;
  }
  /* 叮：正弦基音 + 2 倍频泛音（shimmer 时加 3 倍频微光） */
  function ding(t0, f, dur, peak, dest, shimmer) {
    oscAt('sine', f, t0, dur + 0.02, env(dest, t0, peak, 0.006, dur));
    oscAt('sine', f * 2, t0, dur * 0.6 + 0.02, env(dest, t0, peak * 0.32, 0.004, dur * 0.6));
    if (shimmer) oscAt('sine', f * 3, t0, dur * 0.35 + 0.02, env(dest, t0, peak * 0.10, 0.003, dur * 0.35));
  }
  /* 拨弦：三角波 + 低通 2400→750 扫频，~0.3s 短衰减 */
  function pluck(t0, f, vol, dest) {
    var fl = ctx.createBiquadFilter();
    fl.type = 'lowpass'; fl.Q.value = 1;
    fl.frequency.setValueAtTime(2400, t0);
    fl.frequency.exponentialRampToValueAtTime(750, t0 + 0.26);
    var g = env(fl, t0, vol, 0.004, 0.30);
    fl.connect(dest);
    oscAt('triangle', f, t0, 0.33, g, [fl, g]);
    oscAt('sine', f * 2, t0, 0.14, env(dest, t0, vol * 0.25, 0.003, 0.12));
  }
  function wood(t0, dest, vol) { noiseHit(t0, 0.06, 'bandpass', 1050, 8, vol, 0.002, 0.05, dest); }
  function shaker(t0, dest, vol) { noiseHit(t0, 0.05, 'highpass', 6000, 0.7, vol, 0.004, 0.04, dest); }

  /* ---------- cue 合成 ---------- */
  function sFlip(t0, out) {   // 轻快翻页「沙嗒」~90ms
    noiseHit(t0, 0.085, 'bandpass', 2600, 0.9, 0.45, 0.004, 0.07, out);
    oscAt('square', 2100, t0, 0.03, env(out, t0, 0.10, 0.002, 0.025));
  }
  function sMatch(t0, out) {  // 上行双音叮咚 E5→A5 ~350ms
    ding(t0, 659.25, 0.18, 0.30, out, true);
    ding(t0 + 0.13, 880, 0.22, 0.34, out, true);
  }
  function sMiss(t0, out) {   // 低音「咚」~180ms，频率下坠
    var g = env(out, t0, 0.5, 0.005, 0.16);
    var o = oscAt('sine', 150, t0, 0.18, g);
    o.frequency.setValueAtTime(190, t0);
    o.frequency.exponentialRampToValueAtTime(140, t0 + 0.06);
    oscAt('triangle', 95, t0, 0.13, env(out, t0, 0.25, 0.004, 0.10));
  }
  function sCombo(t0, out, o) { // 连击叮 A4/C5/E5/A5 ~250ms
    var lv = o && o.level ? (o.level | 0) : 1;
    if (lv < 1 || lv > 4) lv = 1;
    ding(t0, COMBO_F[lv - 1], 0.2, 0.34, out, true);
    oscAt('square', COMBO_F[lv - 1] * 2, t0, 0.05, env(out, t0, 0.05, 0.002, 0.04));
  }
  /* fanfare 单音：方波 + 低通柔化 + 微上滑（不过分刺耳） */
  function fanNote(t0, f, dur, peak, out) {
    var fl = ctx.createBiquadFilter();
    fl.type = 'lowpass'; fl.frequency.value = 2200; fl.Q.value = 0.5;
    var g = env(fl, t0, peak, 0.012, dur);
    fl.connect(out);
    var o = oscAt('square', f, t0, dur + 0.03, g, [fl, g]);
    o.frequency.setValueAtTime(f * 0.97, t0);
    o.frequency.exponentialRampToValueAtTime(f, t0 + 0.06);
  }
  function sWin(t0, out) {    // 三连上行 + 收尾琶音 ~900ms
    var tri = [523.25, 659.25, 783.99], i;
    for (i = 0; i < 3; i++) fanNote(t0 + i * 0.14, tri[i], 0.17, 0.15, out);
    var arp = [523.25, 659.25, 783.99, 1046.50];
    for (i = 0; i < arp.length; i++) {
      var last = i === 3;
      ding(t0 + 0.48 + i * 0.07, arp[i], last ? 0.3 : 0.14, last ? 0.3 : 0.2, out, last);
    }
  }
  function sLose(t0, out) {   // 下行两音 ~500ms，带下坠弯音
    var seq = [[329.63, 0, 0.22], [261.63, 0.24, 0.30]];
    for (var i = 0; i < 2; i++) {
      var f = seq[i][0], t = t0 + seq[i][1];
      var fl = ctx.createBiquadFilter();
      fl.type = 'lowpass'; fl.frequency.value = 1100; fl.Q.value = 0.5;
      var g = env(fl, t, 0.28, 0.01, seq[i][2]);
      fl.connect(out);
      var o = oscAt('triangle', f, t, seq[i][2] + 0.03, g, [fl, g]);
      o.frequency.setValueAtTime(f * 1.05, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.92, t + seq[i][2]);
    }
  }
  function sTick(t0, out) {   // 木鱼短嗒 ~60ms = 带通噪声脉冲 + 定音
    noiseHit(t0, 0.055, 'bandpass', 1150, 9, 0.5, 0.002, 0.045, out);
    oscAt('sine', 840, t0, 0.05, env(out, t0, 0.2, 0.002, 0.035));
  }
  function sClick(t0, out) {  // UI 轻嗒 ~40ms
    noiseHit(t0, 0.035, 'highpass', 4200, 0.7, 0.22, 0.001, 0.03, out);
    oscAt('triangle', 1900, t0, 0.025, env(out, t0, 0.08, 0.001, 0.02));

  /* ---------- 循环（lookahead 调度 + 注册表停干净） ---------- */

  /* ---------- duck：压 BGM 后恢复 ---------- */

  function setBGMVolume(v) { vBGM = clamp01(v); if (ctx && bgm) smoothTo(bgm.gain, vBGM, ctx.currentTime, 0.03); }

  /* ---------- 自定义音效覆盖（dataURL 解码优先，失败回落合成） ---------- */
  function b64ToAB(b64) {
    try {
      var bin = atob(b64), n = bin.length, ab = new Uint8Array(n);

  }

    if (!ctx) return;
    var url = pendingOv[name];
    if (!url || decBusy[name]) return;
    var ab = urlToAB(url);
    if (!ab) { if (pendingOv[name] === url) delete pendingOv[name]; return; }
    decBusy[name] = true;

  /* ---------- play：未知 name 安全返回 false ---------- */
  function play(name, opts) {
    if (!name || names.indexOf(name) < 0) return false;
    var c = ensureCtx();
    if (!c) return false;
    var buf = overrides[name];
    if (buf) {
      try {
        var s = c.createBufferSource();
        s.buffer = buf;
        s.connect(name === 'bgm' ? bgm : sfx);
        s.start(c.currentTime + 0.02);
        bye(s);
        return true;
      } catch (e) {}
    }
    var fn = SYNTH[name];
    if (!fn) return false;
    try { fn(c.currentTime + 0.02, name === 'bgm' ? bgm : sfx, opts || {}); return true; }
    catch (e2) { return false; }
  }

  return {
    unlock: unlock,
    play: play,
    startLoop: startLoop,
    stopLoop: stopLoop,
    duck: duck,
    setBGMVolume: setBGMVolume,
    setSFXVolume: setSFXVolume,
    setMasterVolume: setMasterVolume,
    applyOverrides: applyOverrides,
    names: names

})();

<script>
/* ===== src/fx.js ===== */
/* ============================================================
 * memory-flip · FX 特效模块（src/fx.js）
 * Canvas2D 粒子，印刷喜庆：铜钱（外圆内方孔）/ 红金纸屑 / 金粉

 *      resize/orientationchange 自适应 · document.hidden 暂停/可见恢复
 *      时间戳驱动物理（不靠帧数）· rAF 单循环、无粒子休眠

window.MF=window.MF||{}; MF.FX=(()=> {
  'use strict';

  var TAU=Math.PI*2;
  var RED='#B93A2B', DRED='#8F2B20', GOLD='#C99A3C', LGOLD='#E4B95B',

  var POOL_MAX=400;                       // 粒子总量上限
  var COIN_FRAME_N=10, COIN_R=18, COIN_PAD=5;

  var host=null, canvas=null, ctx=null, W=0, H=0, dpr=1;
  var pool=[], nAlive=0, rafId=0, lastT=0, hidden=false, bound=false;
  var glowCache={};                       // 预渲染径向渐变光点精灵
  var coinFrames=[];                      // 铜钱翻转预渲染帧

  /* ---------------- 小工具 ---------------- */
  function num(v,d){ v=+v; return isFinite(v)?v:d; }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function rand(a,b){ return a+Math.random()*(b-a); }
  function pick(a){ return a[(Math.random()*a.length)|0]; }
  function safeColor(c,d){
    if(typeof c!=='string') return d;
    var s=c.charAt(0)==='#'?c.slice(1):c;
    if(s.length===3) s=s.charAt(0)+s.charAt(0)+s.charAt(1)+s.charAt(1)+s.charAt(2)+s.charAt(2);
    return /^[0-9a-fA-F]{6}$/.test(s)?('#'+s.toLowerCase()):d;
  }
  function rgba(hex,a){
    var n=parseInt(hex.slice(1),16);
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+(+a).toFixed(3)+')';
  }
  function easeOutCubic(t){ return 1-Math.pow(1-t,3); }

  /* ---------------- 离屏预渲染 ---------------- */
  // 单枚铜钱：外圆金身 + 内圆亮金 + 中央方孔（镂空）+ 深棕描边 + 克制亮金高光
  function paintCoin(g,R,lw){
    g.beginPath(); g.arc(0,0,R,0,TAU);
    g.fillStyle=GOLD; g.fill();
    g.lineWidth=lw; g.strokeStyle=BROWN; g.stroke();
    g.beginPath(); g.arc(0,0,R*0.74,0,TAU);
    g.fillStyle=LGOLD; g.fill();

    g.lineWidth=lw; g.strokeStyle=BROWN; g.strokeRect(-h,-h,h*2,h*2);
    g.beginPath(); g.arc(0,0,R*0.86,-2.35,-1.25);

  function buildCoinFrames(){
    if(coinFrames.length||typeof document==='undefined') return;
    var S=(COIN_R+COIN_PAD)*2;
    for(var i=0;i<COIN_FRAME_N;i++){
      var ax=Math.abs(Math.cos(i/COIN_FRAME_N*Math.PI));
      var c=document.createElement('canvas');
      c.width=S*2; c.height=S*2;
      var g=c.getContext('2d');

  /* ---------------- 对象池 ---------------- */
  function spawn(type){

    var cell=null;
    for(var i=0;i<pool.length;i++){ if(!pool[i].on){ cell=pool[i]; break; } }
    if(!cell){ if(pool.length>=POOL_MAX+64) return null; cell={}; pool.push(cell); }

    p.on=true; p.type=type; p.age=0;
    p.x=0; p.y=0; p.vx=0; p.vy=0; p.g=0; p.drag=0;
    p.size=6; p.h=0; p.color=LGOLD; p.alpha=1; p.life=1;
    p.rot=0; p.vr=0; p.flip=0; p.vflip=0;
    p.swA=0; p.swF=0; p.seed=rand(0,TAU); p.hi=false;
    p.x0=0; p.y0=0; p.cx=0; p.cy=0; p.tx=0; p.ty=0;
    p.delay=0; p.dur=1; p.turns=2; p.img=null; p.grp=null;
    p.r0=0; p.r1=0; p.rCur=0; p.a0=0;
    nAlive++;

  }
  function kill(p){ p.on=false; nAlive--; }

  /* ---------------- 主循环（时间戳物理，无粒子休眠） ---------------- */
  function ensureLoop(){
    if(!ctx||rafId||hidden) return;
    lastT=performance.now();
    rafId=requestAnimationFrame(tick);
  }
  function tick(now){
    rafId=0;
    if(hidden||!ctx) return;
    var dt=clamp((now-lastT)/1000,0,0.05);   // 后台切回不跳帧
    lastT=now;
    step(dt);
    render();
    if(nAlive>0) rafId=requestAnimationFrame(tick);
    else ctx.clearRect(0,0,W,H);             // 全灭：清屏并休眠
  }
  function step(dt){
    for(var i=0;i<pool.length;i++){
      var p=pool[i];
      if(!p.on) continue;
      p.age+=dt;
      switch(p.type){
        case 'bit':                          // 纸屑：重力+阻力+横向摆+自转+scaleX 翻转
          p.vy+=p.g*dt;
          p.vx-=p.vx*p.drag*dt; p.vy-=p.vy*p.drag*0.3*dt;
          p.x+=p.vx*dt+Math.sin(p.age*p.swF+p.seed)*p.swA*dt;

          if(u>=1){

            var g0=p.grp;
            if(g0){ g0.left--;
              if(g0.left<=0&&!g0.fired){ g0.fired=true; var cb=g0.done; if(cb){ try{cb();}catch(e){} } } }

          p.flip=e*p.turns*TAU;
          break;

        case 'ring': {
          if(p.age>=p.life){ kill(p); break; }
          var rt=p.age/p.life;

          p.alpha=1-rt;
          break;
        }
        case 'flash': {
          if(p.age>=p.life){ kill(p); break; }
          var ft=p.age/p.life, q=1-ft;

    }
  }
  function render(){
    ctx.clearRect(0,0,W,H);

    ctx.globalCompositeOperation='lighter';          // 叠色层：光点
    for(i=0;i<pool.length;i++){ p=pool[i]; if(p.on&&p.type==='dot') drawDot(p); }
    ctx.globalCompositeOperation='source-over';      // 实色层：纸屑/铜钱/圆环
    ctx.globalAlpha=1;                               // 防 alpha 泄漏进实色层
    for(i=0;i<pool.length;i++){
      p=pool[i]; if(!p.on) continue;
      if(p.type==='bit') drawBit(p);
      else if(p.type==='coin') drawCoinP(p);
      else if(p.type==='ring') drawRing(p);
    }
    for(i=0;i<pool.length;i++){ p=pool[i]; if(p.on&&p.type==='flash') drawFlash(p); }
    ctx.globalAlpha=1;
  }
  function drawDot(p){
    var sp=glowSprite(p.color);
    var d=p.size*(1-0.35*(p.age/p.life))*2;
    ctx.globalAlpha=p.alpha;
    ctx.drawImage(sp,p.x-d/2,p.y-d/2,d,d);
  }
  function drawBit(p){
    var sx=Math.abs(Math.cos(p.flip)); if(sx<0.12) sx=0.12;   // scaleX 翻转

    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.globalAlpha=p.alpha; ctx.fillStyle=p.color;
    ctx.fillRect(-p.size*sx/2,-p.h/2,p.size*sx,p.h);
    if(p.hi){ ctx.fillStyle='rgba(255,249,238,.5)'; ctx.fillRect(-p.size*sx/2,-p.h/2,p.size*sx,1); }
    ctx.restore();
  }
  function drawCoinP(p){
    if(p.age<p.delay) return;
    ctx.globalAlpha=1;                               // 铜钱是实色印刷物，不吃残留 alpha
    var img=p.img;
    if(img&&img.complete&&img.naturalWidth>0){       // 自定义 icon：drawImage+scaleX
      var sx=Math.abs(Math.cos(p.flip));
      ctx.save();
      ctx.translate(p.x,p.y); ctx.scale(Math.max(sx,0.08),1);
      ctx.drawImage(img,-p.size/2,-p.size/2,p.size,p.size);
      ctx.restore();
      return;
    }
    if(!coinFrames.length) return;
    var fi=Math.floor((((p.flip%TAU)+TAU)%TAU)/TAU*COIN_FRAME_N)%COIN_FRAME_N;
    var f=coinFrames[fi];
    var ds=f.S*(p.size/(2*COIN_R));                  // 显示直径 ~14-18px
    ctx.drawImage(f.c,p.x-ds/2,p.y-ds/2,ds,ds);
  }
  function drawRing(p){
    ctx.globalAlpha=p.alpha;
    ctx.strokeStyle=p.color;
    ctx.lineWidth=1+5*(1-p.age/p.life);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.rCur,0,TAU); ctx.stroke();
    ctx.globalAlpha=p.alpha*0.45;                    // 内圈回声
    ctx.lineWidth=Math.max(1,ctx.lineWidth*0.5);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.rCur*0.62,0,TAU); ctx.stroke();
    ctx.globalAlpha=1;
  }
  function drawFlash(p){
    ctx.globalAlpha=p.alpha;
    ctx.fillStyle=p.color;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }

  /* ---------------- 尺寸 / 可见性 ---------------- */
  function resize(){
    if(!host||!canvas) return;
    var r=host.getBoundingClientRect?host.getBoundingClientRect():null;
    W=Math.max(1,Math.round((r&&r.width)||host.clientWidth||0));
    H=Math.max(1,Math.round((r&&r.height)||host.clientHeight||0));
    dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(W*dpr);
    canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function onVis(){
    hidden=!!document.hidden;
    if(hidden){ if(rafId){ cancelAnimationFrame(rafId); rafId=0; } }
    else ensureLoop();                                // lastT 重置，无时间跳变
  }
  function bindGlobal(){
    if(bound) return; bound=true;
    window.addEventListener('resize',resize);
    window.addEventListener('orientationchange',function(){ resize(); setTimeout(resize,260); });
    document.addEventListener('visibilitychange',onVis);
  }

  /* ---------------- 对外接口 ---------------- */
  // hostEl 内建铺满 canvas（绝对定位 inset:0、pointer-events:none，zIndex 由宿主管）
  function init(hostEl){
    if(!hostEl||typeof hostEl.appendChild!=='function') return;   // 安全 no-op
    if(canvas&&canvas.parentNode===hostEl) return;                // 幂等
    if(canvas&&canvas.parentNode) canvas.parentNode.removeChild(canvas);
    host=hostEl;
    canvas=document.createElement('canvas');
    canvas.setAttribute('data-mf-fx','');
    canvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;';
    hostEl.appendChild(canvas);
    ctx=canvas.getContext('2d');
    if(!ctx){ host=null; canvas=null; return; }
    resize(); buildCoinFrames(); bindGlobal();
  }

  // 纸屑/光点从点爆开；opt{n,colors}
  function burst(x,y,opt){
    if(!ctx) return;
    opt=opt||{};
    x=num(x,W/2); y=num(y,H/2);
    var colors=(opt.colors&&opt.colors.length)
      ?[].map.call(opt.colors,function(c){ return safeColor(c,GOLD); })
      :[RED,GOLD,LGOLD,CREAM];
    var want=clamp(num(opt.n,26)|0,1,64);
    for(var i=0;i<want;i++){
      var isDot=Math.random()<0.45;
      var p=spawn(isDot?'dot':'bit'); if(!p) break;
      var a=rand(0,TAU);
      if(isDot){
        var sp=rand(110,400);
        p.x=x; p.y=y;
        p.vx=Math.cos(a)*sp; p.vy=Math.sin(a)*sp-rand(0,110);
        p.g=260; p.drag=2.4; p.life=rand(0.45,0.9); p.size=rand(5,11);
        p.color=pick([LGOLD,GOLD,CREAM]);
      }else{
        var sp2=rand(130,430);
        p.x=x; p.y=y;
        p.vx=Math.cos(a)*sp2; p.vy=Math.sin(a)*sp2-90;
        p.g=rand(720,950); p.drag=1.0; p.life=rand(0.7,1.15);
        p.size=rand(5,9); p.h=rand(3,5.5);
        p.rot=rand(0,TAU); p.vr=rand(-9,9);
        p.flip=rand(0,TAU); p.vflip=rand(5,11)*(Math.random()<0.5?-1:1);
        p.swA=rand(6,18); p.swF=rand(2,4);
        p.color=pick(colors); p.hi=Math.random()<0.35;
      }
    }
    ensureLoop();
  }

  // n 个铜钱（或 opt.icon dataURI）沿二次贝塞尔（随机控制点偏移）A→B，全数抵达回调 done 一次
  function coinFly(x1,y1,x2,y2,opt){
    if(!ctx) return;
    opt=opt||{};
    x1=num(x1,W/2); y1=num(y1,H/2); x2=num(x2,W/2); y2=num(y2,H/2);
    var done=(typeof opt.done==='function')?opt.done:null;
    var grp={left:0,fired:false,done:done};           // stopAll 中止时 done 不回调
    var img=null;
    if(opt.icon&&typeof Image!=='undefined'){ img=new Image(); img.src=opt.icon; }
    var dx=x2-x1, dy=y2-y1, dist=Math.sqrt(dx*dx+dy*dy)||1;
    var px=-dy/dist, py=dx/dist;
    var want=clamp(num(opt.n,6)|0,1,48);
    for(var i=0;i<want;i++){
      var p=spawn('coin'); if(!p) break;
      var off=clamp(rand(0.15,0.45)*dist*(Math.random()<0.5?-1:1),-H*0.45,H*0.45);
      p.x0=x1; p.y0=y1; p.tx=x2; p.ty=y2;
      p.cx=(x1+x2)/2+px*off; p.cy=(y1+y2)/2+py*off;
      p.delay=i*rand(0.05,0.085);                     // 逐枚错峰
      p.dur=rand(0.62,0.92);
      p.size=rand(14,18);
      p.turns=rand(1.5,3.2);
      p.img=img; p.grp=grp;
      grp.left++;
    }
    if(grp.left===0){ grp.fired=true; if(done){ try{done();}catch(e){} } }
    ensureLoop();
  }

  // 全屏红金彩带雨：矩形纸屑 rotate + scaleX 翻转
  function confetti(n){
    if(!ctx) return;
    var want=clamp(num(n,80)|0,1,POOL_MAX);
    var colors=[RED,DRED,GOLD,LGOLD,CREAM];
    for(var i=0;i<want;i++){
      var p=spawn('bit'); if(!p) break;
      p.x=rand(0,W); p.y=rand(-H*0.12,-8);
      p.vx=rand(-40,40); p.vy=rand(40,140);
      p.g=rand(240,420); p.drag=0.5;
      p.life=rand(2.2,3.2);
      p.size=rand(5,9); p.h=rand(3,5.5);
      p.rot=rand(0,TAU); p.vr=rand(-7,7);
      p.flip=rand(0,TAU); p.vflip=rand(4,9)*(Math.random()<0.5?-1:1);
      p.swA=rand(10,26); p.swF=rand(2,4.5);
      p.color=pick(colors); p.hi=Math.random()<0.3;
    }
    ensureLoop();
  }

  // 单点火花（金粉）
  function spark(x,y,color,n){
    if(!ctx) return;
    x=num(x,W/2); y=num(y,H/2);
    var col=safeColor(color,LGOLD);
    var want=clamp(num(n,10)|0,1,64);
    for(var i=0;i<want;i++){
      var p=spawn('dot'); if(!p) break;
      var a=rand(0,TAU), sp=rand(60,260);
      p.x=x; p.y=y;
      p.vx=Math.cos(a)*sp; p.vy=Math.sin(a)*sp;
      p.g=180; p.drag=3.2; p.life=rand(0.28,0.5); p.size=rand(3,7);
      p.color=Math.random()<0.3?CREAM:col;
    }
    ensureLoop();
  }

  // 全屏闪色，快速淡出
  function flash(color,alpha){
    if(!ctx) return;
    var p=spawn('flash'); if(!p) return;
    p.color=safeColor(color,RED);
    p.a0=clamp(num(alpha,0.16),0,1);
    p.life=0.38;
    ensureLoop();
  }

  // 扩散圆环
  function ring(x,y,color){
    if(!ctx) return;
    x=num(x,W/2); y=num(y,H/2);
    var p=spawn('ring'); if(!p) return;
    p.x=x; p.y=y;
    p.color=safeColor(color,LGOLD);
    p.r0=6; p.r1=clamp(Math.min(W,H)*0.24,48,96);
    p.life=0.5;
    ensureLoop();
  }

  // 金渐变大字 + 深描边（DOM，非 canvas），WAAPI 弹入 0.6→1.05→1、停留淡出自毁，居中
  function bigText(text,opt){
    if(!host) return;
    opt=opt||{};
    var txt=(text==null?'':String(text));
    if(!txt) return;
    var olds=host.querySelectorAll('[data-mf-bt]');   // 替换上一条，避免叠字
    for(var i=0;i<olds.length;i++){ if(olds[i].parentNode) olds[i].parentNode.removeChild(olds[i]); }

    var w=W||host.clientWidth||390;
    var scale=clamp(num(opt.scale,1),0.4,3);
    var dur=clamp(num(opt.dur,1500),600,6000);
    var color=safeColor(opt.color,LGOLD);
    var fs=Math.round(clamp(w*0.16,36,80)*scale);
    fs=Math.max(18,Math.min(fs,Math.floor(w*0.92/Math.max(2,txt.length))));
    var strokeW=Math.round(clamp(fs*0.16,6,14));
    var FONT='system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

    var wrap=document.createElement('div');
    wrap.setAttribute('data-mf-bt','');
    wrap.style.cssText='position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;'
      +'align-items:center;justify-content:center;pointer-events:none;';

    var box=document.createElement('div');
    box.style.cssText='position:relative;text-align:center;';
    var base='font-family:'+FONT+';font-weight:900;font-size:'+fs+'px;line-height:1.1;letter-spacing:.02em;white-space:nowrap;';

    var st=document.createElement('div');             // 描边层：-webkit-text-stroke + 实色偏移投影
    st.textContent=txt;
    st.style.cssText=base+'color:'+BROWN+';-webkit-text-stroke:'+strokeW+'px '+BROWN+';'
      +'text-shadow:'+Math.max(3,Math.round(fs*0.06))+'px '+Math.max(3,Math.round(fs*0.06))+'px 0 rgba(58,46,36,.85);';

    var fl=document.createElement('div');             // 金渐变填充层
    fl.textContent=txt;
    fl.style.cssText=base+'position:absolute;left:0;top:0;width:100%;'
      +'background:linear-gradient(180deg,#F6E2A8 0%,'+color+' 46%,'+GOLD+' 74%,'+LGOLD+' 100%);'
      +'-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;';

    box.appendChild(st); box.appendChild(fl); wrap.appendChild(box);

    if(opt.sub){                                      // 副标题：红底米白小字，印刷印章感
      var sub=document.createElement('div');
      sub.textContent=String(opt.sub);
      var sfs=Math.max(12,Math.round(fs*0.26));
      sub.style.cssText='margin-top:'+Math.round(fs*0.12)+'px;font-family:'+FONT+';font-weight:700;'
        +'font-size:'+sfs+'px;line-height:1;color:'+CREAM+';background:'+RED+';'
        +'border:2px solid '+BROWN+';border-radius:4px;box-shadow:2px 2px 0 rgba(58,46,36,.9);'
        +'padding:'+Math.round(sfs*0.32)+'px '+Math.round(sfs*0.7)+'px;letter-spacing:.08em;';
      wrap.appendChild(sub);
    }
    host.appendChild(wrap);

    var tIn=Math.min(420,Math.round(dur*0.32));
    var tOut=Math.min(460,Math.round(dur*0.34));
    var kf=[
      {transform:'scale(0.6)',opacity:0,offset:0,easing:'cubic-bezier(.2,.85,.3,1.1)'},
      {transform:'scale(1.05)',opacity:1,offset:Math.min(0.45,tIn/dur*0.8)},
      {transform:'scale(1)',opacity:1,offset:Math.min(0.5,tIn/dur)},
      {transform:'scale(1)',opacity:1,offset:Math.max(0.55,(dur-tOut)/dur)},
      {transform:'scale(1.06)',opacity:0,offset:1}
    ];
    var gone=false;
    function gone_(){ if(gone) return; gone=true; if(wrap.parentNode) wrap.parentNode.removeChild(wrap); }
    try{
      var anim=wrap.animate(kf,{duration:dur,fill:'forwards'});
      anim.onfinish=gone_;
    }catch(e){ /* WAAPI 不可用：靠兜底定时器自毁 */ }
    setTimeout(gone_,dur+250);
  }

  // 清空一切（中止中的 coinFly 不触发 done）
  function stopAll(){
    for(var i=0;i<pool.length;i++) pool[i].on=false;
    nAlive=0;
    if(rafId){ cancelAnimationFrame(rafId); rafId=0; }
    if(ctx) ctx.clearRect(0,0,W,H);
    if(host){
      var olds=host.querySelectorAll('[data-mf-bt]');
      for(var j=0;j<olds.length;j++){ if(olds[j].parentNode) olds[j].parentNode.removeChild(olds[j]); }
    }
  }

  return {
    init:init,
    burst:burst,
    coinFly:coinFly,
    confetti:confetti,
    spark:spark,
    flash:flash,
    ring:ring,
    bigText:bigText,
    stopAll:stopAll
  };
})();

</script>
<script>
/* ===== src/config-panel.js ===== */
/* =========================================================
 * 翻牌赢好礼 · 配置面板（移动端底部抽屉） — MF.CONFIG_PANEL
 * 契约接口：mount(el) / open(tab?) / close() / isOpen() / onChange(cb)
 * 额外通道：onClearBest(cb) —— 「清除最佳纪录」专用事件（非 cfg 字段；
 *           恢复出厂 / 导入都不会触发它，也永不清除纪录）
 * - open() 时深拷贝 window.MF.cfg 为 work（MF.cfg 缺失则用内置 defaultCfg）
 * - 任何编辑改 work 后立即 onChange(完整深拷贝快照)
 * - 永不直接读写 localStorage；MF.ART / MF.AUDIO / MF.LOGIC 缺失时兜底
 * - 样式内联 <style> 注入，类名前缀 mfcp-
 * - 视觉：米白 #FFF9EE 纸底｜主红 #B93A2B｜金 #C99A3C｜深棕 #3A2E24 描边，
 *   圆角 ≤8px，实色偏移投影，禁紫蓝渐变 / 玻璃拟态 / 霓虹
 * ======================================================= */
window.MF = window.MF || {};
MF.CONFIG_PANEL = (function () {
  'use strict';

  /* ---------------- 内置默认配置（schema 兜底） ---------------- */
  function defaultCfg() {
    return {
      grid: '4x4',        // 默认难度 '4x3' | '4x4' | '5x4'
      timeLimit: 90,      // 限时秒，0=不限时
      peekSec: 2,         // 开局记忆预览秒，0=关
      comboOn: true,      // 连击倍率开关
      baseScore: 100,     // 每对基础分
      timeBonus: 10,      // 全清后每剩 1 秒加成
      dailyLimit: 0,      // 每日次数，0=无限
      vols: { bgm: 0.4, sfx: 0.9, master: 1 },
      icons: {},          // iconId -> dataURL 覆盖
      sounds: {}          // cue -> dataURL 覆盖
    };
  }

  /* 10 种好礼（契约锁死的 id 与中文名，LOGIC 缺失时兜底） */
  var ICON_TABLE = [
    ['ingot', '金元宝'], ['hongbao', '红包'], ['coupon', '优惠券'], ['gift', '礼盒'], ['koi', '锦鲤'],
    ['cat', '招财猫'], ['crown', '王冠'], ['gem', '宝石'], ['firework', '礼花'], ['coin', '铜钱']
  ];
  /* cue 清单（契约锁死） */
  var CUE_TABLE = [
    ['flip', '翻牌'], ['match', '配对'], ['miss', '失配'], ['combo', '连击'], ['win', '胜利'],
    ['lose', '失败'], ['tick', '倒计时'], ['click', '按钮'], ['bgm', '背景音乐']
  ];
  var GRIDS = [['4x3', '轻松 4×3'], ['4x4', '标准 4×4'], ['5x4', '挑战 5×4']];
  var TABS = [['cards', '卡面'], ['sound', '音效'], ['play', '玩法'], ['data', '数据']];
  var TAB_ALIAS = {
    'cards': 'cards', 'card': 'cards', 'skin': 'cards', '卡面': 'cards',
    'sound': 'sound', 'sounds': 'sound', 'audio': 'sound', '音效': 'sound',
    'play': 'play', 'game': 'play', '玩法': 'play',
    'data': 'data', '数据': 'data'
  };
  var NUMSPEC = {
    timeLimit: { min: 0, max: 300, step: 1 },
    peekSec:   { min: 0, max: 5,   step: 1 },
    baseScore: { min: 10, max: 1000, step: 10 },
    timeBonus: { min: 0, max: 100, step: 1 },
    dailyLimit:{ min: 0, max: 99,  step: 1 }
  };

  /* ---------------- 工具函数 ---------------- */
  function deepCopy(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
  function clamp01(v, fb) { var n = Number(v); return isFinite(n) ? Math.min(1, Math.max(0, n)) : fb; }
  function pct(v) { return Math.round(clamp01(v, 0) * 100) + '%'; }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function iconName(id) {
    for (var i = 0; i < ICON_TABLE.length; i++) if (ICON_TABLE[i][0] === id) return ICON_TABLE[i][1];
    return id;
  }
  function cueName(cue) {
    for (var i = 0; i < CUE_TABLE.length; i++) if (CUE_TABLE[i][0] === cue) return CUE_TABLE[i][1];
    return cue;
  }
  /* iconId 列表：优先取 MF.LOGIC.ICONS（兼容字符串或 {id,name} 对象），缺失时用内置表 */
  function iconIdList() {
    var out = [];
    try {
      var L = window.MF && window.MF.LOGIC;
      var arr = L && L.ICONS;
      if (arr && arr.length) {
        for (var i = 0; i < arr.length; i++) {
          var it = arr[i];
          var id = (typeof it === 'string') ? it : (it && it.id);
          if (typeof id === 'string' && id) {
            var nm = (it && typeof it.name === 'string') ? it.name : iconName(id);
            out.push([id, nm]);
          }
        }
      }
    } catch (e) { /* 兜底 */ }
    return out.length ? out : ICON_TABLE.slice();
  }
  function artUrl(id) {
    try {
      var A = window.MF && window.MF.ART;
      if (A && typeof A.card === 'function') {
        var u = A.card(id);
        if (typeof u === 'string' && u) return u;
      }
    } catch (e) { /* 占位块兜底 */ }
    return null;
  }
  function hasAudio() {
    try { return !!(window.MF && window.MF.AUDIO && typeof window.MF.AUDIO.play === 'function'); }
    catch (e) { return false; }
  }

  /* 按契约 schema 清洗补全（缺的键用内置默认值兜底，未知 icon/cue 键丢弃） */
  function sanitize(raw) {
    var d = defaultCfg();
    if (!raw || typeof raw !== 'object') return d;
    for (var i = 0; i < GRIDS.length; i++) if (raw.grid === GRIDS[i][0]) d.grid = raw.grid;
    d.timeLimit  = clampInt(raw.timeLimit,  0, 300,  d.timeLimit);
    d.peekSec    = clampInt(raw.peekSec,    0, 5,    d.peekSec);
    d.baseScore  = clampInt(raw.baseScore,  10, 1000, d.baseScore);
    d.timeBonus  = clampInt(raw.timeBonus,  0, 100,  d.timeBonus);
    d.dailyLimit = clampInt(raw.dailyLimit, 0, 99,   d.dailyLimit);
    if (typeof raw.comboOn === 'boolean') d.comboOn = raw.comboOn;
    if (raw.vols && typeof raw.vols === 'object') {
      d.vols.bgm    = clamp01(raw.vols.bgm,    d.vols.bgm);
      d.vols.sfx    = clamp01(raw.vols.sfx,    d.vols.sfx);
      d.vols.master = clamp01(raw.vols.master, d.vols.master);
    }
    if (raw.icons && typeof raw.icons === 'object') {
      var ic = {};
      iconIdList().forEach(function (p) {
        var v = raw.icons[p[0]];
        if (typeof v === 'string' && v) ic[p[0]] = v;
      });
      d.icons = ic;
    }
    if (raw.sounds && typeof raw.sounds === 'object') {
      var sd = {};
      CUE_TABLE.forEach(function (p) {
        var v = raw.sounds[p[0]];
        if (typeof v === 'string' && v) sd[p[0]] = v;
      });
      d.sounds = sd;
    }
    return d;
  }
  function clampInt(v, min, max, fb) {
    var n = Math.round(Number(v));
    if (!isFinite(n)) return fb;
    return Math.min(max, Math.max(min, n));
  }

  /* ---------------- 模块状态 ---------------- */
  var host = null, root = null;
  var work = null;              // 工作副本（深拷贝），编辑立即 notify
  var cbs = [];                 // onChange 回调
  var cbsBest = [];             // onClearBest 回调（独立通道）
  var opened = false;
  var curTab = 'cards';
  var toastTimer = 0;
  var ui = {};                  // 控件引用

  /* ---------------- 样式（米白纸底 + 印刷红金 + 偏移实色投影） ---------------- */
  var CSS = [
    '.mfcp-root{position:fixed;inset:0;z-index:9990;font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#2B2622;}',
    '.mfcp-root,.mfcp-root *{box-sizing:border-box;}',
    '.mfcp-root[hidden]{display:none!important;}',
    '.mfcp-mask{position:absolute;inset:0;background:rgba(43,38,34,.55);opacity:0;transition:opacity .22s ease;}',
    '.mfcp-root.mfcp-open .mfcp-mask{opacity:1;}',
    '.mfcp-drawer{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-height:88%;',
      'background:#FFF9EE;border:2px solid #3A2E24;border-bottom:none;border-radius:8px 8px 0 0;',
      'box-shadow:0 -3px 0 rgba(58,46,36,.9);transform:translateY(105%);transition:transform .26s cubic-bezier(.22,.9,.3,1);}',
    '.mfcp-root.mfcp-open .mfcp-drawer{transform:translateY(0);}',

  function ensureStyle() {
    if (document.getElementById('mfcp-style')) return;
    var st = document.createElement('style');
    st.id = 'mfcp-style';
    st.textContent = CSS;
    (document.head || document.documentElement).appendChild(st);
  }

  /* ---------------- 面板 HTML ---------------- */
  function numRow(key, label, sub) {
    var s = NUMSPEC[key];
    return '<div class="mfcp-row">'
      + '<span class="mfcp-lab">' + label + '<span class="mfcp-labsub">' + sub + '</span></span>'
      + '<input type="number" class="mfcp-num" data-num="' + key + '" min="' + s.min
      + '" max="' + s.max + '" step="' + s.step + '" aria-label="' + label + '">'
      + '</div>';
  }
  function panelCardsHTML() {
    return '<p class="mfcp-note">10 种好礼卡面，可上传本地图片替换（自动压缩为长边 ≤256px 的 PNG）。'
      + '替换后的卡面会标注「已自定义」，可单项还原或全部还原。</p>'
      + '<div class="mfcp-iconlist" data-role="iconlist"></div>'
      + '<div class="mfcp-btnrow"><button type="button" class="mfcp-btn" data-act="icons-reset">全部还原默认卡面</button></div>'
      + '<input type="file" class="mfcp-file" accept="image/*" data-role="iconfile">';
  }
  function cueRowHTML(cue, label) {
    return '<div class="mfcp-cuerow" data-cue="' + cue + '">'
      + '<span class="mfcp-cuename">' + label + '<span class="mfcp-chip mfcp-hide">已自定义</span></span>'
      + '<button type="button" class="mfcp-btn" data-sact="play">试听</button>'
      + '<button type="button" class="mfcp-btn" data-sact="up">换音</button>'
      + '<button type="button" class="mfcp-btn mfcp-hide" data-sact="clear">清除</button>'
      + '</div>';
  }
  function volRow(k, label) {
    return '<div class="mfcp-row mfcp-rowcol mfcp-rowtight">'
      + '<span class="mfcp-volhead"><span class="mfcp-lab">' + label + '</span>'
      + '<span class="mfcp-volval" data-volval="' + k + '">0%</span></span>'
      + '<input type="range" class="mfcp-range" data-vol="' + k + '" min="0" max="1" step="0.05" aria-label="' + label + '">'
      + '</div>';
  }
  function panelSoundHTML() {
    var rows = CUE_TABLE.map(function (c) { return cueRowHTML(c[0], c[1]); }).join('');
    return '<p class="mfcp-note">上传本地音频替换内置合成音（不做压缩），「清除」恢复合成音；'
      + '试听需游戏音效模块支持。</p>'
      + '<div class="mfcp-cuelist">' + rows + '</div>'
      + '<div class="mfcp-sec">音量调节</div>'
      + volRow('bgm', '背景音乐（BGM）')
      + volRow('sfx', '音效（SFX）')
      + volRow('master', '主音量')
      + '<input type="file" class="mfcp-file" accept="audio/*" data-role="sndfile">';
  }
  function panelPlayHTML() {
    var seg = GRIDS.map(function (g) {
      return '<button type="button" data-grid="' + g[0] + '">' + g[1] + '</button>';
    }).join('');
    return '<p class="mfcp-note">以下为开局时生效的默认玩法参数。</p>'
      + '<div class="mfcp-row mfcp-rowcol">'
      + '<span class="mfcp-lab">默认难度<span class="mfcp-labsub">轻松 6 对 ｜ 标准 8 对 ｜ 挑战 10 对</span></span>'
      + '<div class="mfcp-seg" data-role="gridseg">' + seg + '</div>'
      + '</div>'
      + numRow('timeLimit', '限时（秒）', '倒计时秒数，0 = 不限时')
      + numRow('peekSec', '开局记忆预览（秒）', '开局亮出全部卡面帮助记忆，0 = 关闭')
      + '<div class="mfcp-row">'
      + '<span class="mfcp-lab">连击倍率<span class="mfcp-labsub">连续配对得分 ×2/×3，4 连击起 ×4 封顶；关闭后恒为 ×1</span></span>'
      + '<label class="mfcp-sw"><input type="checkbox" data-role="combo" aria-label="连击倍率开关">'
      + '<span class="mfcp-track"></span><span class="mfcp-knob"></span></label>'
      + '</div>'
      + numRow('baseScore', '每对基础分', '每次配对成功的得分基数，10 – 1000')
      + numRow('timeBonus', '全清剩余秒加成', '限时模式通关后每剩余 1 秒加分，0 – 100')
      + numRow('dailyLimit', '每日次数', '每天可玩局数，0 = 不限次数');
  }
  function panelDataHTML() {
    return '<p class="mfcp-note">导出为 JSON 文件（mf-config.json），包含全部配置与自定义素材，可备份或分享；'
      + '导入后立即生效。「恢复出厂」与「导入」都不会清除最佳纪录。</p>'
      + '<div class="mfcp-btncol">'
      + '<button type="button" class="mfcp-btn mfcp-btn-primary" data-act="export">导出配置（下载 mf-config.json）</button>'
      + '<button type="button" class="mfcp-btn" data-act="import">导入配置（JSON 文件）</button>'
      + '<button type="button" class="mfcp-btn" data-act="factory">恢复出厂设置</button>'
      + '</div>'
      + '<div class="mfcp-datadiv"></div>'
      + '<button type="button" class="mfcp-btn mfcp-btn-danger mfcp-btn-block" data-act="clearbest">清除最佳纪录（独立操作，不影响配置）</button>'
      + '<input type="file" class="mfcp-file" accept="application/json,.json,text/plain" data-role="cfgfile">';
