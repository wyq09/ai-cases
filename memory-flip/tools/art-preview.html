<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MF.ART 卡面自检</title>
<style>
  body{margin:0;padding:28px;background:#F6EFE2;color:#2B2622;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
  h1{font-size:18px;font-weight:900;margin:0 0 2px}
  .sub{font-size:12px;color:#7a6a55;margin:0 0 8px}
  h2{font-size:13px;font-weight:900;margin:26px 0 10px;padding-left:8px;border-left:4px solid #B93A2B;letter-spacing:.05em}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
  .cell{text-align:center}
  .tile{background:#FFF9EE;border:2px solid #3A2E24;border-radius:6px;box-shadow:3px 3px 0 rgba(58,46,36,.9);overflow:hidden}
  .tile img{display:block;width:100%;height:100%}
  .cap{font-size:11px;color:#6b5b47;margin-top:5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .slot{width:40px;height:40px;background:#FFF9EE;border:2px solid #3A2E24;border-radius:5px;display:flex;align-items:center;justify-content:center}
  .slot img{width:30px;height:30px;display:block}
</style>
</head>
<body>
<h1>MF.ART 自检预览</h1>
<p class="sub">52px / 96px 两档 · card ×10 · back · trayIcon</p>
<div id="root"></div>
<script src="../src/art.js"></script>
<script>
(function(){
  var IDS=['ingot','hongbao','coupon','gift','koi','cat','crown','gem','firework','coin'];
  var root=document.getElementById('root');
  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
  function section(title){root.appendChild(el('h2',null,title));var r=el('div','row');root.appendChild(r);return r;}
  function cellimg(r,src,px,label){
    var c=el('div','cell');
    var t=el('div','tile');t.style.width=px+'px';t.style.height=px+'px';
    var im=new Image();im.src=src;t.appendChild(im);
    c.appendChild(t);c.appendChild(el('div','cap',label));r.appendChild(c);
  }
  var row96=section('card() — 96px');
  IDS.forEach(function(id){cellimg(row96,MF.ART.card(id),96,id);});
  var row52=section('card() — 52px');
  IDS.forEach(function(id){cellimg(row52,MF.ART.card(id),52,id);});
  var rowB=section('back()');
  cellimg(rowB,MF.ART.back(),96,'back 96');
  cellimg(rowB,MF.ART.back(),52,'back 52');
  var rowT=section('trayIcon() — 30px in 40px slot');
  IDS.forEach(function(id){
    var c=el('div','cell');
    var s=el('div','slot');
    var im=new Image();im.src=MF.ART.trayIcon(id);s.appendChild(im);
    c.appendChild(s);c.appendChild(el('div','cap',id));rowT.appendChild(c);
  });
})();
</script>
</body>
</html>
