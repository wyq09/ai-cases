<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elera · Patient Flow</title>
<meta name="description" content="Elera clinic operations console — live patient flow board.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237DD571'/%3E%3Cpath d='M16 6v20M8.3 11l15.4 10M23.7 11L8.3 21' stroke='%2314280C' stroke-width='4.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%237DD571'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ══════════════ SIDEBAR ══════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <button class="brand" data-nav="dashboard" title="Dashboard">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 30 30"><g><rect x="12.9" y="2.5" width="5.2" height="25" rx="2.6"/><rect x="12.9" y="2.5" width="5.2" height="25" rx="2.6" transform="rotate(60 15 15)"/><rect x="12.9" y="2.5" width="5.2" height="25" rx="2.6" transform="rotate(120 15 15)"/><circle cx="15" cy="15" r="3.1" class="hole"/></g></svg>
        </span>
        <span class="brand-name">Elera</span>
        <svg class="brand-chev icon" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="collapse-btn" id="collapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M14.5 4v16"/><path d="M8.6 10l-2 2 2 2"/></svg>
      </button>
    </div>

    <nav class="side-nav" id="sideNav">
      <div class="nav-group"><div class="nav-label">Operations</div>
        <button class="nav-item" data-nav="dashboard">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3.5 10.2 12 3.5l8.5 6.7V20a1 1 0 0 1-1 1h-5.2v-6.4H9.7V21H4.5a1 1 0 0 1-1-1z"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item active" data-nav="patientflow">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="M7.2 13.4h2.4l1.5-3.6 1.8 4.4 1.4-2.9h2.5"/></svg>
          <span>Patient Flow</span>
        </button>
        <button class="nav-item" data-nav="scheduling">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="3.5"/><path d="M3.5 9.8h17M8 2.8V6m8-3.2V6"/></svg>
          <span>Scheduling</span><em class="nav-count" id="countScheduling">10</em>
        </button>
        <button class="nav-item" data-nav="message">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 11.8c0 4.3-4 7.7-9 7.7-1 0-2-.1-2.9-.4L4 20.5l1.2-3.6A7.3 7.3 0 0 1 3 11.8c0-4.3 4-7.8 9-7.8s9 3.5 9 7.8z"/></svg>
          <span>Message</span>
        </button>
      </div>

      <div class="nav-group"><div class="nav-label">Clinical AI</div>
        <button class="nav-item" data-nav="eleraai">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><circle cx="9.1" cy="10.4" r=".9" fill="currentColor" stroke="none"/><circle cx="14.9" cy="10.4" r=".9" fill="currentColor" stroke="none"/><path d="M8.6 13.7a4.4 4.4 0 0 0 6.8 0"/></svg>
          <span>Elera AI</span>
        </button>
      </div>

      <div class="nav-group"><div class="nav-label">Clinical</div>
        <button class="nav-item" data-nav="patients">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><circle cx="9.2" cy="10.3" r="2.1"/><path d="M5.8 16.4c.5-1.7 1.9-2.6 3.4-2.6s2.9.9 3.4 2.6M15 9.5h3.4M15 13h3.4"/></svg>
          <span>Patients</span>
        </button>
        <button class="nav-item" data-nav="labs">
          <svg class="icon" viewBox="0 0 24 24"><path d="M10 3.5h4M10.7 3.5v5.2L6.5 17a3.2 3.2 0 0 0 2.9 4.5h5.2a3.2 3.2 0 0 0 2.9-4.5l-4.2-8.3V3.5"/><path d="M8.2 13.5h7.6"/></svg>
          <span>Pharmacy &amp; Labs</span>
        </button>
      </div>

      <div class="nav-group"><div class="nav-label">Revenue</div>
        <button class="nav-item" data-nav="billing">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 3.5h9.5L19 7v13a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V5a1.5 1.5 0 0 1 1-1.5z"/><path d="M14.5 3.5V7H19"/><path d="M12 9.2v6.8M14 10.4c-.5-.8-3.6-1.2-3.6.7s3.7.8 3.7 2.6c0 1.7-3 1.6-3.9.6"/></svg>
          <span>Billing &amp; Claims</span><em class="nav-count">12</em>
        </button>
        <button class="nav-item" data-nav="reports">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M18 2.8l.4 3.4-3.4.4"/><path d="M12.2 8.8v3.6l2.6 1.6"/></svg>
          <span>Reports</span><em class="nav-count">5</em>
        </button>
        <button class="nav-item" data-nav="staff">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8.2" r="3.4"/><path d="M2.8 20c.7-3.3 3.2-5 6.2-5s5.5 1.7 6.2 5"/><circle cx="17" cy="9.4" r="2.6"/><path d="M15.6 14.6c2.9-.4 5.1 1.2 5.6 4.4"/></svg>
          <span>Staff</span>
        </button>
      </div>

      <div class="side-flex"></div>

      <div class="nav-group nav-group--bottom">
        <button class="nav-item" data-nav="pro">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#23231F" stroke="none"/><path d="M12 6.8l1.5 3.1 3.4.5-2.45 2.4.6 3.4L12 14.6l-3.05 1.6.6-3.4L7.1 10.4l3.4-.5z" fill="#fff" stroke="none"/></svg>
          <span>Pro</span>
        </button>
        <button class="nav-item" data-nav="help">
          <svg class="icon" viewBox="0 0 24 24"><path d="M10.3 3.6a2.4 2.4 0 0 1 3.4 0l.7.7a2.4 2.4 0 0 0 1.7.7h1a2.4 2.4 0 0 1 2.4 2.4v1c0 .64.25 1.26.7 1.71l.7.7a2.4 2.4 0 0 1 0 3.4l-.7.7a2.4 2.4 0 0 0-.7 1.7v1a2.4 2.4 0 0 1-2.4 2.4h-1a2.4 2.4 0 0 0-1.7.7l-.7.7a2.4 2.4 0 0 1-3.4 0l-.7-.7a2.4 2.4 0 0 0-1.7-.7h-1a2.4 2.4 0 0 1-2.4-2.4v-1a2.4 2.4 0 0 0-.7-1.7l-.7-.7a2.4 2.4 0 0 1 0-3.4l.7-.7a2.4 2.4 0 0 0 .7-1.7v-1A2.4 2.4 0 0 1 6.9 5h1c.64 0 1.26-.25 1.7-.7z"/><path d="M12 8.6v.01M12 11.6v3.8" stroke-linecap="round"/></svg>
          <span>Help</span>
        </button>
        <button class="nav-item" data-nav="settings">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8l1.1 2.4a7 7 0 0 1 2 .84l2.5-.72 1.86 1.86-.72 2.5c.38.62.66 1.29.84 2l2.42 1.1v2.64l-2.43 1.1a7 7 0 0 1-.83 2l.72 2.5-1.85 1.85-2.5-.72a7 7 0 0 1-2 .84L12 21.2l-1.1-2.41a7 7 0 0 1-2-.84l-2.5.72-1.86-1.85.72-2.5a7 7 0 0 1-.84-2L2 11.2V8.58l2.42-1.1a7 7 0 0 1 .84-2L4.54 3l1.86-1.85 2.5.72a7 7 0 0 1 2-.84z" transform="scale(.92) translate(1 1.4)"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </nav>
  </aside>

  <!-- thin rail shadow when collapsed -->
  <div class="scrim-swap" id="railHint" hidden></div>

  <!-- ══════════════ MAIN ══════════════ -->
  <div class="main">
    <header class="topbar" id="topbar">
      <h1 class="page-title" id="pageTitle">Patient Flow</h1>

      <div class="top-actions">
        <label class="searchbox" id="searchBox" for="globalSearch">
          <input id="globalSearch" type="text" placeholder="Search" autocomplete="off" spellcheck="false">
          <kbd>⌘ K</kbd>
        </label>

        <button class="icon-btn" id="widgetBtn" aria-label="Customize widgets" title="Customize">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3.2" y="3.2" width="7.6" height="7.6" rx="2"/><rect x="13.2" y="3.2" width="7.6" height="7.6" rx="2"/><rect x="3.2" y="13.2" width="7.6" height="7.6" rx="2"/><path d="M17 13.4v6.4M13.8 16.6h6.4"/></svg>
        </button>

        <button class="icon-btn bell-btn" id="bellBtn" aria-label="Notifications" title="Notifications">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 9.5a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6z"/><path d="M10 19.2a2.2 2.2 0 0 0 4 0"/></svg>
          <i class="bell-dot" id="bellDot" hidden></i>
        </button>

        <button class="new-btn" id="newBtn">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          New
        </button>

        <button class="avatar-btn" id="meBtn" aria-label="Account">
          <svg viewBox="0 0 44 44" aria-hidden="true">
            <defs><clipPath id="avclip"><circle cx="22" cy="22" r="22"/></clipPath></defs>
            <g clip-path="url(#avclip)">
              <rect width="44" height="44" fill="#F6BFD0"/>
              <path d="M22 40c-7 0-12.4 2-14.8 4h29.6C34.4 42 29 40 22 40z" fill="#F4602E"/>
              <circle cx="22" cy="19.5" r="8.6" fill="#EDBA93"/>
              <path d="M13.6 17.6c.4-5.2 4-8.4 8.4-8.4s8 3.2 8.4 8.4c-2.4-1.6-5.2-2.3-8.4-2.3s-6 .7-8.4 2.3z" fill="#33261F"/>
              <g fill="none" stroke="#26211C" stroke-width="1.7" stroke-linecap="round">
                <circle cx="17.6" cy="19.6" r="3.4"/><circle cx="26.4" cy="19.6" r="3.4"/><path d="M21 19.2h2"/>
              </g>
              <path d="M22 22.6l-1.3 2h2.6z" fill="#D89A70"/>
            </g>
          </svg>
        </button>
      </div>
    </header>

    <!-- every route renders inside here -->
    <main class="view-host" id="viewHost" tabindex="-1"></main>
  </div>
</div>

<!-- overlays -->
<div class="layer" id="popLayer" hidden></div>     <!-- popovers -->
<div class="modal-layer" id="modalLayer" hidden>   <!-- modals -->
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-slot" id="modalSlot" role="dialog" aria-modal="true"></div>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Patient detail"></aside>
<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<div class="cmdk-layer" id="cmdk" hidden>
  <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="Quick actions">
    <div class="cmdk-inputrow">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="cmdkInput" type="text" placeholder="Search patients or run a command…" autocomplete="off" spellcheck="false">
      <kbd>ESC</kbd>
    </div>
    <div class="cmdk-list" id="cmdkList"></div>
    <div class="cmdk-foot"><span><b>↑↓</b> navigate</span><span><b>↵</b> open</span><span><b>⌘K</b> toggle</span></div>
  </div>
</div>
<div class="drag-ghost" id="dragGhost" hidden></div>
<div class="toast-root" id="toastRoot" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
